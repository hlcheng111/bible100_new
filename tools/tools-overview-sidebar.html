<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具 ▾ 總覽 - 側欄</title>
  <base target="contentFrame">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #eef6ff; font-size: 12px; }
    .sidebar-wrap { padding: 12px; height: 100vh; overflow-y: auto; }
    .sidebar-header { background: linear-gradient(135deg, #0b5fa5, #0d47a1); color: #fff; padding: 14px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
    .sidebar-header h2 { font-size: 1.05rem; margin-bottom: 4px; }
    .sidebar-item { display: block; padding: 8px 12px; margin: 4px 0; background: #fff; border-radius: 6px; color: #333; text-decoration: none; border-left: 3px solid #0b5fa5; font-size: 12px; }
    .sidebar-item:hover { background: #e3f2fd; }
    .sidebar-item.highlight { border-left-color: #e67e22; background: #fff8e1; font-weight: 600; }
  </style>
  <script src="../js/sidebar_shell_target_fallback.js"></script>
  <script src="../js/shell_nav.js"></script>
  <script src="../js/sidebar_behavior.js"></script>
  <script src="../js/b100_site_modules_map.js"></script>
</head>
<body>
  <div class="sidebar-wrap">
    <div class="sidebar-header">
      <h2>🎊 全站模块</h2>
      <p>功能页地图</p>
    </div>
    <a href="../nav_hub/site_modules_sitemap.html" data-b100-nav="content" class="sidebar-item highlight">📋 模块功能总表</a>
    <div id="modLinks"></div>
  </div>
  <script>
    (function () {
      var data = window.B100_SITE_MODULES_MAP || { modules: [] };
      var root = document.getElementById("modLinks");
      (data.modules || []).forEach(function (mod) {
        var det = document.createElement("details");
        det.open = mod.id === "church" || mod.id === "study";
        var sum = document.createElement("summary");
        sum.textContent = (mod.icon || "") + " " + (mod.title || mod.id);
        sum.style.cssText = "cursor:pointer;padding:8px 4px;font-weight:700;color:#0b5fa5;";
        det.appendChild(sum);
        (mod.tries || []).slice(0, 8).forEach(function (t) {
          var a = document.createElement("a");
          a.className = "sidebar-item";
          a.href = "../" + t.path.replace(/^\.\.\//, "");
          a.setAttribute("data-b100-nav", "content");
          a.textContent = t.label;
          det.appendChild(a);
        });
        root.appendChild(det);
      });
    })();
  </script>
</body>
</html>
