<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教會現資訊 - 工具總覽 Dashboard（全站功能總入口）</title>
  <base target="_parent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; font-size: 11px; height: 100vh; display: flex; flex-direction: column; }
    .toc-bar {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: #0b5fa5; color: #fff; position: sticky; top: 0; z-index: 10; flex-shrink: 0;
    }
    .toc-bar a, .toc-bar button {
      padding: 6px 12px; background: rgba(255,255,255,0.2); color: #fff; text-decoration: none; border-radius: 6px; font-size: 11px;
      border: none; cursor: pointer; font-family: inherit;
    }
    .toc-bar a:hover, .toc-bar button:hover { background: rgba(255,255,255,0.35); }
    .toc-bar a.active, .toc-bar button.active { background: #fff; color: #0b5fa5; font-weight: 600; }
    .main-frame-wrap { flex: 1; min-height: 0; padding: 0; }
    .main-frame {
      width: 100%; height: 100%; min-height: 400px; border: none; display: block;
    }
  </style>
</head>
<body>
  <div style="padding:8px 12px;background:linear-gradient(90deg,#e8eaf6 0%,#f3e5f5 100%);border-bottom:1px solid #c5cae9;font-size:10px;line-height:1.5;color:#333;flex-shrink:0;">
    <h1 style="display:inline;font-size:inherit;margin:0;">全站功能總入口</h1> · 左側 <strong>📊 導航與 Dashboard</strong> 可開 <a href="../help/global-tools.htm" style="color:#3949ab;font-weight:600;">📖 全站模組/功能/工具說明（Global Tools）</a>（翻譯／送AI／收藏／模組連結／教會事工 memberId 對齊更新）。
  </div>
  <div class="toc-bar">
    <button type="button" class="active" data-module="people">👥 人員</button>
    <button type="button" data-module="church">⛪ 教會事工</button>
    <button type="button" data-module="school">🏫 學校</button>
    <button type="button" data-module="health">🩺 健康檢查</button>
    <button type="button" data-module="bible">📖 聖經研讀</button>
    <button type="button" data-module="hymn">🎵 詩歌</button>
    <button type="button" data-module="ai">🤖 AI</button>
  </div>

  <div class="main-frame-wrap">
    <iframe id="moduleFrame" class="main-frame" src="../church_ministry/people/people_list.html" title="模組內容"></iframe>
  </div>

  <script>
    (function() {
      var modules = {
        people: '../church_ministry/people/people_list.html',
        church: '../church_ministry/dashboard.html',
        school: '../school_management/dashboard.html',
        health: 'member_id_health_check.html',
        bible: '../bible_study/dashboard.html',
        hymn: '../hymn_management/index_playlist.html',
        ai: '../ai_tools/dashboard.html'
      };
      var frame = document.getElementById('moduleFrame');
      var btns = document.querySelectorAll('.toc-bar button[data-module]');
      btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var key = btn.getAttribute('data-module');
          var url = modules[key];
          if (url && frame) {
            frame.src = url;
            btns.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
          }
        });
      });
    })();
  </script>
</body>
</html>
