<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習反思與回饋表 · AI Lab</title>
  <link rel="stylesheet" href="../assets/css/workbench-rich.css">
  <script src="../assets/js/lab-frame-nav.js"></script>
  <script src="../assets/js/lab-platform-embed.js"></script>
</head>
<body>
  <div class="wb-wrap">
    <nav class="wb-nav">
      <a href="javascript:void(0)" onclick="labNav('functions/ai_lesson_design.html'); return false;">課程設計</a>
      <a href="javascript:void(0)" onclick="labNav('pages/ai_quiz_generator.html'); return false;">測驗生成</a>
    </nav>

    <header class="wb-hero">
      <h1>學習反思與回饋表生成器</h1>
      <p>反思往往比多做十題更能改變生命；此頁提供可複製的 Prompt 範本。</p>
      <div class="wb-badges">
        <span class="wb-badge">自主性</span>
      </div>
    </header>

    <section class="wb-section">
      <h2>🚀 即用 AI（下方一格）</h2>
      <div class="wb-body">
        <p style="font-size:0.88rem;color:#555;">複製下方 Prompt 後，點圖示在格內開啟平台（無法內嵌則新分頁）。</p>
        <div class="lab-pf-icon-row">
          <button type="button" class="lab-pf-icon" title="Kimi" onclick="reflectPf('https://www.kimi.com/','Kimi')">🤖</button>
          <button type="button" class="lab-pf-icon" title="千義" onclick="reflectPf('https://chat.qianyiwen.com','千義通問')">💬</button>
          <button type="button" class="lab-pf-icon" title="Claude" onclick="reflectPf('https://claude.ai/','Claude')">🧠</button>
          <button type="button" class="lab-pf-icon" title="Gemini" onclick="reflectPf('https://gemini.google.com/','Gemini')">💎</button>
        </div>
        <p class="lab-pf-hint">圖示：即用嘗試內嵌 · 若空白請看說明或改選 Kimi／千義</p>
        <div id="reflectPfPh" style="display:none;" class="wb-note"></div>
        <div style="border:2px solid #4caf50;border-radius:8px;overflow:hidden;margin-top:8px;">
          <div id="reflectPfBar" style="background:#2e7d32;color:#fff;padding:8px 12px;font-weight:600;font-size:0.88rem;">預設：Kimi</div>
          <div id="reflectPfHost" style="min-height:420px;height:420px;background:#fafafa;"></div>
        </div>
      </div>
    </section>

    <section class="wb-section">
      <h2>課後反思問題（教師用）</h2>
      <div class="wb-body">
        <textarea class="wb-textarea wb-textarea--readonly" readonly>本課主題／經文：【填寫】
對象：【兒童／青少年／成人】

請設計 6 個課後反思問題：
- 2 題協助「回憶經文內容」
- 2 題連結「個人經驗或情緒」
- 2 題指向「本週一個具體行動或代禱」

每題附一句教師可唸出的引導語。語氣溫和，避免罪惡感操控。</textarea>
      </div>
    </section>

    <section class="wb-section">
      <h2>小組回饋表（簡短）</h2>
      <div class="wb-body">
        <textarea class="wb-textarea wb-textarea--readonly" readonly>請產出一張「小組查經回饋表」Markdown 表格，欄位包含：
組員可匿名、今日經文、一句收穫、一個疑問、一句代禱、組長備註。
適合 45 分鐘小組，留白可手寫。</textarea>
      </div>
    </section>

    <section class="wb-section">
      <h2>給家長的一句話（兒童主日學）</h2>
      <div class="wb-body">
        <textarea class="wb-textarea wb-textarea--readonly" readonly>本課兒童主日學主題：【填寫】
請寫「給家長的一句話」：本課重點 + 在家可延續的一句對話或禱告；措辭避免讓家長產生不必要的罪惡感。</textarea>
        <p class="wb-note">與 <a href="javascript:void(0)" onclick="labNav('functions/ai_lesson_design.html'); return false;">課程設計助手</a> 內「加強句」可併用。</p>
      </div>
    </section>
  </div>
  <script>
    function reflectPf(url, name) {
      if (typeof labEmbedPlatform === 'function') {
        labEmbedPlatform({
          containerId: 'reflectPfHost',
          barId: 'reflectPfBar',
          placeholderId: 'reflectPfPh',
          url: url,
          name: name,
          height: '420px'
        });
      }
    }
    document.addEventListener('DOMContentLoaded', function () {
      reflectPf('https://www.kimi.com/', 'Kimi');
    });
  </script>
</body>
</html>
