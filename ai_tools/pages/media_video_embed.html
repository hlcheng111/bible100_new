對象：【兒童／青少年／成人】
總長度：【例如 60–90 秒，分 4 個鏡頭】

請輸出：
1) 分鏡表（鏡號、畫面描述、旁白一句、字幕關鍵字）
2) 每鏡約幾秒
3) 避免不適當或違反教會界線的畫面描述（請自我檢查並列出注意事項）

提醒：實際生成請使用你選定的影片 AI 平台；本站僅協助腳本。</textarea>
