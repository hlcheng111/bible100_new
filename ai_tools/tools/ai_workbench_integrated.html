<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 备课工作台 · 4 Tab | AI Lab</title>
  <link rel="stylesheet" href="../css/ai_workbench_shell.css" />
  <link rel="stylesheet" href="../../church_ministry/css/cm_responsive_tokens.css" />
  <script src="../../js/shell_nav.js"></script>
  <script src="../../js/b100_prompt_guardrails.js"></script>
  <script src="../../js/b100_lesson_card.js"></script>
  <script src="../../js/ai_prompt_templates_embedded.js"></script>
  <script src="../../js/ai_scenario_ssot.js?v=20260814lesson"></script>
  <script src="../../js/ai_prompt_presets_store.js"></script>
  <script src="../../js/ai_ministry_bridge.js"></script>
</head>
<body data-b100-module="ai_tools" data-b100-pattern="P-AI-WORKBENCH" data-b100-ai-hint="teach_prompt">
<script src="../js/ai_collab_page_hint.js"></script>
  <header class="ai-wb-header" style="border-radius:0;margin:0;">
    <h1>✍️ AI 备课工作台 · 4 Tab</h1>
    <p>百步課次帶入 Prompt → 复制 → 外部 AI 草稿 → 人审 · 无 API key</p>
  </header>
  <nav class="ai-shell-tabs" aria-label="AI 工作台 Tab">
    <button type="button" class="ai-shell-tab active cm-touch-target" data-tab="prompt">① Prompt</button>
    <button type="button" class="ai-shell-tab cm-touch-target" data-tab="guide">② 导读</button>
    <button type="button" class="ai-shell-tab cm-touch-target" data-tab="quiz">③ 测验</button>
    <button type="button" class="ai-shell-tab cm-touch-target" data-tab="serve">④ 事工/CRM</button>
  </nav>
  <div id="ai-panel-prompt" class="ai-shell-panel">
    <div class="ai-wb-wrap">
      <p class="muted" style="margin:0 0 10px;"><strong>先选任务（小白入口）</strong> — 從課文點進來會自動帶入課次</p>
      <div id="ai-wb-lesson-bar" class="ai-wb-card" style="background:#f0fdf4;border-color:#86efac;"></div>
      <div id="ai-wb-scenarios" class="ai-wb-scenarios"></div>
      <div id="ai-wb-step-hint" class="ai-wb-steps"></div>
      <div class="ai-wb-card">
        <label for="ai-wb-custom">或描述你的需求（自由输入）</label>
        <textarea id="ai-wb-custom" rows="3" placeholder="例：帮我写成人查经讨论三问…"></textarea>
        <div class="ai-wb-actions">
          <button type="button" id="ai-wb-custom-generate" class="ai-wb-btn cm-touch-target">生成 Prompt</button>
        </div>
      </div>
      <div class="ai-wb-card">
        <label>圣经主题模板（进阶）</label>
        <select id="ai-wb-theme"><option value="">— 选择主题 —</option></select>
        <select id="ai-wb-type" style="margin-top:8px;"><option value="">— 选择类型 —</option></select>
        <div class="ai-wb-actions">
          <button type="button" id="ai-wb-generate" class="ai-wb-btn outline cm-touch-target">从模板生成</button>
        </div>
      </div>
      <div class="ai-wb-card">
        <label>生成结果（含 B100 护栏）</label>
        <div id="ai-wb-result" class="ai-wb-result">点上方情境或生成按钮…</div>
        <div class="ai-wb-actions">
          <button type="button" id="ai-wb-copy" class="ai-wb-btn cm-touch-target">📋 复制 Prompt</button>
          <button type="button" id="ai-wb-save-preset" class="ai-wb-btn outline cm-touch-target">💾 储存我的常用范本</button>
        </div>
        <p class="muted">复制后，点下方平台（会自动复制并开新分页）：</p>
        <div id="ai-wb-platforms" class="ai-wb-platforms"></div>
      </div>
      <div id="ai-wb-bridge"></div>
      <div class="ai-wb-card">
        <label>我的常用范本</label>
        <div id="ai-wb-presets"></div>
      </div>
    </div>
  </div>
  <iframe id="ai-integrated-subframe" class="ai-shell-frame" title="AI 子工作区" hidden></iframe>
  <div id="ai-wb-toast" hidden role="status"></div>
  <script src="../js/ai_draft_guard.js"></script>
  <script src="../js/ai_prompt_workbench.js"></script>
  <script src="../js/ai_workbench_shell.js"></script>
</body>
</html>
