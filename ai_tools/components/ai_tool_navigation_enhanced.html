<script>
// 工具導航配置
const aiTools = [
    { key: 'image', name: '文轉圖', url: '../pages/ai_text_to_image.html' },
    { key: 'speech', name: '文轉音', url: '../pages/ai_text_to_speech.html' },
    { key: 'music', name: '文轉樂', url: '../pages/ai_text_to_music.html' },
    { key: 'video', name: '文轉影', url: '../tools/ai_text_to_video.html' },
    { key: 'lesson', name: '課程設計', url: '../functions/ai_lesson_design.html' },
    { key: 'quiz', name: '測驗生成', url: '../pages/ai_quiz_generator.html' },
    { key: 'homework', name: '作業助手', url: '../functions/ai_ask_homework_new.html' },
    { key: 'media', name: '多媒體', url: '../tools/ai_media_embed_new.html' }
];

// 獲取當前工具索引
function getCurrentToolIndex() {
    const currentPath = window.location.pathname;
    const currentFile = currentPath.split('/').pop();
    
    for (let i = 0; i < aiTools.length; i++) {
        if (aiTools[i].url.includes(currentFile)) {
            return i;
        }
    }
    return 0;
}

// 更新導航狀態
function updateNavigationState() {
    const currentIndex = getCurrentToolIndex();
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const currentToolIndex = document.getElementById('currentToolIndex');
    const totalTools = document.getElementById('totalTools');
    const progressFill = document.getElementById('progressFill');
    
    // 更新按鈕狀態
    prevButton.disabled = currentIndex === 0;
    nextButton.disabled = currentIndex === aiTools.length - 1;
    
    // 更新指示器
    currentToolIndex.textContent = currentIndex + 1;
    totalTools.textContent = aiTools.length;
    
    // 更新進度條
    const progress = ((currentIndex + 1) / aiTools.length) * 100;
    progressFill.style.width = progress + '%';
    
    // 更新工具鏈接狀態
    document.querySelectorAll('.tool-link').forEach(link => {
        link.classList.remove('active');
    });
    
    const currentToolLink = document.querySelector(`[data-tool="${aiTools[currentIndex].key}"]`);
    if (currentToolLink) {
        currentToolLink.classList.add('active');
    }
}

// 導航到上一頁
function navigateToPrevious() {
    const currentIndex = getCurrentToolIndex();
    if (currentIndex > 0) {
        const prevTool = aiTools[currentIndex - 1];
        window.location.href = prevTool.url;
    }
}

// 導航到下一頁
function navigateToNext() {
    const currentIndex = getCurrentToolIndex();
    if (currentIndex < aiTools.length - 1) {
        const nextTool = aiTools[currentIndex + 1];
        window.location.href = nextTool.url;
    }
}

// 鍵盤導航支持
document.addEventListener('keydown', function(event) {
    if (event.altKey) {
        if (event.key === 'ArrowLeft') {
            event.preventDefault();
            navigateToPrevious();
        } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            navigateToNext();
        }
    }
});

// 頁面載入時更新導航狀態
document.addEventListener('DOMContentLoaded', function() {
    updateNavigationState();
    
    // 添加工具提示
    document.querySelectorAll('.tool-link').forEach(link => {
        link.title = `Alt + ← 上一頁 | Alt + → 下一頁`;
    });
    
    document.getElementById('prevButton').title = 'Alt + ← 上一頁';
    document.getElementById('nextButton').title = 'Alt + → 下一頁';
});
</script>
