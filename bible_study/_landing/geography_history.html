<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理歷史 · 三扇門</title>
    <link rel="stylesheet" href="../css/landing_dashboard_standard.css">
    <link rel="stylesheet" href="../../css/b100_landing_shell.css?v=20260807b">
    <script src="../../js/shell_nav.js"></script>
    <script src="../../js/b100_hub_embed.js?v=20260805f"></script>
    <script src="../../js/b100_site_path.js?v=20260807a"></script>
    <script src="../../js/b100_module_nav_ssot.js?v=20260807a"></script>
    <script src="../../js/b100_module_landing_registry.js?v=20260807a"></script>
    <script src="../../js/b100_landing_shell.js?v=20260807b"></script>
    <script src="../../js/b100_nav_ssot.js?v=20260807a"></script>
    <style>
        body { margin: 0; background: #f7f4ee; color: #1a1208; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
        .wrap { max-width: 40rem; margin: 0 auto; padding: 8px 16px 40px; }
        .page-header h1 { font-size: 22px; margin: 0 0 6px; color: #0b5fa5; }
        .page-header p { margin: 0 0 16px; font-size: 15px; color: #5a3d12; line-height: 1.5; }
        .doors { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .door {
            display: block; text-decoration: none; color: inherit;
            background: #fff; border: 1px solid #e2d9c8; border-radius: 0 10px 10px 0;
            border-left: 5px solid #0b5fa5; padding: 14px 16px;
            transition: background 0.15s, border-color 0.15s;
        }
        .door:hover { background: #f0f7ff; border-color: #2aa5ff; }
        .door.d-place { border-left-color: #2e7d32; }
        .door.d-map { border-left-color: #1565c0; }
        .door.d-timeline { border-left-color: #8b6914; }
        .door .num { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 4px; }
        .door h2 { font-size: 18px; margin: 0 0 6px; color: #1a1208; }
        .door p { margin: 0 0 10px; font-size: 13px; color: #555; line-height: 1.5; }
        .door .cta {
            display: inline-block; padding: 8px 14px; border-radius: 6px;
            background: #0b5fa5; color: #fff; font-size: 14px; font-weight: 600;
        }
        .door:hover .cta { background: #094a80; }
        .door-more {
            margin-top: 8px; font-size: 12px;
        }
        .door-more a {
            display: inline-block; margin: 4px 8px 0 0; color: #0b5fa5;
            text-decoration: none; font-size: 12px;
        }
        .door-more a:hover { text-decoration: underline; }
        .more-box {
            background: #fff; border: 1px solid #e2d9c8; border-radius: 8px;
            padding: 0; margin-top: 8px; overflow: hidden;
        }
        .more-box summary {
            padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
            color: #334155; list-style: none; background: #faf8f3;
        }
        .more-box summary::-webkit-details-marker { display: none; }
        .more-box .body { padding: 8px 14px 14px; border-top: 1px solid #eee; }
        .more-box .cat { margin: 10px 0 4px; font-size: 13px; color: #0b5fa5; font-weight: 600; }
        .more-box a {
            display: block; padding: 7px 10px; margin: 3px 0; font-size: 12px;
            color: #333; text-decoration: none; border-radius: 4px;
            border: 1px solid #e0e0e0; background: #fafafa;
        }
        .more-box a:hover { background: #e3f2fd; border-color: #2aa5ff; color: #0b5fa5; }
        .hint {
            font-size: 12px; color: #64748b; margin-top: 16px; line-height: 1.5;
        }
        .door-block:target .door { outline: 2px solid #c9a227; outline-offset: 2px; }
        .door-block .door-more { margin: 4px 0 0 8px; }
    </style>
</head>
<body data-b100-module-mode="study" data-b100-landing-zone="geo">
    <div id="b100-landing-shell-top"></div>
    <div class="wrap">
        <div class="page-header">
            <h1>🗺️ 地理歷史</h1>
            <p>先選一件你現在想搞懂的事。地圖與時間軸在右欄打開；聖光地名多半會新分頁。</p>
        </div>

        <div class="doors" id="doors-root"></div>

        <details class="more-box" id="more-root">
            <summary>更多外站（影音／考古）</summary>
            <div class="body" id="more-body"></div>
        </details>

        <p class="hint">連結清單在 <code>_landing/geography_history_data.js</code>。不自建地圖引擎，只用可信外站。</p>
    </div>

    <script src="geography_history_data.js"></script>
    <script>
        (function () {
            var data = window.GEOGRAPHY_HISTORY_DATA;
            var doorsRoot = document.getElementById("doors-root");
            var moreBody = document.getElementById("more-body");
            if (!data || !data.categories) {
                doorsRoot.innerHTML = '<p style="color:#c00;">無法載入配置，請確認 geography_history_data.js 存在。</p>';
                return;
            }
            var linkAttrs = window.GEOGRAPHY_HISTORY_linkAttrs || function () {
                return { href: "#", nav: "", rel: "", suffix: "" };
            };
            var byDoor = {};
            var moreCats = [];
            data.categories.forEach(function (cat) {
                if (cat.more || !cat.door) {
                    moreCats.push(cat);
                    return;
                }
                byDoor[cat.door] = cat;
            });
            var doorMeta = data.doors || [];
            var order = ["place", "map", "timeline"];
            var html = "";
            order.forEach(function (id, idx) {
                var meta = null;
                for (var i = 0; i < doorMeta.length; i++) {
                    if (doorMeta[i].id === id) { meta = doorMeta[i]; break; }
                }
                var cat = byDoor[id];
                if (!meta || !cat || !(cat.links || []).length) return;
                var primary = cat.links[0];
                var a = linkAttrs(primary, { pathPrefix: "../" });
                var extra = "";
                if (cat.links.length > 1) {
                    extra = '<div class="door-more">其他：';
                    cat.links.slice(1).forEach(function (link) {
                        var b = linkAttrs(link, { pathPrefix: "../" });
                        extra += '<a href="' + b.href + '"' + b.nav + b.rel + ">" + (link.label || "連結") + b.suffix + "</a>";
                    });
                    extra += "</div>";
                }
                html +=
                    '<div class="door-block" id="door-' + id + '">' +
                    '<a class="door d-' + id + '" href="' + a.href + '"' + a.nav + a.rel + ">" +
                    '<div class="num">第 ' + (idx + 1) + " 扇門</div>" +
                    "<h2>" + meta.title + "</h2>" +
                    "<p>" + meta.desc + "</p>" +
                    '<span class="cta">' + (meta.cta || "打開") + "</span>" +
                    "</a>" +
                    extra +
                    "</div>";
            });
            doorsRoot.innerHTML = html;

            var moreHtml = "";
            moreCats.forEach(function (cat) {
                var links = (cat.links || []).filter(function (l) { return l.sidebar !== false; });
                if (!links.length) return;
                moreHtml += '<div class="cat">' + (cat.icon ? cat.icon + " " : "") + (cat.nameZh || cat.id) + "</div>";
                links.forEach(function (link) {
                    var a = linkAttrs(link, { pathPrefix: "../" });
                    moreHtml += '<a href="' + a.href + '"' + a.nav + a.rel + ">" + (link.label || "連結") + a.suffix + "</a>";
                });
            });
            moreBody.innerHTML = moreHtml || "<p style='font-size:12px;color:#888;'>暫無其他連結。</p>";

            if (location.hash && location.hash.indexOf("#door-") === 0) {
                var el = document.querySelector(location.hash);
                if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
            }
        })();
    </script>
</body>
</html>
