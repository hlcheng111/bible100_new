<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/b100_landing_shell.css?v=20260807b">
    <script src="../../js/shell_nav.js"></script>
    <script src="../../js/b100_hub_embed.js?v=20260805f"></script>
    <script src="../../js/b100_site_path.js?v=20260807a"></script>

    <script src="../../js/b100_module_landing_registry.js?v=20260807a"></script>
    <script src="../../js/b100_landing_shell.js?v=20260807b"></script>
  <script src="../../js/b100_site_path.js?v=20260807a"></script>
  <script src="../../js/b100_nav_ssot.js?v=20260807a"></script>
    <style>
        .category-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .category-card summary {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #0b5fa5;
            background: #f8f9fa;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .category-card summary::-webkit-details-marker { display: none; }
        .category-card summary::after {
            content: '▶';
            font-size: 10px;
            color: #666;
            transition: transform 0.2s;
        }
        .category-card[open] summary::after {
            transform: rotate(90deg);
        }
        .category-card summary:hover {
            background: #e8f5e9;
        }
        .link-list {
            padding: 8px 16px 16px;
            border-top: 1px solid #eee;
        }
        .link-list a {
            display: block;
            padding: 8px 12px;
            margin: 4px 0;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
        }
        .link-list a:hover {
            background: #e3f2fd;
            border-color: #2aa5ff;
            color: #0b5fa5;
        }
        .link-list a.local {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .edit-hint {
            font-size: 10px;
            color: #999;
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
    </style>
</head>
<body data-b100-module-mode="study" data-b100-landing-zone="geo">
    <div id="b100-landing-shell-top"></div>
    <div class="top-nav">
        <a href="../index.html" class="nav-item">🏠 主頁</a>
        <span class="separator">|</span>
        <a href="versions.html" target="contentFrame" class="nav-item">📖 版本中心</a>
        <span class="separator">|</span>
        <a href="tools.html" target="contentFrame" class="nav-item">🔧 工具</a>
    </div>

    <div class="page-header">
        <h1>🗺️ Geo &amp; History</h1>
        <p class="description">Timeline · Place · Map — iframe 可用外站（已剔除 YouTube／空頁／超時站）</p>
    </div>

    <div class="info-bar success">
        <strong>💡 使用方式：</strong> 点类别展开 → 点链接；可嵌入站点在右栏打开，YouTube 等 ↗ 新分页。
    </div>

    <div id="categories-root"></div>

    <div class="edit-hint">
        <strong>📝 增減連結：</strong> 編輯 <code>_landing/geography_history_data.js</code> 即可，無需改動本頁。
    </div>

    <script src="geography_history_data.js"></script>
    <script>
        (function() {
            var data = window.GEOGRAPHY_HISTORY_DATA;
            if (!data || !data.categories) {
                document.getElementById('categories-root').innerHTML = '<p style="color:#c00;">無法載入配置，請確認 geography_history_data.js 存在。</p>';
                return;
            }
            function linkLabel(link) {
                return link.label || link.name || 'Link';
            }
            var linkAttrs = window.GEOGRAPHY_HISTORY_linkAttrs || function () { return { href: '#', nav: '', rel: '', suffix: '' }; };
            var html = '';
            data.categories.forEach(function(cat) {
                if (cat.sidebar === false) return;
                var links = (cat.links || []).filter(function (link) { return link.sidebar !== false; });
                if (!links.length) return;
                html += '<div class="category-card"><details>';
                var catTitle = (cat.icon ? cat.icon + ' ' : '') + (cat.nameZh || cat.name || cat.id || '');
                if (cat.nameEn) {
                    catTitle += ' <small style="color:#666;font-size:11px;">' + cat.nameEn + '</small>';
                }
                html += '<summary>' + catTitle + '</summary>';
                html += '<div class="link-list">';
                links.forEach(function(link) {
                    var a = linkAttrs(link, { pathPrefix: '../' });
                    var cls = link.local ? ' class="local"' : '';
                    html += '<a href="' + a.href + '"' + a.nav + a.rel + cls + '>' + linkLabel(link) + a.suffix + '</a>';
                });
                html += '</div></details></div>';
            });
            document.getElementById('categories-root').innerHTML = html;
        })();
    </script>
</body>
</html>
