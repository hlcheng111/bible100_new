<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經串珠（交叉引用）工具</title>
    <link rel="stylesheet" href="css/landing_dashboard_standard.css">
    <style>
        .input-group {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
        }
        select, input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #27ae60;
        }
        .search-btn {
            padding: 10px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-btn:hover {
            background: #229954;
        }
        .source-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .source-btn {
            padding: 8px 16px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .source-btn.active {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        .result-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .crossref-item {
            padding: 12px;
            border-left: 4px solid #3498db;
            background: #ecf5ff;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .crossref-item a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        .crossref-item a:hover {
            text-decoration: underline;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div style="padding:10px 20px;"><a href="index.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回聖經研讀中心</a></div>
    <div class="page-header">
        <h1>
            🔗 聖經串珠工具
            <small class="multi-lang">
                <a href="#" onclick="translatePage('en'); return false;">Bible Cross References</a> / 
                <a href="#" onclick="translatePage('vi'); return false;">Tham Chiếu Chéo</a> / 
                <a href="#" onclick="translatePage('id'); return false;">Referensi Silang</a>
            </small>
        </h1>
        <p class="description">
            查詢相關經文、發現聖經內在聯繫
        </p>
    </div>

    <div class="info-bar success">
        <strong>💡 使用提示：</strong>
        選擇書卷、章、節，系統將顯示該節經文的所有相關經文引用。支持信望愛串珠、和合本串珠等多種資源。
    </div>

    <div class="input-group">
        <h3 style="color: #27ae60; margin: 0 0 15px 0; font-size: 16px;">選擇串珠資源</h3>
        <div class="source-selector">
            <button class="source-btn active" data-source="faith_crossref" onclick="selectSource(this, 'faith_crossref')">
                信望愛串珠
            </button>
            <button class="source-btn" data-source="cuv_crossref" onclick="selectSource(this, 'cuv_crossref')">
                和合本串珠
            </button>
        </div>

        <h3 style="color: #27ae60; margin: 15px 0; font-size: 16px;">輸入經文位置</h3>
        <div class="input-row">
            <select id="bookSelect" onchange="updateChapters()">
                <option value="">選擇書卷...</option>
                <option value="創世記">創世記</option>
                <option value="出埃及記">出埃及記</option>
                <option value="利未記">利未記</option>
                <option value="民數記">民數記</option>
                <option value="申命記">申命記</option>
                <option value="約書亞記">約書亞記</option>
                <option value="士師記">士師記</option>
                <option value="路得記">路得記</option>
                <option value="撒母耳記上">撒母耳記上</option>
                <option value="撒母耳記下">撒母耳記下</option>
                <option value="列王紀上">列王紀上</option>
                <option value="列王紀下">列王紀下</option>
                <option value="歷代志上">歷代志上</option>
                <option value="歷代志下">歷代志下</option>
                <option value="以斯拉記">以斯拉記</option>
                <option value="尼希米記">尼希米記</option>
                <option value="以斯帖記">以斯帖記</option>
                <option value="約伯記">約伯記</option>
                <option value="詩篇">詩篇</option>
                <option value="箴言">箴言</option>
                <option value="傳道書">傳道書</option>
                <option value="雅歌">雅歌</option>
                <option value="以賽亞書">以賽亞書</option>
                <option value="耶利米書">耶利米書</option>
                <option value="耶利米哀歌">耶利米哀歌</option>
                <option value="以西結書">以西結書</option>
                <option value="但以理書">但以理書</option>
                <option value="何西阿書">何西阿書</option>
                <option value="約珥書">約珥書</option>
                <option value="阿摩司書">阿摩司書</option>
                <option value="俄巴底亞書">俄巴底亞書</option>
                <option value="約拿書">約拿書</option>
                <option value="彌迦書">彌迦書</option>
                <option value="那鴻書">那鴻書</option>
                <option value="哈巴谷書">哈巴谷書</option>
                <option value="西番雅書">西番雅書</option>
                <option value="哈該書">哈該書</option>
                <option value="撒迦利亞書">撒迦利亞書</option>
                <option value="瑪拉基書">瑪拉基書</option>
                <option value="馬太福音">馬太福音</option>
                <option value="馬可福音">馬可福音</option>
                <option value="路加福音">路加福音</option>
                <option value="約翰福音">約翰福音</option>
                <option value="使徒行傳">使徒行傳</option>
                <option value="羅馬書">羅馬書</option>
                <option value="哥林多前書">哥林多前書</option>
                <option value="哥林多後書">哥林多後書</option>
                <option value="加拉太書">加拉太書</option>
                <option value="以弗所書">以弗所書</option>
                <option value="腓立比書">腓立比書</option>
                <option value="歌羅西書">歌羅西書</option>
                <option value="帖撒羅尼迦前書">帖撒羅尼迦前書</option>
                <option value="帖撒羅尼迦後書">帖撒羅尼迦後書</option>
                <option value="提摩太前書">提摩太前書</option>
                <option value="提摩太後書">提摩太後書</option>
                <option value="提多書">提多書</option>
                <option value="腓利門書">腓利門書</option>
                <option value="希伯來書">希伯來書</option>
                <option value="雅各書">雅各書</option>
                <option value="彼得前書">彼得前書</option>
                <option value="彼得後書">彼得後書</option>
                <option value="約翰一書">約翰一書</option>
                <option value="約翰二書">約翰二書</option>
                <option value="約翰三書">約翰三書</option>
                <option value="猶大書">猶大書</option>
                <option value="啟示錄">啟示錄</option>
            </select>
            <select id="chapterSelect" onchange="updateVerses()">
                <option value="">選擇章...</option>
            </select>
            <select id="verseSelect">
                <option value="">選擇節...</option>
            </select>
            <button class="search-btn" onclick="searchCrossRef()">🔍 查詢</button>
        </div>
    </div>

    <div class="result-container" id="resultContainer">
        <div class="empty-state">
            <div class="empty-state-icon">🔗</div>
            <h3>請選擇經文位置開始查詢</h3>
            <p>系統將顯示該節經文的所有相關引用</p>
        </div>
    </div>

    <script src="../data/bibles/crossref_data_faith_crossref.js" charset="UTF-8"></script>
    <script src="../data/bibles/crossref_data_cuv_crossref.js" charset="UTF-8"></script>
    <script src="js/dev_http_hint.js"></script>
    <script src="js/bible_version_registry.js"></script>
    <script src="js/BibleEngine.js"></script>
    <script src="js/bs_registry_reader.js"></script>
    <script>
        let currentSource = 'faith_crossref';
        let crossrefReady = false;

        const BOOK_CHAPTERS = { 創世記:50,出埃及記:40,利未記:27,民數記:36,申命記:34,約書亞記:24,士師記:21,路得記:4,撒母耳記上:31,撒母耳記下:24,列王紀上:22,列王紀下:25,歷代志上:29,歷代志下:36,以斯拉記:10,尼希米記:13,以斯帖記:10,約伯記:42,詩篇:150,箴言:31,傳道書:12,雅歌:8,以賽亞書:66,耶利米書:52,耶利米哀歌:5,以西結書:48,但以理書:12,何西阿書:14,約珥書:3,阿摩司書:9,俄巴底亞書:1,約拿書:4,彌迦書:7,那鴻書:3,哈巴谷書:3,西番雅書:3,哈該書:2,撒迦利亞書:14,瑪拉基書:4,馬太福音:28,馬可福音:16,路加福音:24,約翰福音:21,使徒行傳:28,羅馬書:16,哥林多前書:16,哥林多後書:13,加拉太書:6,以弗所書:6,腓立比書:4,歌羅西書:4,帖撒羅尼迦前書:5,帖撒羅尼迦後書:3,提摩太前書:6,提摩太後書:4,提多書:3,腓利門書:1,希伯來書:13,雅各書:5,彼得前書:5,彼得後書:3,約翰一書:5,約翰二書:1,約翰三書:1,猶大書:1,啟示錄:22 };

        const BOOK_NAME_TO_ID = { 創世記:1,出埃及記:2,利未記:3,民數記:4,申命記:5,約書亞記:6,士師記:7,路得記:8,撒母耳記上:9,撒母耳記下:10,列王紀上:11,列王紀下:12,歷代志上:13,歷代志下:14,以斯拉記:15,尼希米記:16,以斯帖記:17,約伯記:18,詩篇:19,箴言:20,傳道書:21,雅歌:22,以賽亞書:23,耶利米書:24,耶利米哀歌:25,以西結書:26,但以理書:27,何西阿書:28,約珥書:29,阿摩司書:30,俄巴底亞書:31,約拿書:32,彌迦書:33,那鴻書:34,哈巴谷書:35,西番雅書:36,哈該書:37,撒迦利亞書:38,瑪拉基書:39,馬太福音:40,馬可福音:41,路加福音:42,約翰福音:43,使徒行傳:44,羅馬書:45,哥林多前書:46,哥林多後書:47,加拉太書:48,以弗所書:49,腓立比書:50,歌羅西書:51,帖撒羅尼迦前書:52,帖撒羅尼迦後書:53,提摩太前書:54,提摩太後書:55,提多書:56,腓利門書:57,希伯來書:58,雅各書:59,彼得前書:60,彼得後書:61,約翰一書:62,約翰二書:63,約翰三書:64,猶大書:65,啟示錄:66 };

        async function loadCrossRef(source) {
            try {
                await BS_loadRegistryResource('crossrefs', source);
                crossrefReady = true;
            } catch (error) {
                console.error('❌ 串珠資料載入失敗:', error);
                crossrefReady = false;
                showError('串珠資料載入失敗。' + (typeof BS_readerLoadHint === 'function' ? BS_readerLoadHint() : ''));
            }
        }

        function selectSource(btn, source) {
            document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSource = source;
            crossrefReady = false;
            loadCrossRef(source);
        }

        // 更新章選項
        function updateChapters() {
            const book = document.getElementById('bookSelect').value;
            const chapterSelect = document.getElementById('chapterSelect');
            chapterSelect.innerHTML = '<option value="">選擇章...</option>';
            
            if (book) {
                const chapters = BOOK_CHAPTERS[book] || 50;
                
                for (let i = 1; i <= chapters; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `第 ${i} 章`;
                    chapterSelect.appendChild(option);
                }
            }
        }

        // 更新節選項
        function updateVerses() {
            const verseSelect = document.getElementById('verseSelect');
            verseSelect.innerHTML = '<option value="">選擇節...</option>';
            
            // 預設提供1-50節
            for (let i = 1; i <= 50; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `第 ${i} 節`;
                verseSelect.appendChild(option);
            }
        }

        async function searchCrossRef() {
            const book = document.getElementById('bookSelect').value;
            const chapter = document.getElementById('chapterSelect').value;
            const verse = document.getElementById('verseSelect').value;

            if (!book || !chapter || !verse) {
                alert('請選擇完整的經文位置（書卷、章、節）');
                return;
            }

            if (!crossrefReady) {
                showError('串珠資料尚未載入，請稍候…');
                await loadCrossRef(currentSource);
                if (!crossrefReady) return;
            }

            const reference = `${book} ${chapter}:${verse}`;
            const bookId = BOOK_NAME_TO_ID[book];
            const container = document.getElementById('resultContainer');
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><h3>查詢中…</h3></div>';
            try {
                const results = await BibleEngine.queryCrossRef(currentSource, bookId, chapter, verse);
                displayCrossRefResults(results, reference);
            } catch (err) {
                showError('查詢失敗：' + (err.message || err));
            }
        }

        function displayCrossRefResults(results, reference) {
            const container = document.getElementById('resultContainer');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>沒有找到「${reference}」的串珠引用</h3>
                        <p>此經文可能沒有相關的交叉引用記錄</p>
                    </div>
                `;
                return;
            }

            let html = `
                <h3 style="color: #27ae60; margin-bottom: 15px;">
                    ${reference} 的相關引用 (共 ${results.length} 處)
                </h3>
            `;
            
            results.forEach(ref => {
                html += `
                    <div class="crossref-item">
                        <a href="#" onclick="jumpToVerse(${JSON.stringify(String(ref))}); return false;">
                            📖 ${String(ref).replace(/&/g, '&amp;').replace(/</g, '&lt;')}
                        </a>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function jumpToVerse(reference) {
            var q = 'search_reader.html?q=' + encodeURIComponent(reference);
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'navigate', url: q }, '*');
                    return;
                }
            } catch (e) {}
            window.location.href = q;
        }

        // 顯示錯誤
        function showError(message) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h3>載入錯誤</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // 多語言翻譯
        function translatePage(targetLang) {
            const langMap = {
                'en': { code: 'en', name: '英文' },
                'vi': { code: 'vi', name: '越南文' },
                'id': { code: 'id', name: '印尼文' }
            };
            
            const lang = langMap[targetLang];
            if (!lang) return;
            
            const currentURL = encodeURIComponent(window.location.href);
            const translateURL = `https://translate.google.com/translate?sl=zh-TW&tl=${lang.code}&u=${currentURL}`;
            
            if (confirm(`即將使用 Google 翻譯將本頁翻譯為${lang.name}。\n\n繼續？`)) {
                window.open(translateURL, '_blank');
            }
        }

        // 頁面載入
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ 串珠工具已載入');
            loadCrossRef('faith_crossref');
        });
    </script>
</body>
</html>
