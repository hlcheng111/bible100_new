    <script>
        // 版本檢查：每次載入加時間戳，使 URL 唯一，避免快取（F5 不需 Ctrl+Shift+R）
        (function(){
            var BUILD = '20250313c';
            var u = new URL(location.href);
            var cb = u.searchParams.get('_cb') || '';
            var m = cb.match(/^20250313c-(\d+)$/);
            var ts = m ? parseInt(m[1], 10) : 0;
            var now = Date.now();
            if (!m || (now - ts) > 2000) {
                u.searchParams.set('_cb', BUILD + '-' + now);
                location.replace(u.pathname + u.search + u.hash);
                return;
            }
        })();
        // 聖經書卷數據
        const bibleBooks = {
            books: [
                "創世記", "出埃及記", "利未記", "民數記", "申命記",
                "約書亞記", "士師記", "路得記", "撒母耳記上", "撒母耳記下",
                "列王紀上", "列王紀下", "歷代志上", "歷代志下", "以斯拉記",
                "尼希米記", "以斯帖記", "約伯記", "詩篇", "箴言",
                "傳道書", "雅歌", "以賽亞書", "耶利米書", "耶利米哀歌",
                "以西結書", "但以理書", "何西阿書", "約珥書", "阿摩司書",
                "俄巴底亞書", "約拿書", "彌迦書", "那鴻書", "哈巴谷書",
                "西番雅書", "哈該書", "撒迦利亞書", "瑪拉基書", "馬太福音",
                "馬可福音", "路加福音", "約翰福音", "使徒行傳", "羅馬書",
                "哥林多前書", "哥林多後書", "加拉太書", "以弗所書", "腓立比書",
                "歌羅西書", "帖撒羅尼迦前書", "帖撒羅尼迦後書", "提摩太前書", "提摩太後書",
                "提多書", "腓利門書", "希伯來書", "雅各書", "彼得前書",
                "彼得後書", "約翰一書", "約翰二書", "約翰三書", "猶大書", "啟示錄"
            ],
            categories: {
                "舊約律法書": ["創世記", "出埃及記", "利未記", "民數記", "申命記"],
                "舊約歷史書": ["約書亞記", "士師記", "路得記", "撒母耳記上", "撒母耳記下", "列王紀上", "列王紀下", "歷代志上", "歷代志下", "以斯拉記", "尼希米記", "以斯帖記"],
                "舊約智慧書": ["約伯記", "詩篇", "箴言", "傳道書", "雅歌"],
                "舊約先知書": ["以賽亞書", "耶利米書", "耶利米哀歌", "以西結書", "但以理書", "何西阿書", "約珥書", "阿摩司書", "俄巴底亞書", "約拿書", "彌迦書", "那鴻書", "哈巴谷書", "西番雅書", "哈該書", "撒迦利亞書", "瑪拉基書"],
                "新約福音書": ["馬太福音", "馬可福音", "路加福音", "約翰福音"],
                "新約歷史書": ["使徒行傳"],
                "新約書信": ["羅馬書", "哥林多前書", "哥林多後書", "加拉太書", "以弗所書", "腓立比書", "歌羅西書", "帖撒羅尼迦前書", "帖撒羅尼迦後書", "提摩太前書", "提摩太後書", "提多書", "腓利門書", "希伯來書", "雅各書", "彼得前書", "彼得後書", "約翰一書", "約翰二書", "約翰三書", "猶大書"],
                "新約預言書": ["啟示錄"]
            },
            chapters: {
                "創世記": 50, "出埃及記": 40, "利未記": 27, "民數記": 36, "申命記": 34,
                "約書亞記": 24, "士師記": 21, "路得記": 4, "撒母耳記上": 31, "撒母耳記下": 24,
                "列王紀上": 22, "列王紀下": 25, "歷代志上": 29, "歷代志下": 36, "以斯拉記": 10,
                "尼希米記": 13, "以斯帖記": 10, "約伯記": 42, "詩篇": 150, "箴言": 31,
                "傳道書": 12, "雅歌": 8, "以賽亞書": 66, "耶利米書": 52, "耶利米哀歌": 5,
                "以西結書": 48, "但以理書": 12, "何西阿書": 14, "約珥書": 3, "阿摩司書": 9,
                "俄巴底亞書": 1, "約拿書": 4, "彌迦書": 7, "那鴻書": 3, "哈巴谷書": 3,
                "西番雅書": 3, "哈該書": 2, "撒迦利亞書": 14, "瑪拉基書": 4, "馬太福音": 28,
                "馬可福音": 16, "路加福音": 24, "約翰福音": 21, "使徒行傳": 28, "羅馬書": 16,
                "哥林多前書": 16, "哥林多後書": 13, "加拉太書": 6, "以弗所書": 6, "腓立比書": 4,
                "歌羅西書": 4, "帖撒羅尼迦前書": 5, "帖撒羅尼迦後書": 3, "提摩太前書": 6, "提摩太後書": 4,
                "提多書": 3, "腓利門書": 1, "希伯來書": 13, "雅各書": 5, "彼得前書": 5,
                "彼得後書": 3, "約翰一書": 5, "約翰二書": 1, "約翰三書": 1, "猶大書": 1, "啟示錄": 22
            }
        };
        
        // 全域變數
        let currentBook = '';
        let currentChapter = 0;
        
        // DOM 元素
        const exegesisSelect = document.getElementById('exegesisSelect');
        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const prevButton = document.getElementById('prevChapter');
        const nextButton = document.getElementById('nextChapter');
        const chapterTitle = document.getElementById('chapterTitle');
        const chapterSubtitle = document.getElementById('chapterSubtitle');
        const contentScroll = document.getElementById('contentScroll');
        const statusInfo = document.getElementById('statusInfo');
        const progressInfo = document.getElementById('progressInfo');
        
        // 初始化
        async function init() {
            console.log('🚀 初始化精讀聖經釋經閱讀器...');
            
            initializeBookSelector();
            initializeEventListeners();
            updateNavigationButtons();
            
            // 優先本地綜合解讀，失敗再 CMC fallback
            const params = new URLSearchParams(window.location.search);
            const urlBook = params.get('book') || '創世記';
            let urlChapter = parseInt(params.get('chapter'), 10);
            if (isNaN(urlChapter) || urlChapter < 1) urlChapter = 1;
            const book = bibleBooks.books.includes(urlBook) ? urlBook : '創世記';
            const maxCh = bibleBooks.chapters[book] || 1;
            const ch = (urlChapter <= maxCh && urlChapter >= 1) ? urlChapter : 1;
            selectBook(book);
            chapterSelect.value = ch;
            await loadChapter(book, ch);
            initBsChrome();
            
            // 背景初始化數據載入器（供 Prompt / 本地釋經用）
            try {
                if (typeof initUniversalDataLoader !== 'undefined') {
                    await initUniversalDataLoader();
                } else if (typeof initDatabase !== 'undefined') {
                    await initDatabase();
                }
            } catch (error) {
                console.warn('⚠️ 數據載入器初始化:', error.message);
            }
            
            console.log('✅ 精讀聖經釋經閱讀器初始化完成');
        }
        
        // 初始化書卷選擇器
        function initializeBookSelector() {
            bibleBooks.books.forEach(book => {
                const option = document.createElement('option');
                option.value = book;
                option.textContent = book;
                bookSelect.appendChild(option);
            });
        }
        

        
        // 初始化事件監聽器
        function initializeEventListeners() {
            bookSelect.addEventListener('change', () => {
                const selectedBook = bookSelect.value;
                if (selectedBook) {
                    selectBook(selectedBook);
                }
            });
            
            chapterSelect.addEventListener('change', () => {
                const selectedChapter = parseInt(chapterSelect.value);
                if (selectedChapter && currentBook) {
                    loadChapter(currentBook, selectedChapter);
                }
            });
            
            prevButton.addEventListener('click', () => {
                if (currentChapter > 1) {
                    loadChapter(currentBook, currentChapter - 1);
                }
            });
            
            nextButton.addEventListener('click', () => {
                if (currentChapter < bibleBooks.chapters[currentBook]) {
                    loadChapter(currentBook, currentChapter + 1);
                }
            });
        }
        
        // 選擇書卷
        function selectBook(book) {
            currentBook = book;
            bookSelect.value = book;
            
            // 更新章節選擇器
            updateChapterSelector();
            
            // 自動加載第一章
            if (bibleBooks.chapters[book] >= 1) {
                loadChapter(book, 1);
            }
        }
        
        // 更新章節選擇器
        function updateChapterSelector() {
            chapterSelect.innerHTML = '<option value="">請選擇章節</option>';
            
            if (currentBook && bibleBooks.chapters[currentBook]) {
                const maxChapter = bibleBooks.chapters[currentBook];
                for (let i = 1; i <= maxChapter; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `第 ${i} 章`;
                    chapterSelect.appendChild(option);
                }
            }
        }
        
        // 載入章節內容（BS-W2：本地綜合解讀優先 → CMC fallback）
        async function loadChapter(book, chapter) {
            currentBook = book;
            currentChapter = chapter;
            
            chapterSelect.value = chapter;
            chapterTitle.textContent = `${book} 第${chapter}章`;
            chapterSubtitle.textContent = `深入解讀 · 釋經注釋 · 靈性默想`;
            updateNavigationButtons();
            if (window.BSStudyChrome) {
                BSStudyChrome.hideCmcBanner(document.getElementById('bsCmcBannerHost'));
            }
            showLoadingMessage();
            updateStatus(`載入 ${book} 第${chapter}章 · 本地綜合解讀…`);

            try {
                if (window.BibleEngine && window.BS_DATA_REGISTRY) {
                    var bookId = getBookId(book);
                    var compEntry = (BS_DATA_REGISTRY.commentaries || []).find(function (c) { return c.key === 'comprehensive'; });
                    if (compEntry) {
                        var meta = (BibleEngine.db.commentaries || {}).comprehensive;
                        if (!meta || !meta.loaded) {
                            await BibleEngine.loadEntry('commentaries', compEntry);
                        }
                        var local = await BibleEngine.queryCommentary('comprehensive', bookId, chapter);
                        var hasBody = local && local.length && local.some(function (c) {
                            return c.content && String(c.content).trim().length > 20;
                        });
                        if (hasBody) {
                            displayCommentaryContent(local);
                            updateStatus(`${book} 第${chapter}章 · 本地綜合解讀`);
                            if (window.BSStudyChrome) {
                                BSStudyChrome.hideCmcBanner(document.getElementById('bsCmcBannerHost'));
                                BSStudyChrome.notifyCommentarySource('local');
                            }
                            refreshBsChrome();
                            return;
                        }
                    }
                }
            } catch (localErr) {
                console.warn('本地綜合解讀載入失敗，改 CMC fallback', localErr);
            }

            var cmcUrl;
            if (window.BibleBridge && window.BibleBridge.getCMCDirectLink) {
                cmcUrl = window.BibleBridge.getCMCDirectLink(book, chapter);
            } else {
                cmcUrl = "https://cmcbiblereading.com/?s=" + encodeURIComponent(book + " 第" + chapter + "章 逐节注解");
            }
            if (window.BSStudyChrome) {
                BSStudyChrome.showCmcBanner(document.getElementById('bsCmcBannerHost'));
            }
            contentScroll.innerHTML = '<div class="bb-patch" style="padding:0;"><iframe id="bb-cmc-iframe" src="' + cmcUrl + '" style="width:100%;height:calc(100vh - 180px);min-height:400px;border:none;border-radius:4px;"></iframe></div>';
            updateStatus(book + " 第" + chapter + "章 · CMC 釋經參讀（fallback）");
            refreshBsChrome();
        }

        function getBsContext() {
            return {
                bookId: getBookId(currentBook),
                chapter: currentChapter,
                bookName: currentBook,
                versionKey: 'faith'
            };
        }

        var refreshBsChrome = function () {};

        function initBsChrome() {
            if (!window.BSStudyChrome) return;
            var qnaRefresh;
            BSStudyChrome.initPage({

        function decryptContent(encryptedData) {
            try {
                // 檢查是否是特殊加密格式
                if (encryptedData && encryptedData.startsWith('l001wNia4i7hTEMxRHJg3')) {
                    return decryptSpecialFormat(encryptedData);
                }
                
                // 嘗試直接返回（可能已經是解密的）

                console.error('解密失敗:', e);
                return encryptedData;

        function decryptSpecialFormat(data) {
            try {
                // 移除前綴標識符
                const prefix = 'l001wNia4i7hTEMxRHJg3';
                const cleanData = data.substring(prefix.length);
                
                // 嘗試base64解碼
                const decoded = atob(cleanData);
                
                // 簡單的XOR解密
                const key = 'Bible100CommentaryKey2024';
                let decrypted = '';
                
                for (let i = 0; i < decoded.length; i++) {
                    const charCode = decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                    decrypted += String.fromCharCode(charCode);
                }
                
                return decrypted;
            } catch (e) {
                console.error('特殊格式解密失敗:', e);
                return data;
            }
        }

                console.error('❌ 通用數據載入器未找到');
            }
        });
    </script>
