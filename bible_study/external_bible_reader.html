<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經版本 - 外站連結 - Bible100</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="./js/bible-bridge.js?v=20250313e"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif; line-height: 1.6; color: #333; background: #f6f7fb; }
        .top-toolbar {
            position: fixed; left: 0; right: 0; top: 0; height: 50px;
            background: linear-gradient(135deg, #0b5fa5 0%, #2aa5ff 100%);
            color: white; border-bottom: 2px solid #1976d2; z-index: 1000;
            display: flex; align-items: center; padding: 0 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .brand { font-weight: bold; font-size: 16px; margin-right: 20px; }
        .nav-buttons { display: flex; gap: 8px; }
        .nav-btn {
            background: rgba(255,255,255,0.2); color: white; text-decoration: none;
            padding: 6px 12px; border-radius: 4px; font-size: 13px; transition: background 0.3s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .main-layout { margin-top: 52px; height: calc(100vh - 52px); display: flex; flex-direction: column; }
        .navigation-bar {
            background: #f8f9fa; border-bottom: 2px solid #e0e0e0;
            padding: 10px 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
        }
        .content-area { flex: 1; background: white; display: flex; flex-direction: column; overflow: hidden; }
        .nav-control { display: flex; align-items: center; gap: 8px; }
        .nav-control select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-width: 150px; }
        .nav-control .nav-btn { background: #0b5fa5; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .nav-control .nav-btn:hover { background: #0a5490; }
        .nav-control .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 20px; }
        .status-message { text-align: center; padding: 40px 20px; color: #666; font-size: 16px; }
        .status-bar { background: #f8f9fa; padding: 8px 15px; border-top: 1px solid #e0e0e0; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="top-toolbar">
        <div class="brand" style="font-size:13px;">📖 聖經版本</div>
        <div class="nav-buttons" style="font-size:12px;">
            <a href="parallel_mode_v3.html" target="contentFrame" class="nav-btn">📑 譯本對照</a>
            <a href="comprehensive_exegesis_reader.html" target="contentFrame" class="nav-btn">📝 釋經參讀</a>
            <a href="reader.html" target="contentFrame" class="nav-btn">📖 回聖經</a>
            <a href="index.html" target="_top" class="nav-btn">⛪ 研讀中心</a>
        </div>
    </div>

    <div class="main-layout">
        <div class="navigation-bar">
            <div class="nav-control">
                <label>版本:</label>
                <select id="versionSelect">
                    <option value="ibible-strong">🇨🇳 和合本 Strong Number</option>
                    <option value="ibible-luzhen">🇨🇳 呂振中譯本</option>
                    <option value="ibible-indonesia">🇮🇩 Indonesia Baru 印尼聖經</option>
                    <option value="laobible">🇱🇦 ພຣະຄຳພີລາວ Lao Bible</option>
                    <option value="vietchristian">🇻🇳 Kinh Thánh 越南聖經 (BTT)</option>
                    <option value="wordproject-myanmar">🇲🇲 Myanmar 緬甸聖經</option>
                </select>
            </div>
            <div class="nav-control">
                <label>書卷:</label>
                <select id="bookSelect"><option value="">請選擇書卷</option></select>
            </div>
            <div class="nav-control">
                <label>章節:</label>
                <select id="chapterSelect"><option value="">請選擇章節</option></select>
            </div>
            <div class="nav-control">
                <button class="nav-btn" id="prevChapter">←</button>
                <button class="nav-btn" id="nextChapter">→</button>
            </div>
            <div class="nav-control">
                <div id="statusInfo" style="font-size: 12px; color: #666;">準備就緒</div>
            </div>
        </div>

        <div class="content-area">
            <div class="content-scroll" id="contentScroll">
                <div class="status-message">
                    <p>🎯 聖經版本 - 外站連結</p>
                    <p>請選擇版本、書卷與章節，將在下方嵌入對應外站經文</p>
                    <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                        <li>🇨🇳 和合本 Strong Number / 呂振中 - iBible.hk（僅能新視窗；可另開「版本首頁」在站內選書）</li>
                        <li>🇮🇩 Indonesia Baru - iBible.hk</li>
                        <li>🇱🇦 寮國聖經 - laobible.net</li>
                        <li>🇻🇳 Kinh Thánh (BTT) - VietChristian</li>
                        <li>🇲🇲 Myanmar - WordProject</li>
                    </ul>
                </div>
            </div>
            <div class="status-bar">
                <div id="statusBar">準備就緒</div>
            </div>
        </div>
    </div>

    <script>
        const bibleBooks = {
            books: ["創世記","出埃及記","利未記","民數記","申命記","約書亞記","士師記","路得記","撒母耳記上","撒母耳記下","列王紀上","列王紀下","歷代志上","歷代志下","以斯拉記","尼希米記","以斯帖記","約伯記","詩篇","箴言","傳道書","雅歌","以賽亞書","耶利米書","耶利米哀歌","以西結書","但以理書","何西阿書","約珥書","阿摩司書","俄巴底亞書","約拿書","彌迦書","那鴻書","哈巴谷書","西番雅書","哈該書","撒迦利亞書","瑪拉基書","馬太福音","馬可福音","路加福音","約翰福音","使徒行傳","羅馬書","哥林多前書","哥林多後書","加拉太書","以弗所書","腓立比書","歌羅西書","帖撒羅尼迦前書","帖撒羅尼迦後書","提摩太前書","提摩太後書","提多書","腓利門書","希伯來書","雅各書","彼得前書","彼得後書","約翰一書","約翰二書","約翰三書","猶大書","啟示錄"],
            chapters: {"創世記":50,"出埃及記":40,"利未記":27,"民數記":36,"申命記":34,"約書亞記":24,"士師記":21,"路得記":4,"撒母耳記上":31,"撒母耳記下":24,"列王紀上":22,"列王紀下":25,"歷代志上":29,"歷代志下":36,"以斯拉記":10,"尼希米記":13,"以斯帖記":10,"約伯記":42,"詩篇":150,"箴言":31,"傳道書":12,"雅歌":8,"以賽亞書":66,"耶利米書":52,"耶利米哀歌":5,"以西結書":48,"但以理書":12,"何西阿書":14,"約珥書":3,"阿摩司書":9,"俄巴底亞書":1,"約拿書":4,"彌迦書":7,"那鴻書":3,"哈巴谷書":3,"西番雅書":3,"哈該書":2,"撒迦利亞書":14,"瑪拉基書":4,"馬太福音":28,"馬可福音":16,"路加福音":24,"約翰福音":21,"使徒行傳":28,"羅馬書":16,"哥林多前書":16,"哥林多後書":13,"加拉太書":6,"以弗所書":6,"腓立比書":4,"歌羅西書":4,"帖撒羅尼迦前書":5,"帖撒羅尼迦後書":3,"提摩太前書":6,"提摩太後書":4,"提多書":3,"腓利門書":1,"希伯來書":13,"雅各書":5,"彼得前書":5,"彼得後書":3,"約翰一書":5,"約翰二書":1,"約翰三書":1,"猶大書":1,"啟示錄":22}
        };

        let currentBook = '', currentChapter = 0;
        const versionSelect = document.getElementById('versionSelect');
        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        const contentScroll = document.getElementById('contentScroll');
        const statusInfo = document.getElementById('statusInfo');
        const statusBar = document.getElementById('statusBar');

        function init() {
            bibleBooks.books.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                bookSelect.appendChild(opt);
            });
            const params = new URLSearchParams(window.location.search);
            const urlSource = params.get('source') || 'ibible-strong';
            const urlBook = params.get('book') || '創世記';
            let urlCh = parseInt(params.get('chapter'), 10) || 1;
            const maxCh = bibleBooks.chapters[urlBook] || 1;
            urlCh = Math.min(Math.max(1, urlCh), maxCh);

            versionSelect.value = urlSource;
            currentBook = urlBook;
            currentChapter = urlCh;
            bookSelect.value = urlBook;
            updateChapterSelector();
            chapterSelect.value = urlCh;
            loadChapter();

            versionSelect.addEventListener('change', loadChapter);
            bookSelect.addEventListener('change', () => {
                currentBook = bookSelect.value;
                updateChapterSelector();
                if (bibleBooks.chapters[currentBook] >= 1) {
                    chapterSelect.value = 1;
                    currentChapter = 1;
                    loadChapter();
                }
            });
            chapterSelect.addEventListener('change', () => {
                currentChapter = parseInt(chapterSelect.value, 10) || 1;
                loadChapter();
            });
            prevBtn.addEventListener('click', () => {
                if (currentChapter > 1) { currentChapter--; chapterSelect.value = currentChapter; loadChapter(); }
            });
            nextBtn.addEventListener('click', () => {
                const max = bibleBooks.chapters[currentBook] || 1;
                if (currentChapter < max) { currentChapter++; chapterSelect.value = currentChapter; loadChapter(); }
            });
        }

        function updateChapterSelector() {
            chapterSelect.innerHTML = '<option value="">請選擇章節</option>';
            const max = bibleBooks.chapters[currentBook] || 1;
            for (let i = 1; i <= max; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = '第 ' + i + ' 章';
                chapterSelect.appendChild(opt);
            }
        }

        function loadChapter() {
            const source = versionSelect.value;
            const book = currentBook || bookSelect.value;
            const ch = currentChapter || parseInt(chapterSelect.value, 10) || 1;
            if (!book) return;

            const url = window.BibleBridge && window.BibleBridge.getExternalBibleLink
                ? window.BibleBridge.getExternalBibleLink(source, book, ch)
                : 'https://b.ibible.hk/bible/4/GEN/1';

            const isIbible = /^ibible-/.test(source);
            const ibibleVid = (window.BibleBridge && window.BibleBridge.ibibleVersionHomePath)
                ? window.BibleBridge.ibibleVersionHomePath[source] : null;
            const ibibleHomeUrl = ibibleVid ? ('https://b.ibible.hk/bible/' + ibibleVid) : 'https://b.ibible.hk/';
            if (isIbible) {
                contentScroll.innerHTML = '<div style="padding:24px;text-align:left;max-width:520px;margin:0 auto;background:#f8f9fa;border-radius:8px;border:1px solid #e0e0e0;">' +
                    '<p style="margin-bottom:10px;color:#333;font-weight:bold;">iBible.hk 不允許嵌入本頁</p>' +
                    '<p style="margin-bottom:12px;font-size:12px;color:#555;line-height:1.5;">在本頁用下拉選單選好書卷與章節後，按「開啟本章」會開<strong>新分頁</strong>到對應網址。<strong>若已開過分頁，它不會隨下拉選單自動更新</strong>，請再按一次按鈕或關閉舊分頁。</p>' +
                    '<p style="margin-bottom:8px;font-size:13px;"><strong>' + book + ' 第' + ch + '章</strong></p>' +
                    '<p style="margin-bottom:12px;font-size:11px;color:#666;">若深層連結無法顯示，請用「版本首頁」進入 iBible，在站內選書卷、章節與譯本（如呂振中）。</p>' +
                    '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">' +
                    '<a href="' + url + '" target="_blank" rel="noopener" style="display:inline-block;padding:10px 18px;background:#0b5fa5;color:white;text-decoration:none;border-radius:6px;font-weight:bold;font-size:13px;">開啟本章（新視窗）</a>' +
                    '<a href="' + ibibleHomeUrl + '" target="_blank" rel="noopener" style="display:inline-block;padding:10px 18px;background:#fff;color:#0b5fa5;text-decoration:none;border-radius:6px;font-weight:bold;font-size:13px;border:2px solid #0b5fa5;">iBible 此版本首頁</a>' +
                    '</div></div>';
            } else {
                var safeUrl = url.replace(/"/g, '&quot;');
                contentScroll.innerHTML = '<div style="padding:20px;text-align:center;max-width:480px;margin:0 auto;">' +
                    '<p style="font-size:13px;color:#333;margin-bottom:8px;"><strong>' + book + ' 第' + ch + '章</strong></p>' +
                    '<p style="font-size:11px;color:#64748b;margin-bottom:14px;line-height:1.55;">外站经文创载较慢，<strong>按需载入</strong>以免打开页面久等。若 iframe 空白请用新分页。</p>' +
                    '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">' +
                    '<button type="button" id="ext-lazy-load" style="padding:10px 18px;background:#0b5fa5;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;">▶ 载入本章预览</button>' +
                    '<a href="' + safeUrl + '" target="_blank" rel="noopener" style="display:inline-block;padding:10px 18px;background:#fff;color:#0b5fa5;text-decoration:none;border-radius:6px;font-weight:bold;font-size:13px;border:2px solid #0b5fa5;">↗ 新分页开启</a>' +
                    '</div><div id="ext-iframe-host" style="margin-top:14px;"></div></div>';
                var btn = document.getElementById('ext-lazy-load');
                if (btn) btn.onclick = function () {
                    var host = document.getElementById('ext-iframe-host');
                    if (host) host.innerHTML = '<iframe src="' + safeUrl + '" title="外站聖經" style="width:100%;height:calc(100vh - 220px);min-height:360px;border:none;border-radius:4px;"></iframe>';
                };
            }
            statusInfo.textContent = book + ' 第' + ch + '章';
            statusBar.textContent = book + ' 第' + ch + '章 · 外站經文';

            prevBtn.disabled = ch <= 1;
            nextBtn.disabled = ch >= (bibleBooks.chapters[book] || 1);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
