<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轉址至聖經閱覽器…</title>
  <script>
(function () {
  var q = window.location.search || '';
  var params = new URLSearchParams(q);
  var ref = params.get('ref');
  var target;

  if (ref) {
    // timeline_viewer 等：ref 如「創世記12」「撒母耳記上10」「馬太福音1-2」
    var head = ref.indexOf('-') >= 0 ? ref.split('-')[0].trim() : ref.trim();
    var m = head.match(/^(.*?)(\d+)$/);
    if (m) {
      var book = m[1];
      var chapter = m[2];
      target = 'comprehensive_exegesis_reader.html?book=' + encodeURIComponent(book) + '&chapter=' + encodeURIComponent(chapter);
    } else {
      target = 'comprehensive_exegesis_reader.html';
    }
  } else {
    // 原 unified：版本切換等 → reader.html（支援 book/chapter/version）
    target = 'reader.html' + q;
  }
  window.location.replace(target);
})();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=reader.html"></noscript>
</head>
<body>
  <p>正在前往聖經閱覽器…若未自動跳轉，請<a href="reader.html">按此</a>。</p>
</body>
</html>
