<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>越文逐字對照</title>
  <link rel="stylesheet" href="interlinear.css?v=20260830v2" />
</head>
<body class="ig-page" data-b100-module="bible_study" data-b100-pattern="P-TOOL">
  <h1>越文逐字對照</h1>
  <p class="ig-lead">
    先看<strong>字／詞／句怎麼拆</strong>。任意新句也會嘗試產出中英譯文（標「草稿」，請人審），
    <strong>絕不把越南原文拿去冒充譯文</strong>。聖經句優先用本機經庫對譯；其餘用本機譯文記憶／Gemini／機器翻譯。
    請在本機 HTTP 驗收，<strong>先不要上雲</strong>。
  </p>
  <div id="igBanner" class="ig-banner is-warn">正在探測本機經庫…</div>
  <div class="ig-keyrow">
    <input id="igApiKey" type="password" autocomplete="off" placeholder="選填：Gemini API Key（只存在本機瀏覽器）" />
    <button type="button" id="btnSaveKey">儲存 Key</button>
  </div>
  <div class="ig-actions">
    <button type="button" id="btnSample">載入示範主禱文</button>
    <button type="button" id="btnRun" class="primary">分析並翻譯</button>
  </div>
  <textarea id="igInput" placeholder="貼任意越南文，或輸入 太 6:10"></textarea>
  <p class="ig-hint">V1 原文只做越南文。無 Key 時新句走免費機器翻譯草稿（需上網）。經節對譯走本機 bible_reader.db，不需 lovestoblog。</p>
  <div id="igResults"></div>
  <script src="../../js/site_http_port.js"></script>
  <script src="../../bible_app/shell/js/live_db_bridge.js"></script>
  <script src="js/lexicon_vi.js?v=20260830v2"></script>
  <script src="js/segment_vi.js?v=20260830v2"></script>
  <script src="js/verse_lookup.js?v=20260830v2"></script>
  <script src="js/translate_engine.js?v=20260830v2"></script>
  <script src="js/interlinear_app.js?v=20260830v2"></script>
</body>
</html>
