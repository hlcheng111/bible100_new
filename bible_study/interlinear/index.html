<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多語言逐字註解與語言學分析工作站</title>
  <link rel="stylesheet" href="interlinear.css?v=20260830v6ui" />
</head>
<body class="ig-v6" data-b100-module="bible_study" data-b100-pattern="P-TOOL">
  <header class="ig-top">
    <div class="ig-brand">
      <div class="ig-logo">文</div>
      <div>
        <h1>多語言逐字註解與語言學分析工作站</h1>
        <p>越南文／印尼文 · 詞典直譯 · 無需 API Key</p>
      </div>
    </div>
    <div id="statusBadge" class="ig-badge">詞典直譯模式</div>
  </header>

  <main class="ig-wrap">
    <section class="ig-sec ig-sec-1">
      <div class="ig-sec-h">
        <h2><span class="ig-step">1</span>步驟一：語言選擇與文本輸入</h2>
        <div class="ig-presets">
          <span>快速載入範例：</span>
          <button type="button" id="btnSampleVi1">🇻🇳 主禱文（經典）</button>
          <button type="button" id="btnSampleVi2">🇻🇳 天主經第二句</button>
          <button type="button" id="btnSampleId">🇮🇩 早安問候</button>
        </div>
      </div>
      <div class="ig-sec-b">
        <div class="ig-grid3">
          <div class="ig-field">
            <label>A. 目標外語 (Target Language)</label>
            <select id="targetLangSelect">
              <option value="vi" selected>🇻🇳 越南語 (Tiếng Việt)</option>
              <option value="id">🇮🇩 印尼語 (Bahasa Indonesia)</option>
            </select>
          </div>
          <div class="ig-field">
            <label>B. 對照註解語言 (Analysis Language)</label>
            <select id="analysisLangSelect">
              <option value="zh-en" selected>🌏 中英雙語對照</option>
              <option value="zh">🇹🇼 繁體中文</option>
              <option value="en">🇺🇸 英文</option>
            </select>
          </div>
          <div class="ig-field">
            <label>C. 分析方向 (Direction)</label>
            <select id="analysisDirection">
              <option value="foreign-to-zh" selected>📖 外文精讀（外文 ➔ 中英註解）</option>
              <option value="zh-to-foreign">✍️ 教材生成（尚未開放）</option>
            </select>
          </div>
        </div>
        <div class="ig-field">
          <textarea id="inputText" rows="4" placeholder="請貼上越南文或印尼文…"></textarea>
        </div>
        <div class="ig-bar">
          <p class="ig-hint">無 API Key：詞卡＋句型＋直譯草稿（非通順譯）。絕不把原文填進中英欄。泰緬日韓刻意不做。</p>
          <div>
            <button type="button" id="btnClear">清空</button>
            <button type="button" id="btnAnalyze" class="primary">開始逐句雙語分析</button>
          </div>
        </div>
      </div>
    </section>

    <section class="ig-sec ig-sec-2">
      <div class="ig-sec-h">
        <h2><span class="ig-step">2</span>步驟二：逐句閱讀與對照對齊</h2>
        <button type="button" id="btnSpeak">朗讀全文</button>
      </div>
      <div class="ig-sec-b" id="analysisResults">
        <p class="ig-hint">分析結果會顯示在這裡。</p>
      </div>
    </section>

    <section class="ig-sec ig-sec-3">
      <div class="ig-sec-h">
        <h2><span class="ig-step">3</span>步驟三：遮字自測</h2>
        <div class="ig-presets">
          <button type="button" id="btnTestNone" class="ig-test-on">顯示全部</button>
          <button type="button" id="btnTestZh">遮中文（滑過才見）</button>
          <button type="button" id="btnTestFo">遮外文（滑過才見）</button>
        </div>
      </div>
      <div class="ig-sec-b">
        <p class="ig-hint">先完成步驟二，再用遮字練習。這不是考試系統，只是幫助記詞。</p>
      </div>
    </section>
  </main>

  <script src="../../js/site_http_port.js"></script>
  <script src="../../bible_app/shell/js/live_db_bridge.js"></script>
  <script src="js/lexicon_vi.js?v=20260830v6ui"></script>
  <script src="js/segment_vi.js?v=20260830v6ui"></script>
  <script src="js/verse_lookup.js?v=20260830v6ui"></script>
  <script src="js/interlinear_app.js?v=20260830v6ui"></script>
</body>
</html>
