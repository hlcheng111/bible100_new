<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>越／印逐字對照</title>
  <link rel="stylesheet" href="interlinear.css?v=20260830v3" />
</head>
<body class="ig-page" data-b100-module="bible_study" data-b100-pattern="P-TOOL">
  <h1>越／印逐字對照</h1>
  <p class="ig-lead">
    現況只做<strong>越南文、印尼文</strong>的字／詞／句與文法對照；任意新句可出中英譯文<strong>草稿</strong>（請人審）。
    <strong>絕不把原文拿去冒充譯文</strong>。泰／緬／日／韓刻意不做。請本機 HTTP 驗收後再上 GitHub；<strong>先不上雲</strong>。
  </p>
  <div id="igBanner" class="ig-banner is-warn">正在探測本機經庫…</div>
  <div class="ig-keyrow">
    <label>原文語言
      <select id="igLang">
        <option value="vi" selected>越南文</option>
        <option value="id">印尼文</option>
      </select>
    </label>
    <input id="igApiKey" type="password" autocomplete="off" placeholder="選填：Gemini API Key（只存在本機瀏覽器）" />
    <button type="button" id="btnSaveKey">儲存 Key</button>
  </div>
  <div class="ig-actions">
    <button type="button" id="btnSample">載入示範句</button>
    <button type="button" id="btnRun" class="primary">分析並翻譯</button>
  </div>
  <textarea id="igInput" placeholder="貼越南文或印尼文，或輸入 太 6:10"></textarea>
  <p class="ig-hint">無 Key 時新句走免費機器翻譯草稿（需上網）。經節對譯走本機 bible_reader.db。範圍見 docs/INTERLINEAR_SCOPE_V1.md。</p>
  <div id="igResults"></div>
  <script src="../../js/site_http_port.js"></script>
  <script src="../../bible_app/shell/js/live_db_bridge.js"></script>
  <script src="js/lexicon_vi.js?v=20260830v3"></script>
  <script src="js/segment_vi.js?v=20260830v3"></script>
  <script src="js/verse_lookup.js?v=20260830v3"></script>
  <script src="js/translate_engine.js?v=20260830v3"></script>
  <script src="js/interlinear_app.js?v=20260830v3"></script>
</body>
</html>
