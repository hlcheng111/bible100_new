<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經經文 - 創世記第1章</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f8f9fa; color: #333; line-height: 1.8; padding: 20px; }
        h1 { font-size: 20px; color: #0b5fa5; margin-bottom: 16px; text-align: center; }
        .verse { margin: 8px 0; font-size: 15px; }
        .verse-num { color: #7f8c8d; font-weight: bold; margin-right: 8px; font-size: 13px; }
        .tip { background: #e8f5e9; padding: 12px; border-radius: 8px; font-size: 12px; color: #2e7d32; margin-top: 20px; }
        .tip a { color: #0b5fa5; }
    </style>
</head>
<body>
    <h1>創世記 第1章</h1>
    <p style="font-size:12px;color:#666;margin-bottom:16px;">信望愛(和合本) · 本頁為輕量示範，無需伺服器即可顯示</p>
    <div id="verses"></div>
    <div class="tip">
        💡 若要閱讀全部66卷，請雙擊專案根目錄的 <strong>啟動聖經研讀.bat</strong>，或使用 Live Server 開啟。
    </div>
    <script>
        const 創世記第1章 = [
            "起初，　神創造天地。",
            "地是空虛混沌，深淵上面一片黑暗；　神的靈運行在水面上。",
            "　神說：「要有光」，就有了光。",
            "　神看光是好的，於是　神就把光和暗分開。",
            "　神稱光為「晝」，稱暗為「夜」。有晚上，有早晨，這是第一日。",
            "　神說：「眾水之間要有穹蒼，把水和水分開。」",
            "　神就造了穹蒼，把穹蒼以下的水和穹蒼以上的水分開。事就這樣成了。",
            "　神稱穹蒼為「天」。有晚上，有早晨，這是第二日。",
            "　神說：「天下面的水要聚集在一處，使乾地露出來。」事就這樣成了。",
            "　神稱乾地為「地」，稱聚集在一起的水為「海」。　神看為好的。",
            "　神說：「地要長出植物，就是含種子的五穀菜蔬，和會結果子、果子裏有種子的樹，在地上各從其類。」事就這樣成了。",
            "於是地長出了植物：含種子的五穀菜蔬，各從其類；會結果子、果子裏有種子的樹，各從其類。　神看為好的。",
            "有晚上，有早晨，這是第三日。",
            "　神說：「天上要有光體來分晝夜，讓它們作記號，定季節、日子、年份，",
            "它們要在天空發光，照在地上。」事就這樣成了。",
            "於是　神造了兩個大光體，大的管晝，小的管夜，又造了星辰。",
            "　神把這些光體擺列在天空，照在地上，",
            "管理晝夜，分別光暗。　神看為好的。",
            "有晚上，有早晨，這是第四日。",
            "　神說：「水要滋生眾多有生命之物；要有鳥飛在地面以上，天空之中。」",
            "　神就創造了大魚和在水裏滋生的各樣活動的生物，各從其類，以及各樣有翅膀的鳥，各從其類。　神看為好的。",
            "　神就賜福給這一切，說：「要繁殖增多，充滿在海的水裏；飛鳥也要在地上增多。」",
            "有晚上，有早晨，這是第五日。",
            "　神說：「地要生出有生命之物，各從其類，就是牲畜、爬行動物、地上的走獸，各從其類。」事就這樣成了。",
            "於是　神造了地上的走獸，各從其類；牲畜，各從其類；和地上一切的爬行動物，各從其類。　神看為好的。",
            "　神說：「我們要照著我們的形像，按著我們的樣式造人，使他們管理海裏的魚、天空的鳥、地上的牲畜和全地，以及地上爬的一切爬行動物。」",
            "　神就照著他的形像創造人，照著　神的形像創造他們；他創造了他們，有男有女。",
            "　神賜福給他們，　神對他們說：「要生養眾多，遍滿這地，治理它；要管理海裏的魚、天空的鳥和地上各樣活動的生物。」",
            "　神說：「看哪，我把全地一切含種子的五穀菜蔬和一切會結果子、果子裏有種子的樹，都賜給你們；這些都可作食物。",
            "至於地上一切的走獸、天空一切的飛鳥，並一切在地上爬行的，有生命的動物，我把綠色植物賜給牠們作食物。」事就這樣成了。",
            "　神看一切所造的，看哪，都非常好。有晚上，有早晨，這是第六日。"
        ];
        const container = document.getElementById('verses');
        創世記第1章.forEach((text, i) => {
            const div = document.createElement('div');
            div.className = 'verse';
            div.innerHTML = '<span class="verse-num">' + (i+1) + '</span>' + text;
            container.appendChild(div);
        });
    </script>
</body>
</html>
