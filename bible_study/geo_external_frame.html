<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經地理歷史 · 外站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f4f6f8; height: 100vh; display: flex; flex-direction: column; }
        .bar {
            background: #2c3e50; color: #ecf0f1; padding: 8px 12px; font-size: 12px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .bar a { color: #7fdbff; }
        .bar button {
            padding: 6px 12px; border: none; border-radius: 6px; background: #0b5fa5; color: #fff;
            font-size: 11px; cursor: pointer; font-weight: 600;
        }
        .hint { font-size: 11px; opacity: 0.9; flex: 1; min-width: 120px; }
        .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        iframe { flex: 1; border: none; background: #fff; width: 100%; min-height: 0; }
        .lazy-box {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: #fff; text-align: center; font-size: 13px; line-height: 1.65; color: #334155;
        }
        .lazy-box p { max-width: 420px; margin-bottom: 12px; }
        .fallback { padding: 24px; line-height: 1.6; font-size: 13px; color: #334155; }
    </style>
</head>
<body>
    <div class="bar">
        <strong>🗺️ 外站資源</strong>
        <span class="hint" id="geo-url-label"></span>
        <button type="button" id="geo-btn-load">▶ 载入预览</button>
        <a href="#" id="geo-open-tab" target="_blank" rel="noopener">↗ 新分頁開啟（推荐）</a>
    </div>
    <div class="panel" id="geo-panel">
        <div class="lazy-box" id="geo-lazy">
            <div>
                <p><strong>按需载入</strong> — 外站地图较大，先不自动下载，以免拖慢侧栏切换。</p>
                <p style="font-size:11px;color:#64748b;">若嵌入空白或 404，请点 <strong>↗ 新分頁開啟</strong>（圣光等站点常禁止 iframe）。</p>
                <button type="button" id="geo-btn-load2" style="padding:8px 16px;border:none;border-radius:8px;background:#0b5fa5;color:#fff;cursor:pointer;font-weight:600;">▶ 在此载入</button>
            </div>
        </div>
        <iframe id="geo-frame" title="外站地理歷史" hidden sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation"></iframe>
    </div>
    <div class="fallback" id="geo-fallback" hidden>
        <p>此外站不允許嵌入 iframe。請點上方 <strong>↗ 新分頁開啟</strong>。</p>
    </div>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var url = params.get("url") || "";
            try { url = decodeURIComponent(url); } catch (e) {}
            if (!/^https?:\/\//i.test(url)) {
                document.body.innerHTML = "<div class=\"fallback\"><p>缺少有效外站網址（?url=https://…）。</p></div>";
                return;
            }
            var label = document.getElementById("geo-url-label");
            var tab = document.getElementById("geo-open-tab");
            var frame = document.getElementById("geo-frame");
            var lazy = document.getElementById("geo-lazy");
            if (label) label.textContent = url.length > 72 ? url.slice(0, 72) + "…" : url;
            if (tab) tab.href = url;

            function loadFrame() {
                if (!frame) return;
                lazy.hidden = true;
                frame.hidden = false;
                frame.src = url;
            }

            document.getElementById("geo-btn-load").onclick = loadFrame;
            document.getElementById("geo-btn-load2").onclick = loadFrame;

            if (params.get("autoload") === "1") loadFrame();
        })();
    </script>
</body>
</html>
