<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經地理歷史 · 外站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .bar {
            flex-shrink: 0;
            background: #f8f9fa;
            color: #64748b;
            padding: 3px 10px;
            font-size: 10px;
            line-height: 1.4;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }
        .bar a {
            color: #0b5fa5;
            text-decoration: none;
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }
        .bar a:hover { text-decoration: underline; }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
            min-height: 0;
        }
        .fallback { padding: 20px; font-size: 13px; color: #334155; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="bar">
        <a href="#" id="geo-open-tab" target="_blank" rel="noopener">若嵌入空白 · ↗ 新分頁開啟</a>
    </div>
    <iframe id="geo-frame" title="外站地理歷史" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation"></iframe>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var url = params.get("url") || "";
            try { url = decodeURIComponent(url); } catch (e) {}
            if (!/^https?:\/\//i.test(url)) {
                document.body.innerHTML = "<div class=\"fallback\"><p>缺少有效外站網址（?url=https://…）。</p></div>";
                return;
            }
            var tab = document.getElementById("geo-open-tab");
            var frame = document.getElementById("geo-frame");
            if (tab) tab.href = url;
            if (frame) frame.src = url;
        })();
    </script>
</body>
</html>
