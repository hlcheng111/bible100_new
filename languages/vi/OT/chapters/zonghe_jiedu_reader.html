<!DOCTYPE html>
<html>
<head>
    <title>综合解读</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
        }
        #content {
            white-space: pre-wrap;
        }
    </style>
<script src="../../../scripts/image_path_rewriter.js"></script>
</head>
<body>
    <h1>综合解读</h1>
    <select id="book-select"></select>
    <select id="chapter-select"></select>
    <div id="content"></div>

    <script>
        let bibleData;

        fetch('./bible_data.json')
            .then(response => response.json())
            .then(data => {
                bibleData = data;
                const bookSelect = document.getElementById('book-select');
                const books = Object.keys(bibleData['key_chinese']);
                for (const book of bibleData['key_chinese']) {
                    const option = document.createElement('option');
                    option.value = book.id;
                    option.textContent = book.name;
                    bookSelect.appendChild(option);
                }
                bookSelect.dispatchEvent(new Event('change'));
            });

        document.getElementById('book-select').addEventListener('change', (event) => {
            const bookId = event.target.value;
            const chapterSelect = document.getElementById('chapter-select');
            chapterSelect.innerHTML = '';
            const bookData = bibleData['t_asv'].find(b => b.book_id == bookId);
            if (bookData) {
                const chapters = bibleData['t_asv'].filter(b => b.book_id == bookId);
                for (let i = 1; i <= chapters.length; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `Chapter ${i}`;
                    chapterSelect.appendChild(option);
                }
            }
             chapterSelect.dispatchEvent(new Event('change'));
        });

        document.getElementById('chapter-select').addEventListener('change', (event) => {
            const bookId = document.getElementById('book-select').value;
            const chapter = event.target.value;
            const contentDiv = document.getElementById('content');
            const chapterData = bibleData['t_asv'].find(b => b.book_id == bookId && b.chapter == chapter);
            if(chapterData) {
                contentDiv.textContent = chapterData.text;
            } else {
                contentDiv.textContent = 'No content found.';
            }
        });
    </script>

<!-- smart_tools 頂部工具箱 (由 inject_smart_header.py 注入) -->
<script>window.localConfig = window.localConfig || {};</script>
<script src="../../../js/smart_tools.js"></script>

</body>
</html>
