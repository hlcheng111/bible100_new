<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶反饋 - BibleQ&A Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .feedback-form {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 1.1rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .rating-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .rating-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .rating-option:hover {
            background: #f8f9fa;
        }
        
        .rating-option.selected {
            background: #667eea;
            color: white;
        }
        
        .rating-option input {
            display: none;
        }
        
        .rating-option .star {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .rating-option .label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            color: #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .rating-group {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回 AI 中心</a>
    
    <div class="container">
        <div class="header">
            <h1>💬 用戶反饋</h1>
            <p>幫助我們改進 AI 功能中心，提供更好的學習體驗</p>
        </div>
        
        <form class="feedback-form" id="feedbackForm">
            <div class="form-group">
                <label for="userType">您是什麼類型的用戶？</label>
                <select id="userType" required>
                    <option value="">請選擇...</option>
                    <option value="student">學生</option>
                    <option value="teacher">教師</option>
                    <option value="pastor">牧師/傳道人</option>
                    <option value="researcher">研究人員</option>
                    <option value="general">一般用戶</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="usageFrequency">您使用 AI 功能的頻率如何？</label>
                <select id="usageFrequency" required>
                    <option value="">請選擇...</option>
                    <option value="daily">每天</option>
                    <option value="weekly">每週幾次</option>
                    <option value="monthly">每月幾次</option>
                    <option value="rarely">很少使用</option>
                    <option value="first-time">第一次使用</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>您對 AI 功能中心的整體滿意度如何？</label>
                <div class="rating-group">
                    <label class="rating-option" for="rating1">
                        <input type="radio" name="satisfaction" value="1" required>
                        <div class="star">⭐</div>
                        <div class="label">很不滿意</div>
                    </label>
                    <label class="rating-option" for="rating2">
                        <input type="radio" name="satisfaction" value="2">
                        <div class="star">⭐⭐</div>
                        <div class="label">不滿意</div>
                    </label>
                    <label class="rating-option" for="rating3">
                        <input type="radio" name="satisfaction" value="3">
                        <div class="star">⭐⭐⭐</div>
                        <div class="label">一般</div>
                    </label>
                    <label class="rating-option" for="rating4">
                        <input type="radio" name="satisfaction" value="4">
                        <div class="star">⭐⭐⭐⭐</div>
                        <div class="label">滿意</div>
                    </label>
                    <label class="rating-option" for="rating5">
                        <input type="radio" name="satisfaction" value="5">
                        <div class="star">⭐⭐⭐⭐⭐</div>
                        <div class="label">非常滿意</div>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="favoriteFeature">您最喜歡哪個 AI 功能？</label>
                <select id="favoriteFeature" required>
                    <option value="">請選擇...</option>
                    <option value="qa-system">AI 智能問答系統</option>
                    <option value="lesson-plan">AI 課程規劃助手</option>
                    <option value="text-to-image">AI 文字轉圖像</option>
                    <option value="text-to-music">AI 文字轉音樂</option>
                    <option value="agent-apps">AI 智能代理應用</option>
                    <option value="multilang-support">多語言 AI 支持</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="improvementAreas">您認為哪些方面需要改進？</label>
                <textarea id="improvementAreas" placeholder="請描述您希望改進的具體方面，例如：功能易用性、響應速度、內容準確性等..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="suggestions">您有什麼建議或想法？</label>
                <textarea id="suggestions" placeholder="請分享您的想法，例如：希望新增的功能、改進建議等..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="contactInfo">聯繫方式（可選）</label>
                <input type="email" id="contactInfo" placeholder="如果您希望我們回覆您的反饋，請留下您的郵箱地址">
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">📤 提交反饋</button>
        </form>
        
        <div class="success-message" id="successMessage">
            <h3>🎉 感謝您的反饋！</h3>
            <p>您的意見對我們非常重要，我們會認真考慮並努力改進。</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            <h3>❌ 提交失敗</h3>
            <p>請檢查您的網絡連接並重試，或稍後再試。</p>
        </div>
        
        <div class="footer">
            <p>© 2024 BibleQ&A Hub - AI 功能中心</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const feedbackForm = document.getElementById('feedbackForm');
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // 評分選擇效果
            const ratingOptions = document.querySelectorAll('.rating-option');
            ratingOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // 移除其他選中的樣式
                    ratingOptions.forEach(opt => opt.classList.remove('selected'));
                    // 添加當前選中的樣式
                    this.classList.add('selected');
                    // 選中對應的 radio button
                    const radio = this.querySelector('input');
                    radio.checked = true;
                });
            });
            
            feedbackForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                // 禁用提交按鈕
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                
                // 收集表單數據
                const formData = {
                    userType: document.getElementById('userType').value,
                    usageFrequency: document.getElementById('usageFrequency').value,
                    satisfaction: document.querySelector('input[name="satisfaction"]:checked')?.value,
                    favoriteFeature: document.getElementById('favoriteFeature').value,
                    improvementAreas: document.getElementById('improvementAreas').value,
                    suggestions: document.getElementById('suggestions').value,
                    contactInfo: document.getElementById('contactInfo').value,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };
                
                try {
                    // 這裡可以發送到實際的後端 API
                    // 目前模擬成功提交
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // 顯示成功消息
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    
                    // 重置表單
                    feedbackForm.reset();
                    ratingOptions.forEach(opt => opt.classList.remove('selected'));
                    
                    // 3秒後隱藏成功消息
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                    
                } catch (error) {
                    console.error('Error submitting feedback:', error);
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                } finally {
                    // 恢復提交按鈕
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 提交反饋';
                }
            });
        });
    </script>
</body>
</html>
