<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible 100 Steps Four Treasures - 中文版</title>
  <style type="text/css">
    body { 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft YaHei", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
      background:#f6f7fb; 
      font-size: 12px;
    }
    
    /* Topbar */
    .topbar { 
      position: fixed; 
      top:0; 
      left:0; 
      right:0; 
      height:55px; 
      background:#0b5fa5; 
      color:#fff; 
      border-bottom:3px solid #2aa5ff; 
      z-index:999; 
    }
    
    .topbar-inner { 
      display: table; 
      width:100%; 
      height:55px; 
    }
    
    .brand { 
      display: table-cell; 
      vertical-align: middle; 
      padding-left:14px; 
      font-weight:bold; 
      font-size:13px; 
    }
    
    .lang { 
      display: table-cell; 
      vertical-align: middle; 
      text-align:right; 
      padding-right:10px; 
    }
    
    .lang a {
      display:inline-block;
      margin:0 2px;
      padding:4px 6px;
      background:#d9e9fb;
      color:#0b5fa5;
      border:1px solid #9cc3f5;
      text-decoration:none;
      border-radius:3px;
      font-weight:bold;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    
    .lang a.active {
      background:#4a90e2;
      color:#fff;
      border-color:#4a90e2;
    }
    
    .lang a:hover {
      background:#c7dcf6;
      color:#0b5fa5;
      transform: translateY(-1px);
    }
    
    .ai-tools-link {
      display: inline-block;
      margin: 0 10px;
      padding: 8px 16px;
      background: #ff6b6b;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 11px;
      transition: all 0.3s ease;
    }
    
    .ai-tools-link:hover {
      background: #ff5252;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    
    .school-management-link {
      display: inline-block;
      margin: 0 10px;
      padding: 8px 16px;
      background: #00b894;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 11px;
      transition: all 0.3s ease;
    }
    
    .school-management-link:hover {
      background: #00a085;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
    }

    /* Main area with 2 iframes */
    .main { 
      margin-top: 55px; 
    }
    
    table.layout { 
      width: 100%; 
      height: calc(100vh - 55px); 
      border-collapse: collapse; 
      table-layout: fixed; 
    }
    
    td.left { 
      width: 200px; /* ???????sidebar?? */
      background: #eef6ff; 
      border-right: 2px solid #2aa5ff; 
      vertical-align: top; 
    }
    
    td.right { 
      vertical-align: top; 
    }
    
    iframe { 
      border: 0; 
      width: 100%; 
      height: 100%; 
    }
    
    #sidebarFrame { 
      background: #eef6ff; 
    }
    
    #contentFrame { 
      background: #ffffff; 
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      .brand {
        font-size: 11px;
        padding-left: 10px;
      }
      
      .lang a {
        padding: 3px 5px;
        margin: 0 1px;
        font-size: 10px;
      }
      
      td.left {
        width: 180px;
      }
      
      .topbar-inner {
        height: 45px;
      }
      
      .topbar {
        height: 45px;
      }
      
      .main {
        margin-top: 45px;
      }
      
      table.layout {
        height: calc(100vh - 45px);
      }
    }
    
    @media (max-width: 480px) {
      .brand {
        font-size: 10px;
        padding-left: 6px;
      }
      
      .lang a {
        padding: 2px 4px;
        margin: 0 1px;
        font-size: 9px;
      }
      
      td.left {
        width: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">聖經百步四寶 Bible 100 Steps Four Treasures - 中文版</div>
      <div class="lang">
        <a href="#" data-lang="cn">中文 (CN)</a>
        <a href="#" data-lang="en">English (EN)</a>
        <a href="#" data-lang="vi">Tiếng Việt (VN)</a>
        <a href="#" data-lang="id">Bahasa Indonesia (ID)</a>
        <a href="#" data-lang="ch">Children's (CH)</a>
        <a href="#" data-lang="ad">Advanced (AD)</a>
        <a href="#" data-lang="kh">ភាសាខ្មែរ (KH)</a>
        <a href="#" data-lang="lo">ພາສາລາວ (LO)</a>
        <a href="#" data-lang="my">မြန်မာ (MY)</a>
        <a href="#" class="school-management-link">學校管理</a>
        <a href="../ai_development/tools/index.html" target="_blank" class="ai-tools-link">AI 工具</a>
      </div>
    </div>
  </div>

  <div class="main">
    <table class="layout">
      <tr>
        <td class="left">
          <iframe id="sidebarFrame" name="sidebarFrame" title="Sidebar"></iframe>
        </td>
        <td class="right">
          <iframe id="contentFrame" name="contentFrame" title="Content"></iframe>
        </td>
      </tr>
    </table>
  </div>

  <script type="text/javascript">
    // Map language to page and default landing page
    var langMap = {
      cn: { page: 'index_cn.html', first: 'landP_cn.html' },
      en: { page: 'index_en.html', first: 'landP_en.html' },
      vi: { page: 'index_vi.html', first: 'landP_vi.html' },
      id: { page: 'index_id.html', first: 'landP_id.html' },
      ch: { page: 'index_ch.html', first: 'landP_ch.html' },
      ad: { page: 'index_ad.html', first: 'landP_ad.html' },
      kh: { page: 'index_kh.html', first: 'landP_kh.html' },
      lo: { page: 'index_lo.html', first: 'landP_lo.html' },
      my: { page: 'my/index.html', first: 'my/index.html' }
    };

    function setActive(lang) {
      var links = document.querySelectorAll('.lang a');
      for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute('data-lang') === lang) {
          links[i].className = 'active';
        } else {
          links[i].className = '';
        }
      }
    }

    function switchLanguage(lang) {
      var info = langMap[lang];
      if (!info) return;
      setActive(lang);
      
      // Load sidebar page
      var sf = document.getElementById('sidebarFrame');
      sf.src = info.page + '?mode=sidebar';
      
      // Load the landing page for this language
      document.getElementById('contentFrame').src = info.first;
    }

    // Wire up topbar clicks
    function initTopbar() {
      var links = document.querySelectorAll('.lang a');
      for (var i = 0; i < links.length; i++) {
        var link = links[i];
        link.onclick = function(ev) {
          ev.preventDefault();
          var lang = this.getAttribute('data-lang');
          if (lang) {
            switchLanguage(lang);
          } else if (this.classList.contains('school-management-link')) {
            openSchoolManagement();
          } else if (this.classList.contains('ai-tools-link')) {
            openAITools();
          }
        };
      }
    }
    
    // AI 工具
    function openAITools() {
      // 打開 AI 工具
      window.open('../ai_development/tools/index.html', '_blank', 'width=1200,height=800');
    }
    
    // 學校管理
    function openSchoolManagement() {
      // 打開學校管理系統
      window.open('school_management/index.html', '_blank', 'width=1400,height=900');
    }

    // 初始化頁面
    function initPage() {
      console.log('初始化頁面...');
      
      // 初始化頂部欄
      initTopbar();
      
      // 設置 iframe 載入處理器
      var sidebarFrame = document.getElementById('sidebarFrame');
      var contentFrame = document.getElementById('contentFrame');
      
      sidebarFrame.onload = function() {
        console.log('Sidebar iframe 載入完成');
      };
      
      contentFrame.onload = function() {
        console.log('Content iframe 載入完成');
      };
      
      // Default language: CN (Chinese) - 默認中文
      console.log('默認語言: CN');
      switchLanguage('cn');
    }

    // 等待 DOM 載入完成
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
  <div id="global-tools-root"></div>
  <script src="../js/global-tools.js"></script>
</body>
</html>
