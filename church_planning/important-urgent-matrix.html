<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重要 vs 緊急矩陣</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <header class="mb-5">
      <p class="text-xs font-semibold text-indigo-700"><a class="underline" href="assessment-os-hub.html">CTA-OS 分層中心</a> · <a class="underline" href="cta-os-tool-report.html?tool=urgent">統一報告中心</a></p>
      <h1 class="text-2xl md:text-3xl font-black mt-2">重要 vs 緊急矩陣（Eisenhower）</h1>
      <p class="text-sm text-slate-600 mt-2">用於降低同工過載，提升 Q2（重要不緊急）投入比例，建立可持續服事節奏。</p>
    </header>
    <div class="flex flex-wrap gap-2 mb-4">
      <button class="px-3 py-2 rounded-lg bg-indigo-700 text-white text-sm" onclick="switchTab('intro')">① 理念與說明</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('survey')">② 開始測評</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('report')">③ 分析報告</button>
    </div>
    <section id="tab-intro" class="rounded-xl border bg-white p-4 text-sm">建議題量 12-16 題，目標不是效率崇拜，而是為靈修、門訓、家庭與長期使命保留 Q2 時段。</section>
    <section id="tab-survey" class="hidden rounded-xl border bg-white p-4 text-sm space-y-2">
      <label class="block border rounded p-2">我每週固定安排重要不緊急（Q2）時段。<input data-q="u1" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="2"></label>
      <label class="block border rounded p-2">我能分辨他人的緊急，不一定是我的優先。<input data-q="u2" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="3"></label>
      <label class="block border rounded p-2">我會把靈修與家庭放入重要清單，而非剩餘時間。<input data-q="u3" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="3"></label>
      <button class="px-3 py-2 rounded border text-sm" onclick="generateOsReport()">生成 CTA-OS 報告</button>
    </section>
    <section id="tab-report" class="hidden rounded-xl border bg-white p-4 text-sm space-y-3">
      <p>當前象限分布：Q1 45% / Q2 18% / Q3 25% / Q4 12%。建議：未來 4 週將 Q2 提升到 30%，先從每週兩個 90 分鐘深工時段開始。</p>
      <pre id="osReport" class="hidden text-xs bg-slate-100 p-2 rounded whitespace-pre-wrap"></pre>
      <div class="flex flex-wrap gap-2">
        <button class="px-3 py-2 rounded border" onclick="window.print()">🖨️ 打印 / 導出 PDF</button>
        <button class="px-3 py-2 rounded border" onclick="copyText()">💬 複製純文字報告</button>
        <button class="px-3 py-2 rounded border" onclick="location.reload()">🔄 清除數據並重新測試</button>
      </div>
    </section>
  </main>
  <script src="js/cta_os_runtime.js"></script>
  <script src="js/cta_os_item_packs.js"></script>
  <script src="js/cta_os_bridge.js"></script>
  <script>
    function switchTab(id){['intro','survey','report'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden',k!==id));}
    function generateOsReport(){ window.__CTAOS_generate(); switchTab('report'); }
    function copyText(){
      var pre = document.querySelector('.cta-os-report-panel [data-cta-field="plain-text"]');
      if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.textContent || '');
    }
    CTAOSBridge.initPage({ toolId: 'urgent', reportAnchor: '#tab-report', fab: false });
  </script>
</body>
</html>
