<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>80/20 事工精簡</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h1 class="text-xl font-bold">Ministry 80/20 Slasher</h1>
        <a class="text-sm text-blue-700 hover:underline" href="dashboard.html">返回 Dashboard</a>
      </div>
      <p class="text-sm text-slate-600 mt-2">孤兒目標（未連結 SWOT）會自動標記為「優先精簡候選」。</p>
    </header>

    <section class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <h2 class="font-semibold mb-2">候選清單</h2>
      <div id="goal-list" class="space-y-2"></div>
    </section>

    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <h2 class="font-semibold">精簡預覽</h2>
        <button id="btn-apply" class="px-3 py-1.5 rounded bg-red-600 text-white text-sm font-semibold">標記為 backlog（建議精簡）</button>
      </div>
      <pre id="preview" class="bg-slate-900 text-slate-100 text-xs rounded p-3 overflow-auto max-h-80"></pre>
    </section>
  </main>

  <script src="planning/assets/pipeline.js"></script>
  <script>
    (function () {
      var P = window.LongTermPipeline;
      var state = P.loadGoals();
      var goals = Array.isArray(state.goals) ? state.goals : [];
      var validated = P.validateGoalRefs ? P.validateGoalRefs() : goals;
      var vMap = {};
      validated.forEach(function (g) { if (g && g.id) vMap[g.id] = g; });
      var checked = {};

      function esc(v) {
        var d = document.createElement("div");
        d.textContent = String(v == null ? "" : v);
        return d.innerHTML;
      }

      function render() {
        var list = document.getElementById("goal-list");
        list.innerHTML = goals.map(function (g, idx) {
          var v = vMap[g.id] || {};
          var orphan = !!v._isOrphaned || !g.swotRef;
          var tag = orphan
            ? '<span class="ml-2 inline-flex items-center rounded-full border border-red-200 bg-red-50 text-red-700 px-2 py-0.5 text-xs font-bold">ORPHANED_REF · 優先精簡候選</span>'
            : '<span class="ml-2 inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 text-emerald-700 px-2 py-0.5 text-xs font-bold">已關聯</span>';
          return (
            '<label class="block border rounded p-2 ' + (orphan ? "border-red-300 bg-red-50/40" : "border-slate-200 bg-white") + '">' +
            '<input type="checkbox" class="mr-2 g-check" data-id="' + esc(g.id) + '"' + (checked[g.id] ? " checked" : "") + ">" +
            "<strong>" + esc(g.title || ("目標 " + (idx + 1))) + "</strong>" + tag +
            '<div class="text-xs text-slate-500 mt-1">狀態：' + esc(g.status || "backlog") + " · SWOT：" + esc(g.swotRef ? (g.swotRef.quadrant + ":" + g.swotRef.itemId) : "—") + "</div>" +
            "</label>"
          );
        }).join("");

        Array.prototype.forEach.call(document.querySelectorAll(".g-check"), function (el) {
          el.addEventListener("change", function () {
            checked[el.dataset.id] = !!el.checked;
            renderPreview();
          });
        });
        renderPreview();
      }

      function renderPreview() {
        var selected = goals.filter(function (g) { return checked[g.id]; })
          .map(function (g) {
            return {
              id: g.id,
              title: g.title || "",
              fromStatus: g.status || "backlog",
              toStatus: "backlog",
              reason: "80/20_slasher_candidate"
            };
          });
        document.getElementById("preview").textContent = JSON.stringify(selected, null, 2);
      }

      document.getElementById("btn-apply").addEventListener("click", function () {
        var changed = 0;
        goals.forEach(function (g) {
          if (checked[g.id]) {
            g.status = "backlog";
            changed += 1;
          }
        });
        P.saveGoals({ goals: goals });
        if (window.ChurchDataBridge && typeof window.ChurchDataBridge.onGoalsUpdated === "function") {
          try { window.ChurchDataBridge.onGoalsUpdated(goals, { source: "ministry-8020-slasher" }); } catch (e) {}
        }
        alert("已套用精簡建議，共 " + changed + " 項。");
        location.reload();
      });

      render();
    })();
  </script>
</body>
</html>
