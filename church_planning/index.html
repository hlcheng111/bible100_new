<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>教會規劃 - Church Planning</title>
  <link rel="stylesheet" href="../css/module_shell.css">
</head>
<body class="module-shell">
  <!-- 總站 index_v5：請用 openChurchPlanningHub() 載入「外層 sidebar_plan + index_plan」，勿將本頁再嵌入總站 contentFrame。規範：.cursor/rules/bible100-index-shell-sidebar.mdc -->
  <header class="shell-toolbar" role="banner">
    <button type="button" id="shellMenuBtn" class="shell-menu-btn" aria-controls="shellSidebarWrap"
      aria-expanded="false" aria-label="開啟導覽選單">☰</button>
    <span class="shell-title">教會規劃 Planning</span>
    <a href="../index_v5.html" class="shell-home-link" id="shellHomeLink">總站</a>
  </header>

  <div id="shellBackdrop" class="shell-backdrop" hidden aria-hidden="true"></div>

  <div class="shell-body">
    <div id="shellSidebarWrap" class="shell-sidebar-wrap">
      <iframe id="sidebarFrame" title="教會規劃側欄" src="sidebar_plan.html"></iframe>
    </div>
    <!-- TODO: 圖解建議：橫列旁小圖—規劃調查 → 事奉人力盤點 -->
    <div class="shell-main">
      <nav class="shell-landing-hint" aria-label="教會規劃快速導覽">
        <strong>規劃：</strong>
        <a href="index_plan.html" target="contentFrame">主索引</a>
        <span class="shell-hint-sep">·</span>
        <a href="assessment-os-hub.html" target="contentFrame">CTA-OS 分層中心</a>
        <span class="shell-hint-sep">·</span>
        <a href="church-planning-index.html" target="contentFrame">Landing 總覽</a>
        <span class="shell-hint-sep">·</span>
        <a href="planning-user-guide.html" target="contentFrame">使用說明</a>
        <span class="shell-hint-sep">·</span>
        <a href="planning/raci-reflection.html" target="contentFrame">RACI 反思</a>
        <span class="shell-hint-sep">|</span>
        <strong>事奉人力：</strong>
        <a href="../smart_ministry/landing.html" target="_top">智慧事奉路線圖</a>
        <span class="shell-hint-sep">·</span>
        <a href="../smart_ministry/guide_for_leaders.html" target="_top">同工指南</a>
      </nav>
      <div class="shell-content">
        <iframe id="contentFrame" name="contentFrame" title="教會規劃內容" src="index_plan.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function bust(url) {
        if (!url) return url;
        var sep = url.indexOf('?') >= 0 ? '&' : '?';
        return url + sep + 'v=' + Date.now();
      }

      function loadContentInFrame(url) {
        var iframe = document.getElementById('contentFrame');
        if (iframe && url) iframe.src = bust(url);
      }

      function shouldUseContentOnlyMode() {
        try {
          var params = new URLSearchParams(window.location.search || '');
          return params.get('shell') === 'content-only' || params.get('contentOnly') === '1';
        } catch (err) {
          return false;
        }
      }

      function checkIfInIframe() {
        if (window !== window.top && shouldUseContentOnlyMode()) {
          document.body.classList.add('in-iframe');
        }
      }

      window.addEventListener('message', function (event) {
        var d = event.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'navigate' && d.url) {
          loadContentInFrame(d.url);
          return;
        }
        if (d.type === 'bible100-shell') {
          var sb = d.sidebarUrl || '';
          var cf = d.contentUrl || '';
          var sbf = document.getElementById('sidebarFrame');
          var cff = document.getElementById('contentFrame');
          if (sb && sbf) sbf.src = bust(sb);
          if (cf && cff) cff.src = bust(cf);
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        checkIfInIframe();
        var frame = document.getElementById('contentFrame');
        var sb = document.getElementById('sidebarFrame');
        if (sb && sb.src.indexOf('?') < 0 && sb.src.indexOf('sidebar_plan.html') >= 0) {
          sb.src = bust('sidebar_plan.html');
        }
        window.loadContent = function (url) {
          if (url && frame) frame.src = bust(url);
        };
        var home = document.getElementById('shellHomeLink');
        if (home && window !== window.top) {
          home.setAttribute('target', '_top');
        }
      });
    })();
  </script>
  <script src="../js/module_shell.js"></script>
  <script src="../js/shell_contract.js"></script>
  <script>
    if (window.B100ShellContract && typeof window.B100ShellContract.validate === 'function') {
      window.B100ShellContract.validate('church_planning/index.html');
    }
  </script>
  <div id="global-tools-root"></div>
  <script src="../js/global-tools.js"></script>
</body>
</html>
