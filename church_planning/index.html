<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1;url=index_plan.html">
  <title>教會規劃 · 正在前往新版 OS…</title>
  <script>
    (function () {
      var TARGET = 'index_plan.html';
      try {
        if (window.parent !== window) {
          if (window.parent.openChurchPlanningHub) {
            window.parent.openChurchPlanningHub();
            return;
          }
          if (window.parent.document && window.parent.document.getElementById('contentFrame')) {
            window.parent.location.replace(TARGET);
            return;
          }
        }
      } catch (eIframe) { /* cross-origin */ }
      window.setTimeout(function () {
        window.location.replace(TARGET);
      }, 500);
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", "Noto Sans TC", sans-serif; background: linear-gradient(160deg, #fffbeb 0%, #eff6ff 50%, #ecfdf5 100%); }
    .portal { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
    .portal__card { max-width: 28rem; padding: 24px 22px; border-radius: 16px; border: 2px solid #fcd34d; background: #fff; box-shadow: 0 8px 32px rgba(15,23,42,0.1); text-align: center; }
    .portal__title { margin: 0 0 10px; font-size: 1.1rem; color: #0f172a; line-height: 1.5; }
    .portal__cta { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: linear-gradient(135deg, #1e40af, #4338ca); color: #fff; font-weight: 800; text-decoration: none; }
    .portal__note { margin: 12px 0 0; font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="portal" role="status" aria-live="polite">
    <div class="portal__card">
      <p class="portal__title">📢 為了提供更好的三層大腦體驗，本規劃巢狀殼已升級！正在為您開啟新版 5F 規劃戰情室…</p>
      <a class="portal__cta" href="index_plan.html">👉 若未自動跳轉，請點此進入 index_plan</a>
      <p class="portal__note">舊書籤仍可用 · 0.5 秒後自動前往 · 總站請用 openChurchPlanningHub()</p>
    </div>
  </div>
