<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAT Smoke Runner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <h1 class="text-xl font-bold">Bible100 V1.0 Smoke Runner</h1>
      <p class="text-sm text-slate-600 mt-2">一鍵注入 A1→B1→B3→B4→C 測試資料，並檢查核心 key 是否就緒。</p>
    </header>
    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <label class="block text-sm mb-1">church_id</label>
      <input id="cid" class="w-full border rounded px-3 py-2 text-sm" value="default">
      <div class="mt-3 flex gap-2 flex-wrap">
        <button id="seed" class="px-3 py-2 rounded bg-violet-600 text-white text-sm font-semibold">1) 注入模擬資料</button>
        <button id="check" class="px-3 py-2 rounded bg-emerald-600 text-white text-sm font-semibold">2) 執行檢查</button>
      </div>
      <ul id="result" class="mt-4 space-y-2 text-sm"></ul>
      <div class="mt-4 text-sm space-x-3">
        <a href="pdca-planning.html" class="text-blue-700 hover:underline">開啟 PDCA</a>
        <a href="dashboard.html" class="text-blue-700 hover:underline">開啟戰情室</a>
        <a href="chain-link-validator.html" class="text-blue-700 hover:underline">鏈路驗證器</a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      function nkey(cid, base) { return "chp2026_" + cid + "_" + base; }
      function li(ok, txt) {
        return "<li class='border rounded p-2 " + (ok ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200") + "'>" +
          (ok ? "✅ " : "❌ ") + txt + "</li>";
      }
      function seed() {
        var cid = String(document.getElementById("cid").value || "default").trim() || "default";
        localStorage.setItem("chp2026-health-result", JSON.stringify({
          overallNormalized: 2.7,
          weakest: ["community", "leadership"],
          healthScores: { leadership: 2.0, finance: 2.3, worship: 3.1, truth: 2.9, service: 2.6, community: 2.4, witness: 2.8 }
        }));
        localStorage.setItem("chp2026-a1-health-results", JSON.stringify({ memberSignals: { serviceSatisfaction: 2.5 } }));
        localStorage.setItem("chp2026-swot-v1", JSON.stringify({ version: 1, strengths: [], weaknesses: [{ id: "w1", text: "社群薄弱" }], opportunities: [], threats: [{ id: "t1", text: "同工耗損" }] }));
        localStorage.setItem("chp2026-smart-v1", JSON.stringify({ version: 1, goals: [{ id: "g1", title: "3個月提升小組出席20%", smart: { m: "20%", a: "high" }, swotRef: { quadrant: "T", itemId: "t1" } }] }));
        localStorage.setItem("chp2026_default_goals", JSON.stringify([{ id: "g1", title: "3個月提升小組出席20%", smart: { m: "20%", a: "high" }, swotRef: { quadrant: "T", itemId: "t1" } }]));
        localStorage.setItem("chp2026-pdca-log", JSON.stringify({ version: 1, cycles: [] }));
        localStorage.setItem("chp2026-pdca-snapshots", JSON.stringify([{ date: new Date().toISOString().slice(0, 10), overall: 2.7, serviceSat: 2.5, planTarget: 20, actualMetric: 10 }]));
        localStorage.setItem(nkey(cid, "longTermPlanning_step0"), JSON.stringify({ healthScores: { leadership: 2.0, community: 2.4, truth: 2.9 } }));
        localStorage.setItem(nkey(cid, "longTermPlanning_swot"), JSON.stringify({ items: [{ id: "t1", quadrant: "T", text: "同工耗損" }] }));
        localStorage.setItem(nkey(cid, "longTermPlanning_goals"), JSON.stringify({ goals: [{ id: "g1", title: "提升出席", swotRef: { quadrant: "T", itemId: "t1" } }] }));
        if (!localStorage.getItem("memberSystemData")) {
          localStorage.setItem("memberSystemData", JSON.stringify({ members: [{ id: 1, name: "同工甲", training_credits: 2, skills: "關懷,帶領", notes: "" }], attendance: [{ memberId: 1, present: true }] }));
        }
      }
      function check() {
        var cid = String(document.getElementById("cid").value || "default").trim() || "default";
        var checks = [
          ["A1", !!localStorage.getItem("chp2026-health-result")],
          ["A1 service satisfaction", !!localStorage.getItem("chp2026-a1-health-results")],
          ["B1 SWOT", !!localStorage.getItem("chp2026-swot-v1")],
          ["B3 SMART", !!localStorage.getItem("chp2026-smart-v1") || !!localStorage.getItem("chp2026_default_goals")],
          ["B4 PDCA log", !!localStorage.getItem("chp2026-pdca-log")],
          ["B4 snapshot", !!localStorage.getItem("chp2026-pdca-snapshots")],
          ["C member SSOT", !!localStorage.getItem("memberSystemData")],
          ["Namespaced step0", !!localStorage.getItem(nkey(cid, "longTermPlanning_step0"))],
          ["Namespaced goals", !!localStorage.getItem(nkey(cid, "longTermPlanning_goals"))]
        ];
        document.getElementById("result").innerHTML = checks.map(function (c) { return li(c[1], c[0]); }).join("");
      }
      document.getElementById("seed").addEventListener("click", function () { seed(); check(); });
      document.getElementById("check").addEventListener("click", check);
    })();
  </script>
</body>
</html>
