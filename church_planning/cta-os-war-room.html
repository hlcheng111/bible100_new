<body class="bg-slate-50">
  <div class="cta-war-room">
    <div id="planning-zone-rail-top" style="padding:0 1rem;margin-top:0.75rem;"></div>
    <header class="wr-hero">
      <h1>📊 健康雷達戰情室</h1>
      <p style="margin:0;font-size:0.9rem;opacity:0.95;">
        長執開會用的<strong>六維總成績單</strong>（不是填表頁）。
        <a href="dashboard.html" onclick="return planningOpenContent(event,'dashboard.html');" style="color:#e0e7ff;text-decoration:underline;">規劃 KPI 數據盤</a>
        看執行進度；本頁看六維破口。
      </p>
    </header>

    <details class="planning-guide-box" style="margin:0 1rem 1rem;">
      <summary style="cursor:pointer;font-weight:800;">💡 給帶領者 · 六維說明（可選）</summary>
      <p><strong>👥 適合誰：</strong> 主任牧師、長執會——<em>不是</em>給會友填表的頁面。</p>
      <p><strong>🎯 怎麼用：</strong> 先填至少一份量表 → 按「掃描本機各工具分數」→ 看雷達與風險。</p>
      <p><strong>核心六維度（P/S/G/C/R/F）：</strong> P 牧養、S 屬靈、G 治理、C 能力、R 團隊、F 果效。</p>
      <p style="font-size:12px;color:#0369a1;background:#f0f9ff;padding:8px 10px;border-radius:8px;border:1px solid #bae6fd;margin:0;">
        ⚠️ 供禱告與議程排序，不作人事考核。詳細導讀 →
        <a href="guides/guide_step4_ctv.html" onclick="return planningOpenContent(event,'guides/guide_step4_ctv.html');">步驟 4 健康雷達</a>
      </p>
    </details>

    <div id="war-room-root"></div>
    <div id="planning-zone-rail-bottom" style="padding:0 1rem 1rem;"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.PlanningZoneRail) PlanningZoneRail.boot({ force: true });
      var root = document.getElementById("war-room-root");
      if (window.CTAOSWarRoom) {
        window.CTAOSWarRoom.scanAndMount(root);
      }
    });
