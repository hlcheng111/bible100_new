<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1.5 同工專業審查</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h1 class="text-xl font-bold">A1.5 同工專業審查</h1>
        <a href="../dashboard.html" class="px-3 py-2 rounded border text-sm">回戰情室</a>
      </div>
      <p class="text-sm text-slate-600 mt-2">面談用工具：恩賜與現職對照、負載預警、建議回寫至 CentralMemberDB notes。</p>
    </header>

    <section class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <label class="block text-sm mb-1 font-semibold">選擇同工</label>
      <select id="member" class="w-full border rounded px-3 py-2 text-sm"></select>
    </section>

    <section id="profile" class="bg-white border border-slate-200 rounded-xl p-4 mb-4"></section>

    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <h2 class="font-semibold mb-2">審查回寫</h2>
      <div class="grid md:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm mb-1">評價</label>
          <select id="rating" class="w-full border rounded px-3 py-2 text-sm">
            <option value="fit">適配良好</option>
            <option value="adjust">建議調整</option>
            <option value="rest">建議休息</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1">建議摘要</label>
          <input id="advice" class="w-full border rounded px-3 py-2 text-sm" placeholder="例如：由敬拜主領轉為培訓陪跑">
        </div>
      </div>
      <button id="save" class="mt-3 px-3 py-2 rounded bg-violet-600 text-white text-sm font-semibold">寫入 notes</button>
      <span id="status" class="text-sm text-slate-600 ml-2"></span>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/persistence_provider.js"></script>
  <script src="../js/church_data_bridge_phase1.js"></script>
  <script src="../js/central_member_db.js"></script>
  <script>
    (function () {
      if (!window.CentralMemberDB) return;
      var db = CentralMemberDB.get() || {};
      var members = Array.isArray(db.members) ? db.members : [];
      var assignments = Array.isArray(db.ministryAssignments) ? db.ministryAssignments : [];
      var ministries = Array.isArray(db.ministries) ? db.ministries : [];

      var sel = document.getElementById("member");
      sel.innerHTML = members.map(function (m) {
        return '<option value="' + m.id + '">' + esc(m.name) + " (#" + m.id + ")</option>";
      }).join("");

      function esc(v) {
        var d = document.createElement("div");
        d.textContent = String(v == null ? "" : v);
        return d.innerHTML;
      }

      function loadIndex(memberId) {
        var list = assignments.filter(function (a) { return Number(a.memberId) === Number(memberId); });
        return list.length;
      }

      function ministryNames(memberId) {
        var list = assignments.filter(function (a) { return Number(a.memberId) === Number(memberId); });
        return list.map(function (a) {
          var m = ministries.find(function (x) { return Number(x.id) === Number(a.ministryId); });
          return m ? m.name : ("事工#" + a.ministryId);
        });
      }

      function render() {
        var memberId = Number(sel.value);
        var m = members.find(function (x) { return Number(x.id) === memberId; });
        if (!m) return;
        var gifts = String(m.gifts || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean);
        var current = ministryNames(memberId);
        var idx = loadIndex(memberId);
        var overload = idx >= 4 || Number(m.Ministry_Load_Index || 0) >= 4;
        document.getElementById("profile").innerHTML =
          '<h2 class="font-semibold mb-2">事奉 360 視圖</h2>' +
          '<p class="text-sm"><strong>姓名：</strong>' + esc(m.name) + "</p>" +
          '<p class="text-sm mt-1"><strong>Gifts_Set：</strong>' + esc(gifts.join(", ") || "—") + "</p>" +
          '<p class="text-sm mt-1"><strong>現職：</strong>' + esc(current.join(", ") || "（目前無派工）") + "</p>" +
          '<p class="text-sm mt-1"><strong>Ministry_Load_Index：</strong>' + idx + "</p>" +
          (overload
            ? '<p class="mt-2 inline-block text-xs font-bold px-2 py-1 rounded border border-red-200 bg-red-50 text-red-700">OVERLOAD：建議調整或休息</p>'
            : '<p class="mt-2 inline-block text-xs font-bold px-2 py-1 rounded border border-emerald-200 bg-emerald-50 text-emerald-700">負載可控</p>');
      }

      sel.addEventListener("change", render);
      document.getElementById("save").addEventListener("click", function () {
        var memberId = Number(sel.value);
        var m = members.find(function (x) { return Number(x.id) === memberId; });
        if (!m) return;
        var rating = document.getElementById("rating").value;
        var advice = String(document.getElementById("advice").value || "").trim();
        var line = "[A1.5 " + new Date().toISOString().slice(0, 10) + "] " + rating + (advice ? "｜" + advice : "");
        m.notes = (m.notes ? String(m.notes) + "\n" : "") + line;
        db.members = members;
        var ok = CentralMemberDB.set(db);
        if (ok && window.ChurchDataBridge && typeof window.ChurchDataBridge.triggerDataSync === "function") {
          try { window.ChurchDataBridge.triggerDataSync("pastoral_professional_review_saved"); } catch (e) {}
        }
        document.getElementById("status").textContent = ok ? "已回寫到 CentralMemberDB notes" : "回寫失敗";
      });

      render();
    })();
  </script>
</body>
</html>
