<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>策略衝突報告</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h1 class="text-xl font-bold">Strategy Conflict Report</h1>
        <a class="text-sm text-blue-700 hover:underline" href="../dashboard.html">返回 Dashboard</a>
      </div>
      <p class="text-sm text-slate-600 mt-2">檢核目標的 SWOT 斷鏈與 Leadership 加權風險，避免過度樂觀決策。</p>
    </header>

    <section class="grid md:grid-cols-3 gap-3 mb-4" id="summary-cards"></section>
    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <h2 class="font-semibold mb-3">目標衝突明細</h2>
      <div id="list" class="space-y-3"></div>
    </section>
  </main>

  <script src="="../planning/assets/pipeline.js"></script>
  <script src="="../js/strategy_logic.js"></script>
  <script>
    (function () {
      var P = window.LongTermPipeline;
      var S = window.StrategyLogic;

      function esc(v) {
        var d = document.createElement("div");
        d.textContent = String(v == null ? "" : v);
        return d.innerHTML;
      }

      function loadHealthScores() {
        var s0 = P && P.loadStep0 ? P.loadStep0() : {};
        return (s0 && s0.healthScores) ? s0.healthScores : {};
      }

      function levelTag(text, cls) {
        return '<span class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-bold ' + cls + '">' + esc(text) + "</span>";
      }

      function render() {
        var state = P && P.loadGoals ? P.loadGoals() : { goals: [] };
        var goals = Array.isArray(state.goals) ? state.goals : [];
        var validated = P && P.validateGoalRefs ? P.validateGoalRefs() : goals;
        var vMap = {};
        (validated || []).forEach(function (g) {
          if (g && g.id) vMap[g.id] = g;
        });
        var healthScores = loadHealthScores();
        var leadership = Number(healthScores.leadership || 0);

        var orphanN = 0;
        var leadershipRiskN = 0;
        var conflictN = 0;

        var html = goals.map(function (g) {
          var v = vMap[g.id] || {};
          var orphan = !!v._isOrphaned;
          var orphanReason = v._orphanReason || "";
          if (orphan) orphanN += 1;

          var conflicts = (S && S.checkGoalConflicts) ? S.checkGoalConflicts(g, healthScores) : [];
          conflictN += conflicts.length;
          var confidence = (S && S.calculateConfidence) ? S.calculateConfidence(g, healthScores) : { status: "NORMAL" };
          if (confidence && confidence.status === "SKEPTICAL") leadershipRiskN += 1;

          var tags = [];
          if (orphan) tags.push(levelTag("ORPHANED_REF:" + (orphanReason || "unknown"), "bg-red-50 text-red-700 border-red-200"));
          if (confidence && confidence.status === "SKEPTICAL") tags.push(levelTag("執行力赤字風險", "bg-amber-50 text-amber-700 border-amber-200"));

          var conflictBlock = "";
          if (conflicts.length) {
            conflictBlock = '<ul class="list-disc pl-5 text-sm text-slate-700 mt-2">' +
              conflicts.map(function (c) { return "<li>" + esc(c.message) + "</li>"; }).join("") +
              "</ul>";
          }

          return (
            '<article class="border rounded-lg p-3 ' + (orphan ? "border-red-300 bg-red-50/40" : "border-slate-200") + '">' +
            '<div class="flex flex-wrap gap-2 items-center justify-between">' +
            "<h3 class=\"font-semibold\">" + esc(g.title || "（無標題）") + "</h3>" +
            '<div class="flex flex-wrap gap-1">' + tags.join("") + "</div>" +
            "</div>" +
            '<p class="text-xs text-slate-500 mt-1">A: ' + esc(g.smart && g.smart.a ? g.smart.a : "—") +
            " · SWOT: " + esc(g.swotRef ? (g.swotRef.quadrant + ":" + g.swotRef.itemId) : "—") + "</p>" +
            conflictBlock +
            "</article>"
          );
        }).join("");

        document.getElementById("list").innerHTML = html || '<p class="text-sm text-slate-500">尚無目標資料。</p>';
        document.getElementById("summary-cards").innerHTML =
          '<div class="bg-white border border-slate-200 rounded-lg p-3"><div class="text-xs text-slate-500">Leadership 分數</div><div class="text-2xl font-bold">' + (isFinite(leadership) ? leadership : "—") + "</div></div>" +
          '<div class="bg-white border border-slate-200 rounded-lg p-3"><div class="text-xs text-slate-500">ORPHANED_REF</div><div class="text-2xl font-bold text-red-700">' + orphanN + "</div></div>" +
          '<div class="bg-white border border-slate-200 rounded-lg p-3"><div class="text-xs text-slate-500">衝突提示總數</div><div class="text-2xl font-bold text-amber-700">' + (conflictN + leadershipRiskN) + "</div></div>";

        if (window.ChurchDataBridge && typeof window.ChurchDataBridge.onRiskDetected === "function" && (orphanN > 0 || leadershipRiskN > 0)) {
          try {
            window.ChurchDataBridge.onRiskDetected("strategy-conflict", { orphanN: orphanN, leadershipRiskN: leadershipRiskN });
          } catch (e) {}
        }
      }

      render();
    })();
  </script>
</body>
</html>
