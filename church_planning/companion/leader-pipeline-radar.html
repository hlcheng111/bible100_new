<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>領袖 Pipeline 雷達</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h1 class="text-xl font-bold">Leader Pipeline Radar</h1>
        <a class="text-sm text-blue-700 hover:underline" href="../dashboard.html">返回 Dashboard</a>
      </div>
      <p class="text-sm text-slate-600 mt-2">顯示 Step0 九維健康指標，並呈現本機可用的 Pipeline 階段人數摘要。</p>
    </header>

    <section class="grid md:grid-cols-2 gap-4">
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <h2 class="font-semibold mb-2">Step0 健康雷達</h2>
        <canvas id="radar" height="280"></canvas>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <h2 class="font-semibold mb-2">Pipeline 階段人數</h2>
        <div id="pipeline-summary" class="space-y-2"></div>
      </div>
    </section>
  </main>

  <script src="="../planning/assets/pipeline.js"></script>
  <script>
    (function () {
      var P = window.LongTermPipeline;
      var step0 = P.loadStep0();
      var hs = step0 && step0.healthScores ? step0.healthScores : {};
      var labels = [
        ["leadership", "領導"],
        ["mission", "使命"],
        ["finance", "財務"],
        ["culture", "文化"],
        ["tech", "科技"],
        ["worship", "敬拜"],
        ["fellowship", "相交"],
        ["discipleship", "門訓"],
        ["evangelism", "福音"]
      ];
      var points = labels.map(function (x) {
        var n = Number(hs[x[0]]);
        return Number.isFinite(n) ? n : 3;
      });

      new Chart(document.getElementById("radar"), {
        type: "radar",
        data: {
          labels: labels.map(function (x) { return x[1]; }),
          datasets: [{
            label: "健康評分",
            data: points,
            fill: true,
            backgroundColor: "rgba(37,99,235,0.18)",
            borderColor: "rgb(37,99,235)",
            pointBackgroundColor: "rgb(37,99,235)"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: { min: 1, max: 5, ticks: { stepSize: 1 } }
          }
        }
      });

      function readPipelineSummary() {
        var keys = [
          "church_pipeline_member_summary",
          "chp2026-member-pipeline-summary",
          "leader_pipeline_summary"
        ];
        for (var i = 0; i < keys.length; i++) {
          try {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") return parsed;
          } catch (e) {}
        }
        return null;
      }

      var box = document.getElementById("pipeline-summary");
      var summary = readPipelineSummary();
      if (!summary) {
        box.innerHTML = '<p class="text-sm text-slate-500">尚無會友 Pipeline 統計摘要。可先由 ChurchDataBridge 寫入 `church_pipeline_member_summary`。</p>';
      } else {
        var rows = Object.keys(summary).map(function (k) {
          var v = Number(summary[k]);
          return '<div class="flex items-center justify-between border rounded p-2 border-slate-200"><span class="text-sm">' + k + '</span><span class="font-bold">' + (Number.isFinite(v) ? v : 0) + "</span></div>";
        }).join("");
        box.innerHTML = rows || '<p class="text-sm text-slate-500">摘要格式為空。</p>';
      }
    })();
  </script>
</body>
</html>
