<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨部門風險摘要｜教會規劃</title>
  <link rel="stylesheet" href="css/planning_guide_shared.css">
  <script src="../js/shell_nav.js"></script>
  <script src="js/planning_tool_registry.js"></script>
  <script src="js/planning_nav.js"></script>
  <script src="js/assessment_run_store.js"></script>
  <style>
    body { font-family: "Noto Sans TC", "Microsoft YaHei", sans-serif; background: #f8fafc; margin: 0; padding: 16px; color: #1e293b; font-size: 13px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; font-size: 12px; }
    th { background: #f1f5f9; font-weight: 700; }
    .risk-high { color: #b91c1c; font-weight: 700; }
    .risk-mid { color: #c2410c; }
    .empty { padding: 24px; text-align: center; color: #64748b; background: #fff; border-radius: 8px; border: 1px dashed #cbd5e1; }
    .actions { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions a { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: #0f766e; color: #fff; text-decoration: none; font-weight: 600; }
    .actions a.ghost { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <p style="font-size:11px;margin:0 0 8px;">
      <a href="#" onclick="return planningOpenContent(event,'guides/guide_step4_ctv.html');">← 步驟 4 導覽</a> ·
      <a href="#" onclick="return planningOpenContent(event,'cta-os-war-room.html');">戰情室</a>
    </p>
    <h1>📋 跨部門風險摘要（輕量表）</h1>
    <p style="margin:0 0 12px;line-height:1.55;color:#475569;">
      從本機量表紀錄（<code>AssessmentRunStore</code>）彙整<strong>風險旗標</strong>與<strong>低真實度分數</strong>，
      供長執開會排序議程——<em>非人事考核</em>。完整六維圖請到
      <a href="#" onclick="return planningOpenContent(event,'cta-os-war-room.html');">健康雷達戰情室</a>。
    </p>
    <div class="actions">
      <a href="#" onclick="return planningOpenContent(event,'cta-os-war-room.html');">↗ 開戰情室掃描</a>
      <a href="#" class="ghost" onclick="return planningOpenContent(event,'assessment-os-hub.html');">去健康診斷中心補填</a>
    </div>
    <div id="riskHost"><p class="empty">載入中…</p></div>
  </main>
  <script>
    (function () {
      var host = document.getElementById("riskHost");
      if (!host || !window.AssessmentRunStore) {
        if (host) host.innerHTML = '<p class="empty">AssessmentRunStore 未載入</p>';
        return;
      }
      var runs = AssessmentRunStore.listRuns(null, 80) || [];
      if (!runs.length) {
        host.innerHTML =
          '<p class="empty">尚無量表紀錄。請先到「健康診斷中心」完成 2～3 項評估，再回此頁查看風險摘要。</p>';
        return;
      }
      var rows = runs.map(function (r) {
        var flags = Array.isArray(r.risk_flags) ? r.risk_flags : [];
        var score = r.authenticity_score;
        var level = "—";
        if (score != null && score < 0.5) level = '<span class="risk-high">高</span>';
        else if (score != null && score < 0.75) level = '<span class="risk-mid">中</span>';
        else if (score != null) level = "低";
        var flagText = flags.length ? flags.join("、") : "（無旗標）";
        var ts = r.timestamp ? new Date(r.timestamp).toLocaleString("zh-TW") : "—";
        return "<tr><td>" + (r.tool_id || "—") + "</td><td>" + ts + "</td><td>" +
          (score != null ? score : "—") + "</td><td>" + level + "</td><td>" + flagText + "</td></tr>";
      }).join("");
      host.innerHTML =
        '<table><thead><tr><th>工具</th><th>時間</th><th>真實度</th><th>風險</th><th>旗標</th></tr></thead><tbody>' +
        rows + "</tbody></table>" +
        '<p style="font-size:11px;color:#64748b;margin-top:10px;">共 ' + runs.length +
        ' 筆最近紀錄 · 僅供禱告與議程排序</p>';
    })();
  </script>
</body>
</html>
