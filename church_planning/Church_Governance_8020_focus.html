<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教會版 80/20 資源聚焦儀｜教會規劃</title>
  <link rel="stylesheet" href="css/assessment_coaching_shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(165deg, #ecfeff 0%, #fff 50%); margin: 0; }
    .strategic-tab-panel.hidden { display: none !important; }
    .strategic-tab-btn { padding: 0.45rem 0.65rem; font-size: 0.7rem; font-weight: 800; border-radius: 0.5rem; border: 1px solid #a5f3fc; background: #fff; cursor: pointer; }
    .strategic-tab-btn.strategic-tab-active { background: #0e7490; color: #fff; border-color: #0f766e; }
    .acs-pastoral-hero { background: linear-gradient(135deg,#cffafe,#ecfdf5); border: 2px solid #22d3ee; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-pastoral-hero p { margin: 0; font-size: 1rem; line-height: 1.7; color: #164e63; font-weight: 700; }
    .acs-btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.85rem; border: 1px solid #a5f3fc; background: #fff; cursor: pointer; }
    .acs-btn--primary { background: #0e7490; color: #fff; border-color: #0f766e; }
    .acs-btn--demo { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .acs-card { background: #fff; border: 1px solid #bae6fd; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-demo-badge { display: inline-block; background: #fef3c7; border: 2px solid #d97706; color: #78350f; padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 800; }
  </style>
  <script>
  (function(){
    var T=['intro','survey','report','methodology'];
    function sw(id){T.forEach(function(k){var p=document.getElementById('strategic-tab-'+k);if(p)p.classList.toggle('hidden',k!==id);});
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){var on=b.getAttribute('data-strategic-tab')===id;b.classList.toggle('strategic-tab-active',on);});}
    window.__b100SwitchTab=sw;
    window.loadDemoReport=function(){if(window.__8020DemoReady)window.__8020DemoReady();};
    document.addEventListener('DOMContentLoaded',function(){sw(document.body.getAttribute('data-strategic-default')||'intro');
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){b.addEventListener('click',function(){sw(b.getAttribute('data-strategic-tab'));});});
      document.querySelectorAll('[data-b100-demo]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();window.loadDemoReport();});});});
  })();
  </script>
</head>
<body class="text-slate-800" data-strategic-default="intro" data-b100-tool="8020">

<div id="8020-toast" class="8020-toast" role="status" aria-live="polite"></div>

<header class="8020-steward-header no-print">
  <div class="max-w-4xl mx-auto px-4 py-3">
    <p class="text-[10px] font-bold text-cyan-800 mb-1"><a href="assessment-os-hub.html" class="underline">健康診斷中心</a> · 精實減重</p>
    <h1 class="text-base font-black text-cyan-950 mb-2">教會版 80/20 資源聚焦儀</h1>
    <nav class="flex flex-wrap gap-1 items-center">
      <button type="button" class="strategic-tab-btn strategic-tab-active" data-strategic-tab="intro">1. 帕累托原理</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="survey">2. 團隊工作坊</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="report">3. 帕累托矩陣</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="methodology">4. 聖靈剪枝決策會</button>
      <button type="button" class="acs-btn acs-btn--demo text-xs ml-1" data-b100-demo="1">🔍 先看示範報告</button>
    </nav>
  </div>
</header>

<section id="strategic-tab-intro" class="strategic-tab-panel max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div class="acs-pastoral-hero">
    <p>少數關鍵事工承擔大部分屬靈影響；其餘瑣事常耗盡 80% 精力。我們一起誠實盤點，讓好的深化、僵化的得安息——這是管家忠心，不是裁員名單。</p>
  </div>
  <div class="acs-card">
    <h2 class="text-xl font-black text-cyan-900 mb-2">帕累托長尾 · 活體讀取 NCD／SWOT／KPI</h2>
    <p class="text-sm text-slate-700 leading-relaxed">工作坊列出事工 → 矩陣標註剪枝區 → Tab④ 約 15:2 長執腳本。HITL：牧者主持。</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button type="button" class="acs-btn acs-btn--primary" data-strategic-tab="survey">進入【2. 團隊工作坊】→</button>
      <button type="button" class="acs-btn acs-btn--demo" data-b100-demo="1">🔍 先看示範報告</button>
    </div>
  </div>
</section>

<section id="strategic-tab-survey" class="strategic-tab-panel hidden max-w-4xl mx-auto">
  <div id="8020-upstream-banner" class="hidden mx-4 mt-3 p-3 bg-cyan-50 border border-cyan-200 rounded-lg"></div>
  <div id="8020-workshop-wrap" class="acs-card mx-4 my-4 text-sm text-slate-500">載入工作坊中…</div>
</section>

<section id="strategic-tab-report" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div id="8020-report-empty" class="acs-card text-center text-slate-600">尚無報告 · 請點「🔍 先看示範報告」</div>
  <div id="8020-report-content" class="hidden space-y-4">
    <span id="8020-report-demo-badge" class="acs-demo-badge hidden">示範資料 · 不寫入正式紀錄</span>
    <div id="8020-report-summary" class="acs-card text-sm"></div>
    <div id="8020-report-viz" class="acs-card"></div>
    <div class="flex flex-wrap gap-2">
      <a href="Church_Governance_KPI_alignment.html" class="acs-btn no-underline">← 目標對齊</a>
      <a href="Church_Governance_PDCA_cycle.html" class="acs-btn no-underline">→ 行動迴圈</a>
      <button type="button" class="acs-btn" data-strategic-tab="methodology">→ 聖靈剪枝決策會</button>
    </div>
  </div>
</section>

<section id="strategic-tab-methodology" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6">
  <div id="8020-tab-methodology-content" class="text-sm text-slate-500">載入長執決策模板中…</div>
</section>

<script src="js/strategic_acs_unified_boot.js"></script>
<script src="js/assessment_run_store.js"></script>
<script src="js/eighty_twenty_engine.js"></script>
<script src="js/tool_packs/eightytwenty_pack.js"></script>
<script src="js/eighty_twenty_matrix_viz.js"></script>
<script src="js/eightytwenty_pastoral_desk_content.js"></script>
<script src="js/eightytwenty_acs_shell.js"></script>
<script src="js/strategic_hybrid_shell.js"></script>
<script>
(function(){
  window.__8020DemoReady=function(){if(window.EightytwentyAcsShell&&EightytwentyAcsShell.loadDemoReport)EightytwentyAcsShell.loadDemoReport();};
  if(window.B100AcsBoot)B100AcsBoot.initPage('8020');
})();
</script>
</body>
</html>
