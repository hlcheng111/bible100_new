<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>實測→策略 鏈路驗證</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-3xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <h1 class="text-xl font-bold">A1.5 / A2 / A3 → B 階段鏈路驗證</h1>
      <p class="text-sm text-slate-600 mt-2">快速檢查診斷資料是否可被 SWOT / SMART / PDCA 使用。</p>
    </header>
    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <button id="run" class="px-3 py-2 rounded bg-violet-600 text-white text-sm font-semibold">執行驗證</button>
      <ul id="list" class="mt-3 space-y-2 text-sm"></ul>
      <a href="dashboard.html" class="text-sm text-blue-700 hover:underline">回戰情室</a>
    </section>
  </main>
  <script>
    (function () {
      function ok(msg) { return "<li class='border rounded p-2 bg-emerald-50 border-emerald-200'>✅ " + msg + "</li>"; }
      function warn(msg) { return "<li class='border rounded p-2 bg-amber-50 border-amber-200'>⚠️ " + msg + "</li>"; }
      function has(key) { return !!localStorage.getItem(key); }
      document.getElementById("run").addEventListener("click", function () {
        var out = [];
        out.push(has("chp2026-health-result") ? ok("A1 健康資料存在") : warn("A1 健康資料不存在"));
        out.push(has("chp2026-a1-health-results") ? ok("A1 服事滿意度資料存在") : warn("A1 服事滿意度資料不存在"));
        out.push(has("chp2026-swot-v1") ? ok("B1 SWOT 可讀取") : warn("B1 SWOT 尚未建立"));
        out.push(has("chp2026-smart-v1") || has("chp2026_default_goals") ? ok("B3 SMART 目標可讀取") : warn("B3 SMART 目標缺失"));
        out.push(has("chp2026-pdca-log") ? ok("B4 PDCA log 已存在") : warn("B4 PDCA log 尚未建立"));
        out.push(has("chp2026-raci-diagnostic-v1") ? ok("RACI 反思摘要已存（可選）") : warn("RACI 反思尚未建立（可選，供 Check／Act）"));
        out.push(has("memberSystemData") ? ok("CentralMemberDB (SSOT) 已存在") : warn("CentralMemberDB 尚未初始化"));
        document.getElementById("list").innerHTML = out.join("");
      });
    })();
  </script>
</body>
</html>
