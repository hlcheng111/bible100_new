<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>健康診斷中心｜教會規劃</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/planning_guide_shared.css">
  <link rel="stylesheet" href="css/planning_phase_panel.css">
  <link rel="stylesheet" href="css/planning_zone_rail.css">
  <script src="../js/shell_nav.js"></script>
  <script src="js/planning_phase_config.js?v=20260731k"></script>
  <script src="js/planning_tool_registry.js?v=20260731k"></script>
  <script src="js/planning_sidebar_labels.js?v=20260731k"></script>
  <script src="js/assessment_run_store.js?v=20260731k"></script>
  <script src="js/planning_phase_gate.js?v=20260731k"></script>
  <script src="js/planning_recommend_engine.js?v=20260731k"></script>
  <script src="js/planning_nav.js?v=20260731k"></script>
  <script src="js/planning_zone_rail.js?v=20260731k"></script>
  <script src="../js/page_capability_badge.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-6xl mx-auto px-4 py-6 md:py-8">
    <div id="planning-zone-rail-top"></div>
    <div id="planning-zone-rail-hint" class="planning-guide-box"></div>
    <header class="mb-6 md:mb-8">
      <h1 class="text-2xl md:text-3xl font-black">📋 健康診斷中心</h1>
      <p class="text-sm text-slate-600 mt-2 leading-relaxed">
        分階解鎖 · 一般先填靈命快評 → 戰情室 → 再開更多工具。
      </p>
    </header>

    <div id="planning-recommend-banner"></div>
    <div id="planning-phase-panels"></div>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 mt-4">
      <article class="rounded-xl border border-emerald-200 bg-emerald-50 p-4">
        <h2 class="font-black text-emerald-800">微型（≤80）</h2>
        <p class="text-xs mt-2 text-slate-700">Phase 1：靈命快評 → RACI → 戰情室。</p>
      </article>
      <article class="rounded-xl border border-amber-200 bg-amber-50 p-4">
        <h2 class="font-black text-amber-800">小型（81–250）</h2>
        <p class="text-xs mt-2 text-slate-700">Phase 1+2，加上 SWOT、PDCA 節奏。</p>
      </article>
      <article class="rounded-xl border border-sky-200 bg-sky-50 p-4">
        <h2 class="font-black text-sky-800">中大型（251+）</h2>
        <p class="text-xs mt-2 text-slate-700">Phase 1 含 NCD（大表）+ ALDA 領導力。</p>
      </article>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-xs text-slate-600 mt-6">
      <p class="m-0">填完任問卷 → <a href="#" class="text-indigo-700 font-bold underline" onclick="return planningOpenContent(event,'cta-os-war-room.html');">戰情室</a> 按「掃描」看六維結果。左欄路牌只保留 4 條主路；解鎖後的工具會出現在「已解鎖的更多工具」。</p>
    </section>
    <div id="planning-zone-rail-bottom"></div>
  </main>
  <script src="js/ministry_path_workflow.js"></script>
  <script src="js/planning_hub_render.js?v=20260731k"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.PlanningZoneRail) PlanningZoneRail.boot({ force: true });
      var host = document.getElementById("ministry-path-workflow-hub");
      if (host && window.MinistryPathWorkflow) MinistryPathWorkflow.mount(host);
    });
  </script>
</body>
</html>
