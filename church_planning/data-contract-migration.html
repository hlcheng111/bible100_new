<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Contract Migration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-3xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <h1 class="text-xl font-bold">資料契約遷移工具</h1>
      <p class="text-sm text-slate-600 mt-2">將 legacy `longTermPlanning_*` 複製到 `chp2026_<church_id>_*` namespaced keys。</p>
    </header>
    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <label class="block text-sm mb-1">church_id</label>
      <input id="cid" class="w-full border rounded px-3 py-2 text-sm" value="default">
      <button id="run" class="mt-3 px-3 py-2 rounded bg-violet-600 text-white text-sm font-semibold">執行遷移</button>
      <pre id="out" class="mt-3 bg-slate-900 text-slate-100 rounded p-3 text-xs whitespace-pre-wrap"></pre>
      <a href="dashboard.html" class="text-sm text-blue-700 hover:underline">回戰情室</a>
    </section>
  </main>

  <script>
    (function () {
      var BASE = [
        "longTermPlanning_step0",
        "longTermPlanning_theology",
        "longTermPlanning_surveys",
        "longTermPlanning_summary",
        "longTermPlanning_swot",
        "longTermPlanning_goals"
      ];
      document.getElementById("run").addEventListener("click", function () {
        var cid = String(document.getElementById("cid").value || "default").trim() || "default";
        var out = [];
        BASE.forEach(function (k) {
          var v = localStorage.getItem(k);
          if (!v) {
            out.push("skip " + k + " (empty)");
            return;
          }
          var nk = "chp2026_" + cid + "_" + k;
          localStorage.setItem(nk, v);
          out.push("migrate " + k + " -> " + nk);
        });
        document.getElementById("out").textContent = out.join("\n") || "no action";
      });
    })();
  </script>
</body>
</html>
