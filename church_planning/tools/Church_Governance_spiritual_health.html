<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信徒靈命健康·五維儀｜教會規劃</title>
  <link rel="stylesheet" href="../css/assessment_coaching_shell.css">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(165deg,#fff1f2 0%,#fff 50%); margin:0; }
    .strategic-tab-panel.hidden { display:none!important; }
    .strategic-tab-btn { padding:.45rem .65rem; font-size:.7rem; font-weight:800; border-radius:.5rem; border:1px solid #fecdd3; background:#fff; cursor:pointer; }
    .strategic-tab-btn.strategic-tab-active { background:#be123c; color:#fff; border-color:#9f1239; }
    .acs-pastoral-hero { background:linear-gradient(135deg,#ffe4e6,#fff1f2); border:2px solid #fb7185; border-radius:1rem; padding:1rem 1.25rem; margin-bottom:1rem; }
    .acs-pastoral-hero p { margin:0; font-size:1rem; line-height:1.7; color:#881337; font-weight:700; }
    .acs-btn { display:inline-block; padding:.5rem 1rem; border-radius:.5rem; font-weight:700; font-size:.85rem; border:1px solid #fecdd3; background:#fff; cursor:pointer; }
    .acs-btn--primary { background:#be123c; color:#fff; border-color:#9f1239; }
    .acs-btn--demo { background:#fef3c7; color:#92400e; border-color:#f59e0b; }
    .acs-card { background:#fff; border:1px solid #fecdd3; border-radius:1rem; padding:1rem 1.25rem; margin-bottom:1rem; }
    .acs-demo-badge { display:inline-block; background:#fef3c7; border:2px solid #d97706; color:#78350f; padding:.35rem .75rem; border-radius:.5rem; font-size:.75rem; font-weight:800; }
  </style>
  <script>
  (function(){var T=['intro','survey','report','methodology'];function sw(id){T.forEach(function(k){var p=document.getElementById('strategic-tab-'+k);if(p)p.classList.toggle('hidden',k!==id);});document.querySelectorAll('[data-strategic-tab]').forEach(function(b){b.classList.toggle('strategic-tab-active',b.getAttribute('data-strategic-tab')===id);});}window.__b100SwitchTab=sw;window.loadDemoReport=function(){if(window.__spiritualDemoReady)window.__spiritualDemoReady();};document.addEventListener('DOMContentLoaded',function(){sw('intro');document.querySelectorAll('[data-strategic-tab]').forEach(function(b){b.addEventListener('click',function(){sw(b.getAttribute('data-strategic-tab'));});});document.querySelectorAll('[data-b100-demo]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();window.loadDemoReport();});});});})();
  </script>
</head>
<body data-strategic-default="intro" data-b100-tool="spiritual">
<header class="spiritual-steward-header"><div class="max-w-4xl mx-auto px-4 py-3">
  <p class="text-[10px] font-bold text-rose-800"><a href="../assessment-os-hub.html" class="underline">健康診斷中心</a> · 靈命與真理</p>
  <h1 class="text-base font-black text-rose-950 mb-2">信徒靈命健康·五維儀</h1>
  <nav class="flex flex-wrap gap-1 items-center">
    <button type="button" class="strategic-tab-btn strategic-tab-active" data-strategic-tab="intro">1. 靈命託付</button>
    <button type="button" class="strategic-tab-btn" data-strategic-tab="survey">2. 靈命快評</button>
    <button type="button" class="strategic-tab-btn" data-strategic-tab="report">3. 五維儀表</button>
    <button type="button" class="strategic-tab-btn" data-strategic-tab="methodology">4. 陪伴決策桌</button>
    <button type="button" class="acs-btn acs-btn--demo text-xs" data-b100-demo="1">🔍 先看示範報告</button>
  </nav>
</div></header>
<section id="strategic-tab-intro" class="strategic-tab-panel max-w-4xl mx-auto p-4 space-y-4">
  <div class="acs-pastoral-hero"><p>這是<strong>自我覺察與陪伴</strong>，不是考核排名——分數為了選一個可守住的小步。</p></div>
  <div class="acs-card"><p class="text-sm">13 題 · 五維 rollup → urgent / SMART 上游鏈路起點。</p>
    <div class="mt-3 flex gap-2"><button type="button" class="acs-btn acs-btn--primary" data-strategic-tab="survey">進入快評</button><button type="button" class="acs-btn acs-btn--demo" data-b100-demo="1">示範報告</button></div></div>
</section>
<section id="strategic-tab-survey" class="strategic-tab-panel hidden max-w-4xl mx-auto"><div id="spiritual-survey-wrap" class="acs-card mx-4 my-4">載入中…</div></section>
<section id="strategic-tab-report" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 space-y-4">
  <div id="spiritual-report-empty" class="acs-card text-center">尚無報告</div>
  <div id="spiritual-report-content" class="hidden space-y-4">
    <span id="spiritual-demo-badge" class="acs-demo-badge hidden">示範</span>
    <div id="spiritual-report-summary" class="acs-card text-sm"></div>
    <div id="spiritual-report-viz" class="acs-card"></div>
    <a href="Church_Governance_urgent_matrix.html" class="acs-btn no-underline">→ 四象限優先</a>
  </div>
</section>
<section id="strategic-tab-methodology" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4"><div id="spiritual-tab-methodology-content"></div></section>
<script src="../js/strategic_acs_unified_boot.js"></script>
<script src="../js/spiritual_health_scoring.js"></script>
<script src="../js/cta_os_runtime.js"></script>
<script src="../js/assessment_run_store.js"></script>
<script src="../js/tool_packs/spiritual_pack.js"></script>
<script src="../js/acs_report_gold.js"></script>
<script src="../js/spiritual_health_viz.js"></script>
<script src="../js/spiritual_pastoral_desk_content.js"></script>
<script src="../js/spiritual_acs_shell.js"></script>
<script>window.__spiritualDemoReady=function(){SpiritualAcsShell.loadDemoReport();};if(window.B100AcsBoot)B100AcsBoot.initPage('spiritual');</script>
</body>
</html>
