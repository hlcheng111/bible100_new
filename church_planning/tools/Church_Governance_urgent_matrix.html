<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重要 vs 緊急·四象限儀｜教會規劃</title>
  <link rel="stylesheet" href="../css/assessment_coaching_shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(165deg, #fffbeb 0%, #fff 50%); margin: 0; }
    .strategic-tab-panel.hidden { display: none !important; }
    .strategic-tab-btn { padding: 0.45rem 0.65rem; font-size: 0.7rem; font-weight: 800; border-radius: 0.5rem; border: 1px solid #fcd34d; background: #fff; cursor: pointer; }
    .strategic-tab-btn.strategic-tab-active { background: #d97706; color: #fff; border-color: #b45309; }
    .acs-pastoral-hero { background: linear-gradient(135deg,#fef3c7,#fffbeb); border: 2px solid #fbbf24; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-pastoral-hero p { margin: 0; font-size: 1rem; line-height: 1.7; color: #78350f; font-weight: 700; }
    .acs-btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.85rem; border: 1px solid #fcd34d; background: #fff; cursor: pointer; }
    .acs-btn--primary { background: #d97706; color: #fff; border-color: #b45309; }
    .acs-btn--demo { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .acs-card { background: #fff; border: 1px solid #fde68a; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-demo-badge { display: inline-block; background: #fef3c7; border: 2px solid #d97706; color: #78350f; padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 800; }
  </style>
  <script>
  (function(){
    var T=['intro','survey','report','methodology'];
    function sw(id){T.forEach(function(k){var p=document.getElementById('strategic-tab-'+k);if(p)p.classList.toggle('hidden',k!==id);});
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){var on=b.getAttribute('data-strategic-tab')===id;b.classList.toggle('strategic-tab-active',on);});}
    window.__b100SwitchTab=sw;
    window.loadDemoReport=function(){if(window.__urgencyDemoReady)window.__urgencyDemoReady();};
    document.addEventListener('DOMContentLoaded',function(){sw(document.body.getAttribute('data-strategic-default')||'intro');
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){b.addEventListener('click',function(){sw(b.getAttribute('data-strategic-tab'));});});
      document.querySelectorAll('[data-b100-demo]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();window.loadDemoReport();});});});
  })();
  </script>
</head>
<body class="text-slate-800" data-strategic-default="intro" data-b100-tool="urgent">

<div id="urgency-toast" class="urgency-toast" role="status"></div>

<header class="urgency-steward-header no-print">
  <div class="max-w-4xl mx-auto px-4 py-3">
    <p class="text-[10px] font-bold text-amber-800 mb-1"><a href="../assessment-os-hub.html" class="underline">健康診斷中心</a> · 治理與優先</p>
    <h1 class="text-base font-black text-amber-950 mb-2">重要 vs 緊急·四象限儀</h1>
    <nav class="flex flex-wrap gap-1 items-center">
      <button type="button" class="strategic-tab-btn strategic-tab-active" data-strategic-tab="intro">1. 節奏託付</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="survey">2. 優先快評</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="report">3. 四象限儀表</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="methodology">4. 優先序決策桌</button>
      <button type="button" class="acs-btn acs-btn--demo text-xs ml-1" data-b100-demo="1">🔍 先看示範報告</button>
    </nav>
  </div>
</header>

<section id="strategic-tab-intro" class="strategic-tab-panel max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div class="acs-pastoral-hero">
    <p>這<strong>不是</strong>效率競賽，而是誠實看見：你的精力花在哪一類事情上——目標是提升 <strong>Q2 重要不緊急</strong> 的固定時段，不是逼大家做更多救火。</p>
  </div>
  <div class="acs-card">
    <h2 class="text-xl font-black text-amber-900 mb-2">Eisenhower · 教會事奉節奏</h2>
    <p class="text-sm text-slate-700">14 題快評 → 四象限比例 → Q2 偏低時啟動決策桌模板 → 連結 SMART / RACI。</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button type="button" class="acs-btn acs-btn--primary" data-strategic-tab="survey">進入【2. 優先快評】→</button>
      <button type="button" class="acs-btn acs-btn--demo" data-b100-demo="1">🔍 先看示範報告</button>
    </div>
  </div>
</section>

<section id="strategic-tab-survey" class="strategic-tab-panel hidden max-w-4xl mx-auto">
  <div id="urgency-upstream-banner" class="hidden mx-4 mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg"></div>
  <div id="urgency-survey-wrap" class="acs-card mx-4 my-4 text-sm text-slate-500">載入問卷中…</div>
</section>

<section id="strategic-tab-report" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div id="urgency-report-empty" class="acs-card text-center text-slate-600">尚無報告 · 請點「🔍 先看示範報告」</div>
  <div id="urgency-report-content" class="hidden space-y-4">
    <span id="urgency-demo-badge" class="acs-demo-badge hidden">示範資料 · 不寫入正式紀錄</span>
    <div id="urgency-report-banner" class="hidden"></div>
    <div id="urgency-report-summary" class="acs-card text-sm"></div>
    <div id="urgency-report-viz" class="acs-card"></div>
    <div id="urgency-flags-zone" class="acs-card text-sm"></div>
    <div class="flex flex-wrap gap-2">
      <a href="Church_Governance_spiritual_health.html" class="acs-btn no-underline">← 靈命健康</a>
      <a href="Church_Governance_SMART_goals.html" class="acs-btn no-underline">→ SMART 目標</a>
      <button type="button" class="acs-btn" data-strategic-tab="methodology">→ 優先序決策桌</button>
    </div>
  </div>
</section>

<section id="strategic-tab-methodology" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6">
  <div id="urgency-tab-methodology-content" class="text-sm text-slate-500">載入決策模板中…</div>
</section>

<script src="../js/strategic_acs_unified_boot.js"></script>
<script src="../js/cta_os_runtime.js"></script>
<script src="../js/assessment_run_store.js"></script>
<script src="../js/tool_packs/urgency_pack.js"></script>
<script src="../js/acs_report_gold.js"></script>
<script src="../js/urgency_matrix_viz.js"></script>
<script src="../js/urgency_pastoral_desk_content.js"></script>
<script src="../js/urgency_acs_shell.js"></script>
<script src="../js/strategic_hybrid_shell.js"></script>
<script>
(function(){
  window.__urgencyDemoReady=function(){if(window.UrgencyAcsShell&&UrgencyAcsShell.loadDemoReport)UrgencyAcsShell.loadDemoReport();};
  if(window.B100AcsBoot)B100AcsBoot.initPage('urgent');
})();
</script>
</body>
</html>
