<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>尚在準備 · 教會事工</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="../../js/shell_nav.js"></script>
  <style>
    :root {
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #fffef9;
      --wash: #f1f5f9;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --warn: #b45309;
      --warn-soft: #fff7ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #ecfeff 0%, transparent 55%),
        radial-gradient(ellipse 70% 40% at 100% 20%, #fff7ed 0%, transparent 50%),
        var(--wash);
      padding: 32px 18px 48px;
    }
    .wrap {
      max-width: 28rem;
      margin: 0 auto;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }
    .status {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--warn);
      background: var(--warn-soft);
      border: 1px solid #fed7aa;
      border-radius: 6px;
      padding: 4px 10px;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .lead {
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.75;
      color: var(--muted);
    }
    .block {
      margin: 0 0 14px;
      padding: 14px 14px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .block h2 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
    }
    .block p {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink);
    }
    .block a {
      color: #0e7490;
      font-weight: 700;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-ghost:hover { background: var(--accent-soft); border-color: #99f6e4; }
    .foot {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card">
      <span class="status">尚在準備</span>
      <h1 id="ph-title">這個功能還沒開放</h1>
      <p class="lead" id="ph-lead">側欄先留了入口，方便日後接上。現在還不能在這裡登記或存檔，請先用下面的替代做法。</p>

      <div class="block" id="ph-where-wrap">
        <h2>屬於哪裡</h2>
        <p id="ph-where">教會事工</p>
      </div>

      <div class="block" id="ph-alt-wrap" hidden>
        <h2>現在可以怎麼做</h2>
        <p id="ph-alt"></p>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="#" id="ph-main">回規劃首頁</a>
        <a class="btn btn-ghost" href="#" id="ph-secondary">去日常工作</a>
      </div>
    </article>
    <p class="foot">教會事工 · 未開放功能說明頁</p>
  </div>

  <script>
    (function () {
      /** SITE-5a：舊占位 id 已結案 → 直接轉 live 頁（上云／file:// 相對本頁） */
      var LIVE_REDIRECT = {
        matchmaker: "../ministry-position-matchmaker.html",
        "leave-swap": "../../church_ministry/tools/volunteer_shift/leave_swap.html",
        "cross-risk": "../cross_risk_summary.html",
        leave_swap: "../../church_ministry/tools/volunteer_shift/leave_swap.html",
        cross_risk: "../cross_risk_summary.html"
      };
      try {
        var id0 = new URLSearchParams(location.search || "").get("id") || "";
        if (LIVE_REDIRECT[id0]) {
          location.replace(LIVE_REDIRECT[id0]);
          return;
        }
      } catch (eRedir) { /* continue as placeholder */ }

      /** 其餘未開放項目：用 ?id= 即可 */
      var PRESETS = {
        matchmaker: {
          title: "事奉媒合",
          where: "規劃 · 事奉",
          lead: "已改為正式媒合頁；若未自動跳轉請點下方按鈕。",
          altLabel: "開啟事奉媒合",
          altGo: "plan-matchmaker"
        },
        "leave-swap": {
          title: "請假／調班",
          where: "日常工作 · 義工排班",
          lead: "已改為正式請假調班頁；若未自動跳轉請點下方按鈕。",
          altLabel: "請假調班",
          altGo: "admin-leave"
        },
        "cross-risk": {
          title: "跨部門風險對照表",
          where: "規劃 · 健康雷達",
          lead: "已改為正式風險摘要頁；若未自動跳轉請點下方按鈕。",
          altLabel: "跨部門風險摘要",
          altGo: "plan-cross"
        }
      };

      var GO = {
        plan: {
          sidebarUrl: "church_planning/sidebar_plan_v5_preview.html",
          contentUrl: "church_planning/index_plan.html"
        },
        admin: {
          sidebarUrl: "church_ministry/sidebar_church_layout_v1.html?focus=f",
          contentUrl: "church_ministry/dashboard.html"
        },
        "admin-members": {
          sidebarUrl: "church_ministry/sidebar_church_layout_v1.html?focus=f",
          contentUrl: "church_ministry/modules/members/member-integrated.html"
        },
        "admin-shifts": {
          sidebarUrl: "church_ministry/sidebar_church_layout_v1.html?focus=e",
          contentUrl: "church_ministry/tools/volunteer_shift/index.html"
        },
        "admin-leave": {
          sidebarUrl: "church_ministry/sidebar_church_layout_v1.html?focus=e",
          contentUrl: "church_ministry/tools/volunteer_shift/leave_swap.html"
        },
        "plan-war": {
          sidebarUrl: "church_planning/sidebar_plan_v5_preview.html",
          contentUrl: "church_planning/cta-os-war-room.html"
        },
        "plan-matchmaker": {
          sidebarUrl: "church_planning/sidebar_plan_v5_preview.html",
          contentUrl: "church_planning/ministry-position-matchmaker.html"
        },
        "plan-cross": {
          sidebarUrl: "church_planning/sidebar_plan_v5_preview.html",
          contentUrl: "church_planning/cross_risk_summary.html"
        }
      };

      function q() {
        var o = {};
        try {
          new URLSearchParams(location.search || "").forEach(function (v, k) { o[k] = v; });
        } catch (e) {}
        return o;
      }

      function go(ev, key) {
        var dest = GO[key] || GO.plan;
        if (typeof bible100ShellNav === "function") {
          return bible100ShellNav(ev, dest);
        }
        location.href = "../index_plan.html";
        return false;
      }

      var params = q();
      var preset = PRESETS[params.id] || null;
      var title = (preset && preset.title) || params.title || params.name || "這個功能還沒開放";
      var where = (preset && preset.where) || "";
      if (!where) {
        where = "教會事工";
        if (params.branch) where += " · " + params.branch;
        if (params.step) where += " · 第 " + params.step + " 步";
      }
      var lead = (preset && preset.lead) || params.why || params.lead ||
        "側欄先留了入口，方便日後接上。現在還不能在這裡登記或存檔，請先用下面的替代做法。";
      var altLabel = (preset && preset.altLabel) || params.alt || "";
      var altGo = (preset && preset.altGo) || "";
      if (params.altUrl && !altGo) {
        /* 舊連結相容：有 alt 文字就顯示，按鈕仍回日常 */
        altGo = "admin";
      }

      document.getElementById("ph-title").textContent = title;
      document.title = title + " · 尚在準備";
      document.getElementById("ph-lead").textContent = lead;
      document.getElementById("ph-where").textContent = where;

      var altWrap = document.getElementById("ph-alt-wrap");
      var altEl = document.getElementById("ph-alt");
      if (altLabel) {
        altWrap.hidden = false;
        altEl.textContent = "請改用「" + altLabel + "」。";
      }

      var mainBtn = document.getElementById("ph-main");
      var secBtn = document.getElementById("ph-secondary");
      mainBtn.onclick = function (ev) { return go(ev, "plan"); };
      if (altLabel && altGo) {
        secBtn.textContent = "打開：" + altLabel;
        secBtn.onclick = function (ev) { return go(ev, altGo); };
      } else {
        secBtn.textContent = "去日常工作";
        secBtn.onclick = function (ev) { return go(ev, "admin"); };
      }
    })();
  </script>
</body>
</html>
