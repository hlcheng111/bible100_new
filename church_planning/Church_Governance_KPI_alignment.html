<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI/OKR 對齊·事工推進漏斗｜教會規劃</title>
  <link rel="stylesheet" href="css/assessment_coaching_shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(165deg, #eef2ff 0%, #fff 50%); margin: 0; }
    .strategic-tab-panel.hidden { display: none !important; }
    .strategic-tab-btn { padding: 0.45rem 0.65rem; font-size: 0.7rem; font-weight: 800; border-radius: 0.5rem; border: 1px solid #c7d2fe; background: #fff; cursor: pointer; }
    .strategic-tab-btn.strategic-tab-active { background: #4f46e5; color: #fff; border-color: #4338ca; }
    .acs-pastoral-hero { background: linear-gradient(135deg,#e0e7ff,#ecfdf5); border: 2px solid #818cf8; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-pastoral-hero p { margin: 0; font-size: 1rem; line-height: 1.7; color: #312e81; font-weight: 700; }
    .acs-btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.85rem; border: 1px solid #c7d2fe; background: #fff; cursor: pointer; }
    .acs-btn--primary { background: #4f46e5; color: #fff; border-color: #4338ca; }
    .acs-btn--demo { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .acs-card { background: #fff; border: 1px solid #e0e7ff; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .acs-demo-badge { display: inline-block; background: #fef3c7; border: 2px solid #d97706; color: #78350f; padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 800; }
  </style>
  <script>
  (function(){
    var T=['intro','survey','report','methodology'];
    function sw(id){T.forEach(function(k){var p=document.getElementById('strategic-tab-'+k);if(p)p.classList.toggle('hidden',k!==id);});
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){var on=b.getAttribute('data-strategic-tab')===id;b.classList.toggle('strategic-tab-active',on);});}
    window.__b100SwitchTab=sw;
    window.loadDemoReport=function(){if(window.__kpiDemoReady)window.__kpiDemoReady();};
    document.addEventListener('DOMContentLoaded',function(){sw(document.body.getAttribute('data-strategic-default')||'intro');
      document.querySelectorAll('[data-strategic-tab]').forEach(function(b){b.addEventListener('click',function(){sw(b.getAttribute('data-strategic-tab'));});});
      document.querySelectorAll('[data-b100-demo]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();window.loadDemoReport();});});});
  })();
  </script>
</head>
<body class="text-slate-800" data-strategic-default="intro" data-b100-tool="kpi">

<div id="kpi-toast" class="kpi-toast" role="status" aria-live="polite"></div>

<header class="kpi-steward-header no-print">
  <div class="max-w-4xl mx-auto px-4 py-3">
    <p class="text-[10px] font-bold text-indigo-800 mb-1"><a href="assessment-os-hub.html" class="underline">健康診斷中心</a> · 目標衡量</p>
    <h1 class="text-base font-black text-indigo-950 mb-2">KPI/OKR 對齊·事工推進漏斗</h1>
    <nav class="flex flex-wrap gap-1 items-center">
      <button type="button" class="strategic-tab-btn strategic-tab-active" data-strategic-tab="intro">1. 管家託付</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="survey">2. 目標快評</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="report">3. 對齊漏斗儀表</button>
      <button type="button" class="strategic-tab-btn" data-strategic-tab="methodology">4. 忠心管家決策桌</button>
      <button type="button" class="acs-btn acs-btn--demo text-xs ml-1" data-b100-demo="1">🔍 先看示範報告</button>
    </nav>
  </div>
</header>

<section id="strategic-tab-intro" class="strategic-tab-panel max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div class="acs-pastoral-hero">
    <p>我們數算數字，是為了看清神給的收成，並在破口處彼此扶持——<strong>不是</strong>用 KPI 淘汰同工，也<strong>不是</strong>長老背後打考績表。</p>
  </div>
  <div class="acs-card">
    <h2 class="text-xl font-black text-indigo-900 mb-2">向著異象標竿誠實對齊</h2>
    <p class="text-sm text-slate-700 leading-relaxed">12 題快評 → 漏斗儀表 → 資源卡關率 ≥70% 時啟動 80/20 聚焦。</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button type="button" class="acs-btn acs-btn--primary" data-strategic-tab="survey">進入【2. 目標快評】→</button>
      <button type="button" class="acs-btn acs-btn--demo" data-b100-demo="1">🔍 先看示範報告</button>
    </div>
  </div>
</section>

<section id="strategic-tab-survey" class="strategic-tab-panel hidden max-w-4xl mx-auto">
  <div id="kpi-upstream-banner" class="hidden mx-4 mt-3 p-3 bg-indigo-50 border border-indigo-200 rounded-lg"></div>
  <div id="kpi-quick-survey-wrap" class="acs-card mx-4 my-4 text-sm text-slate-500">載入問卷中…</div>
</section>

<section id="strategic-tab-report" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6 space-y-4">
  <div id="kpi-report-empty" class="acs-card text-center text-slate-600">尚無報告 · 請點「🔍 先看示範報告」</div>
  <div id="kpi-report-content" class="hidden space-y-4">
    <span id="kpi-report-demo-badge" class="acs-demo-badge hidden">示範資料 · 不寫入正式紀錄</span>
    <div id="kpi-report-banner" class="hidden"></div>
    <div id="kpi-report-summary" class="acs-card text-sm"></div>
    <div id="kpi-report-viz" class="acs-card"></div>
    <div class="flex flex-wrap gap-2">
      <a href="Church_Governance_SWOT_matrix.html" class="acs-btn no-underline">← 戰略矩陣</a>
      <a href="Church_Governance_8020_focus.html" class="acs-btn no-underline">→ 80/20 聚焦</a>
      <button type="button" class="acs-btn" data-strategic-tab="methodology">→ 忠心管家決策桌</button>
    </div>
  </div>
</section>

<section id="strategic-tab-methodology" class="strategic-tab-panel hidden max-w-4xl mx-auto p-4 md:p-6">
  <div id="kpi-tab-methodology-content" class="text-sm text-slate-500">載入長執決策模板中…</div>
</section>

<script src="js/strategic_acs_unified_boot.js"></script>
<script src="js/cta_os_runtime.js"></script>
<script src="js/assessment_run_store.js"></script>
<script src="js/tool_packs/kpi_pack.js"></script>
<script src="js/kpi_funnel_viz.js"></script>
<script src="js/kpi_pastoral_desk_content.js"></script>
<script src="js/kpi_acs_shell.js"></script>
<script src="js/strategic_hybrid_shell.js"></script>
<script>
(function(){
  window.__kpiDemoReady=function(){if(window.KpiAcsShell&&KpiAcsShell.loadDemoReport)KpiAcsShell.loadDemoReport();};
  if(window.B100AcsBoot)B100AcsBoot.initPage('kpi');
})();
</script>
</body>
</html>
