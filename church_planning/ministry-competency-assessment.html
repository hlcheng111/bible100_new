<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事奉能力模型量表</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <header class="mb-5">
      <p class="text-xs font-semibold text-indigo-700"><a class="underline" href="assessment-os-hub.html">CTA-OS 分層中心</a></p>
      <h1 class="text-2xl md:text-3xl font-black mt-2">事奉能力模型量表</h1>
      <p class="text-sm text-slate-600 mt-2">以 KSA（知識/技能/態度）評估服事適任度，搭配 RACI 與崗位門檻做培育建議。</p>
    </header>
    <div class="flex flex-wrap gap-2 mb-4">
      <button class="px-3 py-2 rounded-lg bg-indigo-700 text-white text-sm" onclick="switchTab('intro')">① 理念與說明</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('survey')">② 開始測評</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('report')">③ 分析報告</button>
    </div>
    <section id="tab-intro" class="rounded-xl border bg-white p-4 text-sm">正式版建議 36-48 題（每能力 6-8 題）。可作為梯隊培育與職能補強地圖，不作單次淘汰依據。</section>
    <section id="tab-survey" class="hidden rounded-xl border bg-white p-4 text-sm space-y-2">
      <label class="block border rounded p-2">我能清楚主持會議並產生可執行結論。<input data-q="c1" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="4"></label>
      <label class="block border rounded p-2">我能在衝突中維持公義與溫柔。<input data-q="c2" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="3"></label>
      <label class="block border rounded p-2">我會建立 SOP 與交接文件，降低單點依賴。<input data-q="c3" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="4"></label>
      <button class="px-3 py-2 rounded border" onclick="generateOsReport()">生成 CTA-OS 報告</button>
    </section>
    <section id="tab-report" class="hidden rounded-xl border bg-white p-4 text-sm space-y-3">
      <p id="metricLine">能力分佈：關係協作 78 / 執行管理 72 / 培育帶領 65。建議 90 天補強：衝突調解、資料治理、授權追蹤。</p>
      <pre id="osReport" class="hidden text-xs bg-slate-100 p-2 rounded whitespace-pre-wrap"></pre>
      <div class="flex flex-wrap gap-2">
        <button class="px-3 py-2 rounded border" onclick="window.print()">🖨️ 打印 / 導出 PDF</button>
        <button class="px-3 py-2 rounded border" onclick="navigator.clipboard.writeText('能力模型示範報告')">💬 複製純文字報告</button>
        <button class="px-3 py-2 rounded border" onclick="location.reload()">🔄 清除數據並重新測試</button>
      </div>
    </section>
  </main>
  <script src="js/cta_os_runtime.js"></script>
  <script src="js/cta_os_item_packs.js"></script>
  <script src="js/cta_os_bridge.js"></script>
  <script>
    function switchTab(id){['intro','survey','report'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden',k!==id));}
    function generateOsReport(){
      var rep = window.__CTAOS_generate();
      if (rep) document.getElementById('metricLine').textContent = 'CTV：' + rep.vectorLine;
      switchTab('report');
    }
    CTAOSBridge.initPage({ toolId: 'competency', reportAnchor: '#tab-report', fab: false });
  </script>
</body>
</html>
