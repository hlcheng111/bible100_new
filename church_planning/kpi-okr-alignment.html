<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI/OKR 對齊量表</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <header class="mb-5">
      <p class="text-xs font-semibold text-indigo-700"><a class="underline" href="assessment-os-hub.html">CTA-OS 分層中心</a></p>
      <h1 class="text-2xl md:text-3xl font-black mt-2">KPI/OKR 對齊量表</h1>
      <p class="text-sm text-slate-600 mt-2">把「屬靈異象」落成可追蹤目標，防止只衝數字、忽略生命與關係。</p>
    </header>
    <div class="flex flex-wrap gap-2 mb-4">
      <button class="px-3 py-2 rounded-lg bg-indigo-700 text-white text-sm" onclick="switchTab('intro')">① 理念與說明</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('survey')">② 開始測評</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('report')">③ 分析報告</button>
    </div>
    <section id="tab-intro" class="rounded-xl border bg-white p-4 text-sm">建議題量 24-30 題（SMART 品質 + KR 可量測 + 風險與回顧機制）。</section>
    <section id="tab-survey" class="hidden rounded-xl border bg-white p-4 text-sm space-y-2">
      <label class="block border rounded p-2">我們的 KR 是結果指標，不是行動清單。<input data-q="k1" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="3"></label>
      <label class="block border rounded p-2">每項 KR 都有資料來源、基準值、目標值。<input data-q="k2" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="3"></label>
      <label class="block border rounded p-2">我們會同時追蹤同工健康與門訓果效。<input data-q="k3" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="4"></label>
      <button class="px-3 py-2 rounded border" onclick="generateOsReport()">生成 CTA-OS 報告</button>
    </section>
    <section id="tab-report" class="hidden rounded-xl border bg-white p-4 text-sm space-y-3">
      <p id="metricLine">對齊指數：67/100。主要缺口：指標定義不一致、回顧節奏不足。建議：先統一定義字典，再建立月度 review 節奏。</p>
      <pre id="osReport" class="hidden text-xs bg-slate-100 p-2 rounded whitespace-pre-wrap"></pre>
      <div class="flex flex-wrap gap-2">
        <button class="px-3 py-2 rounded border" onclick="window.print()">🖨️ 打印 / 導出 PDF</button>
        <button class="px-3 py-2 rounded border" onclick="navigator.clipboard.writeText('KPI/OKR 示範報告')">💬 複製純文字報告</button>
        <button class="px-3 py-2 rounded border" onclick="location.reload()">🔄 清除數據並重新測試</button>
      </div>
    </section>
  </main>
  <script src="js/cta_os_runtime.js"></script>
  <script src="js/cta_os_item_packs.js"></script>
  <script src="js/cta_os_bridge.js"></script>
  <script>
    function switchTab(id){['intro','survey','report'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden',k!==id));}
    function generateOsReport(){
      var rep = window.__CTAOS_generate();
      if (rep) document.getElementById('metricLine').textContent = 'CTV：' + rep.vectorLine;
      switchTab('report');
    }
    CTAOSBridge.initPage({ toolId: 'kpiokr', reportAnchor: '#tab-report', fab: false });
  </script>
</body>
</html>
