<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>步驟 2 · 權責理清｜教會規劃</title>
  <link rel="stylesheet" href="../css/planning_guide_shared.css">
  <script src="../../js/shell_nav.js"></script>
  <script src="../js/planning_tool_registry.js"></script>
  <script src="../js/planning_nav.js"></script>
  <script src="../../js/page_capability_badge.js"></script>
  <style>
    body { font-family: "Noto Sans TC", "Microsoft YaHei", sans-serif; background: #f8fafc; margin: 0; padding: 20px 16px 40px; color: #1e293b; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .step-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
    .step-card h2 { font-size: 13px; margin: 0 0 6px; color: #4338ca; }
    .step-card p { margin: 0; font-size: 12px; line-height: 1.65; color: #475569; }
    .step-actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .step-actions a, .step-actions button {
      display: inline-block; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: #4338ca; color: #fff; }
    .btn-ghost { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <p class="text-xs" style="font-size:11px;color:#6366f1;margin:0 0 8px;">
      <a href="#" onclick="return planningOpenContent(event,'index_plan.html');">← 步驟 1 啟航前言</a>
    </p>
    <div class="planning-guide-box">
      <h4>🤝 步驟 2 · 權責理清（RACI）</h4>
      <p><strong>理念：</strong> 先釐清「誰主責、誰配合」，再填診斷表，可避免長執會淪為互相推責或重複派工。</p>
      <p><strong>策略：</strong> 完成健康診斷後，用 20 分鐘完成 RACI 工作桌，對齊關鍵事工的主責與諮詢角色。</p>
      <p><strong>工具：</strong> 本步僅一項核心工具 — <strong>RACI 角色反思</strong>（左欄步驟 2 子選單可直達）。</p>
    </div>
    <h1>🤝 第一步：權責理清</h1>
    <div class="step-card">
      <h2>何時做</h2>
      <p>新年度規劃啟動、部門重組、同工交接，或感覺「很多事都在做但沒人負責」時。</p>
    </div>
    <div class="step-card">
      <h2>填完去哪</h2>
      <p>→ 步驟 4 健康雷達戰情室合成結果；或進入步驟 5 策略工具箱。</p>
    </div>
    <div class="step-actions">
      <a href="../planning/raci-reflection.html" target="contentFrame" class="btn-primary"
         onclick="return planningOpenByToolId(event,'raci');">進入 RACI 角色反思工作桌</a>
      <a href="#" class="btn-ghost" onclick="return planningOpenContent(event,'assessment-os-hub.html');">健康診斷中心 · 全部量表</a>
    </div>
  </main>
</body>
</html>
