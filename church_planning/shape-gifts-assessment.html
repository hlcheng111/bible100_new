<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAPE 恩賜整合量表</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <header class="mb-5">
      <p class="text-xs font-semibold text-indigo-700"><a class="underline" href="assessment-os-hub.html">CTA-OS 分層中心</a> · <a class="underline" href="cta-os-tool-report.html?tool=shape">統一報告中心</a></p>
      <h1 class="text-2xl md:text-3xl font-black mt-2">SHAPE 恩賜整合量表</h1>
      <p class="text-sm text-slate-600 mt-2">S/H/A/P/E 五向度整合，輸出恩賜雷達與事奉配對建議（對接 Smart Ministry）。</p>
    </header>

    <div class="flex flex-wrap gap-2 mb-4">
      <button class="px-3 py-2 rounded-lg bg-indigo-700 text-white text-sm" onclick="switchTab('intro')">① 理念與說明</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('survey')">② 開始測評</button>
      <button class="px-3 py-2 rounded-lg bg-white border text-sm" onclick="switchTab('report')">③ 分析報告</button>
    </div>

    <section id="tab-intro" class="rounded-xl border bg-white p-4">
      <p class="text-sm">建議題量：正式版 60-80 題。試用版先上 25 題（每向度 5 題）即可開始配對。</p>
    </section>

    <section id="tab-survey" class="hidden rounded-xl border bg-white p-4">
      <h2 class="font-black mb-3">示範題（S/H/A/P/E）</h2>
      <div class="space-y-2 text-sm">
        <label class="block border rounded p-2">我在教導聖經時常感到喜樂與流暢。<input data-q="s1" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="4"></label>
        <label class="block border rounded p-2">我對某族群（兒少/長者/新人）有持久負擔。<input data-q="s2" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="5"></label>
        <label class="block border rounded p-2">我能把複雜任務拆解成可執行步驟。<input data-q="s3" class="w-full mt-1 border rounded p-1" type="number" min="1" max="5" value="4"></label>
      </div>
      <button class="mt-3 px-3 py-2 rounded border text-sm" onclick="generateOsReport()">生成 CTA-OS 報告</button>
    </section>

    <section id="tab-report" class="hidden rounded-xl border bg-white p-4 space-y-3">
      <p class="text-sm">Top 恩賜：教導、牧養、治理；建議崗位：小組長、門訓同工、行政協調。</p>
      <pre id="osReport" class="hidden text-xs bg-slate-100 p-2 rounded whitespace-pre-wrap"></pre>
      <div class="flex flex-wrap gap-2 pt-2 text-sm">
        <button class="px-3 py-2 rounded border" onclick="window.print()">🖨️ 打印 / 導出 PDF</button>
        <button class="px-3 py-2 rounded border" onclick="copyText()">💬 複製純文字報告</button>
        <button class="px-3 py-2 rounded border" onclick="location.reload()">🔄 清除數據並重新測試</button>
      </div>
    </section>
  </main>
  <script src="js/cta_os_runtime.js"></script>
  <script src="js/cta_os_item_packs.js"></script>
  <script src="js/cta_os_bridge.js"></script>
  <script>
    function switchTab(id){['intro','survey','report'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden',k!==id));}
    function generateOsReport(){ window.__CTAOS_generate(); switchTab('report'); }
    function copyText(){
      var pre = document.querySelector('.cta-os-report-panel [data-cta-field="plain-text"]');
      if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.textContent || '');
    }
    CTAOSBridge.initPage({ toolId: 'shape', reportAnchor: '#tab-report', fab: false });
  </script>
</body>
</html>
