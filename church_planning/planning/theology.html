<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 1 · 聖經與神學理念</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <script src="assets/shell.js"></script>
  <div class="planning-wrap">
    <div class="step-head-mini">
      <h2>Step 1 · 神學與使命</h2>
      <a class="step-head-back" href="index.html">← 流程總覽</a>
    </div>
    <div class="report-dest-strip">
      <span class="report-dest-icon" aria-hidden="true">📊</span>
      <span>儲存後戰情總覽會顯示使命／異象；SMART 目標的「對齊主軸」亦引用此頁。</span>
    </div>

    <div class="fill-zone">
      <h2 class="fill-zone-title">大誡命與大使命（摘要）</h2>
      <p class="fill-zone-hint">往後 Step 3、SWOT、目標皆對齊此處。</p>
      <label for="great-commandment">大誡命 · 愛神愛人 — 你的教會怎麼說？</label>
      <textarea id="great-commandment" rows="3" placeholder="一至兩段即可"></textarea>
      <label for="great-commission" style="margin-top:12px;">大使命 · 使萬民作門徒 — 你的教會怎麼說？</label>
      <textarea id="great-commission" rows="3"></textarea>
    </div>
    <div class="fill-zone">
      <h2 class="fill-zone-title">本教會此季的呼召</h2>
      <label for="seasonal-call">議會／牧長認定的方向（可簡短）</label>
      <textarea id="seasonal-call" rows="3"></textarea>
    </div>
    <div class="fill-zone">
      <h2 class="fill-zone-title">使命 · 異象 · 核心價值</h2>
      <label for="mission-statement">使命（一句話）</label>
      <input type="text" id="mission-statement" placeholder="例如：在這城榮神益人，建立門徒…">
      <label for="vision-statement" style="margin-top:12px;">異象（一小段）</label>
      <textarea id="vision-statement" rows="3"></textarea>
      <label for="core-values" style="margin-top:12px;">核心價值（關鍵詞，逗號或換行分隔，供之後目標下拉用）</label>
      <textarea id="core-values" rows="3" placeholder="敬拜，禱告，下一代，社區…"></textarea>
    </div>

    <p><button type="button" class="btn-big" id="btn-save-theology" style="display:inline-block;width:auto;">儲存 Step 1</button> <span id="save-status" class="status-saved"></span></p>

    <a class="btn-big step-jump" href="survey.html">前往 Step 2</a>
    <p class="nav-back"><a href="index.html">流程總覽</a> · <a href="health.html">Step 0</a></p>
  </div>

  <script src="assets/pipeline.js"></script>
  <script>
(function () {
  var P = window.LongTermPipeline;
  var d = P.loadTheology();
  document.getElementById("great-commandment").value = d.greatCommandment || "";
  document.getElementById("great-commission").value = d.greatCommission || "";
  document.getElementById("seasonal-call").value = d.seasonalCall || "";
  document.getElementById("mission-statement").value = d.missionStatement || "";
  document.getElementById("vision-statement").value = d.visionStatement || "";
  document.getElementById("core-values").value = d.coreValues || "";

  function collect() {
    return {
      version: 1,
      greatCommandment: document.getElementById("great-commandment").value.trim(),
      greatCommission: document.getElementById("great-commission").value.trim(),
      seasonalCall: document.getElementById("seasonal-call").value.trim(),
      missionStatement: document.getElementById("mission-statement").value.trim(),
      visionStatement: document.getElementById("vision-statement").value.trim(),
      coreValues: document.getElementById("core-values").value.trim(),
    };
  }

  function save() {
    P.saveTheology(collect());
    var el = document.getElementById("save-status");
    el.textContent = "已儲存";
    setTimeout(function () { el.textContent = ""; }, 1800);
  }

  ["great-commandment", "great-commission", "seasonal-call", "mission-statement", "vision-statement", "core-values"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", save);
  });
  document.getElementById("btn-save-theology").addEventListener("click", save);
})();
  </script>
</body>
</html>
