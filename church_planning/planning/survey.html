<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 2 · 教會健康問卷入口</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <script src="assets/shell.js"></script>
  <div class="planning-wrap">
    <div class="step-head-mini">
      <h2>Step 2 · 問卷網址</h2>
      <a class="step-head-back" href="index.html">← 流程總覽</a>
    </div>
    <div class="report-dest-strip">
      <span class="report-dest-icon" aria-hidden="true">📊</span>
      <span>網址會同步到戰情總覽；回收後到 Step 3 貼匯出文字。</span>
    </div>

    <div class="data-use-box">
      <h3>教會健康調查是什麼？</h3>
      <p style="margin:0;font-size:14px;">兩份問卷（會眾＋領袖），涵蓋敬拜、相交、門訓、事奉、福音、文化、領導等，讓長執看見<strong>整體趨勢</strong>，再配 SWOT 與使命。</p>
    </div>

    <div class="fill-zone">
      <h2 class="fill-zone-title">會眾問卷</h2>
      <p class="fill-zone-hint">貼上 Google Forms 等網址；QR 可另製。</p>
      <label for="url-public">網址</label>
      <input type="url" id="url-public" autocomplete="off" placeholder="https://…">
      <div class="qr-placeholder" style="margin-top:10px;" aria-hidden="true">QR 占位</div>
    </div>

    <div class="fill-zone">
      <h2 class="fill-zone-title">領袖問卷</h2>
      <label for="url-leaders">網址</label>
      <input type="url" id="url-leaders" autocomplete="off" placeholder="https://…">
      <div class="qr-placeholder" aria-hidden="true">QR 占位</div>
    </div>

    <p><button type="button" class="btn-big" id="btn-save-survey" style="display:inline-block;width:auto;">儲存 Step 2</button> <span id="save-status" class="status-saved"></span></p>

    <a class="btn-big step-jump" href="ai-summary.html">前往 Step 3</a>
    <p class="nav-back"><a href="index.html">流程總覽</a> · <a href="theology.html">Step 1</a></p>
  </div>

  <script src="assets/pipeline.js"></script>
  <script>
(function () {
  var P = window.LongTermPipeline;
  var s = P.loadSurveys();
  document.getElementById("url-public").value = s.publicUrl || "";
  document.getElementById("url-leaders").value = s.leadersUrl || "";

  function save() {
    s.publicUrl = document.getElementById("url-public").value.trim();
    s.leadersUrl = document.getElementById("url-leaders").value.trim();
    P.saveSurveys(s);
    var el = document.getElementById("save-status");
    el.textContent = "已儲存";
    setTimeout(function () { el.textContent = ""; }, 1600);
  }

  document.getElementById("url-public").addEventListener("change", save);
  document.getElementById("url-leaders").addEventListener("change", save);
  document.getElementById("btn-save-survey").addEventListener("click", save);
})();
  </script>
</body>
</html>
