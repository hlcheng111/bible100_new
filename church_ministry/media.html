<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒體創作 · Media | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-6">
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg shadow-lg p-8 mb-8 text-white">
            <h1 class="text-4xl font-bold mb-2">🎬 媒體創作</h1>
            <p class="text-lg opacity-90">Media Ministry - 視頻、音頻製作與管理</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 視頻製作 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🎬</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">影片製作</h3>
                <p class="text-gray-600 mb-4">教會紀錄片、見證視頻、教學視頻製作管理</p>
                <a href="modules/media/video-production.html" class="inline-block bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 音頻編輯 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🎵</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">音頻編輯</h3>
                <p class="text-gray-600 mb-4">崇拜錄音、詩班練習、講道錄音編輯管理</p>
                <a href="modules/media/audio-editing.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 音頻處理 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🎚️</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">音頻處理</h3>
                <p class="text-gray-600 mb-4">降噪、均衡器調整、壓縮、標準化處理</p>
                <a href="modules/media/audio-processing.html" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 混音製作 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🎛️</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">混音製作</h3>
                <p class="text-gray-600 mb-4">立體聲混音、環繞聲、母帶處理、播客製作</p>
                <a href="modules/media/mixing-production.html" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 錄音管理 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🎙️</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">錄音管理</h3>
                <p class="text-gray-600 mb-4">主日崇拜、禱告會、查經班錄音管理</p>
                <a href="modules/media/recording-management.html" class="inline-block bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- AI助手 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🤖</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">AI 助手</h3>
                <p class="text-gray-600 mb-4">智能媒體創作輔助工具</p>
                <a href="modules/tech/ai-assistant.html" class="inline-block bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="inline-block bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700">
                <i class="fas fa-home mr-2"></i>返回教會事工首頁
            </a>
        </div>
    </div>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="css/cm_desk.css" />
<script src="js/cm_desk_registry.js"></script>
<script src="js/cm_desk_kit.js"></script>
</body>
</html>
