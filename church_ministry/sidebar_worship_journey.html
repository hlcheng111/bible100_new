<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>敬拜 · 服事旅程侧栏</title>
  <style>
    body { margin: 0; font-family: system-ui, "Microsoft JhengHei", sans-serif; font-size: 12px; background: #f8fafc; }
    .wj-side { padding: 10px 12px; }
    .wj-side h2 { font-size: 13px; color: #5b21b6; margin: 0 0 8px; }
    .wj-side p { font-size: 10px; color: #64748b; line-height: 1.5; margin: 0 0 10px; }
    .wj-group { margin-bottom: 12px; }
    .wj-group h3 { font-size: 11px; color: #334155; margin: 0 0 6px; border-left: 3px solid #7c3aed; padding-left: 8px; }
    .wj-side a {
      display: block; padding: 6px 8px; margin: 2px 0; border-radius: 6px;
      color: #4338ca; text-decoration: none; font-size: 11px;
    }
    .wj-side a:hover { background: #eef2ff; }
    .wj-side a.primary { background: #7c3aed; color: #fff; font-weight: 600; }
    .wj-side a.primary:hover { background: #6d28d9; }
  </style>
  <script src="js/ae_worship_journey_registry.js"></script>
  <script src="../js/sidebar_shell_target_fallback.js"></script>
  <script src="../js/shell_nav.js"></script>
  <script src="js/cm_shell_paths.js"></script>
  <script src="../js/sidebar_behavior.js"></script>
  <base target="contentFrame">
</head>
<body>
  <nav class="wj-side" id="worship-journey-nav" aria-label="敬拜服事旅程">
    <h2>🌳 敬拜花园</h2>
    <p>按旅程选路，不按行政抽屉翻页。导游在 landing 页等你。</p>
    <a class="primary" href="_landing/worship.html" data-b100-nav="content">🧭 公园导览（选导游）</a>
  </nav>
  <script>
    (function () {
      var nav = document.getElementById("worship-journey-nav");
      var R = window.AeWorshipJourneyRegistry;
      if (!nav || !R) return;
      R.ROUTES.forEach(function (route) {
        var g = document.createElement("div");
        g.className = "wj-group";
        g.innerHTML = "<h3>" + route.emoji + " " + route.title + "</h3>";
        route.stops.forEach(function (st, i) {
          var a = document.createElement("a");
          a.href = st.path; a.setAttribute("data-b100-nav", "content");
          a.textContent = (i === 0 ? "▶ " : "· ") + st.label;
          if (i === 0) a.className = "primary";
          g.appendChild(a);
        });
        var start = document.createElement("a");
        start.href = route.start; start.setAttribute("data-b100-nav", "content");
        start.textContent = "→ 从此径开始";
        g.appendChild(start);
        nav.appendChild(g);
      });
    })();
  </script>
</body>
</html>
