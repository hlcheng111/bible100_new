<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="../../css/church_ministry_ui.css">
    <meta charset="UTF-8"><title>参与度分析 - 数据仪表盘 · Engagement Analysis | Church Ministry</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 20px; font-size: 11px; min-height: 100vh; color: white; }
.container { max-width: 1600px; margin: 0 auto; }
.header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
.header h1 { font-size: 26px; }
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
.stat-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 12px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
.stat-num { font-size: 36px; font-weight: bold; margin-bottom: 8px; }
.stat-label { font-size: 11px; opacity: 0.8; }
.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.chart-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 12px; padding: 25px; border: 1px solid rgba(255,255,255,0.2); }
.chart-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; text-align: center; }
.load-btn { display: block; margin: 20px auto; padding: 15px 30px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
</style></head>
<body class="cm-research-page">
    <nav class="cm-back-bar" aria-label="區域導覽">
      <a class="cm-back-bar__link" href="../../dashboard.html">⛪ 返回教會事工</a>
      <span class="cm-back-bar__muted">研究與統計</span>
    </nav>
    <p class="cm-data-banner" role="status"><strong>資料來源：</strong><span id="cm-data-source-line">讀取中…</span></p>
    <div class="cm-kpi-row" aria-label="即時匯總（ChurchDataBridge）">
      <span class="cm-kpi-pill">會友 <b id="cm-kpi-members">—</b></span>
      <span class="cm-kpi-pill">小組 <b id="cm-kpi-groups">—</b></span>
      <span class="cm-kpi-pill">探訪任務 <b id="cm-kpi-missions">—</b></span>
      <span class="cm-kpi-pill">志工指派 <b id="cm-kpi-volunteers">—</b></span>
      <span class="cm-kpi-pill">財務結餘 <b id="cm-kpi-finance-balance">—</b></span>
    </div>
    <div class="container">
<div class="header"><h1>📊 参与度分析 - 数据仪表盘</h1><p style="opacity:0.8;margin-top:10px;">📈 多维度分析 · 实时统计 · 趋势追踪</p>
<details style="margin-top:12px;padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid rgba(255,255,255,0.2);">
<summary style="cursor:pointer;font-weight:600;">📋 功能說明／計畫願景</summary>
<p style="margin-top:8px;font-size:11px;opacity:0.95;">本頁為示意：總會友數、平均出席、出席率、活動參與率。數字表達尚待定準：可接 memberSystemData、attendance 或活動報名資料。今後可：接真實出席記錄、定義參與率計算、與儀表板連動。</p>
</details></div>
<button class="load-btn" onclick="loadDemo()" id="loadBtn" style="display:none;">🎯 载入分析数据（3个活动分析）</button>
<div class="dashboard">
<div class="stat-box"><div class="stat-num" id="totalMembers">0</div><div class="stat-label">总会友数</div></div>
<div class="stat-box"><div class="stat-num" id="avgAttendance">0</div><div class="stat-label">平均出席</div></div>
<div class="stat-box"><div class="stat-num" id="attendanceRate">0%</div><div class="stat-label">出席率</div></div>
<div class="stat-box"><div class="stat-num" id="trend">--</div><div class="stat-label">趋势</div></div>
</div>
<div class="charts-grid">
<div class="chart-box"><div class="chart-title">📊 活动参与率对比</div><canvas id="barChart" width="400" height="300"></canvas></div>
<div class="chart-box"><div class="chart-title">📈 月度出席趋势</div><canvas id="lineChart" width="400" height="300"></canvas></div>
</div>
</div>
<script>
let barChart = null;
let lineChart = null;
document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem('engagementAnalysisData');
    if (saved) {
        try { const d = JSON.parse(saved); if (d.reports && d.reports.length > 0) { loadDemoFromData(d); applyBridgeMemberCount(); return; } } catch(e) {}
    }
    loadDemo();
    applyBridgeMemberCount();
});
function applyBridgeMemberCount() {
    if (!window.ChurchDataBridge) return;
    var n = (ChurchDataBridge.getMembers() || []).length;
    var el = document.getElementById('totalMembers');
    if (el && n > 0) el.textContent = n;
}
function loadDemoFromData(d) {
    document.getElementById('totalMembers').textContent = d.totalMembers || 300;
    document.getElementById('avgAttendance').textContent = d.avgAttendance || 152;
    document.getElementById('attendanceRate').textContent = (d.attendanceRate || 51) + '%';
    document.getElementById('trend').textContent = d.trend || '↑ 稳定';
    const reports = d.reports || [];
    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels: reports.map(r=>r.activity), datasets: [{ label: '参与率 (%)', data: reports.map(r=>r.rate), backgroundColor: ['rgba(76, 175, 80, 0.7)', 'rgba(255, 193, 7, 0.7)', 'rgba(33, 150, 243, 0.7)'] }] }, options: { scales: { y: { beginAtZero: true, max: 100 } } } });
    if (lineChart) lineChart.destroy();
    lineChart = new Chart(document.getElementById('lineChart'), { type: 'line', data: { labels: (d.lineLabels || ['1月','2月','3月','4月','5月','6月']), datasets: [{ label: '出席人数', data: d.lineData || [230,240,245,250,248,252], borderColor: 'rgba(76, 175, 80, 1)', backgroundColor: 'rgba(76, 175, 80, 0.2)', fill: true }] }, options: { scales: { y: { beginAtZero: false, min: 200 } } } });
    document.getElementById('loadBtn').style.display = 'none';
    applyBridgeMemberCount();
}
function loadDemo() {
const reports = [
{activity:'主日崇拜', members:300, attendance:245, rate:82},
{activity:'周三祷告会', members:300, attendance:60, rate:20},
{activity:'小组聚会', members:300, attendance:150, rate:50}
];
document.getElementById('totalMembers').textContent = 300;
document.getElementById('avgAttendance').textContent = Math.round((245+60+150)/3);
document.getElementById('attendanceRate').textContent = '51%';
document.getElementById('trend').textContent = '↑ 稳定';
const barCtx = document.getElementById('barChart');
if (barChart) barChart.destroy();
barChart = new Chart(barCtx, {
type: 'bar',
data: {
labels: reports.map(r => r.activity),
datasets: [{
label: '参与率 (%)',
data: reports.map(r => r.rate),
backgroundColor: ['rgba(76, 175, 80, 0.7)', 'rgba(255, 193, 7, 0.7)', 'rgba(33, 150, 243, 0.7)']
}]
},
options: { scales: { y: { beginAtZero: true, max: 100 } } }
});
const lineCtx = document.getElementById('lineChart');
if (lineChart) lineChart.destroy();
lineChart = new Chart(lineCtx, {
type: 'line',
data: {
labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
datasets: [{
label: '出席人数',
data: [230, 240, 245, 250, 248, 252],
borderColor: 'rgba(76, 175, 80, 1)',
backgroundColor: 'rgba(76, 175, 80, 0.2)',
fill: true
}]
},
options: { scales: { y: { beginAtZero: false, min: 200 } } }
});
document.getElementById('loadBtn').style.display = 'none';
localStorage.setItem('engagementAnalysisData', JSON.stringify({ reports, totalMembers: 300, avgAttendance: Math.round((245+60+150)/3), attendanceRate: 51, trend: '↑ 稳定', lineLabels: ['1月','2月','3月','4月','5月','6月'], lineData: [230,240,245,250,248,252] }));
applyBridgeMemberCount();
}
</script>

<script src="../../../js/church_data_bridge.js"></script>
<script src="../../js/cm_research_snapshot.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.CMResearchSnapshot)CMResearchSnapshot.initPage();});</script>

</body></html>
