<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="stylesheet" href="../../css/church_ministry_ui.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>參與趨勢分析 - Participation Trends Analysis · Participation Trends | Church Ministry</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.min.css">
    <link href="../../assets/css/fontawesome.min.css" rel="stylesheet">
    <script src="../../assets/js/chart.min.js"></script>
</head>
<body class="bg-gray-50 cm-research-page">
    <nav class="cm-back-bar" aria-label="區域導覽">
      <a class="cm-back-bar__link" href="../../dashboard.html">⛪ 返回教會事工</a>
      <span class="cm-back-bar__muted">研究與統計</span>
    </nav>
    <p class="cm-data-banner" role="status"><strong>資料來源：</strong><span id="cm-data-source-line">讀取中…</span></p>
    <div class="cm-kpi-row" aria-label="即時匯總（ChurchDataBridge）">
      <span class="cm-kpi-pill">會友 <b id="cm-kpi-members">—</b></span>
      <span class="cm-kpi-pill">小組 <b id="cm-kpi-groups">—</b></span>
      <span class="cm-kpi-pill">探訪任務 <b id="cm-kpi-missions">—</b></span>
      <span class="cm-kpi-pill">志工指派 <b id="cm-kpi-volunteers">—</b></span>
      <span class="cm-kpi-pill">財務結餘 <b id="cm-kpi-finance-balance">—</b></span>
    </div>
    <div class="container mx-auto px-4 py-6">
        <!-- 頁面標題 -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">參與趨勢分析</h1>
            <p class="text-gray-600">分析教會活動參與趨勢和成員參與度變化</p>
        </div>

        <!-- 參與概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-green-500 p-3 rounded-lg">
                        <i class="fas fa-users text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">平均參與率</p>
                        <p class="text-2xl font-bold text-gray-900">78.5%</p>
                        <p class="text-xs text-green-600">較上月 +5.2%</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-blue-500 p-3 rounded-lg">
                        <i class="fas fa-calendar text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">活動數量</p>
                        <p class="text-2xl font-bold text-gray-900">23</p>
                        <p class="text-xs text-blue-600">本月</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-purple-500 p-3 rounded-lg">
                        <i class="fas fa-star text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">滿意度</p>
                        <p class="text-2xl font-bold text-gray-900">4.6/5</p>
                        <p class="text-xs text-purple-600">較上月 +0.2</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-orange-500 p-3 rounded-lg">
                        <i class="fas fa-clock text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">平均時長</p>
                        <p class="text-2xl font-bold text-gray-900">2.5h</p>
                        <p class="text-xs text-orange-600">每次活動</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主要圖表區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- 參與率趨勢 -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">參與率趨勢</h2>
                <canvas id="participationRateChart" width="400" height="200"></canvas>
            </div>

            <!-- 活動類型參與度 -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">活動類型參與度</h2>
                <canvas id="activityTypeChart" width="400" height="200"></canvas>
            </div>
        </div>

        <!-- 參與分析表格 -->
        <div class="mb-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">參與分析詳情</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">活動類型</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">參與人數</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">參與率</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">滿意度</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">趨勢</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">崇拜聚會</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">1,156</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600 font-medium">93.7%</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">4.8/5</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <i class="fas fa-arrow-up text-green-500"></i>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">小組聚會</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">892</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-600 font-medium">72.3%</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">4.6/5</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <i class="fas fa-arrow-up text-green-500"></i>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">培訓課程</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">456</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-yellow-600 font-medium">37.0%</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">4.5/5</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <i class="fas fa-arrow-up text-green-500"></i>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">戶外活動</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">234</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-orange-600 font-medium">19.0%</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">4.7/5</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <i class="fas fa-arrow-up text-green-500"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 快速操作按鈕 -->
        <div class="mt-8 flex flex-wrap gap-4">
            <button onclick="alert('導出參與報告')" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-download mr-2"></i>導出報告
            </button>
            <button onclick="alert('設置參與目標')" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
                <i class="fas fa-bullseye mr-2"></i>設置目標
            </button>
            <button onclick="alert('查看詳細分析')" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-colors">
                <i class="fas fa-chart-bar mr-2"></i>詳細分析
            </button>
        </div>
    </div>

    <script>
        // 參與率趨勢圖表
        const participationRateCtx = document.getElementById('participationRateChart').getContext('2d');
        new Chart(participationRateCtx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                datasets: [{
                    label: '參與率 (%)',
                    data: [70, 72, 75, 73, 76, 78.5],
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 60,
                        max: 100
                    }
                }
            }
        });

        // 活動類型參與度圖表
        const activityTypeCtx = document.getElementById('activityTypeChart').getContext('2d');
        new Chart(activityTypeCtx, {
            type: 'doughnut',
            data: {
                labels: ['崇拜聚會', '小組聚會', '培訓課程', '戶外活動'],
                datasets: [{
                    data: [93.7, 72.3, 37.0, 19.0],
                    backgroundColor: [
                        'rgb(34, 197, 94)',
                        'rgb(59, 130, 246)',
                        'rgb(245, 158, 11)',
                        'rgb(239, 68, 68)'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });

        console.log('參與趨勢分析模組已載入');
    </script>

<script src="../../../js/church_data_bridge.js"></script>
<script src="../../js/cm_research_snapshot.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.CMResearchSnapshot)CMResearchSnapshot.initPage();});</script>

</body>
</html>
