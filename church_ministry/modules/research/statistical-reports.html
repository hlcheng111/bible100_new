<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="stylesheet" href="../../css/church_ministry_ui.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計報表 · Statistical Reports | Church Ministry</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.min.css">
    <link href="../../assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 cm-research-page">
    <nav class="cm-back-bar" aria-label="區域導覽">
      <a class="cm-back-bar__link" href="../../dashboard.html">⛪ 返回教會事工</a>
      <span class="cm-back-bar__muted">研究與統計</span>
    </nav>
    <p class="cm-data-banner" role="status"><strong>資料來源：</strong><span id="cm-data-source-line">讀取中…</span></p>
    <div class="cm-kpi-row" aria-label="即時匯總（ChurchDataBridge）">
      <span class="cm-kpi-pill">會友 <b id="cm-kpi-members">—</b></span>
      <span class="cm-kpi-pill">小組 <b id="cm-kpi-groups">—</b></span>
      <span class="cm-kpi-pill">探訪任務 <b id="cm-kpi-missions">—</b></span>
      <span class="cm-kpi-pill">志工指派 <b id="cm-kpi-volunteers">—</b></span>
      <span class="cm-kpi-pill">財務結餘 <b id="cm-kpi-finance-balance">—</b></span>
    </div>
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">統計報表中心</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 會員統計 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">會員統計</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">總會員數</span>
                        <span class="text-2xl font-bold text-blue-600">1,234</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">本月新增</span>
                        <span class="text-lg font-medium text-green-600">+23</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">活躍會員</span>
                        <span class="text-lg font-medium text-purple-600">892</span>
                    </div>
                    <button onclick="loadMemberStatistics()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700">
                        查看詳細
                    </button>
                </div>
            </div>

            <!-- 活動統計 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">活動統計</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">本月活動</span>
                        <span class="text-2xl font-bold text-green-600">23</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">參與人次</span>
                        <span class="text-lg font-medium text-blue-600">1,567</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">完成率</span>
                        <span class="text-lg font-medium text-purple-600">94%</span>
                    </div>
                    <button onclick="loadActivityStatistics()" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700">
                        查看詳細
                    </button>
                </div>
            </div>

            <!-- 財務統計 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">財務統計</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">本月收入</span>
                        <span class="text-2xl font-bold text-green-600">$45,678</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">本月支出</span>
                        <span class="text-lg font-medium text-red-600">$32,456</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">結餘</span>
                        <span class="text-lg font-medium text-blue-600">$13,222</span>
                    </div>
                    <button onclick="loadFinancialStatistics()" class="w-full bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700">
                        查看詳細
                    </button>
                </div>
            </div>
        </div>

        <!-- 快速導航 -->
        <div class="mt-8 bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">快速導航</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="loadMemberStatistics()" class="p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
                    <i class="fas fa-users text-blue-600 text-2xl mb-2"></i>
                    <div class="text-sm font-medium text-gray-900">會員統計</div>
                </button>
                <button onclick="loadActivityStatistics()" class="p-4 bg-green-50 rounded-lg hover:bg-green-100 transition-colors">
                    <i class="fas fa-calendar-check text-green-600 text-2xl mb-2"></i>
                    <div class="text-sm font-medium text-gray-900">活動統計</div>
                </button>
                <button onclick="loadFinancialStatistics()" class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors">
                    <i class="fas fa-dollar-sign text-purple-600 text-2xl mb-2"></i>
                    <div class="text-sm font-medium text-gray-900">財務統計</div>
                </button>
                <button onclick="loadTrendAnalysis()" class="p-4 bg-orange-50 rounded-lg hover:bg-orange-100 transition-colors">
                    <i class="fas fa-chart-line text-orange-600 text-2xl mb-2"></i>
                    <div class="text-sm font-medium text-gray-900">趨勢分析</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        let reports = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadReports();
        });

        function loadReports() {
            const saved = localStorage.getItem('research_statistical_reports');
            reports = saved ? JSON.parse(saved) : [];
        }

        function saveToStorage() {
            localStorage.setItem('research_statistical_reports', JSON.stringify(reports));
        }

        function loadMemberStatistics() {
            const report = {
                id: Date.now(),
                type: 'member',
                title: '會員統計報表',
                generatedDate: new Date().toISOString(),
                data: {
                    total: 1234,
                    newThisMonth: 23,
                    active: 892
                }
            };
            reports.push(report);
            saveToStorage();
            alert('✅ 會員統計報表已生成並保存！\n\n總會員：' + report.data.total + '\n本月新增：' + report.data.newThisMonth + '\n活躍會員：' + report.data.active);
        }

        function loadActivityStatistics() {
            const report = {
                id: Date.now(),
                type: 'activity',
                title: '活動統計報表',
                generatedDate: new Date().toISOString(),
                data: {
                    totalActivities: 23,
                    participants: 1567,
                    completionRate: 94
                }
            };
            reports.push(report);
            saveToStorage();
            alert('✅ 活動統計報表已生成並保存！\n\n本月活動：' + report.data.totalActivities + '\n參與人次：' + report.data.participants + '\n完成率：' + report.data.completionRate + '%');
        }

        function loadFinancialStatistics() {
            const report = {
                id: Date.now(),
                type: 'financial',
                title: '財務統計報表',
                generatedDate: new Date().toISOString(),
                data: {
                    income: 45678,
                    expense: 32456,
                    balance: 13222
                }
            };
            reports.push(report);
            saveToStorage();
            alert('✅ 財務統計報表已生成並保存！\n\n本月收入：$' + report.data.income + '\n本月支出：$' + report.data.expense + '\n結餘：$' + report.data.balance);
        }

        function loadTrendAnalysis() {
            const report = {
                id: Date.now(),
                type: 'trend',
                title: '趨勢分析報表',
                generatedDate: new Date().toISOString(),
                data: {
                    growthRate: 5.2,
                    trend: 'increasing',
                    prediction: 'positive'
                }
            };
            reports.push(report);
            saveToStorage();
            alert('✅ 趨勢分析報表已生成並保存！\n\n增長率：' + report.data.growthRate + '%\n趨勢：上升\n預測：正面');
        }

        // 查看所有報表
        function viewAllReports() {
            if (reports.length === 0) {
                alert('⚠️ 暫無報表，請先生成報表');
                return;
            }
            
            let reportList = '📊 已生成的報表（' + reports.length + '個）：\n\n';
            reports.forEach((report, index) => {
                reportList += (index + 1) + '. ' + report.title + '\n';
                reportList += '   生成時間：' + new Date(report.generatedDate).toLocaleString('zh-TW') + '\n\n';
            });
            
            alert(reportList);
        }

        // 導出所有報表
        function exportAllReports() {
            if (reports.length === 0) {
                alert('⚠️ 暫無報表可導出');
                return;
            }

            const csvContent = '報表類型,報表標題,生成時間,數據\n' + 
                reports.map(r => [
                    r.type,
                    r.title,
                    new Date(r.generatedDate).toLocaleString('zh-TW'),
                    JSON.stringify(r.data)
                ].join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `研究統計報表_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert('✅ 報表已導出！');
        }

        // 清空所有報表
        function clearAllReports() {
            if (!confirm('確定清空所有報表？此操作不可恢復！')) return;
            
            reports = [];
            saveToStorage();
            alert('✅ 所有報表已清空！');
        }
    </script>

<script src="../../../js/church_data_bridge.js"></script>
<script src="../../js/cm_research_snapshot.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.CMResearchSnapshot)CMResearchSnapshot.initPage();});</script>

</body>
</html>
