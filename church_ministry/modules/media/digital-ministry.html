<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>数位事工管理 · Digital Ministry | Church Ministry</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%); color: white; padding: 15px 20px; }
.tabs { display: flex; gap: 5px; margin-top: 10px; }
.tab { padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 11px; }
.tab.active { background: white; color: #1abc9c; font-weight: 600; }
.container { max-width: 1800px; margin: 0 auto; padding: 15px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #1abc9c; color: white; margin: 5px; }
.btn-sm { padding: 6px 12px; font-size: 11px; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; position: relative; }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
.form-input, .form-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
<div class="header">
    <h1>📱 数位事工管理</h1>
    <div class="tabs">
        <button class="tab active" onclick="switchTab('platforms')">📱 平台</button>
        <button class="tab" onclick="switchTab('content')">📝 内容</button>
        <button class="tab" onclick="switchTab('analytics')">📊 数据</button>
    </div>
</div>
<div class="container">
    <div id="tab-platforms" class="tab-content active">
        <div class="card">
            <h3 style="margin-bottom:15px;">📱 数位平台管理</h3>
            <button class="btn" onclick="showAddPlatformModal()">➕ 新增平台</button>
            <table id="platformsTable"><thead><tr><th>平台</th><th>粉丝数</th><th>月发文</th><th>互动率</th><th>操作</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
    <div id="tab-content" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:15px;">📝 内容发布记录</h3>
            <button class="btn" onclick="showAddContentModal()">➕ 新增内容</button>
            <table id="contentTable"><thead><tr><th>标题</th><th>平台</th><th>发布日期</th><th>阅读/观看</th><th>点赞</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
    <div id="tab-analytics" class="tab-content">
        <div class="card">
            <h3>📊 数据分析</h3>
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
<script>
let data = { platforms: [], content: [] };
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('digitalMinistryData');
    if (saved) data = JSON.parse(saved);
    if (data.platforms.length === 0) { data.platforms = [{id:1,name:'微信公众号',followers:5000,posts:20,engagement:15}]; data.content = [{id:1,title:'主日信息分享',platform:'微信公众号',date:'2025-10-10',views:800,likes:120}]; localStorage.setItem('digitalMinistryData', JSON.stringify(data)); }
    renderAll();
});
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}
function renderAll() {
    document.querySelector('#platformsTable tbody').innerHTML = data.platforms.map(p => `<tr><td>${p.name}</td><td>${p.followers}</td><td>${p.posts}篇</td><td>${p.engagement}%</td><td><button class="btn btn-sm" onclick="delPlatform(${p.id})">删除</button></td></tr>`).join('');
    document.querySelector('#contentTable tbody').innerHTML = data.content.map(c => `<tr><td>${c.title}</td><td>${c.platform}</td><td>${c.date}</td><td>${c.views}</td><td>${c.likes}</td></tr>`).join('');
}
function showModal(title, content) {
    document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;margin-bottom:20px;">${title}</div>${content}`;
    document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function showAddPlatformModal() {
    showModal('➕ 新增平台', `<div class="form-group"><label>平台名称</label><select id="pname" class="form-select"><option>微信公众号</option><option>抖音</option><option>YouTube</option><option>Instagram</option></select></div><div class="form-group"><label>粉丝数</label><input type="number" id="pfollowers" class="form-input" value="0"></div><button class="btn" onclick="addPlatform()">确定</button>`);
}
function addPlatform() {
    data.platforms.push({id:Date.now(),name:document.getElementById('pname').value,followers:parseInt(document.getElementById('pfollowers').value),posts:0,engagement:0});
    localStorage.setItem('digitalMinistryData', JSON.stringify(data));
    renderAll();
    closeModal();
    alert('✅ 已添加！');
}
function delPlatform(id) {
    if (confirm('删除？')) {
        data.platforms = data.platforms.filter(p => p.id !== id);
        localStorage.setItem('digitalMinistryData', JSON.stringify(data));
        renderAll();
    }
}
function showAddContentModal() { alert('功能：新增内容'); }
</script>

<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
