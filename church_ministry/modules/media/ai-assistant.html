<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>AI助手管理 · Ai Assistant | Church Ministry</title>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.tool-card { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #667eea; }
.tool-card h3 { color: #667eea; margin-bottom: 10px; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #667eea; color: white; margin: 5px; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
<div class="header"><h1>🤖 AI助手管理系统</h1></div>
<div class="container">
    <div class="card">
        <h3 style="margin-bottom:20px;">🛠️ AI工具集</h3>
        <div class="tool-card">
            <h3>📝 讲道稿AI辅助</h3>
            <p style="font-size:11px;color:#7f8c8d;margin-bottom:10px;">输入主题和经文，AI生成讲道大纲建议</p>
            <button class="btn" onclick="useAI('sermon')">🚀 启动工具</button>
        </div>
        <div class="tool-card">
            <h3>🎵 诗歌选择AI推荐</h3>
            <p style="font-size:11px;color:#7f8c8d;margin-bottom:10px;">根据主题和会众特点，AI推荐适合诗歌</p>
            <button class="btn" onclick="useAI('song')">🚀 启动工具</button>
        </div>
        <div class="tool-card">
            <h3>📊 数据分析AI助手</h3>
            <p style="font-size:11px;color:#7f8c8d;margin-bottom:10px;">分析教会数据，AI生成洞察报告</p>
            <button class="btn" onclick="useAI('data')">🚀 启动工具</button>
        </div>
    </div>
    <div class="card">
        <h3 style="margin-bottom:15px;">📋 使用记录</h3>
        <table id="usageTable"><thead><tr><th>日期</th><th>工具</th><th>用户</th><th>用途</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let usage = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('aiAssistantData');
    if (saved) usage = JSON.parse(saved);
    if (usage.length === 0) { usage = [{id:1,date:'2025-10-10',tool:'讲道稿辅助',user:'李牧师',purpose:'创世记讲道'}]; localStorage.setItem('aiAssistantData', JSON.stringify(usage)); }
    render();
});
function render() {
    document.querySelector('#usageTable tbody').innerHTML = usage.map(u => `<tr><td>${u.date}</td><td>${u.tool}</td><td>${u.user}</td><td>${u.purpose}</td></tr>`).join('');
}
function useAI(type) {
    const tools = {sermon:'讲道稿AI辅助', song:'诗歌AI推荐', data:'数据AI分析'};
    alert(`🤖 启动${tools[type]}\n\n（此处可集成实际AI工具）`);
    usage.push({id:Date.now(),date:new Date().toISOString().split('T')[0],tool:tools[type],user:'当前用户',purpose:'使用记录'});
    localStorage.setItem('aiAssistantData', JSON.stringify(usage));
    render();
}
</script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
