<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講道筆記模板 · Sermon Notes Admin | Church Ministry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei'; background: #f5f6fa; padding: 20px; font-size: 12px; }
        .header { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #555; }
        .form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
        .form-textarea { min-height: 180px; font-family: inherit; }
        .form-hint { font-size: 11px; color: #666; margin-top: 6px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #e67e22; color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-AE-SUB" data-b100-ae-zone="a">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
    <div class="header">
        <h1>📝 講道筆記模板管理</h1>
        <p style="margin-top:8px;opacity:0.95;">設定會眾端填空式講道筆記大綱。使用 ___ 標記填空處。</p>
    </div>
    <div class="card">
        <div class="form-group">
            <label class="form-label">講道標題</label>
            <input type="text" id="title" class="form-input" placeholder="例：信心的功課">
        </div>
        <div class="form-group">
            <label class="form-label">日期</label>
            <input type="text" id="date" class="form-input" placeholder="例：2025-03-09 或 第10週">
        </div>
        <div class="form-group">
            <label class="form-label">大綱（以 ___ 標記填空處）</label>
            <textarea id="outline" class="form-textarea" placeholder="例：
一、引言
今天我們要從 ___ 學習 ___

二、本論
1. 第一個重點 ___
2. 第二個重點 ___
3. 第三個重點 ___

三、結論
願我們 ___"></textarea>
            <div class="form-hint">會眾在 Church Center 講道筆記頁面會看到大綱，每個 ___ 處會變成可填寫的輸入框。</div>
        </div>
        <button class="btn" onclick="saveTemplate()">儲存模板</button>
    </div>

    <script>
        const STORAGE_KEY = 'sermonNotesTemplate';

        function loadTemplate() {
            try {
                const t = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (t) {
                    document.getElementById('title').value = t.title || '';
                    document.getElementById('date').value = t.date || '';
                    document.getElementById('outline').value = t.outline || '';
                }
            } catch (e) {}
        }

        function saveTemplate() {
            const template = {
                id: 't' + Date.now(),
                title: document.getElementById('title').value,
                date: document.getElementById('date').value,
                outline: document.getElementById('outline').value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(template));
            alert('模板已儲存！會眾可至 會眾入口 → 講道筆記 填寫。');
        }

        loadTemplate();
    </script>
