<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崇拜出席管理 · Attendance Management | Church Ministry</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.min.css">
    <script src="../../assets/js/chart.min.js"></script>
    <link href="../../assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="container mx-auto px-4 py-6">
        <div class="flex items-center gap-3 mb-4">
            <a href="../../dashboard.html" class="text-gray-600 hover:text-gray-900 text-sm">⛪ 教會事工中心</a>
            <span class="text-gray-400">|</span>
            <a href="worship-integrated.html" class="text-gray-600 hover:text-gray-900 text-sm">敬拜事工整合</a>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">崇拜出席管理</h1>
        <details class="mb-6 p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm text-gray-700">
            <summary class="cursor-pointer font-semibold text-gray-900">📋 本頁角色</summary>
            <p class="mt-2 leading-relaxed">系統性<strong>點名與出席率</strong>；與招待口頭「人數匯報」可並存，但請在團隊內約定「以哪一個數字為準」。報表與圖表請搭配 <a href="worship-reports.html" class="text-blue-700 underline">崇拜統計報表</a>。</p>
        </details>
        
        <!-- 快速操作 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <button onclick="showAttendanceForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i>記錄出席
            </button>
            <button onclick="showBulkEntry()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                <i class="fas fa-users mr-2"></i>批量記錄
            </button>
            <button onclick="generateReport()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                <i class="fas fa-chart-bar mr-2"></i>生成報表
            </button>
            <button onclick="exportData()" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">
                <i class="fas fa-download mr-2"></i>導出數據
            </button>
        </div>

        <!-- 統計概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-blue-600" id="todayAttendance">0</div>
                <div class="text-sm text-gray-600">今日出席</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-green-600" id="weeklyAttendance">0</div>
                <div class="text-sm text-gray-600">本週出席</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-purple-600" id="monthlyAverage">0%</div>
                <div class="text-sm text-gray-600">月平均出席率</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-orange-600" id="totalServices">0</div>
                <div class="text-sm text-gray-600">崇拜場次</div>
            </div>
        </div>

        <!-- 圖表區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">出席趨勢</h3>
                <canvas id="attendanceChart" height="300"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">出席狀態</h3>
                <canvas id="statusChart" height="300"></canvas>
            </div>
        </div>

        <!-- 今日記錄 -->
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">今日出席記錄</h3>
            <div id="todayRecords" class="space-y-2">
                <!-- 動態生成記錄 -->
            </div>
        </div>
    </div>

    <!-- 批量記錄模態框 -->
    <div id="bulkModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-4xl">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">批量記錄出席</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">崇拜日期</label>
                            <input type="date" id="bulkServiceDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">崇拜時間</label>
                            <select id="bulkServiceTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="09:00">09:00 早堂</option>
                                <option value="11:00">11:00 午堂</option>
                                <option value="19:00">19:00 晚堂</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">默認狀態</label>
                            <select id="defaultStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="present">出席</option>
                                <option value="absent">缺席</option>
                                <option value="late">遲到</option>
                                <option value="excused">請假</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">會員列表</label>
                        <div id="bulkMemberList" class="max-h-96 overflow-y-auto border border-gray-300 rounded-lg p-4">
                            <!-- 動態生成會員列表 -->
                        </div>
                    </div>
                    
                    <div class="flex space-x-3 pt-4">
                        <button onclick="saveBulkAttendance()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 flex-1">
                            保存所有記錄
                        </button>
                        <button onclick="closeBulkModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex-1">
                            取消
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 出席記錄表單 -->
    <div id="attendanceModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">記錄出席</h3>
                <form id="attendanceForm">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">會員姓名</label>
                            <select id="memberSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="">請選擇會員</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">出席狀態</label>
                            <select id="statusSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="present">出席</option>
                                <option value="absent">缺席</option>
                                <option value="late">遲到</option>
                                <option value="excused">請假</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">備註</label>
                            <textarea id="notesInput" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                        </div>
                    </div>
                    <div class="flex space-x-3 mt-6">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex-1">保存</button>
                        <button type="button" onclick="closeModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex-1">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let attendanceData = [];
        let members = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderStatistics();
            setupCharts();
            renderTodayRecords();
        });

        function loadData() {
            attendanceData = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
            members = JSON.parse(localStorage.getItem('churchMembers')) || [];
            
            if (attendanceData.length === 0) {
                loadSampleData();
            }
        }

        function loadSampleData() {
            const today = new Date().toISOString().split('T')[0];
            const sampleData = [
                { id: '1', memberName: '張三', status: 'present', date: today, notes: '' },
                { id: '2', memberName: '李四', status: 'late', date: today, notes: '交通延誤' }
            ];
            attendanceData = sampleData;
            localStorage.setItem('attendanceRecords', JSON.stringify(attendanceData));
        }

        function renderStatistics() {
            const today = new Date().toISOString().split('T')[0];
            const todayRecords = attendanceData.filter(r => r.date === today);
            const todayPresent = todayRecords.filter(r => r.status === 'present').length;
            
            document.getElementById('todayAttendance').textContent = todayPresent;
            document.getElementById('weeklyAttendance').textContent = todayPresent * 7; // 簡化計算
            document.getElementById('monthlyAverage').textContent = '75%'; // 簡化計算
            document.getElementById('totalServices').textContent = attendanceData.length;
        }

        function setupCharts() {
            // 出席趨勢圖表
            const ctx1 = document.getElementById('attendanceChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
                    datasets: [{
                        label: '出席人數',
                        data: [45, 42, 48, 50, 47, 52, 55],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });

            // 出席狀態圖表
            const ctx2 = document.getElementById('statusChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['出席', '缺席', '遲到', '請假'],
                    datasets: [{
                        data: [55, 15, 8, 2],
                        backgroundColor: [
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(251, 146, 60, 0.8)',
                            'rgba(107, 114, 128, 0.8)'
                        ]
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderTodayRecords() {
            const today = new Date().toISOString().split('T')[0];
            const todayRecords = attendanceData.filter(r => r.date === today);
            
            const container = document.getElementById('todayRecords');
            container.innerHTML = todayRecords.map(record => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">${record.memberName}</span>
                    <span class="px-2 py-1 text-xs font-medium rounded-full ${getStatusClass(record.status)}">
                        ${getStatusText(record.status)}
                    </span>
                    <span class="text-sm text-gray-500">${record.notes || ''}</span>
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            const classes = {
                'present': 'bg-green-100 text-green-800',
                'absent': 'bg-red-100 text-red-800',
                'late': 'bg-yellow-100 text-yellow-800',
                'excused': 'bg-gray-100 text-gray-800'
            };
            return classes[status] || 'bg-gray-100 text-gray-800';
        }

        function getStatusText(status) {
            const texts = {
                'present': '出席',
                'absent': '缺席',
                'late': '遲到',
                'excused': '請假'
            };
            return texts[status] || status;
        }

        function showAttendanceForm() {
            document.getElementById('attendanceModal').classList.remove('hidden');
            populateMemberSelect();
        }

        function populateMemberSelect() {
            const select = document.getElementById('memberSelect');
            select.innerHTML = '<option value="">請選擇會員</option>' + 
                members.map(member => `<option value="${member.id}">${member.name}</option>`).join('');
        }

        function populateBulkMemberList() {
            const container = document.getElementById('bulkMemberList');
            container.innerHTML = members.map(member => `
                <div class="flex items-center justify-between p-2 border-b border-gray-200">
                    <span class="text-sm text-gray-700">${member.name}</span>
                    <select class="member-status px-2 py-1 border border-gray-300 rounded text-sm" data-member-id="${member.id}">
                        <option value="present">出席</option>
                        <option value="absent">缺席</option>
                        <option value="late">遲到</option>
                        <option value="excused">請假</option>
                    </select>
                </div>
            `).join('');
        }

        function closeModal() {
            document.getElementById('attendanceModal').classList.add('hidden');
        }

        function closeBulkModal() {
            document.getElementById('bulkModal').classList.add('hidden');
        }

        function saveBulkAttendance() {
            const serviceDate = document.getElementById('bulkServiceDate').value;
            const serviceTime = document.getElementById('bulkServiceTime').value;
            const defaultStatus = document.getElementById('defaultStatus').value;
            
            if (!serviceDate) {
                alert('請選擇崇拜日期！');
                return;
            }
            
            const statusSelects = document.querySelectorAll('.member-status');
            let savedCount = 0;
            
            statusSelects.forEach(select => {
                const memberId = select.dataset.memberId;
                const memberName = members.find(m => m.id === memberId)?.name || '';
                const status = select.value;
                
                const record = {
                    id: Date.now().toString() + Math.random(),
                    memberName: memberName,
                    status: status,
                    date: serviceDate,
                    notes: ''
                };
                
                attendanceData.push(record);
                savedCount++;
            });
            
            localStorage.setItem('attendanceRecords', JSON.stringify(attendanceData));
            
            closeBulkModal();
            renderStatistics();
            renderTodayRecords();
            
            alert(`已保存 ${savedCount} 條出席記錄！`);
        }

        function showBulkEntry() {
            document.getElementById('bulkModal').classList.remove('hidden');
            document.getElementById('bulkServiceDate').value = new Date().toISOString().split('T')[0];
            populateBulkMemberList();
        }

        function generateReport() {
            showComingSoon('此功能暫未開放','../../dashboard.html');
        }

        function exportData() {
            const csvContent = ['會員姓名,出席狀態,日期,備註
', 
                ...attendanceData.map(record => [
                    record.memberName,
                    getStatusText(record.status),
                    record.date,
                    record.notes || ''
                ].join(',') + '
')
            ].join('');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `崇拜出席記錄_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // 表單提交處理
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const memberId = document.getElementById('memberSelect').value;
            const memberName = members.find(m => m.id === memberId)?.name || '';
            const status = document.getElementById('statusSelect').value;
            const notes = document.getElementById('notesInput').value;
            const today = new Date().toISOString().split('T')[0];
            
            const newRecord = {
                id: Date.now().toString(),
                memberName: memberName,
                status: status,
                date: today,
                notes: notes
            };
            
            attendanceData.push(newRecord);
            localStorage.setItem('attendanceRecords', JSON.stringify(attendanceData));
            
            closeModal();
            renderStatistics();
            renderTodayRecords();
            
            alert('出席記錄已保存！');
        });
    </script>
<script src="../../../js/coming-soon.js"></script>
</body>
</html>
