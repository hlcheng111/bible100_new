<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>敬拜团队管理 · Worship Team Management | Church Ministry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
        .header { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: white; padding: 15px 20px; }
        .header h1 { font-size: 20px; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; }
        .tab { padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 11px; }
        .tab.active { background: white; color: #9b59b6; font-weight: 600; }
        .container { max-width: 1800px; margin: 0 auto; padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; border-left: 4px solid #9b59b6; padding-left: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; margin-right: 5px; background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
        table th { background: #f8f9fa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
        .member-id-badge { font-size: 9px; color: #059669; background: #ecfdf5; padding: 2px 6px; border-radius: 4px; }
        .w2-toolbar { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 11px; }
        .w2-toolbar button { margin-right: 6px; margin-bottom: 4px; padding: 6px 10px; border-radius: 6px; border: 1px solid #9b59b6; background: #fff; color: #6b21a8; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-AE-SUB" data-b100-ae-chrome="minimal" data-b100-ae-zone="a">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="header">
        <h1>🎵 敬拜团队管理</h1>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('members')">👥 成员</button>
            <button class="tab" onclick="switchTab('schedule')">📅 排班</button>
            <button class="tab" onclick="switchTab('songs')">🎵 曲目</button>
        </div>
                        </div>
    <div class="container">
        <div class="w2-toolbar" id="w2Toolbar">
            <strong>W2</strong>
            <button type="button" id="btnLinkMembers">🔗 对齐 memberId（成员+排班）</button>
            <button type="button" id="btnSyncMaster">↗ 同步 churchMasterDatabase</button>
            <button type="button" onclick="exportTeamMembersCsv()" data-w5-report="worship-team-members-csv">⬇ 成員 CSV</button>
            <button type="button" onclick="exportTeamScheduleCsv()" data-w5-report="worship-team-schedule-csv">⬇ 排班 CSV</button>
            <button type="button" onclick="printTeamRoster()" data-w5-report="worship-team-print">🖨 列印名冊</button>
            <span id="w2Status"></span>
        </div>
        <div id="tab-members" class="tab-content active">
            <div class="card">
                <div class="card-title">👥 团队成员</div>
                <button class="btn" onclick="showAddMemberModal()">➕ 新增成员</button>
                <table id="membersTable"><thead><tr><th>姓名</th><th>职位</th><th>memberId</th><th>服事次数</th><th>操作</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
        <div id="tab-schedule" class="tab-content">
            <div class="card">
                <div class="card-title">📅 本月排班</div>
                <button class="btn" onclick="showAddScheduleModal()">➕ 新增排班</button>
                <table id="scheduleTable"><thead><tr><th>日期</th><th>主领</th><th>键盘</th><th>吉他</th><th>鼓手</th><th>memberId 槽位</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
        <div id="tab-songs" class="tab-content">
            <div class="card">
                <div class="card-title">🎵 曲目库</div>
                <button class="btn" onclick="showAddSongModal()">➕ 新增曲目</button>
                <table id="songsTable"><thead><tr><th>歌名</th><th>调号</th><th>速度</th><th>使用次数</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </div>
    <div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
    <script>
        let data = { members: [], schedules: [], songs: [] };
        function persist() {
            if (window.WorshipTeamBridge) WorshipTeamBridge.save(data);
            else {
                localStorage.setItem('worshipTeamData', JSON.stringify(data));
            }
            if (window.WorshipPlanSync) WorshipPlanSync.syncFromWorshipTeam();
        }
        document.addEventListener('DOMContentLoaded', () => {
            if (window.WorshipTeamBridge) data = WorshipTeamBridge.load();
            else {
                const saved = localStorage.getItem('worshipTeamData');
                if (saved) data = JSON.parse(saved);
            }
            if (data.members.length === 0) loadDemo();
            renderAll();
            document.getElementById('btnLinkMembers').onclick = function () {
                if (!window.WorshipTeamBridge) { alert('请先载入 W2 脚本'); return; }
                var stats = WorshipTeamBridge.autoLinkAll(data);
                data = WorshipTeamBridge.load();
                renderAll();
                document.getElementById('w2Status').textContent =
                    '成员 ' + stats.membersLinked + '/' + stats.membersTotal + ' · 排班槽 ' + stats.scheduleSlots;
            };
            document.getElementById('btnSyncMaster').onclick = function () {
                if (window.WorshipTeamBridge) WorshipTeamBridge.syncToMaster(data);
                document.getElementById('w2Status').textContent = '已同步 master · ' + new Date().toLocaleTimeString();
            };
            window.addEventListener('worshipTeamLinked', function () {
                data = WorshipTeamBridge.load();
                renderAll();
            });
        });
        function loadDemo() {
            data.members = [{id:1,name:'王弟兄',position:'主领',count:15},{id:2,name:'李姊妹',position:'键盘',count:12}];
            data.schedules = [{id:1,date:'2025-10-13',lead:'王弟兄',keyboard:'李姊妹',guitar:'张弟兄',drums:'陈弟兄'}];
            data.songs = [{id:1,name:'赞美之泉',key:'G',tempo:'中速',count:20}];
            persist();
            renderAll();
        }
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }
        function renderAll() {
            document.querySelector('#membersTable tbody').innerHTML = data.members.map(m => `<tr><td>${m.name}</td><td>${m.position}</td><td>${m.memberId != null ? '<span class="member-id-badge">' + m.memberId + '</span>' : '—'}</td><td>${m.count}次</td><td><button class="btn btn-sm" onclick="deleteMember(${m.id})">删除</button></td></tr>`).join('');
            document.querySelector('#scheduleTable tbody').innerHTML = data.schedules.map(s => {
                var slots = ['lead','keyboard','guitar','drums'].map(function(f) {
                    return s[f + 'MemberId'] != null ? f + ':' + s[f + 'MemberId'] : '';
                }).filter(Boolean).join(' ');
                return `<tr><td>${s.date}</td><td>${s.lead}</td><td>${s.keyboard}</td><td>${s.guitar}</td><td>${s.drums}</td><td><small>${slots || '—'}</small></td></tr>`;
            }).join('');
            document.querySelector('#songsTable tbody').innerHTML = data.songs.map(s => `<tr><td>${s.name}</td><td>${s.key}</td><td>${s.tempo}</td><td>${s.count}次</td></tr>`).join('');
        }
        function showModal(title, content) {
            document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;font-weight:600;margin-bottom:20px;">${title}</div>${content}`;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function showAddMemberModal() {
            showModal('➕ 新增成员', `<div class="form-group"><label class="form-label">姓名</label><input type="text" id="mname" class="form-input"></div><div class="form-group"><label class="form-label">职位</label><select id="mposition" class="form-select"><option>主领</option><option>键盘</option><option>吉他</option><option>贝斯</option><option>鼓手</option></select></div><button class="btn" onclick="addMember()">确定</button>`);
        }
        function addMember() {
            data.members.push({id:Date.now(),name:document.getElementById('mname').value,position:document.getElementById('mposition').value,count:0});
            persist();
            renderAll();
            closeModal();
            alert('✅ 已添加！');
        }
        function deleteMember(id) {
            if (confirm('删除？')) {
                data.members = data.members.filter(m => m.id !== id);
                persist();
                renderAll();
            }
        }
        function showAddScheduleModal() {
            showModal('➕ 新增排班', `<div class="form-group"><label>日期</label><input type="date" id="sdate" class="form-input"></div>
                <div class="form-group"><label>主领</label><input type="text" id="slead" class="form-input"></div>
                <div class="form-group"><label>键盘</label><input type="text" id="skeyboard" class="form-input"></div>
                <div class="form-group"><label>吉他</label><input type="text" id="sguitar" class="form-input"></div>
                <div class="form-group"><label>鼓手</label><input type="text" id="sdrums" class="form-input"></div>
                <button class="btn" onclick="addSchedule()">确定</button>`);
        }
        function addSchedule() {
            data.schedules.push({
                id: Date.now(),
                date: document.getElementById('sdate').value,
                lead: document.getElementById('slead').value,
                keyboard: document.getElementById('skeyboard').value,
                guitar: document.getElementById('sguitar').value,
                drums: document.getElementById('sdrums').value
            });
            if (window.WorshipTeamBridge) WorshipTeamBridge.autoLinkAll(data);
            data = WorshipTeamBridge ? WorshipTeamBridge.load() : data;
            persist();
            renderAll();
            closeModal();
        }
        function showAddSongModal() { showModal('➕ 新增曲目', `<div class="form-group"><label>歌名</label><input type="text" id="sname" class="form-input"></div><button class="btn" onclick="addSong()">确定</button>`); }
        function addSong() { alert('功能完成中'); closeModal(); }
        function csvEsc(v) {
            if (window.CmReportUtils) return CmReportUtils.csvEsc(v);
            var s = v == null ? '' : String(v);
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }
        function downloadCsv(filename, lines) {
            if (window.CmReportUtils) return CmReportUtils.downloadCsv(filename, lines);
            var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
        function exportTeamMembersCsv() {
            var lines = ['id,name,position,memberId,count'];
            (data.members || []).forEach(function (m) {
                lines.push([m.id, m.name, m.position, m.memberId || '', m.count || 0].map(csvEsc).join(','));
            });
            downloadCsv('worship_team_members_' + new Date().toISOString().slice(0,10) + '.csv', lines);
        }
        function exportTeamScheduleCsv() {
            var lines = ['date,lead,keyboard,guitar,drums'];
            (data.schedules || []).forEach(function (s) {
                lines.push([s.date, s.lead, s.keyboard, s.guitar, s.drums].map(csvEsc).join(','));
            });
            downloadCsv('worship_team_schedule_' + new Date().toISOString().slice(0,10) + '.csv', lines);
        }
        function printTeamRoster() {
            var headers = ['姓名','職位','memberId','次數'];
            var rows = (data.members || []).map(function (m) {
                return [m.name, m.position, m.memberId || '', m.count || 0];
            });
            if (window.CmReportUtils) CmReportUtils.printTable('敬拜團隊名冊', headers, rows);
            else window.print();
        }
    </script>
