<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>会众诗歌管理 · Congregational Songs | Church Ministry</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #1abc9c; color: white; margin: 5px; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; position: relative; }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
.form-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="header"><h1>🎵 会众诗歌管理</h1>
    <details style="margin-top:10px;font-size:11px;opacity:0.95;">
        <summary style="cursor:pointer;font-weight:600;">📋 角色說明</summary>
        <p style="margin-top:6px;line-height:1.5;">主日<strong>選歌與使用次數</strong>；採購／贈送／借用與「主日唱詩紀錄」見下方。全教會索引請用 <a href="song-library.html" style="color:#fff;text-decoration:underline;">詩歌庫</a>；樂譜檔請用 <a href="sheet-music.html" style="color:#fff;text-decoration:underline;">樂譜管理</a>。</p>
    </details></div>
<div class="container">
    <div class="card">
        <h3 style="margin-bottom:15px;">📚 诗歌库</h3>
        <button class="btn" onclick="showAddModal()">➕ 新增诗歌</button>
        <input type="text" placeholder="🔍 搜索..." onkeyup="render()" id="search" style="width:100%;padding:8px;margin:10px 0;border:1px solid #ddd;border-radius:4px;">
        <table id="table"><thead><tr><th>歌名</th><th>分类</th><th>调号</th><th>使用次数</th><th>操作</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card" style="margin-top:15px;">
        <h3 style="margin-bottom:10px;">📦 採購／贈送／借用紀錄</h3>
        <button class="btn" onclick="showPurchaseModal()">➕ 新增一筆</button>
        <table id="purchaseTable" style="margin-top:10px;"><thead><tr><th>日期</th><th>來源</th><th>歌本／項目</th><th>金額／備註</th><th></th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card" style="margin-top:15px;">
        <h3 style="margin-bottom:10px;">🎤 主日使用紀錄（唱詩）</h3>
        <button class="btn" onclick="showUsageModal()">➕ 登記主日</button>
        <table id="usageTable" style="margin-top:10px;"><thead><tr><th>主日日期</th><th>歌名</th><th>聚會</th><th>備註</th><th></th></tr></thead><tbody></tbody></table>
    </div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
<script>
let songs = [];
var congPurchases = [];
var congUsage = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('songsData');
    if (saved) songs = JSON.parse(saved);
    if (songs.length === 0) loadDemo();
    congPurchases = JSON.parse(localStorage.getItem('church_ministry_cong_purchase_v1') || '[]');
    congUsage = JSON.parse(localStorage.getItem('church_ministry_cong_usage_v1') || '[]');
    render();
    renderPurchase();
    renderUsage();
});
function renderPurchase() {
    document.querySelector('#purchaseTable tbody').innerHTML = congPurchases.map(function (p) {
        return '<tr><td>' + p.date + '</td><td>' + p.source + '</td><td>' + p.item + '</td><td>' + p.note + '</td><td><button class="btn" style="padding:4px 8px;" onclick="delPurchase(' + p.id + ')">刪</button></td></tr>';
    }).join('');
}
function renderUsage() {
    document.querySelector('#usageTable tbody').innerHTML = congUsage.map(function (u) {
        return '<tr><td>' + u.date + '</td><td>' + u.song + '</td><td>' + u.service + '</td><td>' + u.note + '</td><td><button class="btn" style="padding:4px 8px;" onclick="delUsage(' + u.id + ')">刪</button></td></tr>';
    }).join('');
}
function showPurchaseModal() {
    showModal('採購／贈送／借用', '<div class="form-group"><label>日期</label><input type="date" id="pd" class="form-input"></div><div class="form-group"><label>來源（書店／贈送／借用）</label><input id="ps" class="form-input"></div><div class="form-group"><label>歌本／項目</label><input id="pi" class="form-input"></div><div class="form-group"><label>金額／備註</label><input id="pn" class="form-input"></div><button class="btn" onclick="savePurchase()">儲存</button>');
}
function savePurchase() {
    congPurchases.push({ id: Date.now(), date: document.getElementById('pd').value, source: document.getElementById('ps').value, item: document.getElementById('pi').value, note: document.getElementById('pn').value });
    localStorage.setItem('church_ministry_cong_purchase_v1', JSON.stringify(congPurchases));
    renderPurchase();
    closeModal();
}
function delPurchase(id) { congPurchases = congPurchases.filter(function (p) { return p.id !== id; }); localStorage.setItem('church_ministry_cong_purchase_v1', JSON.stringify(congPurchases)); renderPurchase(); }
function showUsageModal() {
    showModal('主日使用', '<div class="form-group"><label>主日日期</label><input type="date" id="ud" class="form-input"></div><div class="form-group"><label>歌名</label><input id="us" class="form-input"></div><div class="form-group"><label>聚會</label><input id="uv" class="form-input" value="主日崇拜"></div><div class="form-group"><label>備註</label><input id="un" class="form-input"></div><button class="btn" onclick="saveUsage()">儲存</button>');
}
function saveUsage() {
    congUsage.push({ id: Date.now(), date: document.getElementById('ud').value, song: document.getElementById('us').value, service: document.getElementById('uv').value, note: document.getElementById('un').value });
    localStorage.setItem('church_ministry_cong_usage_v1', JSON.stringify(congUsage));
    renderUsage();
    closeModal();
}
function delUsage(id) { congUsage = congUsage.filter(function (u) { return u.id !== id; }); localStorage.setItem('church_ministry_cong_usage_v1', JSON.stringify(congUsage)); renderUsage(); }
function loadDemo() {
    songs = [{id:1,name:'奇異恩典',category:'傳統',key:'G',count:50},{id:2,name:'讚美之泉',category:'現代',key:'D',count:35},{id:3,name:'如鹿渴慕',category:'敬拜',key:'A',count:40},{id:4,name:'主愛長存',category:'敬拜',key:'C',count:28},{id:5,name:'恩典之路',category:'現代',key:'G',count:22}];
    localStorage.setItem('songsData', JSON.stringify(songs));
    render();
}
function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const filtered = songs.filter(s => s.name.toLowerCase().includes(search));
    document.querySelector('#table tbody').innerHTML = filtered.map(s => `<tr><td>${s.name}</td><td>${s.category}</td><td>${s.key}</td><td>${s.count}次</td><td><button class="btn" style="padding:6px 12px;" onclick="del(${s.id})">删除</button></td></tr>`).join('');
}
function showModal(title, content) {
    document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;margin-bottom:20px;">${title}</div>${content}`;
    document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function showAddModal() {
    showModal('➕ 新增诗歌', `<div class="form-group"><label>歌名</label><input id="name" class="form-input"></div><div class="form-group"><label>分类</label><select id="cat" class="form-input"><option>传统</option><option>现代</option><option>敬拜</option></select></div><div class="form-group"><label>调号</label><input id="key" class="form-input" value="G"></div><button class="btn" onclick="add()">确定</button>`);
}
function add() {
    songs.push({id:Date.now(),name:document.getElementById('name').value,category:document.getElementById('cat').value,key:document.getElementById('key').value,count:0});
    localStorage.setItem('songsData', JSON.stringify(songs));
    render();
    closeModal();
    alert('✅ 已添加！');
}
function del(id) {
    if (confirm('删除？')) {
        songs = songs.filter(s => s.id !== id);
        localStorage.setItem('songsData', JSON.stringify(songs));
        render();
    }
}
</script>
</body>
</html>
