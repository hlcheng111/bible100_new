<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>设备管理系统 · Equipment Management | Church Ministry</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); color: white; padding: 15px 20px; }
.tabs { display: flex; gap: 5px; margin-top: 10px; }
.tab { padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 11px; }
.tab.active { background: white; color: #e67e22; font-weight: 600; }
.container { max-width: 1800px; margin: 0 auto; padding: 15px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 15px; }
.stat-card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #e67e22; }
.stat-num { font-size: 28px; font-weight: bold; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #e67e22; color: white; margin: 5px; }
.btn-sm { padding: 6px 12px; font-size: 11px; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 700px; width: 90%; position: relative; }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
.form-input, .form-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
<div class="header">
    <h1>🏢 设备管理系统</h1>
    <div class="tabs">
        <button class="tab active" onclick="switchTab('overview')">📊 总览</button>
        <button class="tab" onclick="switchTab('inventory')">📦 设备清单</button>
        <button class="tab" onclick="switchTab('maintenance')">🔧 维护</button>
        <button class="tab" onclick="switchTab('借用')">📋 借用记录</button>
            </div>
        </div>
<div class="container">
    <div id="tab-overview" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="s1">0</div><div style="font-size:10px;color:#7f8c8d;margin-top:5px;">设备总数</div></div>
            <div class="stat-card"><div class="stat-num" id="s2">0</div><div style="font-size:10px;color:#7f8c8d;margin-top:5px;">正常</div></div>
            <div class="stat-card"><div class="stat-num" id="s3">0</div><div style="font-size:10px;color:#7f8c8d;margin-top:5px;">待维修</div></div>
            <div class="stat-card"><div class="stat-num" id="s4">0</div><div style="font-size:10px;color:#7f8c8d;margin-top:5px;">已借出</div></div>
            <div class="stat-card"><div class="stat-num" id="s5">$0</div><div style="font-size:10px;color:#7f8c8d;margin-top:5px;">总价值</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
            <div class="card"><h3 style="margin-bottom:15px;">📊 设备状态</h3><canvas id="statusChart"></canvas></div>
            <div class="card"><h3 style="margin-bottom:15px;">📈 维护历史</h3><canvas id="maintenanceChart"></canvas></div>
        </div>
    </div>
    <div id="tab-inventory" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:15px;">📦 设备清单</h3>
            <button class="btn" onclick="showAddEquipModal()">➕ 新增设备</button>
            <button class="btn" style="background:#27ae60;" onclick="exportEquip()">📤 导出</button>
            <table id="equipTable"><thead><tr><th>设备名称</th><th>类别</th><th>购买日期</th><th>价值</th><th>状态</th><th>位置</th><th>操作</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
    <div id="tab-maintenance" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:15px;">🔧 维护记录</h3>
            <button class="btn" onclick="showAddMaintenanceModal()">➕ 新增记录</button>
            <table id="maintenanceTable"><thead><tr><th>日期</th><th>设备</th><th>问题</th><th>处理</th><th>费用</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
    <div id="tab-借用" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:15px;">📋 借用记录</h3>
            <button class="btn" onclick="showBorrowModal()">➕ 登记借用</button>
            <table id="borrowTable"><thead><tr><th>设备</th><th>借用人</th><th>借用日期</th><th>预计归还</th><th>状态</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
    <script>
let data = { equipment: [], maintenance: [], borrow: [] };
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('equipmentMgmtData');
    if (saved) data = JSON.parse(saved);
    if (data.equipment.length === 0) {
        data.equipment = [
            {id:1,name:'投影機',category:'音视频',purchaseDate:'2023-05-10',value:15000,status:'正常',location:'主堂'},
            {id:2,name:'調音台',category:'音视频',purchaseDate:'2022-03-15',value:35000,status:'正常',location:'主堂'},
            {id:3,name:'筆記型電腦',category:'电脑',purchaseDate:'2024-01-20',value:28000,status:'正常',location:'辦公室'},
            {id:4,name:'無線麥克風',category:'音视频',purchaseDate:'2023-08-01',value:8500,status:'待维修',location:'主堂'}
        ];
        data.maintenance = [
            {id:1,date:'2025-09-15',equipment:'投影機',issue:'燈泡更換',solution:'已更換',cost:800},
            {id:2,date:'2025-10-01',equipment:'無線麥克風',issue:'接收不穩',solution:'待檢修',cost:0}
        ];
        localStorage.setItem('equipmentMgmtData', JSON.stringify(data));
    }
    renderAll();
});
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}
function renderAll() {
    document.getElementById('s1').textContent = data.equipment.length;
    document.getElementById('s2').textContent = data.equipment.filter(e=>e.status==='正常').length;
    document.getElementById('s3').textContent = data.equipment.filter(e=>e.status==='待维修').length;
    document.getElementById('s4').textContent = data.equipment.filter(e=>e.status==='已借出').length;
    document.getElementById('s5').textContent = '$' + data.equipment.reduce((sum,e)=>sum+e.value,0).toLocaleString();
    document.querySelector('#equipTable tbody').innerHTML = data.equipment.map(e => `<tr><td>${e.name}</td><td>${e.category}</td><td>${e.purchaseDate}</td><td>$${e.value.toLocaleString()}</td><td>${e.status}</td><td>${e.location}</td><td><button class="btn btn-sm" onclick="delEquip(${e.id})">删除</button></td></tr>`).join('');
    document.querySelector('#maintenanceTable tbody').innerHTML = data.maintenance.map(m => `<tr><td>${m.date}</td><td>${m.equipment}</td><td>${m.issue}</td><td>${m.solution}</td><td>$${m.cost}</td></tr>`).join('');
}
function showModal(title, content) {
    document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;margin-bottom:20px;">${title}</div>${content}`;
    document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function showAddEquipModal() {
    showModal('➕ 新增设备', `<div class="form-group"><label>设备名称</label><input id="ename" class="form-input"></div><div class="form-group"><label>类别</label><select id="ecat" class="form-select"><option>音视频</option><option>电脑</option><option>家具</option><option>其他</option></select></div><div class="form-group"><label>购买日期</label><input type="date" id="epurchase" class="form-input"></div><div class="form-group"><label>价值</label><input type="number" id="evalue" class="form-input"></div><div class="form-group"><label>位置</label><input id="eloc" class="form-input"></div><button class="btn" onclick="addEquip()">确定</button>`);
}
function addEquip() {
    data.equipment.push({id:Date.now(),name:document.getElementById('ename').value,category:document.getElementById('ecat').value,purchaseDate:document.getElementById('epurchase').value,value:parseInt(document.getElementById('evalue').value),status:'正常',location:document.getElementById('eloc').value});
    localStorage.setItem('equipmentMgmtData', JSON.stringify(data));
    renderAll();
    closeModal();
    alert('✅ 已添加！');
}
function delEquip(id) {
    if (confirm('删除？')) {
        data.equipment = data.equipment.filter(e => e.id !== id);
        localStorage.setItem('equipmentMgmtData', JSON.stringify(data));
        renderAll();
    }
}
function showAddMaintenanceModal() { alert('功能：新增维护记录'); }
function showBorrowModal() { alert('功能：登记借用'); }
function exportEquip() {
    const csv = '设备名称,类别,购买日期,价值,状态,位置\n' + data.equipment.map(e=>`${e.name},${e.category},${e.purchaseDate},${e.value},${e.status},${e.location}`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download = '设备清单.csv';
    a.click();
    alert('✅ 已导出！');
        }
    </script>
</body>
</html>
