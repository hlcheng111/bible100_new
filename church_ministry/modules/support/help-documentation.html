<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>帮助文档 · Help Documentation | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
.doc-item { padding: 15px; background: #f8f9fa; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
.doc-item:hover { background: #e9ecef; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
<div id="w5dReportBar" style="padding:8px 16px;background:#ecfdf5;border-bottom:1px solid #a7f3d0;font-size:12px;"><strong>F-26 報告</strong>
    <button type="button" style="padding:6px 12px;background:#059669;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-left:8px;" onclick="exportHelpDocsCsv()" data-w5-report="help-docs-csv">⬇ 文檔索引 CSV</button>
    <button type="button" style="padding:6px 12px;background:#4b5563;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-left:4px;" onclick="printHelpDocs()" data-w5-report="help-docs-print">🖨 列印</button>
</div>
<div class="header"><h1>📖 帮助文档中心</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">📚 使用指南</h3>
        <div class="doc-item" onclick="openDoc(1)">📘 快速入门指南</div>
        <div class="doc-item" onclick="openDoc(2)">📙 功能详细说明</div>
        <div class="doc-item" onclick="openDoc(3)">📗 常见问题FAQ</div>
        <div class="doc-item" onclick="openDoc(4)">📕 视频教程</div>
    </div>
</div>
    <script>
var HELP_DOCS = [
    [1, '快速入门指南', 'v1.0', '教會事工中心'],
    [2, '功能详细说明', 'v1.0', '教會事工中心'],
    [3, '常见问题FAQ', 'v1.0', '教會事工中心'],
    [4, '视频教程', 'v1.0', '教會事工中心']
];
function openDoc(id) { alert('打开文档 #' + id); }
function exportHelpDocsCsv() {
    var esc = window.CmReportUtils ? CmReportUtils.csvEsc : function (v) { return v; };
    var lines = [[ 'ID', '標題', '版本', '負責人' ].map(esc).join(',')];
    HELP_DOCS.forEach(function (d) { lines.push(d.map(esc).join(',')); });
    if (window.CmReportUtils) CmReportUtils.downloadCsv('help_documentation_index.csv', lines);
}
function printHelpDocs() {
    if (window.CmReportUtils) CmReportUtils.printTable('幫助文檔索引', ['ID', '標題', '版本', '負責人'], HELP_DOCS);
}
    </script>
<!-- b100-w5-report-utils -->
<script src="../../js/cm_report_utils.js"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
