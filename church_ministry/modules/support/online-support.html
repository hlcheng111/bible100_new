<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在線支援 - Online Support · Online Support | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="container mx-auto px-4 py-6">
        <!-- 頁面標題 -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">在線支援</h1>
            <p class="text-gray-600">提供即時技術支援和問題解決服務</p>
        </div>

        <!-- 支援狀態概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-green-500 p-3 rounded-lg">
                        <i class="fas fa-headset text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">在線客服</p>
                        <p class="text-2xl font-bold text-gray-900">5</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-blue-500 p-3 rounded-lg">
                        <i class="fas fa-clock text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">平均回應時間</p>
                        <p class="text-2xl font-bold text-gray-900">2.5分</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-purple-500 p-3 rounded-lg">
                        <i class="fas fa-ticket-alt text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">今日工單</p>
                        <p class="text-2xl font-bold text-gray-900">23</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="bg-orange-500 p-3 rounded-lg">
                        <i class="fas fa-star text-white text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">滿意度</p>
                        <p class="text-2xl font-bold text-gray-900">4.8/5</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主要功能區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 即時聊天支援 -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">即時聊天支援</h2>
                <div class="bg-gray-50 rounded-lg p-4 mb-4 h-64 overflow-y-auto">
                    <div class="space-y-3">
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
                                <i class="fas fa-user text-white text-sm"></i>
                            </div>
                            <div class="bg-white rounded-lg p-3 shadow-sm max-w-xs">
                                <p class="text-sm text-gray-900">您好，我需要幫助設置小組管理功能</p>
                                <p class="text-xs text-gray-500 mt-1">10:30</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-3 justify-end">
                            <div class="bg-blue-500 rounded-lg p-3 shadow-sm max-w-xs">
                                <p class="text-sm text-white">您好！我很樂意幫助您設置小組管理功能。請告訴我您遇到的具體問題。</p>
                                <p class="text-xs text-blue-100 mt-1">10:31</p>
                            </div>
                            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
                                <i class="fas fa-headset text-white text-sm"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" placeholder="輸入您的問題..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-paper-plane mr-2"></i>發送
                    </button>
                </div>
            </div>

            <!-- 快速支援選項 -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">快速支援選項</h2>
                <div class="space-y-3">
                    <button class="w-full text-left p-3 rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 transition-colors">
                        <div class="flex items-center">
                            <i class="fas fa-question-circle text-blue-500 mr-3"></i>
                            <span class="text-gray-700">常見問題</span>
                        </div>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg border border-gray-200 hover:border-green-300 hover:bg-green-50 transition-colors">
                        <div class="flex items-center">
                            <i class="fas fa-book text-green-500 mr-3"></i>
                            <span class="text-gray-700">使用指南</span>
                        </div>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg border border-gray-200 hover:border-purple-300 hover:bg-purple-50 transition-colors">
                        <div class="flex items-center">
                            <i class="fas fa-video text-purple-500 mr-3"></i>
                            <span class="text-gray-700">教學影片</span>
                        </div>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg border border-gray-200 hover:border-orange-300 hover:bg-orange-50 transition-colors">
                        <div class="flex items-center">
                            <i class="fas fa-ticket-alt text-orange-500 mr-3"></i>
                            <span class="text-gray-700">提交工單</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- 支援工單管理 -->
        <div class="mt-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">支援工單管理</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">工單編號</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">問題類型</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">狀態</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">優先級</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">創建時間</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#001</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">系統登入問題</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs font-medium bg-yellow-100 text-yellow-800 rounded-full">處理中</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs font-medium bg-red-100 text-red-800 rounded-full">高</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-01-15 09:30</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button class="text-blue-600 hover:text-blue-900 mr-2">查看</button>
                                <button class="text-green-600 hover:text-green-900">更新</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#002</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">功能使用諮詢</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">已解決</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded-full">中</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2024-01-14 14:20</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button class="text-blue-600 hover:text-blue-900">查看</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 快速操作按鈕 -->
        <div class="mt-8 flex flex-wrap gap-4">
            <button onclick="alert('開始新的聊天支援')" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-comments mr-2"></i>開始聊天
            </button>
            <button onclick="alert('創建新的支援工單')" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>創建工單
            </button>
            <button onclick="alert('查看支援歷史記錄')" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-colors">
                <i class="fas fa-history mr-2"></i>支援歷史
            </button>
            <button onclick="alert('下載支援文檔')" class="bg-orange-600 text-white px-6 py-3 rounded-lg hover:bg-orange-700 transition-colors">
                <i class="fas fa-download mr-2"></i>下載文檔
            </button>
        </div>
    </div>

    <script>
        // 這裡可以添加聊天功能和工單管理的JavaScript邏輯
        console.log('在線支援模組已載入');
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
