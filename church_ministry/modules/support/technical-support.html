<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>技术支援 · Technical Support | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #3498db; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; position: relative; }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
.form-input, .form-textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
.form-textarea { min-height: 80px; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>
<div id="w5dReportBar" style="padding:8px 16px;background:#ecfdf5;border-bottom:1px solid #a7f3d0;font-size:12px;"><strong>F-25 報告</strong>
    <button type="button" class="btn" style="background:#059669;margin-left:8px;" onclick="exportTicketsCsv()" data-w5-report="support-tickets-csv">⬇ 工單 CSV</button>
    <button type="button" class="btn" style="background:#4b5563;margin-left:4px;" onclick="printTickets()" data-w5-report="support-print">🖨 列印</button>
</div>
<div class="header"><h1>🔧 技术支援中心</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🎫 支援工单</h3>
        <button class="btn" onclick="showAddModal()">➕ 新增工单</button>
        <table id="table"><thead><tr><th>问题描述</th><th>提交人</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
<script>
let tickets = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('supportData');
    if (saved) tickets = JSON.parse(saved);
    if (tickets.length === 0) { tickets = [{id:1,issue:'无法登录系统',submitter:'王弟兄',date:'2025-10-10',status:'处理中'}]; localStorage.setItem('supportData', JSON.stringify(tickets)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = tickets.map(t => `<tr><td>${t.issue}</td><td>${t.submitter}</td><td>${t.date}</td><td>${t.status}</td><td><button class="btn" style="padding:6px 12px;" onclick="del(${t.id})">删除</button></td></tr>`).join('');
}
function showModal(title, content) {
    document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;margin-bottom:20px;">${title}</div>${content}`;
    document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function showAddModal() {
    showModal('➕ 新增工单', `<div class="form-group"><label>问题描述</label><textarea id="issue" class="form-textarea"></textarea></div><div class="form-group"><label>提交人</label><input id="submitter" class="form-input"></div><button class="btn" onclick="add()">确定</button>`);
}
function add() {
    tickets.push({id:Date.now(),issue:document.getElementById('issue').value,submitter:document.getElementById('submitter').value,date:new Date().toISOString().split('T')[0],status:'待处理'});
    localStorage.setItem('supportData', JSON.stringify(tickets));
    render();
    closeModal();
    alert('✅ 已添加！');
}
function del(id) {
    if (confirm('删除？')) {
        tickets = tickets.filter(t => t.id !== id);
        localStorage.setItem('supportData', JSON.stringify(tickets));
        render();
    }
}
function csvLine(fields) {
    var esc = window.CmReportUtils ? CmReportUtils.csvEsc : function (v) { return v; };
    return (fields || []).map(esc).join(',');
}
function exportTicketsCsv() {
    var lines = [csvLine(['问题描述', '提交人', '日期', '状态'])];
    tickets.forEach(function (t) { lines.push(csvLine([t.issue, t.submitter, t.date, t.status])); });
    if (window.CmReportUtils) CmReportUtils.downloadCsv('support_tickets.csv', lines);
}
function printTickets() {
    var headers = ['问题描述', '提交人', '日期', '状态'];
    var rows = tickets.map(function (t) { return [t.issue, t.submitter, t.date, t.status]; });
    if (window.CmReportUtils) CmReportUtils.printTable('技术支援工单', headers, rows);
}
</script>
<!-- b100-w5-report-utils -->
<script src="../../js/cm_report_utils.js"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
