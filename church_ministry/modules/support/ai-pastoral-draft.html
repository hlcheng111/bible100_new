<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AI 牧養草稿 · 人工確認</title>
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <style>
    body { margin: 0; font-size: 13px; font-family: "Microsoft YaHei", sans-serif; background: #f8fafc; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    textarea { min-height: 120px; font-family: inherit; }
    button { margin-right: 8px; margin-top: 8px; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-success { background: #059669; color: #fff; }
    .warn { font-size: 11px; color: #b45309; background: #fffbeb; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="../../dashboard.html">⛪ 儀表板</a>
    <span class="cm-back-bar__muted">AI 牧養草稿</span>
  </nav>
  <div class="wrap">
    <h1>AI 牧養草稿工作流</h1>
    <p class="warn" id="disclaimer"></p>
    <div class="card">
      <label>會友 ID</label>
      <input id="memberId" placeholder="例：1">
      <label>會友姓名（Prompt 用）</label>
      <input id="memberName" placeholder="例：王弟兄">
      <label>屬靈階段</label>
      <select id="stage">
        <option value="seeker">慕道</option>
        <option value="new_believer">初信</option>
        <option value="growing" selected>成長</option>
        <option value="serving">服事</option>
        <option value="leader">領袖</option>
      </select>
      <label>背景／關懷重點</label>
      <textarea id="context" placeholder="例：兩週未出席主日，配偶生病"></textarea>
      <button type="button" class="btn-primary" id="btnPrompt">① 產生 Prompt（複製到 ChatGPT／Kimi）</button>
    </div>
    <div class="card">
      <label>② 貼上 AI 回覆草稿</label>
      <textarea id="draft" placeholder="將外部 LLM 回覆貼於此…"></textarea>
      <button type="button" class="btn-success" id="btnConfirm">③ 人工確認並寫入牧養事件</button>
      <p id="msg" style="font-size:12px;margin-top:8px;"></p>
    </div>
  </div>
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_auth.js"></script>
  <script src="../../../js/church_crm_constants.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/church_ai_pastoral_draft.js"></script>
  <script>
    document.getElementById('disclaimer').textContent = ChurchAiPastoralDraft.DISCLAIMER;
    document.getElementById('btnPrompt').onclick = function () {
      var p = ChurchAiPastoralDraft.buildPrompt({
        memberName: document.getElementById('memberName').value,
        spiritualStage: document.getElementById('stage').value,
        context: document.getElementById('context').value,
        draftKind: 'followup'
      });
      navigator.clipboard && navigator.clipboard.writeText(p);
      document.getElementById('draft').value = p + '\n\n---\n（請將 AI 回覆貼在下方後再確認寫入）\n';
      document.getElementById('msg').textContent = 'Prompt 已複製到剪貼簿（若瀏覽器允許）。';
    };
    document.getElementById('btnConfirm').onclick = function () {
      var mid = document.getElementById('memberId').value.trim();
      var text = document.getElementById('draft').value.trim();
      if (!mid || !text) {
        document.getElementById('msg').textContent = '請填會友 ID 與草稿內容';
        return;
      }
      try {
        var rec = ChurchAiPastoralDraft.confirmDraftToPastoralEvent(text, mid);
        document.getElementById('msg').textContent = '已寫入 pastoral_events：' + (rec.event_id || 'ok');
      } catch (e) {
        document.getElementById('msg').textContent = e.message || String(e);
      }
    };
    var q = new URLSearchParams(location.search);
    if (q.get('memberId')) document.getElementById('memberId').value = q.get('memberId');
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
