<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探訪匯報（手機示範） · Visitation Mobile Demo | Church Ministry</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; margin: 0; padding: 16px; background: #f0f4ff; font-size: 15px; color: #1e293b; }
    h1 { font-size: 18px; margin: 0 0 8px; color: #4338ca; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: 13px; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
    textarea { min-height: 100px; resize: vertical; }
    .btn { width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; cursor: pointer; }
    .hint { font-size: 12px; color: #64748b; line-height: 1.5; margin: 8px 0; }
    .note { margin-top: 16px; padding: 12px; background: #fef3c7; border-radius: 8px; font-size: 12px; color: #92400e; }
    a.back { display: inline-block; margin-bottom: 16px; color: #4f46e5; font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="visitation.html">← 返回探訪管理（電腦）</a>
  <h1>📱 探訪匯報（示範頁）</h1>
  <p class="sub">實際環境可改為貴教會網域與後端 API。此頁僅示範同工在手機上的填報流程。</p>
  <p class="hint">這一區是給探訪同工在手機上快速填寫的簡易表單，幫你記錄已完成的探訪。</p>
  <p class="hint">只要填對象、探訪結果摘要，再按「提交匯報」即可。</p>
  <p class="hint">目前資料只會存在你這台手機／電腦的瀏覽器裡，換裝置或清除瀏覽資料就看不到。未來會接上教會資料庫，牧者與同工登入後可以一起看到同一份清單。</p>

  <div style="margin-top:12px; padding:12px; border-radius:10px; border:1px solid #e2e8f0; background:#f8fafc;">
  <label for="task">對應任務／對象</label>
  <input type="text" id="task" placeholder="例：王姊妹｜定期關懷">

  <label for="result">探訪結果摘要</label>
  <textarea id="result" placeholder="身體狀況、代禱事項、後續安排…"></textarea>

  <label for="pray">代禱事項（選填）</label>
  <input type="text" id="pray" placeholder="簡短一句即可">

  <button type="button" class="btn" onclick="demoSubmit()">提交匯報（示範）</button>
  </div>

  <p class="note">示範：按下後僅會出現提示，不會寫入伺服器。在完整系統中，提交後應同步更新 <code>visitationData</code> 任務狀態為「已完成」。</p>

  <script>
    function demoSubmit() {
      alert('（示範）已收到匯報。請回到電腦版「探訪關懷」→ 出動列表，使用「匯報」按鈕將任務標為完成。');
    }
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
