<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>操作紀錄（審計）· 行政 | Church Ministry</title>
  <style>
    body { margin:0; font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; background:#f8fafc; color:#0f172a; font-size:14px; }
    main { max-width:980px; margin:0 auto; padding:12px; }
    .au-box { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin:10px 0; }
    .au-guide { background:#eff6ff; border:2px solid #93c5fd; }
    .au-guide h2 { margin:0 0 6px; font-size:15px; color:#1e3a8a; }
    .au-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
    select, input[type=search] { min-height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:4px 8px; font-size:14px; }
    .au-btn { min-height:38px; padding:6px 12px; border:1px solid #94a3b8; background:#fff; border-radius:8px; cursor:pointer; font-size:14px; }
    .au-muted { color:#64748b; font-size:13px; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #e2e8f0; font-size:13px; vertical-align:top; }
    th { background:#f1f5f9; }
    .au-msg { padding:8px 10px; border-radius:8px; background:#fffbeb; color:#92400e; margin:8px 0; }
    .au-wrap { overflow-x:auto; }
  </style>
</head>
<body>
  <main>
    <p style="margin:0 0 8px"><a href="admin-integrated.html">← 回「行政」</a></p>
    <h1 style="font-size:18px;margin:0 0 4px">操作紀錄（審計）</h1>
    <p class="au-muted" style="margin:0 0 8px">看「誰、什麼時候、做了什麼」。只能查看，不能改、不能刪。</p>
    <div id="au-msg" class="au-msg" role="status" hidden></div>

    <div id="au-main">
      <section class="au-box au-guide">
        <h2>這一頁看什麼？</h2>
        <p style="margin:4px 0">例如「名冊被儲存了幾次」「誰修改了會友欄位」「有沒有人還原過備份」。需要對同工交代、或懷疑資料被改動時，就來這裡查。</p>
        <p class="au-muted" style="margin:4px 0">只列出筆數、欄位名這類<strong>不含個人內容</strong>的資訊；奉獻金額、姓名、電話不會顯示，也不會匯出。紀錄存在這臺電腦，最多保留最新 1000 筆。</p>
      </section>

      <div id="au-empty" class="au-box" hidden>目前還沒有任何紀錄。之後儲存名冊、排班、備份時，這裡就會出現。</div>

      <section class="au-box">
        <div class="au-row">
          <label>分類 <select id="au-kind"><option value="all">全部</option></select></label>
          <label>時間
            <select id="au-days">
              <option value="0">全部</option>
              <option value="7">最近 7 天</option>
              <option value="30">最近 30 天</option>
              <option value="90">最近 90 天</option>
            </select>
          </label>
          <input type="search" id="au-text" placeholder="搜尋（例：會友、排班）" aria-label="搜尋紀錄" />
          <button type="button" class="au-btn" id="au-csv">匯出 CSV（Excel 可開）</button>
          <button type="button" class="au-btn" id="au-json">匯出 JSON</button>
        </div>
        <p class="au-muted" id="au-count" style="margin:4px 0"></p>
        <div class="au-wrap">
          <table>
            <thead><tr><th>時間</th><th>誰</th><th>分類</th><th>做了什麼</th><th>細節</th></tr></thead>
            <tbody id="au-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_auth.js"></script>
  <script src="../../../js/church_crm_constants.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../js/cm_audit_view.js?v=20261124p6"></script>
  <script src="../../js/cm_audit_panel.js?v=20261124p6"></script>
</body>
</html>
