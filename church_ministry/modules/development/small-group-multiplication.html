<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>小组倍增 - 树状图 · Small Group Multiplication | Church Ministry</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); padding: 20px; font-size: 11px; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; }
.header { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.header h1 { font-size: 26px; background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.tree-container { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow-x: auto; }
.tree { display: flex; flex-direction: column; align-items: center; }
.tree-level { display: flex; gap: 20px; margin: 20px 0; }
.group-node { background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); color: white; padding: 15px 20px; border-radius: 10px; text-align: center; min-width: 150px; box-shadow: 0 4px 12px rgba(86,171,47,0.3); position: relative; }
.group-node.child { background: linear-gradient(135deg, #a8e063 0%, #b8e994 100%); }
.group-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.group-info { font-size: 10px; opacity: 0.9; }
.connector { width: 2px; height: 30px; background: #56ab2f; margin: 0 auto; }
.load-btn { display: block; margin: 20px auto; padding: 15px 30px; background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="container">
<div class="header"><h1>🌳 小组倍增计划 - 树状层级图</h1><p style="color:#7f8c8d;margin-top:10px;">📈 母组/子组关系 · 倍增追踪 · 成长路径</p></div>
<button class="load-btn" onclick="loadDemo()" id="loadBtn">🎯 载入倍增案例（1个母组→3个子组）</button>
<div class="tree-container"><h2 style="font-size:20px;font-weight:600;margin-bottom:20px;text-align:center;">🌳 小组倍增树状图</h2><div class="tree" id="tree"></div></div>
</div>
<script>
function loadDemo() {
const html = `
<div class="tree-level">
<div class="group-node">
<div class="group-name">青年小组A（母组）</div>
<div class="group-info">张弟兄 · 15人 · 2024-01-01成立</div>
</div>
</div>
<div class="connector"></div>
<div class="tree-level">
<div class="group-node child">
<div class="group-name">青年小组A1</div>
<div class="group-info">李姊妹 · 8人 · 2024-06-01分裂</div>
</div>
<div class="group-node child">
<div class="group-name">青年小组A2</div>
<div class="group-info">王弟兄 · 7人 · 2024-06-01分裂</div>
</div>
<div class="group-node child">
<div class="group-name">青年小组A3</div>
<div class="group-info">陈姊妹 · 6人 · 2024-09-01分裂</div>
</div>
</div>
`;
document.getElementById('tree').innerHTML = html;
document.getElementById('loadBtn').style.display = 'none';
}
</script>

</body></html>
