<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>④ 教師·課程·目標</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../../css/education_workspace.css">
    <script src="../../../js/cloud_config.js"></script>
    <script src="../../../js/church_data_bridge.js"></script>
</head>
<body class="edu-wrap edu-panel-embed" data-edu-panel="teaching">
    <main class="edu-main" style="padding-top:8px">
        <div class="edu-card">
            <h3>👨‍🏫 教師管理</h3>
            <button type="button" class="edu-btn" id="edu-btn-add-teacher">➕ 新增教師</button>
            <table class="edu-table" style="margin-top:10px">
                <thead><tr><th>姓名</th><th>班級</th><th>負荷</th><th>認證</th><th>操作</th></tr></thead>
                <tbody id="edu-teachers-tbody"></tbody>
            </table>
        </div>
        <div class="edu-card">
            <h3>📖 課程規劃</h3>
            <button type="button" class="edu-btn" id="edu-btn-add-curriculum">➕ 新增課程</button>
            <button type="button" class="edu-btn secondary" id="edu-btn-template">📋 套用教材模板</button>
            <table class="edu-table" style="margin-top:10px">
                <thead><tr><th>日期</th><th>班級</th><th>主題</th><th>經文</th><th>AI</th></tr></thead>
                <tbody id="edu-curriculum-tbody"></tbody>
            </table>
            <div id="edu-lesson-draft" style="margin-top:12px"></div>
        </div>
        <div class="edu-card">
            <h3>🎯 目標·進度·成果</h3>
            <div id="edu-goals-list"></div>
        </div>
        <div class="edu-card">
            <h3>📋 教育部報告草稿</h3>
            <div id="edu-report-draft"></div>
        </div>
    </main>
    <div id="edu-modal" class="edu-modal"><div class="edu-modal-box" id="edu-modal-content"></div></div>
    <script src="../../js/pastoral_data_hub.js?v=20260610_c_fusion"></script>
    <script src="../../js/pastoral_cross_module_bridge.js?v=20260610_c_fusion"></script>
    <script src="../../js/education_data_hub.js?v=20260610_c_fusion"></script>
    <script src="../../js/education_cross_module_bridge.js?v=20260610_c_fusion"></script>
    <script src="../../js/education_ai_helper.js?v=20260610_c_fusion"></script>
    <script src="../../js/education_integrated_ui.js?v=20260610_c_fusion"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
