    <h1>📚 主日學工作桌</h1>
    <p class="edu-tagline">C 區 · 5 Tab — 左欄切模組，此處切任務（導覽／學籍／出席／門訓／備課）</p>
    <div class="edu-toolbar">
      <button type="button" class="edu-btn outline" id="edu-btn-seed">載入示範資料</button>
      <button type="button" class="edu-btn outline" id="edu-btn-export">匯出 JSON</button>
      <button type="button" class="edu-btn outline" id="edu-btn-import">匯入</button>
      <button type="button" class="edu-btn outline" id="edu-btn-roster-csv" data-w2-report="edu-roster-csv">⬇ 名冊 CSV</button>
      <button type="button" class="edu-btn outline" id="edu-btn-att-csv" data-w2-report="edu-attendance-csv">⬇ 出席 CSV</button>
      <button type="button" class="edu-btn outline" id="edu-btn-warn-csv" data-w2-report="edu-absent-csv">⬇ 缺席預警 CSV</button>
      <button type="button" class="edu-btn outline" id="edu-btn-roster-print" data-w2-report="edu-roster-print">🖨 列印名冊</button>
      <button type="button" class="edu-btn outline" id="edu-btn-ai-report">AI 報告草稿</button>
    </div>
  </header>

  <div class="edu-overview-strip" aria-label="教育總覽">
    <div class="edu-stat"><span class="n" id="edu-stat-classes">—</span><span class="l">班級</span></div>
    <div class="edu-stat"><span class="n" id="edu-stat-students">—</span><span class="l">學員</span></div>
    <div class="edu-stat"><span class="n" id="edu-stat-rate">—</span><span class="l">出席率</span></div>
    <div class="edu-stat"><span class="n" id="edu-stat-warn">—</span><span class="l">缺席預警</span></div>
  </div>
  <div id="edu-school-bridge" class="edu-toolbar" style="margin:0 12px 8px;padding:8px 12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;font-size:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <strong>C ↔ 學校</strong>
    <span id="edu-bridge-summary" class="muted">名冊對齊載入中…</span>
    <span class="muted" title="學籍 studentId 對齊會友 members[].externalId；勿在學校模組另開教會會友表">· externalId 橋接</span>
    <button type="button" class="edu-btn outline" id="edu-btn-school-dash">🏫 全校學籍</button>
    <button type="button" class="edu-btn outline" id="edu-btn-visitation-queue">💬 缺席→探訪</button>
  </div>
  <div id="edu-dd-bridge" class="edu-toolbar" style="margin:0 12px 8px;padding:8px 12px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;font-size:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <strong>C ↔ 門訓動力站（DD）</strong>
    <span class="muted">主日學名冊在此維護；DD 為課程素材庫（只讀深鏈，不寫 roster）</span>
    <button type="button" class="edu-btn outline" id="edu-btn-dd-library">📖 換模組 → DD 內容庫</button>
  </div>

  <nav class="edu-tabs edu-shell-tabs" aria-label="主日學 5 Tab">
    <button type="button" class="edu-tab edu-shell-tab" data-tab="guide">🧭 導覽</button>
    <button type="button" class="edu-tab edu-shell-tab active" data-tab="roster">① 學籍</button>
    <button type="button" class="edu-tab edu-shell-tab" data-tab="attendance">② 出席</button>
    <button type="button" class="edu-tab edu-shell-tab" data-tab="discipleship">③ 門訓</button>
    <button type="button" class="edu-tab edu-shell-tab" data-tab="teaching">④ 備課</button>
  </nav>

  <div class="edu-shell-frame-wrap">
    <!-- child tabs: guide_story.html · edu_roster.html · edu_attendance.html · edu_discipleship.html · edu_teaching.html -->

  </div>
