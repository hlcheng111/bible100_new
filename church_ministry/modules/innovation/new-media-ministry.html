<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=new-media.html">
<title>新媒體事工 - 已合併 · New Media Ministry | Church Ministry</title>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #e74c3c; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <p style="padding:20px;">此頁已合併至 <a href="new-media.html">新媒體事工</a>（使用 new_media 資料）。若未自動跳轉，請<a href="new-media.html">點此</a>。</p>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>📱 新媒体事工管理</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">📱 新媒体平台</h3>
        <button class="btn" onclick="add()">➕ 新增平台</button>
        <table id="table"><thead><tr><th>平台</th><th>粉丝数</th><th>月发文</th><th>互动率</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let platforms = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('newMediaData');
    if (saved) platforms = JSON.parse(saved);
    if (platforms.length === 0) { platforms = [{id:1,name:'微信公众号',followers:5000,posts:20,engagement:15}]; localStorage.setItem('newMediaData', JSON.stringify(platforms)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = platforms.map(p => `<tr><td>${p.name}</td><td>${p.followers}</td><td>${p.posts}篇</td><td>${p.engagement}%</td></tr>`).join('');
}
function add() { alert('功能：新增媒体平台'); }
</script>
</body>
</html>
