<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>科技应用 · Technology Integration | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #3498db; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>💻 科技应用管理</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">📱 科技工具</h3>
        <button class="btn" onclick="add()">➕ 新增工具</button>
        <table id="table"><thead><tr><th>工具名称</th><th>类别</th><th>使用率</th><th>评价</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let tools = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('techData');
    if (saved) tools = JSON.parse(saved);
    if (tools.length === 0) { tools = [{id:1,name:'在线奉献',category:'财务',usage:85,rating:4.5}]; localStorage.setItem('techData', JSON.stringify(tools)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = tools.map(t => `<tr><td>${t.name}</td><td>${t.category}</td><td>${t.usage}%</td><td>${t.rating}分</td></tr>`).join('');
}
function add() { alert('功能：新增科技工具'); }
</script>
</body>
</html>
