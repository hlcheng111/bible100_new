<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>科技应用 · Technology Integration | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #3498db; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>💻 科技应用管理</h1>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
<button type="button" onclick="exportTechnologyIntegrationCsv()" data-w5-report="technology-integration-csv" style="padding:6px 12px;border:1px solid #fff;background:rgba(255,255,255,0.2);color:#fff;border-radius:6px;cursor:pointer;">⬇ CSV</button>
<button type="button" onclick="printTechnologyIntegration()" data-w5-report="technology-integration-print" style="padding:6px 12px;border:1px solid #fff;background:rgba(255,255,255,0.2);color:#fff;border-radius:6px;cursor:pointer;">🖨 列印</button>
</div></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">📱 科技工具</h3>
        <button class="btn" onclick="add()">➕ 新增工具</button>
        <table id="table"><thead><tr><th>工具名称</th><th>类别</th><th>使用率</th><th>评价</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let tools = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('techData');
    if (saved) tools = JSON.parse(saved);
    if (tools.length === 0) { tools = [{id:1,name:'在线奉献',category:'财务',usage:85,rating:4.5}]; localStorage.setItem('techData', JSON.stringify(tools)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = tools.map(t => `<tr><td>${t.name}</td><td>${t.category}</td><td>${t.usage}%</td><td>${t.rating}分</td></tr>`).join('');
}
function add() { alert('功能：新增科技工具'); }
function exportTechnologyIntegrationCsv() {
    var U = window.CmReportUtils; if (!U) return;
    var esc = U.csvEsc;
    var list = tools || [];
    if (!list.length) { try { list = JSON.parse(localStorage.getItem('techData') || '[]'); } catch (e) { list = []; } }
    var lines = [['工具', '類別', '使用率', '評價'].map(esc).join(',')];
    list.forEach(function (t) { lines.push([t.name, t.category, t.usage, t.rating].map(esc).join(',')); });
    U.downloadCsv('technology_integration_' + new Date().toISOString().slice(0, 10) + '.csv', lines);
}
function printTechnologyIntegration() {
    var U = window.CmReportUtils; if (!U) return;
    var list = tools || [];
    if (!list.length) { try { list = JSON.parse(localStorage.getItem('techData') || '[]'); } catch (e) { list = []; } }
    var rows = list.map(function (t) { return [t.name, t.category, String(t.usage) + '%', String(t.rating)]; });
    U.printTable('科技應用', ['工具', '類別', '使用率', '評價'], rows);
}
</script>
<!-- b100-w5-report-utils -->
<script src="../../js/cm_report_utils.js"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
