<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>青年事工创新 · Youth Innovation | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #667eea; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>🎯 青年事工创新</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🚀 创新活动</h3>
        <button class="btn" onclick="add()">➕ 新增活动</button>
        <table id="table"><thead><tr><th>活动名称</th><th>形式</th><th>预计参与</th><th>创新点</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let activities = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('youthInnovData');
    if (saved) activities = JSON.parse(saved);
    if (activities.length === 0) { activities = [{id:1,name:'电竞团契',format:'线上+线下',participants:30,innovation:'游戏化福音'}]; localStorage.setItem('youthInnovData', JSON.stringify(activities)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = activities.map(a => `<tr><td>${a.name}</td><td>${a.format}</td><td>${a.participants}人</td><td>${a.innovation}</td></tr>`).join('');
}
function add() { alert('功能：新增创新活动'); }
</script>
</body>
</html>
