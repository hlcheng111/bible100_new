<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>数字化转型 - 流程图 · Digital Transformation | Church Ministry</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); padding: 20px; font-size: 11px; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; }
.header { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.header h1 { font-size: 26px; background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.flow-container { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.flow-steps { display: flex; align-items: center; justify-content: space-between; margin: 30px 0; }
.step { flex: 1; text-align: center; position: relative; }
.step-circle { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 10px; box-shadow: 0 4px 12px rgba(33,147,176,0.3); }
.step-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.step-desc { font-size: 10px; color: #7f8c8d; }
.arrow { flex: 0 0 40px; text-align: center; font-size: 24px; color: #2193b0; }
.load-btn { display: block; margin: 20px auto; padding: 15px 30px; background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="container">
<div class="header"><h1>🔄 数字化转型 - 流程图展示</h1><p style="color:#7f8c8d;margin-top:10px;">📈 转型路径可视化 · 阶段管理 · 进度追踪</p></div>
<button class="load-btn" onclick="loadDemo()" id="loadBtn" style="display:none;">🎯 载入转型计划（5个阶段）</button>
<div class="flow-container"><h2 style="font-size:20px;font-weight:600;margin-bottom:20px;text-align:center;">🔄 数字化转型流程</h2><div class="flow-steps" id="flowSteps"></div></div>
</div>
<script>
let phases = [];
document.addEventListener('DOMContentLoaded', function() {
    if (phases.length === 0) loadDemo();
});
function loadDemo() {
phases = [
{icon:'📋', title:'需求评估', desc:'分析现状、确定目标', progress:100},
{icon:'📝', title:'方案设计', desc:'制定转型计划', progress:80},
{icon:'🔧', title:'系统开发', desc:'技术实施', progress:50},
{icon:'✅', title:'测试上线', desc:'试运行验证', progress:20},
{icon:'🚀', title:'全面推广', desc:'培训普及', progress:0}
];
render();
document.getElementById('loadBtn').style.display = 'none';
}
function render() {
document.getElementById('flowSteps').innerHTML = phases.map((p, i) => `
${i > 0 ? '<div class="arrow">→</div>' : ''}
<div class="step">
<div class="step-circle" style="opacity:${p.progress > 0 ? 1 : 0.3}">${p.icon}</div>
<div class="step-title">${p.title}</div>
<div class="step-desc">${p.desc}</div>
<div style="margin-top:8px;font-size:12px;font-weight:600;color:${p.progress===100?'#27ae60':'#2193b0'}">${p.progress}%</div>
</div>
`).join('');
}
</script>
</body></html>
