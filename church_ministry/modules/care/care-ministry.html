<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關懷輔導管理 · Care Ministry | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">關懷輔導管理</h1>
        
        <!-- 統計概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">關懷對象</h3>
                <p class="text-3xl font-bold text-blue-600" id="totalCareTargets">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">輔導預約</h3>
                <p class="text-3xl font-bold text-green-600" id="totalAppointments">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">進行中</h3>
                <p class="text-3xl font-bold text-purple-600" id="ongoingCases">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">已完成</h3>
                <p class="text-3xl font-bold text-orange-600" id="completedCases">0</p>
            </div>
        </div>

        <!-- 主要功能區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 關懷對象管理 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-semibold">關懷對象管理</h3>
                            <button onclick="showAddCareTargetModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                                新增對象
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="careTargetsList" class="space-y-4">
                            <!-- 關懷對象列表將在這裡動態生成 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 側邊欄 -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h4 class="text-lg font-semibold mb-4">快速操作</h4>
                    <button onclick="showAddAppointmentModal()" class="w-full bg-green-600 text-white py-3 px-4 rounded hover:bg-green-700 mb-3">
                        新增預約
                    </button>
                    <button onclick="showCarePlanModal()" class="w-full bg-purple-600 text-white py-3 px-4 rounded hover:bg-purple-700 mb-3">
                        關懷計劃
                    </button>
                    <button onclick="exportCareData()" class="w-full bg-gray-600 text-white py-3 px-4 rounded hover:bg-gray-700">
                        匯出數據
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h4 class="text-lg font-semibold mb-4">最近關懷記錄</h4>
                    <div id="recentCareRecords">
                        <!-- 最近關懷記錄將在這裡動態生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 關懷對象模態框 -->
    <div id="careTargetModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4" id="careTargetModalTitle">新增關懷對象</h3>
                <form id="careTargetForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">姓名</label>
                        <input type="text" id="careTargetName" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">電話</label>
                        <input type="tel" id="careTargetPhone" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">地址</label>
                        <input type="text" id="careTargetAddress" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">關懷類型</label>
                        <select id="careTargetType" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="sick">病患關懷</option>
                            <option value="elderly">長者關懷</option>
                            <option value="newbeliever">新信徒</option>
                            <option value="crisis">危機輔導</option>
                            <option value="marriage">婚姻輔導</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">狀態</label>
                        <select id="careTargetStatus" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="new">新個案</option>
                            <option value="ongoing">進行中</option>
                            <option value="completed">已完成</option>
                            <option value="followup">跟進中</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <textarea id="careTargetNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeCareTargetModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 輔導預約模態框 -->
    <div id="appointmentModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">新增輔導預約</h3>
                <form id="appointmentForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">關懷對象</label>
                        <select id="appointmentTarget" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <!-- 動態載入關懷對象 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">預約日期</label>
                        <input type="date" id="appointmentDate" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">預約時間</label>
                        <input type="time" id="appointmentTime" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">輔導類型</label>
                        <select id="appointmentType" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="counseling">個人輔導</option>
                            <option value="prayer">禱告關懷</option>
                            <option value="visit">探訪關懷</option>
                            <option value="support">支持小組</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">輔導員</label>
                        <input type="text" id="appointmentCounselor" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <textarea id="appointmentNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeAppointmentModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 關懷計劃模態框 -->
    <div id="carePlanModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">關懷計劃</h3>
                <form id="carePlanForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">計劃名稱</label>
                        <input type="text" id="planName" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">目標群體</label>
                        <select id="planTargetGroup" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="elderly">長者</option>
                            <option value="youth">青年</option>
                            <option value="families">家庭</option>
                            <option value="newbelievers">新信徒</option>
                            <option value="sick">病患</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">開始日期</label>
                        <input type="date" id="planStartDate" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">結束日期</label>
                        <input type="date" id="planEndDate" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">計劃內容</label>
                        <textarea id="planContent" rows="4" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeCarePlanModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 基本數據結構
        let careTargets = [];
        let appointments = [];
        let careRecords = [];
        let carePlans = [];
        let editingCareTargetId = null;

        // 頁面載入
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupEventListeners();
            loadDemoData();
            renderData();
        });

        // 設置事件監聽器
        function setupEventListeners() {
            document.getElementById('careTargetForm').addEventListener('submit', handleCareTargetSubmit);
            document.getElementById('appointmentForm').addEventListener('submit', handleAppointmentSubmit);
            document.getElementById('carePlanForm').addEventListener('submit', handleCarePlanSubmit);
        }

        // 載入數據
        function loadData() {
            careTargets = JSON.parse(localStorage.getItem('careTargets')) || [];
            appointments = JSON.parse(localStorage.getItem('careAppointments')) || [];
            careRecords = JSON.parse(localStorage.getItem('careRecords')) || [];
            carePlans = JSON.parse(localStorage.getItem('carePlans')) || [];
        }

        // 保存數據
        function saveData() {
            localStorage.setItem('careTargets', JSON.stringify(careTargets));
            localStorage.setItem('careAppointments', JSON.stringify(appointments));
            localStorage.setItem('careRecords', JSON.stringify(careRecords));
            localStorage.setItem('carePlans', JSON.stringify(carePlans));
        }

        // 載入演示數據
        function loadDemoData() {
            if (careTargets.length === 0) {
                careTargets = [
                    {
                        id: '1',
                        name: '王弟兄',
                        phone: '0912-345-678',
                        address: '台北市信義區',
                        careType: 'sick',
                        status: 'ongoing',
                        notes: '需要定期關懷'
                    },
                    {
                        id: '2',
                        name: '李姊妹',
                        phone: '0923-456-789',
                        address: '台北市大安區',
                        careType: 'elderly',
                        status: 'ongoing',
                        notes: '獨居長者，需要陪伴'
                    },
                    {
                        id: '3',
                        name: '張弟兄',
                        phone: '0934-567-890',
                        address: '台北市中山區',
                        careType: 'newbeliever',
                        status: 'new',
                        notes: '新信徒，需要信仰指導'
                    }
                ];
            }

            if (appointments.length === 0) {
                appointments = [
                    {
                        id: '1',
                        targetId: '1',
                        targetName: '王弟兄',
                        date: '2024-01-15',
                        time: '14:00',
                        type: 'counseling',
                        counselor: '陳牧師',
                        notes: '討論治療進展'
                    }
                ];
            }

            if (careRecords.length === 0) {
                careRecords = [
                    {
                        id: '1',
                        targetId: '1',
                        targetName: '王弟兄',
                        date: '2024-01-10',
                        content: '電話關懷，情況穩定',
                        counselor: '陳牧師'
                    }
                ];
            }

            if (carePlans.length === 0) {
                carePlans = [
                    {
                        id: '1',
                        name: '長者關懷計劃',
                        targetGroup: 'elderly',
                        startDate: '2024-01-01',
                        endDate: '2024-12-31',
                        content: '定期探訪獨居長者，提供陪伴和支持'
                    }
                ];
            }

            saveData();
        }

        // 渲染數據
        function renderData() {
            renderCareTargetsList();
            renderRecentCareRecords();
            updateStatistics();
        }

        // 渲染關懷對象列表
        function renderCareTargetsList() {
            const careTargetsList = document.getElementById('careTargetsList');
            if (careTargets.length === 0) {
                careTargetsList.innerHTML = '<p class="text-gray-500 text-center py-8">暫無關懷對象</p>';
                return;
            }

            careTargetsList.innerHTML = careTargets.map(target => `
                <div class="border rounded-lg p-4 bg-white">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-2">
                                <h4 class="font-semibold text-lg">${target.name}</h4>
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(target.status)}">
                                    ${getStatusText(target.status)}
                                </span>
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getTypeColor(target.careType)}">
                                    ${getTypeText(target.careType)}
                                </span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-sm text-gray-600">
                                <div><span class="font-medium">電話:</span> ${target.phone}</div>
                                <div><span class="font-medium">地址:</span> ${target.address}</div>
                                <div><span class="font-medium">狀態:</span> ${getStatusText(target.status)}</div>
                            </div>
                            ${target.notes ? `<div class="mt-2 text-sm text-gray-500">備註：${target.notes}</div>` : ''}
                        </div>
                        <div class="flex space-x-2 ml-4">
                            <button onclick="editCareTarget('${target.id}')" class="text-blue-600 hover:text-blue-800 px-3 py-1 border border-blue-300 rounded hover:bg-blue-50">編輯</button>
                            <button onclick="deleteCareTarget('${target.id}')" class="text-red-600 hover:text-red-800 px-3 py-1 border border-red-300 rounded hover:bg-red-50">刪除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染最近關懷記錄
        function renderRecentCareRecords() {
            const recentDiv = document.getElementById('recentCareRecords');
            if (careRecords.length === 0) {
                recentDiv.innerHTML = '<p class="text-gray-500 text-sm">暫無關懷記錄</p>';
                return;
            }

            recentDiv.innerHTML = careRecords.slice(0, 3).map(record => `
                <div class="border-l-4 border-blue-500 pl-3 mb-3">
                    <h5 class="font-medium text-sm">${record.targetName}</h5>
                    <p class="text-xs text-gray-600">${record.date}</p>
                    <p class="text-xs text-gray-600">${record.content}</p>
                </div>
            `).join('');
        }

        // 更新統計
        function updateStatistics() {
            document.getElementById('totalCareTargets').textContent = careTargets.length;
            document.getElementById('totalAppointments').textContent = appointments.length;
            document.getElementById('ongoingCases').textContent = careTargets.filter(t => t.status === 'ongoing').length;
            document.getElementById('completedCases').textContent = careTargets.filter(t => t.status === 'completed').length;
        }

        // 獲取狀態顏色
        function getStatusColor(status) {
            switch (status) {
                case 'new': return 'bg-blue-100 text-blue-800';
                case 'ongoing': return 'bg-yellow-100 text-yellow-800';
                case 'completed': return 'bg-green-100 text-green-800';
                case 'followup': return 'bg-purple-100 text-purple-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 獲取狀態文字
        function getStatusText(status) {
            switch (status) {
                case 'new': return '新個案';
                case 'ongoing': return '進行中';
                case 'completed': return '已完成';
                case 'followup': return '跟進中';
                default: return '未知';
            }
        }

        // 獲取類型顏色
        function getTypeColor(type) {
            switch (type) {
                case 'sick': return 'bg-red-100 text-red-800';
                case 'elderly': return 'bg-orange-100 text-orange-800';
                case 'newbeliever': return 'bg-green-100 text-green-800';
                case 'crisis': return 'bg-red-100 text-red-800';
                case 'marriage': return 'bg-pink-100 text-pink-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 獲取類型文字
        function getTypeText(type) {
            switch (type) {
                case 'sick': return '病患關懷';
                case 'elderly': return '長者關懷';
                case 'newbeliever': return '新信徒';
                case 'crisis': return '危機輔導';
                case 'marriage': return '婚姻輔導';
                default: return '其他';
            }
        }

        // 關懷對象模態框操作
        function showAddCareTargetModal() {
            editingCareTargetId = null;
            document.getElementById('careTargetModalTitle').textContent = '新增關懷對象';
            document.getElementById('careTargetForm').reset();
            document.getElementById('careTargetModal').classList.remove('hidden');
        }

        function closeCareTargetModal() {
            document.getElementById('careTargetModal').classList.add('hidden');
        }

        function editCareTarget(id) {
            const target = careTargets.find(t => t.id === id);
            if (!target) return;

            editingCareTargetId = id;
            document.getElementById('careTargetModalTitle').textContent = '編輯關懷對象';
            document.getElementById('careTargetName').value = target.name;
            document.getElementById('careTargetPhone').value = target.phone;
            document.getElementById('careTargetAddress').value = target.address;
            document.getElementById('careTargetType').value = target.careType;
            document.getElementById('careTargetStatus').value = target.status;
            document.getElementById('careTargetNotes').value = target.notes || '';

            document.getElementById('careTargetModal').classList.remove('hidden');
        }

        function deleteCareTarget(id) {
            if (confirm('確定要刪除這個關懷對象嗎？')) {
                careTargets = careTargets.filter(t => t.id !== id);
                saveData();
                renderData();
            }
        }

        // 輔導預約模態框操作
        function showAddAppointmentModal() {
            document.getElementById('appointmentForm').reset();
            populateAppointmentTargets();
            document.getElementById('appointmentModal').classList.remove('hidden');
        }

        function closeAppointmentModal() {
            document.getElementById('appointmentModal').classList.add('hidden');
        }

        function populateAppointmentTargets() {
            const select = document.getElementById('appointmentTarget');
            select.innerHTML = '<option value="">選擇關懷對象</option>';
            careTargets.forEach(target => {
                const option = document.createElement('option');
                option.value = target.id;
                option.textContent = target.name;
                select.appendChild(option);
            });
        }

        // 關懷計劃模態框操作
        function showCarePlanModal() {
            document.getElementById('carePlanForm').reset();
            document.getElementById('carePlanModal').classList.remove('hidden');
        }

        function closeCarePlanModal() {
            document.getElementById('carePlanModal').classList.add('hidden');
        }

        // 處理表單提交
        function handleCareTargetSubmit(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('careTargetName').value,
                phone: document.getElementById('careTargetPhone').value,
                address: document.getElementById('careTargetAddress').value,
                careType: document.getElementById('careTargetType').value,
                status: document.getElementById('careTargetStatus').value,
                notes: document.getElementById('careTargetNotes').value
            };

            if (editingCareTargetId) {
                // 編輯現有記錄
                const index = careTargets.findIndex(t => t.id === editingCareTargetId);
                if (index !== -1) {
                    careTargets[index] = { ...careTargets[index], ...formData };
                }
            } else {
                // 新增記錄
                formData.id = Date.now().toString();
                careTargets.push(formData);
            }

            saveData();
            renderData();
            closeCareTargetModal();
        }

        function handleAppointmentSubmit(e) {
            e.preventDefault();
            
            const targetId = document.getElementById('appointmentTarget').value;
            const target = careTargets.find(t => t.id === targetId);
            
            const formData = {
                id: Date.now().toString(),
                targetId: targetId,
                targetName: target ? target.name : '',
                date: document.getElementById('appointmentDate').value,
                time: document.getElementById('appointmentTime').value,
                type: document.getElementById('appointmentType').value,
                counselor: document.getElementById('appointmentCounselor').value,
                notes: document.getElementById('appointmentNotes').value
            };

            appointments.push(formData);
            saveData();
            renderData();
            closeAppointmentModal();
            alert('預約已保存！');
        }

        function handleCarePlanSubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: Date.now().toString(),
                name: document.getElementById('planName').value,
                targetGroup: document.getElementById('planTargetGroup').value,
                startDate: document.getElementById('planStartDate').value,
                endDate: document.getElementById('planEndDate').value,
                content: document.getElementById('planContent').value
            };

            carePlans.push(formData);
            saveData();
            closeCarePlanModal();
            alert('關懷計劃已保存！');
        }

        // 匯出數據
        function exportCareData() {
            const csvContent = generateCareCSV();
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `關懷輔導數據_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 生成關懷輔導CSV
        function generateCareCSV() {
            const targetHeaders = ['對象ID', '姓名', '電話', '地址', '關懷類型', '狀態', '備註'];
            const targetRows = careTargets.map(t => [
                t.id, t.name, t.phone, t.address, getTypeText(t.careType), getStatusText(t.status), t.notes
            ]);
            
            const appointmentHeaders = ['預約ID', '對象姓名', '日期', '時間', '類型', '輔導員', '備註'];
            const appointmentRows = appointments.map(a => [
                a.id, a.targetName, a.date, a.time, a.type, a.counselor, a.notes
            ]);
            
            const allData = [
                ['=== 關懷對象數據 ==='],
                targetHeaders,
                ...targetRows,
                [''],
                ['=== 輔導預約數據 ==='],
                appointmentHeaders,
                ...appointmentRows
            ];
            
            return allData.map(row => row.map(field => `"${field || ''}"`).join(',')).join('
');
        }
    </script>
