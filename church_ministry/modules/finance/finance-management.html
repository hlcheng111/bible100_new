<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>財務管理 · Finance Management | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">財務管理</h1>
        
        <!-- 統計概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">本月收入</h3>
                <p class="text-3xl font-bold text-green-600" id="monthlyIncome">$0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">本月支出</h3>
                <p class="text-3xl font-bold text-red-600" id="monthlyExpense">$0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">本月結餘</h3>
                <p class="text-3xl font-bold text-blue-600" id="monthlyBalance">$0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">年度預算</h3>
                <p class="text-3xl font-bold text-purple-600" id="yearlyBudget">$0</p>
            </div>
        </div>

        <!-- 主要功能區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 財務記錄 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-semibold">財務記錄</h3>
                            <div class="flex space-x-2">
                                <button onclick="showAddIncomeModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                                    新增收入
                                </button>
                                <button onclick="showAddExpenseModal()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                                    新增支出
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="financeRecordsList" class="space-y-4">
                            <!-- 財務記錄列表將在這裡動態生成 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 側邊欄 -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h4 class="text-lg font-semibold mb-4">快速操作</h4>
                    <button onclick="showBudgetModal()" class="w-full bg-purple-600 text-white py-3 px-4 rounded hover:bg-purple-700 mb-3">
                        預算管理
                    </button>
                    <button onclick="showCategoryModal()" class="w-full bg-blue-600 text-white py-3 px-4 rounded hover:bg-blue-700 mb-3">
                        分類管理
                    </button>
                    <button onclick="exportFinanceData()" class="w-full bg-gray-600 text-white py-3 px-4 rounded hover:bg-gray-700">
                        匯出報表
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h4 class="text-lg font-semibold mb-4">最近交易</h4>
                    <div id="recentTransactions">
                        <!-- 最近交易將在這裡動態生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 收入模態框 -->
    <div id="incomeModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4" id="incomeModalTitle">新增收入</h3>
                <form id="incomeForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">收入日期</label>
                        <input type="date" id="incomeDate" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">收入金額</label>
                        <input type="number" id="incomeAmount" step="0.01" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">收入類別</label>
                        <select id="incomeCategory" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="tithe">十一奉獻</option>
                            <option value="offering">感恩奉獻</option>
                            <option value="donation">特別奉獻</option>
                            <option value="event">活動收入</option>
                            <option value="other">其他收入</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">收入來源</label>
                        <input type="text" id="incomeSource" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <textarea id="incomeNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeIncomeModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 支出模態框 -->
    <div id="expenseModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4" id="expenseModalTitle">新增支出</h3>
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">支出日期</label>
                        <input type="date" id="expenseDate" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">支出金額</label>
                        <input type="number" id="expenseAmount" step="0.01" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">支出類別</label>
                        <select id="expenseCategory" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="personnel">人事費用</option>
                            <option value="facility">設施維護</option>
                            <option value="ministry">事工支出</option>
                            <option value="event">活動費用</option>
                            <option value="utility">水電費用</option>
                            <option value="other">其他支出</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">支出項目</label>
                        <input type="text" id="expenseItem" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <textarea id="expenseNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeExpenseModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 預算模態框 -->
    <div id="budgetModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">預算管理</h3>
                <form id="budgetForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">年度</label>
                        <input type="number" id="budgetYear" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">總預算金額</label>
                        <input type="number" id="budgetAmount" step="0.01" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">預算類別</label>
                        <select id="budgetCategory" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="general">一般預算</option>
                            <option value="ministry">事工預算</option>
                            <option value="facility">設施預算</option>
                            <option value="event">活動預算</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <textarea id="budgetNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeBudgetModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 分類管理模態框 -->
    <div id="categoryModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">分類管理</h3>
                <form id="categoryForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">分類名稱</label>
                        <input type="text" id="categoryName" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">分類類型</label>
                        <select id="categoryType" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="income">收入分類</option>
                            <option value="expense">支出分類</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">描述</label>
                        <textarea id="categoryDescription" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeCategoryModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">取消</button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 數據模型
        let incomes = [];
        let expenses = [];
        let budgets = [];
        let categories = [];
        let editingIncomeId = null;
        let editingExpenseId = null;

        // 頁面載入
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupEventListeners();
            loadDemoData();
            renderData();
        });

        // 設置事件監聽器
        function setupEventListeners() {
            document.getElementById('incomeForm').addEventListener('submit', handleIncomeSubmit);
            document.getElementById('expenseForm').addEventListener('submit', handleExpenseSubmit);
            document.getElementById('budgetForm').addEventListener('submit', handleBudgetSubmit);
            document.getElementById('categoryForm').addEventListener('submit', handleCategorySubmit);
        }

        // 載入數據
        function loadData() {
            incomes = JSON.parse(localStorage.getItem('financeIncomes')) || [];
            expenses = JSON.parse(localStorage.getItem('financeExpenses')) || [];
            budgets = JSON.parse(localStorage.getItem('financeBudgets')) || [];
            categories = JSON.parse(localStorage.getItem('financeCategories')) || [];
        }

        // 保存數據
        function saveData() {
            localStorage.setItem('financeIncomes', JSON.stringify(incomes));
            localStorage.setItem('financeExpenses', JSON.stringify(expenses));
            localStorage.setItem('financeBudgets', JSON.stringify(budgets));
            localStorage.setItem('financeCategories', JSON.stringify(categories));
        }

        // 載入演示數據
        function loadDemoData() {
            if (incomes.length === 0) {
                incomes = [
                    {
                        id: '1',
                        date: '2024-01-07',
                        amount: 15000,
                        category: 'tithe',
                        source: '主日奉獻',
                        notes: '主日崇拜奉獻'
                    },
                    {
                        id: '2',
                        date: '2024-01-14',
                        amount: 8000,
                        category: 'offering',
                        source: '感恩奉獻',
                        notes: '感恩節特別奉獻'
                    }
                ];
            }

            if (expenses.length === 0) {
                expenses = [
                    {
                        id: '1',
                        date: '2024-01-05',
                        amount: 5000,
                        category: 'facility',
                        item: '空調維修',
                        notes: '教會空調系統維修'
                    },
                    {
                        id: '2',
                        date: '2024-01-10',
                        amount: 3000,
                        category: 'ministry',
                        item: '兒童主日學教材',
                        notes: '購買兒童主日學教材'
                    }
                ];
            }

            if (budgets.length === 0) {
                budgets = [
                    {
                        id: '1',
                        year: 2024,
                        amount: 500000,
                        category: 'general',
                        notes: '2024年度總預算'
                    }
                ];
            }

            if (categories.length === 0) {
                categories = [
                    { id: '1', name: '十一奉獻', type: 'income', description: '會員十一奉獻' },
                    { id: '2', name: '感恩奉獻', type: 'income', description: '感恩節特別奉獻' },
                    { id: '3', name: '人事費用', type: 'expense', description: '員工薪資和福利' },
                    { id: '4', name: '設施維護', type: 'expense', description: '建築物和設備維護' }
                ];
            }

            saveData();
        }

        // 渲染數據
        function renderData() {
            renderFinanceRecordsList();
            renderRecentTransactions();
            updateStatistics();
        }

        // 渲染財務記錄列表
        function renderFinanceRecordsList() {
            const container = document.getElementById('financeRecordsList');
            const allRecords = [...incomes.map(i => ({ ...i, type: 'income' })), ...expenses.map(e => ({ ...e, type: 'expense' }))];
            
            if (allRecords.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">暫無財務記錄</p>';
                return;
            }

            // 按日期排序
            allRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = allRecords.map(record => `
                <div class="border rounded-lg p-4 bg-white">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-2">
                                <h4 class="font-semibold text-lg">${record.date}</h4>
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${record.type === 'income' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                    ${record.type === 'income' ? '收入' : '支出'}
                                </span>
                                <span class="text-lg font-bold ${record.type === 'income' ? 'text-green-600' : 'text-red-600'}">
                                    ${record.type === 'income' ? '+' : '-'}$${record.amount.toLocaleString()}
                                </span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-sm text-gray-600">
                                <div>
                                    <span class="font-medium">類別:</span> ${getCategoryText(record.category)}
                                </div>
                                <div>
                                    <span class="font-medium">${record.type === 'income' ? '來源' : '項目'}:</span> ${record.type === 'income' ? record.source : record.item}
                                </div>
                            </div>
                            ${record.notes ? `<div class="mt-2 text-sm text-gray-500">備註：${record.notes}</div>` : ''}
                        </div>
                        <div class="flex space-x-2 ml-4">
                            <button onclick="edit${record.type === 'income' ? 'Income' : 'Expense'}('${record.id}')" class="text-blue-600 hover:text-blue-800 px-3 py-1 border border-blue-300 rounded hover:bg-blue-50">編輯</button>
                            <button onclick="delete${record.type === 'income' ? 'Income' : 'Expense'}('${record.id}')" class="text-red-600 hover:text-red-800 px-3 py-1 border border-red-300 rounded hover:bg-red-50">刪除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染最近交易
        function renderRecentTransactions() {
            const container = document.getElementById('recentTransactions');
            const allRecords = [...incomes.map(i => ({ ...i, type: 'income' })), ...expenses.map(e => ({ ...e, type: 'expense' }))];
            
            if (allRecords.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">暫無交易記錄</p>';
                return;
            }

            // 按日期排序並取前5筆
            const recent = allRecords.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

            container.innerHTML = recent.map(record => `
                <div class="border-l-4 ${record.type === 'income' ? 'border-green-500' : 'border-red-500'} pl-3 mb-3">
                    <h5 class="font-medium text-sm">${record.date}</h5>
                    <p class="text-xs text-gray-600">${record.type === 'income' ? '+' : '-'}$${record.amount.toLocaleString()}</p>
                    <p class="text-xs text-gray-600">${getCategoryText(record.category)}</p>
                </div>
            `).join('');
        }

        // 更新統計
        function updateStatistics() {
            const now = new Date();
            const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            
            const monthlyIncome = incomes
                .filter(i => i.date.startsWith(currentMonth))
                .reduce((sum, i) => sum + i.amount, 0);
            
            const monthlyExpense = expenses
                .filter(e => e.date.startsWith(currentMonth))
                .reduce((sum, e) => sum + e.amount, 0);
            
            const monthlyBalance = monthlyIncome - monthlyExpense;
            
            const yearlyBudget = budgets
                .filter(b => b.year === now.getFullYear())
                .reduce((sum, b) => sum + b.amount, 0);

            document.getElementById('monthlyIncome').textContent = `$${monthlyIncome.toLocaleString()}`;
            document.getElementById('monthlyExpense').textContent = `$${monthlyExpense.toLocaleString()}`;
            document.getElementById('monthlyBalance').textContent = `$${monthlyBalance.toLocaleString()}`;
            document.getElementById('yearlyBudget').textContent = `$${yearlyBudget.toLocaleString()}`;
        }

        // 獲取類別文字
        function getCategoryText(category) {
            const categoryMap = {
                // 收入類別
                'tithe': '十一奉獻',
                'offering': '感恩奉獻',
                'donation': '特別奉獻',
                'event': '活動收入',
                'other': '其他收入',
                // 支出類別
                'personnel': '人事費用',
                'facility': '設施維護',
                'ministry': '事工支出',
                'event': '活動費用',
                'utility': '水電費用',
                'other': '其他支出'
            };
            return categoryMap[category] || category;
        }

        // 收入模態框操作
        function showAddIncomeModal() {
            editingIncomeId = null;
            document.getElementById('incomeModalTitle').textContent = '新增收入';
            document.getElementById('incomeForm').reset();
            document.getElementById('incomeModal').classList.remove('hidden');
        }

        function closeIncomeModal() {
            document.getElementById('incomeModal').classList.add('hidden');
        }

        function editIncome(id) {
            const income = incomes.find(i => i.id === id);
            if (!income) return;

            editingIncomeId = id;
            document.getElementById('incomeModalTitle').textContent = '編輯收入';
            document.getElementById('incomeDate').value = income.date;
            document.getElementById('incomeAmount').value = income.amount;
            document.getElementById('incomeCategory').value = income.category;
            document.getElementById('incomeSource').value = income.source;
            document.getElementById('incomeNotes').value = income.notes || '';

            document.getElementById('incomeModal').classList.remove('hidden');
        }

        function deleteIncome(id) {
            if (confirm('確定要刪除這筆收入記錄嗎？')) {
                incomes = incomes.filter(i => i.id !== id);
                saveData();
                renderData();
            }
        }

        // 支出模態框操作
        function showAddExpenseModal() {
            editingExpenseId = null;
            document.getElementById('expenseModalTitle').textContent = '新增支出';
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseModal').classList.remove('hidden');
        }

        function closeExpenseModal() {
            document.getElementById('expenseModal').classList.add('hidden');
        }

        function editExpense(id) {
            const expense = expenses.find(e => e.id === id);
            if (!expense) return;

            editingExpenseId = id;
            document.getElementById('expenseModalTitle').textContent = '編輯支出';
            document.getElementById('expenseDate').value = expense.date;
            document.getElementById('expenseAmount').value = expense.amount;
            document.getElementById('expenseCategory').value = expense.category;
            document.getElementById('expenseItem').value = expense.item;
            document.getElementById('expenseNotes').value = expense.notes || '';

            document.getElementById('expenseModal').classList.remove('hidden');
        }

        function deleteExpense(id) {
            if (confirm('確定要刪除這筆支出記錄嗎？')) {
                expenses = expenses.filter(e => e.id !== id);
                saveData();
                renderData();
            }
        }

        // 預算模態框操作
        function showBudgetModal() {
            document.getElementById('budgetForm').reset();
            document.getElementById('budgetYear').value = new Date().getFullYear();
            document.getElementById('budgetModal').classList.remove('hidden');
        }

        function closeBudgetModal() {
            document.getElementById('budgetModal').classList.add('hidden');
        }

        // 分類模態框操作
        function showCategoryModal() {
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        // 處理表單提交
        function handleIncomeSubmit(e) {
            e.preventDefault();
            
            const formData = {
                date: document.getElementById('incomeDate').value,
                amount: parseFloat(document.getElementById('incomeAmount').value),
                category: document.getElementById('incomeCategory').value,
                source: document.getElementById('incomeSource').value,
                notes: document.getElementById('incomeNotes').value
            };

            if (editingIncomeId) {
                // 編輯現有記錄
                const index = incomes.findIndex(i => i.id === editingIncomeId);
                if (index !== -1) {
                    incomes[index] = { ...incomes[index], ...formData };
                }
            } else {
                // 新增記錄
                formData.id = Date.now().toString();
                incomes.push(formData);
            }

            saveData();
            renderData();
            closeIncomeModal();
        }

        function handleExpenseSubmit(e) {
            e.preventDefault();
            
            const formData = {
                date: document.getElementById('expenseDate').value,
                amount: parseFloat(document.getElementById('expenseAmount').value),
                category: document.getElementById('expenseCategory').value,
                item: document.getElementById('expenseItem').value,
                notes: document.getElementById('expenseNotes').value
            };

            if (editingExpenseId) {
                // 編輯現有記錄
                const index = expenses.findIndex(e => e.id === editingExpenseId);
                if (index !== -1) {
                    expenses[index] = { ...expenses[index], ...formData };
                }
            } else {
                // 新增記錄
                formData.id = Date.now().toString();
                expenses.push(formData);
            }

            saveData();
            renderData();
            closeExpenseModal();
        }

        function handleBudgetSubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: Date.now().toString(),
                year: parseInt(document.getElementById('budgetYear').value),
                amount: parseFloat(document.getElementById('budgetAmount').value),
                category: document.getElementById('budgetCategory').value,
                notes: document.getElementById('budgetNotes').value
            };

            budgets.push(formData);
            saveData();
            closeBudgetModal();
            alert('預算已保存！');
        }

        function handleCategorySubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: Date.now().toString(),
                name: document.getElementById('categoryName').value,
                type: document.getElementById('categoryType').value,
                description: document.getElementById('categoryDescription').value
            };

            categories.push(formData);
            saveData();
            closeCategoryModal();
            alert('分類已保存！');
        }

        // 匯出數據
        function exportFinanceData() {
            const csvContent = generateFinanceCSV();
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `財務數據_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 生成財務CSV
        function generateFinanceCSV() {
            const incomeHeaders = ['收入ID', '日期', '金額', '類別', '來源', '備註'];
            const incomeRows = incomes.map(i => [
                i.id, i.date, i.amount, getCategoryText(i.category), i.source, i.notes
            ]);
            
            const expenseHeaders = ['支出ID', '日期', '金額', '類別', '項目', '備註'];
            const expenseRows = expenses.map(e => [
                e.id, e.date, e.amount, getCategoryText(e.category), e.item, e.notes
            ]);
            
            const allData = [
                ['=== 收入數據 ==='],
                incomeHeaders,
                ...incomeRows,
                [''],
                ['=== 支出數據 ==='],
                expenseHeaders,
                ...expenseRows
            ];
            
            return allData.map(row => row.map(field => `"${field || ''}"`).join(',')).join('
');
        }
    </script>
