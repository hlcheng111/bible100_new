<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>新人登記 · 在家填寫 | Bible100</title>
  <style>
    :root {
      --teal: #0d9488;
      --ink: #134e4a;
      --bg: #f0fdfa;
      --line: #99f6e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(900px 320px at 10% -10%, #ccfbf1 0%, transparent 55%),
        radial-gradient(700px 280px at 100% 0%, #a5f3fc 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px 14px 40px;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    .hero {
      background: linear-gradient(135deg, #0f766e, #0369a1);
      color: #fff;
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
    }
    .hero h1 { margin: 0 0 6px; font-size: 1.35rem; }
    .hero p { margin: 0; font-size: 13px; line-height: 1.5; opacity: 0.95; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; font-weight: 700; margin: 10px 0 4px; }
    input, textarea, select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px; /* 手機不縮放 */
      font-family: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .venues { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .venues label {
      display: flex; align-items: center; gap: 10px;
      margin: 0; font-weight: 600; font-size: 14px;
      padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px;
      min-height: 44px;
    }
    .venues input { width: auto; min-height: 22px; }
    .btn {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: var(--teal);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; }
    .hint { font-size: 11px; color: #64748b; line-height: 1.5; margin: 8px 0 0; }
    .ok {
      display: none;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 14px;
      padding: 14px;
    }
    .ok.show { display: block; }
    .ok strong { font-size: 15px; }
    .links a {
      display: inline-block;
      margin: 6px 8px 0 0;
      color: #0f766e;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <link rel="stylesheet" href="../../css/attendance_process_strip.css" />
  <div class="wrap">
    <header class="hero">
      <h1>歡迎登記</h1>
      <p>填好姓名同電話就得。送出後教會會為你準備入場短碼——呢一步<strong>未會</strong>出 QR，放心慢慢填。</p>
    </header>

    <details style="margin-bottom:10px;font-size:12px;color:#64748b;">
      <summary style="cursor:pointer;font-weight:700;">想知自己喺邊一步？（可唔開）</summary>
      <div data-att-line="register" data-att-line-base="../../" style="margin-top:8px;"></div>
    </details>

    <form class="card" id="nc-form">
      <label for="nc-name">姓名 *</label>
      <input id="nc-name" name="name" autocomplete="name" required maxlength="40" placeholder="例：陳恩惠" />

      <label for="nc-phone">手機 *</label>
      <input id="nc-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="09xxxxxxxx" />

      <label for="nc-email">電郵（選填）</label>
      <input id="nc-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />

      <label>想參加（可多選）</label>
      <div class="venues">
        <label><input type="checkbox" name="venue" value="worship" checked /> 主日崇拜</label>
        <label><input type="checkbox" name="venue" value="cell" checked /> 團契小組</label>
        <label><input type="checkbox" name="venue" value="choir" /> 詩班練習</label>
      </div>

      <label for="nc-note">想對教會說的一句（選填）</label>
      <textarea id="nc-note" maxlength="200" placeholder="例：第一次來／想認識小組"></textarea>

      <button type="submit" class="btn" id="nc-submit">送出登記</button>
      <p class="hint">資料暫存於此裝置瀏覽器（試用）。負責人核對後才會出 QR；不會自動打擾你。</p>
    </form>

    <div class="ok" id="nc-ok">
      <strong>謝謝你！我們已收到你的登記</strong>
      <p id="nc-ok-msg" class="hint" style="font-size:13px;color:#134e4a;"></p>
      <p class="hint" style="font-size:13px;color:#134e4a;">下一步由教會為你出短碼／QR。到場時交給門口同工即可。</p>
      <div class="card" style="margin-top:12px;background:#fffbeb;border-color:#fde68a;">
        <strong style="font-size:14px;color:#92400e;">第 4 步（可選，可拒）</strong>
        <p class="hint" style="font-size:13px;color:#78350f;margin:6px 0 0;">
          出席成功之後，若你年約 50+ 或想認識「安靜參與／小組」，歡迎看看豐盛金齡——
          <strong>不必填量表、不必答應服侍</strong>。
        </p>
        <div class="links" style="margin-top:8px;">
          <a href="golden-age-hub.html?crm_from=newcomer_step4">認識金齡安全門</a>
          <a href="golden-age-rest.html?crm_from=newcomer_step4">我只想安靜參與</a>
          <a href="pastoral-integrated.html?role=member#tab-groups">認識小組</a>
        </div>
      </div>
      <div class="links">
        <a class="btn" href="newcomer-qr-desk.html?crm_from=newcomer_self" style="display:inline-block;width:auto;text-decoration:none;margin-top:8px;">教會同工：去發碼 →</a>
      </div>
    </div>

    <p class="hint" style="text-align:center;">
      <a href="../../docs/ATTENDANCE_OPS_HANDBOOK.html" style="color:#0f766e;">今日三步手冊</a>
    </p>
  </div>

  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../js/newcomer_qr_store.js"></script>
  <script src="../../js/attendance_process_strip.js"></script>
  <script>
  (function () {
    var form = document.getElementById("nc-form");
    var ok = document.getElementById("nc-ok");
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var venues = [];
      form.querySelectorAll('input[name="venue"]:checked').forEach(function (c) {
        venues.push(c.value);
      });
      var res = window.NewcomerQrStore.submitSelfRegister({
        name: document.getElementById("nc-name").value,
        phone: document.getElementById("nc-phone").value,
        email: document.getElementById("nc-email").value,
        note: document.getElementById("nc-note").value,
        venues: venues
      });
      if (!res.ok) {
        alert(res.error || "送出失敗");
        return;
      }
      form.style.display = "none";
      ok.classList.add("show");
      document.getElementById("nc-ok-msg").textContent =
        "編號 " + res.memberId + " · " + (res.reused ? "已更新你先前的申請" : "新申請已排隊") +
        "。負責人核對後會發 QR。";
    };
  })();
  </script>
</body>
</html>
