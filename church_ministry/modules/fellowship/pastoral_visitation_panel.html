<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>探訪佇列 · B 牧養 | Church Ministry</title>
  <link rel="stylesheet" href="../../css/pastoral_workspace.css" />
  <link rel="stylesheet" href="../../css/cm_responsive_tokens.css" />
  <script src="../../../js/shell_nav.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
</head>
<body class="pa-wrap pastoral-panel-embed" data-b100-pattern="P-AE-PANEL">
  <main class="sg-main" style="max-width:900px;margin:0 auto;padding:12px">
    <div class="sg-card">
      <h3>🤝 探訪交接佇列（本機）</h3>
      <p class="muted">來自 B 區缺席預警與生命週期規則；完整接案請至 <strong>0-02 探訪工作桌</strong>。</p>
      <div id="pv-queue-list"></div>
      <p id="pv-queue-empty" class="muted ok" hidden>目前無待處理交接。</p>
    </div>
    <div class="sg-toolbar">
      <button type="button" class="pa-btn cm-touch-target" id="pv-open-desk">開啟探訪工作桌（0-02）</button>
      <button type="button" class="pa-btn outline cm-touch-target" id="pv-refresh">重新整理</button>
    </div>
  </main>
  <script src="../../js/pastoral_data_hub.js"></script>
  <script src="../../js/cm_visitation_queue_ui.js"></script>
  <script>
  (function () {
    function render() {
      if (window.CmVisitationQueueUi) {
        CmVisitationQueueUi.renderHandoverList("pv-queue-list", "pv-queue-empty", { zone: "b" });
      }
    }
    document.getElementById("pv-refresh").onclick = render;
    document.getElementById("pv-open-desk").onclick = function (ev) {
      if (window.bible100ShellNav) {
        return bible100ShellNav(ev, {
          sidebarUrl: "church_ministry/sidebar_church_layout_v1.html?focus=b",
          contentUrl: "church_ministry/modules/support/visitation_index.html?crm_from=b_desk"
        });
      }
      window.top.location.href = "../support/visitation_index.html?crm_from=b_desk";
    };
    render();
  })();
  </script>
</body>
</html>
