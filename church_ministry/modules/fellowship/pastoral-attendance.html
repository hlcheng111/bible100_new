<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚会与出席统计 · Attendance | Church Ministry</title>
    <link rel="stylesheet" href="../../css/pastoral_workspace.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../../../js/page_capability_badge.js" data-status="live"></script>
    <script src="../../../js/cloud_config.js"></script>
    <script src="../../../js/church_data_bridge.js"></script>
    <script>
    (function () {
      if (window.parent === window || !window.parent.PastoralIntegratedShell) return;
      document.addEventListener('DOMContentLoaded', function () {
        var nav = document.querySelector('.sg-nav');
        if (!nav) return;
        nav.innerHTML =
          '<a href="#" data-tab="groups">← 小組 Tab</a>' +
          '<a href="#" data-tab="alerts">缺席預警 Tab</a>' +
          '<a href="#" data-tab="visitation">探訪佇列 Tab</a>';
        nav.querySelectorAll('[data-tab]').forEach(function (a) {
          a.onclick = function (ev) {
            ev.preventDefault();
            window.parent.PastoralIntegratedShell.switchTab(a.getAttribute('data-tab'));
          };
        });
      });
    })();
    </script>
</head>
<body data-b100-module="church_ministry" data-b100-ae-chrome="minimal" data-b100-ae-zone="b" data-b100-pattern="P-AE-PRIMARY" data-b100-ae-prefix="../..">
    <div class="sg-wrap pa-wrap">
        <header class="sg-header pa-header">
            <nav class="sg-nav">
                <a href="pastoral-integrated.html?crm_from=b_pastoral&amp;role=leader#tab-groups">牧養工作桌</a>
                <a href="pastoral-integrated.html?crm_from=b_pastoral&amp;role=leader#tab-alerts">缺席預警</a>
                <a href="../support/visitation_index.html?crm_from=b_pastoral">探訪事工 0-02</a>
            </nav>
            <h1>📊 聚会与出席统计</h1>
            <p class="sg-tagline">每周汇报 · 出席走势 · 漏网预警（连续 3 周缺席 → 探访事工）· 奉献摘要</p>
            <div class="sg-toolbar">
                <label>牧区／小组
                    <select id="pa-group-select" class="sg-select"></select>
                </label>
                <button type="button" class="pa-btn" id="pa-export-att-csv" data-w3-report="attendance-csv">⬇ 出席 CSV</button>
                <button type="button" class="pa-btn" id="pa-export-alert-csv" data-w3-report="absence-csv">⬇ 缺席預警 CSV</button>
                <button type="button" class="pa-btn" id="pa-print-week" data-w3-report="attendance-print">🖨 列印本週名單</button>
            </div>
        </header>
        <div class="sg-tabs pa-tabs">
            <button type="button" class="pa-tab sg-tab active" data-tab="report">Tab1 · 每周出席汇报</button>
            <button type="button" class="pa-tab sg-tab" data-tab="trend">Tab2 · 出席率走势</button>
            <button type="button" class="pa-tab sg-tab" data-tab="alerts">Tab3 · 异常漏网预警</button>
            <button type="button" class="pa-tab sg-tab" data-tab="finance">Tab4 · 奉献与资源</button>
        </div>
        <main class="sg-main">
            <div id="pa-panel-report" class="sg-panel pa-panel active">
                <div id="pa-report-form"></div>
            </div>
            <div id="pa-panel-trend" class="sg-panel pa-panel">
                <div class="sg-card">
                    <h3>小组出席率趋势</h3>
                    <canvas id="pa-trend-chart" height="120"></canvas>
                    <ul id="pa-trend-summary" class="pa-summary-list"></ul>
                </div>
            </div>
            <div id="pa-panel-alerts" class="sg-panel pa-panel">
                <div id="pa-alerts"></div>
            </div>
            <div id="pa-panel-finance" class="sg-panel pa-panel">
                <div id="pa-finance"></div>
            </div>
        </main>
    </div>
    <script src="../../js/pastoral_data_hub.js"></script>
    <script src="../../js/pastoral_attendance_ui.js"></script>
    <link rel="stylesheet" href="../../css/ae_pastoral_story_head.css" />
    <script src="../../../js/shell_nav.js"></script>
    <script src="../../js/ae_pastoral_story_nav.js"></script>
    <script src="../../js/ae_subpage_shell.js"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
