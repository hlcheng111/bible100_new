<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動管理 · Activity Management | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <script src="assets/js/chart.min.js"></script>
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">活動管理</h1>
        
        <!-- 快速操作 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <button onclick="showActivityForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i>創建活動
            </button>
            <button onclick="showRegistrationForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                <i class="fas fa-user-plus mr-2"></i>報名管理
            </button>
            <button onclick="showReport()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                <i class="fas fa-chart-bar mr-2"></i>活動報表
            </button>
            <button onclick="exportData()" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">
                <i class="fas fa-download mr-2"></i>導出數據
            </button>
        </div>

        <!-- 活動概覽 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalActivities">0</div>
                <div class="text-sm text-gray-600">總活動數</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-green-600" id="activeActivities">0</div>
                <div class="text-sm text-gray-600">進行中活動</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-purple-600" id="totalParticipants">0</div>
                <div class="text-sm text-gray-600">總參與人數</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-orange-600" id="avgParticipation">0%</div>
                <div class="text-sm text-gray-600">平均參與率</div>
            </div>
        </div>

        <!-- 圖表分析 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">活動參與趨勢</h3>
                <canvas id="participationChart" height="300"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">活動類型分布</h3>
                <canvas id="activityTypeChart" height="300"></canvas>
            </div>
        </div>

        <!-- 活動列表 -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">活動列表</h3>
            <div id="activityList" class="space-y-4">
                <!-- 動態生成活動 -->
            </div>
        </div>
    </div>

    <!-- 報名管理表單 -->
    <div id="registrationModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">報名管理</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">選擇活動</label>
                        <select id="activitySelect" onchange="loadActivityParticipants()" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="">請選擇活動</option>
                        </select>
                    </div>
                    <div id="participantList" class="hidden">
                        <h4 class="font-medium text-gray-700 mb-2">參與者列表</h4>
                        <div class="max-h-64 overflow-y-auto border border-gray-300 rounded-lg p-2">
                            <!-- 動態生成參與者列表 -->
                        </div>
                    </div>
                </div>
                <div class="flex space-x-3 mt-6">
                    <button onclick="closeRegistrationModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex-1">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 創建活動表單 -->
    <div id="activityModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">創建新活動</h3>
                <form id="activityForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">活動名稱</label>
                            <input type="text" id="activityName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">活動類型</label>
                            <select id="activityType" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="">請選擇類型</option>
                                <option value="worship">崇拜活動</option>
                                <option value="fellowship">團契活動</option>
                                <option value="education">教育活動</option>
                                <option value="outreach">外展活動</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">開始日期</label>
                            <input type="date" id="startDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">地點</label>
                            <input type="text" id="location" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">活動描述</label>
                        <textarea id="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                    </div>
                    <div class="flex space-x-3 mt-6">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex-1">創建活動</button>
                        <button type="button" onclick="closeActivityModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex-1">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let activities = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            updateOverview();
            setupCharts();
            renderActivityList();
        });

        function loadData() {
            activities = JSON.parse(localStorage.getItem('activities')) || [];
            
            if (activities.length === 0) {
                loadSampleData();
            }
        }

        function loadSampleData() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            
            const sampleActivities = [
                {
                    id: '1',
                    name: '主日崇拜',
                    type: 'worship',
                    startDate: today.toISOString().split('T')[0],
                    location: '主堂',
                    description: '每週主日崇拜',
                    status: 'active'
                },
                {
                    id: '2',
                    name: '青年團契',
                    type: 'fellowship',
                    startDate: tomorrow.toISOString().split('T')[0],
                    location: '青年中心',
                    description: '青年團契聚會',
                    status: 'upcoming'
                }
            ];
            
            activities = sampleActivities;
            localStorage.setItem('activities', JSON.stringify(activities));
        }

        function updateOverview() {
            const totalActivities = activities.length;
            const activeActivities = activities.filter(a => a.status === 'active').length;
            
            document.getElementById('totalActivities').textContent = totalActivities;
            document.getElementById('activeActivities').textContent = activeActivities;
            document.getElementById('totalParticipants').textContent = '25'; // 簡化
            document.getElementById('avgParticipation').textContent = '75%'; // 簡化
        }

        function setupCharts() {
            // 活動參與趨勢圖表
            const ctx1 = document.getElementById('participationChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                    datasets: [{
                        label: '參與人數',
                        data: [120, 135, 142, 158, 168, 185],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });

            // 活動類型分布圖表
            const ctx2 = document.getElementById('activityTypeChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['崇拜活動', '團契活動', '教育活動', '外展活動'],
                    datasets: [{
                        data: [40, 30, 20, 10],
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ]
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderActivityList() {
            const container = document.getElementById('activityList');
            container.innerHTML = activities.map(activity => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="text-lg font-semibold text-gray-900">${activity.name}</h4>
                            <div class="text-sm text-gray-600 mt-1">
                                <i class="fas fa-calendar mr-2"></i>${activity.startDate}
                            </div>
                            <div class="text-sm text-gray-600 mt-1">
                                <i class="fas fa-map-marker-alt mr-2"></i>${activity.location}
                            </div>
                            <div class="text-sm text-gray-600 mt-2">${activity.description}</div>
                        </div>
                        <div class="flex flex-col items-end space-y-2">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusClass(activity.status)}">
                                ${getStatusText(activity.status)}
                            </span>
                            <div class="flex space-x-2">
                                <button onclick="editActivity('${activity.id}')" class="text-blue-600 hover:text-blue-800">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteActivity('${activity.id}')" class="text-red-600 hover:text-red-800">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            const classes = {
                'active': 'bg-green-100 text-green-800',
                'upcoming': 'bg-blue-100 text-blue-800',
                'completed': 'bg-gray-100 text-gray-800',
                'cancelled': 'bg-red-100 text-red-800'
            };
            return classes[status] || 'bg-gray-100 text-gray-800';
        }

        function getStatusText(status) {
            const texts = {
                'active': '進行中',
                'upcoming': '即將開始',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return texts[status] || status;
        }

        function showActivityForm() {
            document.getElementById('activityModal').classList.remove('hidden');
            document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
        }

        function showRegistrationForm() {
            document.getElementById('registrationModal').classList.remove('hidden');
            populateActivitySelect();
        }

        function closeActivityModal() {
            document.getElementById('activityModal').classList.add('hidden');
            document.getElementById('activityForm').reset();
        }

        function closeRegistrationModal() {
            document.getElementById('registrationModal').classList.add('hidden');
        }

        function populateActivitySelect() {
            const select = document.getElementById('activitySelect');
            select.innerHTML = '<option value="">請選擇活動</option>' + 
                activities.map(activity => `<option value="${activity.id}">${activity.name}</option>`).join('');
        }

        function loadActivityParticipants() {
            const activityId = document.getElementById('activitySelect').value;
            if (!activityId) {
                document.getElementById('participantList').classList.add('hidden');
                return;
            }

            // 簡化版本：顯示模擬參與者數據
            const container = document.getElementById('participantList');
            container.innerHTML = `
                <div class="space-y-2">
                    <div class="flex justify-between items-center p-2 border-b border-gray-200">
                        <span class="text-sm text-gray-700">張三</span>
                        <span class="text-xs text-green-600">已報名</span>
                    </div>
                    <div class="flex justify-between items-center p-2 border-b border-gray-200">
                        <span class="text-sm text-gray-700">李四</span>
                        <span class="text-xs text-green-600">已報名</span>
                    </div>
                    <div class="flex justify-between items-center p-2 border-b border-gray-200">
                        <span class="text-xs text-yellow-600">待確認</span>
                    </div>
                </div>
            `;
            
            container.classList.remove('hidden');
        }

        function showReport() {
            showComingSoon('此功能暫未開放','../../dashboard.html');
        }

        function exportData() {
            const csvContent = ['活動名稱,類型,開始日期,地點,狀態,描述
', 
                ...activities.map(activity => [
                    activity.name,
                    activity.type,
                    activity.startDate,
                    activity.location,
                    getStatusText(activity.status),
                    activity.description
                ].join(',') + '
')
            ].join('');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `活動列表_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function editActivity(id) {
            showComingSoon('此功能暫未開放','../../dashboard.html');
        }

        function deleteActivity(id) {
            if (confirm('確定要刪除此活動嗎？')) {
                activities = activities.filter(a => a.id !== id);
                localStorage.setItem('activities', JSON.stringify(activities));
                
                updateOverview();
                renderActivityList();
                setupCharts();
                
                alert('活動已刪除！');
            }
        }

        // 表單提交處理
        document.getElementById('activityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newActivity = {
                id: Date.now().toString(),
                name: document.getElementById('activityName').value,
                type: document.getElementById('activityType').value,
                startDate: document.getElementById('startDate').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                status: 'upcoming'
            };
            
            activities.push(newActivity);
            localStorage.setItem('activities', JSON.stringify(activities));
            
            closeActivityModal();
            updateOverview();
            renderActivityList();
            setupCharts();
            
            alert('活動已創建！');
        });
    </script>
<script src="../../../js/coming-soon.js"></script>
</body>
</html>
