<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>牧養小組工作桌 · 尋寶地圖 | Church Ministry</title>
  <link rel="stylesheet" href="../../css/pastoral_workspace.css" />
  <link rel="stylesheet" href="../../css/pastoral_integrated_shell.css" />
  <link rel="stylesheet" href="../../css/attendance_route_kit.css" />
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/shell_nav.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../js/cm_hub_detect.js"></script>
</head>
<body
  class="cm-shell-body pastoral-shell-body"
  data-b100-module="church_ministry"
  data-b100-pattern="P-AE-PAST-SHELL"
  data-b100-ae-chrome="minimal"
  data-b100-ae-zone="b"
  data-b100-ai-hint="cm_pastoral"
>
<script src="../../../ai_tools/js/ai_collab_page_hint.js"></script>
  <header class="cm-shell-header">
    <h1>今晚小組 · 關心邊個缺席</h1>
    <p class="tagline">先點名，再一齊睇邊個需要關心。唔會自動打擾會友——要你確認先。</p>
    <div class="cm-shell-toolbar">
      <button type="button" class="cm-shell-btn cm-touch-target" id="past-btn-push-queue">去睇待關心名單</button>
      <button type="button" class="cm-shell-btn cm-touch-target" id="past-btn-visitation">開探訪工作桌</button>
    </div>
  </header>

  <details style="margin:8px 12px 0;font-size:12px;color:#64748b;">
    <summary style="cursor:pointer;font-weight:700;">進階：流程位置（可唔開）</summary>
    <link rel="stylesheet" href="../../css/attendance_process_strip.css" />
    <div data-att-line="pastoral" data-att-line-base="../../" style="margin-top:8px;"></div>
  </details>
  <div id="past-guide-banner"></div>

  <div class="cm-overview-strip" aria-label="牧養總覽">
    <div class="cm-stat"><span class="n" id="past-stat-groups">—</span><span class="l">小組</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-members">—</span><span class="l">組員</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-pending">—</span><span class="l">待探訪</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-alerts">—</span><span class="l">缺席預警</span></div>
  </div>

  <div id="past-shell-care" class="cm-ai-care-card" hidden></div>
  <div id="past-nlq-chips" class="cm-bridge-row" style="background:#f0fdf4;border-color:#86efac"></div>
  <form id="past-vq-form" class="cm-bridge-row" style="background:#f0fdf4;border-color:#86efac;display:flex;flex-wrap:wrap;gap:6px;align-items:center" autocomplete="off">
    <label for="past-vq-input" style="font-weight:600">用一句話查：</label>
    <input id="past-vq-input" type="text" maxlength="60" placeholder="例如：這個月誰沒來、還沒入小組的人" style="flex:1;min-width:200px;min-height:40px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px" />
    <button type="submit" class="cm-shell-btn cm-touch-target" id="past-vq-go">查名單</button>
    <span id="past-vq-msg" role="status" style="flex-basis:100%;font-size:13px;color:#334155" hidden></span>
  </form>
  <div id="past-nlq-results" hidden></div>

  <details class="cm-bridge-row" style="font-size:11px;color:#64748b;">
    <summary style="cursor:pointer;">給維護者：資料鍵與跨區說明</summary>
    <p style="margin:6px 0 0;">B ↔ 探訪 0-02 · 推送須同工確認 · member_id SSOT · 試用包 localStorage</p>
  </details>

  <div data-att-route="b_pastoral" style="margin:0;"></div>

  <nav class="cm-shell-tabs" aria-label="牧養 4 Tab">
    <button type="button" class="cm-shell-tab active cm-touch-target" data-tab="groups">① 我嘅小組</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="attendance">② 今晚點名</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="alerts">③ 邊個需要關心</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="visitation">④ 待我確認探訪</button>
  </nav>

  <div class="cm-shell-frame-wrap">
    <iframe
      id="past-integrated-subframe"
      title="牧養子工作區"
      src="small-groups-integrated.html"
    ></iframe>
  </div>

  <script src="../../js/pastoral_data_hub.js?v=20261016_p0"></script>
  <script src="../../js/pastoral_trial_pack.js?v=20261016_p0"></script>
  <script src="../../js/attendance_checkin_store.js"></script>
  <script src="../../js/attendance_process_strip.js"></script>
  <script src="../../js/attendance_route_kit.js"></script>
  <script src="../../js/pastoral_cross_module_bridge.js?v=20260806_cm"></script>
  <script src="../../js/cm_ai_care_helper.js?v=20260806_cm"></script>
  <script src="../../js/cm_voice_query.js?v=20261124p5"></script>
  <script src="../../js/pastoral_nlq_panel.js?v=20261124p5"></script>
  <script src="../../js/cm_demo_gate.js"></script>
<script src="../../js/pastoral_integrated_shell.js?v=20261016_p0"></script>
  <link rel="stylesheet" href="../../css/cm_hub_task_strip.css" />
  <link rel="stylesheet" href="../../css/cm_desk.css" />
  <script src="../../js/cm_desk_registry.js"></script>
  <script src="../../js/cm_desk_kit.js"></script>
  <script src="../../js/cm_hub_task_strip.js"></script>
  <script src="../../../js/hub_base/hub_page_badge.js"></script>
<script src="../../js/cm_flow_strip.js"></script>
<script>CmFlowStrip.mount({"tabs": ".cm-shell-tab", "notes": {"groups": {"from": "中央會友與小組名冊", "to": "②③④ 各 Tab 共用同一份小組與名單"}, "attendance": {"from": "你的小組名冊", "to": "出席主線（簽到臺同一個桶）；小組批量另同步週報供預警", "link": {"href": "attendance-checkin.html?crm_from=b_pastoral", "text": "開簽到臺"}}, "alerts": {"from": "出席主線＋小組週報（連續缺席）", "to": "缺席預警名單（只建議，不自動打擾會友）"}, "visitation": {"from": "③ 預警名單與主日缺席草稿", "to": "探訪佇列；同工確認後才派人、寫結果回來"}}});</script>
</body>
</html>
