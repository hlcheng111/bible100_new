<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>牧養小組工作桌 · B 區 · 4 Tab | Church Ministry</title>
  <link rel="stylesheet" href="../../css/pastoral_workspace.css" />
  <link rel="stylesheet" href="../../css/pastoral_integrated_shell.css" />
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/shell_nav.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../js/cm_hub_detect.js"></script>
</head>
<body
  class="cm-shell-body pastoral-shell-body"
  data-b100-module="church_ministry"
  data-b100-pattern="P-AE-PAST-SHELL"
  data-b100-ae-chrome="minimal"
  data-b100-ae-zone="b"
  data-b100-ai-hint="cm_pastoral"
>
<script src="../../../ai_tools/js/ai_collab_page_hint.js"></script>
  <header class="cm-shell-header">
    <h1>🏠 牧養小組工作桌</h1>
    <p class="tagline">B 區 · 4 Tab — 小組／出席／缺席預警／探訪佇列（左欄切 A–G，此處切任務）</p>
    <div class="cm-shell-toolbar">
      <button type="button" class="cm-shell-btn cm-touch-target" id="past-btn-push-queue">💬 缺席→探訪佇列</button>
      <button type="button" class="cm-shell-btn cm-touch-target" id="past-btn-visitation">🤝 探訪工作桌 0-02</button>
    </div>
  </header>

  <div class="cm-overview-strip" aria-label="牧養總覽">
    <div class="cm-stat"><span class="n" id="past-stat-groups">—</span><span class="l">小組</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-members">—</span><span class="l">組員</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-pending">—</span><span class="l">待交接</span></div>
    <div class="cm-stat"><span class="n" id="past-stat-alerts">—</span><span class="l">缺席預警</span></div>
  </div>

  <div id="past-shell-care" class="cm-ai-care-card" hidden></div>
  <div id="past-nlq-chips" class="cm-bridge-row" style="background:#f0fdf4;border-color:#86efac"></div>
  <div class="cm-bridge-row">
    <strong>B ↔ 探訪 0-02</strong>
    <span class="muted">推送須同工確認 · 不自動派工</span>
  </div>

  <nav class="cm-shell-tabs" aria-label="牧養 4 Tab">
    <button type="button" class="cm-shell-tab active cm-touch-target" data-tab="groups">① 小組</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="attendance">② 出席</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="alerts">③ 缺席預警</button>
    <button type="button" class="cm-shell-tab cm-touch-target" data-tab="visitation">④ 探訪佇列</button>
  </nav>

  <div class="cm-shell-frame-wrap">
    <iframe
      id="past-integrated-subframe"
      title="牧養子工作區"
      src="small-groups-integrated.html"
    ></iframe>
  </div>

  <script src="../../js/pastoral_data_hub.js?v=20260806_cm"></script>
  <script src="../../js/pastoral_cross_module_bridge.js?v=20260806_cm"></script>
  <script src="../../js/cm_ai_care_helper.js?v=20260806_cm"></script>
  <script src="../../js/pastoral_integrated_shell.js?v=20260806_cm"></script>
  <link rel="stylesheet" href="../../css/cm_hub_task_strip.css" />
  <link rel="stylesheet" href="../../css/cm_desk.css" />
  <script src="../../js/cm_desk_registry.js"></script>
  <script src="../../js/cm_desk_kit.js"></script>
  <script src="../../js/cm_hub_task_strip.js"></script>
  <script src="../../../js/hub_base/hub_page_badge.js"></script>
</body>
</html>
