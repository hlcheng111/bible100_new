<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>自願輕量省察 · 豐盛金齡</title>
  <link rel="stylesheet" href="../../css/golden_age_kit.css" />
</head>
<body class="ga-kit">
  <div class="ga-wrap">
    <header class="ga-hero">
      <div class="ga-badge">W2 · 第 4 章定位</div>
      <h1>自願輕量省察</h1>
      <p>對話引子，可隨時跳過。非臨床、不排名、不強制三階檢測。</p>
    </header>

    <div class="ga-warn">請先讀<a href="golden-age-consent.html">知情同意</a>。完整附錄一量表留待教會驗證後再啟用；本頁只收三句＋服侍／安息意願。</div>

    <div class="ga-card">
      <form id="ga-ref-form">
        <label class="ga-lab" for="body">身：體力／作息（一句）</label>
        <input id="body" type="text" maxlength="80" placeholder="例：睡眠不穩，但仍想每兩周見人" />
        <label class="ga-lab" for="heart">心：情緒／孤獨（一句）</label>
        <input id="heart" type="text" maxlength="80" placeholder="例：偶有空虛，小組有幫助" />
        <label class="ga-lab" for="spirit">靈：盼望／恐懼（一句）</label>
        <input id="spirit" type="text" maxlength="80" placeholder="例：怕成為別人負擔" />
        <label class="ga-lab" for="open">最想被聽見的一句</label>
        <textarea id="open" maxlength="400"></textarea>
        <label class="ga-lab" for="path">這一季我傾向</label>
        <select id="path">
          <option value="rest">支援／安息線（只領受）</option>
          <option value="serve">裝備／服侍線（自願、可退）</option>
          <option value="undecided">還在尋求</option>
        </select>
        <button type="submit" class="ga-btn block">自願儲存（本機）</button>
        <a class="ga-btn secondary block" href="golden-age-hub.html" style="margin-top:8px;">跳過，回安全門</a>
      </form>
    </div>

    <div class="ga-card">
      <h2>最近幾次（僅本人裝置）</h2>
      <div id="ga-ref-list" class="ga-muted">尚無。</div>
    </div>

    <div class="ga-nav">
      <a href="golden-age-rest.html">我選擇安息／退場</a>
      <a href="golden-age-roles.html">低壓崗說明</a>
    </div>
  </div>
  <script src="../../js/golden_age_kit_store.js"></script>
  <script>
  (function () {
    function render() {
      var rows = window.GoldenAgeKit.load().reflections || [];
      var box = document.getElementById("ga-ref-list");
      if (!rows.length) { box.textContent = "尚無。"; return; }
      box.innerHTML = rows.slice(0, 5).map(function (r) {
        return "<p><strong>" + (r.at || "").slice(0, 16).replace("T", " ") + "</strong> · " + r.serve_or_rest +
          "<br><span class='ga-muted'>" + (r.open || r.heart || "") + "</span></p>";
      }).join("");
    }
    render();
    document.getElementById("ga-ref-form").onsubmit = function (ev) {
      ev.preventDefault();
      window.GoldenAgeKit.pushReflection({
        body: document.getElementById("body").value,
        heart: document.getElementById("heart").value,
        spirit: document.getElementById("spirit").value,
        open: document.getElementById("open").value,
        serve_or_rest: document.getElementById("path").value
      });
      render();
      alert("已儲存。請與牧者／小組長對話時自行決定是否分享。");
    };
  })();
  </script>
</body>
</html>
