<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小组事工管理 · Small Groups | Church Ministry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
        .header { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); color: white; padding: 15px 20px; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; }
        .tab { padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 11px; }
        .tab.active { background: white; color: #27ae60; font-weight: 600; }
        .container { max-width: 1800px; margin: 0 auto; padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; border-left: 4px solid #27ae60; padding-left: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 15px; }
        .stat-card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #27ae60; }
        .stat-num { font-size: 28px; font-weight: bold; color: #2c3e50; }
        .stat-label { font-size: 10px; color: #7f8c8d; margin-top: 5px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; margin-right: 5px; }
        .btn-primary { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
        table th { background: #f8f9fa; font-weight: 600; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div>    <div class="header">
        <h1>🏠 小组事工管理系统</h1>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">📊 总览</button>
            <button class="tab" onclick="switchTab('groups')">🏠 小组列表</button>
            <button class="tab" onclick="switchTab('meetings')">📅 聚会管理</button>
            <button class="tab" onclick="switchTab('multiplication')">📈 倍增追踪</button>
        </div>
    </div>
    
    <div class="container">
        <div id="tab-overview" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-num" id="s1">0</div><div class="stat-label">小组总数</div></div>
                <div class="stat-card"><div class="stat-num" id="s2">0</div><div class="stat-label">总成员</div></div>
                <div class="stat-card"><div class="stat-num" id="s3">0</div><div class="stat-label">平均规模</div></div>
                <div class="stat-card"><div class="stat-num" id="s4">0</div><div class="stat-label">本周聚会</div></div>
                <div class="stat-card"><div class="stat-num" id="s5">0</div><div class="stat-label">倍增数</div></div>
            </div>
            <div class="grid-2">
                <div class="card"><div class="card-title">📊 小组规模分布</div><canvas id="sizeChart"></canvas></div>
                <div class="card"><div class="card-title">📈 月度出席</div><canvas id="attendChart"></canvas></div>
            </div>
        </div>
        
        <div id="tab-groups" class="tab-content">
            <div class="card">
                <div class="card-title">🏠 小组列表</div>
                <button class="btn btn-primary" onclick="showAddGroupModal()">➕ 新增小组</button>
                <table id="groupsTable"><thead><tr><th>小组名称</th><th>组长</th><th>成员数</th><th>聚会时间</th><th>地点</th><th>操作</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
        
        <div id="tab-meetings" class="tab-content">
            <div class="card">
                <div class="card-title">📅 聚会记录</div>
                <button class="btn btn-primary" onclick="showAddMeetingModal()">➕ 记录聚会</button>
                <table id="meetingsTable"><thead><tr><th>小组</th><th>日期</th><th>主题</th><th>出席人数</th><th>备注</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
        
        <div id="tab-multiplication" class="tab-content">
            <div class="card">
                <div class="card-title">📈 倍增追踪</div>
                <div id="multiplicationTree"></div>
            </div>
        </div>
    </div>
    
    <div id="modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
    
    <script>
        let data = { groups: [], meetings: [] };
        let charts = {};
        
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('smallGroupsData');
            if (saved) data = JSON.parse(saved);
            if (data.groups.length === 0) loadDemo();
            renderAll();
        });
        
        function loadDemo() {
            data.groups = [
                {id:1, name:'青年小组A', leader:'张弟兄', members:12, time:'周六19:00', location:'教会'},
                {id:2, name:'夫妇小组B', leader:'李夫妇', members:10, time:'周五20:00', location:'家庭'},
                {id:3, name:'职场小组C', leader:'王姊妹', members:8, time:'周三19:30', location:'办公室'}
            ];
            data.meetings = [
                {id:1, group:'青年小组A', date:'2025-10-05', topic:'罗马书查经', attendance:11},
                {id:2, group:'夫妇小组B', date:'2025-10-04', topic:'婚姻关系', attendance:9},
                {id:3, group:'职场小组C', date:'2025-10-02', topic:'职场见证', attendance:7}
            ];
            localStorage.setItem('smallGroupsData', JSON.stringify(data));
            renderAll();
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'overview') renderOverview();
        }
        
        function renderAll() {
            renderOverview();
            renderGroups();
            renderMeetings();
        }
        
        function renderOverview() {
            document.getElementById('s1').textContent = data.groups.length;
            document.getElementById('s2').textContent = data.groups.reduce((sum,g)=>sum+g.members,0);
            document.getElementById('s3').textContent = data.groups.length > 0 ? Math.round(data.groups.reduce((sum,g)=>sum+g.members,0)/data.groups.length) : 0;
            document.getElementById('s4').textContent = data.meetings.filter(m => {
                const diff = (new Date() - new Date(m.date)) / (1000*60*60*24);
                return diff >= 0 && diff <= 7;
            }).length;
            document.getElementById('s5').textContent = 0;
        }
        
        function renderGroups() {
            document.querySelector('#groupsTable tbody').innerHTML = data.groups.map(g => `
                <tr>
                    <td>${g.name}</td>
                    <td>${g.leader}</td>
                    <td>${g.members}人</td>
                    <td>${g.time}</td>
                    <td>${g.location}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteGroup(${g.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function renderMeetings() {
            document.querySelector('#meetingsTable tbody').innerHTML = data.meetings.map(m => `
                <tr>
                    <td>${m.group}</td>
                    <td>${m.date}</td>
                    <td>${m.topic}</td>
                    <td>${m.attendance}人</td>
                    <td>${m.notes||'-'}</td>
                </tr>
            `).join('');
        }
        
        function showModal(title, content) {
            document.getElementById('modalContent').innerHTML = `<div style="font-size:18px;font-weight:600;margin-bottom:20px;">${title}</div>${content}`;
            document.getElementById('modal').classList.add('active');
        }
        
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        
        function showAddGroupModal() {
            showModal('➕ 新增小组', `
                <div class="form-group"><label class="form-label">小组名称</label><input type="text" id="gname" class="form-input"></div>
                <div class="form-group"><label class="form-label">组长</label><input type="text" id="gleader" class="form-input"></div>
                <div class="form-group"><label class="form-label">成员数</label><input type="number" id="gmembers" class="form-input" value="10"></div>
                <div class="form-group"><label class="form-label">聚会时间</label><input type="text" id="gtime" class="form-input"></div>
                <div class="form-group"><label class="form-label">地点</label><input type="text" id="glocation" class="form-input"></div>
                <button class="btn btn-primary" onclick="addGroup()">确定</button>
                <button class="btn" onclick="closeModal()">取消</button>
            `);
        }
        
        function addGroup() {
            const g = {
                id: Date.now(),
                name: document.getElementById('gname').value,
                leader: document.getElementById('gleader').value,
                members: parseInt(document.getElementById('gmembers').value),
                time: document.getElementById('gtime').value,
                location: document.getElementById('glocation').value
            };
            if (!g.name) return alert('请填写小组名称');
            data.groups.push(g);
            localStorage.setItem('smallGroupsData', JSON.stringify(data));
            renderAll();
            closeModal();
            alert('✅ 已添加！');
        }
        
        function deleteGroup(id) {
            if (confirm('确定删除？')) {
                data.groups = data.groups.filter(g => g.id !== id);
                localStorage.setItem('smallGroupsData', JSON.stringify(data));
                renderAll();
            }
        }
        
        function showAddMeetingModal() {
            showModal('➕ 记录聚会', `
                <div class="form-group"><label class="form-label">小组</label><select id="mgroup" class="form-select">${data.groups.map(g=>`<option>${g.name}</option>`).join('')}</select></div>
                <div class="form-group"><label class="form-label">日期</label><input type="date" id="mdate" class="form-input"></div>
                <div class="form-group"><label class="form-label">主题</label><input type="text" id="mtopic" class="form-input"></div>
                <div class="form-group"><label class="form-label">出席人数</label><input type="number" id="mattendance" class="form-input" value="10"></div>
                <button class="btn btn-primary" onclick="addMeeting()">确定</button>
                <button class="btn" onclick="closeModal()">取消</button>
            `);
        }
        
        function addMeeting() {
            const m = {
                id: Date.now(),
                group: document.getElementById('mgroup').value,
                date: document.getElementById('mdate').value,
                topic: document.getElementById('mtopic').value,
                attendance: parseInt(document.getElementById('mattendance').value)
            };
            if (!m.date) return alert('请选择日期');
            data.meetings.push(m);
            localStorage.setItem('smallGroupsData', JSON.stringify(data));
            renderAll();
            closeModal();
            alert('✅ 已记录！');
        }
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
