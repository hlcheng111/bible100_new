<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>處境觀測短卷 · 豐盛金齡</title>
  <link rel="stylesheet" href="../../css/golden_age_kit.css" />
</head>
<body class="ga-kit">
  <div class="ga-wrap">
    <header class="ga-hero">
      <div class="ga-badge">W1 · 第 9 章／附錄五–六</div>
      <h1>處境觀測短卷</h1>
      <p>找出本教會 50+ 最痛的前 3 點。這不是靈命測驗，不做排名。</p>
    </header>

    <div class="ga-warn">請優先用於<strong>匿名／聚合</strong>規劃。若實名填寫，須先完成<a href="golden-age-consent.html">知情同意</a>。</div>

    <div class="ga-card">
      <h2>我／我們此刻最重的負擔（可多選）</h2>
      <form id="ga-scan-form">
        <label class="ga-check"><input type="checkbox" name="pain" value="caregiver" /> 三明治照顧壓力</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="money" /> 經濟不安／失業／強積金不足</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="migration" /> 子女移民／家庭離散哀傷</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="lonely" /> 孤獨、空巢、失去同伴</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="health" /> 健康／體力／認知困難</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="faith_pressure" /> 感到「要多事奉」的屬靈壓力</label>
        <label class="ga-check"><input type="checkbox" name="pain" value="ai_scam" /> AI／詐騙／假資訊困擾</label>
        <label class="ga-check"><input type="checkbox" id="pressure" /> 我曾因制度／話術想退出聚會</label>
        <label class="ga-lab" for="ga-note">想補充的一句（選填）</label>
        <textarea id="ga-note" maxlength="400" placeholder="例：最需要照顧者支援小組，而不是短宣。"></textarea>
        <button type="submit" class="ga-btn block">儲存本機觀測</button>
      </form>
    </div>

    <div class="ga-card">
      <h2>本機彙總（規劃用）</h2>
      <div id="ga-scan-sum" class="ga-muted">尚無資料。</div>
    </div>

    <div class="ga-nav">
      <a href="golden-age-hub.html">← 回安全門</a>
      <a href="golden-age-failsafe.html">失敗指標</a>
      <a href="pastoral-integrated.html?role=leader#tab-groups">去小組工作桌</a>
    </div>
  </div>
  <script src="../../js/golden_age_kit_store.js"></script>
  <script>
  (function () {
    var LABELS = {
      caregiver: "照顧者", money: "經濟", migration: "移民離散", lonely: "孤獨",
      health: "健康", faith_pressure: "屬靈壓力", ai_scam: "AI／詐騙"
    };
    function render() {
      var rows = window.GoldenAgeKit.load().context_scans || [];
      var box = document.getElementById("ga-scan-sum");
      if (!rows.length) { box.textContent = "尚無資料。"; return; }
      var counts = {};
      rows.forEach(function (r) {
        (r.pains || []).forEach(function (p) { counts[p] = (counts[p] || 0) + 1; });
      });
      var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 5);
      box.innerHTML = "<p>共 " + rows.length + " 次記錄。出現較多：</p><ul class='ga-list'>" +
        top.map(function (k) { return "<li>" + (LABELS[k] || k) + " · " + counts[k] + "</li>"; }).join("") +
        "</ul><p class='ga-muted'>課程只選對應最痛 4–6 題；勿一次開齊四季（第 7 章提醒）。</p>";
    }
    render();
    document.getElementById("ga-scan-form").onsubmit = function (ev) {
      ev.preventDefault();
      var pains = [];
      document.querySelectorAll('input[name="pain"]:checked').forEach(function (c) { pains.push(c.value); });
      window.GoldenAgeKit.pushContextScan({
        pains: pains,
        pressure_felt: document.getElementById("pressure").checked,
        note: document.getElementById("ga-note").value
      });
      render();
      alert("已儲存。請用於挑選本季 4–6 個核心課題。");
    };
  })();
  </script>
</body>
</html>
