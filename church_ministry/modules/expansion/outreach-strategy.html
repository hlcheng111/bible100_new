<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外展策略 · D 區真鏈 | Church Ministry</title>
  <link rel="stylesheet" href="../../css/module_onboarding.css" />
  <style>
    body { margin: 0; font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #ecfdf5; color: #134e4a; font-size: 12px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
    .hero { background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .hero h1 { margin: 0 0 6px; font-size: 18px; }
    .hero p { margin: 0; font-size: 11px; line-height: 1.55; opacity: 0.95; }
    .card { background: #fff; border: 1px solid #99f6e4; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; color: #0f766e; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; font-size: 11px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; background: #0f766e; color: #fff; text-decoration: none; display: inline-block; }
    .btn.secondary { background: #fff; color: #0f766e; border: 1px solid #5eead4; }
    .btn.ghost { background: #f0fdfa; color: #115e59; border: 1px solid #99f6e4; }
    .item { border: 1px solid #ccfbf1; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #f0fdfa; }
    .item strong { display: block; margin-bottom: 4px; }
    .muted { color: #64748b; font-size: 10px; line-height: 1.5; }
    .chain { font-size: 11px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 10px; margin-bottom: 12px; color: #92400e; }
    .badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #d1fae5; color: #065f46; margin-left: 6px; }
  </style>
  <script src="../../../js/shell_nav.js"></script>
  <script src="../../../js/page_capability_badge.js" data-status="trial" data-warm-banner="trial"></script>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-AE-PRIMARY" data-b100-ae-chrome="minimal" data-b100-ae-zone="d" data-b100-ae-prefix="../.." data-m6-d-chain="1">
  <div class="wrap">
    <div class="hero">
      <h1>🌍 外展策略 · 社區需求真鏈 <span class="badge">M6 LIVE 鏈</span></h1>
      <p>一條真路：登記社區需求（本機保存）→ 一鍵交接探訪工作桌跟進。其餘 D 區子頁仍多為 DEMO，不進儀表板成熟度％。</p>
    </div>

    <div class="chain" id="m6-chain-legend">
      <strong>真鏈步驟：</strong>① 下方填一筆需求並儲存 → ② 按「轉探訪跟進」→ ③ 在探訪工作桌完成關懷紀錄。
      AI／系統<strong>不自動派工</strong>。
    </div>

    <div class="card">
      <h2>① 新增社區需求</h2>
      <label for="out-area">區域</label>
      <input id="out-area" placeholder="例：東區／鄰近屋苑" />
      <label for="out-topic">需求主題</label>
      <input id="out-topic" placeholder="例：長者探訪、青少年課輔" />
      <label for="out-contact">聯絡人（可選）</label>
      <input id="out-contact" placeholder="姓名或稱謂" />
      <label for="out-note">備註</label>
      <textarea id="out-note" placeholder="觀察、時間、注意事項…"></textarea>
      <div class="row">
        <button type="button" class="btn" id="out-save">💾 儲存到本機</button>
        <button type="button" class="btn ghost" id="out-demo">載入一筆示範</button>
      </div>
      <p class="muted" style="margin-top:10px;">資料鍵：<code>bible100_outreach_desk_v1</code>（不上 <code>getCrmMaturitySummary</code>）</p>
    </div>

    <div class="card">
      <h2>② 已存需求 · 轉探訪</h2>
      <div class="row" style="margin-bottom:10px;">
        <button type="button" class="btn ghost" id="out-export-csv" data-w2-report="outreach-csv">⬇ 需求清單 CSV</button>
        <button type="button" class="btn ghost" id="out-print" data-w2-report="outreach-print">🖨 列印清單</button>
      </div>
      <div id="out-list"></div>
      <p class="muted" id="out-empty">尚無資料。請先新增一筆。</p>
    </div>

    <div class="card">
      <h2>填完去哪</h2>
      <div class="row">
        <a class="btn" href="../support/visitation_index.html?crm_from=outreach_d">💬 探訪工作桌</a>
        <a class="btn secondary" href="community-assessment.html?crm_from=outreach_d">📡 社區調研（DEMO）</a>
        <a class="btn secondary" href="#" onclick="return bible100ShellNav(event,{sidebarUrl:'church_ministry/sidebar_church_layout_v1.html?focus=f',contentUrl:'church_ministry/dashboard.html'});">🟩 回日常工作</a>
      </div>
    </div>
  </div>

  <script src="../../js/crm_journey_registry.js"></script>
  <script src="../../js/ae_primary_nav.js"></script>
  <script src="../../js/outreach_desk_store.js"></script>
  <script src="../../js/ae_subpage_shell.js"></script>
  <script>
    (function () {
      var S = window.OutreachDeskStore;
      var listEl = document.getElementById("out-list");
      var emptyEl = document.getElementById("out-empty");

      function render() {
        var items = S.listItems();
        listEl.innerHTML = "";
        emptyEl.style.display = items.length ? "none" : "block";
        items.forEach(function (it) {
          var div = document.createElement("div");
          div.className = "item";
          var st = it.status || "open";
          div.innerHTML =
            "<strong>" +
            escapeHtml(it.area) +
            " · " +
            escapeHtml(it.topic) +
            ' <span class="badge">' +
            escapeHtml(st) +
            "</span></strong>" +
            '<div class="muted">' +
            escapeHtml(it.contact || "（無聯絡人）") +
            (it.note ? " · " + escapeHtml(it.note) : "") +
            "</div>" +
            '<div class="row" style="margin-top:8px">' +
            '<button type="button" class="btn" data-hand="' +
            escapeHtml(it.id) +
            '">➡️ 轉探訪跟進</button>' +
            (st === "open"
              ? '<button type="button" class="btn secondary" data-close="' +
                escapeHtml(it.id) +
                '">標記已結</button>'
              : "") +
            "</div>";
          listEl.appendChild(div);
        });
        listEl.querySelectorAll("[data-hand]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-hand");
            var item = S.listItems().filter(function (x) { return x.id === id; })[0];
            if (!item) return;
            S.setHandoff(item);
            window.location.href = "../support/visitation_index.html?crm_from=outreach_d&handoff=1";
          });
        });
        listEl.querySelectorAll("[data-close]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            S.updateItemStatus(btn.getAttribute("data-close"), "closed");
            render();
          });
        });
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function csvEsc(v) {
        var s = v == null ? "" : String(v);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      }

      function exportCsv() {
        var items = S.listItems();
        var lines = [["id", "area", "topic", "contact", "note", "status", "created_at"].join(",")];
        items.forEach(function (it) {
          lines.push(
            [it.id, it.area, it.topic, it.contact, it.note, it.status || "open", it.created_at || ""]
              .map(csvEsc)
              .join(",")
          );
        });
        var blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "outreach_needs_" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();
      }

      function printList() {
        var items = S.listItems();
        var rows = items
          .map(function (it) {
            return (
              "<tr><td>" +
              escapeHtml(it.area) +
              "</td><td>" +
              escapeHtml(it.topic) +
              "</td><td>" +
              escapeHtml(it.contact || "") +
              "</td><td>" +
              escapeHtml(it.status || "open") +
              "</td><td>" +
              escapeHtml(it.note || "") +
              "</td></tr>"
            );
          })
          .join("");
        var w = window.open("", "_blank");
        if (!w) {
          alert("無法開啟列印視窗");
          return;
        }
        w.document.write(
          '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>外展需求清單</title>' +
            "<style>body{font-family:Microsoft JhengHei,sans-serif;font-size:12px;padding:16px}" +
            "table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}</style></head><body>" +
            "<h1>外展社區需求（" +
            items.length +
            "）</h1><table><thead><tr><th>區域</th><th>主題</th><th>聯絡</th><th>狀態</th><th>備註</th></tr></thead><tbody>" +
            (rows || "<tr><td colspan='5'>無</td></tr>") +
            "</tbody></table><script>window.onload=function(){window.print();}</" +
            "script></body></html>"
        );
        w.document.close();
      }

      document.getElementById("out-save").onclick = function () {
        S.addItem({
          area: document.getElementById("out-area").value,
          topic: document.getElementById("out-topic").value,
          contact: document.getElementById("out-contact").value,
          note: document.getElementById("out-note").value
        });
        document.getElementById("out-topic").value = "";
        document.getElementById("out-note").value = "";
        document.getElementById("out-contact").value = "";
        render();
      };

      document.getElementById("out-demo").onclick = function () {
        S.addItem({
          area: "東區",
          topic: "長者關懷",
          contact: "陳姊妹（街坊）",
          note: "M6 示範：鄰近屋苑獨居長者，建議探訪了解需要。"
        });
        render();
      };

      document.getElementById("out-export-csv").onclick = exportCsv;
      document.getElementById("out-print").onclick = printList;

      render();
    })();
  </script>
<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
