<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=cross-cultural.html">
<title>跨文化事工 - 已合併 · Cross Cultural Ministry | Church Ministry</title>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #9b59b6; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <p style="padding:20px;">此頁已合併至 <a href="cross-cultural.html">跨文化事工</a>（使用 cross_cultural 資料，接 memberSystemData 同工名單）。若未自動跳轉，請<a href="cross-cultural.html">點此</a>。</p>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>🌏 跨文化事工管理</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🌍 跨文化项目</h3>
        <button class="btn" onclick="add()">➕ 新增项目</button>
        <table id="table"><thead><tr><th>文化群体</th><th>服事内容</th><th>参与人数</th><th>负责人</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let projects = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('crossCulturalData');
    if (saved) projects = JSON.parse(saved);
    if (projects.length === 0) { projects = [{id:1,culture:'越南新移民',service:'语言培训',participants:25,leader:'阮姊妹'}]; localStorage.setItem('crossCulturalData', JSON.stringify(projects)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = projects.map(p => `<tr><td>${p.culture}</td><td>${p.service}</td><td>${p.participants}人</td><td>${p.leader}</td></tr>`).join('');
}
function add() { alert('功能：新增跨文化项目'); }
</script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
