<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>宣教拓展 · Mission Expansion | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #f39c12; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>✈️ 宣教拓展管理</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🌍 宣教项目</h3>
        <button class="btn" onclick="add()">➕ 新增项目</button>
        <table id="table"><thead><tr><th>地点</th><th>类型</th><th>团队</th><th>预算</th><th>状态</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let missions = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('missionData');
    if (saved) missions = JSON.parse(saved);
    if (missions.length === 0) { missions = [{id:1,location:'越南',type:'短宣',team:8,budget:120000,status:'计划中'}]; localStorage.setItem('missionData', JSON.stringify(missions)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = missions.map(m => `<tr><td>${m.location}</td><td>${m.type}</td><td>${m.team}人</td><td>$${m.budget.toLocaleString()}</td><td>${m.status}</td></tr>`).join('');
}
function add() { alert('功能：新增宣教项目'); }
</script>
</body>
</html>
