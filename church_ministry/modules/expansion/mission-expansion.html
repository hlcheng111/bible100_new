<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>宣教拓展 · Mission Expansion | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #f39c12; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>✈️ 宣教拓展管理</h1>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
<button type="button" onclick="exportMissionExpansionCsv()" data-w5-report="mission-expansion-csv" style="padding:6px 12px;border:1px solid #fff;background:rgba(255,255,255,0.2);color:#fff;border-radius:6px;cursor:pointer;">⬇ CSV</button>
<button type="button" onclick="printMissionExpansion()" data-w5-report="mission-expansion-print" style="padding:6px 12px;border:1px solid #fff;background:rgba(255,255,255,0.2);color:#fff;border-radius:6px;cursor:pointer;">🖨 列印</button>
</div></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🌍 宣教项目</h3>
        <button class="btn" onclick="add()">➕ 新增项目</button>
        <table id="table"><thead><tr><th>地点</th><th>类型</th><th>团队</th><th>预算</th><th>状态</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let missions = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('missionData');
    if (saved) missions = JSON.parse(saved);
    if (missions.length === 0) { missions = [{id:1,location:'越南',type:'短宣',team:8,budget:120000,status:'计划中'}]; localStorage.setItem('missionData', JSON.stringify(missions)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = missions.map(m => `<tr><td>${m.location}</td><td>${m.type}</td><td>${m.team}人</td><td>$${m.budget.toLocaleString()}</td><td>${m.status}</td></tr>`).join('');
}
function add() { alert('功能：新增宣教项目'); }
function exportMissionExpansionCsv() {
    var U = window.CmReportUtils; if (!U) return;
    var esc = U.csvEsc;
    var list = missions || [];
    if (!list.length) { try { list = JSON.parse(localStorage.getItem('missionData') || '[]'); } catch (e) { list = []; } }
    var lines = [['地點', '類型', '團隊', '預算', '狀態'].map(esc).join(',')];
    list.forEach(function (m) { lines.push([m.location, m.type, m.team, m.budget, m.status].map(esc).join(',')); });
    U.downloadCsv('mission_expansion_' + new Date().toISOString().slice(0, 10) + '.csv', lines);
}
function printMissionExpansion() {
    var U = window.CmReportUtils; if (!U) return;
    var list = missions || [];
    if (!list.length) { try { list = JSON.parse(localStorage.getItem('missionData') || '[]'); } catch (e) { list = []; } }
    var rows = list.map(function (m) { return [m.location, m.type, String(m.team), String(m.budget), m.status]; });
    U.printTable('宣教拓展', ['地點', '類型', '團隊', '預算', '狀態'], rows);
}
</script>
<!-- b100-w5-report-utils -->
<script src="../../js/cm_report_utils.js"></script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
