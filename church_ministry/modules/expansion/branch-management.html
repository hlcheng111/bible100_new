<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>分堂管理 · Branch Management | Church Ministry</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei'; background: #f5f6fa; font-size: 12px; }
.header { background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%); color: white; padding: 15px 20px; }
.container { max-width: 1400px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: #1abc9c; color: white; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
table th { background: #f8f9fa; }</style></head>
<body>
    <div style="padding:10px 20px;"><a href="../../dashboard.html" style="font-size:12px;color:#0b5fa5;text-decoration:none;">⛪ 返回教會事工中心</a></div><div class="header"><h1>🏢 分堂管理</h1></div>
<div class="container">
    <div class="card"><h3 style="margin-bottom:15px;">🏢 分堂列表</h3>
        <button class="btn" onclick="add()">➕ 新增分堂</button>
        <table id="table"><thead><tr><th>分堂名称</th><th>地址</th><th>负责牧者</th><th>会友数</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
let branches = [];
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('branchData');
    if (saved) branches = JSON.parse(saved);
    if (branches.length === 0) { branches = [{id:1,name:'北区分堂',address:'北区XX路',pastor:'李牧师',members:80}]; localStorage.setItem('branchData', JSON.stringify(branches)); }
    render();
});
function render() {
    document.querySelector('#table tbody').innerHTML = branches.map(b => `<tr><td>${b.name}</td><td>${b.address}</td><td>${b.pastor}</td><td>${b.members}人</td></tr>`).join('');
}
function add() { alert('功能：新增分堂'); }
</script>
</body>
</html>
