<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探访关怀管理系统 - 独立站 · Visitation Standalone | Church Ministry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei'; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .landing { max-width: 900px; background: white; border-radius: 20px; padding: 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .logo { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 3em; color: #2c3e50; margin-bottom: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.3em; color: #7f8c8d; margin-bottom: 40px; }
        .features { text-align: left; margin: 40px 0; }
        .feature { display: flex; align-items: start; margin-bottom: 20px; }
        .feature-icon { font-size: 32px; margin-right: 15px; }
        .feature-content h3 { color: #667eea; margin-bottom: 5px; font-size: 1.2em; }
        .feature-content p { color: #555; line-height: 1.6; }
        .cta-button { display: inline-block; padding: 20px 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 12px; font-size: 1.3em; font-weight: 600; margin-top: 30px; box-shadow: 0 10px 30px rgba(102,126,234,0.4); transition: all 0.3s; }
        .cta-button:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.5); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 40px 0; }
        .stat { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding: 25px; border-radius: 12px; }
        .stat-num { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .stat-label { color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="landing">
        <div class="logo">🤝</div>
        <h1>探访关怀管理系统</h1>
        <div class="subtitle">专业级教会探访管理解决方案</div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-num">6</div>
                <div class="stat-label">核心模块</div>
            </div>
            <div class="stat">
                <div class="stat-num">18+</div>
                <div class="stat-label">实用功能</div>
            </div>
            <div class="stat">
                <div class="stat-num">100%</div>
                <div class="stat-label">可用性</div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-content">
                    <h3>总览仪表板</h3>
                    <p>实时统计、本周计划、年度目标进度可视化</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-content">
                    <h3>年度战略规划</h3>
                    <p>目标设定、三类探访计划（经常性、危机性、新人性）</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">📅</div>
                <div class="feature-content">
                    <h3>分区分组排程</h3>
                    <p>区域管理、小组管理、智能自动排程、日历可视化</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div class="feature-content">
                    <h3>出动管理系统</h3>
                    <p>计划创建、手机汇报、状态追踪、自动提醒</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">📈</div>
                <div class="feature-content">
                    <h3>数据分析报表</h3>
                    <p>月度/季度/年度报表、Chart.js可视化、趋势分析</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">👥</div>
                <div class="feature-content">
                    <h3>人材培训管理</h3>
                    <p>培训课程、资源库、同工资质追踪</p>
                </div>
            </div>
        </div>
        
        <a href="modules/support/visitation.html" class="cta-button">
            🚀 进入系统
        </a>
        
        <div style="margin-top: 40px; padding-top: 30px; border-top: 2px solid #e0e0e0; color: #7f8c8d; font-size: 0.9em;">
            <p>💾 数据自动保存 · 📱 移动端友好 · ⚡ 即时响应 · 🎯 专业实用</p>
        </div>
    </div>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="css/cm_desk.css" />
<script src="js/cm_desk_registry.js"></script>
<script src="js/cm_desk_kit.js"></script>
</body>
</html>
