<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬拜花园 · 服事旅程导览 | Worship Park</title>
    <link rel="stylesheet" href="../../bible_study/css/landing_dashboard_standard.css">

    <script src="../../../js/page_capability_badge.js" data-status="live" data-warm-banner=""></script>
    <script src="../../../js/shell_nav.js"></script>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-LANDING" data-b100-ae-zone="a">
    <header class="worship-park-header">
        <h1>🌳 敬拜花园</h1>
        <p class="park-tagline">
            百花齐放，各按恩赐回应上帝。我们不是冷冰冰的打卡系统——<br>
            而是一座可以散步、赏花、把花带回家栽种的服事公园。请选一位导游，走上适合你的小径。
        </p>
    </header>

    <div class="worship-park-body">
        <p class="crumbs" style="font-size:11px;margin:12px 0;">
            <a href="../modules/worship/worship-integrated.html?view=leader">敬拜部长总控</a> ·
            <a href="../modules/worship/worship-together.html">会众筑坛</a> ·
            <a href="../guide_crm_journey_hub.html?tab=journey&role=staff">CRM 服事旅程</a> ·
            <a href="../../help/site-navigation-guide.html">全站导览</a>
        </p>

        <div class="guide-picker">
            <h2>🧭 选一位导游（你会看见不同的花）</h2>
            <div class="guide-chips" id="guide-chips"></div>
            <div class="guide-speech" id="guide-speech"></div>
        </div>

        <div class="story-rail" id="story-rail" aria-label="服事故事线"></div>

        <div id="park-map-host"></div>

        <h2 style="font-size:15px;color:#4c1d95;margin:16px 0 8px;">🛤️ 六条花园小径（路线 · 不是行政抽屉）</h2>
        <p style="font-size:11px;color:#64748b;margin:0 0 8px;">
            「赏花」= 认识与预备；「买花」= 把本周服事带回家（乐谱、排练、排班）。数据存本机，以会友主档对齐。
        </p>
        <div class="route-grid" id="route-grid"></div>

        <details style="margin-top:20px;padding:12px;background:#f8fafc;border-radius:10px;font-size:11px;">
            <summary style="cursor:pointer;font-weight:600;color:#64748b;">📂 园丁索引（进阶工具清单）</summary>
            <div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">
                <a href="../modules/worship/pulpit-ministry.html">讲坛事奉</a>
                <a href="../modules/worship/worship-management.html">崇拜礼仪</a>
                <a href="../modules/worship/choir-team.html">诗班团队</a>
                <a href="../modules/worship/song-library.html">诗歌库</a>
                <a href="../modules/media/audio-team.html">音响团队</a>
                <a href="../modules/worship/attendance-management.html">崇拜出席</a>
                <a href="../modules/support/visitation_index.html">探访工作桌</a>
            </div>
        </details>
    </div>

    <script src="../js/ae_worship_journey_registry.js"></script>
    <script src="../js/ae_worship_landing_tour.js"></script>
</body>
</html>
