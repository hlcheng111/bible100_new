    </header>

    <div class="worship-park-body">
        <p class="crumbs" style="font-size:11px;margin:12px 0;">
            <a href="../modules/worship/worship-sunday-desk.html" style="font-weight:700;color:#5b21b6;">主日一桌（主桌）</a> ·
            <a href="../modules/worship/worship-integrated.html?view=leader">敬拜部长总控（进阶）</a> ·

        </p>
        <p style="margin:0 0 12px;">
            <a href="../modules/worship/worship-sunday-desk.html" class="btn" style="display:inline-block;padding:10px 16px;background:#5b21b6;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;">进入主日一桌 →</a>
            <span style="font-size:11px;color:#64748b;margin-left:8px;">点名／数字／本周服事（日常主路）</span>

        <div class="guide-picker">

            <div class="guide-chips" id="guide-chips"></div>
            <div class="guide-speech" id="guide-speech"></div>
        </div>

        <div class="story-rail" id="story-rail" aria-label="服事故事线"></div>

        <div id="park-map-host"></div>

        <h2 style="font-size:15px;color:#4c1d95;margin:16px 0 8px;" data-i18n="cm.land.worship.routes">🛤️ 六条花园小径（路线 · 不是行政抽屉）</h2>
        <p style="font-size:11px;color:#64748b;margin:0 0 8px;" data-i18n="cm.forms.note">
            「赏花」= 认识与预备；「买花」= 把本周服事带回家（乐谱、排练、排班）。数据存本机，以会友主档对齐。
        </p>
        <div class="route-grid" id="route-grid"></div>

        <details style="margin-top:20px;padding:12px;background:#f8fafc;border-radius:10px;font-size:11px;">
