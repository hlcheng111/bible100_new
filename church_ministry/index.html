  <title>教會事工 · Church Ministry</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; background: #f6f7fb; font-size: 12px; }
    .cm-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      min-height: 48px; background: #4338ca; color: #fff;
      border-bottom: 3px solid #818cf8;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 6px 10px;
    }
    body.b100-hub-embedded .cm-topbar { display: none; }
    body.b100-hub-embedded .cm-main { margin-top: 0; height: 100vh; }
    .cm-brand { font-weight: 700; font-size: 13px; margin-right: 8px; }
    .cm-brand small { display: block; font-size: 9px; font-weight: 400; opacity: 0.9; }
    .cm-topbar a, .cm-topbar button {
      display: inline-block; padding: 5px 10px; border-radius: 6px;
      font-size: 10px; text-decoration: none; color: #fff;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer; font-family: inherit;
    }
    .cm-topbar a:hover, .cm-topbar button:hover { background: rgba(255,255,255,0.32); }
    .cm-main {
      display: flex; margin-top: 52px; height: calc(100vh - 52px);
    }
    #sidebarFrame {
      width: 260px; min-width: 220px; max-width: 32vw;
      border: none; border-right: 1px solid #c7d2fe; background: #fff;
    }
    .cm-content-wrap { flex: 1; min-width: 0; background: #f6f7fb; }
    #contentFrame { width: 100%; height: 100%; border: none; display: block; }
    @media (max-width: 768px) {
      .cm-main { flex-direction: column; height: auto; min-height: calc(100vh - 52px); }
      #sidebarFrame { width: 100%; max-width: none; height: 220px; }
      .cm-content-wrap { min-height: 60vh; }
    }
  </style>
  <script src="../js/shell_nav.js"></script>
  <script src="js/cm_shell_paths.js"></script>
  <script src="js/cm_hub_detect.js"></script>
</head>

  </header>

  <div class="cm-main">
    <iframe id="sidebarFrame" name="sidebarFrame" title="教會事工側欄"

    <div class="cm-content-wrap">
