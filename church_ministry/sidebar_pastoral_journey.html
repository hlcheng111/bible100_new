<body>

  <script>
    (function () {
      var nav = document.getElementById("pastoral-journey-nav");
      var R = window.AePastoralJourneyRegistry;
      if (!nav || !R) return;
      var pin = document.createElement("p");
      pin.className = "pj-group";
      pin.innerHTML = "<h3>🛤️ 牧养路</h3>";
      nav.appendChild(pin);
      R.ROUTES.forEach(function (route) {
        var g = document.createElement("div");
        g.className = "pj-group";
        g.innerHTML = "<h3>" + route.emoji + " " + route.title + "</h3>";
        var start = document.createElement("a");
        start.setAttribute("data-b100-nav", "content"); start.href = route.start + (route.start.indexOf("?") >= 0 ? "&" : "?") + "crm_from=b_pastoral";
        start.textContent = "→ " + route.title;
        g.appendChild(start);
        nav.appendChild(g);
      });
    })();
  </script>
</body>
