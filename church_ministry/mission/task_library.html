<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使命任務總覽</title>
  <link rel="stylesheet" href="css/mission_ux.css">
  <script src="../../js/shell_nav.js"></script>
  <script src="js/mission_hub_nav.js"></script>
  <script src="js/mission_tasks_embed.js"></script>
</head>
<body class="mis-page" data-b100-module="church_ministry" data-b100-pattern="P-TASK-LIBRARY">
  <div class="mis-wrap mis-wrap--wide">
    <p class="mis-back"><a href="#" onclick="return MissionHubNav.missionOpenContent(event,'mission_hub.html');">← 使命中心</a></p>
    <header class="mis-header">
      <h1>📚 使命任務總覽</h1>
      <p>20 項 Pilot · 城市 + 行業 · 可篩選</p>
    </header>
    <div class="mis-filter-bar">
      <label><input type="radio" name="mis-filter" value="all" checked> 全部</label>
      <label><input type="radio" name="mis-filter" value="city"> 城市</label>
      <label><input type="radio" name="mis-filter" value="industry"> 行業</label>
    </div>
    <div id="mis-task-list" class="mis-task-grid"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var list = document.getElementById("mis-task-list");
      function render() {
        var f = document.querySelector('input[name="mis-filter"]:checked');
        var mode = f ? f.value : "all";
        MissionHubNav.renderTaskList(mode, list);
      }
      document.querySelectorAll('input[name="mis-filter"]').forEach(function (r) {
        r.addEventListener("change", render);
      });
      render();
    });
  </script>
</body>
</html>
