<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會診斷中心</title>
  <link rel="stylesheet" href="css/mission_ux.css">
  <script src="../../js/shell_nav.js"></script>
  <script src="../../church_planning/js/planning_tool_registry.js"></script>

</head>
<body class="mis-page" data-b100-module="church_ministry" data-b100-pattern="P-DIAGNOSTIC-HUB">
  <div class="mis-wrap mis-wrap--wide">
    <p class="mis-back"><a href="#" onclick="return MissionHubNav.missionOpenContent(event,'mission_hub.html');">← 使命中心</a></p>
    <header class="mis-header">
      <h1>📊 教會診斷中心</h1>
      <p>左：工具模組 · 中：問卷/報告 · 右：最新評估摘要</p>
    </header>
    <div class="mis-guide">
      <h4>💡 導遊</h4>
      <p><strong>👥 適合誰：</strong>牧長、長執 · <strong>📅 何時用：</strong>退修會前、年度檢視</p>
      <p><strong>🎯 填完去哪：</strong> NCD→SWOT→PDCA 鏈 · <a href="#" onclick="return typeof bible100ShellNav==='function'&&bible100ShellNav(event,{sidebarUrl:'church_planning/sidebar_plan_v5_preview.html',contentUrl:'church_planning/assessment-os-hub.html'});">完整診斷超市</a></p>
    </div>
    <div class="mis-layout-3">
      <aside class="mis-panel" id="mis-diag-tool-list"></aside>
      <main class="mis-panel">
        <h2>問卷 / 報告</h2>
        <iframe id="mis-diag-frame" title="診斷工具" src="../../church_planning/assessment-os-hub.html"></iframe>
      </main>
      <aside class="mis-panel">
        <h2>評估摘要</h2>
        <div id="mis-diag-summary"></div>
        <p style="margin-top:12px;">
          <a href="#" class="mis-btn mis-btn--secondary" onclick="return typeof bible100ShellNav==='function'&&bible100ShellNav(event,{sidebarUrl:'church_planning/sidebar_plan_v5_preview.html',contentUrl:'church_planning/index_plan.html'});">長執決策大腦</a>
        </p>
      </aside>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () { MissionHubNav.initDiagnosticHub(); });
  </script>
</body>
</html>
