<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>門徒定位中心</title>
  <link rel="stylesheet" href="css/mission_ux.css">
  <script src="../../js/shell_nav.js"></script>
  <script src="../../js/central_member_db.js"></script>
  <script src="../../js/smart_ministry_canonical_store.js"></script>
  <script src="../../church_planning/js/assessment_run_store.js"></script>
  <script src="js/mission_hub_nav.js"></script>
  <script src="js/mission_tasks_embed.js"></script>
</head>
<body class="mis-page" data-b100-module="church_ministry" data-b100-pattern="P-DISCIPLE-CENTER">
  <div class="mis-wrap mis-wrap--wide">
    <p class="mis-back"><a href="#" onclick="return MissionHubNav.missionOpenContent(event,'mission_hub.html');">← 使命中心</a></p>
    <header class="mis-header">
      <h1>🧭 門徒定位中心</h1>
      <p>五步流程：選人 → 問卷 → 深評（可選）→ 報告 → 推薦任務</p>
    </header>

    <div class="mis-layout-3">
      <aside class="mis-panel">
        <h2>進度</h2>
        <div class="mis-step is-active">1 · 選擇會友</div>
        <div class="mis-step">2 · 快評問卷（13 題）</div>
        <div class="mis-step">3 · SHAPE（可選）</div>
        <div class="mis-step">4 · 定位摘要</div>
        <div class="mis-step">5 · 任務推薦</div>
      </aside>

      <main class="mis-panel">
        <h2>Step 1–2 · 我是誰 · 快評</h2>
        <p><label for="mis-talent-select"><strong>選擇會友</strong></label></p>
        <select id="mis-talent-select" style="width:100%;padding:8px;margin-bottom:12px;"></select>
        <p>
          <a href="#" class="mis-btn mis-btn--secondary" id="mis-link-register" onclick="return typeof bible100ShellNav==='function'&&bible100ShellNav(event,{contentUrl:'smart_ministry/registration.html'});">新會友註冊</a>
          <a href="#" class="mis-btn mis-btn--primary" id="mis-link-questionnaire">開始 13 題問卷</a>
        </p>

        <h2 style="margin-top:20px;">Step 3 · 深評（可選）</h2>
        <p>
          <a href="#" class="mis-btn mis-btn--secondary" id="mis-link-shape" onclick="return typeof bible100ShellNav==='function'&&bible100ShellNav(event,{sidebarUrl:'church_planning/sidebar_plan_v5_preview.html',contentUrl:'church_planning/shape-gifts-assessment.html'});">SHAPE 恩賜評估</a>
          <a href="#" class="mis-btn mis-btn--secondary" onclick="return typeof bible100ShellNav==='function'&&bible100ShellNav(event,{sidebarUrl:'church_planning/sidebar_plan_v5_preview.html',contentUrl:'church_planning/ministry-position-matchmaker.html'});">事奉媒合中心</a>
        </p>

        <h2 style="margin-top:20px;">Step 5 · 推薦行動</h2>
        <p>
          <a href="#" class="mis-btn mis-btn--green" onclick="return MissionHubNav.missionOpenContent(event,'city_missions.html');">城市任務 Top 列表</a>
          <a href="#" class="mis-btn mis-btn--green" onclick="return MissionHubNav.missionOpenContent(event,'industry_missions.html');">行業使命 Top 列表</a>
        </p>
      </main>

      <aside class="mis-panel">
        <h2>摘要（非 LLM）</h2>
        <div id="mis-disciple-summary"></div>
      </aside>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      MissionHubNav.initDiscipleCenter();
      var qBtn = document.getElementById("mis-link-questionnaire");
      if (qBtn) {
        qBtn.addEventListener("click", function (e) {
          e.preventDefault();
          var tid = MissionHubNav.getActiveTalentId();
          var url = "smart_ministry/questionnaire_system.html" + (tid ? "?talent_id=" + encodeURIComponent(tid) : "");
          if (typeof bible100ShellNav === "function") bible100ShellNav(e, { contentUrl: url });
          else location.href = "../../" + url;
          return false;
        });
      }
    });
  </script>
</body>
</html>
