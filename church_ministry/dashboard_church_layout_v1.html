<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🟩 教會行政 · 今日工作區</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #f0f4f8;
      font-size: 13px;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cm-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: linear-gradient(90deg, #059669, #0d9488);
      color: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    }
    .cm-bar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }
    .cm-bar p {
      margin: 0;
      font-size: 11px;
      opacity: 0.92;
    }
    .cm-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.15);
    }
    .cm-bar a:hover { background: rgba(255, 255, 255, 0.28); }
    .cm-main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }
    #sidebarFrame {
      width: 260px;
      min-width: 220px;
      max-width: 34vw;
      border: none;
      border-right: 1px solid #cbd5e1;
      background: #fff;
    }
    #contentFrame {
      flex: 1 1 auto;
      width: 100%;
      border: none;
      background: #f5f6fb;
    }
    @media (max-width: 768px) {
      .cm-main { flex-direction: column; }
      #sidebarFrame {
        width: 100%;
        max-width: none;
        height: 160px;
        border-right: none;
        border-bottom: 1px solid #cbd5e1;
      }
      #contentFrame { min-height: 60vh; }
    }
  </style>
  <script src="../js/shell_nav.js"></script>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-CM-ADMIN-SHELL">
  <header class="cm-bar">
    <div>
      <h1>🟩 教會行政</h1>
      <p>左欄選功能 · 右欄做事（今日｜地圖｜戰情）</p>
    </div>
    <a href="_landing/gateway.html">🏠 選路</a>
    <a href="../church_planning/index_plan.html">🧭 規劃</a>
    <a href="../index_v5.html" target="_top">📖 回總站</a>
  </header>
  <div class="cm-main">
    <iframe id="sidebarFrame" name="sidebarFrame" title="教會事工側欄"
      src="sidebar_church_layout_v1.html?focus=f"></iframe>
    <iframe id="contentFrame" name="contentFrame" title="行政工作區"
      src="dashboard_church_layout_v1_content.html"></iframe>
  </div>
  <script>
    (function () {
      window.addEventListener("message", function (ev) {
        var d = ev.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "navigate" && d.url) {
          var cf = document.getElementById("contentFrame");
          if (cf) cf.src = d.url;
        }
      });
    })();
  </script>
</body>
</html>
