<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>載入 CRM 成熟度種子</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 640px; margin: 2rem auto; padding: 1rem; font-size: 13px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.2rem; }
    button { padding: 10px 16px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    pre { background: #f8fafc; padding: 10px; font-size: 11px; overflow: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📈 CRM 成熟度種子（≥90%）</h1>
    <p>一次寫入：會友階段、牧養事件、志工崗位、Smart Ministry 評估與配對、探訪任務。僅供 demo，正式環境會略過。</p>
    <button type="button" id="btnRun">載入成熟度種子</button>
    <pre id="out">待命…</pre>
    <p><a href="dashboard.html">返回儀表板</a> · <a href="admin/cloud_login.html">登入（若已啟用 REQUIRE_AUTH）</a></p>
  </div>
  <script src="../js/central_member_db.js"></script>
  <script src="../js/church_crm_constants.js"></script>
  <script src="../js/smart_ministry_canonical_store.js"></script>
  <script src="../js/church_crm_maturity_seed.js"></script>
  <script src="../js/church_data_bridge.js"></script>
  <script>
    document.getElementById('btnRun').onclick = function () {
      var out = document.getElementById('out');
      try {
        var r = ChurchDataBridge.applyCrmMaturitySeed();
        var m = ChurchDataBridge.getCrmMaturitySummary();
        out.textContent = JSON.stringify({ seed: r, maturity: m }, null, 2);
      } catch (e) {
        out.textContent = String(e.message || e);
      }
    };
  </script>
</body>
</html>
