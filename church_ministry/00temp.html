<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-01 牧養核心領航</title>
    <style>
        :root {
            --m-blue: #0f172a; /* 深邃藍 */
            --l-blue: #3b82f6; /* 策略藍 */
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body { font-family: sans-serif; background: var(--bg); margin: 0; color: #334155; }
        
        /* 頂導航：解決迷路問題 */
        .top-nav { background: var(--m-blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-weight: bold; font-size: 1.2rem; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        /* 高密度便當盒佈局 */
        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .card { 
            background: var(--glass); border-radius: 20px; padding: 25px; 
            border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* 區域分佈圖示意 */
        .chart-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--l-blue) 0% 60%, #cbd5e1 60% 100%);
            margin: 20px auto; position: relative; display: flex; align-items: center; justify-content: center;
        }
        .chart-inner { width: 80px; height: 80px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* 行動指示 */
        .action-item { background: #eff6ff; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--l-blue); font-size: 14px; }
        .tag-high { color: #ef4444; font-weight: bold; }

        @media (max-width: 600px) { .bento-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-brand">⛪ 教會數位雙生 - 牧養主控台</div>
        <div style="font-size: 14px;">2026-04-30 同步成功</div>
    </header>

    <main class="container">
        <h2 style="margin-bottom: 25px; color: var(--m-blue);">P-01 牧養核心概覽</h2>
        
        <div class="bento-grid">
            <!-- 模塊 1：區域發展洞察 (數據來自地址表) -->
            <div class="card">
                <h3 style="margin-top:0; font-size: 16px; color: var(--l-blue);">📍 區域發展分佈</h3>
                <div class="chart-circle">
                    <div class="chart-inner">60%</div>
                </div>
                <div style="font-size: 14px; line-height: 1.8;">
                    • <b>沙田區</b>：245 人 (↑12%) <br>
                    • <b>九龍城</b>：112 人 (↓2%) <br>
                    <span style="color: var(--l-blue); font-weight: bold;">💡 洞察：沙田區增長點在青年層。</span>
                </div>
            </div>

            <!-- 模塊 2：靈命健康度 (數據來自 S-02 調查表) -->
            <div class="card">
                <h3 style="margin-top:0; font-size: 16px; color: var(--l-blue);">🌱 靈命調查動態</h3>
                <div style="margin: 20px 0;">
                    <div style="font-size: 13px; color: #64748b;">問卷完成率：85%</div>
                    <div style="width: 100%; background: #e2e8f0; height: 10px; border-radius: 5px; margin: 8px 0;">
                        <div style="width: 85%; background: var(--l-blue); height: 10px; border-radius: 5px;"></div>
                    </div>
                </div>
                <div class="action-item">
                    <b>自省反饋：</b> 45% 會友表示希望能加強「聖經深度研經」。
                </div>
            </div>

            <!-- 模塊 3：數位同工建議 (行動指向) -->
            <div class="card" style="background: #fff;">
                <h3 style="margin-top:0; font-size: 16px; color: #ef4444;">🤖 行動決策中心</h3>
                <div class="action-item">
                    <span class="tag-high">! 流失預警：</span> 陳小明等 3 人已連續 4 週缺席，建議分派給沙田小組長。
                </div>
                <div class="action-item">
                    <b>配對提示：</b> 發現 5 位新朋友具備「音樂」恩賜，目前無事工。
                </div>
                <button style="width: 100%; padding: 10px; background: var(--m-blue); color: white; border: none; border-radius: 8px; cursor: pointer;">進入詳細管理頁</button>
            </div>
        </div>
    </main>

</body>
</html>
