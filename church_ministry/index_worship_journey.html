<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>敬拜服事旅程 · A 區 Hub | Church Ministry</title>
  <link rel="stylesheet" href="css/education_integrated_shell.css" />
  <style>
    body { margin: 0; font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f5f3ff; color: #312e81; font-size: 12px; }
    .wj-wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
    .wj-hero { background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .wj-hero h1 { margin: 0 0 6px; font-size: 18px; }
    .wj-hero p { margin: 0; font-size: 11px; line-height: 1.55; opacity: 0.95; }
    .wj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .wj-card { background: #fff; border: 1px solid #c4b5fd; border-radius: 10px; padding: 12px; }
    .wj-card h2 { margin: 0 0 6px; font-size: 13px; color: #5b21b6; }
    .wj-card p { margin: 0 0 8px; font-size: 10px; color: #64748b; line-height: 1.45; }
    .wj-card a.btn { display: inline-block; padding: 6px 10px; border-radius: 6px; background: #7c3aed; color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; }
    .wj-card a.btn.secondary { background: #fff; color: #5b21b6; border: 1px solid #c4b5fd; }
    .wj-note { font-size: 10px; color: #64748b; border-top: 1px dashed #ddd6fe; padding-top: 10px; }
  </style>
  <script src="../js/shell_nav.js"></script>
  <script src="js/ae_worship_journey_registry.js"></script>
</head>
<body data-b100-module="church_ministry" data-b100-pattern="P-AE-JOURNEY-HUB" data-b100-ae-zone="a">
  <div class="wj-wrap">
    <div class="wj-hero">
      <h1>🌳 敬拜服事旅程 · A 區 Hub</h1>
      <p>日常主路徑：<strong>主日一桌</strong>（點名／數字）＋ <strong>敬拜工作台</strong>（部長／同工）。其餘進階頁由左欄「敬拜專用側欄」或下方卡片進入。</p>
    </div>
    <div class="wj-grid">
      <div class="wj-card">
        <h2>☀️ 主日一桌</h2>
        <p>崇拜點名、出席、本週數字 SSOT。</p>
        <a class="btn" href="modules/worship/worship-sunday-desk.html?crm_from=worship_journey">進入主日一桌</a>
      </div>
      <div class="wj-card">
        <h2>🏛️ 敬拜工作台</h2>
        <p>部長策劃、同工今日祭坛、多 Tab 整合殼。</p>
        <a class="btn" href="modules/worship/worship-integrated.html?view=leader&amp;crm_from=worship_journey">部長視圖</a>
        <a class="btn secondary" href="modules/worship/worship-integrated.html?view=volunteer&amp;crm_from=worship_journey" style="margin-top:6px;">同工視圖</a>
      </div>
      <div class="wj-card">
        <h2>🧭 花園導覽</h2>
        <p>選導遊、六條服事小徑（認路用）。</p>
        <a class="btn secondary" href="_landing/worship.html?crm_from=worship_journey">敬拜花園</a>
      </div>
      <div class="wj-card">
        <h2>💬 缺席→關懷</h2>
        <p>主日缺席可交接 B 區探訪（手動確認）。</p>
        <a class="btn secondary" href="modules/support/visitation_index.html?crm_from=worship_a">探訪工作桌</a>
      </div>
    </div>
    <div id="wj-routes" class="wj-grid"></div>
    <p class="wj-note">左欄為「敬拜專用側欄」時，右欄可切換上列頁面；統計／出席舊頁已合併至主日一桌。</p>
  </div>
  <script>
    (function () {
      var host = document.getElementById("wj-routes");
      var R = window.AeWorshipJourneyRegistry;
      if (!host || !R) return;
      R.ROUTES.slice(0, 3).forEach(function (route) {
        var card = document.createElement("div");
        card.className = "wj-card";
        card.innerHTML =
          "<h2>" + route.emoji + " " + route.title + "</h2>" +
          "<p>" + (route.blurb || "") + "</p>" +
          '<a class="btn secondary" href="' + route.start + '?crm_from=worship_journey">從此徑開始</a>';
        host.appendChild(card);
      });
    })();
  </script>
</body>
</html>
