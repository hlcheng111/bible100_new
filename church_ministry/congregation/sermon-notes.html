<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>講道筆記 - Church Center</title>
    <base target="_parent">
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color: #333; font-size: 14px; }
        .header { text-align: center; padding: 20px; margin-bottom: 24px; background: linear-gradient(135deg, var(--church-primary, #00cec9) 0%, var(--church-accent, #00b4b0) 100%); color: #fff; border-radius: 12px; }
        .header h1 { margin: 0 0 8px 0; font-size: 1.4rem; }
        .notes-form { max-width: 640px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .outline-block { margin-bottom: 20px; line-height: 1.8; }
        .outline-block .label { font-weight: 600; color: #333; margin-bottom: 6px; }
        .outline-block input.blank { border: none; border-bottom: 2px dashed var(--church-primary, #00cec9); padding: 4px 8px; font-size: 14px; min-width: 120px; }
        .outline-block input.blank:focus { outline: none; border-bottom-style: solid; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; background: var(--church-primary, #00cec9); color: white; }
        .btn:hover { opacity: 0.9; }
        .empty-msg { text-align: center; padding: 40px 20px; color: #666; }
        .empty-msg a { color: var(--church-primary, #00cec9); }
    </style>
    <script>
        (function(){
          try {
            var t = localStorage.getItem('churchCenterTheme');
            if (t) {
              var theme = JSON.parse(t);
              var style = document.createElement('style');
              style.textContent = ':root { --church-primary: ' + (theme.primaryColor || '#00cec9') + '; --church-accent: ' + (theme.accentColor || '#00b4b0') + '; }';
              document.head.appendChild(style);
            }
          } catch(e) {}
        })();
    </script>
</head>
<body>
    <div class="header">
        <h1>📝 講道筆記</h1>
        <p id="sermonTitle">本週講道大綱</p>
    </div>
    <div id="notesContainer"></div>

    <script>
        const TEMPLATE_KEY = 'sermonNotesTemplate';
        const ANSWERS_KEY = 'sermonNotesAnswers';

        function loadTemplate() {
            try {
                return JSON.parse(localStorage.getItem(TEMPLATE_KEY) || 'null');
            } catch (e) { return null; }
        }

        function loadAnswers() {
            try {
                return JSON.parse(localStorage.getItem(ANSWERS_KEY) || '{}');
            } catch (e) { return {}; }
        }

        function saveAnswers(answers) {
            localStorage.setItem(ANSWERS_KEY, JSON.stringify(answers));
        }

        function render() {
            const template = loadTemplate();
            const container = document.getElementById('notesContainer');

            if (!template || !template.outline) {
                container.innerHTML = '<div class="notes-form empty-msg">' +
                    '<p>尚無本週講道筆記模板。</p>' +
                    '<p style="margin-top:12px;">請牧師或同工至 <a href="../modules/worship/sermon-notes-admin.html">講道筆記管理</a> 設定大綱。</p>' +
                    '</div>';
                return;
            }

            document.getElementById('sermonTitle').textContent = template.title || '本週講道大綱';
            if (template.date) document.getElementById('sermonTitle').textContent += ' · ' + template.date;

            const parts = template.outline.split('___');
            const blankCount = parts.length - 1;
            const answers = loadAnswers();
            const today = new Date().toISOString().split('T')[0];
            const answerKey = template.date || template.id || today;

            let html = '<div class="notes-form"><form id="notesForm">';
            parts.forEach((part, i) => {
                html += '<span class="outline-block">' + part.replace(/\n/g, '<br>');
                if (i < parts.length - 1) {
                    const ans = (answers[answerKey] && answers[answerKey][i]) || '';
                    html += '<input type="text" class="blank" data-idx="' + i + '" value="' + (ans || '').replace(/"/g, '&quot;') + '" placeholder="填空">';
                }
                html += '</span>';
            });
            html += '<div style="margin-top:24px;"><button type="button" class="btn" onclick="saveNotes()">儲存筆記</button></div></form></div>';
            container.innerHTML = html;
        }

        function saveNotes() {
            const template = loadTemplate();
            if (!template) return;
            const answerKey = template.date || template.id || new Date().toISOString().split('T')[0];
            const inputs = document.querySelectorAll('#notesForm input.blank');
            const answers = loadAnswers();
            answers[answerKey] = {};
            inputs.forEach(inp => {
                answers[answerKey][parseInt(inp.dataset.idx)] = inp.value;
            });
            saveAnswers(answers);
            alert('筆記已儲存！');
        }

        render();
    </script>
</body>
</html>
