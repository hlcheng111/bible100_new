  <script type="text/javascript">
    /* focus 折疊由 js/cm_sidebar_zone_render.js 統一處理（勿在此重複高亮 A–G） */
    (function bootChromeI18n() {
      var I = window.B100ChromeI18n;
      var pack = window.CmChromeI18nPack;
      if (!I || !pack) return;
      window.B100ChromeI18nOnChange = function (loc) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'b100-locale', locale: loc }, '*');
          }
        } catch (e) {}
      };
      I.boot(pack);
    })();
    (function() {
      var el = document.getElementById('sidebar-member-count');
      if (el) {
        var n = 0;
        try {
          var ms = localStorage.getItem('memberSystemData');
          if (ms) { var m = JSON.parse(ms); n = (m.members || []).length; }
          if (n === 0) {
            var cm = localStorage.getItem('churchMasterDatabase');
            if (cm) { var c = JSON.parse(cm); n = (c.members || []).length; }
          }
        } catch(e) {}
        el.textContent = n > 0 ? 'SPAC · ' + n + ' 人' : 'SPAC · 待載入';
      }
      console.log('✅ Church Ministry Sidebar 已載入（六類精簡版 + chrome i18n）');
    })();
    function cmResolve(url) {
      if (window.CmShellPaths && window.CmShellPaths.resolveShellUrl) {
        return window.CmShellPaths.resolveShellUrl(url);
      }
      return url;
    }
    function cmBust(url) {
      if (window.CmShellPaths && window.CmShellPaths.bust) return window.CmShellPaths.bust(url);
      return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
    }
    /* B 區：focus=b 右欄預設 pastoral-integrated（對標 C 區 education-integrated）。 */
    (function loadBZoneContentPreferRightPane() {
      var focus = '';
      try { focus = (new URLSearchParams(location.search).get('focus') || '').toLowerCase(); } catch (e) {}
      if (focus !== 'b') return;
      var bContent =
        'church_ministry/modules/fellowship/pastoral-integrated.html?crm_from=sidebar&role=leader#tab-groups';
      try {
        if (typeof bible100ShellNav === 'function') {
          bible100ShellNav(null, { contentUrl: bContent });
          return;
        }
        if (window.parent && window.parent !== window && window.parent.document) {
          var cf = window.parent.document.getElementById('contentFrame');
          var cfLocal = cmResolve(bContent);
          if (cf && cf.src.indexOf('pastoral-integrated') < 0) {
            cf.src = cmBust(cfLocal);
          }
        }
      } catch (eB) {}
    })();
    (function loadCZoneContentPreferRightPane() {
      var focus = '';
      try { focus = (new URLSearchParams(location.search).get('focus') || '').toLowerCase(); } catch (e) {}
      if (focus !== 'c') return;
      var eduContent =
        'church_ministry/modules/education/education-integrated.html?crm_from=sidebar&role=teacher#tab-guide';
      try {
        if (typeof bible100ShellNav === 'function') {
          bible100ShellNav(null, { contentUrl: eduContent });
          return;
        }
        if (window.parent && window.parent !== window && window.parent.document) {
          var cf = window.parent.document.getElementById('contentFrame');
          var cfLocal = cmResolve(eduContent);
          if (cf && cf.src.indexOf('education-integrated') < 0) {
            cf.src = cmBust(cfLocal);
          }
        }
      } catch (eC) {}
    })();
    (function loadGZoneAdminLanding() {
      var focus = '';
      try { focus = (new URLSearchParams(location.search).get('focus') || '').toLowerCase(); } catch (e) {}
      if (focus !== 'g') return;
      var gContent = 'church_ministry/modules/admin/admin-integrated.html?crm_from=sidebar_g#tab-dashboard';
      try {
        if (typeof bible100ShellNav === 'function') {
          bible100ShellNav(null, { contentUrl: gContent });
          return;
        }
        if (window.parent && window.parent !== window && window.parent.document) {
          var cf = window.parent.document.getElementById('contentFrame');
          if (cf && cf.src.indexOf('admin-integrated') < 0) {
            cf.src = cmBust(cmResolve(gContent));
          }
        }
      } catch (eG) {}
    })();
    (function autoFocusIfParentOnEducation() {
      var focus = '';
      try { focus = (new URLSearchParams(location.search).get('focus') || '').toLowerCase(); } catch (e) {}
      if (focus) return;
      try {
        var p = window.parent;
        if (!p || p === window || !p.document) return;
        var cf = p.document.getElementById('contentFrame');
        if (!cf) return;
        var src = cf.getAttribute('src') || '';
        try {
          if (cf.contentWindow && cf.contentWindow.location && cf.contentWindow.location.href.indexOf('about:') < 0) {
            src = cf.contentWindow.location.href;
          }
        } catch (eCf) {}
        if (src.indexOf('education-integrated') < 0) return;
        var next = 'sidebar_church_layout_v1.html?focus=c&v=' + Date.now();
        location.replace(next);
      } catch (eAuto) {}
    })();
  </script>
