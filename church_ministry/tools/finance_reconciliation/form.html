<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奉獻與財務對帳 · 新增</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/church_auth.js"></script>
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.cm-tool-hero { background: linear-gradient(135deg, #0f766e 0%, #059669 100%); }</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar"><a class="cm-back-bar__link" href="index.html">← 財務對帳</a></nav>
  <header class="cm-tool-hero">
    <h1>➕ 新增／更新奉獻紀錄</h1>
    <p>HITL · 不自動開收據 · 不會自動通知 · 不處理線上付款</p>
  </header>
  <nav class="cm-tool-nav" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <form id="financeForm" class="cm-card">
      <input type="hidden" id="fieldId" value="">
      <label class="cm-field">會友 member_id <select id="fieldMemberId" required></select></label>
      <label class="cm-field">日期 <input type="date" id="fieldDate" required></label>
      <label class="cm-field">金額 <input type="number" id="fieldAmount" min="0" step="0.01" required></label>
      <label class="cm-field">幣別 <input type="text" id="fieldCurrency" value="TWD"></label>
      <label class="cm-field">基金 <input type="text" id="fieldFund" value="一般奉獻"></label>
      <label class="cm-field">方式
        <select id="fieldMethod">
          <option value="cash">cash</option>
          <option value="bank_transfer">bank_transfer</option>
          <option value="cheque">cheque</option>
          <option value="online">online（僅紀錄，不處理付款）</option>
          <option value="other">other</option>
        </select>
      </label>
      <label class="cm-field">狀態
        <select id="fieldStatus">
          <option value="draft">draft</option>
          <option value="pending" selected>pending</option>
          <option value="reconciled">reconciled</option>
          <option value="exception">exception</option>
        </select>
      </label>
      <label class="cm-field">收據狀態
        <select id="fieldReceiptStatus">
          <option value="not_needed">not_needed</option>
          <option value="pending" selected>pending</option>
          <option value="copied">copied</option>
          <option value="issued">issued（人工標記）</option>
        </select>
      </label>
      <label class="cm-field">備註（財務敏感）
        <textarea id="fieldNote" rows="2" placeholder="僅本機；清單預設不顯示"></textarea>
      </label>
      <label class="cm-field" style="display:flex;align-items:center;gap:8px;max-width:none;">
        <input type="checkbox" id="humanConfirm" required> 我已核對金額與會友，允許寫入（HITL）
      </label>
      <button type="submit" class="cm-btn cm-btn-primary">💾 儲存紀錄</button>
      <div id="trustSaveNotice"></div>
      <p id="formStatus" class="cm-muted" style="margin-top:10px;"></p>
      <div id="snippetBox" class="cm-snippet" style="display:none;">
        <strong>收據／跟進複製稿（copy_only）：</strong>
        <p id="snippetText" style="margin:6px 0;"></p>
        <button type="button" class="cm-btn cm-btn-success" id="btnCopy">📋 複製</button>
      </div>
    </form>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = FinanceReconciliationTool.renderToolNav('form');
    FinanceReconciliationTool.renderTrustBadge('dataTrustMount', { write_behavior: 'manual_save', notify_behavior: 'copy_only', privacy_level: 'finance_sensitive' });
    if (window.DataTrustBadge) {
      DataTrustBadge.renderActionTrustNotice({ mount: 'trustSaveNotice', write_behavior: 'manual_save', notify_behavior: 'copy_only', requires_human_confirmation: true, privacy_level: 'finance_sensitive' });
    }
    document.getElementById('fieldDate').value = FinanceReconciliationTool.todayYmd();
    FinanceReconciliationTool.fillMemberSelect(document.getElementById('fieldMemberId'));
    document.getElementById('financeForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!document.getElementById('humanConfirm').checked) return;
      var b = FinanceReconciliationTool.bridge();
      if (!b) return;
      try {
        var res = b.saveFinanceReconciliationRecord({
          id: document.getElementById('fieldId').value || undefined,
          member_id: document.getElementById('fieldMemberId').value,
          date: document.getElementById('fieldDate').value,
          amount: document.getElementById('fieldAmount').value,
          currency: document.getElementById('fieldCurrency').value,
          fund: document.getElementById('fieldFund').value,
          method: document.getElementById('fieldMethod').value,
          status: document.getElementById('fieldStatus').value,
          receipt_status: document.getElementById('fieldReceiptStatus').value,
          note: document.getElementById('fieldNote').value,
          source: 'finance_reconciliation_tool'
        });
        document.getElementById('formStatus').textContent = '已儲存 #' + res.record.id;
        document.getElementById('snippetText').textContent = res.receipt_snippet || '';
        document.getElementById('snippetBox').style.display = 'block';
        if (res.record.id) document.getElementById('fieldId').value = res.record.id;
        FinanceReconciliationTool.notifySync();
      } catch (e) {
        document.getElementById('formStatus').textContent = e.message || String(e);
      }
    });
    document.getElementById('btnCopy').addEventListener('click', function () {
      FinanceReconciliationTool.copySnippet(document.getElementById('snippetText').textContent);
    });
    function applyFinancePrefill(payload) {
      var p = payload || {};
      if (p.member_id) document.getElementById('fieldMemberId').value = String(p.member_id);
      if (p.date) document.getElementById('fieldDate').value = String(p.date);
      if (p.amount != null && p.amount !== '') document.getElementById('fieldAmount').value = String(p.amount);
      if (p.currency) document.getElementById('fieldCurrency').value = String(p.currency);
      if (p.fund) document.getElementById('fieldFund').value = String(p.fund);
      if (p.method) document.getElementById('fieldMethod').value = String(p.method);
      if (p.note || p.summary) document.getElementById('fieldNote').value = String(p.note || p.summary);
    }
    try {
      var params = new URLSearchParams(window.location.search || '');
      if (params.get('member_id')) {
        applyFinancePrefill({ member_id: params.get('member_id') });
      }
    } catch (eP) {}
    window.addEventListener('message', function (ev) {
      if (!ev.data || ev.data.type !== 'CRM_INTENT_PREFILL') return;
      applyFinancePrefill(ev.data.payload || {});
    });
  </script>
</body>
</html>
