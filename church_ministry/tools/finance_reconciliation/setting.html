<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奉獻與財務對帳 · 設定</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.cm-tool-hero { background: linear-gradient(135deg, #0f766e 0%, #059669 100%); }</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar"><a class="cm-back-bar__link" href="index.html">← 財務對帳</a></nav>
  <header class="cm-tool-hero"><h1>⚙️ 設定</h1></header>
  <nav class="cm-tool-nav" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card">
      <ul style="font-size:11px;line-height:1.7;">
        <li><code>listFinanceReconciliationRecords</code></li>
        <li><code>getFinanceReconciliationSummary</code></li>
        <li><code>saveFinanceReconciliationRecord</code></li>
        <li><code>buildFinanceReceiptSnippet</code></li>
        <li><code>markFinanceRecordReconciled</code></li>
      </ul>
      <p>privacy: <strong>finance_sensitive</strong> · marker: <code>finance_reconciliation_demo_loaded_at</code></p>
      <p id="storageMode" class="cm-muted"></p>
      <p><a href="../../admin/demo_data_governance.html" target="_parent">Demo／正式資料治理</a></p>
      <button type="button" class="cm-btn cm-btn-secondary" id="btnDemo">載入 A3 demo</button>
      <button type="button" class="cm-btn cm-btn-secondary" id="btnClear">清除 A3 demo</button>
      <p id="demoStatus" class="cm-muted"></p>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = FinanceReconciliationTool.renderToolNav('setting');
    FinanceReconciliationTool.renderTrustBadge('dataTrustMount');
    if (DataTrustBadge.getStorageModeLabel) document.getElementById('storageMode').textContent = DataTrustBadge.getStorageModeLabel().zh;
    document.getElementById('btnDemo').onclick = function () { document.getElementById('demoStatus').textContent = JSON.stringify(FinanceReconciliationTool.loadA3DemoData()); };
    document.getElementById('btnClear').onclick = function () { document.getElementById('demoStatus').textContent = JSON.stringify(FinanceReconciliationTool.clearA3DemoData()); };
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
