<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奉獻與財務對帳 · 清單</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.cm-tool-hero { background: linear-gradient(135deg, #0f766e 0%, #059669 100%); }</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar"><a class="cm-back-bar__link" href="index.html">← 財務對帳</a></nav>
  <header class="cm-tool-hero">
    <h1>📋 對帳清單</h1>
    <p>篩選 · 標記 reconciled · 複製收據稿（copy_only）</p>
  </header>
  <nav class="cm-tool-nav" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;">
      <label class="cm-field">狀態 <select id="filterStatus"><option value="">全部</option><option value="pending">pending</option><option value="reconciled">reconciled</option><option value="exception">exception</option></select></label>
      <label class="cm-field">基金 <input type="text" id="filterFund" placeholder="可選"></label>
      <label class="cm-field">方式 <select id="filterMethod"><option value="">全部</option><option value="cash">cash</option><option value="bank_transfer">bank_transfer</option><option value="cheque">cheque</option></select></label>
      <label class="cm-field">member_id <input type="text" id="filterMember"></label>
      <label class="cm-field">日起 <input type="date" id="filterFrom"></label>
      <label class="cm-field">日迄 <input type="date" id="filterTo"></label>
      <button type="button" class="cm-btn cm-btn-secondary" id="btnFilter">套用</button>
    </section>
    <section class="cm-card"><div id="listHost"></div>
      <p class="cm-muted" style="font-size:10px;">copy_only · 不會自動發送收據</p>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = FinanceReconciliationTool.renderToolNav('list');
    FinanceReconciliationTool.renderTrustBadge('dataTrustMount', { notify_behavior: 'copy_only', privacy_level: 'finance_sensitive' });
    function renderList() {
      var b = FinanceReconciliationTool.bridge();
      var host = document.getElementById('listHost');
      if (!b) { host.innerHTML = '<p class="cm-muted">Bridge 未就緒</p>'; return; }
      var f = {};
      var st = document.getElementById('filterStatus').value;
      if (st) f.status = st;
      if (document.getElementById('filterFund').value.trim()) f.fund = document.getElementById('filterFund').value.trim();
      if (document.getElementById('filterMethod').value) f.method = document.getElementById('filterMethod').value;
      if (document.getElementById('filterMember').value.trim()) f.memberId = document.getElementById('filterMember').value.trim();
      if (document.getElementById('filterFrom').value) f.fromDate = document.getElementById('filterFrom').value;
      if (document.getElementById('filterTo').value) f.toDate = document.getElementById('filterTo').value;
      var rows = b.listFinanceReconciliationRecords(f) || [];
      if (!rows.length) { host.innerHTML = '<p class="cm-muted">無符合紀錄</p>'; return; }
      host.innerHTML = rows.map(function (r) {
        var noteBtn = r.note ? '<button type="button" class="cm-btn cm-btn-secondary btn-finance-note" data-id="' + r.id + '">查看財務備註</button>' +
          '<div id="note-panel-' + r.id + '" style="display:none;margin-top:8px;padding:10px;background:#fef3c7;border-left:3px solid #d97706;border-radius:6px;">' +
          '<p style="font-size:10px;color:#92400e;font-weight:600;margin:0 0 6px;">財務敏感資料，請限財務／授權同工查看</p><p class="note-body" style="margin:0;font-size:11px;"></p></div>' : '';
        return '<div class="cm-candidate" style="flex-direction:column;align-items:stretch;">' +
          '<div><strong>' + FinanceReconciliationTool.esc(r.member_name) + '</strong> · ' + FinanceReconciliationTool.esc(r.date) +
          ' · ' + FinanceReconciliationTool.esc(r.fund) + ' · <strong>' + FinanceReconciliationTool.esc(r.amount) + ' ' + FinanceReconciliationTool.esc(r.currency) + '</strong>' +
          ' · ' + FinanceReconciliationTool.esc(r.method) + ' · ' + FinanceReconciliationTool.esc(r.status) + ' · 收據 ' + FinanceReconciliationTool.esc(r.receipt_status) + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">' + noteBtn +
          '<button type="button" class="cm-btn cm-btn-secondary btn-recon" data-id="' + r.id + '">標記 reconciled</button>' +
          '<button type="button" class="cm-btn cm-btn-success btn-snippet" data-id="' + r.id + '">📋 複製收據稿</button>' +
          '<a href="form.html?id=' + encodeURIComponent(r.id) + '" class="cm-btn cm-btn-primary" style="text-decoration:none;">編輯</a></div></div>';
      }).join('');
      host.querySelectorAll('.btn-finance-note').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var row = rows.find(function (x) { return String(x.id) === String(id); });
          var panel = document.getElementById('note-panel-' + id);
          if (!panel) return;
          if (panel.style.display === 'none') {
            panel.querySelector('.note-body').textContent = row && row.note ? row.note : '（無）';
            panel.style.display = 'block';
            btn.textContent = '收起財務備註';
          } else {
            panel.style.display = 'none';
            panel.querySelector('.note-body').textContent = '';
            btn.textContent = '查看財務備註';
          }
        });
      });
      host.querySelectorAll('.btn-recon').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('標記為 reconciled？')) return;
          b.markFinanceRecordReconciled(btn.getAttribute('data-id'), { receipt_status: 'copied' });
          FinanceReconciliationTool.notifySync();
          renderList();
        });
      });
      host.querySelectorAll('.btn-snippet').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = rows.find(function (x) { return String(x.id) === btn.getAttribute('data-id'); });
          if (row) FinanceReconciliationTool.copySnippet(b.buildFinanceReceiptSnippet(row));
        });
      });
    }
    document.getElementById('btnFilter').addEventListener('click', renderList);
    renderList();
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
