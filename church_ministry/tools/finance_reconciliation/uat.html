<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>財務對帳 · UAT</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.uat-ok{color:#047857;font-weight:700}.uat-fail{color:#b91c1c;font-weight:700}</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar"><a href="index.html">← 財務對帳</a></nav>
  <header class="cm-tool-hero" style="background:linear-gradient(135deg,#0f766e,#059669);color:#fff;padding:16px;">
    <h1>✅ A3 驗收</h1>
  </header>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <button type="button" class="cm-btn cm-btn-primary" id="btnRun">▶ 執行檢查</button>
    <button type="button" class="cm-btn cm-btn-secondary" id="btnDemo">載入 demo 後檢查</button>
    <div id="checkList" style="margin-top:12px;font-size:11px;"></div>
    <pre id="log" style="font-size:10px;background:#f8fafc;padding:10px;max-height:200px;overflow:auto;"></pre>
  </main>
  <script>
    FinanceReconciliationTool.renderTrustBadge('dataTrustMount', { privacy_level: 'finance_sensitive', notify_behavior: 'none' });
    function add(name, ok, detail) {
      document.getElementById('checkList').innerHTML += '<p><span class="' + (ok ? 'uat-ok">PASS' : 'uat-fail">FAIL') + '</span> ' + name + (detail ? ' — ' + detail : '') + '</p>';
      document.getElementById('log').textContent += (ok ? 'PASS' : 'FAIL') + ' ' + name + '\n';
    }
    function run() {
      document.getElementById('checkList').innerHTML = '';
      document.getElementById('log').textContent = '';
      var b = FinanceReconciliationTool.bridge();
      add('Bridge', !!b);
      if (!b) return;
      add('listFinanceReconciliationRecords', typeof b.listFinanceReconciliationRecords === 'function');
      add('getFinanceReconciliationSummary', typeof b.getFinanceReconciliationSummary === 'function');
      add('saveFinanceReconciliationRecord', typeof b.saveFinanceReconciliationRecord === 'function');
      var saved = b.saveFinanceReconciliationRecord({ member_id: 99902, member_name: 'UAT', amount: 100, fund: 'uat', status: 'pending', note: 'secret finance note', source: 'finance_reconciliation_tool' });
      add('新增測試紀錄', saved && saved.ok);
      var sn = b.buildFinanceReceiptSnippet(saved.record);
      add('snippet 不含 note', sn.indexOf('secret finance note') < 0);
      add('不會自動發送', sn.indexOf('不會自動發送') >= 0);
      add('list/filter', (b.listFinanceReconciliationRecords({ memberId: 99902 }) || []).length >= 1);
      add('summary', (b.getFinanceReconciliationSummary(30) || {}).total_records >= 0);
      b.markFinanceRecordReconciled(saved.record.id, {});
      add('mark reconciled', (b.listFinanceReconciliationRecords({ memberId: 99902 })[0] || {}).status === 'reconciled');
      fetch('list.html').then(function (r) { return r.text(); }).then(function (html) {
        add('清單不預設 notePreview', html.indexOf('notePreview') < 0);
        add('財務備註按鈕', html.indexOf('查看財務備註') >= 0);
      });
      FinanceReconciliationTool.loadA3DemoData();
      var cleared = FinanceReconciliationTool.clearA3DemoData();
      add('清 demo 保留正式', cleared.ok && (b.listFinanceReconciliationRecords({ memberId: 99902 }) || []).length >= 1);
      b.saveFinanceReconciliationRecord({ id: saved.record.id, status: 'archived' });
    }
    document.getElementById('btnRun').onclick = run;
    document.getElementById('btnDemo').onclick = function () { FinanceReconciliationTool.loadA3DemoData(); run(); };
  </script>
</body>
</html>
