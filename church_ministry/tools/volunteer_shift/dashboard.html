<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義工智能排班 · 儀表板</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/smart_ministry_canonical_store.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 義工智能排班</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>📊 排班儀表板</h1>
    <p>資料來自 ChurchDataBridge · 無資料時請先載入會友或至志工事工建立崗位</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <div class="cm-kpi-grid cm-card" style="border:none;padding:0;background:transparent;">
      <div class="cm-kpi"><span class="cm-muted">全部排班</span><strong id="kpiTotal">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">近 14 天</span><strong id="kpiUpcoming">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">待確認</span><strong id="kpiPending">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">已確認</span><strong id="kpiConfirmed">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">CTV 建議</span><strong id="kpiCtv">—</strong></div>
    </div>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 8px;">近期排班（10 筆）</h2>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead>
            <tr style="text-align:left;border-bottom:2px solid #e2e8f0;">
              <th style="padding:6px;">日期</th>
              <th style="padding:6px;">會友</th>
              <th style="padding:6px;">崗位／班次</th>
              <th style="padding:6px;">狀態</th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </section>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 8px;">待處理 CTV 建議</h2>
      <div id="suggestionsHost"></div>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = VolunteerShiftTool.renderToolNav('dashboard');
    VolunteerShiftTool.renderTrustBadge('dataTrustMount', { position: 'top', write_behavior: 'read_only', notify_behavior: 'none' });
    (function () {
      var b = VolunteerShiftTool.bridge();
      if (!b) return;
      var sum = b.getVolunteerShiftSummary ? b.getVolunteerShiftSummary(14) : {};
      document.getElementById('kpiTotal').textContent = sum.total != null ? sum.total : '—';
      document.getElementById('kpiUpcoming').textContent = sum.upcoming != null ? sum.upcoming : '—';
      document.getElementById('kpiPending').textContent = sum.pending_confirm != null ? sum.pending_confirm : '—';
      document.getElementById('kpiConfirmed').textContent = sum.confirmed != null ? sum.confirmed : '—';
      document.getElementById('kpiCtv').textContent = sum.pending_ctv_suggestions != null ? sum.pending_ctv_suggestions : '—';

      var rows = b.listVolunteerShifts ? b.listVolunteerShifts({ limit: 10 }) : [];
      var tbody = document.getElementById('recentBody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="cm-muted" style="padding:8px;">尚無排班 · <a href="form.html">新增第一筆</a></td></tr>';
      } else {
        tbody.innerHTML = rows.map(function (s) {
          var st = s.confirmed ? '✅ 已確認' : '⏳ 待確認';
          return '<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:6px;">' + VolunteerShiftTool.esc(s.date) +
            '</td><td style="padding:6px;">' + VolunteerShiftTool.esc(s.memberName || s.memberId) +
            '</td><td style="padding:6px;">' + VolunteerShiftTool.esc(s.ministryName || s.shift || '—') +
            '</td><td style="padding:6px;">' + st + '</td></tr>';
        }).join('');
      }

      var sugHost = document.getElementById('suggestionsHost');
      var pending = b.listPendingMinistrySuggestions ? b.listPendingMinistrySuggestions() : [];
      if (!pending.length) {
        sugHost.innerHTML = '<p class="cm-muted">尚無 CTV 建議 · <a href="../../../smart_ministry/talent_ministry_matching.html" target="_parent">執行事奉配對</a></p>';
      } else {
        sugHost.innerHTML = pending.slice(0, 8).map(function (row) {
          return '<div class="cm-candidate"><div><span class="cm-tag">CTV</span> ' +
            VolunteerShiftTool.esc(row.ministry_name || row.ministry_id) + ' · talent ' + VolunteerShiftTool.esc(row.talent_id) +
            '</div><a href="form.html?assignment_id=' + encodeURIComponent(row.id) + '&member_id=' + encodeURIComponent(row.talent_id) + '" class="cm-btn cm-btn-primary" style="text-decoration:none;">去排班</a></div>';
        }).join('');
      }
      VolunteerShiftTool.renderTrustBadge('dataTrustMount', { position: 'top', write_behavior: 'read_only', notify_behavior: 'none' });
    })();
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
