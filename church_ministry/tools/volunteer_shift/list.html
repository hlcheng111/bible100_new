<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義工智能排班 · 清單</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 義工智能排班</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>📋 排班清單</h1>
    <p>篩選 · 標記確認 · 複製邀請文字</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
      <label class="cm-field" style="margin:0;">起日
        <input type="date" id="filterFrom">
      </label>
      <label class="cm-field" style="margin:0;">迄日
        <input type="date" id="filterTo">
      </label>
      <label class="cm-field" style="margin:0;">狀態
        <select id="filterConfirmed">
          <option value="">全部</option>
          <option value="0">待確認</option>
          <option value="1">已確認</option>
        </select>
      </label>
      <label class="cm-field" style="margin:0;">member_id
        <input type="text" id="filterMember" placeholder="可選">
      </label>
      <button type="button" class="cm-btn cm-btn-primary" id="btnFilter">篩選</button>
      <button type="button" class="cm-btn cm-btn-success" id="btnExportShiftCsv" data-w1-report="shifts-csv">⬇ 班表 CSV</button>
      <button type="button" class="cm-btn cm-btn-secondary" id="btnPrintShiftList" data-w1-report="shifts-print">🖨 列印班表</button>
    </section>
    <section class="cm-card">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead>
            <tr style="text-align:left;border-bottom:2px solid #e2e8f0;">
              <th style="padding:6px;">#</th>
              <th style="padding:6px;">日期</th>
              <th style="padding:6px;">會友</th>
              <th style="padding:6px;">崗位</th>
              <th style="padding:6px;">班次</th>
              <th style="padding:6px;">狀態</th>
              <th style="padding:6px;">操作</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </section>
    <div id="listSnippet" class="cm-snippet" style="display:none;">
      <p id="listSnippetText"></p>
      <button type="button" class="cm-btn cm-btn-success" id="btnCopyListSnippet">📋 複製</button>
    </div>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = VolunteerShiftTool.renderToolNav('list');
    VolunteerShiftTool.renderTrustBadge('dataTrustMount', { position: 'top', write_behavior: 'read_only', notify_behavior: 'none' });

    var _lastShiftRows = [];

    function csvEscapeCell(v) {
      var s = v == null ? '' : String(v);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function renderList() {
      var b = VolunteerShiftTool.bridge();
      var tbody = document.getElementById('listBody');
      if (!b || !b.listVolunteerShifts) {
        tbody.innerHTML = '<tr><td colspan="7" class="cm-muted">Bridge 未就緒</td></tr>';
        _lastShiftRows = [];
        return;
      }
      var filters = {};
      var from = document.getElementById('filterFrom').value;
      var to = document.getElementById('filterTo').value;
      var conf = document.getElementById('filterConfirmed').value;
      var mem = document.getElementById('filterMember').value.trim();
      if (from) filters.fromDate = from;
      if (to) filters.toDate = to;
      if (mem) filters.memberId = mem;
      if (conf === '0') filters.confirmed = false;
      if (conf === '1') filters.confirmed = true;
      var rows = b.listVolunteerShifts(filters);
      _lastShiftRows = rows;
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="cm-muted" style="padding:8px;">無符合資料</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function (s) {
        var st = s.confirmed ? '✅' : '⏳';
        return '<tr style="border-bottom:1px solid #f1f5f9;">' +
          '<td style="padding:6px;">' + VolunteerShiftTool.esc(s.id) + '</td>' +
          '<td style="padding:6px;">' + VolunteerShiftTool.esc(s.date) + '</td>' +
          '<td style="padding:6px;">' + VolunteerShiftTool.esc(s.memberName || s.memberId) + '</td>' +
          '<td style="padding:6px;">' + VolunteerShiftTool.esc(s.ministryName || '—') + '</td>' +
          '<td style="padding:6px;">' + VolunteerShiftTool.esc(s.shift || '—') + '</td>' +
          '<td style="padding:6px;">' + st + '</td>' +
          '<td style="padding:6px;"><button type="button" class="cm-btn cm-btn-secondary btn-snippet" data-id="' + VolunteerShiftTool.esc(s.id) + '">邀請稿</button> ' +
          '<button type="button" class="cm-btn cm-btn-success btn-confirm" data-id="' + VolunteerShiftTool.esc(s.id) + '" ' + (s.confirmed ? 'disabled' : '') + '>確認</button></td></tr>';
      }).join('');

      tbody.querySelectorAll('.btn-snippet').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var row = rows.find(function (r) { return String(r.id) === String(id); });
          if (!row || !b.buildShiftInviteSnippet) return;
          var text = b.buildShiftInviteSnippet(row);
          document.getElementById('listSnippet').style.display = 'block';
          document.getElementById('listSnippetText').textContent = text;
        });
      });

      tbody.querySelectorAll('.btn-confirm').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var row = rows.find(function (r) { return String(r.id) === String(id); });
          if (!row || !b.saveVolunteerShift) return;
          try {
            b.saveVolunteerShift({
              id: row.id,
              member_id: row.memberId,
              ministry_id: row.ministryId,
              date: row.date,
              shift: row.shift,
              confirmed: true,
              status: 'confirmed'
            });
            VolunteerShiftTool.notifySync();
            renderList();
          } catch (e) { alert(e.message); }
        });
      });
    }

    function exportShiftCsv() {
      var rows = _lastShiftRows || [];
      var lines = [['id', 'date', 'member_id', 'member_name', 'ministry', 'shift', 'confirmed'].join(',')];
      rows.forEach(function (s) {
        lines.push([
          s.id, s.date, s.memberId, s.memberName || '', s.ministryName || '', s.shift || '', s.confirmed ? 'yes' : 'no'
        ].map(csvEscapeCell).join(','));
      });
      var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'volunteer_shifts_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function printShiftList() {
      var rows = _lastShiftRows || [];
      var from = document.getElementById('filterFrom').value;
      var to = document.getElementById('filterTo').value;
      var htmlRows = rows.map(function (s) {
        return '<tr><td>' + VolunteerShiftTool.esc(s.date) + '</td><td>' +
          VolunteerShiftTool.esc(s.memberName || s.memberId) + '</td><td>' +
          VolunteerShiftTool.esc(s.ministryName || '—') + '</td><td>' +
          VolunteerShiftTool.esc(s.shift || '—') + '</td><td>' +
          (s.confirmed ? '已確認' : '待確認') + '</td></tr>';
      }).join('');
      var w = window.open('', '_blank');
      if (!w) { alert('無法開啟列印視窗（請允許彈出）'); return; }
      w.document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>義工班表</title>' +
        '<style>body{font-family:Microsoft JhengHei,sans-serif;font-size:12px;padding:16px}' +
        'table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}' +
        'h1{font-size:16px}</style></head><body>' +
        '<h1>義工班表（' + from + ' ~ ' + to + '）· ' + rows.length + ' 筆</h1>' +
        '<table><thead><tr><th>日期</th><th>會友</th><th>崗位</th><th>班次</th><th>狀態</th></tr></thead><tbody>' +
        (htmlRows || '<tr><td colspan="5">無資料</td></tr>') +
        '</tbody></table><script>window.onload=function(){window.print();}</' + 'script></body></html>'
      );
      w.document.close();
    }

    document.getElementById('btnFilter').addEventListener('click', renderList);
    document.getElementById('btnExportShiftCsv').addEventListener('click', exportShiftCsv);
    document.getElementById('btnPrintShiftList').addEventListener('click', printShiftList);
    document.getElementById('btnCopyListSnippet').addEventListener('click', function () {
      VolunteerShiftTool.copySnippet(document.getElementById('listSnippetText').textContent);
    });

    var t = new Date();
    document.getElementById('filterFrom').value = t.toISOString().slice(0, 10);
    t.setDate(t.getDate() + 60);
    document.getElementById('filterTo').value = t.toISOString().slice(0, 10);
    renderList();
    window.addEventListener('storage', function () {
      VolunteerShiftTool.renderTrustBadge('dataTrustMount', { position: 'top', write_behavior: 'read_only', notify_behavior: 'none' });
      renderList();
    });
  </script>
<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
