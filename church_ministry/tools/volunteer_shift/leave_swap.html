<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義工智能排班 · 請假調班</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="../../css/crm_context_bar.css">
  <link rel="stylesheet" href="../../css/cm_four_pages_roadmap.css">
  <script src="../../../config/build_version.js"></script>
  <script src="../../js/crm_context_bar.js"></script>
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="tool.js"></script>
  <script src="../../js/cm_four_pages_roadmap.js"></script>
  <script src="../../../js/shell_nav.js"></script>
  <script src="../../../js/g_do_admin_menu_ssot.js"></script>
  <script src="../../../church_planning/js/planning_nav.js"></script>
  <link rel="stylesheet" href="../../css/g_do_admin_nav.css">
  <script src="../../js/g_do_admin_nav.js"></script>
  <script src="../../js/g_do_admin_page_chrome.js"></script>
</head>
<body class="cm-tool-page" data-cm-four-page="shift" data-g-do-cm-prefix="../../">
  <div id="cmFourPagesRoadmapMount"></div>
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 義工智能排班</a>
    <span class="cm-muted">請假調班 · 3 步登記</span>
  </nav>
  <header class="cm-tool-hero">
    <h1>🔄 請假調班</h1>
    <p>原班同工請假 → 選代班 → 寫入排班表（HITL，不會自動發訊息）</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <main class="cm-tool-main">
    <section class="cm-card" style="border-left:4px solid #059669;background:#f0fdf4;">
      <h2 style="font-size:14px;margin:0 0 8px;">小白三步</h2>
      <ol class="cm-steps">
        <li><strong>選原班次</strong>（近 30 天內）</li>
        <li><strong>填請假原因</strong>與<strong>代班會友</strong></li>
        <li><strong>儲存</strong> → 到「排班清單」確認</li>
      </ol>
    </section>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 10px;">登記請假／調班</h2>
      <form id="leaveForm">
        <label class="cm-field">原班次
          <select id="fieldSchedule" name="schedule_id" required></select>
        </label>
        <label class="cm-field">請假原因
          <input type="text" id="fieldReason" name="reason" placeholder="例：出差／生病" required />
        </label>
        <label class="cm-field">代班會友 member_id
          <select id="fieldSubstitute" name="substitute_member_id"></select>
        </label>
        <label class="cm-field">備註
          <textarea id="fieldNote" name="note" rows="2" placeholder="可選：面談時間、通知方式"></textarea>
        </label>
        <button type="submit" class="cm-btn cm-btn-primary">儲存請假調班</button>
      </form>
    </section>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 8px;">近期請假紀錄</h2>
      <div id="leaveListHost"><p class="cm-muted">載入中…</p></div>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = VolunteerShiftTool.renderToolNav('leave_swap');
    if (window.CmFourPagesRoadmap) CmFourPagesRoadmap.mount('#cmFourPagesRoadmapMount');

    function renderLeaveList() {
      var host = document.getElementById('leaveListHost');
      var rows = VolunteerShiftTool.getLeaveRequests();
      if (!rows.length) {
        host.innerHTML = '<p class="cm-muted">尚無請假紀錄。</p>';
        return;
      }
      host.innerHTML = '<table class="cm-table"><thead><tr><th>日期</th><th>崗位</th><th>原同工</th><th>代班</th><th>原因</th></tr></thead><tbody>' +
        rows.slice().reverse().slice(0, 20).map(function (r) {
          return '<tr><td>' + VolunteerShiftTool.esc(r.date || '—') + '</td><td>' +
            VolunteerShiftTool.esc(r.ministryName || '—') + '</td><td>' +
            VolunteerShiftTool.esc(r.memberName || r.memberId || '—') + '</td><td>' +
            VolunteerShiftTool.esc(r.substituteMemberName || r.substituteMemberId || '—') + '</td><td>' +
            VolunteerShiftTool.esc(r.reason || '—') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    function fillScheduleSelect() {
      var sel = document.getElementById('fieldSchedule');
      var list = VolunteerShiftTool.getUpcomingSchedules(30);
      sel.innerHTML = '<option value="">— 選擇班次 —</option>' +
        list.map(function (s) {
          var label = (s.date || '') + ' · ' + (s.ministryName || s.ministryId || '') +
            ' · ' + (s.memberName || s.memberId || '');
          return '<option value="' + VolunteerShiftTool.esc(String(s.id)) + '">' +
            VolunteerShiftTool.esc(label) + '</option>';
        }).join('');
      if (!list.length) {
        sel.innerHTML += '<option value="" disabled>（近 30 天無排班 · 請先新增排班）</option>';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      VolunteerShiftTool.fillMemberSelect(document.getElementById('fieldSubstitute'));
      fillScheduleSelect();
      renderLeaveList();
      document.getElementById('leaveForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var sid = document.getElementById('fieldSchedule').value;
        var reason = document.getElementById('fieldReason').value.trim();
        var subId = document.getElementById('fieldSubstitute').value;
        var note = document.getElementById('fieldNote').value.trim();
        if (!sid || !reason) {
          alert('請選班次並填原因');
          return;
        }
        var r = VolunteerShiftTool.saveLeaveRequest({
          scheduleId: sid,
          reason: reason,
          substituteMemberId: subId || null,
          note: note
        });
        if (!r.ok) {
          alert('儲存失敗：' + (r.error || '未知'));
          return;
        }
        alert('已登記請假調班');
        document.getElementById('leaveForm').reset();
        fillScheduleSelect();
        renderLeaveList();
      });
    });
  </script>
</body>
</html>
