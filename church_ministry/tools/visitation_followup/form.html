<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探訪跟進 · 新增</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/persistence_provider.js"></script>
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_auth.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/crm_intent_router.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.cm-tool-hero { background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%); }</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 探訪跟進</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>➕ 新增／編輯跟進任務</h1>
    <p>支援 CRM 意圖預填 · 必須人工確認 · 儲存後僅產生關懷複製稿（copy_only）</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <form id="crmIntentForm" class="cm-card" data-crm-intent="visitation_followup.create">
      <input type="hidden" id="fieldTaskId" name="id" value="">
      <label class="cm-field">會友 member_id
        <select id="fieldMemberId" name="member_id" required></select>
      </label>
      <label class="cm-field">跟進原因
        <input type="text" id="fieldReason" name="reason" required placeholder="例：新人歡迎、久未出席、風險關懷">
      </label>
      <label class="cm-field">優先級
        <select id="fieldPriority" name="priority">
          <option value="low">low</option>
          <option value="normal" selected>normal</option>
          <option value="high">high</option>
          <option value="urgent">urgent</option>
        </select>
      </label>
      <label class="cm-field">到期日
        <input type="date" id="fieldDueDate" name="due_date" required>
      </label>
      <label class="cm-field">指派同工
        <input type="text" id="fieldAssigned" name="assigned_to" placeholder="可選">
      </label>
      <label class="cm-field">狀態
        <select id="fieldStatus" name="status">
          <option value="draft">draft</option>
          <option value="pending" selected>pending</option>
          <option value="contacted">contacted</option>
          <option value="completed">completed</option>
          <option value="archived">archived</option>
        </select>
      </label>
      <label class="cm-field">備註（牧養敏感 · 不會自動外傳）
        <textarea id="fieldNote" name="note" rows="3" placeholder="僅本機儲存；請勿在公開儀表板貼全文"></textarea>
      </label>
      <label class="cm-field" style="display:flex;align-items:center;gap:8px;max-width:none;">
        <input type="checkbox" id="humanConfirm" required> 我已核對 member_id 與跟進內容，允許寫入資料層（HITL）
      </label>
      <div>
        <button type="submit" class="cm-btn cm-btn-primary">💾 儲存跟進任務</button>
        <div id="trustSaveNotice"></div>
      </div>
      <p id="formStatus" class="cm-muted" style="margin-top:10px;"></p>
      <div id="snippetBox" class="cm-snippet" style="display:none;">
        <strong>關懷複製稿（copy_only · 不會自動通知）：</strong>
        <p id="snippetText" style="margin:6px 0;"></p>
        <button type="button" class="cm-btn cm-btn-success" id="btnCopySnippet">📋 複製文字</button>
      </div>
    </form>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = VisitationFollowupTool.renderToolNav('form');
    VisitationFollowupTool.renderTrustBadge('dataTrustMount', {
      position: 'top',
      write_behavior: 'manual_save',
      notify_behavior: 'copy_only',
      privacy_level: 'pastoral_sensitive'
    });
    if (window.DataTrustBadge) {
      DataTrustBadge.renderActionTrustNotice({
        mount: 'trustSaveNotice',
        write_behavior: 'manual_save',
        notify_behavior: 'copy_only',
        requires_human_confirmation: true
      });
    }
    document.getElementById('fieldDueDate').value = VisitationFollowupTool.addDaysYmd(3);
    VisitationFollowupTool.fillMemberSelect(document.getElementById('fieldMemberId'));
    VisitationFollowupTool.applyCrmIntentPrefill();

    document.getElementById('crmIntentForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var statusEl = document.getElementById('formStatus');
      if (!document.getElementById('humanConfirm').checked) {
        statusEl.textContent = '請勾選人工確認後再儲存。';
        return;
      }
      var b = VisitationFollowupTool.bridge();
      if (!b || !b.savePastoralFollowup) {
        statusEl.textContent = 'ChurchDataBridge 未就緒';
        return;
      }
      try {
        var res = b.savePastoralFollowup({
          id: document.getElementById('fieldTaskId').value || undefined,
          member_id: document.getElementById('fieldMemberId').value,
          reason: document.getElementById('fieldReason').value,
          priority: document.getElementById('fieldPriority').value,
          due_date: document.getElementById('fieldDueDate').value,
          assigned_to: document.getElementById('fieldAssigned').value,
          status: document.getElementById('fieldStatus').value,
          note: document.getElementById('fieldNote').value,
          source: 'visitation_followup_tool'
        });
        statusEl.textContent = '已儲存任務 #' + (res.task && res.task.id);
        var sn = res.pastoral_snippet || res.leader_outreach_snippet || '';
        document.getElementById('snippetText').textContent = sn;
        document.getElementById('snippetBox').style.display = sn ? 'block' : 'none';
        if (res.task && res.task.id) document.getElementById('fieldTaskId').value = res.task.id;
        VisitationFollowupTool.notifySync();
      } catch (err) {
        statusEl.textContent = '儲存失敗：' + (err && err.message ? err.message : String(err));
      }
    });
    document.getElementById('btnCopySnippet').addEventListener('click', function () {
      VisitationFollowupTool.copySnippet(document.getElementById('snippetText').textContent).then(function () {
        document.getElementById('formStatus').textContent = '已複製到剪貼簿（請人工轉發，系統不會自動通知）。';
      });
    });
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
