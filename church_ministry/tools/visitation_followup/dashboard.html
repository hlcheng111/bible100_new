<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探訪跟進 · 儀表板</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>.cm-tool-hero { background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%); }</style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 探訪跟進</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>📊 跟進儀表板</h1>
    <p>真數據 KPI · 僅顯示摘要（不顯示完整敏感 note）· 不會自動通知</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <div class="cm-kpi-grid cm-card" style="border:none;padding:0;background:transparent;">
      <div class="cm-kpi"><span class="cm-muted">待跟進</span><strong id="kpiPending">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">今日到期</span><strong id="kpiToday">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">7 日內到期</span><strong id="kpi7d">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">高優先</span><strong id="kpiHigh">—</strong></div>
      <div class="cm-kpi"><span class="cm-muted">已完成</span><strong id="kpiDone">—</strong></div>
    </div>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 8px;">近期跟進（摘要 · 10 筆）</h2>
      <p class="cm-muted" style="font-size:10px;margin:0 0 8px;">完整備註請至 <a href="list.html">跟進清單</a> 或表單查看。</p>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:11px;">
          <thead>
            <tr style="text-align:left;border-bottom:2px solid #e2e8f0;">
              <th style="padding:6px;">到期</th>
              <th style="padding:6px;">會友</th>
              <th style="padding:6px;">原因（摘要）</th>
              <th style="padding:6px;">優先</th>
              <th style="padding:6px;">狀態</th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = VisitationFollowupTool.renderToolNav('dashboard');
    VisitationFollowupTool.renderTrustBadge('dataTrustMount', {
      position: 'top',
      write_behavior: 'read_only',
      notify_behavior: 'none',
      privacy_level: 'pastoral_sensitive'
    });
    (function () {
      var b = VisitationFollowupTool.bridge();
      if (!b) return;
      var sum = b.getPastoralFollowupSummary ? b.getPastoralFollowupSummary(7) : {};
      document.getElementById('kpiPending').textContent = sum.pending != null ? sum.pending : '—';
      document.getElementById('kpiToday').textContent = sum.due_today != null ? sum.due_today : '—';
      document.getElementById('kpi7d').textContent = sum.due_in_window != null ? sum.due_in_window : '—';
      document.getElementById('kpiHigh').textContent = sum.high_priority != null ? sum.high_priority : '—';
      document.getElementById('kpiDone').textContent = sum.completed != null ? sum.completed : '—';

      var rows = b.listPastoralFollowups ? b.listPastoralFollowups({ limit: 10, excludeArchived: true }) : [];
      var tbody = document.getElementById('recentBody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="cm-muted" style="padding:8px;">尚無任務 · <a href="form.html">新增第一筆</a></td></tr>';
      } else {
        tbody.innerHTML = rows.map(function (t) {
          return '<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:6px;">' + VisitationFollowupTool.esc(t.due_date) +
            '</td><td style="padding:6px;">' + VisitationFollowupTool.esc(t.member_name || t.member_id) +
            '</td><td style="padding:6px;">' + VisitationFollowupTool.esc(VisitationFollowupTool.truncateReason(t.reason, 20)) +
            '</td><td style="padding:6px;">' + VisitationFollowupTool.esc(t.priority) +
            '</td><td style="padding:6px;">' + VisitationFollowupTool.esc(t.status) + '</td></tr>';
        }).join('');
      }
    })();
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
