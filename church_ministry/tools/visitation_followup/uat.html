<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探訪跟進 · 小白驗收（UAT）</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
  <style>
    .uat-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .uat-ok { color: #047857; font-weight: 700; }
    .uat-fail { color: #b91c1c; font-weight: 700; }
  </style>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← 探訪跟進</a>
  </nav>
  <header class="cm-tool-hero" style="background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;padding:16px;">
    <h1>✅ A2 驗收檢查</h1>
    <p>瀏覽器內呼叫 ChurchDataBridge · 不會自動通知</p>
  </header>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card">
      <p>
        <button type="button" class="cm-btn cm-btn-primary" id="btnRunAll">▶ 執行全部檢查</button>
        <button type="button" class="cm-btn cm-btn-secondary" id="btnLoadDemo">載入 demo 後再檢查</button>
        <button type="button" class="cm-btn cm-btn-secondary" id="btnClearDemo">清除 demo</button>
      </p>
      <div id="checkList"></div>
      <pre id="log" style="font-size:10px;background:#f8fafc;padding:10px;border-radius:8px;max-height:240px;overflow:auto;"></pre>
    </section>
  </main>
  <script>
    VisitationFollowupTool.renderTrustBadge('dataTrustMount', {
      write_behavior: 'manual_save',
      notify_behavior: 'none',
      privacy_level: 'pastoral_sensitive'
    });
    (function () {
      var logEl = document.getElementById('log');
      function log(msg) { logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + msg; }
      function add(name, ok, detail) {
        document.getElementById('checkList').innerHTML +=
          '<div class="uat-row"><span>' + VisitationFollowupTool.esc(name) + '</span><span class="' +
          (ok ? 'uat-ok' : 'uat-fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</span></div>' +
          (detail ? '<p class="cm-muted" style="font-size:10px;">' + VisitationFollowupTool.esc(detail) + '</p>' : '');
        log((ok ? 'PASS' : 'FAIL') + ' ' + name + (detail ? ' — ' + detail : ''));
      }

      function runChecks() {
        logEl.textContent = '';
        document.getElementById('checkList').innerHTML = '';
        var b = VisitationFollowupTool.bridge();
        add('ChurchDataBridge', !!b, b ? '' : '未載入 bridge');
        if (!b) return;
        add('listPastoralFollowups', typeof b.listPastoralFollowups === 'function');
        add('getPastoralFollowupSummary', typeof b.getPastoralFollowupSummary === 'function');
        add('savePastoralFollowup', typeof b.savePastoralFollowup === 'function');
        add('buildPastoralFollowupSnippet', typeof b.buildPastoralFollowupSnippet === 'function');
        add('promotePastoralAlertToFollowup', typeof b.promotePastoralAlertToFollowup === 'function');

        var before = (b.listPastoralFollowups({}) || []).length;
        var saved;
        try {
          saved = b.savePastoralFollowup({
            member_id: 99901,
            member_name: 'UAT測試',
            reason: 'uat_probe',
            priority: 'normal',
            due_date: VisitationFollowupTool.todayYmd(),
            status: 'pending',
            source: 'visitation_followup_tool',
            note: 'uat secret note'
          });
        } catch (e) {
          add('新增測試任務', false, e.message);
          return;
        }
        add('新增測試任務', saved && saved.ok && saved.task, 'id=' + (saved.task && saved.task.id));
        var list = b.listPastoralFollowups({ memberId: 99901 });
        add('list 讀到任務', list.length >= 1);
        var sum = b.getPastoralFollowupSummary(7);
        add('summary 更新', sum && sum.pending >= 0, 'pending=' + sum.pending);
        var sn = b.buildPastoralFollowupSnippet(saved.task);
        add('snippet 生成', sn && sn.indexOf('不會自動發送') >= 0);
        add('copy_only 文案', sn && sn.indexOf('人工') >= 0);
        add('snippet 不含 note 全文', sn.indexOf('uat secret note') < 0 && sn.indexOf(saved.task.note) < 0);

        fetch('list.html').then(function (res) { return res.text(); }).then(function (html) {
          var noPreview = html.indexOf('notePreview') < 0 && html.indexOf('truncateReason(t.note') < 0;
          add('清單不預設 notePreview', noPreview);
          add('清單敏感備註按鈕', html.indexOf('查看敏感備註') >= 0 && html.indexOf('牧養敏感資料，請限牧者') >= 0);
        }).catch(function () {
          add('清單隱私靜態檢查', false, '無法讀取 list.html');
        });

        var stub = b.promotePastoralAlertToFollowup('', {});
        add('promote stub（空 alert）', stub && stub.ok === false && stub.stub);

        var realId = saved.task.id;
        var demoRes = VisitationFollowupTool.loadA2DemoData();
        add('載入 A2 demo', demoRes && demoRes.ok);
        try {
          add('demo marker', !!localStorage.getItem('visitation_followup_demo_loaded_at'));
        } catch (e2) {
          add('demo marker', false);
        }
        var cleared = VisitationFollowupTool.clearA2DemoData();
        var still = (b.listPastoralFollowups({ memberId: 99901 }) || []).length;
        add('清除 demo 保留正式', still >= 1 && cleared.ok, 'uat 任務仍在，removed demo=' + cleared.removed);
        try {
          b.savePastoralFollowup({ id: realId, status: 'archived' });
        } catch (e3) {}
      }

      document.getElementById('btnRunAll').addEventListener('click', runChecks);
      document.getElementById('btnLoadDemo').addEventListener('click', function () {
        VisitationFollowupTool.loadA2DemoData();
        runChecks();
      });
      document.getElementById('btnClearDemo').addEventListener('click', function () {
        VisitationFollowupTool.clearA2DemoData();
        log('demo cleared');
      });
    })();
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
