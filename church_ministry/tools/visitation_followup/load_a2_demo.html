<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <script src="../../../js/cloud_config.js"></script>

</head>
<body style="font-family:'Microsoft YaHei',sans-serif;padding:20px;font-size:12px;">
  <h1>載入 A2 探訪跟進 demo</h1>
  <p id="status" class="cm-muted">執行中…</p>
  <p><a href="index.html">← 返回首頁</a> · <a href="uat.html">UAT</a></p>
  <script>
    (function () {
      var el = document.getElementById('status');
      var r = VisitationFollowupTool.loadA2DemoData();
      if (r.ok) {
        el.textContent = '已載入 3 筆跟進任務（含 urgent、今日到期、completed）。marker: ' + VisitationFollowupTool.DEMO_MARKER_KEY;
        el.style.color = '#047857';
      } else {
        el.textContent = '失敗：' + (r.error || 'unknown');
        el.style.color = '#b91c1c';
      }
    })();
  </script>
</body>
</html>
