<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TOOL_LABEL_ZH}} · 小白驗收（UAT）</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← {{TOOL_LABEL_ZH}}</a>
    <a class="cm-back-bar__link" href="../uat_index.html">📋 驗收總表</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>✅ {{TOOL_LABEL_ZH}} · UAT</h1>
    <p>複製本頁後接上 Bridge 自動檢查（參考 volunteer_shift/uat.html）。</p>
  </header>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card">
      <p class="cm-muted">此為模板占位。實作工具時請覆寫檢查項：Bridge、寫入、清單、demo、CTV 等。</p>
      <button type="button" class="cm-btn cm-btn-primary" id="btnRunUat">▶ 執行檢查（占位）</button>
      <pre id="uatLog" class="cm-muted" style="margin-top:12px;font-size:10px;white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:8px;">待命…</pre>
    </section>
  </main>
  <script>
    ToolKit.renderTrustBadge('dataTrustMount', { write_behavior: 'manual_save', notify_behavior: 'none' });
    document.getElementById('btnRunUat').onclick = function () {
      var b = ToolKit.bridge();
      document.getElementById('uatLog').textContent = b
        ? 'ChurchDataBridge: OK\n請補齊本工具專項 UAT。'
        : 'ChurchDataBridge: 未載入';
    };
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
