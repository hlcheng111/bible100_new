<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TOOL_LABEL_ZH}} · 儀表板</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← {{TOOL_LABEL_ZH}}</a>
    <a class="cm-back-bar__link" href="uat.html">✅ 驗收</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>{{TOOL_LABEL_ZH}} · 儀表板</h1>
    <p>數據來自 ChurchDataBridge（無資料時顯示 —，非假 KPI）。</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <div class="cm-card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">
      <div><div class="cm-muted">本週紀錄</div><div id="kpiWeek" style="font-size:22px;font-weight:700;">—</div></div>
      <div><div class="cm-muted">待處理</div><div id="kpiPending" style="font-size:22px;font-weight:700;">—</div></div>
      <div><div class="cm-muted">關聯會友</div><div id="kpiMembers" style="font-size:22px;font-weight:700;">—</div></div>
    </div>
    <section class="cm-card">
      <h2 style="font-size:14px;margin:0 0 8px;">圖表區（占位）</h2>
      <p class="cm-muted">實作時改為讀 <code>tool.meta.json → bridge.read</code> 方法並渲染 canvas 或簡表。</p>
      <div id="chartHost" style="min-height:120px;border:1px dashed #cbd5e1;border-radius:8px;padding:12px;color:#64748b;">尚無圖表資料</div>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = ToolKit.renderToolNav('dashboard');
    ToolKit.renderTrustBadge('dataTrustMount', { write_behavior: 'read_only', notify_behavior: 'none' });
    (function () {
      function set(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
      try {
        var b = ToolKit.bridge();
        if (!b || typeof b.getMembers !== 'function') return;
        var members = b.getMembers() || [];
        set('kpiMembers', members.length);
        set('kpiWeek', '0');
        set('kpiPending', '0');
        ToolKit.renderTrustBadge('dataTrustMount', { write_behavior: 'read_only', notify_behavior: 'none', count: members.length });
      } catch (e) {}
    })();
  </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../../css/cm_desk.css" />
<script src="../../js/cm_desk_registry.js"></script>
<script src="../../js/cm_desk_kit.js"></script>
</body>
</html>
