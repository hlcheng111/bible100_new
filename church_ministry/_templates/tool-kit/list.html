<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TOOL_LABEL_ZH}} · 清單</title>
  <link rel="stylesheet" href="../../../css/unified_module_styles.css">
  <link rel="stylesheet" href="../../css/church_ministry_ui.css">
  <link rel="stylesheet" href="_shared.css">
  <script src="../../../js/cloud_config.js"></script>
  <script src="../../../js/church_data_bridge.js"></script>
  <script src="../../../js/data_trust_badge.js"></script>
  <script src="tool.js"></script>
</head>
<body class="cm-tool-page">
  <nav class="cm-back-bar">
    <a class="cm-back-bar__link" href="index.html">← {{TOOL_LABEL_ZH}}</a>
  </nav>
  <header class="cm-tool-hero">
    <h1>{{TOOL_LABEL_ZH}} · 歷史清單</h1>
    <p>條件篩選 · 匯出 JSON（實作時接 Bridge 唯讀 API）。</p>
  </header>
  <nav class="cm-tool-nav" aria-label="工具分頁" id="toolNav"></nav>
  <div id="dataTrustMount"></div>
  <main class="cm-tool-main">
    <section class="cm-card" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;">
      <label style="font-size:12px;">關鍵字
        <input id="filterQ" type="search" placeholder="member_id / 摘要" style="display:block;margin-top:4px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;min-width:180px;">
      </label>
      <label style="font-size:12px;">起日
        <input id="filterFrom" type="date" style="display:block;margin-top:4px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;">
      </label>
      <button type="button" id="btnFilter" class="cm-btn cm-btn-secondary">篩選</button>
    </section>
    <section class="cm-card">
      <div id="listInviteTrust"></div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead>
          <tr style="text-align:left;border-bottom:2px solid #e2e8f0;">
            <th style="padding:6px;">日期</th>
            <th style="padding:6px;">member_id</th>
            <th style="padding:6px;">摘要</th>
          </tr>
        </thead>
        <tbody id="listBody">
          <tr><td colspan="3" class="cm-muted" style="padding:8px;">尚無資料 · 請先新增或接 Bridge</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script>
    document.getElementById('toolNav').innerHTML = ToolKit.renderToolNav('list');
    ToolKit.renderTrustBadge('dataTrustMount', { write_behavior: 'read_only', notify_behavior: 'copy_only' });
    if (window.DataTrustBadge) {
      DataTrustBadge.renderActionTrustNotice({
        mount: 'listInviteTrust',
        write_behavior: 'read_only',
        notify_behavior: 'copy_only',
        risk_hint: '若有邀請文字：只產生文字，不會發送'
      });
    }
    document.getElementById('btnFilter').addEventListener('click', function () {
      /* 實作：bridge.listToolRecords({ q, from }) */
    });
  </script>
</body>
</html>
