<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統支援 · Support | Church Ministry</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link href="assets/css/fontawesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-6">
        <div class="bg-gradient-to-r from-teal-600 to-cyan-600 rounded-lg shadow-lg p-8 mb-8 text-white">
            <h1 class="text-4xl font-bold mb-2">🛠️ 系統支援</h1>
            <p class="text-lg opacity-90">System Support - 技術支援與服務</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 技術支援 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🔧</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">技術支援</h3>
                <p class="text-gray-600 mb-4">在線支援、遠程協助、培訓服務</p>
                <a href="modules/support/technical-support.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 幫助文檔 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">📖</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">幫助文檔</h3>
                <p class="text-gray-600 mb-4">使用指南、常見問題、視頻教程</p>
                <a href="modules/support/help-documentation.html" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>

            <!-- 系統更新 -->
            <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <div class="text-4xl mb-4">🔄</div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">系統更新</h3>
                <p class="text-gray-600 mb-4">版本檢查、自動更新、更新日誌</p>
                <a href="modules/support/auto-update.html" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                    進入功能 <i class="fas fa-arrow-right ml-2"></i>
                </a>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="inline-block bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700">
                <i class="fas fa-home mr-2"></i>返回教會事工首頁
            </a>
        </div>
    </div>

<!-- b100-cm-desk-kit -->
