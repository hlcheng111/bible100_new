<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬拜事工團隊 · Worship | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #e74c3c;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #e74c3c;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #e74c3c;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎵 敬拜事工團隊</h1>
        <p>Worship Ministry Team - 音樂敬拜與讚美事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>🎤 主領敬拜</h3>
            <p>負責主日崇拜的敬拜帶領和音樂安排</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">6位主領，3個時段</span>
        </div>
        
        <div class="content-card">
            <h3>🎸 樂器演奏</h3>
            <p>吉他、鍵盤、鼓等樂器的演奏和配合</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">12位樂手，8種樂器</span>
        </div>
        
        <div class="content-card">
            <h3>🎼 音樂創作</h3>
            <p>原創詩歌創作和音樂編曲製作</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">3位創作者，15首原創</span>
        </div>
        
        <div class="content-card">
            <h3>🎧 音響技術</h3>
            <p>音響設備操作和現場音效控制</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">4位技術員，全時段支持</span>
        </div>
    </div>
    
    <script>
        console.log('敬拜事工團隊頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
