<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬拜事工团队 · Worship | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #e74c3c;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #e74c3c;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #e74c3c;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎵 敬拜事工团队</h1>
        <p>Worship Ministry Team - 音乐敬拜与赞美事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>🎤 主领敬拜</h3>
            <p>负责主日崇拜的敬拜带领和音乐安排</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">6位主领，3个时段</span>
        </div>
        
        <div class="content-card">
            <h3>🎸 乐器演奏</h3>
            <p>吉他、键盘、鼓等乐器的演奏和配合</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">12位乐手，8种乐器</span>
        </div>
        
        <div class="content-card">
            <h3>🎼 音乐创作</h3>
            <p>原创诗歌创作和音乐编曲制作</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">3位创作者，15首原创</span>
        </div>
        
        <div class="content-card">
            <h3>🎧 音响技术</h3>
            <p>音响设备操作和现场音效控制</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">4位技术员，全时段支持</span>
        </div>
    </div>
    
    <script>
        console.log('敬拜事工团队页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
