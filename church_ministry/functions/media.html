<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒體創作支持 · Media | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #9b59b6;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #9b59b6;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #9b59b6;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 媒體創作支持</h1>
        <p>Media Creation Support - 多媒體制作與傳播</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>🎥 視頻製作</h3>
            <p>主日講道錄製、活動視頻製作、宣傳片剪輯</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月製作 12個視頻，觀看量 2,345次</span>
        </div>
        
        <div class="content-card">
            <h3>🎨 平面設計</h3>
            <p>活動海報、宣傳單張、PPT模板設計製作</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月設計 25個作品，使用率 90%</span>
        </div>
        
        <div class="content-card">
            <h3>📱 社交媒體</h3>
            <p>微信、微博、Facebook等平台內容發佈管理</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">3個平台，粉絲總數 1,234人</span>
        </div>
        
        <div class="content-card">
            <h3>🌐 網站維護</h3>
            <p>教會官網更新、內容管理、技術維護</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月訪問量 5,678次，更新 15次</span>
        </div>
    </div>
    
    <script>
        console.log('媒體創作支持頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
