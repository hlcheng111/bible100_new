<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体创作支持 · Media | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #9b59b6;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #9b59b6;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #9b59b6;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 媒体创作支持</h1>
        <p>Media Creation Support - 多媒体制作与传播</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>🎥 视频制作</h3>
            <p>主日讲道录制、活动视频制作、宣传片剪辑</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月制作 12个视频，观看量 2,345次</span>
        </div>
        
        <div class="content-card">
            <h3>🎨 平面设计</h3>
            <p>活动海报、宣传单张、PPT模板设计制作</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月设计 25个作品，使用率 90%</span>
        </div>
        
        <div class="content-card">
            <h3>📱 社交媒体</h3>
            <p>微信、微博、Facebook等平台内容发布管理</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">3个平台，粉丝总数 1,234人</span>
        </div>
        
        <div class="content-card">
            <h3>🌐 网站维护</h3>
            <p>教会官网更新、内容管理、技术维护</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月访问量 5,678次，更新 15次</span>
        </div>
    </div>
    
    <script>
        console.log('媒体创作支持页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
