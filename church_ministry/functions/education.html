<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵命培育团队 · Education | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #27ae60;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #27ae60;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #27ae60;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🙏 灵命培育团队</h1>
        <p>Spiritual Growth Team - 灵命成长与教育事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>📚 主日学事工</h3>
            <p>负责各年龄段的主日学课程设计和教学安排</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">12个班级，156名学生</span>
        </div>
        
        <div class="content-card">
            <h3>🎓 门徒训练</h3>
            <p>系统性的门徒训练课程和一对一辅导</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">45名学员，8位导师</span>
        </div>
        
        <div class="content-card">
            <h3>📖 查经小组</h3>
            <p>组织各年龄层的查经小组和圣经研读</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">18个小组，234名成员</span>
        </div>
        
        <div class="content-card">
            <h3>👶 儿童事工</h3>
            <p>0-12岁儿童的属灵教育和活动策划</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">6个年龄段，89名儿童</span>
        </div>
    </div>
    
    <script>
        console.log('灵命培育团队页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>
</body>
</html>
