<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈命培育團隊 · Education | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #27ae60;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #27ae60;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #27ae60;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🙏 靈命培育團隊</h1>
        <p>Spiritual Growth Team - 靈命成長與教育事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>📚 主日學事工</h3>
            <p>負責各年齡段的主日學課程設計和教學安排</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">12個班級，156名學生</span>
        </div>
        
        <div class="content-card">
            <h3>🎓 門徒訓練</h3>
            <p>系統性的門徒訓練課程和一對一輔導</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">45名學員，8位導師</span>
        </div>
        
        <div class="content-card">
            <h3>📖 查經小組</h3>
            <p>組織各年齡層的查經小組和聖經研讀</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">18個小組，234名成員</span>
        </div>
        
        <div class="content-card">
            <h3>👶 兒童事工</h3>
            <p>0-12歲兒童的屬靈教育和活動策劃</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">6個年齡段，89名兒童</span>
        </div>
    </div>
    
    <script>
        console.log('靈命培育團隊頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
