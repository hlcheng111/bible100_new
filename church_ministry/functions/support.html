<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統支援 · Support | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #34495e;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #34495e;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #34495e;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ 系統支援</h1>
        <p>System Support - 技術支持與維護服務</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>❓ 幫助文檔</h3>
            <p>系統使用指南、常見問題解答、操作手冊</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">156篇文檔，月訪問 234次</span>
        </div>
        
        <div class="content-card">
            <h3>🔧 技術支持</h3>
            <p>系統故障排除、技術諮詢、遠程協助服務</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月處理 45個問題，解決率 95%</span>
        </div>
        
        <div class="content-card">
            <h3>📚 培訓服務</h3>
            <p>系統操作培訓、新功能介紹、用戶教育</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月培訓 8次，參與人數 89人</span>
        </div>
        
        <div class="content-card">
            <h3>🔄 系統更新</h3>
            <p>軟件版本升級、功能增強、安全補丁更新</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月更新 2次，系統穩定性 99.8%</span>
        </div>
    </div>
    
    <script>
        console.log('系統支援頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
