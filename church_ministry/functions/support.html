<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统支援 · Support | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #34495e;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #34495e;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #34495e;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ 系统支援</h1>
        <p>System Support - 技术支持与维护服务</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>❓ 帮助文档</h3>
            <p>系统使用指南、常见问题解答、操作手册</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">156篇文档，月访问 234次</span>
        </div>
        
        <div class="content-card">
            <h3>🔧 技术支持</h3>
            <p>系统故障排除、技术咨询、远程协助服务</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月处理 45个问题，解决率 95%</span>
        </div>
        
        <div class="content-card">
            <h3>📚 培训服务</h3>
            <p>系统操作培训、新功能介绍、用户教育</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月培训 8次，参与人数 89人</span>
        </div>
        
        <div class="content-card">
            <h3>🔄 系统更新</h3>
            <p>软件版本升级、功能增强、安全补丁更新</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月更新 2次，系统稳定性 99.8%</span>
        </div>
    </div>
    
    <script>
        console.log('系统支援页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
