<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政管理支持 · Administration | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #f39c12;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #f39c12;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #f39c12;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ 行政管理支持</h1>
        <p>Administration Support - 教會行政與管理系統</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>💰 財務管理</h3>
            <p>教會財務收支、預算規劃、奉獻記錄管理</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月收入 ¥45,000，月支出 ¥38,000</span>
        </div>
        
        <div class="content-card">
            <h3>🏢 設備管理</h3>
            <p>教會設備維護、採購、使用記錄管理</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">156件設備，維護率 95%</span>
        </div>
        
        <div class="content-card">
            <h3>📚 圖書管理</h3>
            <p>教會圖書館書籍借閱、採購、分類管理</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">2,345冊圖書，月借閱 89次</span>
        </div>
        
        <div class="content-card">
            <h3>👥 會員管理</h3>
            <p>信徒資料、會員檔案、聯繫信息管理</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">456名會員，活躍度 78%</span>
        </div>
    </div>
    
    <script>
        console.log('行政管理支持頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
