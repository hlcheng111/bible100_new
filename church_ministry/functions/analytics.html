<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析中心 · Analytics | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #1abc9c;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #1abc9c;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #1abc9c;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 数据分析中心</h1>
        <p>Data Analytics Center - 数据洞察与决策支持</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>📊 事工效能分析</h3>
            <p>各事工部门参与度、效果评估、改进建议</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">6个事工，平均效能 85%</span>
        </div>
        
        <div class="content-card">
            <h3>👥 会员参与统计</h3>
            <p>信徒参与活动频率、年龄段分布、成长轨迹</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">456名会员，活跃率 78%</span>
        </div>
        
        <div class="content-card">
            <h3>💰 财务数据分析</h3>
            <p>收支趋势、奉献分析、预算执行情况</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">月收入增长 12%，支出控制良好</span>
        </div>
        
        <div class="content-card">
            <h3>📈 成长趋势报告</h3>
            <p>教会整体发展、人数增长、事工扩展趋势</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">年度增长 15%，新会员 67人</span>
        </div>
    </div>
    
    <script>
        console.log('数据分析中心页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>
</body>
</html>
