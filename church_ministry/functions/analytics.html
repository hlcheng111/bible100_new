<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據分析中心 · Analytics | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #1abc9c;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #1abc9c;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #1abc9c;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 數據分析中心</h1>
        <p>Data Analytics Center - 數據洞察與決策支持</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>📊 事工效能分析</h3>
            <p>各事工部門參與度、效果評估、改進建議</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">6個事工，平均效能 85%</span>
        </div>
        
        <div class="content-card">
            <h3>👥 會員參與統計</h3>
            <p>信徒參與活動頻率、年齡段分佈、成長軌跡</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">456名會員，活躍率 78%</span>
        </div>
        
        <div class="content-card">
            <h3>💰 財務數據分析</h3>
            <p>收支趨勢、奉獻分析、預算執行情況</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">月收入增長 12%，支出控制良好</span>
        </div>
        
        <div class="content-card">
            <h3>📈 成長趨勢報告</h3>
            <p>教會整體發展、人數增長、事工擴展趨勢</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">年度增長 15%，新會員 67人</span>
        </div>
    </div>
    
    <script>
        console.log('數據分析中心頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
