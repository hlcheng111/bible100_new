<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团契互动团队 · Fellowship | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #3498db;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #3498db;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #3498db;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👥 团契互动团队</h1>
        <p>Fellowship Team - 团契生活与互动事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>👨👩👧👦 家庭团契</h3>
            <p>以家庭为单位的团契聚会和活动</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">24个家庭，89人参与</span>
        </div>
        
        <div class="content-card">
            <h3>👨💼 职场团契</h3>
            <p>职场人士的信仰分享和职业发展</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">8个行业，45名成员</span>
        </div>
        
        <div class="content-card">
            <h3>🎂 长者团契</h3>
            <p>60岁以上长者的关怀和团契活动</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">32位长者，每周聚会</span>
        </div>
        
        <div class="content-card">
            <h3>🏃♂️ 运动团契</h3>
            <p>通过运动建立友谊和信仰分享</p>
            <span class="status-indicator">活跃</span>
            <span style="font-size: 10px; color: #666;">6个项目，67名参与者</span>
        </div>
    </div>
    
    <script>
        console.log('团契互动团队页面载入完成 - 时间:', new Date().toLocaleTimeString());
    </script>
</body>
</html>
