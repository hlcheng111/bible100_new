<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團契互動團隊 · Fellowship | Church Ministry</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #3498db;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #3498db;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #3498db;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👥 團契互動團隊</h1>
        <p>Fellowship Team - 團契生活與互動事工</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>👨👩👧👦 家庭團契</h3>
            <p>以家庭為單位的團契聚會和活動</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">24個家庭，89人參與</span>
        </div>
        
        <div class="content-card">
            <h3>👨💼 職場團契</h3>
            <p>職場人士的信仰分享和職業發展</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">8個行業，45名成員</span>
        </div>
        
        <div class="content-card">
            <h3>🎂 長者團契</h3>
            <p>60歲以上長者的關懷和團契活動</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">32位長者，每週聚會</span>
        </div>
        
        <div class="content-card">
            <h3>🏃♂️ 運動團契</h3>
            <p>通過運動建立友誼和信仰分享</p>
            <span class="status-indicator">活躍</span>
            <span style="font-size: 10px; color: #666;">6個項目，67名參與者</span>
        </div>
    </div>
    
    <script>
        console.log('團契互動團隊頁面載入完成 - 時間:', new Date().toLocaleTimeString());
    </script>

<!-- b100-cm-desk-kit -->
<link rel="stylesheet" href="../css/cm_desk.css" />
<script src="../js/cm_desk_registry.js"></script>
<script src="../js/cm_desk_kit.js"></script>
</body>
</html>
