<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>页面准备中 · Bible100</title>

  <link rel="stylesheet" href="../css/b100_landing_shared.css">

  <style>

    .b100-ph { max-width: 32em; margin: 40px auto; padding: 24px; text-align: center; }

    .b100-ph h1 { font-size: 1.2rem; color: #0f172a; margin: 0 0 10px; }

    .b100-ph p { font-size: 13px; color: #64748b; line-height: 1.6; }

    .b100-ph code { font-size: 11px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }

    .b100-ph-actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

    .b100-ph-actions a, .b100-ph-actions button {

      padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;

      text-decoration: none; border: 1px solid #cbd5e1; background: #fff; color: #0b5fa5; cursor: pointer;

    }

  </style>

  <script src="../js/shell_nav.js"></script>

</head>

<body class="b100-landing-page">

  <div class="b100-ph">

    <h1>🚧 此頁尚在整理中</h1>

    <p id="phTarget">您点的分支正在建设；请先走左侧菜单其他已就绪站点，或回模块路线图。</p>

    <p>目标路径：<code id="phPath">—</code></p>

    <div class="b100-ph-actions">

      <a href="#" id="phBackModule">↩ 回模块路线图</a>

      <a href="#" id="phBackSite">🏠 回全站首頁</a>

    </div>

  </div>

  <script>

    (function () {

      var params = new URLSearchParams(window.location.search || '');

      var target = params.get('target') || params.get('path') || '';

      var module = params.get('module') || '';

      if (target) {

        document.getElementById('phPath').textContent = target;

        document.getElementById('phTarget').textContent =

          '「' + target + '」尚在整理；请改走左侧 2、3 层菜单，或回模块路线图。';

      }

      var moduleLandings = {

        material: { sidebar: 'languages/sidebar_landing.html', content: 'languages/_landing/home.html' },

        study: { sidebar: 'bible_study/sidebar_landing.html', content: 'bible_study/_landing/home.html' },

        qna: { sidebar: 'qna/sidebar_landing.html', content: 'qna/_landing/home.html' },

        church: { sidebar: 'church_ministry/sidebar_church_gateway.html', content: 'church_ministry/_landing/gateway.html' },

        school: { sidebar: 'school_management/sidebar_landing.html', content: 'school_management/_landing/home.html' },

        ai: { sidebar: 'ai_tools/sidebar_landing.html', content: 'ai_tools/_landing/home.html' }

      };

      document.getElementById('phBackModule').addEventListener('click', function (e) {

        var m = moduleLandings[module] || moduleLandings.material;

        return bible100ShellNav(e, { sidebarUrl: m.sidebar, contentUrl: m.content });

      });

      document.getElementById('phBackSite').addEventListener('click', function (e) {

        return bible100ShellNav(e, { sidebarUrl: 'help/sidebar_site_map.html', contentUrl: 'help/site_home.html' });

      });

    })();

  </script>

</body>

</html>
