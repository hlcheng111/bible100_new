<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送給 AI - 選擇服務</title>
  <style>
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; margin: 20px; max-width: 720px; line-height: 1.5; color: #333; }
    h1 { font-size: 1.25rem; color: #0b5fa5; }
    .back { display: inline-block; margin-bottom: 1em; color: #0b5fa5; }
    .tabs { display: flex; gap: 0; margin-bottom: 0; border-bottom: 2px solid #e0e0e0; }
    .tab { padding: 10px 16px; background: #f5f5f5; border: 0; cursor: pointer; font-size: 13px; border-radius: 6px 6px 0 0; margin-right: 2px; }
    .tab.active { background: #0b5fa5; color: #fff; font-weight: 600; }
    .tab-content { display: none; padding: 16px; border: 1px solid #e0e0e0; border-top: 0; border-radius: 0 0 8px 8px; }
    .tab-content.active { display: block; }
    .ai-list { list-style: none; padding: 0; margin: 0; }
    .ai-list li { margin: 10px 0; padding: 12px 14px; background: #f8f9fa; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .ai-list a { color: #0b5fa5; text-decoration: none; font-weight: 500; }
    .ai-list a:hover { text-decoration: underline; }
    .ai-list .note { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <a href="javascript:history.back()" class="back">← 返回</a>
  <h1>送給 AI － 選擇服務</h1>
  <p>頂欄「送給 AI」會先複製當前頁的標題與網址，再依您選擇開啟以下任一 AI。此頁可從「送給 AI ▾」選單的「更多 AI…」開啟，用分頁切換免費／其他。</p>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="free">免費／免登入可試</button>
    <button type="button" class="tab" data-tab="other">其他</button>
  </div>
  <div id="free" class="tab-content active">
    <ul class="ai-list">
      <li><a href="https://copilot.microsoft.com/" target="_blank" rel="noopener">Microsoft Copilot</a><span class="note">免費，可用於摘要、問答</span></li>
      <li><a href="https://chat.openai.com/" target="_blank" rel="noopener">ChatGPT (OpenAI)</a><span class="note">有免費額度</span></li>
      <li><a href="https://claude.ai/" target="_blank" rel="noopener">Claude (Anthropic)</a><span class="note">有免費額度</span></li>
      <li><a href="https://gemini.google.com/" target="_blank" rel="noopener">Google Gemini</a><span class="note">免費版可用</span></li>
    </ul>
  </div>
  <div id="other" class="tab-content">
    <ul class="ai-list">
      <li><a href="https://www.perplexity.ai/" target="_blank" rel="noopener">Perplexity</a><span class="note">搜尋＋AI 回答</span></li>
      <li><a href="https://poe.com/" target="_blank" rel="noopener">Poe</a><span class="note">多模型入口</span></li>
    </ul>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        var id = t.getAttribute('data-tab');
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      });
    });
  </script>
</body>
</html>
