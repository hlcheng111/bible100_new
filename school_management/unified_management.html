<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統一管理 - 單頁多 Tab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f6f7fb; font-size: 12px; }
        .tabs { display: flex; gap: 4px; padding: 10px; background: #e8f4fd; border-bottom: 1px solid #c5d9f0; }
        .tabs a { padding: 8px 14px; color: #0b5fa5; text-decoration: none; border-radius: 6px; font-size: 12px; }
        .tabs a:hover { background: #d1ecff; }
        .tabs a.active { background: #0b5fa5; color: #fff; }
        .tab-panel { display: none; height: calc(100vh - 60px); }
        .tab-panel.active { display: block; }
        .tab-panel iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="tabs">
        <a href="#" class="tab-link active" data-tab="student-course">📚 學生選課</a>
        <a href="#" class="tab-link" data-tab="teacher-course">👨‍🏫 教師授課</a>
        <a href="#" class="tab-link" data-tab="student-class">🏫 學生分班</a>
    </div>
    <div id="panel-student-course" class="tab-panel active"><iframe src="student_course_unified.html"></iframe></div>
    <div id="panel-teacher-course" class="tab-panel"><iframe src="teacher_course_unified.html"></iframe></div>
    <div id="panel-student-class" class="tab-panel"><iframe src="student_class_unified.html"></iframe></div>
    <script>
        function switchTab(tab) {
            var link = document.querySelector('.tab-link[data-tab="' + tab + '"]');
            if (link) { link.click(); }
        }
        document.querySelectorAll('.tab-link').forEach(function(a) {
            a.onclick = function(e) { e.preventDefault();
                document.querySelectorAll('.tab-link').forEach(function(x) { x.classList.remove('active'); });
                document.querySelectorAll('.tab-panel').forEach(function(x) { x.classList.remove('active'); });
                this.classList.add('active');
                document.getElementById('panel-' + this.dataset.tab).classList.add('active');
            };
        });
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'switchTab' && e.data.tab) switchTab(e.data.tab);
        });
        var h = (location.hash || '').replace(/^#/, '');
        if (h && ['student-course','teacher-course','student-class'].indexOf(h) >= 0) switchTab(h);
    </script>
</body>
</html>
