<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的成績 - 學員入口</title>
    <base target="_parent">
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f6f7fb; margin: 0; padding: 20px; font-size: 14px; }
        .back { margin-bottom: 16px; }
        .back a { color: #0b5fa5; text-decoration: none; }
        .header { background: linear-gradient(135deg, #0b5fa5 0%, #2aa5ff 100%); color: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .stats { margin-bottom: 20px; }
        .stat { display: inline-block; padding: 12px 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-right: 12px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f6f7fb; color: #0b5fa5; }
        .empty { padding: 40px; text-align: center; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="back"><a href="index.html">← 返回學員入口</a></div>
    <div class="header">
        <h2>📊 我的成績</h2>
        <p id="studentInfo">請從學員入口選擇學員</p>
    </div>
    <div class="stats" id="stats"></div>
    <div id="gradeList"></div>
    <script src="../js/school-master-database.js"></script>
    <script>
        (function() {
            const params = new URLSearchParams(location.search);
            const studentId = parseInt(params.get('studentId'), 10);
            if (!studentId || !window.schoolDB) {
                document.getElementById('gradeList').innerHTML = '<p class="empty">請先從學員入口選擇學員，或載入示範資料。</p>';
                return;
            }
            const db = window.schoolDB.data;
            const student = (db.students || []).find(s => s.id === studentId);
            if (student) document.getElementById('studentInfo').textContent = student.name + ' 的成績記錄';
            const grades = (db.grade && db.grade.grades) || [];
            const mine = grades.filter(g => g.studentId === studentId);
            const courses = db.courses || [];
            const validScores = mine.filter(g => g.score != null).map(g => g.score);
            const avg = validScores.length ? (validScores.reduce((a,b)=>a+b,0) / validScores.length).toFixed(1) : '—';
            document.getElementById('stats').innerHTML = `<div class="stat">成績筆數：${mine.length}</div><div class="stat">平均分：${avg}</div>`;
            const rows = mine.slice(-20).reverse().map(g => {
                const c = courses.find(cr => cr.id === g.courseId);
                return `<tr><td>${c ? c.name : '—'}</td><td>${g.score ?? '—'}</td><td>${g.grade || '—'}</td><td>${g.examDate || '—'}</td><td>${g.semester || '—'}</td></tr>`;
            }).join('');
            document.getElementById('gradeList').innerHTML = rows
                ? `<table><thead><tr><th>課程</th><th>分數</th><th>等第</th><th>考試日期</th><th>學期</th></tr></thead><tbody>${rows}</tbody></table>`
                : '<p class="empty">尚無成績記錄</p>';
        })();
    </script>
</body>
</html>
