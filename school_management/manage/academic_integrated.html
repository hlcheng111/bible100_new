<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教务工作台 · 4 Tab | 学校管理</title>
  <link rel="stylesheet" href="../css/sch_workbench_shell.css" />
  <link rel="stylesheet" href="../../church_ministry/css/cm_responsive_tokens.css" />
  <script src="../../js/shell_nav.js"></script>
  <script src="../js/school-master-database.js"></script>
  <script src="../../js/central_member_db.js"></script>
  <script src="../../js/sch_scenario_ssot.js"></script>
  <script src="../../js/sch_member_guard.js"></script>
  <script src="../../js/sch_validation.js"></script>
  <script src="../../js/sch_sync_bridge.js"></script>
</head>
<body data-b100-module="school_management" data-b100-pattern="P-SCH-WORKBENCH">
  <header class="sch-wb-header">
    <h1>🏫 教务工作台 · 4 Tab</h1>
    <p>① 点名／成绩 · ② 报名审核 · ③ 财务对账 · ④ 系统管理（工程细节收纳于此）</p>
  </header>

  <div class="sch-wb-strip" id="sch-wb-strip">
    <span id="sch-wb-stats">载入中…</span>
    <button type="button" class="sch-wb-btn outline" id="sch-btn-backup">⬇ 一键备份 JSON</button>
    <button type="button" class="sch-wb-btn outline" id="sch-btn-seed">载入 30 人试用班</button>
    <a href="../load_school_seed.html" target="contentFrame" class="sch-wb-btn outline" style="text-decoration:none;display:inline-block;">完整示范</a>
  </div>

  <nav class="sch-shell-tabs" aria-label="教务 Tab">
    <button type="button" class="sch-shell-tab active cm-touch-target" data-tab="today">① 点名／成绩</button>
    <button type="button" class="sch-shell-tab cm-touch-target" data-tab="enroll">② 报名审核</button>
    <button type="button" class="sch-shell-tab cm-touch-target" data-tab="finance">③ 财务对账</button>
    <button type="button" class="sch-shell-tab cm-touch-target" data-tab="admin">④ 系统管理</button>
  </nav>

  <div id="sch-panel-today" class="sch-shell-panel">
    <p class="muted" style="margin:0 0 8px;"><strong>小白入口</strong> — 点情境，不必懂 A–E</p>
    <div id="sch-wb-scenarios" class="sch-wb-scenarios"></div>
  </div>

  <iframe id="sch-integrated-subframe" class="sch-shell-frame" title="教务子工作区" hidden></iframe>

  <div id="sch-wb-toast" hidden role="status" style="position:fixed;bottom:16px;right:16px;background:#166534;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;z-index:99;"></div>

  <script src="../js/sch_workbench_home.js"></script>
  <script src="../js/sch_workbench_shell.js"></script>
</body>
</html>
