<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社團管理 - Clubs</title>
    <link rel="stylesheet" href="../css/module_common.css">
</head>
<body>
    <div class="module-header">
        <h1>👥 社團管理</h1>
        <p>詩歌社、查經社、戲劇社等社團</p>
        <details>
            <summary>📋 功能與使用說明</summary>
            <div><p><b>此頁是為誰而設？</b> 活動負責人、教務。</p>
            <p><b>有什麼功能？</b> 新增社團、編輯／刪除、匯出 CSV。</p></div>
        </details>
    </div>

    <div class="module-card">
        <div class="module-card-title">➕ 新增社團</div>
        <form id="f" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
            <div><label class="stat-label">名稱</label><br><input name="name" class="module-input" required placeholder="社團名稱"></div>
            <div><label class="stat-label">指導老師</label><br><select name="advisorId" class="module-input" style="min-width:140px;"></select></div>
            <div><label class="stat-label">聯絡人</label><br><input name="contact" class="module-input" placeholder="選填"></div>
            <div><br><button type="submit" class="module-btn">新增</button></div>
        </form>
    </div>

    <div class="module-card">
        <div class="module-card-title">📋 社團列表 <button class="module-btn module-btn-secondary" id="btnExport" style="float:right;">📤 匯出 CSV</button></div>
        <div id="list"></div>
    </div>

    <a href="../../dashboard.html" target="contentFrame" class="module-btn module-btn-secondary">返回儀表板</a>

    <script src="../../js/school-master-database.js"></script>
    <script>
        (function() {
            const db = window.schoolDB;
            if (!db) return;
            if (db.ensureSeedFull) db.ensureSeedFull();

            const clubs = (db.data.activity && db.data.activity.clubs) || [];
            const teachers = db.data.teachers || [];

            function draw() {
                const sel = document.querySelector('select[name="advisorId"]');
                sel.innerHTML = '<option value="">-- 選擇教師 --</option>' + teachers.map(t => '<option value="' + t.id + '">' + (t.name || t.teacherNumber || t.id) + '</option>').join('');

                const body = clubs.map(x => {
                    const t = teachers.find(tc => tc.id === x.advisorId);
                    return '<tr><td>' + x.id + '</td><td>' + (x.name || '—') + '</td><td>' + (t ? t.name : (x.advisor || x.advisorId || '—')) + '</td><td>' + (x.memberCount || x.contact || '—') + '</td><td><a href="#" onclick="editC(' + x.id + ');return false;">編輯</a> | <a href="#" onclick="delC(' + x.id + ');return false;">刪除</a></td></tr>';
                }).join('');
                document.getElementById('list').innerHTML = '<table class="module-table"><thead><tr><th>ID</th><th>名稱</th><th>指導老師</th><th>成員數／聯絡</th><th>操作</th></tr></thead><tbody>' + (body || '<tr><td colspan="5">尚無社團，請上方新增</td></tr>') + '</tbody></table>';
            }

            document.getElementById('f').onsubmit = function(e) {
                e.preventDefault();
                const fm = new FormData(this);
                const aid = fm.get('advisorId');
                db.insert('activity.clubs', {
                    name: (fm.get('name') || '').trim(),
                    advisorId: aid ? parseInt(aid, 10) : undefined,
                    advisor: aid ? (teachers.find(t => t.id == aid) || {}).name : undefined,
                    contact: (fm.get('contact') || '').trim(),
                    memberCount: 0,
                    status: 'active'
                });
                this.reset();
                draw();
            };

            window.editC = function(id) {
                const rec = clubs.find(x => x.id === id);
                if (!rec) return;
                const v = prompt('JSON 編輯（不改 id）', JSON.stringify(rec, null, 2));
                if (!v) return;
                try {
                    const o = JSON.parse(v);
                    delete o.id;
                    delete o.createdAt;
                    delete o.updatedAt;
                    db.update('activity.clubs', id, o);
                    draw();
                } catch (e) { alert('JSON 無效'); }
            };
            window.delC = function(id) {
                if (confirm('確認刪除？')) { db.delete('activity.clubs', id); draw(); }
            };

            document.getElementById('btnExport').onclick = function() {
                const cols = ['id', 'name', 'advisorId', 'advisor', 'contact', 'memberCount'];
                const head = cols.join(',');
                const body = clubs.map(r => cols.map(k => '"' + String(r[k] ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
                const A = document.createElement('a');
                A.href = URL.createObjectURL(new Blob(['\ufeff' + head + '\n' + body], { type: 'text/csv;charset=utf-8' }));
                A.download = 'clubs_' + new Date().toISOString().slice(0, 10) + '.csv';
                A.click();
            };

            draw();
        })();
    </script>
</body>
</html>
