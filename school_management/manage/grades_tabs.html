<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成績管理 - 單頁多 Tab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f6f7fb; font-size: 12px; }
        .module-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #0b5fa5; color: #fff; font-size: 13px;
        }
        .module-topbar a { color: #fff; text-decoration: none; opacity: 0.9; }
        .module-topbar a:hover { opacity: 1; }
        .tabs { display: flex; gap: 4px; padding: 10px; background: #e8f4fd; border-bottom: 1px solid #c5d9f0; flex-wrap: wrap; }
        .tabs a { padding: 8px 14px; color: #0b5fa5; text-decoration: none; border-radius: 6px; font-size: 12px; }
        .tabs a:hover { background: #d1ecff; }
        .tabs a.active { background: #0b5fa5; color: #fff; }
        .tab-panel { display: none; height: calc(100vh - 100px); }
        .tab-panel.active { display: block; }
        .tab-panel iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="module-topbar">
        <span>📊 成績管理</span>
        <a href="../dashboard.html" target="contentFrame">返回儀表板</a>
    </div>
    <div class="tabs">
        <a href="#" class="tab-link active" data-tab="index">成績管理</a>
        <a href="#" class="tab-link" data-tab="progress">進度追蹤</a>
        <a href="#" class="tab-link" data-tab="reports">成績報表</a>
        <a href="#" class="tab-link" data-tab="exams">📝 小測／考試</a>
        <a href="#" class="tab-link" data-tab="certificates">🎓 結業證書</a>
    </div>
    <div id="panel-index" class="tab-panel active"><iframe src="grades/index.html"></iframe></div>
    <div id="panel-progress" class="tab-panel"><iframe src="grades/progress.html"></iframe></div>
    <div id="panel-reports" class="tab-panel"><iframe src="grades/reports.html"></iframe></div>
    <div id="panel-exams" class="tab-panel"><iframe src="grades/exams.html"></iframe></div>
    <div id="panel-certificates" class="tab-panel"><iframe src="graduation_certificates.html"></iframe></div>
    <script>
        document.querySelectorAll('.tab-link').forEach(function(a) {
            a.onclick = function(e) { e.preventDefault();
                document.querySelectorAll('.tab-link').forEach(function(x) { x.classList.remove('active'); });
                document.querySelectorAll('.tab-panel').forEach(function(x) { x.classList.remove('active'); });
                this.classList.add('active');
                document.getElementById('panel-' + this.dataset.tab).classList.add('active');
            };
        });
    </script>
</body>
</html>
