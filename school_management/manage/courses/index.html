<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程列表 - Course Management</title>
    <link rel="stylesheet" href="../css/module_common.css">
</head>
<body>
    <div class="module-header">
        <h1>📚 課程列表 · Course List</h1>
        <p>主日學、培訓課程、靈命培育、門徒訓練</p>
        <details>
            <summary>📋 功能與使用說明</summary>
            <div><p><b>此頁是為誰而設？</b> 主日學負責人、教師、教育事工同工。</p>
            <p><b>有什麼功能？</b> 課程列表、排程、選課統計。</p>
            <p><b>如何入手？</b> 資料來自 SchoolMasterDatabase，首次使用請先至儀表板載入示範資料。</p></div>
        </details>
    </div>

    <div class="module-card">
        <div class="module-card-title">📊 統計</div>
        <div class="stats-row">
            <div class="stat-pill"><div class="stat-num" id="statTotal">0</div><div class="stat-label">總課程數</div></div>
            <div class="stat-pill"><div class="stat-num" id="statActive">0</div><div class="stat-label">進行中</div></div>
            <div class="stat-pill"><div class="stat-num" id="statEnrollments">0</div><div class="stat-label">選課記錄</div></div>
        </div>
    </div>

    <div class="module-card">
        <div class="module-card-title">📅 課程排程</div>
        <form id="scheduleForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
            <div><label class="stat-label">課程</label><br><select name="courseId" required class="module-input" style="min-width:160px;"></select></div>
            <div><label class="stat-label">星期</label><br><select name="day" class="module-input"><option value="一">一</option><option value="二">二</option><option value="三">三</option><option value="四">四</option><option value="五">五</option><option value="六">六</option><option value="日">日</option></select></div>
            <div><label class="stat-label">時間</label><br><input name="time" class="module-input" placeholder="10:00-12:00" style="width:110px;"></div>
            <div><label class="stat-label">教室</label><br><input name="room" class="module-input" value="A101" style="width:70px;"></div>
            <div><br><button type="submit" class="module-btn">儲存</button></div>
        </form>
        <div id="scheduleList"></div>
    </div>

    <div class="module-card">
        <div class="module-card-title">📋 課程列表</div>
        <div id="courseList"></div>
    </div>

    <a href="../../dashboard.html" target="contentFrame" class="module-btn module-btn-secondary">返回儀表板</a>

    <script src="../../js/school-master-database.js"></script>
    <script>
        function load() {
            if (!window.schoolDB) { document.getElementById('courseList').innerHTML = '<div class="empty-state">請先載入 SchoolMasterDatabase</div>'; return; }
            if (window.schoolDB.ensureSeedFull) window.schoolDB.ensureSeedFull();
            const db = window.schoolDB.data;
            let courses = db.courses || [];
            const teachers = db.teachers || [];
            const enrollments = (db.student && db.student.enrollments) || [];

            document.getElementById('statTotal').textContent = courses.length;
            document.getElementById('statActive').textContent = courses.filter(c => c.status === 'active').length;
            document.getElementById('statEnrollments').textContent = enrollments.length;

            const sel = document.querySelector('select[name="courseId"]');
            sel.innerHTML = '<option value="">-- 選擇課程 --</option>' + courses.map(c => '<option value="' + c.id + '">' + (c.name || c.code || c.id) + '</option>').join('');

            let html = courses.length ? '<table class="module-table"><thead><tr><th>代碼</th><th>課程名稱</th><th>科目</th><th>教師</th><th>狀態</th></tr></thead><tbody>' + courses.map(c => {
                const t = teachers.find(x => x.id === c.teacherId);
                return '<tr><td>' + (c.code || '—') + '</td><td>' + (c.name || '—') + '</td><td>' + (c.subject || '—') + '</td><td>' + (t ? t.name : '—') + '</td><td>' + (c.status === 'active' ? '進行中' : '準備中') + '</td></tr>';
            }).join('') + '</tbody></table>' : '<div class="empty-state">尚無課程</div>';
            document.getElementById('courseList').innerHTML = html;

            const schedules = (db.course && db.course.schedules) || [];
            let schedHtml = schedules.length ? '<table class="module-table"><thead><tr><th>課程</th><th>星期</th><th>時間</th><th>教室</th></tr></thead><tbody>' + schedules.map(s => {
                const c = courses.find(x => x.id === s.courseId);
                return '<tr><td>' + (c ? c.name : s.courseId) + '</td><td>' + (s.day || '—') + '</td><td>' + (s.time || '—') + '</td><td>' + (s.room || '—') + '</td></tr>';
            }).join('') + '</tbody></table>' : '<div class="empty-state">尚無排程</div>';
            document.getElementById('scheduleList').innerHTML = schedHtml;
        }

        document.getElementById('scheduleForm').onsubmit = function(e) {
            e.preventDefault();
            const f = new FormData(this);
            const courseId = parseInt(f.get('courseId'), 10);
            if (!courseId || !window.schoolDB) return;
            window.schoolDB.insert('course.schedules', { courseId: courseId, day: f.get('day') || '一', time: f.get('time') || '10:00-12:00', room: f.get('room') || 'A101' });
            this.reset();
            load();
        };

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
