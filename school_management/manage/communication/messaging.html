<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內部訊息 - Internal Messaging</title>
    <link rel="stylesheet" href="../css/module_common.css">
</head>
<body>
    <div class="module-header">
        <h1>✉️ 內部訊息</h1>
        <p>發送內部訊息給教師或同工</p>
        <details>
            <summary>📋 功能與使用說明</summary>
            <div><p><b>此頁是為誰而設？</b> 行政、班導。</p>
            <p><b>有什麼功能？</b> 發送內部訊息，收件人可填 teacher_1 或 all。</p></div>
        </details>
    </div>

    <div class="module-card">
        <div class="module-card-title">📤 發送內部訊息</div>
        <form id="f" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
            <div><label class="stat-label">收件人</label><br><input name="toUser" class="module-input" placeholder="teacher_1 或 all" style="min-width:140px;"></div>
            <div><label class="stat-label">內容</label><br><input name="content" class="module-input" placeholder="訊息內容" style="min-width:220px;"></div>
            <div><br><button type="submit" class="module-btn">發送</button></div>
        </form>
    </div>

    <div class="module-card">
        <div class="module-card-title">📋 訊息列表</div>
        <div id="list"></div>
    </div>

    <a href="../../dashboard.html" target="contentFrame" class="module-btn module-btn-secondary">返回儀表板</a>

    <script src="../../js/school-master-database.js"></script>
    <script>
        (function() {
            const db = window.schoolDB;
            if (!db) return;
            if (db.ensureSeedFull) db.ensureSeedFull();

            const messages = (db.data.communication && db.data.communication.messages) || [];

            function draw() {
                const a = messages.filter(m => (m.channel || '') === 'internal' || !m.channel).slice(-200).reverse();
                const body = a.map(m => '<tr><td>' + m.id + '</td><td>' + (m.toUser || m.to_user || '—') + '</td><td>' + (m.channel || '—') + '</td><td>' + (m.content || '—') + '</td><td>' + (m.createdAt || m.created_at || '').slice(0, 16) + '</td></tr>').join('');
                document.getElementById('list').innerHTML = '<table class="module-table"><thead><tr><th>ID</th><th>收件人</th><th>頻道</th><th>內容</th><th>時間</th></tr></thead><tbody>' + (body || '<tr><td colspan="5">尚無訊息</td></tr>') + '</tbody></table>';
            }

            document.getElementById('f').onsubmit = function(e) {
                e.preventDefault();
                const fm = new FormData(this);
                db.insert('communication.messages', {
                    fromUser: 'staff',
                    toUser: (fm.get('toUser') || '').trim(),
                    channel: 'internal',
                    content: (fm.get('content') || '').trim()
                });
                this.reset();
                draw();
            };

            draw();
        })();
    </script>
</body>
</html>
