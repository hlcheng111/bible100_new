<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生統計 - Student Analytics</title>
    <link rel="stylesheet" href="../css/module_common.css">
</head>
<body>
    <div class="module-header">
        <h1>📊 學生統計 · Student Analytics</h1>
        <p>按班級、性別分布統計</p>
        <details>
            <summary>📋 功能與使用說明</summary>
            <div><p><b>此頁是為誰而設？</b> 主日學負責人、行政同工。</p>
            <p><b>有什麼功能？</b> 學生總數、班級分布、性別分布、匯出 CSV。</p></div>
        </details>
    </div>

    <div class="module-card">
        <div class="module-card-title">📊 統計概覽</div>
        <div class="stats-row">
            <div class="stat-pill"><div class="stat-num" id="statTotal">0</div><div class="stat-label">學生總數</div></div>
            <div class="stat-pill"><div class="stat-num" id="statClasses">0</div><div class="stat-label">班級數</div></div>
            <div class="stat-pill"><div class="stat-num" id="statMale">0</div><div class="stat-label">男</div></div>
            <div class="stat-pill"><div class="stat-num" id="statFemale">0</div><div class="stat-label">女</div></div>
        </div>
    </div>

    <div class="module-card">
        <div class="module-card-title">📋 按班級分布</div>
        <div id="byClass"></div>
        <button class="module-btn" id="expClass">📤 匯出班級分布 CSV</button>
    </div>

    <div class="module-card">
        <div class="module-card-title">📋 按性別分布</div>
        <div id="byGender"></div>
        <button class="module-btn" id="expGender">📤 匯出性別分布 CSV</button>
    </div>

    <a href="../../dashboard.html" target="contentFrame" class="module-btn module-btn-secondary">返回儀表板</a>

    <script src="../../js/school-master-database.js"></script>
    <script>
        function load() {
            if (!window.schoolDB) return;
            if (window.schoolDB.ensureSeedFull) window.schoolDB.ensureSeedFull();
            const s = window.schoolDB.data.students || [];
            const byClass = {}, byGender = { 男: 0, 女: 0 };
            s.forEach(x => {
                byClass[x.class_id || '未分班'] = (byClass[x.class_id || '未分班'] || 0) + 1;
                byGender[x.gender || '未知'] = (byGender[x.gender || '未知'] || 0) + 1;
            });

            document.getElementById('statTotal').textContent = s.length;
            document.getElementById('statClasses').textContent = Object.keys(byClass).length;
            document.getElementById('statMale').textContent = byGender['男'] || 0;
            document.getElementById('statFemale').textContent = byGender['女'] || 0;

            const classArr = Object.entries(byClass);
            let classHtml = classArr.length ? '<table class="module-table"><thead><tr><th>班級</th><th>人數</th></tr></thead><tbody>' + classArr.map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('') + '</tbody></table>' : '<div class="empty-state">尚無資料</div>';
            document.getElementById('byClass').innerHTML = classHtml;

            const genderArr = Object.entries(byGender);
            let genderHtml = genderArr.length ? '<table class="module-table"><thead><tr><th>性別</th><th>人數</th></tr></thead><tbody>' + genderArr.map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('') + '</tbody></table>' : '<div class="empty-state">尚無資料</div>';
            document.getElementById('byGender').innerHTML = genderHtml;

            document.getElementById('expClass').onclick = function(e) {
                e.preventDefault();
                const head = 'class_id,count', body = classArr.map(([k, v]) => k + ',' + v).join('\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([head + '\n' + body], { type: 'text/csv' }));
                a.download = 'student_by_class.csv';
                a.click();
            };
            document.getElementById('expGender').onclick = function(e) {
                e.preventDefault();
                const head = 'gender,count', body = genderArr.map(([k, v]) => k + ',' + v).join('\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([head + '\n' + body], { type: 'text/csv' }));
                a.download = 'student_by_gender.csv';
                a.click();
            };
        }
        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
