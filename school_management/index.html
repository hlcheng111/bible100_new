<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校管理系統 - School Management System</title>
    <style type="text/css">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f6f7fb; font-size: 12px; }
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 55px;
            background: #0b5fa5; color: #fff; border-bottom: 2px solid #2aa5ff; z-index: 999;
        }
        .topbar-inner {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; height: 55px; padding: 0 10px;
        }
        .brand { font-weight: bold; font-size: 13px; }
        .brand small { color: #a5d6ff; font-size: 9px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 5px; }
        .nav-links a {
            display: inline-block; padding: 5px 10px; color: #fff; text-decoration: none;
            border-radius: 3px; font-size: 9px; background: #2aa5ff;
        }
        .nav-links a:hover { background: #1a8cff; }
        .main-container {
            display: flex; margin-top: 0; height: calc(100vh - 55px);
            padding-top: 0;
        }
        body.has-school-trust .main-container {
            height: calc(100vh - 120px);
            margin-top: 120px;
        }
        .sidebar {
            width: 250px; background: #fff; border-right: 1px solid #e0e0e0;
            overflow-y: auto; font-size: 11px;
        }
        .content {
            flex: 1; padding: 0; overflow: hidden; background: #f6f7fb;
        }
        .content iframe { width: 100%; height: 100%; border: none; }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 200px; }
        }
    </style>
</head>
<body class="has-school-trust">
    <div class="topbar" style="height:auto;min-height:55px;">
        <div class="topbar-inner" style="flex-wrap:wrap;height:auto;padding-bottom:6px;">
            <div class="brand">🏫 學校管理 <small>即點即用 · PC/手機</small></div>
            <div class="nav-links">
                <a href="../index.html" target="_top">🏠 回主頁</a>
                <a href="dashboard.html" target="contentFrame">📊 儀表板</a>
                <a href="portal/index.html" target="contentFrame">📚 學員入口</a>
                <a href="load_school_seed.html" target="contentFrame">🔄 載入示範</a>
            </div>
        </div>
        <div id="schoolTrustMount" style="width:100%;padding:4px 10px 6px;background:#e8f4fd;"></div>
    </div>

    <div class="main-container">
        <iframe src="sidebar.html" class="sidebar" name="sidebarFrame"></iframe>
        <div class="content">
            <iframe src="dashboard.html" name="contentFrame"></iframe>
        </div>
    </div>

    <script src="../js/cloud_config.js"></script>
    <script src="../js/data_trust_badge.js"></script>
    <script src="js/school-master-database.js"></script>
    <script>
        (function() {
            if (window.schoolDB && typeof window.schoolDB.ensureSeedFull === 'function') window.schoolDB.ensureSeedFull();
            if (window.DataTrustBadge && DataTrustBadge.renderSchoolEntryTrust) {
                DataTrustBadge.renderSchoolEntryTrust('schoolTrustMount');
            }
            console.log('🏫 School Management 系統啟動');
        })();
    </script>
    <script src="../js/shell_contract.js"></script>
    <script>
        if (window.B100ShellContract && typeof window.B100ShellContract.validate === 'function') {
            window.B100ShellContract.validate('school_management/index.html');
        }
    </script>
    <script src="../js/module_navigation.js"></script>
    <div id="global-tools-root"></div>
    <script src="../js/global-tools.js"></script>
</body>
</html>
