<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課程完成登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h1 class="text-xl font-bold">課程完成登記</h1>
        <div class="flex gap-2 flex-wrap">
          <a href="manage/graduation_certificates.html" target="contentFrame" class="px-3 py-2 border rounded text-sm bg-blue-50 text-blue-800">🎓 結業證書</a>
          <a href="dashboard.html" class="px-3 py-2 border rounded text-sm">返回 School Dashboard</a>
        </div>
      </div>
      <p class="text-sm text-slate-600 mt-2">W3：先依學校成績判定及格 → 可核發列印證書 → 再回寫 <code>CentralMemberDB</code>（<code>training_credits</code>／<code>skills</code>／trainings）。</p>
    </header>

    <section class="bg-white border border-slate-200 rounded-xl p-4 mb-4" id="schoolSection">
      <h2 class="font-semibold mb-3">① 學校學籍（成績及格判定）</h2>
      <div class="grid md:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm mb-1">選擇學生</label>
          <select id="schoolStudent" class="w-full border rounded px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">選擇課程</label>
          <select id="schoolCourse" class="w-full border rounded px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">及格線</label>
          <input id="passScore" type="number" min="0" max="100" value="60" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="flex items-end gap-2 flex-wrap">
          <button id="btnCheck" class="px-3 py-2 rounded bg-slate-700 text-white text-sm font-semibold">檢查及格</button>
          <button id="btnIssueCert" class="px-3 py-2 rounded bg-emerald-600 text-white text-sm font-semibold">核發並列印證書</button>
        </div>
      </div>
      <p id="checkStatus" class="text-sm text-slate-600 mt-3"></p>
    </section>

    <section class="bg-white border border-slate-200 rounded-xl p-4">
      <h2 class="font-semibold mb-3">② 回寫中央會員庫</h2>
      <div class="grid md:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm mb-1">選擇會友</label>
          <select id="member" class="w-full border rounded px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">課程名稱</label>
          <input id="course" class="w-full border rounded px-3 py-2 text-sm" placeholder="例如：門徒培訓進階">
        </div>
        <div>
          <label class="block text-sm mb-1">增加學分（training_credits）</label>
          <input id="credits" type="number" min="1" value="1" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm mb-1">新增技能標籤</label>
          <input id="skill" class="w-full border rounded px-3 py-2 text-sm" placeholder="例如：教導,小組帶領">
        </div>
      </div>
      <div class="mt-4 flex items-center gap-2 flex-wrap">
        <button id="submit" class="px-3 py-2 rounded bg-blue-600 text-white text-sm font-semibold">登記完課並回寫</button>
        <span id="status" class="text-sm text-slate-600"></span>
      </div>
    </section>
  </main>

  <script src="js/school-master-database.js"></script>
  <script src="../js/church_data_bridge_phase1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/persistence_provider.js"></script>
  <script src="../js/central_member_db.js"></script>
  <script>
    (function () {
      var schoolDB = window.schoolDB;
      var memberSel = document.getElementById("member");
      var status = document.getElementById("status");
      var checkStatus = document.getElementById("checkStatus");
      var courseInput = document.getElementById("course");

      function esc(v) {
        var d = document.createElement("div");
        d.textContent = String(v == null ? "" : v);
        return d.innerHTML;
      }

      function loadSchoolPickers() {
        if (!schoolDB) {
          checkStatus.textContent = "SchoolMasterDatabase 未載入。";
          return;
        }
        var students = (schoolDB.data.students || []).filter(function (s) { return s.status !== "pending"; });
        var courses = (schoolDB.data.courses || []).filter(function (c) { return c.status !== "inactive"; });
        document.getElementById("schoolStudent").innerHTML = students.map(function (s) {
          return '<option value="' + s.id + '">' + esc(s.name) + (s.memberId ? " · 會友#" + s.memberId : "") + "</option>";
        }).join("") || '<option value="">— 尚無學生 —</option>';
        document.getElementById("schoolCourse").innerHTML = courses.map(function (c) {
          return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
        }).join("") || '<option value="">— 尚無課程 —</option>';
        if (courses.length) courseInput.value = courses[0].name || "";
      }

      document.getElementById("schoolCourse").addEventListener("change", function () {
        var cid = Number(this.value);
        var c = (schoolDB.data.courses || []).find(function (x) { return x.id === cid; });
        if (c) courseInput.value = c.name || "";
      });

      document.getElementById("schoolStudent").addEventListener("change", function () {
        var sid = Number(this.value);
        var s = (schoolDB.data.students || []).find(function (x) { return x.id === sid; });
        if (s && s.memberId && memberSel) {
          for (var i = 0; i < memberSel.options.length; i++) {
            if (Number(memberSel.options[i].value) === Number(s.memberId)) {
              memberSel.selectedIndex = i;
              break;
            }
          }
        }
      });

      document.getElementById("btnCheck").addEventListener("click", function () {
        if (!schoolDB || !schoolDB.checkCourseCompletion) return;
        var sid = Number(document.getElementById("schoolStudent").value);
        var cid = Number(document.getElementById("schoolCourse").value);
        var pass = Number(document.getElementById("passScore").value) || 60;
        if (!sid || !cid) return alert("請選擇學生與課程");
        var r = schoolDB.checkCourseCompletion(sid, cid, pass);
        checkStatus.textContent = r.eligible
          ? "✅ 已達及格（" + r.score + " 分）— 可核發證書"
          : "⚠️ " + r.reason + (r.score != null ? "（目前 " + r.score + " 分）" : "");
      });

      document.getElementById("btnIssueCert").addEventListener("click", function () {
        if (!schoolDB || !schoolDB.issueCertificate) return;
        var sid = Number(document.getElementById("schoolStudent").value);
        var cid = Number(document.getElementById("schoolCourse").value);
        var pass = Number(document.getElementById("passScore").value) || 60;
        if (!sid || !cid) return alert("請選擇學生與課程");
        try {
          var cert = schoolDB.issueCertificate(sid, cid, { passScore: pass });
          checkStatus.textContent = "✅ 已核發證書 " + cert.certificateNo;
          var w = window.open("", "_blank", "width=720,height=640");
          if (w) {
            w.document.write(schoolDB.buildCertificateHtml(cert));
            w.document.close();
          }
        } catch (err) {
          alert(err.message || err);
        }
      });

      if (!window.CentralMemberDB) {
        status.textContent = "CentralMemberDB 未載入。";
        loadSchoolPickers();
        return;
      }
      var db = CentralMemberDB.get() || {};
      var members = Array.isArray(db.members) ? db.members : [];
      var trainings = Array.isArray(db.trainings) ? db.trainings : [];

      memberSel.innerHTML = members.map(function (m) {
        return '<option value="' + m.id + '">' + esc(m.name) + " (#" + m.id + ")</option>";
      }).join("");

      document.getElementById("submit").addEventListener("click", function () {
        var memberId = Number(memberSel.value);
        var course = String(document.getElementById("course").value || "").trim();
        var credits = Math.max(1, Number(document.getElementById("credits").value || 1));
        var skillRaw = String(document.getElementById("skill").value || "").trim();
        if (!memberId || !course) {
          status.textContent = "請選擇會友並填寫課程名稱。";
          return;
        }

        var target = members.find(function (m) { return Number(m.id) === memberId; });
        if (!target) {
          status.textContent = "找不到會友資料。";
          return;
        }

        var oldCredits = Number(target.training_credits || 0);
        target.training_credits = oldCredits + credits;
        if (skillRaw) {
          var oldSkills = String(target.skills || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean);
          skillRaw.split(",").map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (s) {
            if (oldSkills.indexOf(s) < 0) oldSkills.push(s);
          });
          target.skills = oldSkills.join(",");
        }

        trainings.push({
          id: trainings.length ? Number(trainings[trainings.length - 1].id || 0) + 1 : 1,
          memberId: memberId,
          courseName: course,
          completedDate: new Date().toISOString().split("T")[0],
          instructor: "系統登記",
          grade: "A"
        });

        db.members = members;
        db.trainings = trainings;
        var ok = CentralMemberDB.set(db);
        if (ok && window.ChurchDataBridge && typeof window.ChurchDataBridge.triggerDataSync === "function") {
          try { window.ChurchDataBridge.triggerDataSync("course_completion_updated"); } catch (e) {}
        }
        status.textContent = ok
          ? "已回寫 CentralMemberDB（training_credits 與 skills 已更新）"
          : "回寫失敗，請檢查 localStorage 權限。";
      });

      loadSchoolPickers();
    })();
  </script>
</body>
</html>
