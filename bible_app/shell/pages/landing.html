<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>聖經跑道</title>
  <link rel="stylesheet" href="../css/page.css?v=20260810g" />
  <link rel="stylesheet" href="../css/landing-tracks.css?v=20260810g" />
  <script src="../js/page_boot.js?v=20260810g"></script>
  <script src="../js/data_bundle.js?v=20260810g"></script>
  <script src="../js/data_loader.js?v=20260810g"></script>
  <script src="../js/page_locale.js?v=20260810g"></script>
  <script src="../js/locale_pick.js?v=20260810g"></script>
  <script src="../js/bible_reader_shared.js?v=20260810g"></script>
  <script src="../js/page_links.js?v=20260810g"></script>
  <script src="../js/read_progress.js?v=20260810g"></script>
  <script src="../js/track_registry.js?v=20260810g"></script>
  <script src="../js/frame_sync.js?v=20260810g"></script>
</head>
<body>
  <div class="landing-page">
    <header class="landing-hero" id="landingWhat">
      <p class="landing-hero__mascot" aria-hidden="true">🦁</p>
      <h1 id="landingTitle">歡迎來到聖經跑道</h1>
      <p class="landing-hero__tagline" id="landingTagline">每天約 5 分鐘，陪你慢慢讀聖經。</p>
      <p class="landing-hero__lead" id="landingLead">
        不用背課、不用考試。斷更了也沒關係，回來就好。
      </p>
    </header>

    <section class="landing-cta" aria-labelledby="quickTitle">
      <span class="landing-cta__eyebrow" id="quickEyebrow">今日亮光 · 約 5 分鐘</span>
      <h2 class="landing-cta__title" id="quickTitle">開始今日關卡</h2>
      <p class="landing-cta__hint" id="quickHint">第一次來也可以直接按，不用先設定。</p>
      <button type="button" class="landing-cta__btn" id="quickStartBtn">開始今日關卡 →</button>
    </section>

    <aside class="landing-reassure" id="landingReassure" aria-label="安心說明">
      <p class="landing-reassure__text" id="reassureText">💚 斷更沒關係 · 不考勤 · 歡迎回來</p>
    </aside>

    <nav class="landing-aux" id="landingAux" aria-label="輔助功能">
      <button type="button" class="landing-aux__btn" data-aux="pacing" id="auxPacing">
        <span class="landing-aux__icon">🤝</span>
        <span class="landing-aux__label" id="auxPacingLabel">同跑隊伍</span>
      </button>
      <button type="button" class="landing-aux__btn" data-aux="qna" id="auxQna">
        <span class="landing-aux__icon">💬</span>
        <span class="landing-aux__label" id="auxQnaLabel">牧養問答</span>
      </button>
      <button type="button" class="landing-aux__btn" data-aux="ai" id="auxAi">
        <span class="landing-aux__icon">✨</span>
        <span class="landing-aux__label" id="auxAiLabel">智慧導師</span>
      </button>
    </nav>

    <section class="landing-flow" aria-labelledby="flowTitle">
      <h2 class="landing-flow__title" id="flowTitle">每天四步就夠了</h2>
      <div class="landing-flow__demo" id="flowDemo" aria-hidden="true">
        <span class="landing-flow__arrow">☀️</span>
        <span class="landing-flow__arrow-sep">→</span>
        <span class="landing-flow__arrow">📖</span>
        <span class="landing-flow__arrow-sep">→</span>
        <span class="landing-flow__arrow">✅</span>
        <span class="landing-flow__arrow-sep">→</span>
        <span class="landing-flow__arrow">🤝</span>
      </div>
      <ol class="landing-flow__steps" id="flowSteps"></ol>
    </section>

    <section class="landing-story" id="landingStory">
      <p id="storyText">三十日計畫會帶你走過創造、救贖、教會與新天新地的大故事——不是零散金句。</p>
    </section>

    <div class="landing-stats landing-stats--compact">
      <div class="landing-stat">⭐ <span id="statStarsLabel">金星</span><strong id="statStars">0</strong></div>
      <div class="landing-stat">🔥 <span id="statStreakLabel">連續天</span><strong id="statStreak">0</strong></div>
    </div>

    <details class="landing-explore" id="landingExplore">
      <summary id="exploreSummary">想多探索？點開看四條跑道</summary>
      <div class="track-cards" id="trackCards" aria-live="polite"></div>
      <p class="landing-foot" id="landingFoot">任一路線讀經時，可選四語並排或雙語對照。</p>
    </details>

    <nav class="landing-help" aria-label="說明入口">
      <button type="button" class="landing-help__card" id="helpWhat" data-help="what">
        <span class="landing-help__icon">？</span>
        <span class="landing-help__label" id="helpWhatLabel">這是什麼</span>
      </button>
      <button type="button" class="landing-help__card" id="helpHow" data-help="how">
        <span class="landing-help__icon">▶</span>
        <span class="landing-help__label" id="helpHowLabel">怎麼用</span>
      </button>
      <button type="button" class="landing-help__card" id="helpWhy" data-help="why">
        <span class="landing-help__icon">❤</span>
        <span class="landing-help__label" id="helpWhyLabel">為什麼做</span>
      </button>
    </nav>

    <footer class="landing-version" id="landingVersion" aria-label="版本"></footer>
  </div>
  <script src="../js/runtime_mode.js?v=20260810g"></script>
  <script src="../js/landing_tracks.js?v=20260810g"></script>
</body>
</html>
