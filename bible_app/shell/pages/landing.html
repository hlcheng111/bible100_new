<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>聖經跑道</title>
  <link rel="stylesheet" href="../css/page.css?v=20260903w1" />
  <link rel="stylesheet" href="../css/landing-tracks.css?v=20260903w1" />
  <script src="../js/page_boot.js?v=20260903w1"></script>
  <script src="../js/data_bundle.js?v=20260810g"></script>
  <script src="../js/data_loader.js?v=20260810g"></script>
  <script src="../js/page_locale.js?v=20260810g"></script>
  <script src="../js/locale_pick.js?v=20260810g"></script>
  <script src="../js/bible_reader_shared.js?v=20260810g"></script>
  <script src="../js/page_links.js?v=20260810g"></script>
  <script src="../js/read_progress.js?v=20260810g"></script>
  <script src="../js/track_registry.js?v=20260903w1"></script>
  <script src="../js/frame_sync.js?v=20260810g"></script>
</head>
<body>
  <div class="landing-page">
    <header class="landing-hero">
      <p class="landing-hero__mascot" aria-hidden="true">🦁</p>
      <h1 id="landingTitle">歡迎來到聖經跑道</h1>
      <p class="landing-hero__tagline" id="landingTagline">每天約 5 分鐘，陪你慢慢讀聖經。</p>
      <p class="landing-hero__lead" id="landingLead">
        不用背課、不用考試。斷更了也沒關係，回來就好。
      </p>
    </header>

    <div class="landing-tabs" role="tablist" aria-label="跑道說明">
      <button type="button" class="landing-tab is-on" role="tab" id="tabWhat" data-tab="what" aria-selected="true" aria-controls="panelWhat">
        <span aria-hidden="true">？</span> <span id="helpWhatLabel">這是什麼</span>
      </button>
      <button type="button" class="landing-tab" role="tab" id="tabHow" data-tab="how" aria-selected="false" aria-controls="panelHow">
        <span aria-hidden="true">▶</span> <span id="helpHowLabel">怎麼用</span>
      </button>
      <button type="button" class="landing-tab" role="tab" id="tabWhy" data-tab="why" aria-selected="false" aria-controls="panelWhy">
        <span aria-hidden="true">⭐</span> <span id="helpWhyLabel">我的進度</span>
      </button>
    </div>
    <div class="landing-tab-panels">
      <div class="landing-panel is-on" id="panelWhat" role="tabpanel">
        <div class="landing-guide" id="whatGuide"></div>
      </div>
      <div class="landing-panel" id="panelHow" role="tabpanel" hidden>
        <div class="landing-guide" id="howGuide"></div>
        <p class="landing-nudge" id="howNudge" hidden></p>
        <button type="button" class="landing-continue" id="howContinue" hidden>接著上次讀的那一章 →</button>
        <section class="landing-cta" aria-labelledby="quickTitle">
          <span class="landing-cta__eyebrow" id="quickEyebrow">第一次來 · 約 5 分鐘</span>
          <h2 class="landing-cta__title" id="quickTitle">先走三十日</h2>
          <p class="landing-cta__hint" id="quickHint">最短的一條。打開、讀完、回來就好。</p>
          <button type="button" class="landing-cta__btn" id="quickStartBtn">先走三十日 →</button>
        </section>
      </div>
      <div class="landing-panel" id="panelWhy" role="tabpanel" hidden>
        <div class="landing-guide" id="whyGuide"></div>
      </div>
    </div>

    <section class="landing-lanes" aria-labelledby="lanesTitle">
      <h2 class="landing-lanes__title" id="lanesTitle">尋寶地圖 · 選一條路</h2>
      <p class="landing-lanes__hint" id="lanesHint">格子越寬，路越長。短的先嚐一口；長的慢慢走完。線上有節點標籤。</p>
      <div class="landing-lanes__board" id="laneRoot"></div>
      <p class="landing-foot" id="landingFoot">任一路線都可以用四語並排或雙語對照讀。</p>
    </section>

    <footer class="landing-version" id="landingVersion" aria-label="版本"></footer>
  </div>
  <script src="../js/runtime_mode.js?v=20260810g"></script>
  <script src="../js/landing_tracks.js?v=20260903w1"></script>
</body>
</html>
