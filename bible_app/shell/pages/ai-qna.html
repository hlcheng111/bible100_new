<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>牧養問答</title>

  <link rel="stylesheet" href="../css/page.css" />

  <script src="../js/page_boot.js?v=20260901cloud"></script>

  <script src="../js/page_locale.js"></script>

  <style>

    .ctx-bar {

      background: #eef2ff; border: 2px solid #a5b4fc; border-radius: 14px;

      padding: 10px 12px; margin: 0 0 14px; font-size: 13px; color: #312e81;

    }

    .ctx-bar.ctx-bar--empty {

      background: #fff7ed; border-color: #fdba74; color: #9a3412;

    }

    .ctx-bar.ctx-bar--empty a { color: #c2410c; font-weight: 800; }

    .qna-box {

      background: #fff; border: 3px solid #818cf8; border-radius: 18px;

      padding: 14px; margin: 0 0 16px;

    }

    .qna-box label { display: block; font-weight: 800; font-size: 12px; margin: 8px 0 4px; }

    .qna-box input, .qna-box textarea {

      width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px;

    }

    .qna-box textarea { min-height: 140px; }

    .qna-more {

      border: 2px dashed #c4b5fd; border-radius: 14px; padding: 10px 12px; margin-top: 8px;

      background: #faf5ff;

    }

    .qna-more summary {

      cursor: pointer; font-weight: 800; font-size: 13px; color: #5b21b6;

    }

    .qna-ext-link {

      display: block; margin-top: 10px; padding: 10px 12px; border-radius: 12px;

      background: #fff; border: 2px solid #ddd6fe; text-decoration: none; color: #312e81;

    }

    .qna-ext-link:hover { border-color: #818cf8; }

    .qna-ext-sub { font-size: 11px; color: #64748b; margin-top: 4px; }

    .file-note { margin-top: 12px; font-size: 12px; color: #64748b; }

    .teacher-hint { font-size: 11px; color: #94a3b8; margin-top: 16px; }

  </style>

</head>

<body>

  <div class="page">

    <h1 data-L="qna_title">D · 牧養問答</h1>

    <p data-L="qna_lead">剛讀完有疑問？先複製 Prompt 問 AI，再請牧者／老師審核。</p>



    <div class="ctx-bar" id="qnaContext">讀取上下文…</div>



    <div class="qna-box">

      <h2 style="font-size:1rem;margin:0 0 8px">✍️ 先做這件事</h2>

      <p style="font-size:12px;color:#64748b;margin:0 0 8px">無需 API · 複製後貼到 ChatGPT / Kimi / Claude</p>

      <label for="qnaRef">經文參照</label>

      <input type="text" id="qnaRef" placeholder="例：約 3:16" />

      <label for="qnaQuestion">你的問題</label>

      <input type="text" id="qnaQuestion" placeholder="例：向慕道朋友怎麼解釋「重生」？" />

      <button type="button" class="btn-big btn-teal" id="btnQnaGen" style="margin-top:10px">產生 Prompt</button>

      <button type="button" class="btn-big btn-purple" id="btnQnaCopy">複製到剪貼簿</button>

      <label for="qnaOut" style="margin-top:10px">Prompt 草稿</label>

      <textarea id="qnaOut" readonly></textarea>

    </div>



    <details class="qna-more" id="qnaMore">

      <summary>還想找別人寫過的答案？</summary>

      <div id="qnaExtLinks"></div>

    </details>



    <p class="file-note" id="qnaFileNote" hidden>

      <strong>提示：</strong>「聖經難題 Q&amp;A」題庫較大，<code>file://</code> 下可能載入慢；請用本機 HTTP 開啟總站後再點連結。

    </p>

    <p class="teacher-hint">想更深讀背景與原文？請用讀完頁的「更深讀這段」（E 區），或總站「AI 輔助」給備課老師。</p>

  </div>

  <script src="../js/bridge.js?v=20260901cloud"></script>

  <script src="../js/ai_qna_hub.js?v=20260901cloud"></script>

  <script>

    (function () {

      if (location.protocol === 'file:') {

        var n = document.getElementById('qnaFileNote');

        if (n) n.hidden = false;

      }

    })();

  </script>

</body>

</html>
