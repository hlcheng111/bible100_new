<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo</title>
  <link rel="stylesheet" href="../css/page.css" />
  <script src="../js/page_locale.js"></script>
</head>
<body>
  <div class="page" id="content"></div>
  <script>
    var TEXT = {
      'zh-Hant': { t:'示範路徑', steps:['1. 選「繁中」→ 殼文案變中文','2. 選 English → 殼文案變英文','3. 點「一年計劃」→ 彩色月曆 → 今日段落','4. 讀經 → 讀完打卡 → +1 金星','5. 底欄「操作說明」看規則','6. 兒少：三十日 / 四十金句卡'] },
      en: { t:'Demo path', steps:['1. Pick 繁中 → Chinese shell','2. Pick English → English shell','3. Zone C → Genesis 1','4. Four columns (VI/ID bridge)','5. Footer Methods → day 1 or John 3:16','6. Full kids game: app/dist Expo build'] },
      vi: { t:'Demo', steps:['1. Chọn ngôn ngữ','2. Khu C → Sáng thế 1','3. Bốn cột','4. Phương pháp → câu mẫu'] },
      id: { t:'Contoh', steps:['1. Pilih bahasa','2. Area C → Kejadian 1','3. Empat kolom','4. Metode → ayat contoh'] },
    };
    var loc = PageLocale.getLocale();
    var pack = TEXT[loc] || TEXT.en;
    var html = '<h1>' + pack.t + '</h1><ol class="tips">';
    pack.steps.forEach(function(s){ html += '<li>' + s + '</li>'; });
    document.getElementById('content').innerHTML = html + '</ol>';
  </script>
</body>
</html>
