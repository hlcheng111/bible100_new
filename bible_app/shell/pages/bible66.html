<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>六十六卷</title>
  <link rel="stylesheet" href="../css/app-hub.css?v=20260813dbfix" />
  <link rel="stylesheet" href="../css/track-creative.css?v=20260813dbfix" />
  <script src="../js/page_boot.js?v=20260813dbfix"></script>
  <script src="../js/data_bundle.js?v=20260813dbfix"></script>
  <script src="../js/data_loader.js?v=20260813dbfix"></script>
  <script src="../js/page_locale.js?v=20260813dbfix"></script>
  <script src="../js/locale_pick.js?v=20260813dbfix"></script>
  <script src="../js/page_links.js?v=20260813dbfix"></script>
  <script src="../js/frame_sync.js?v=20260813dbfix"></script>
  <script src="../js/read_progress.js?v=20260813dbfix"></script>
</head>
<body class="bible-standalone">
  <header class="bs-top">
    <div class="font-size-bar">
      <span class="font-size-label">字體</span>
      <button type="button" class="fs-btn" data-fs="sm">小</button>
      <button type="button" class="fs-btn on" data-fs="md">中</button>
      <button type="button" class="fs-btn" data-fs="lg">大</button>
    </div>
  </header>
  <section class="b66-hero track-hero" id="b66Hero" style="margin:8px 4px 0">
    <p class="track-hero__mascot">🗺️📜🦁</p>
    <h1 id="b66Title" style="font-size:1.15rem;margin:0 0 4px">六十六卷 · 聖經大冒險地圖</h1>
    <p id="b66Tagline" style="margin:0;font-size:12px">自由探索 · 想有引导？→ <a href="track-plan1y.html" style="color:#4338ca;font-weight:800">一年计划</a> 或 <a href="track-plan3y.html" style="color:#059669;font-weight:800">三年计划</a></p>
    <div class="b66-map" title="讀經進度">
      <div class="b66-map__ot" id="mapOt" style="width:50%"></div>
      <div class="b66-map__nt" id="mapNt" style="width:50%"></div>
    </div>
    <div class="track-stats">
      <div class="track-stat">⭐ 金星<strong id="b66Stars">0</strong></div>
      <div class="track-stat">📖 已讀章<strong id="b66Chapters">0</strong></div>
      <div class="track-stat">🔥 連續<strong id="b66Streak">0</strong>天</div>
    </div>
  </section>
  <p id="fileNote" class="file-note" hidden>
    完整經庫：請雙擊 <strong>打開聖經跑道.bat</strong> 啟動本機服務後，Hub 內可自動載入全庫。
  </p>
  <div id="bibleRoot"></div>
  <script src="../js/font_size.js?v=20260813dbfix"></script>
  <script src="../js/bible_reader_core.js?v=20260813dbfix"></script>
  <script>
    if (location.protocol === 'file:') {
      var probeP = window.B100LiveDb && window.B100LiveDb.probe
        ? window.B100LiveDb.probe(2)
        : Promise.resolve(false);
      probeP.then(function (ok) {
        var n = document.getElementById('fileNote');
        if (n && !ok) n.hidden = false;
      });
    }
    (function () {
      function bootReader() {
      var q = new URLSearchParams(location.search);
      var track = q.get('track') || '';
      if (track && track !== 'bible66') {
        document.body.classList.add('bible-track-read');
      }

      function refreshHero() {
        if (document.body.classList.contains('bible-track-read')) return;
        var st = B100Progress.stats();
        var ch = B100Progress.countDone('b66:');
        document.getElementById('b66Stars').textContent = st.stars;
        document.getElementById('b66Chapters').textContent = ch;
        document.getElementById('b66Streak').textContent = st.streak || '0';
        var ot = 0, nt = 0;
        var done = B100Progress.load().done;
        Object.keys(done).forEach(function (k) {
          if (k.indexOf('b66:') !== 0) return;
          var p = k.split(':');
          var b = parseInt(p[1], 10);
          if (b <= 39) ot++; else nt++;
        });
        var total = ot + nt || 1;
        document.getElementById('mapOt').style.width = Math.round((ot / total) * 100) + '%';
        document.getElementById('mapNt').style.width = Math.round((nt / total) * 100) + '%';
      }

      function applyContextTag(q, book, chapter) {
        if (document.body.classList.contains('bible-track-read')) {
          document.title = (B100LocalePick ? B100LocalePick.bookChapterRef(book, chapter, B100LocalePick.getLocale()) : ('Book ' + book + ' ' + chapter));
          return;
        }
        var tag = document.getElementById('b66Tagline');
        var titleEl = document.getElementById('b66Title');
        var loc = B100LocalePick ? B100LocalePick.getLocale() : 'zh-Hant';
        var ref = B100LocalePick ? B100LocalePick.bookChapterRef(book, chapter, loc) : ('Book ' + book + ' ' + chapter);
        var track = q.get('track');
        if (track === '30day' && q.get('day')) {
          var dayN = q.get('day');
          var plan = window.B100_DATA && window.B100_DATA.thirtyDay;
          var dayRow = plan && plan.days && plan.days.find(function (d) { return String(d.day) === String(dayN); });
          var dayTitle = dayRow && B100LocalePick ? B100LocalePick.pick(dayRow, 'title') : '';
          tag.textContent = '📅 ' + (dayTitle || ('Day ' + dayN)) + ' · ' + ref;
          if (titleEl) titleEl.textContent = '📖 ' + ref;
          return;
        }
        if (track === 'plan1y' && q.get('day')) {
          tag.textContent = '📅 一年計劃 · 第 ' + q.get('day') + ' 天 · ' + ref;
          if (titleEl) titleEl.textContent = '📖 ' + ref;
          return;
        }
        if (track === 'plan3y' && q.get('day')) {
          tag.textContent = '⛪ 教會年 · ' + q.get('day') + ' · ' + ref;
          if (titleEl) titleEl.textContent = '📖 ' + ref;
          return;
        }
        if (track === 'golden') {
          tag.textContent = '⭐ ' + ref + (q.get('verse') ? ' :' + q.get('verse') : '');
          if (titleEl) titleEl.textContent = ref;
          return;
        }
        if (track === 'theme') {
          tag.textContent = '🎯 ' + ref;
          if (titleEl) titleEl.textContent = ref;
          return;
        }
        if (book && chapter) {
          tag.textContent = '📖 ' + ref;
        }
      }

      refreshHero();
      var book = parseInt(q.get('book') || '1', 10);
      var chapter = parseInt(q.get('chapter') || '1', 10);
      if (!q.get('book') && q.get('track') && q.get('track') !== 'bible66') {
        console.warn('[B100] bible66 missing book= — check track link');
      }
      applyContextTag(q, book, chapter);
      var r = new BibleReaderCore();
      r.mount(document.getElementById('bibleRoot'), { bookId: book, chapter: chapter });
      r.onProgressChange = refreshHero;
      }
      var gate = window.B100LiveDb && window.B100LiveDb.ensureReaderPage
        ? window.B100LiveDb.ensureReaderPage()
        : Promise.resolve(false);
      gate.then(function (redir) {
        if (!redir) bootReader();
      });
    })();
  </script>
</body>
</html>
