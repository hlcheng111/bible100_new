<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>一年讀經計劃</title>
  <link rel="stylesheet" href="../css/page.css?v=20260810g" />
  <link rel="stylesheet" href="../css/track-creative.css?v=20260810g" />
  <script>window.B100_PLAN_KEY = 'plan1y';</script>
  <script src="../js/page_boot.js?v=20260901locale"></script>
  <script src="../js/data_bundle.js?v=20260810g"></script>
  <script src="../js/data_loader.js?v=20260810g"></script>
  <script src="../js/page_locale.js?v=20260810g"></script>
  <script src="../js/locale_pick.js?v=20260810g"></script>
  <script src="../js/page_links.js?v=20260830db66d"></script>
  <script src="../js/frame_sync.js?v=20260810g"></script>
  <script src="../js/read_progress.js?v=20260810g"></script>
</head>
<body>
  <div class="track-page track-page--plan">
    <header class="track-hero">
      <p class="track-hero__mascot">📅🦁</p>
      <div class="track-hero__title-row">
        <h1>一年讀完聖經</h1>
        <button type="button" class="btn-howto" id="btnHowto">怎麼開始？</button>
      </div>
      <p id="planLead">按六十六卷順序 · 365 天讀完全本 · 落後可續</p>
      <div class="track-stats">
        <div class="track-stat">⭐ 金星<strong id="statStars">0</strong></div>
        <div class="track-stat">🔥 連續天<strong id="statStreak">—</strong></div>
        <div class="track-stat">📖 進度<strong id="statDone">0 / 365</strong></div>
      </div>
    </header>
    <aside id="planRules" class="plan-rules-box"></aside>
    <section id="todayHero" class="track-hero track-hero--today"></section>
    <h2 class="plan-section-title" id="calTitle">📅 每月讀經表</h2>
    <p class="plan-hint" id="calHint">點選日期可看當日應讀經卷；手機版以列表顯示。斷更了就從今天接著走，不必重來。</p>
    <nav id="monthTabs" class="month-tabs" aria-label="月份"></nav>
    <div id="monthGrid" class="plan-month-grid"></div>
    <ul id="monthList" class="plan-day-list plan-day-list--1y"></ul>
    <h2 class="plan-section-title">🗺️ 近日旅程石</h2>
    <p class="plan-hint">小圖示 = 最近幾天進度：✅ 已打卡 · 🔥 今天 · 📖 尚未讀</p>
    <div class="journey-path" id="recentDays"></div>
  </div>
  <script src="../js/track_plan.js?v=20260929w1"></script>
</body>
</html>
