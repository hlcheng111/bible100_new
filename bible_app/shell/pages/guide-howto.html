<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How-to</title>
  <link rel="stylesheet" href="../css/page.css" />
  <script src="../js/page_locale.js"></script>
</head>
<body>
  <div class="page" id="content"></div>
  <script>
    var TEXT = {
      'zh-Hant': { t:'操作說明', items:[
        '顶栏：一年/三年/三十日/金句/主题/六十六卷',
        '首页 🏠：欢迎页 →「开始今日关卡」进入一年计划',
        '金星 ⭐：每次首次「读完打卡」+1（任何赛道）',
        '已读章 📖：六十六卷赛道按章计数；计划赛道看进度条',
        '连续天 🔥：有打卡的日历连续天数；断更欢迎回来',
        '一年计划：每日诗篇 + 旧约五类 + 新约五类 · 彩色月历',
        '读完流程：读经 → 读完打卡 → AI 工具（可选）',
        '完整经库：双击「打开圣经跑道.bat」→ http://127.0.0.1:3000',
      ] },
      en: { t:'How to use', items:['Row 1: UI language (4 langs)','Row 2: Persona','Row 3: Track → Methods catalog','A–E: Squad / Today / Bible / Q&A / AI','Footer: About, Methods, How-to, Demo','Kids unit: story → game → sticker','🏠 Home: welcome'] },
      vi: { t:'Hướng dẫn', items:['Hàng 1: Ngôn ngữ','Hàng 2: Đối tượng','Hàng 3: Lộ trình','A–E: các khu','Chân trang: mục hướng dẫn','Thiếu nhi: truyện → game → sticker','🏠 Home'] },
      id: { t:'Panduan', items:['Baris 1: Bahasa','Baris 2: Peran','Baris 3: Jalur','A–E: area','Footer: panduan','Anak: cerita → game','🏠 Home'] },
    };
    var loc = PageLocale.getLocale();
    var pack = TEXT[loc] || TEXT.en;
    var html = '<h1>' + pack.t + '</h1><ul class="tips">';
    pack.items.forEach(function(s){ html += '<li>' + s + '</li>'; });
    document.getElementById('content').innerHTML = html + '</ul>';
  </script>
</body>
</html>
