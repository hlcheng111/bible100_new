<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>單頁大視窗</title>
  <link rel="stylesheet" href="../css/app-hub.css" />
  <link rel="stylesheet" href="../css/page.css" />
</head>
<body>
  <p style="padding:8px 12px;margin:0"><a href="home.html">← 回四列導航版</a></p>
  <header class="hub-header">
    <div class="hub-head-row">
      <div class="hub-brand">
        <div class="hub-logo">🧭</div>
        <div>
          <h1>單頁大視窗（選用）</h1>
          <small>你跑我追 · 跨代快樂同行</small>
        </div>
      </div>
      <div class="hub-actions">
        <div class="font-size-bar">
          <span class="font-size-label">字體</span>
          <button type="button" class="fs-btn" data-fs="sm">小</button>
          <button type="button" class="fs-btn on" data-fs="md">中</button>
          <button type="button" class="fs-btn" data-fs="lg">大</button>
        </div>
        <button type="button" id="btnHome" class="btn-home">🏠 今日</button>
        <div class="stars-badge">⭐ <span id="hubStars">3</span> 黃金星</div>
      </div>
    </div>
    <div class="hub-selectors">
      <div class="hub-row">
        <span class="hub-row-label">語系</span>
        <button type="button" class="chip active" data-hub="locale" data-value="zh-Hant">中文</button>
        <button type="button" class="chip" data-hub="locale" data-value="en">English</button>
        <button type="button" class="chip" data-hub="locale" data-value="vi">Việt</button>
        <button type="button" class="chip" data-hub="locale" data-value="id">Indo</button>
      </div>
      <div class="hub-row">
        <span class="hub-row-label">對象</span>
        <button type="button" class="chip active kids" data-hub="audience" data-value="kids">兒童 🧒</button>
        <button type="button" class="chip seeker" data-hub="audience" data-value="seeker">初信 🆕</button>
        <button type="button" class="chip mature" data-hub="audience" data-value="adult">研經 📖</button>
        <button type="button" class="chip pastor" data-hub="audience" data-value="parent">家長 👨‍👩‍👧</button>
      </div>
      <div class="hub-row">
        <span class="hub-row-label">賽道</span>
        <button type="button" class="chip active track" data-hub="track" data-value="0">萌幼 🧒</button>
        <button type="button" class="chip track" data-hub="track" data-value="1">初信 🚀</button>
        <button type="button" class="chip track" data-hub="track" data-value="2">智慧 🪵</button>
        <button type="button" class="chip track" data-hub="track" data-value="3">先知 🕊️</button>
        <button type="button" class="chip track" data-hub="track" data-value="4">福音 👑</button>
      </div>
    </div>
  </header>
  <main class="hub-main">
    <section id="central-viewport" class="viewport-shell">
      <div class="vp-chrome"><div class="vp-dots"><i></i><i></i><i></i></div><span>智慧視窗</span></div>
      <div class="vp-tabs">
        <button type="button" class="vp-tab" data-hub="tab" data-value="pacing">🏃 你跑我追</button>
        <button type="button" class="vp-tab active" data-hub="tab" data-value="today">🪵 每日主題</button>
        <button type="button" class="vp-tab" data-hub="tab" data-value="browser">📖 六十六卷</button>
        <button type="button" class="vp-tab" data-hub="tab" data-value="qna">💬 問答</button>
        <button type="button" class="vp-tab" data-hub="tab" data-value="ai">🛡️ 代禱</button>
      </div>
      <div class="vp-pane" id="viewportPane"></div>
    </section>
    <section class="bottom-section">
      <div class="bottom-tabs">
        <button type="button" class="chip" data-hub="bottom" data-value="philosophy">理念</button>
        <button type="button" class="chip active" data-hub="bottom" data-value="plans">金句專區</button>
      </div>
      <div class="bottom-pane" id="bottomPane"></div>
    </section>
  </main>
  <script src="../js/font_size.js"></script>
  <script src="../js/shell_i18n.js"></script>
  <script src="../js/bible_reader_core.js"></script>
  <script src="../js/app-hub.js"></script>
</body>
</html>
