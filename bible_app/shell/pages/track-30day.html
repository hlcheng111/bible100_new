<body>
  <div class="track-page">
    <header class="track-hero">
      <p class="track-hero__mascot">📅🦁</p>
      <h1>三十日讀經大冒險</h1>
      <p>從創造到新天新地 · 每天一顆旅程石 · 連續打卡有火焰 🔥</p>
      <div class="track-stats">
        <div class="track-stat">⭐ 金星<strong id="statStars">0</strong></div>
        <div class="track-stat">🔥 連續天<strong id="statStreak">—</strong></div>
        <div class="track-stat">📖 進度<strong id="statDone">0 / 30</strong></div>
      </div>
    </header>
    <section id="todayHero" class="track-hero" style="border-color:#fbbf24;background:linear-gradient(145deg,#fffbeb,#fef3c7)"></section>
    <h2 style="font-size:1rem;color:#5c4d7a;margin:16px 0 8px">🗺️ 三十顆旅程石</h2>
    <div class="journey-path" id="days"></div>
    <p style="font-size:11px;color:#94a3b8;margin-top:14px">讀完當天經文後，點「讀完打卡」可獲金星，並跳到 AI 創作工具。</p>
  </div>
  <script src="../js/track_30day.js?v=20260810g"></script>
