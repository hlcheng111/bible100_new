<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>聖經跑道</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>" />
  <script>
    (function () {
      var ASSET_V = '20260618f';
      var p = location.pathname.replace(/\\/g, '/');
      var idx = p.toLowerCase().indexOf('/shell');
      if (idx < 0) return;
      var root = p.slice(0, idx) + '/shell/';
      var tail = p.slice(idx);
      if (/^\/shell\/?$/i.test(tail) || /^\/shell\/index$/i.test(tail)) {
        location.replace(root + 'index.html' + location.search + location.hash);
        return;
      }
      window.B100_SHELL_ROOT = root;
      window.B100_SHELL_ASSET_V = ASSET_V;
      window.b100ShellAsset = function (rel) {
        var q = rel.indexOf('?') >= 0 ? '&' : '?';
        return root + rel.replace(/^\//, '') + q + 'v=' + encodeURIComponent(ASSET_V);
      };
      document.write('<link rel="stylesheet" href="' + window.b100ShellAsset('css/shell.css') + '" />');
    })();
  </script>
</head>
<body>
  <header class="shell-top" id="shellTop">
    <div class="shell-bar">
      <div class="shell-brand">
        <a id="btnHome" class="home-pill" href="pages/home.html">🏠 <span data-i18n="home">首頁</span></a>
        <span class="shell-logo">🦁</span>
        <span id="shellTitle" class="shell-title" data-i18n="appTitle">聖經跑道</span>
      </div>

      <nav class="track-nav" aria-label="賽道">
        <button type="button" class="track-btn" data-group="track" data-value="bible66" data-i18n="t_bible66">六十六卷</button>
        <button type="button" class="track-btn" data-group="track" data-value="30day" data-i18n="t_30day">三十日</button>
        <button type="button" class="track-btn" data-group="track" data-value="golden" data-i18n="t_golden">四十金句</button>
        <button type="button" class="track-btn" data-group="track" data-value="theme" data-i18n="t_theme">主題讀經</button>
      </nav>

      <div class="shell-tools">
        <div class="lang-pills" aria-label="語言">
          <button type="button" class="lang-btn" data-group="locale" data-value="zh-Hant" title="繁體中文">中</button>
          <button type="button" class="lang-btn" data-group="locale" data-value="en" title="English">EN</button>
          <button type="button" class="lang-btn" data-group="locale" data-value="vi" title="Tiếng Việt">VI</button>
          <button type="button" class="lang-btn" data-group="locale" data-value="id" title="Indonesia">ID</button>
        </div>
        <div class="font-size-bar" title="字體">
          <button type="button" class="fs-btn" data-fs="sm">小</button>
          <button type="button" class="fs-btn on" data-fs="md">中</button>
          <button type="button" class="fs-btn" data-fs="lg">大</button>
        </div>
        <button type="button" class="more-btn" id="btnMore" aria-expanded="false" title="更多">⋯</button>
      </div>
    </div>

    <div class="more-panel" id="morePanel" hidden>
      <div class="more-section">
        <span class="more-label" data-i18n="rowPersona">對象</span>
        <button type="button" class="tab-btn" data-group="persona" data-value="kids" data-i18n="p_kids">兒童少年</button>
        <button type="button" class="tab-btn" data-group="persona" data-value="adult" data-i18n="p_adult">成人</button>
        <button type="button" class="tab-btn" data-group="persona" data-value="seeker" data-i18n="p_seeker">慕道</button>
        <button type="button" class="tab-btn" data-group="persona" data-value="parent" data-i18n="p_parent">家長</button>
      </div>
      <div class="more-section">
        <span class="more-label">快捷</span>
        <button type="button" class="tab-btn" data-group="zone" data-value="today" data-i18n="z_today">今日關卡</button>
        <button type="button" class="tab-btn" data-group="zone" data-value="pacing" data-i18n="z_pacing">同跑隊伍</button>
        <button type="button" class="tab-btn" data-group="zone" data-value="qna" data-i18n="z_qna">牧養問答</button>
        <button type="button" class="tab-btn" data-group="zone" data-value="ai" data-i18n="z_ai">智慧導師</button>
      </div>
      <div class="more-section">
        <span class="more-label" data-i18n="rowBibleView">經文</span>
        <button type="button" class="tab-btn" data-group="bibleView" data-value="dual" data-i18n="bible_dual">雙語對照</button>
        <button type="button" class="tab-btn" data-group="bibleView" data-value="single" data-i18n="bible_single">單語</button>
      </div>
      <div class="more-section">
        <span class="more-label">說明</span>
        <button type="button" class="tab-btn" data-group="footer" data-value="howto" data-i18n="f_howto">操作說明</button>
        <button type="button" class="tab-btn" data-group="footer" data-value="idea" data-i18n="f_idea">本站理念</button>
      </div>
    </div>
  </header>

  <main class="shell-main">
    <iframe id="contentFrame" name="contentFrame" title="賽道內容"></iframe>
  </main>

  <script>
    (function () {
      var a = window.b100ShellAsset;
      if (!a) return;
      document.getElementById('contentFrame').src = a('pages/track-30day.html');
      var home = document.getElementById('btnHome');
      if (home) home.href = a('pages/home.html');
      [
        'js/shell_asset_v.js',
        'js/shell_boot.js',
        'js/bridge.js',
        'js/nav_matrix.js',
        'js/font_size.js',
        'js/shell_i18n.js',
        'js/shell_base.js',
        'js/shell_nav.js',
      ].forEach(function (rel) {
        document.write('<script src="' + a(rel) + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
