<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詩歌播放列表 - 2015首瀏覽</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', Arial; background: #f5f6fa; color: #2c3e50; font-size: 12px; height: 100vh; overflow: hidden; }
    .topbar { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar-actions a { margin-left: 8px; padding: 6px 12px; background: white; color: #f5576c; border-radius: 4px; text-decoration: none; font-size: 11px; }
    .main { display: flex; height: calc(100vh - 48px); }
    .panel-left { width: 380px; background: white; border-right: 2px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; }
    .panel-right { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .panel-header { padding: 10px 12px; background: #f8f9fa; font-weight: 600; font-size: 13px; border-bottom: 1px solid #e0e0e0; }
    .panel-left .panel-header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
    .search-box { padding: 8px; border-bottom: 1px solid #eee; }
    .search-box input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; }
    .tree-container { flex: 1; overflow-y: auto; padding: 8px; }
    .tree-level1 { margin-bottom: 6px; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
    .tree-level1-header { padding: 10px 12px; background: #e3f2fd; cursor: pointer; font-weight: 600; color: #0b5fa5; display: flex; align-items: center; }
    .tree-level1-header:hover { background: #bbdefb; }
    .tree-toggle { margin-right: 8px; font-size: 10px; }
    .tree-level2 { border-top: 1px solid #eee; }
    .tree-level2-header { padding: 8px 12px; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; }
    .tree-level2-header:hover { background: #eeeeee; }
    .tree-level3 { padding: 4px 0 4px 20px; }
    .hymn-row { padding: 8px 12px; cursor: pointer; border-radius: 4px; margin: 2px 4px; display: flex; justify-content: space-between; align-items: center; }
    .hymn-row:hover { background: #e3f2fd; color: #0b5fa5; }
    .hymn-row.selected { background: #fce4ec; border-left: 3px solid #f5576c; }
    .hymn-num { font-weight: 600; margin-right: 8px; min-width: 48px; }
    .hymn-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .source-badge { font-size: 9px; padding: 2px 6px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; margin-left: 4px; }
    .iframe-container { flex: 1; overflow: hidden; }
    .iframe-container iframe { width: 100%; height: 100%; border: 0; }
    .empty-preview { text-align: center; padding: 60px 20px; color: #95a5a6; font-size: 13px; }
    .empty-preview .icon { font-size: 48px; margin-bottom: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>🎵 詩歌播放列表 - 詩歌來源</h1>
    <div class="topbar-actions">
      <a href="temp_hymn.html" target="contentFrame">2015 首預覽</a>
      <a href="hymn_playlist_unified.html" target="contentFrame">列表管理</a>
      <a href="index.html" target="_top">返回</a>
    </div>
  </div>

  <div class="main">
    <div class="panel-left">
      <div class="panel-header">📚 詩歌來源（三層選單）</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索編號、標題、作者..." onkeyup="debouncedSearch()">
      </div>
      <div class="tree-container" id="treeContainer"></div>
    </div>

    <div class="panel-right">
      <div class="panel-header">📄 詩歌預覽</div>
      <div class="iframe-container">
        <div id="emptyPreview" class="empty-preview">
          <div class="icon">📖</div>
          <div>請從左側選單點選詩歌</div>
        </div>
        <iframe id="hymnFrame" style="display:none;"></iframe>
      </div>
    </div>
  </div>

  <script src="data/source-hymns-loader.js"></script>
  <script>
    let allHymns = [];
    let searchTimeout = null;

    function toHymnUrl(sourcePath) {
      if (!sourcePath) return '#';
      return 'hymn/' + (sourcePath || '').replace(/^\.\.\//, '');
    }

    function debouncedSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() { renderTree(); }, 200);
    }

    function buildTree() {
      var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var list = allHymns;
      if (q) {
        list = allHymns.filter(function(h) {
          var t = (h.title_zh || '') + (h.title_en || '') + (h.number || '') + (h.author || '') + (h.tune || '') + (h.catalogNumber || '');
          return t.toLowerCase().indexOf(q) >= 0;
        });
      }
      var byHymnal = {};
      list.forEach(function(h) {
        var hm = h.hymnal || '未分類';
        if (!byHymnal[hm]) byHymnal[hm] = {};
        var cat = (h.catalogNumber || '').trim() ? (h.catalogNumber || '').charAt(0) : '其他';
        if (!byHymnal[hm][cat]) byHymnal[hm][cat] = [];
        byHymnal[hm][cat].push(h);
      });
      Object.keys(byHymnal).forEach(function(hm) {
        Object.keys(byHymnal[hm]).forEach(function(cat) {
          byHymnal[hm][cat].sort(function(a, b) { return (a.number || '').localeCompare(b.number || ''); });
        });
      });
      return byHymnal;
    }

    function renderTree() {
      var tree = buildTree();
      var html = '';
      Object.keys(tree).sort().forEach(function(hymnal) {
        var cats = tree[hymnal];
        var total = 0;
        Object.keys(cats).forEach(function(c) { total += cats[c].length; });
        html += '<div class="tree-level1">
          <div class="tree-level1-header" onclick="toggleLevel1(this)">
            <span class="tree-toggle">▶</span>
            <span>' + hymnal + '</span>
            <span class="source-badge">' + total + '首</span>
          </div>
          <div class="tree-level2" style="display:block">';
        Object.keys(cats).sort().forEach(function(cat) {
          var hymns = cats[cat];
          html += '<div class="tree-level2-header" onclick="toggleLevel2(this)">
            <span class="tree-toggle">▶</span>
            <span>' + cat + '</span>
            <span class="source-badge">' + hymns.length + '</span>
          </div>
          <div class="tree-level3" style="display:none">';
          hymns.forEach(function(h) {
            var sp = h.sourcePath || '';
            var url = toHymnUrl(sp) || '';
            var title = (h.title_zh || h.title_en || '').substring(0, 40);
            var num = h.number || '';
            html += '<div class="hymn-row" data-url="' + (url || '').replace(/"/g, '&quot;') + '" onclick="showHymn(this)">
              <span class="hymn-num">' + num + '</span>
              <span class="hymn-title">' + (title || '—').replace(/</g, '&lt;') + '</span>
            </div>';
          });
          html += '</div>';
        });
        html += '</div></div>';
      });
      document.getElementById('treeContainer').innerHTML = html || '<div class="empty-preview">無詩歌</div>';
    }

    function toggleLevel1(el) {
      var next = el.nextElementSibling;
      if (!next) return;
      var toggle = el.querySelector('.tree-toggle');
      if (next.style.display === 'none') {
        next.style.display = '';
        if (toggle) toggle.textContent = '▼';
      } else {
        next.style.display = 'none';
        if (toggle) toggle.textContent = '▶';
      }
    }

    function toggleLevel2(el) {
      var next = el.nextElementSibling;
      if (!next) return;
      var toggle = el.querySelector('.tree-toggle');
      if (next.style.display === 'none') {
        next.style.display = '';
        if (toggle) toggle.textContent = '▼';
      } else {
        next.style.display = 'none';
        if (toggle) toggle.textContent = '▶';
      }
    }

    function showHymn(rowEl) {
      document.querySelectorAll('.hymn-row.selected').forEach(function(r) { r.classList.remove('selected'); });
      if (rowEl) rowEl.classList.add('selected');
      var url = rowEl ? rowEl.getAttribute('data-url') || '' : '';
      var frame = document.getElementById('hymnFrame');
      var empty = document.getElementById('emptyPreview');
      if (url && url !== '#') {
        frame.src = url;
        frame.style.display = 'block';
        empty.style.display = 'none';
      } else {
        frame.src = 'about:blank';
        frame.style.display = 'none';
        empty.style.display = 'block';
      }
    }

    function loadData() {
      (window.loadSourceHymns || function(){ return fetch('data/source-hymns.json').then(function(r){ return r.ok ? r.json() : Promise.reject(); }); })()
        .then(function(d) {
          allHymns = (d.hymns || []).filter(function(h) { return h.sourcePath; });
          renderTree();
        })
        .catch(function() {
          if (typeof EMBEDDED !== 'undefined' && EMBEDDED.hymns) {
            allHymns = EMBEDDED.hymns.filter(function(h) { return h.sourcePath; });
            renderTree();
          } else {
            document.getElementById('treeContainer').innerHTML = '<div class="empty-preview">無法載入詩歌資料</div>';
          }
        });
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
