<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>樂以載道 · 側欄</title>
  <style>
    body { margin:0; padding:10px; font-family:"Microsoft JhengHei",sans-serif; background:#efe0c8; font-size:12px; color:#1c1917; }
    .brand { background:#020617; color:#f3e5ab; border-radius:10px; padding:10px 12px; margin-bottom:8px; border-bottom:2px solid #d4af37; }
    details[data-zone] > summary { border-radius:6px; padding:4px 6px; background:#fff; }
    details[data-zone][open] > summary { background:#020617; color:#f3e5ab; }
    details[data-zone][open] > summary .en { color:#f3e5ab; }
    details[data-zone] details > summary { background:#f3e6c8; color:#6b3e16; border-left:3px solid #d4af37; border-radius:4px; font-size:12px; margin-top:4px; }
    details[data-zone] > a { margin-left:8px; background:#f6efe2; font-size:12px; padding:3px 8px; }
    details[data-zone] details a, a.ph-line { font-size:11px; line-height:1.35; padding:1px 8px 1px 16px; margin:0; background:transparent; color:#44403c; }
    a .kind { font-style:normal; font-size:10px; font-weight:800; margin-right:4px; }
    a .kind.lesson { color:#166534; }
    a .kind.ask { color:#9a3412; }
    .brand strong { display:block; font-size:14px; color:#fff; }
    .brand span { font-size:10px; opacity:.9; }
    .search input { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #d4af37; border-radius:8px; font-size:13px; }
    .scopes { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
    .scopes button { border:1px solid #e7e5e4; background:#fff; border-radius:999px; padding:3px 8px; font-size:11px; cursor:pointer; }
    .scopes button.on { background:#d4af37; border-color:#d4af37; font-weight:700; }
    .sec { background:#fff; border:1px solid #e7e5e4; border-radius:10px; padding:8px; margin-bottom:8px; }
    .sec h3 { margin:0 0 6px; font-size:12px; color:#8b5a2b; }
    a, button.linkish { display:block; width:100%; text-align:left; padding:6px 8px; margin:3px 0; border-radius:6px; text-decoration:none; color:#0b5fa5; background:#fafaf9; border:0; font:inherit; cursor:pointer; }
    a:hover, button.linkish:hover { background:#fef3c7; color:#92400e; }
    details[data-zone] details a:hover, a.ph-line:hover { background:#fef3c7; color:#92400e; }
    .hit small { display:block; color:#78716c; font-size:10px; }
    .hit .listen { display:block; margin-top:2px; color:#166534; font-size:10px; font-weight:700; }
    .hit .listen a { display:inline; width:auto; padding:2px 6px; margin:0 2px 0 0; background:#dcfce7; color:#14532d; border-radius:999px; font-size:10px; }
    .group { font-size:10px; color:#92400e; font-weight:700; margin:8px 0 2px; }
    .empty { color:#78716c; font-size:11px; padding:4px; }
    .hint { font-size:10px; color:#78716c; margin:0 0 4px; }
    .scopes button:disabled { opacity:.55; cursor:default; color:#78716c; }
    .scopes a.scope-go { display:inline-block; width:auto; border:1px solid #d4af37; background:#fff; border-radius:999px; padding:3px 8px; font-size:11px; text-decoration:none; color:#1c1917; margin:0; }
    details { margin:2px 0; }
    summary { cursor:pointer; font-weight:700; color:#8b5a2b; padding:4px 2px; }
    summary .en { display:block; font-size:10px; font-weight:500; color:#78716c; line-height:1.2; }
    details details { margin-left:8px; }
    .soon-note { color:#78716c; font-size:10px; padding:2px 8px; }
  </style>
  <script src="../js/sidebar_shell_target_fallback.js"></script>
  <script src="../js/shell_nav.js"></script>
  <script src="../js/sidebar_behavior.js"></script>
  <script src="data/ph_search_index.js"></script>
  <script src="practical_hymnology/data/disciplines_index.js"></script>
  <script src="js/ph_search.js"></script>
  <script src="practical_hymnology/js/yt_sacred_store.js"></script>
  <base target="contentFrame" />
</head>
<body data-b100-module="hymn_management">
  <div class="brand">
    <strong>樂以載道</strong>
    <span>Practical Hymnology · HY</span>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="找聖詩：歌名或編號" autocomplete="off" />
    <div class="scopes" id="scopes">
      <button type="button" data-scope="all" class="on">全部</button>
      <button type="button" data-scope="hymns">聖詩</button>
      <button type="button" data-scope="samples">分析範例</button>
      <button type="button" data-scope="disciplines">學科</button>
      <a class="scope-go" data-b100-nav="content" href="hymn_catalog_sort.html#author">作者 · 曲庫篩</a>
      <button type="button" disabled>曲調 · 以後</button>
      <button type="button" disabled>聖詩集 · 以後</button>
      <button type="button" disabled>聖經 · 以後</button>
      <button type="button" disabled>主題 · 以後</button>
    </div>
  </div>
  <div class="sec" id="results">
    <p class="hint">這裡只搜站內曲庫（約兩千首）。結果留在左欄，一次最多 12 筆；點一筆只換右欄。外站詩集不在這裡。</p>
    <div id="hits"></div>
  </div>
  <div class="sec" id="tree">
    <h3>你今天想做什麼？</h3>
    <p class="hint">同一棵樹：先選事，再展開到功能頁。</p>
  </div>
  <div class="sec">
    <a href="../church_ministry/modules/worship/worship-sunday-desk.html" data-b100-nav="module"
       data-b100-sidebar="church_ministry/sidebar_church_layout_v1.html?focus=a"
       data-b100-content="church_ministry/modules/worship/worship-sunday-desk.html">教會事工 · A 敬拜台</a>
  </div>
  <script>
  (function () {
    var scope = "all";
    var qEl = document.getElementById("q");
    var hits = document.getElementById("hits");
    var confirmedMap = null;
    var confirmedLoading = false;

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }

    function ensureConfirmed(done) {
      if (confirmedMap) { done(confirmedMap); return; }
      if (!window.YtSacredStore || !YtSacredStore.loadConfirmedIndex) {
        confirmedMap = {};
        done(confirmedMap);
        return;
      }
      if (confirmedLoading) { done(confirmedMap || {}); return; }
      confirmedLoading = true;
      YtSacredStore.loadConfirmedIndex().then(function (map) {
        confirmedMap = map || {};
        confirmedLoading = false;
        done(confirmedMap);
      }).catch(function () {
        confirmedMap = {};
        confirmedLoading = false;
        done(confirmedMap);
      });
    }

    function listenHtml(hymnId) {
      var rows = (confirmedMap && confirmedMap[String(hymnId)]) || [];
      if (!rows.length) return "";
      var first = rows[0];
      var url = (window.YtSacredStore && YtSacredStore.watchUrl)
        ? YtSacredStore.watchUrl(first.videoId, first.seconds)
        : ("https://www.youtube.com/watch?v=" + encodeURIComponent(first.videoId || "") + (first.seconds ? "&t=" + Math.floor(first.seconds) + "s" : ""));
      var more = rows.length > 1 ? ("等 " + rows.length + " 處") : esc(first.time || "0:00");
      return "<span class='listen'>也可聽 · <a href='" + esc(url) + "' target='_blank' rel='noopener noreferrer'>" + more + "</a>" +
        " <a data-b100-nav='content' href='practical_hymnology/ai_youtube_music_library_ai_parser_ironclad_153_proof_edition.html'>影音庫</a></span>";
    }

    function paint(q) {
      var S = window.PhSearch;
      if (!S) { hits.innerHTML = "<p class='empty'>索引未載入</p>"; return; }
      if (!q) {
        hits.innerHTML = "<p class='empty'>可搜站內約兩千首曲名、已有分析、111 學科。已確認的影音會顯示「也可聽」。</p>";
        return;
      }
      var r = S.search(q, scope);
      var html = "";
      function block(title, rows, draw) {
        html += "<div class='group'>" + title + " · " + rows.length + "</div>";
        if (!rows.length) html += "<p class='empty'>沒有</p>";
        else rows.forEach(function (row) { html += draw(row); });
      }
      if (scope === "all" || scope === "hymns") {
        block("聖詩", r.hymns, function (h) {
          var href = S.hymnUrl(h.path) || "hymn_catalog_sort.html";
          var label = (h.zh || h.en || h.id);
          return "<a class='hit' data-b100-nav='content' href='" + href + "'><strong>" + esc(label) + "</strong><small>" + esc(h.en || h.num || h.id) + "</small>" + listenHtml(h.id) + "</a>";
        });
        if (r.moreHymns) {
          html += "<a class='hit' data-b100-nav='content' href='hymn_catalog_sort.html?q=" + encodeURIComponent(q) + "'><strong>還有很多</strong><small>到右欄看全部聖詩</small></a>";
        }
      }
      if (scope === "all" || scope === "samples") {
        block("分析範例（現有 " + ((window.PH_SEARCH_INDEX && window.PH_SEARCH_INDEX.sample_count) || 0) + "，目標 100）", r.samples, function (s) {
          return "<a class='hit' data-b100-nav='content' href='practical_hymnology/analyze.html?id=" + encodeURIComponent(s.id) + "'><strong>" + esc(s.zh) + "</strong><small>已有分析稿 · " + esc(s.en) + "</small>" + listenHtml(s.id) + "</a>";
        });
      }
      if (scope === "all" || scope === "disciplines") {
        block("學科", r.disciplines, function (d) {
          return "<a class='hit' data-b100-nav='content' href='practical_hymnology/" + d.filepath + "'><strong>" + esc(d.code + " " + d.title_zh) + "</strong><small>" + esc(d.lens) + "</small></a>";
        });
      }
      var none = !r.hymns.length && !r.samples.length && !r.disciplines.length;
      if (none || scope === "all") {
        html += "<div class='group'>本站沒有也可用</div>";
        html += "<a class='hit' data-b100-nav='content' href='practical_hymnology/analyze.html?q=" + encodeURIComponent(q) + "'><strong>用「" + esc(q) + "」做分析草稿</strong><small>對學科＋複製外連 Prompt</small></a>";
      }
      hits.innerHTML = html;
    }

    function render(q) {
      ensureConfirmed(function () { paint(q); });
    }

    qEl.addEventListener("input", function () { render(qEl.value.trim()); });
    document.getElementById("scopes").addEventListener("click", function (e) {
      var b = e.target.closest("[data-scope]");
      if (!b) return;
      scope = b.getAttribute("data-scope");
      Array.prototype.forEach.call(document.querySelectorAll("#scopes button"), function (x) {
        x.classList.toggle("on", x === b);
      });
      render(qEl.value.trim());
    });
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.type !== "ph-search") return;
      if (d.scope) {
        scope = d.scope;
        Array.prototype.forEach.call(document.querySelectorAll("#scopes button"), function (x) {
          x.classList.toggle("on", x.getAttribute("data-scope") === scope);
        });
      }
      qEl.value = d.q || "";
      confirmedMap = null;
      render(qEl.value.trim());
    });
    window.addEventListener("focus", function () { confirmedMap = null; });
    render("");
  })();
  (function () {
    var GATES = [
      { id: "intro", label: "導論", en: "Introduction" },
      { id: "A", label: "音樂", en: "Music" },
      { id: "B", label: "文字", en: "Text & Poetry" },
      { id: "C", label: "信仰", en: "Faith & Theology" },
      { id: "D", label: "教會", en: "Church & Worship" },
      { id: "E", label: "人生", en: "Life" },
      { id: "F", label: "綜合", en: "Integration" }
    ];
    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }
    function lensName(lens) {
      return String(lens || "").replace(/^\d+\.\s*/, "") || "課題";
    }
    function zhTitle(t) {
      var s = String(t || "");
      var cut = s.search(/\s+[A-Za-z]/);
      return cut > 0 ? s.slice(0, cut) : s;
    }
    function lessonOf(s, prefix) {
      if (s.id === "hymn_most_0001") return { href: prefix + "lessons/lesson_01_all_people.html", kind: "lesson", tag: "有課", name: "普天之下萬民萬族" };
      if (s.id === "hymn_most_0121") return { href: prefix + "lessons/lesson_amazing_grace.html", kind: "lesson", tag: "有課", name: "奇異恩典" };
      var names = {
        hymn_00_0001: "主耶和華，求祢引領",
        hymn_most_0122: "怎能如此",
        hymn_most_0025: "平安夜",
        hymn_00_0004: "索塞克斯聖誕頌",
        hymn_chi_0001: "大秦景教三威蒙度讚",
        hymn_pwc_0001: "祂是主",
        hymn_world_0001: "咱著對主唱歌",
        hymn_22_0001: "輕輕觸摸大地"
      };
      return {
        href: prefix + "analyze.html?id=" + encodeURIComponent(s.id),
        kind: "ask",
        tag: "提問",
        name: names[s.id] || s.zh || s.id
      };
    }
    function link(href, label) {
      return "<a data-b100-nav='content' href='" + href + "'>" + esc(label) + "</a>";
    }
    function sum(zh, en) {
      return "<summary>" + esc(zh) + "<small class='en'>" + esc(en) + "</small></summary>";
    }
    var discs = (window.PH_DISCIPLINES_INDEX && window.PH_DISCIPLINES_INDEX.disciplines) || [];
    var samples = (window.PH_SEARCH_INDEX && window.PH_SEARCH_INDEX.samples) || [];
    var html = "<details data-zone='find'>" + sum("找聖詩", "Explore Hymns") +
      link("practical_hymnology/landing.html#find", "這一區的地圖") +
      link("hymn_catalog_sort.html", "全部聖詩") +
      link("practical_hymnology/explore/index.html", "外站詩集（Hymnary）") +
      link("hymn/default.htm", "舊索引（原文不改）") +
      "<p class='soon-note'>作者、曲調、詩集、經文、主題：以後</p></details>";
    html += "<details data-zone='learn'>" + sum("學聖詩", "Learn Through Hymns") +
      link("practical_hymnology/landing.html#learn-A", "七門地圖") +
      link("practical_hymnology/resource_selector.html#sets", "課題選歌");
    GATES.forEach(function (g) {
      var rows = discs.filter(function (d) { return d.cat === g.id; });
      var groups = [];
      var map = {};
      rows.forEach(function (d) {
        var k = lensName(d.lens);
        if (!map[k]) { map[k] = []; groups.push(k); }
        map[k].push(d);
      });
      html += "<details>" + sum(g.label, g.en) +
        link("practical_hymnology/landing.html#learn-" + g.id, "在右欄展開");
      groups.forEach(function (k) {
        html += "<div class='group'>" + esc(k) + "</div>";
        map[k].forEach(function (d) {
          html += link("practical_hymnology/" + d.filepath, d.code + " " + zhTitle(d.title_zh));
        });
      });
      html += "</details>";
    });
    html += "</details>";
    html += "<details data-zone='research'>" + sum("研究聖詩", "Research Hymns") +
      link("practical_hymnology/landing.html#research", "已有分析的地圖");
    samples.forEach(function (s) {
      var item = lessonOf(s, "practical_hymnology/");
      html += "<a class='ph-line' data-b100-nav='content' href='" + item.href + "'><span class='kind " + item.kind + "'>" + item.tag + "</span>" + esc(item.name) + "</a>";
    });
    html += "<p class='soon-note'>按科目請到學聖詩。這裡沒有另一套庫。</p></details>";
    html += "<details data-zone='workshop'>" + sum("聖詩工作坊", "Hymn Workshop") +
      link("practical_hymnology/Applied-Hymnology/index.html", "八週清單") +
      link("practical_hymnology/Applied-Hymnology/week1.html", "第1週 · 奇妙恩典") +
      link("practical_hymnology/Applied-Hymnology/week2.html", "第2週 · 聖哉三一") +
      link("practical_hymnology/Applied-Hymnology/week3.html", "第3週 · 堅固保障") +
      link("practical_hymnology/Applied-Hymnology/week4.html", "第4週 · 心靈安寧") +
      link("practical_hymnology/Applied-Hymnology/week5.html", "第5週 · 教會年曆") +
      link("practical_hymnology/Applied-Hymnology/week6.html", "第6週 · 耶穌恩友") +
      link("practical_hymnology/Applied-Hymnology/week7.html", "第7週 · 我心獻曲") +
      link("practical_hymnology/Applied-Hymnology/week8.html", "第8週 · 綜合敬拜") +
      "</details>";
    html += "<details data-zone='use'>" + sum("使用聖詩", "Use Hymns") +
      link("practical_hymnology/landing.html#use", "這一區的地圖") +
      "<a href='../qna/index.html?panel=ask' data-b100-nav='module' data-b100-sidebar='about:blank' data-b100-content='qna/index.html?panel=ask'>這詞去難題問</a>" +
      link("hymn_ai_tools.html", "AI 工具") +
      link("practical_hymnology/ai_youtube_music_library_ai_parser_ironclad_153_proof_edition.html", "影音庫（貼章節聽歌）") +
      link("hymn_editor.html", "編輯歌詞") +
      link("ppt_generator.html", "投影歌詞") +
      link("practical_hymnology/resource_selector.html#guide", "怎樣使用？") +
      "<p class='soon-note'>崇拜歌單：以後</p></details>";
    var tree = document.getElementById("tree");
    tree.insertAdjacentHTML("beforeend", html);
    function openZone(zone) {
      var nodes = tree.querySelectorAll("details[data-zone]");
      for (var i = 0; i < nodes.length; i++) {
        var d = nodes[i];
        if (d.parentElement !== tree) continue;
        d.open = d.getAttribute("data-zone") === zone;
      }
    }
    function zoneFromHref(href) {
      var path = href || "";
      var hash = "";
      var query = "";
      var hi = path.indexOf("#");
      if (hi >= 0) { hash = path.slice(hi + 1); path = path.slice(0, hi); }
      var qi = path.indexOf("?");
      if (qi >= 0) { query = path.slice(qi + 1); path = path.slice(0, qi); }
      var zq = "";
      query.split("&").forEach(function (pair) {
        var bits = pair.split("=");
        var key = "";
        var val = "";
        try { key = decodeURIComponent(bits[0] || ""); val = decodeURIComponent(bits[1] || ""); } catch (e) {}
        if (key === "zone") zq = val;
      });
      if (/Applied-Hymnology/i.test(path)) return "workshop";
      if (/hymn_catalog_sort|\/explore\//i.test(path)) return "find";
      if (/hymn_ai_tools|hymn_editor|ppt_generator|ai_youtube_music_library/i.test(path)) return "use";
      if (/resource_selector/i.test(path)) return hash.indexOf("sets") === 0 ? "learn" : "use";
      if (/analyze\.html|core_hymns|\/lessons\/|hymn_amazing_grace/i.test(path)) return "research";
      if (/journey_intro|\/disciplines\/|learn_catalog|\/prisms\//i.test(path)) return "learn";
      if (/landing\.html/i.test(path)) {
        if (hash.indexOf("learn") === 0 || zq === "learn") return "learn";
        if (hash === "find" || hash === "research" || hash === "use") return hash;
        if (zq === "find" || zq === "research" || zq === "use") return zq;
      }
      return "";
    }
    function syncFromContent() {
      try {
        var w = window.parent.frames.contentFrame;
        if (!w || !w.location) return;
        var zone = zoneFromHref(w.location.href || "");
        if (zone) openZone(zone);
      } catch (e) {}
    }
    window.addEventListener("message", function (e) {
      if (!e.data || e.data.type !== "ph-zone") return;
      openZone(e.data.zone);
    });
    try { window.parent.postMessage({ type: "ph-zone-ready" }, "*"); } catch (eReady) {}
    tree.addEventListener("click", function (e) {
      if (!e.target.closest("a[href]")) return;
      try { window.parent.postMessage({ type: "hymn-nav-close" }, "*"); } catch (err) {}
    });
    syncFromContent();
  })();
  </script>
</body>
</html>
