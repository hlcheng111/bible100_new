<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曲譜表 · 可排序（原頁）</title>
  <link rel="stylesheet" href="css/hymn_catalog_sort.css">
  <script src="data/default-htm-catalog-embedded.js"></script>
</head>
<body class="hymn-cat">
<script src="practical_hymnology/ph_module_bar.js" data-root="practical_hymnology/"></script>
  <header class="hymn-cat-bar">
    <div>
      <h1>曲譜表（可排序）</h1>
      <p>6 欄來自 <strong>default.htm</strong>（原文未改）。點表頭排序，點列開原頁。</p>
    </div>
    <label class="hymn-cat-search">
      篩選
      <input type="search" id="hymnCatFilter" placeholder="歌名、編號、作者…" autocomplete="off">
    </label>
  </header>
  <p id="hymnCatCount" class="hymn-cat-count">載入中…</p>
  <p class="hymn-cat-note">
    手做原索引仍在
    <a href="hymn/default.htm" target="contentFrame">hymn/default.htm</a>
    （不改原文）。工作卡改從側欄「怎麼教」進去。
  </p>
  <div class="hymn-cat-wrap">
    <table class="hymn-cat-table">
      <thead><tr id="hymnCatHead"></tr></thead>
      <tbody id="hymnCatBody"></tbody>
    </table>
  </div>
  <script src="js/hymn_catalog_sort.js"></script>
  <script>
    if (window.B100HymnCatalogSort) window.B100HymnCatalogSort.boot({ hymnRoot: "" });
  </script>
</body>
</html>
