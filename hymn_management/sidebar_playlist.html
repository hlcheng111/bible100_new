  <script>
    (function() {
      let allHymns = [];
      let searchTimeout = null;

      function toHymnUrl(sourcePath) {
        if (!sourcePath) return '#';
        return 'hymn/' + (sourcePath || '').replace(/^\.\.\//, '');
      }

      function getFieldValue(h, field) {
        var v = (h[field] || '').toString().trim();
        if (field === 'author') v = v.replace(/^_+/, '').trim();
        return v;
      }

      function extractChinese(str) {
        if (!str) return '';
        var m = str.match(/[\u4e00-\u9fff\u3000-\u303f\u3100-\u312f\uff00-\uffef]+/g);
        return m ? m.join(' ').trim() : '';
      }

      function extractNonCJK(str) {
        if (!str) return '';
        return str.replace(/[\u4e00-\u9fff\u3000-\u303f\u3100-\u312f\uff00-\uffef]+/g, ' ').replace(/\s+/g, ' ').trim();
      }

      function filterAndRender() {
        var field = document.getElementById('fieldSelect').value;
        var q = (document.getElementById('searchInput').value || '').trim();
        var hymnal = (document.getElementById('hymnalSelect') && document.getElementById('hymnalSelect').value) || '';
        var list = allHymns;
        if (hymnal) list = list.filter(function(h) { return (h.hymnal || '') === hymnal; });
        var totalInScope = list.length;
        if (q) {
          var qLower = q.toLowerCase();
          list = list.filter(function(h) {
            var v = getFieldValue(h, field);
            return v.toLowerCase().indexOf(qLower) >= 0;
          });
        }
        list.sort(function(a, b) {
          var va = getFieldValue(a, field);
          var vb = getFieldValue(b, field);
          return (va || '').localeCompare(vb || '', 'zh');
        });
        renderList(list, totalInScope, field);
      }

      function renderList(list, totalInScope, field) {
        var container = document.getElementById('resultList');
        var countEl = document.getElementById('resultCount');
        var total = totalInScope != null ? totalInScope : allHymns.length;
        countEl.textContent = '總數: ' + total + ' · 顯示: ' + list.length + ' 首';

        if (list.length === 0) {
          container.innerHTML = '<div class="empty-msg">' + (document.getElementById('searchInput').value.trim() ? '無符合結果' : '輸入關鍵字搜尋詩歌') + '</div>';
          return;
        }

        var f = field || 'title_zh';
        var titleEn = function(h) { return ((h.title_en || '').toString().trim()) || (h.number || '—'); };
        var titleZh = function(h) { return (h.title_zh || '').toString().trim(); };
        var esc = function(s) { return (s || '').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };

        var html = '';
        list.forEach(function(h) {
          var url = toHymnUrl(h.sourcePath);
          var primaryVal = getFieldValue(h, f);
          var secondaryVal = '';
          if (f === 'title_zh') {
            var raw = titleZh(h) || titleEn(h) || '';
            primaryVal = extractChinese(raw) || raw || '—';
            secondaryVal = extractNonCJK(raw) || (primaryVal === raw ? '' : raw);
          } else if (f === 'title_en') {
            var raw = titleEn(h) || titleZh(h) || '';
            primaryVal = extractNonCJK(raw) || extractChinese(raw) || raw || '—';
            secondaryVal = extractChinese(raw) || (primaryVal === raw ? '' : raw);
          } else if (f === 'number') {
            primaryVal = titleZh(h) || titleEn(h) || '—';
            secondaryVal = titleEn(h);
          } else {
            primaryVal = primaryVal || '—';
            secondaryVal = titleZh(h) || titleEn(h);
          }
          if (secondaryVal === primaryVal) secondaryVal = '';
          html += '<div class="result-item" data-url="' + esc(url) + '" data-id="' + esc(h.id || '') + '">';
          html += '<span class="num">' + esc(h.number || '') + '</span>';
          html += '<div class="content">';
          html += '<span class="primary">' + esc(primaryVal) + '</span>';
          if (secondaryVal) html += '<span class="secondary">' + esc(secondaryVal) + '</span>';
          html += '</div></div>';
        });
        container.innerHTML = html;

        container.querySelectorAll('.result-item').forEach(function(el) {
          el.addEventListener('click', function() {
            var url = el.getAttribute('data-url');
            var id = el.getAttribute('data-id');
            if (window.parent && window.parent !== window) {
              // 優先開啟真頁（原詩歌 HTML），無 url 時才用 hymn_template 摘要
              if (url && url !== '#') {
                window.parent.postMessage({ type: 'navigate', url: url }, '*');
              } else if (id) {
                window.parent.postMessage({ type: 'navigate', url: 'hymn_template.html?id=' + encodeURIComponent(id), id: id }, '*');
              }
            }
          });
        });
      }

      function loadData() {
        (window.loadSourceHymns || function(){ return fetch('data/source-hymns.json').then(function(r){ return r.ok ? r.json() : Promise.reject(); }); })()
          .then(function(d) {
            allHymns = (d.hymns || []).filter(function(h) { return h.sourcePath; });
            filterAndRender();
          })
          .catch(function() {
            if (typeof EMBEDDED !== 'undefined' && EMBEDDED.hymns) {
              allHymns = EMBEDDED.hymns.filter(function(h) { return h.sourcePath; });
              filterAndRender();
            } else {
              document.getElementById('resultList').innerHTML = '<div class="empty-msg">無法載入詩歌資料</div>';
            }
          });
      }

      document.getElementById('fieldSelect').addEventListener('change', filterAndRender);
      var hymnalEl = document.getElementById('hymnalSelect');
      if (hymnalEl) hymnalEl.addEventListener('change', filterAndRender);
      document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(filterAndRender, 150);
      });

      document.addEventListener('DOMContentLoaded', loadData);
    })();
  </script>
</body>
</html>
