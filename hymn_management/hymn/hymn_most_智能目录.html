    // Total: 128 key hymns included (representing the most popular hymns from hymn_most folder)
    
    var allData = [];
    var filteredData = [];
    var sortCol = -1;
    var sortDir = 'asc';
    var originalData = [];
    
    function init() {
        // Load all 192 files from hymn_most folder
        loadHymnData();
        originalData = [...allData];
        filteredData = [...allData];
        renderTable();
        updateStats();
    }
    
    function loadHymnData() {
        // For now using sample data. Will be replaced with complete 192 entries
        allData = hymnData.map(function(item, index) {
            return {
                num: item.num || ('000' + (index + 1)).slice(-4),
                titleEn: item.titleEn || extractEnglishTitle(item.file),
                titleCh: item.titleCh || extractChineseTitle(item.file),
                author: item.author || extractAuthor(item.file),
                tags: item.tags || [],
                file: item.file,
                hymnalA: '',
                hymnalB: '',
                hymnalC: '',
                hymnalD: '',
                hymnalE: ''
            };
        });
    }
    
    function extractEnglishTitle(filename) {
        var match = filename.match(/^\d+\s+(.+?)(?:_|[\u4e00-\u9fff])/);
        return match ? match[1].trim() : '';
    }
    
    function extractChineseTitle(filename) {
        var match = filename.match(/([\u4e00-\u9fff]+)/);
        return match ? match[1] : '';
    }
    
    function extractAuthor(filename) {
        var match = filename.match(/_\s*([A-Za-z\s,\.]+?)(?:\s+[\u4e00-\u9fff]|\s+\d)/);
        return match ? match[1].trim() : '';
    }
    
    function sortTable(col) {
        if (sortCol === col) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
            sortCol = col;
            sortDir = 'asc';
        }
        
        var cols = ['num', 'titleEn', 'titleCh', 'author', 'tags'];
        var key = cols[col];
        
        filteredData.sort(function(a, b) {
            var aVal = a[key];
            var bVal = b[key];
            
            if (col === 0) {
                aVal = parseInt(aVal) || 0;
                bVal = parseInt(bVal) || 0;
            } else if (Array.isArray(aVal)) {
                aVal = aVal.join(',');
                bVal = bVal.join(',');
            }
            
            if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
            return 0;
        });
        
        updateButtons();
        renderTable();
    }
    
    function resetTable() {
        filteredData = [...originalData];
        sortCol = -1;
        sortDir = 'asc';
        document.getElementById('searchInput').value = '';
        updateButtons();
        renderTable();
        updateStats();
    }
    
    function searchTable() {
        var query = document.getElementById('searchInput').value.toLowerCase();
        
        if (!query) {
            filteredData = [...allData];
        } else {
            filteredData = allData.filter(function(item) {
                return item.num.toLowerCase().includes(query) ||
                       item.titleEn.toLowerCase().includes(query) ||
                       item.titleCh.includes(query) ||
                       item.author.toLowerCase().includes(query) ||
                       item.tags.join(',').toLowerCase().includes(query);
            });
        }
        
        renderTable();
        updateStats();
    }
    
    function renderTable() {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        filteredData.forEach(function(item) {
            var tr = document.createElement('tr');
            
            // Number
            var td1 = document.createElement('td');
            td1.textContent = item.num;
            tr.appendChild(td1);
            
            // English Title (with link)
            var td2 = document.createElement('td');
            var link = document.createElement('a');
            link.href = 'hymn_most/' + encodeFileName(item.file);
            link.className = 'hymn-link';
            link.textContent = item.titleEn;
            link.target = '_blank';
            td2.appendChild(link);
            tr.appendChild(td2);
            
            // Chinese Title
            var td3 = document.createElement('td');
            td3.textContent = item.titleCh;
            tr.appendChild(td3);
            
            // Author
            var td4 = document.createElement('td');
            td4.textContent = item.author;
            tr.appendChild(td4);
            
            // Tags
            var td5 = document.createElement('td');
            item.tags.forEach(function(tag) {
                var span = document.createElement('span');
                span.className = 'tag tag-' + tag;
                span.textContent = getTagLabel(tag);
                td5.appendChild(span);
            });
            tr.appendChild(td5);
            
            // Hymnal columns (A-E)
            for(var i = 0; i < 5; i++) {
                var td = document.createElement('td');
                td.className = 'input-cell';
                td.textContent = '-';
                td.title = 'Click to add';
                tr.appendChild(td);
            }
            
            tbody.appendChild(tr);
        });
    }
    
    function encodeFileName(filename) {
        // Proper URL encoding for the file path
        return encodeURIComponent(filename).replace(/%20/g, '%20');
    }
    
    function getTagLabel(tag) {
        var labels = {
            'popular': '⭐推荐',
            'super': '🏆特推',
            'children': '👶儿童',
            'modern': '💎现代',
            'selected': '✨精选',
            'chinese': '🇨🇳华人'
        };
        return labels[tag] || tag;
    }
    
    function updateButtons() {
        var buttons = document.querySelectorAll('.sort-btn:not(.reset-btn)');
        buttons.forEach(function(btn, index) {
            btn.classList.remove('active', 'asc', 'desc');
            if (index === sortCol) {
                btn.classList.add('active', sortDir);
            }
        });
    }
    
    function updateStats() {
        var stats = document.getElementById('stats');
        stats.innerHTML = '📊 Total: ' + allData.length + ' hymns | Displaying: ' + filteredData.length + ' hymns';
    }
    
    window.onload = init;
    </script>
</body>
</html>
