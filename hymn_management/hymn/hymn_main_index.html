<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 聖詩增強系統 - 主控制台</title>
  <style type="text/css">
    body { 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft YaHei", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
      background:#f6f7fb; 
      font-size: 12px;
    }
    
    /* Topbar - 雙層設計 */
    .topbar {
      position: fixed;
      top:0;
      left:0;
      right:0;
      height:80px;
      background:#0b5fa5;
      color:#fff;
      border-bottom:3px solid #2aa5ff;
      z-index:999;
    }

    .topbar-inner {
      display: flex;
      flex-direction: column;
      height: 80px;
      padding: 5px 15px;
    }

    /* 第一行：品牌和主要控制 */
    .topbar-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
    }

    .brand {
      font-weight: bold;
      font-size: 14px;
    }

    .main-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      padding: 4px 8px;
      background: #2aa5ff;
      color: #fff;
      text-decoration: none;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: #0077cc;
    }

    .control-btn.active {
      background: #00b894;
    }

    .special-link {
      display: inline-block;
      margin: 0 10px;
      padding: 8px 16px;
      background: #ff6b6b;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 11px;
      transition: all 0.3s ease;
    }

    .special-link:hover {
      background: #ff5252;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }

    .special-link.success {
      background: #00b894;
    }

    .special-link.success:hover {
      background: #00a085;
      box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
    }

    /* 第二行：5本詩集選擇器 */
    .topbar-row2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 35px;
      gap: 15px;
    }

    .hymnal-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
    }

    .hymnal-select {
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 10px;
      background: white;
      color: #333;
    }

    .category-symbols {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .category-symbols label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .category-symbols label:hover {
      background: rgba(255,255,255,0.1);
    }

    .category-symbols input[type="checkbox"] {
      margin: 0;
    }

    .hymnal-search {
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 10px;
      width: 150px;
    }

    .stats-display {
      color: #ccc;
      font-size: 9px;
      white-space: nowrap;
    }

    /* Main area with 2 iframes */
    .main { 
      margin-top: 80px; 
    }

    table.layout { 
      width: 100%; 
      height: calc(100vh - 80px); 
      border-collapse: collapse; 
      table-layout: fixed; 
    }
    
    td.left { 
      width: 200px;
      background: #eef6ff; 
      border-right: 2px solid #2aa5ff; 
      vertical-align: top; 
    }
    
    td.right { 
      vertical-align: top; 
    }
    
    iframe { 
      border: 0; 
      width: 100%; 
      height: 100%; 
    }
    
    #sidebarFrame { 
      background: #eef6ff; 
    }
    
    #contentFrame { 
      background: #ffffff; 
    }
    
    /* Dashboard Cards */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    
    .card h3 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .card p {
      color: #666;
      margin: 0 0 20px 0;
      line-height: 1.6;
    }
    
    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .btn.primary {
      background: #007bff;
      color: white;
    }
    
    .btn.primary:hover {
      background: #0056b3;
    }
    
    .btn.success {
      background: #28a745;
      color: white;
    }
    
    .btn.success:hover {
      background: #1e7e34;
    }
    
    .btn.info {
      background: #17a2b8;
      color: white;
    }
    
    .btn.info:hover {
      background: #138496;
    }
    
    .btn.warning {
      background: #ffc107;
      color: #212529;
    }
    
    .btn.warning:hover {
      background: #e0a800;
    }

    /* Stats */
    .stats-overview {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .stat-item {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 10px;
    }
    
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .topbar-inner {
        padding: 0 15px;
      }
      
      .brand {
        font-size: 14px;
      }
      
      .nav-buttons {
        gap: 5px;
      }
      
      .nav-btn {
        padding: 6px 12px;
        font-size: 10px;
      }
      
      .main-container {
        padding: 15px;
      }
      
      .dashboard {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
<h1 class="page-main-title">hymn main index</h1>

  <div class="topbar">
    <div class="topbar-inner">
      <!-- 第一行：品牌和主要控制 -->
      <div class="topbar-row1">
        <div class="brand">🎵 聖詩增強系統 v1.0</div>
        <div class="main-controls">
          <button class="control-btn" data-section="dashboard" onclick="switchSection('dashboard')">📊 儀表板</button>
          <button class="control-btn" data-section="database" onclick="switchSection('database')">🗄️ 數據庫</button>
          <button class="control-btn active" data-section="browse" onclick="switchSection('browse')">🎵 聖詩瀏覽</button>
          <button class="control-btn" data-section="search" onclick="switchSection('search')">🔍 智能搜索</button>
          <button class="control-btn" data-section="reports" onclick="switchSection('reports')">📋 報表</button>
          <button class="control-btn" data-section="tools" onclick="switchSection('tools')">🔧 工具</button>
        </div>
      </div>
      
      <!-- 第二行：5本詩集選擇器 -->
      <div class="topbar-row2" id="hymnalSelector" style="display: none;">
        <div class="hymnal-controls">
          <select class="hymnal-select" id="hymnalSelect" onchange="switchHymnal()">
            <option value="all">全部詩集 (3,195首)</option>
            <option value="century_praise">世紀頌讚 (573首)</option>
            <option value="universal_praise">普頌新 (1122首)</option>
            <option value="lord_new_songs">頌主新歌 (400首)</option>
            <option value="new_hymnal">新編讚美詩 (600首)</option>
            <option value="hymns_faith">Hymns of the Faith (500首)</option>
          </select>
          
          <div class="category-symbols">
            <label><input type="checkbox" value="world_famous" onchange="filterByCategory()"> ▲ 世界250名聖詩</label>
            <label><input type="checkbox" value="chinese" onchange="filterByCategory()"> ● 華人詩歌</label>
            <label><input type="checkbox" value="worship" onchange="filterByCategory()"> ◆ 敬拜短歌</label>
            <label><input type="checkbox" value="ethnic" onchange="filterByCategory()"> ★ 民族聖詩</label>
          </div>
          
          <input type="text" class="hymnal-search" placeholder="搜索聖詩..." onkeyup="searchHymns()">
        </div>
        
        <div class="stats-display" id="statsDisplay">
          載入中...
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <table class="layout">
      <tr>
        <td class="left">
          <iframe id="sidebarFrame" name="sidebarFrame" title="Sidebar"></iframe>
        </td>
        <td class="right">
          <iframe id="contentFrame" name="contentFrame" title="Content"></iframe>
        </td>
      </tr>
    </table>
  </div>

  </div>

  <script>
    // 頁面映射配置
    var sectionMap = {
      dashboard: { sidebar: 'hymn_sidebar_dashboard.html', content: 'hymn_content_dashboard.html', showHymnalSelector: false },
      database: { sidebar: 'hymn_sidebar_database.html', content: 'database_system.html', showHymnalSelector: false },
      browse: { sidebar: 'hymn_sidebar_browse.html', content: 'hymn_content_browse.html', showHymnalSelector: true },
      search: { sidebar: 'hymn_sidebar_search.html', content: 'search.htm', showHymnalSelector: false },
      reports: { sidebar: 'hymn_sidebar_reports.html', content: 'hymn_content_reports.html', showHymnalSelector: false },
      tools: { sidebar: 'hymn_sidebar_tools.html', content: 'hymn_content_tools.html', showHymnalSelector: false }
    };

    function setActive(section) {
      var buttons = document.querySelectorAll('.control-btn');
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute('data-section') === section) {
          buttons[i].className = 'control-btn active';
        } else {
          buttons[i].className = 'control-btn';
        }
      }
    }

    function switchSection(section) {
      var info = sectionMap[section];
      if (!info) return;
      setActive(section);
      
      // 顯示或隱藏5本詩集選擇器
      var hymnalSelector = document.getElementById('hymnalSelector');
      if (info.showHymnalSelector) {
        hymnalSelector.style.display = 'flex';
      } else {
        hymnalSelector.style.display = 'none';
      }
      
      // Load sidebar page
      var sf = document.getElementById('sidebarFrame');
      sf.src = info.sidebar;
      
      // Load content page
      document.getElementById('contentFrame').src = info.content;
    }

    // 5本詩集功能
    function switchHymnal() {
      var select = document.getElementById('hymnalSelect');
      var selectedHymnal = select.value;
      
      // 發送消息到側邊欄
      if (window.frames.sidebarFrame) {
        window.frames.sidebarFrame.postMessage({
          type: 'switchHymnal',
          hymnal: selectedHymnal
        }, '*');
      }
      
      updateStats();
    }

    function filterByCategory() {
      var checkboxes = document.querySelectorAll('.category-symbols input[type="checkbox"]');
      var selectedCategories = [];
      
      for (var i = 0; i < checkboxes.length; i++) {
        if (checkboxes[i].checked) {
          selectedCategories.push(checkboxes[i].value);
        }
      }
      
      // 發送消息到側邊欄
      if (window.frames.sidebarFrame) {
        window.frames.sidebarFrame.postMessage({
          type: 'filterByCategory',
          categories: selectedCategories
        }, '*');
      }
      
      updateStats();
    }

    function searchHymns() {
      var searchInput = document.querySelector('.hymnal-search');
      var searchTerm = searchInput.value;
      
      // 發送消息到側邊欄
      if (window.frames.sidebarFrame) {
        window.frames.sidebarFrame.postMessage({
          type: 'searchHymns',
          searchTerm: searchTerm
        }, '*');
      }
      
      updateStats();
    }

    function updateStats() {
      var statsDisplay = document.getElementById('statsDisplay');
      var hymnalSelect = document.getElementById('hymnalSelect');
      var selectedHymnal = hymnalSelect.value;
      
      var hymnalStats = {
        'all': '總數: 3,195首',
        'century_praise': '世紀頌讚: 573首',
        'universal_praise': '普頌新: 1122首',
        'lord_new_songs': '頌主新歌: 400首',
        'new_hymnal': '新編讚美詩: 600首',
        'hymns_faith': 'Hymns of the Faith: 500首'
      };
      
      statsDisplay.textContent = hymnalStats[selectedHymnal] || '載入中...';
    }

    // Wire up topbar clicks
    function initTopbar() {
      // 舊的導航鏈接事件處理已移除，現在使用按鈕的onclick事件
      console.log('Topbar 初始化完成 - 使用新的按鈕控制系統');
    }
    
    // 頁面功能
    function openDatabase() {
      switchSection('database');
    }
    
    function openDataManagement() {
      // 打開數據管理界面
      if (window.hymnDataManagement) {
        window.hymnDataManagement.showDataManagementInterface();
      } else {
        alert('請先載入數據管理系統');
      }
    }
    
    function openSearch() {
      window.open('search.htm', '_blank', 'width=1200,height=800');
    }
    
    function openAdvancedSearch() {
      // 打開進階搜索
      if (window.hymnSearchEnhancement) {
        window.hymnSearchEnhancement.showSearchInterface();
      } else {
        alert('請先載入搜索系統');
      }
    }
    
    function openReports() {
      window.open('database_system.html#reports', '_blank', 'width=1400,height=900');
    }
    
    function generateQuickReport() {
      if (window.reportGenerator) {
        const report = window.reportGenerator.generateOverviewReport();
        const htmlReport = window.reportGenerator.generateHTMLReport(report);
        downloadReport('quick_overview', htmlReport);
      } else {
        alert('請先載入報表系統');
      }
    }
    
    function browseHymns() {
      window.open('hymn.html', '_blank');
    }
    
    function browseAuthors() {
      window.open('hymn_author/', '_blank');
    }
    
    function startAutoBuild() {
      window.open('database_system.html', '_blank', 'width=1400,height=900');
      setTimeout(() => {
        if (window.autoBuilder) {
          window.autoBuilder.startBuild();
        }
      }, 2000);
    }
    
    function openSystemTools() {
      window.open('database_system.html#database', '_blank', 'width=1400,height=900');
    }
    
    function openLegacyIndex() {
      window.open('index.htm', '_blank');
    }
    
    function showHelp() {
      const helpContent = `
        🎵 聖詩增強系統 v1.0 使用說明
        
        📊 數據庫管理：
        - 管理超過6,000首聖詩
        - 支援批量導入和數據驗證
        - 完整的統計分析功能
        
        🔍 智能搜索：
        - 快捷鍵：Ctrl+S
        - 支援中英文搜索
        - 智能篩選和建議
        
        📋 報表系統：
        - 6種專業報表格式
        - HTML格式自動下載
        - 完整的數據分析
        
        ⌨️ 快捷鍵：
        - Ctrl+S：打開搜索
        - Ctrl+D：數據管理
        - Ctrl+H：返回頂部
        - ESC：關閉彈窗
        
        更多詳細說明請參考 README_聖詩增強系統.md
      `;
      alert(helpContent);
    }
    
    function showShortcuts() {
      const shortcuts = `
        ⌨️ 快捷鍵指南：
        
        🔍 搜索相關：
        - Ctrl+S：打開/關閉搜索界面
        - ESC：關閉搜索界面
        
        📊 數據管理：
        - Ctrl+D：打開/關閉數據管理界面
        
        🧭 導航相關：
        - Ctrl+H：返回頁面頂部
        - ESC：關閉所有彈窗
        
        💡 提示：所有快捷鍵都有防衝突設計
      `;
      alert(shortcuts);
    }
    
    // 下載報表功能
    function downloadReport(reportType, htmlContent) {
      try {
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hymn_report_${reportType}_${new Date().toISOString().slice(0, 10)}.html`;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        alert(`📄 報表已下載: ${a.download}`);
      } catch (error) {
        console.error('下載報表失敗:', error);
        alert('下載報表失敗，請檢查瀏覽器設置');
      }
    }
    
    // 載入系統腳本
    function loadSystemScripts() {
      const scripts = [
        'database_core.js',
        'search_enhancement.js', 
        'data_management.js',
        'report_generator.js',
        'auto_build.js'
      ];
      
      scripts.forEach(script => {
        const scriptElement = document.createElement('script');
        scriptElement.src = script;
        scriptElement.onerror = () => console.log(`無法載入 ${script}`);
        document.head.appendChild(scriptElement);
      });
    }
    
    // 初始化頁面
    function initPage() {
      console.log('🎵 聖詩增強系統主控台載入完成');
      
      // 設置頂部導航
      initTopbar();
      
      // 等待 iframe 載入完成後設置
      var sidebarFrame = document.getElementById('sidebarFrame');
      var contentFrame = document.getElementById('contentFrame');
      
      sidebarFrame.onload = function() {
        console.log('Sidebar iframe 已載入');
      };
      
      contentFrame.onload = function() {
        console.log('Content iframe 已載入');
      };
      
      // 載入系統腳本
      loadSystemScripts();
      
      // Default section: browse - 載入聖詩瀏覽
      console.log('載入預設區域: browse');
      switchSection('browse');
    }

    // 當 DOM 載入完成後初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
