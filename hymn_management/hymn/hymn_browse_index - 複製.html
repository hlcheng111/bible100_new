<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 聖詩瀏覽系統</title>
  <style type="text/css">
    body { 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft YaHei", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
      background:#f6f7fb; 
      font-size: 12px;
    }
    
    /* Topbar - 控制和搜索 */
    .topbar { 
      position: fixed; 
      top:0; 
      left:0; 
      right:0; 
      height:80px; 
      background:#0b5fa5; 
      color:#fff; 
      border-bottom:3px solid #2aa5ff; 
      z-index:999; 
    }
    
    .topbar-inner { 
      display: flex;
      flex-direction: column;
      height: 80px;
      padding: 5px 15px;
    }
    
    /* 第一行：品牌和主要控制 */
    .topbar-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
    }
    
    .brand { 
      font-weight: bold; 
      font-size: 14px;
    }
    
    .main-controls {
      display: flex;
      gap: 8px;
    }
    
    .control-btn {
      padding: 4px 8px;
      background: #2aa5ff;
      color: #fff;
      text-decoration: none;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .control-btn:hover {
      background: #0077cc;
    }
    
    .control-btn.active {
      background: #00b894;
    }
    
    /* 第二行：搜索和排序控制 */
    .topbar-row2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 35px;
      gap: 15px;
    }
    
    .search-section {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
    }
    
    .search-input {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 11px;
      width: 200px;
    }
    
    .filter-section {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .filter-select {
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 10px;
      background: white;
    }
    
    .sort-section {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* Main area with 2 iframes */
    .main { 
      margin-top: 80px; 
    }
    
    table.layout { 
      width: 100%; 
      height: calc(100vh - 80px); 
      border-collapse: collapse; 
      table-layout: fixed; 
    }
    
    td.left { 
      width: 300px;
      background: #eef6ff; 
      border-right: 2px solid #2aa5ff; 
      vertical-align: top; 
    }
    
    td.right { 
      vertical-align: top; 
    }
    
    iframe { 
      border: 0; 
      width: 100%; 
      height: 100%; 
    }
    
    #sidebarFrame { 
      background: #eef6ff; 
    }
    
    #contentFrame { 
      background: #ffffff; 
    }

    /* 統計顯示 */
    .stats-display {
      color: #ccc;
      font-size: 10px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .topbar {
        height: 100px;
      }
      
      .topbar-inner {
        height: 100px;
      }
      
      .topbar-row2 {
        flex-direction: column;
        gap: 5px;
        height: 55px;
      }
      
      .search-section {
        width: 100%;
      }
      
      .search-input {
        flex: 1;
        width: auto;
      }
      
      .main {
        margin-top: 100px;
      }
      
      table.layout {
        height: calc(100vh - 100px);
      }
      
      td.left {
        width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <!-- 第一行：品牌和主要控制 -->
      <div class="topbar-row1">
        <div class="brand">🎵 聖詩瀏覽系統</div>
        <div class="main-controls">
          <button class="control-btn active" data-category="all" onclick="switchCategory('all')">📚 所有聖詩</button>
          <button class="control-btn" data-category="chinese" onclick="switchCategory('chinese')">🇨🇳 中文聖詩</button>
          <button class="control-btn" data-category="english" onclick="switchCategory('english')">🇬🇧 英文聖詩</button>
          <button class="control-btn" data-category="popular" onclick="switchCategory('popular')">⭐ 熱門聖詩</button>
          <button class="control-btn" data-category="new" onclick="switchCategory('new')">🆕 新增聖詩</button>
          <button class="control-btn" data-category="authors" onclick="switchCategory('authors')">👤 作者資料</button>
        </div>
      </div>
      
      <!-- 第二行：搜索和排序控制 -->
      <div class="topbar-row2">
        <div class="search-section">
          <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索歌名、作者、編號..." onkeyup="performSearch()">
          <button class="control-btn" onclick="clearSearch()">清除</button>
          <button class="control-btn" onclick="advancedSearch()">進階</button>
        </div>
        
        <div class="filter-section">
          <select class="filter-select" id="languageFilter" onchange="applyFilters()">
            <option value="">所有語言</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="mixed">中英混合</option>
          </select>
          
          <select class="filter-select" id="categoryFilter" onchange="applyFilters()">
            <option value="">所有分類</option>
            <option value="worship">崇拜類</option>
            <option value="praise">讚美類</option>
            <option value="prayer">禱告類</option>
            <option value="thanksgiving">感恩類</option>
            <option value="christmas">聖誕節</option>
            <option value="easter">復活節</option>
          </select>
        </div>
        
        <div class="sort-section">
          <select class="filter-select" id="sortBy" onchange="applySorting()">
            <option value="number">按編號排序</option>
            <option value="title_zh">按中文歌名</option>
            <option value="title_en">按英文歌名</option>
            <option value="author">按作者排序</option>
            <option value="category">按分類排序</option>
            <option value="date">按日期排序</option>
          </select>
          
          <button class="control-btn" id="sortOrder" onclick="toggleSortOrder()">⬆️</button>
          
          <div class="stats-display" id="statsDisplay">
            載入中...
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <table class="layout">
      <tr>
        <td class="left">
          <iframe id="sidebarFrame" name="sidebarFrame" title="聖詩列表"></iframe>
        </td>
        <td class="right">
          <iframe id="contentFrame" name="contentFrame" title="聖詩內容"></iframe>
        </td>
      </tr>
    </table>
  </div>

  <script>
    // 全局變量
    let currentCategory = 'all';
    let currentSort = 'number';
    let sortAscending = true;
    let currentFilters = {
      language: '',
      category: '',
      search: ''
    };
    let hymnData = [];
    let filteredData = [];
    
    // 頁面映射配置
    var categoryMap = {
      all: { sidebar: 'hymn_sidebar_all.html', content: 'hymn_content_welcome.html' },
      chinese: { sidebar: 'hymn_sidebar_chinese.html', content: 'hymn_content_welcome.html' },
      english: { sidebar: 'hymn_sidebar_english.html', content: 'hymn_content_welcome.html' },
      popular: { sidebar: 'hymn_sidebar_popular.html', content: 'hymn_content_welcome.html' },
      new: { sidebar: 'hymn_sidebar_new.html', content: 'hymn_content_welcome.html' },
      authors: { sidebar: 'hymn_sidebar_authors.html', content: 'hymn_content_authors.html' }
    };

    // 設置活動按鈕
    function setActiveCategory(category) {
      var buttons = document.querySelectorAll('.control-btn[data-category]');
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute('data-category') === category) {
          buttons[i].classList.add('active');
        } else {
          buttons[i].classList.remove('active');
        }
      }
    }

    // 切換分類
    function switchCategory(category) {
      currentCategory = category;
      setActiveCategory(category);
      
      var info = categoryMap[category];
      if (!info) return;
      
      // 更新 iframe 內容
      document.getElementById('sidebarFrame').src = info.sidebar + '?category=' + category;
      document.getElementById('contentFrame').src = info.content;
      
      // 更新統計
      updateStats();
      
      console.log('切換到分類:', category);
    }

    // 執行搜索
    function performSearch() {
      const searchTerm = document.getElementById('searchInput').value.trim();
      currentFilters.search = searchTerm;
      
      // 通知 sidebar 更新搜索結果
      const sidebarFrame = document.getElementById('sidebarFrame');
      if (sidebarFrame.contentWindow && sidebarFrame.contentWindow.updateSearch) {
        sidebarFrame.contentWindow.updateSearch(searchTerm);
      }
      
      updateStats();
    }

    // 清除搜索
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentFilters.search = '';
      performSearch();
    }

    // 進階搜索
    function advancedSearch() {
      // 打開進階搜索對話框
      const searchParams = prompt(`進階搜索設置：
      
輸入搜索條件，用分號分隔：
- 歌名: title:聖哉
- 作者: author:Wesley  
- 編號: number:1001
- 年份: year:1900-2000
- 分類: category:worship

例如: title:聖哉;author:Wesley;category:worship`);
      
      if (searchParams) {
        parseAdvancedSearch(searchParams);
      }
    }

    // 解析進階搜索
    function parseAdvancedSearch(searchParams) {
      const params = searchParams.split(';');
      let searchQuery = '';
      
      params.forEach(param => {
        const [key, value] = param.split(':');
        if (key && value) {
          switch(key.trim()) {
            case 'title':
              searchQuery += value.trim() + ' ';
              break;
            case 'author':
              searchQuery += value.trim() + ' ';
              break;
            case 'number':
              searchQuery += value.trim() + ' ';
              break;
            case 'category':
              document.getElementById('categoryFilter').value = value.trim();
              break;
          }
        }
      });
      
      if (searchQuery) {
        document.getElementById('searchInput').value = searchQuery.trim();
        performSearch();
      }
      
      applyFilters();
    }

    // 應用篩選器
    function applyFilters() {
      const languageFilter = document.getElementById('languageFilter').value;
      const categoryFilter = document.getElementById('categoryFilter').value;
      
      currentFilters.language = languageFilter;
      currentFilters.category = categoryFilter;
      
      // 通知 sidebar 更新篩選結果
      const sidebarFrame = document.getElementById('sidebarFrame');
      if (sidebarFrame.contentWindow && sidebarFrame.contentWindow.updateFilters) {
        sidebarFrame.contentWindow.updateFilters(currentFilters);
      }
      
      updateStats();
    }

    // 應用排序
    function applySorting() {
      currentSort = document.getElementById('sortBy').value;
      
      // 通知 sidebar 更新排序
      const sidebarFrame = document.getElementById('sidebarFrame');
      if (sidebarFrame.contentWindow && sidebarFrame.contentWindow.updateSort) {
        sidebarFrame.contentWindow.updateSort(currentSort, sortAscending);
      }
      
      updateStats();
    }

    // 切換排序順序
    function toggleSortOrder() {
      sortAscending = !sortAscending;
      const orderBtn = document.getElementById('sortOrder');
      orderBtn.textContent = sortAscending ? '⬆️' : '⬇️';
      
      applySorting();
    }

    // 更新統計顯示
    function updateStats() {
      const statsDisplay = document.getElementById('statsDisplay');
      
      if (window.hymnDataParser) {
        const stats = window.hymnDataParser.getStatistics();
        let totalCount = stats.total_hymns;
        let filteredCount = totalCount;
        
        // 根據分類調整
        switch(currentCategory) {
          case 'chinese':
            filteredCount = stats.chinese_hymns;
            break;
          case 'english':
            filteredCount = stats.english_hymns;
            break;
          case 'popular':
            filteredCount = window.hymnDataParser.getHymnsByCategory('popular').length;
            break;
          case 'new':
            filteredCount = window.hymnDataParser.getHymnsByCategory('new').length;
            break;
          case 'authors':
            filteredCount = stats.total_authors;
            break;
        }
        
        // 根據搜索和篩選進一步調整
        if (currentFilters.search || currentFilters.language || currentFilters.category) {
          const searchResults = window.hymnDataParser.searchHymns(currentFilters.search, {
            language: currentFilters.language,
            category: currentFilters.category
          });
          filteredCount = searchResults.length;
        }
        
        statsDisplay.textContent = `顯示 ${filteredCount} / ${totalCount}`;
      } else {
        statsDisplay.textContent = '載入中...';
      }
    }

    // 載入系統腳本
    function loadSystemScripts() {
      const scripts = [
        'hymn_data_parser.js',  // 優先載入數據解析器
        'database_core.js',
        'search_enhancement.js', 
        'data_management.js',
        'report_generator.js'
      ];
      
      scripts.forEach((script, index) => {
        const scriptElement = document.createElement('script');
        scriptElement.src = script;
        scriptElement.onload = () => console.log(`✅ 已載入 ${script}`);
        scriptElement.onerror = () => console.log(`❌ 無法載入 ${script}`);
        document.head.appendChild(scriptElement);
      });
    }
    
    // 初始化頁面
    function initPage() {
      console.log('🎵 聖詩瀏覽系統載入完成');
      
      // 載入系統腳本
      loadSystemScripts();
      
      // 等待 iframe 載入完成
      var sidebarFrame = document.getElementById('sidebarFrame');
      var contentFrame = document.getElementById('contentFrame');
      
      sidebarFrame.onload = function() {
        console.log('Sidebar iframe 已載入');
      };
      
      contentFrame.onload = function() {
        console.log('Content iframe 已載入');
      };
      
      // 預設載入所有聖詩
      console.log('載入預設分類: all');
      switchCategory('all');
      
      // 初始化統計
      updateStats();
    }

    // 當 DOM 載入完成後初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
    
    // 全局函數供 iframe 調用
    window.selectHymn = function(hymnId, hymnData) {
      console.log('選中聖詩:', hymnId, hymnData);
      
      // 在 content frame 中顯示聖詩詳情
      const contentFrame = document.getElementById('contentFrame');
      const hymnUrl = `hymn_content_detail.html?id=${hymnId}`;
      contentFrame.src = hymnUrl;
      
      // 可以傳遞數據給 content frame
      setTimeout(() => {
        if (contentFrame.contentWindow && contentFrame.contentWindow.loadHymnData) {
          contentFrame.contentWindow.loadHymnData(hymnData);
        }
      }, 500);
    };
    
    // 獲取當前篩選和排序設置
    window.getCurrentSettings = function() {
      return {
        category: currentCategory,
        sort: currentSort,
        sortAscending: sortAscending,
        filters: currentFilters
      };
    };
  </script>
</body>
</html>
