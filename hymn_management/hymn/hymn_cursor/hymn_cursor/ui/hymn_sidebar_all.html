<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="zh-TW">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>所有聖詩列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="contentFrame">
  <style>
    body, html { 
      margin:0; 
      padding:0; 
      height:100%; 
      font-family: "Microsoft YaHei", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
      background: #eef6ff; 
      color: #333; 
      font-size: 11px;
    }
    
    #container { 
      height: 100%; 
      overflow-y: auto; 
      padding: 2px;
    }
    
    /* 搜索結果顯示 */
    .search-info {
      background: #d4e6f7;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 10px;
      color: #004d99;
      font-weight: bold;
    }
    
    /* 聖詩列表 */
    .hymn-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .hymn-item {
      margin: 1px 0;
      background: white;
      border-radius: 3px;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    
    .hymn-item:hover {
      background: #f0f8ff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .hymn-item.selected {
      background: #cce7ff;
      border-left: 3px solid #007bff;
    }
    
    .hymn-link {
      display: block;
      padding: 8px 10px;
      color: #333;
      text-decoration: none;
      cursor: pointer;
    }
    
    .hymn-link:hover {
      color: #004d99;
    }
    
    .hymn-number {
      font-weight: bold;
      color: #007bff;
      font-size: 10px;
      display: inline-block;
      min-width: 35px;
    }
    
    .hymn-title {
      margin-left: 5px;
      font-size: 10px;
      line-height: 1.3;
    }
    
    .hymn-title-zh {
      color: #333;
      font-weight: bold;
    }
    
    .hymn-title-en {
      color: #666;
      font-style: italic;
      margin-top: 2px;
    }
    
    .hymn-meta {
      font-size: 9px;
      color: #888;
      margin-top: 2px;
    }
    
    /* 分組標題 */
    .group-header {
      background: #b8d4f0;
      color: #004d99;
      font-weight: bold;
      padding: 5px 10px;
      font-size: 10px;
      margin: 10px 0 2px 0;
      border-radius: 3px;
    }
    
    /* 載入狀態 */
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 11px;
    }
    
    .loading::after {
      content: "...";
      animation: loading 1s infinite;
    }
    
    @keyframes loading {
      0%, 33% { content: "."; }
      34%, 66% { content: ".."; }
      67%, 100% { content: "..."; }
    }
    
    /* 無結果 */
    .no-results {
      text-align: center;
      padding: 30px 15px;
      color: #666;
      font-size: 11px;
    }
    
    /* 滾動條樣式 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="search-info" id="searchInfo" style="display: none;"></div>
    
    <div class="loading" id="loadingIndicator">載入聖詩列表</div>
    
    <ul class="hymn-list" id="hymnList" style="display: none;"></ul>
    
    <div class="no-results" id="noResults" style="display: none;">
      <p>😔 未找到匹配的聖詩</p>
      <p>請嘗試調整搜索條件或篩選設置</p>
    </div>
  </div>

  <script>
    let allHymns = [];
    let filteredHymns = [];
    let currentSettings = {};
    let selectedHymnId = null;
    
    // 載入真實聖詩數據
    async function loadRealHymns() {
      // 等待數據解析器初始化
      if (parent && parent.window.hymnDataParser) {
        await parent.window.hymnDataParser.initializeAllHymns();
        return parent.window.hymnDataParser.getAllHymns();
      }
      
      // 如果沒有數據解析器，返回空數組
      return [];
    }
    
    // 載入聖詩數據
    async function loadHymns() {
      console.log('載入聖詩數據...');
      
      try {
        // 使用真實數據解析器
        allHymns = await loadRealHymns();
        
        console.log(`載入了 ${allHymns.length} 首聖詩`);
        
        // 獲取父頁面設置
        if (parent && parent.getCurrentSettings) {
          currentSettings = parent.getCurrentSettings();
        }
        
        // 根據分類篩選
        if (currentSettings.category && parent.window.hymnDataParser) {
          allHymns = parent.window.hymnDataParser.getHymnsByCategory(currentSettings.category);
        }
        
        // 應用初始篩選和排序
        applyFiltersAndSort();
        
        // 隱藏載入指示器
        document.getElementById('loadingIndicator').style.display = 'none';
        
        // 顯示列表
        renderHymnList();
        
      } catch (error) {
        console.error('載入聖詩數據失敗:', error);
        
        // 顯示錯誤信息
        document.getElementById('loadingIndicator').innerHTML = '載入失敗，請重試';
        setTimeout(() => {
          document.getElementById('loadingIndicator').style.display = 'none';
          document.getElementById('noResults').style.display = 'block';
        }, 2000);
      }
    }
    
    // 應用篩選和排序
    function applyFiltersAndSort() {
      if (!parent.window.hymnDataParser) {
        console.error('數據解析器未載入');
        return;
      }
      
      // 使用數據解析器的搜索和排序功能
      let searchTerm = '';
      let filters = {};
      
      if (currentSettings.filters) {
        searchTerm = currentSettings.filters.search || '';
        filters = {
          language: currentSettings.filters.language,
          category: currentSettings.filters.category
        };
      }
      
      // 搜索和篩選
      let filtered = parent.window.hymnDataParser.searchHymns(searchTerm, filters);
      
      // 根據當前分類進一步篩選
      if (currentSettings.category && currentSettings.category !== 'all') {
        filtered = parent.window.hymnDataParser.getHymnsByCategory(currentSettings.category)
          .filter(h => {
            if (searchTerm) {
              const term = searchTerm.toLowerCase();
              return h.title_zh.toLowerCase().includes(term) ||
                     h.title_en.toLowerCase().includes(term) ||
                     h.author.toLowerCase().includes(term) ||
                     h.number.includes(term);
            }
            return true;
          });
      }
      
      // 排序
      const sortBy = currentSettings.sort || 'number';
      const ascending = currentSettings.sortAscending !== false;
      
      filteredHymns = parent.window.hymnDataParser.sortHymns(filtered, sortBy, ascending);
    }
    
    // 渲染聖詩列表
    function renderHymnList() {
      const hymnList = document.getElementById('hymnList');
      const searchInfo = document.getElementById('searchInfo');
      const noResults = document.getElementById('noResults');
      
      // 更新搜索信息
      if (currentSettings.filters && (currentSettings.filters.search || currentSettings.filters.language || currentSettings.filters.category)) {
        let infoText = `篩選結果: ${filteredHymns.length} 首聖詩`;
        if (currentSettings.filters.search) {
          infoText += ` (搜索: "${currentSettings.filters.search}")`;
        }
        searchInfo.textContent = infoText;
        searchInfo.style.display = 'block';
      } else {
        searchInfo.style.display = 'none';
      }
      
      // 如果沒有結果
      if (filteredHymns.length === 0) {
        hymnList.style.display = 'none';
        noResults.style.display = 'block';
        return;
      }
      
      // 清空列表
      hymnList.innerHTML = '';
      
      // 根據排序方式分組
      const sortBy = currentSettings.sort || 'number';
      let groups = {};
      
      if (sortBy === 'author') {
        // 按作者分組
        filteredHymns.forEach(hymn => {
          const author = hymn.author || '未知作者';
          if (!groups[author]) groups[author] = [];
          groups[author].push(hymn);
        });
      } else if (sortBy === 'category') {
        // 按分類分組
        filteredHymns.forEach(hymn => {
          const category = hymn.category || '未分類';
          if (!groups[category]) groups[category] = [];
          groups[category].push(hymn);
        });
      } else {
        // 不分組，直接顯示
        groups['all'] = filteredHymns;
      }
      
      // 渲染分組
      Object.keys(groups).forEach(groupKey => {
        if (groupKey !== 'all') {
          const groupHeader = document.createElement('div');
          groupHeader.className = 'group-header';
          groupHeader.textContent = `${groupKey} (${groups[groupKey].length})`;
          hymnList.appendChild(groupHeader);
        }
        
        groups[groupKey].forEach(hymn => {
          const listItem = document.createElement('li');
          listItem.className = 'hymn-item';
          listItem.setAttribute('data-hymn-id', hymn.id);
          
          const link = document.createElement('a');
          link.className = 'hymn-link';
          link.href = '#';
          link.onclick = function(e) {
            e.preventDefault();
            selectHymn(hymn);
          };
          
          link.innerHTML = `
            <span class="hymn-number">${hymn.number}</span>
            <div class="hymn-title">
              <div class="hymn-title-zh">${hymn.title_zh}</div>
              <div class="hymn-title-en">${hymn.title_en}</div>
              <div class="hymn-meta">作者: ${hymn.author} | 分類: ${hymn.category}</div>
            </div>
          `;
          
          listItem.appendChild(link);
          hymnList.appendChild(listItem);
        });
      });
      
      hymnList.style.display = 'block';
      noResults.style.display = 'none';
    }
    
    // 選擇聖詩
    function selectHymn(hymn) {
      // 移除之前的選中狀態
      const prevSelected = document.querySelector('.hymn-item.selected');
      if (prevSelected) {
        prevSelected.classList.remove('selected');
      }
      
      // 添加新的選中狀態
      const currentItem = document.querySelector(`[data-hymn-id="${hymn.id}"]`);
      if (currentItem) {
        currentItem.classList.add('selected');
      }
      
      selectedHymnId = hymn.id;
      
      // 通知父頁面
      if (parent && parent.selectHymn) {
        parent.selectHymn(hymn.id, hymn);
      }
      
      console.log('選中聖詩:', hymn);
    }
    
    // 供父頁面調用的更新函數
    window.updateSearch = function(searchTerm) {
      if (!currentSettings.filters) currentSettings.filters = {};
      currentSettings.filters.search = searchTerm;
      applyFiltersAndSort();
      renderHymnList();
    };
    
    window.updateFilters = function(filters) {
      currentSettings.filters = filters;
      applyFiltersAndSort();
      renderHymnList();
    };
    
    window.updateSort = function(sortBy, ascending) {
      currentSettings.sort = sortBy;
      currentSettings.sortAscending = ascending;
      applyFiltersAndSort();
      renderHymnList();
    };
    
    // 頁面初始化
    document.addEventListener('DOMContentLoaded', function() {
      console.log('聖詩列表 Sidebar 載入完成');
      
      // 延遲載入數據，等待父頁面初始化
      setTimeout(() => {
        console.log('開始載入聖詩數據...');
        loadHymns();
      }, 2000);
      
      // 定期檢查數據載入狀態
      const checkInterval = setInterval(() => {
        if (allHymns.length > 0) {
          console.log(`✅ 成功載入 ${allHymns.length} 首聖詩`);
          clearInterval(checkInterval);
        } else if (document.getElementById('loadingIndicator').style.display !== 'none') {
          console.log('⏳ 仍在載入聖詩數據...');
        }
      }, 3000);
    });
  </script>
</body>
</html>
