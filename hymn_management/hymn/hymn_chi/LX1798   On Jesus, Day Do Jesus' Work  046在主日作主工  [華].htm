		046在主日作主工<br />
		<br />
	</div>
	<div>
		1.&#24403;在主日勤做主工,&#24691;求圣&#28789;在我心中,<br />
		使我&#29233;&#35762;,使人&#29233;听,凡口所言,不离圣&#32463;.<br />
		<br />
		2.望主&#32473;人慕道之心,情愿同我与主相&#20146;,<br />
		多救罪身多救&#28789;魂,不&#35753;一人自取沉&#27814;.<br />
		<br />
		3.&#21149;人之&#26102;也&#39035;&#21149;己,恐人悔改,反自被&#24323;;<br />
		&#34429;然年&#36731;,&#34429;然口拙,各都有分,振与天&#22269;.<br />
		<br />
		4.&#35828;&#35805;&#28201;柔不&#35752;人&#21388;,多方引&#23548;使人&#24402;善;<br />
		&#38543;地栽种,&#38543;&#22788;&#27975;灌,&#21457;芽生&#38271;,自有神管.</div>
