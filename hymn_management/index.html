<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聖詩管理系統 - 主頁面</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:#f6f7fb;
      font-size: 12px;
    }
    .topbar {
      position: fixed;
      top:0; left:0; right:0;
      height:55px;
      background:#0b5fa5;
      color:#fff;
      border-bottom:3px solid #2aa5ff;
      z-index:999;
    }
    .topbar-inner { display: table; width:100%; height:55px; }
    .brand {
      display: table-cell;
      vertical-align: middle;
      padding-left:14px;
      font-weight:bold;
      font-size:13px;
    }
    .back-link {
      display: table-cell;
      vertical-align: middle;
      text-align:right;
      padding-right:10px;
    }
    .back-link a {
      display:inline-block;
      margin:0 2px;
      padding:4px 6px;
      background:#2aa5ff;
      color:#fff;
      text-decoration:none;
      border-radius:3px;
      font-size: 9px;
    }
    .back-link a:hover { filter:brightness(1.1); }
    .main { margin-top: 55px; }
    table.layout {
      width: 100%;
      height: calc(100vh - 55px);
      border-collapse: collapse;
      table-layout: fixed;
    }
    td.left {
      width: 250px;
      background: #eef6ff;
      border-right: 2px solid #2aa5ff;
      vertical-align: top;
    }
    td.right { vertical-align: top; }
    iframe { border: 0; width: 100%; height: 100%; }
    #sidebarFrame { background: #eef6ff; }
    #contentFrame { background: #ffffff; }
    @media (max-width: 768px) {
      td.left { width: 200px; }
      .topbar, .topbar-inner { height: 45px; }
      .main { margin-top: 45px; }
      table.layout { height: calc(100vh - 45px); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">🎵 聖詩管理系統 - 5本詩集智能整合 <small style="color: #ccc; font-size: 9px;">Hymn Management · 2015 首</small></div>
      <div class="back-link">
        <a href="../index_v5.html" id="backHomeLink">返回主頁</a>
        <a href="landing.html" target="contentFrame">首頁</a>
        <a href="temp_hymn.html" target="contentFrame">2015 首預覽</a>
        <a href="dashboard.html" target="contentFrame">儀表板</a>
        <a href="sidebar_playlist.html" target="sidebarFrame">☰ 播放列表</a>
        <a href="hymn_ai_tools.html" target="contentFrame">AI 外連</a>
        <a href="hymn/default.htm" target="contentFrame">舊總索引</a>
      </div>
    </div>
  </div>

  <div class="main">
    <table class="layout">
      <tr>
        <td class="left">
          <iframe id="sidebarFrame" name="sidebarFrame" title="Sidebar" src="sidebar_playlist.html?v=fullhtm2"></iframe>
        </td>
        <td class="right">
          <iframe id="contentFrame" name="contentFrame" title="Content" src="playlist_placeholder.html"></iframe>
        </td>
      </tr>
    </table>
  </div>

  <script type="text/javascript">
    class HymnFrameManager {
      constructor() { this.init(); }
      init() {
        window.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'navigate' && event.data.url) {
            this.navigateContentFrame(event.data.url);
          }
        });
      }
      navigateContentFrame(url) {
        var contentFrame = document.getElementById('contentFrame');
        if (!contentFrame || !url) return;
        if (/^https?:\/\//i.test(url)) {
          contentFrame.src = url;
          return;
        }
        var enc = String(url).split('/').map(function (part, i) {
          return i === 0 ? part : encodeURIComponent(part);
        }).join('/');
        contentFrame.src = enc;
      }
    }

    function initPage() {
      var backLink = document.getElementById('backHomeLink');
      if (backLink && window.location.protocol === 'file:') {
        backLink.href = '../index_v5.html';
      }
      new HymnFrameManager();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
  <script src="../js/shell_contract.js"></script>
  <script>
    if (window.B100ShellContract && typeof window.B100ShellContract.validate === 'function') {
      window.B100ShellContract.validate('hymn_management/index.html');
    }
  </script>
</body>
</html>
