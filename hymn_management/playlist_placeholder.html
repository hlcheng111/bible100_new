<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>詩歌詳情</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .welcome { text-align: center; padding: 40px; color: #6c757d; }
    .welcome .icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .welcome h2 { font-size: 18px; margin: 0 0 12px 0; color: #495057; }
    .welcome p { font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <div class="welcome">
    <div class="icon">📖</div>
    <h2>請從左側選單點選詩歌</h2>
    <p>輸入關鍵字搜尋，或選擇欄位後輸入文字</p>
    <p style="margin-top:8px;font-size:11px;color:#999;">搜尋結果會顯示在下方，點選即可閱讀</p>
  </div>
</body>
</html>
