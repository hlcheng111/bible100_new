<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖詩管理系統 - 首頁</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
      color: #333;
      font-size: 13px;
      line-height: 1.6;
    }

    .landing-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .landing-hero {
      background: linear-gradient(135deg, #0b5fa5 0%, #2aa5ff 100%);
      color: white;
      padding: 36px 32px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(11, 95, 165, 0.25);
    }

    .landing-hero h1 {
      margin: 0 0 12px 0;
      font-size: 28px;
      font-weight: 700;
    }

    .landing-hero p {
      margin: 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #2aa5ff;
    }

    .search-bar button {
      padding: 12px 24px;
      background: #2aa5ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-bar button:hover {
      background: #1e8ce6;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #eee;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #0b5fa5;
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .action-card {
      display: block;
      padding: 24px;
      background: white;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      border: 2px solid #e8e8e8;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .action-card:hover {
      border-color: #2aa5ff;
      box-shadow: 0 6px 20px rgba(42, 165, 255, 0.2);
      transform: translateY(-2px);
    }

    .action-card h3 {
      margin: 0 0 8px 0;
      color: #0b5fa5;
      font-size: 16px;
    }

    .action-card p {
      margin: 0;
      font-size: 12px;
      color: #666;
    }

    .action-card.primary {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border-color: #2aa5ff;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 11px;
    }

    .nav-links a {
      padding: 6px 12px;
      background: white;
      color: #0b5fa5;
      text-decoration: none;
      border-radius: 4px;
      border: 1px solid #90caf9;
    }

    .nav-links a:hover {
      background: #e3f2fd;
    }

    @media (max-width: 600px) {
      .landing-hero h1 { font-size: 22px; }
      .search-bar { flex-direction: column; }
      .action-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="landing-hero">
      <h1>🎵 聖詩管理系統</h1>
      <p>2015+ 首聖詩智能整合 · 樂譜 · 音訊 · 神學主題 · 互動學習</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="輸入歌名、編號或關鍵詞..." onkeypress="if(event.key==='Enter')navigateSearch()">
      <button onclick="navigateSearch()">🔍 搜索</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-number" id="totalHymns">—</span>
        <div class="stat-label">總聖詩數</div>
      </div>
      <div class="stat-card">
        <span class="stat-number">6</span>
        <div class="stat-label">詩集來源</div>
      </div>
      <div class="stat-card">
        <span class="stat-number">▲●◆★</span>
        <div class="stat-label">分類標記</div>
      </div>
    </div>

    <div class="action-grid">
      <a href="hymn/hymn_main_index.html" target="contentFrame" class="action-card primary" data-nav="hymn/hymn_main_index.html">
        <h3>📚 詩歌主控台</h3>
        <p>進入 2000+ 首聖詩庫主索引</p>
      </a>
      <a href="hymn_template.html" target="contentFrame" class="action-card" data-nav="hymn_template.html">
        <h3>📋 模範頁</h3>
        <p>hymnary.org 風格詩歌詳情頁</p>
      </a>
      <a href="dashboard.html" target="contentFrame" class="action-card" data-nav="dashboard.html">
        <h3>📋 儀表板</h3>
        <p>瀏覽全部聖詩、篩選與排序</p>
      </a>
      <a href="hymn_learner.html?id=hymn_00_0001" target="contentFrame" class="action-card" data-nav="hymn_learner.html?id=hymn_00_0001">
        <h3>📖 互動式學習</h3>
        <p>樂譜、音訊、神學與歷史</p>
      </a>
      <a href="hymn_playlist_unified.html" target="contentFrame" class="action-card" data-nav="hymn_playlist_unified.html">
        <h3>🎵 播放列表</h3>
        <p>管理詩歌播放清單</p>
      </a>
      <a href="hymn_editor.html" target="contentFrame" class="action-card" data-nav="hymn_editor.html">
        <h3>✏️ 詩歌編輯器</h3>
        <p>編輯詩歌內容</p>
      </a>
      <a href="ppt_generator.html" target="contentFrame" class="action-card" data-nav="ppt_generator.html">
        <h3>📊 PPT 生成器</h3>
        <p>製作投影片</p>
      </a>
    </div>

    <div class="nav-links">
      <span style="color:#666;">導航：</span>
      <a href="hymn/hymn_main_index.html" target="contentFrame">詩歌主控台</a>
      <a href="hymn_template.html" target="contentFrame">模範頁</a>
      <a href="../index.html" target="_blank">總 index</a>
      <a href="../help/global-tools.htm" target="_blank">全站工具說明</a>
      <a href="dashboard.html" target="contentFrame">儀表板</a>
      <a href="../nav_hub/dashboard.html" target="_blank">目錄搜索</a>
      <a href="../bible_study/dashboard.html" target="_blank">聖經研讀</a>
    </div>
  </div>

  <script>
    (function() {
      const url = new URL('data/hymns-index.json', window.location.href).href;
      fetch(url)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data && data.metadata) {
            const el = document.getElementById('totalHymns');
            if (el) el.textContent = (data.metadata.total || 0).toLocaleString();
          }
        })
        .catch(() => {});

      function navigateTo(url) {
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({ type: 'navigate', url }, '*');
          } catch (e) {}
        }
      }

      window.navigateSearch = function() {
        const q = (document.getElementById('searchInput') || {}).value?.trim();
        if (q) {
          navigateTo('dashboard.html');
          setTimeout(function() {
            window.parent.postMessage({ type: 'hymnFilter', filters: { search: q } }, '*');
          }, 300);
        } else {
          navigateTo('dashboard.html');
        }
      };

      document.querySelectorAll('.action-card[data-nav]').forEach(function(a) {
        a.addEventListener('click', function(e) {
          const url = a.getAttribute('data-nav');
          if (url && window.parent && window.parent !== window) {
            e.preventDefault();
            navigateTo(url);
          }
        });
      });
    })();
  </script>
</body>
</html>
