<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>所有聖詩目錄</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: #eef6ff;
      font-size: 11px;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 標題欄 */
    .sidebar-header {
      background: #2aa5ff;
      color: white;
      padding: 10px 12px;
      border-bottom: 2px solid #1e8bcc;
    }

    .sidebar-header h2 {
      margin: 0 0 5px 0;
      font-size: 13px;
      font-weight: bold;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      opacity: 0.9;
    }

    /* 控制欄 */
    .controls-bar {
      padding: 8px 12px;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
    }

    .control-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .search-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #ced4da;
      border-radius: 3px;
      font-size: 10px;
    }

    .filter-select {
      padding: 4px 6px;
      border: 1px solid #ced4da;
      border-radius: 3px;
      font-size: 10px;
      background: white;
      min-width: 80px;
    }

    .control-btn {
      padding: 4px 8px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 9px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: #5a6268;
    }

    .control-btn.active {
      background: #2aa5ff;
    }

    /* 聖詩列表 */
    .hymn-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
    }

    .hymn-item {
      padding: 6px 8px;
      margin-bottom: 2px;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .hymn-item:hover {
      background: #f0f8ff;
      border-color: #2aa5ff;
      transform: translateX(2px);
    }

    .hymn-item.selected {
      background: #e3f2fd;
      border-color: #2196f3;
    }

    .hymn-number {
      font-weight: bold;
      color: #2aa5ff;
      font-size: 10px;
      margin-right: 6px;
      display: inline-block;
      min-width: 35px;
    }

    .hymn-title {
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .hymn-title.chinese {
      color: #333;
    }

    .hymn-title.english {
      color: #666;
      font-style: italic;
      font-size: 10px;
    }

    .hymn-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3px;
    }

    .hymn-author {
      font-size: 9px;
      color: #666;
    }

    .hymn-badges {
      display: flex;
      gap: 2px;
    }

    .badge {
      padding: 1px 4px;
      border-radius: 2px;
      font-size: 8px;
      font-weight: bold;
    }

    .badge.language {
      background: #e3f2fd;
      color: #1976d2;
    }

    .badge.theme {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .badge.source {
      background: #e8f5e8;
      color: #388e3c;
    }

    /* 分頁控制 */
    .pagination {
      padding: 8px 12px;
      background: #f8f9fa;
      border-top: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pagination-info {
      font-size: 9px;
      color: #666;
    }

    .pagination-controls {
      display: flex;
      gap: 5px;
    }

    .page-btn {
      padding: 3px 6px;
      border: 1px solid #ced4da;
      background: white;
      border-radius: 2px;
      font-size: 9px;
      cursor: pointer;
    }

    .page-btn:hover {
      background: #f8f9fa;
    }

    .page-btn.active {
      background: #2aa5ff;
      color: white;
      border-color: #2aa5ff;
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 側邊欄寬度控制 */
    .resize-handle {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
    }

    .resize-handle:hover {
      background: rgba(42, 165, 255, 0.3);
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
      .sidebar-header h2 {
        font-size: 12px;
      }
      
      .control-row {
        flex-direction: column;
        gap: 4px;
      }
      
      .hymn-item {
        padding: 8px;
      }
      
      .hymn-title {
        font-size: 12px;
      }
    }

    /* 載入動畫 */
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #2aa5ff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .empty-state h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }

    .empty-state p {
      margin: 0;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="sidebar-container">
    <!-- 標題欄 -->
    <div class="sidebar-header">
      <h2>📚 所有聖詩</h2>
      <div class="stats-bar">
        <span id="totalCount">載入中...</span>
        <span id="filteredCount">-</span>
      </div>
    </div>

    <!-- 控制欄 -->
    <div class="controls-bar">
      <div class="control-row">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索歌名、作者、編號..." onkeyup="performSearch()">
        <button class="control-btn" onclick="clearSearch()">清除</button>
      </div>
      
      <div class="control-row">
        <select class="filter-select" id="languageFilter" onchange="applyFilters()">
          <option value="">所有語言</option>
          <option value="chinese">中文</option>
          <option value="english">英文</option>
          <option value="taiwanese">台語</option>
          <option value="mixed">混合</option>
        </select>
        
        <select class="filter-select" id="sourceFilter" onchange="applyFilters()">
          <option value="">所有來源</option>
          <option value="中文聖詩">中文聖詩</option>
          <option value="世紀頌讚">世紀頌讚</option>
          <option value="新編讚美詩">新編讚美詩</option>
          <option value="LX系列">LX系列</option>
        </select>
        
        <select class="filter-select" id="themeFilter" onchange="applyFilters()">
          <option value="">所有主題</option>
          <option value="讚美">讚美</option>
          <option value="敬拜">敬拜</option>
          <option value="救恩">救恩</option>
          <option value="愛">愛</option>
          <option value="聖誕">聖誕</option>
          <option value="復活">復活</option>
        </select>
      </div>
      
      <div class="control-row">
        <button class="control-btn" id="sortByNumber" onclick="sortBy('number')" class="active">按編號</button>
        <button class="control-btn" id="sortByTitle" onclick="sortBy('title')">按標題</button>
        <button class="control-btn" id="sortByAuthor" onclick="sortBy('author')">按作者</button>
        <button class="control-btn" id="toggleOrder" onclick="toggleSortOrder()">⬆️</button>
      </div>
    </div>

    <!-- 聖詩列表 -->
    <div class="hymn-list-container" id="hymnListContainer">
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p>正在載入聖詩目錄...</p>
      </div>
    </div>

    <!-- 分頁控制 -->
    <div class="pagination" id="pagination">
      <div class="pagination-info">
        <span id="pageInfo">第 1 頁，共 1 頁</span>
      </div>
      <div class="pagination-controls">
        <button class="page-btn" id="prevPage" onclick="changePage(-1)">上一頁</button>
        <button class="page-btn" id="nextPage" onclick="changePage(1)">下一頁</button>
      </div>
    </div>
  </div>

  <!-- 側邊欄寬度調整 -->
  <div class="resize-handle" id="resizeHandle"></div>

  <script>
    // 全局變量
    let allHymns = [];
    let filteredHymns = [];
    let currentPage = 1;
    let itemsPerPage = 50;
    let currentSort = 'number';
    let sortAscending = true;
    let currentFilters = {
      search: '',
      language: '',
      source: '',
      theme: ''
    };

    // 模擬聖詩數據
    const mockHymnData = [
      {
        id: 'hymn_0920',
        hymnNumber: { primary: '0920', type: 'standard', display: '0920' },
        title: '大秦景教三威蒙度讚',
        englishTitle: 'Great Qin Jingjiao Three Powers Praise',
        author: '景教',
        composer: '古調',
        source: '中文聖詩',
        language: 'chinese',
        themes: ['讚美', '敬拜'],
        tune: 'JINGJIAO',
        category: '經典聖詩',
        displayOrder: 920
      },
      {
        id: 'hymn_0952',
        hymnNumber: { primary: '0952', type: 'standard', display: '0952' },
        title: '神的羔羊',
        englishTitle: 'Lamb of God',
        author: 'Twila Paris',
        composer: 'Twila Paris',
        source: '中文聖詩',
        language: 'chinese',
        themes: ['救恩', '愛'],
        tune: 'LAMB',
        category: '經典聖詩',
        displayOrder: 952
      },
      {
        id: 'hymn_1261',
        hymnNumber: { primary: '1261', type: 'standard', display: '1261' },
        title: '大山可以挪开',
        englishTitle: 'The Mountain Shall Depart',
        author: '蘇佐揚',
        composer: '蘇佐揚',
        source: '中文聖詩',
        language: 'chinese',
        themes: ['希望', '信仰'],
        tune: 'MOUNTAIN',
        category: '經典聖詩',
        displayOrder: 1261
      },
      {
        id: 'hymn_ss001',
        hymnNumber: { primary: 'SS001', type: 'century_praise', display: 'SS001', original: '001' },
        title: '聖哉，聖哉，聖哉',
        englishTitle: 'Holy, Holy, Holy',
        author: 'Schubert',
        composer: 'Schubert',
        source: '世紀頌讚',
        language: 'chinese',
        themes: ['讚美', '敬拜'],
        tune: 'NICAEA',
        category: '世紀頌讚',
        displayOrder: 10001
      },
      {
        id: 'hymn_lx1291',
        hymnNumber: { primary: 'LX1291', type: 'lx_series', display: 'LX1291', original: '1291' },
        title: '又是一年过去',
        englishTitle: 'Another Year Is Gone',
        author: 'Unknown',
        composer: 'Unknown',
        source: 'LX系列',
        language: 'chinese',
        themes: ['時間', '感恩'],
        tune: 'YEAR',
        category: 'LX系列',
        displayOrder: 21291
      }
    ];

    // 初始化頁面
    function initPage() {
      console.log('🎵 初始化聖詩側邊欄...');
      
      // 載入聖詩數據
      loadHymnData();
      
      // 設置事件監聽器
      setupEventListeners();
      
      // 初始化顯示
      displayHymns();
      
      console.log('✅ 聖詩側邊欄初始化完成');
    }

    // 載入聖詩數據
    function loadHymnData() {
      // 模擬載入過程
      setTimeout(() => {
        allHymns = [...mockHymnData];
        
        // 生成更多模擬數據
        for (let i = 1000; i <= 2000; i++) {
          allHymns.push({
            id: `hymn_${i}`,
            hymnNumber: { primary: i.toString(), type: 'standard', display: i.toString() },
            title: `聖詩 ${i}`,
            englishTitle: `Hymn ${i}`,
            author: 'Various',
            composer: 'Various',
            source: '中文聖詩',
            language: i % 3 === 0 ? 'english' : 'chinese',
            themes: i % 5 === 0 ? ['讚美'] : ['敬拜'],
            tune: `TUNE${i}`,
            category: '一般聖詩',
            displayOrder: i
          });
        }
        
        filteredHymns = [...allHymns];
        updateStats();
        displayHymns();
        
        // 隱藏載入狀態
        document.getElementById('loadingState').style.display = 'none';
        
      }, 1000);
    }

    // 設置事件監聽器
    function setupEventListeners() {
      // 側邊欄寬度調整
      const resizeHandle = document.getElementById('resizeHandle');
      let isResizing = false;
      
      resizeHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.addEventListener('mousemove', handleResize);
        document.addEventListener('mouseup', stopResize);
      });
      
      function handleResize(e) {
        if (!isResizing) return;
        
        const sidebar = document.querySelector('.sidebar-container');
        const newWidth = Math.max(250, Math.min(600, e.clientX));
        sidebar.style.width = newWidth + 'px';
      }
      
      function stopResize() {
        isResizing = false;
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
      }
    }

    // 執行搜索
    function performSearch() {
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      currentFilters.search = searchTerm;
      
      applyFilters();
    }

    // 清除搜索
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentFilters.search = '';
      applyFilters();
    }

    // 應用篩選器
    function applyFilters() {
      currentFilters.language = document.getElementById('languageFilter').value;
      currentFilters.source = document.getElementById('sourceFilter').value;
      currentFilters.theme = document.getElementById('themeFilter').value;
      
      filteredHymns = allHymns.filter(hymn => {
        // 搜索篩選
        if (currentFilters.search) {
          const searchTerm = currentFilters.search;
          const searchableText = `${hymn.title} ${hymn.englishTitle} ${hymn.author} ${hymn.hymnNumber.display}`.toLowerCase();
          if (!searchableText.includes(searchTerm)) {
            return false;
          }
        }
        
        // 語言篩選
        if (currentFilters.language && hymn.language !== currentFilters.language) {
          return false;
        }
        
        // 來源篩選
        if (currentFilters.source && hymn.source !== currentFilters.source) {
          return false;
        }
        
        // 主題篩選
        if (currentFilters.theme && !hymn.themes.includes(currentFilters.theme)) {
          return false;
        }
        
        return true;
      });
      
      // 重新排序
      sortHymns();
      
      // 重置到第一頁
      currentPage = 1;
      
      // 更新顯示
      updateStats();
      displayHymns();
    }

    // 排序聖詩
    function sortBy(sortType) {
      currentSort = sortType;
      
      // 更新按鈕狀態
      document.querySelectorAll('.control-btn[id^="sortBy"]').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(`sortBy${sortType.charAt(0).toUpperCase() + sortType.slice(1)}`).classList.add('active');
      
      sortHymns();
      displayHymns();
    }

    // 切換排序順序
    function toggleSortOrder() {
      sortAscending = !sortAscending;
      const orderBtn = document.getElementById('toggleOrder');
      orderBtn.textContent = sortAscending ? '⬆️' : '⬇️';
      
      sortHymns();
      displayHymns();
    }

    // 執行排序
    function sortHymns() {
      filteredHymns.sort((a, b) => {
        let comparison = 0;
        
        switch (currentSort) {
          case 'number':
            comparison = a.displayOrder - b.displayOrder;
            break;
          case 'title':
            comparison = a.title.localeCompare(b.title);
            break;
          case 'author':
            comparison = a.author.localeCompare(b.author);
            break;
          default:
            comparison = a.displayOrder - b.displayOrder;
        }
        
        return sortAscending ? comparison : -comparison;
      });
    }

    // 顯示聖詩列表
    function displayHymns() {
      const container = document.getElementById('hymnListContainer');
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageHymns = filteredHymns.slice(startIndex, endIndex);
      
      if (pageHymns.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>😔 沒有找到聖詩</h3>
            <p>請嘗試調整搜索條件或篩選器</p>
          </div>
        `;
        return;
      }
      
      const hymnsHTML = pageHymns.map(hymn => `
        <div class="hymn-item" onclick="selectHymn('${hymn.id}')" data-hymn-id="${hymn.id}">
          <div class="hymn-title chinese">${hymn.title}</div>
          ${hymn.englishTitle ? `<div class="hymn-title english">${hymn.englishTitle}</div>` : ''}
          <div class="hymn-meta">
            <span class="hymn-number">${hymn.hymnNumber.display}</span>
            <span class="hymn-author">${hymn.author}</span>
            <div class="hymn-badges">
              <span class="badge language">${getLanguageBadge(hymn.language)}</span>
              ${hymn.themes.length > 0 ? `<span class="badge theme">${hymn.themes[0]}</span>` : ''}
              <span class="badge source">${hymn.source}</span>
            </div>
          </div>
        </div>
      `).join('');
      
      container.innerHTML = hymnsHTML;
      
      // 更新分頁
      updatePagination();
    }

    // 獲取語言標籤
    function getLanguageBadge(language) {
      const badges = {
        'chinese': '中',
        'english': '英',
        'taiwanese': '台',
        'mixed': '混'
      };
      return badges[language] || '?';
    }

    // 更新統計信息
    function updateStats() {
      document.getElementById('totalCount').textContent = `總計: ${allHymns.length}`;
      document.getElementById('filteredCount').textContent = `顯示: ${filteredHymns.length}`;
    }

    // 更新分頁
    function updatePagination() {
      const totalPages = Math.ceil(filteredHymns.length / itemsPerPage);
      const pageInfo = document.getElementById('pageInfo');
      const prevBtn = document.getElementById('prevPage');
      const nextBtn = document.getElementById('nextPage');
      
      pageInfo.textContent = `第 ${currentPage} 頁，共 ${totalPages} 頁`;
      
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      
      if (totalPages <= 1) {
        document.getElementById('pagination').style.display = 'none';
      } else {
        document.getElementById('pagination').style.display = 'flex';
      }
    }

    // 切換頁面
    function changePage(direction) {
      const totalPages = Math.ceil(filteredHymns.length / itemsPerPage);
      const newPage = currentPage + direction;
      
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        displayHymns();
      }
    }

    // 選擇聖詩
    function selectHymn(hymnId) {
      // 移除之前的選中狀態
      document.querySelectorAll('.hymn-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      // 添加選中狀態
      const selectedItem = document.querySelector(`[data-hymn-id="${hymnId}"]`);
      if (selectedItem) {
        selectedItem.classList.add('selected');
      }
      
      // 獲取聖詩數據
      const hymn = allHymns.find(h => h.id === hymnId);
      if (hymn) {
        // 通知父頁面選擇了聖詩
        if (window.parent && window.parent.selectHymn) {
          window.parent.selectHymn(hymnId, hymn);
        }
        
        console.log('選擇聖詩:', hymn);
      }
    }

    // 當頁面載入完成後初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
