    <p>十五種看法 · 02</p>
    <h1>神學</h1>
    <span class="en">Theology</span>
    <p>看歌詞裡站得住的那一句信仰。</p>
    <p>不是要把每首歌變成神學論文。是學會問：它在說哪一件事。</p>
    <p class="ask">怎樣從歌詞辨認一個神學命題？</p>
    <p>相關的分析範本：尚未對上。這一頁不替你指定二十六首裡的哪一首。</p>
    <p>相關的學科：尚未對上。遠方的山仍在前言的學科山脈。</p>
    <p class="later">以後才把一個命題寫清楚，並標出歌詞依據。</p>
    <p>這是入口，不是寫完的課。</p>
