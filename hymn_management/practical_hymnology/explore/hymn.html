<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>詩集索引卡 · 樂以載道</title>
  <link rel="stylesheet" href="../door.css" />
</head>
<body>
<script src="../ph_module_bar.js" data-root="../"></script>
  <div class="wrap" id="app">
    <p class="back"><a data-b100-nav="content" href="index.html">← 外站詩集索引</a></p>
    <p>正在讀這一筆…</p>
  </div>
  <script src="hymn_index_data.js"></script>
  <script src="../../../js/shell_nav.js"></script>
  <script>
  (function () {
    var id = "";
    try { id = new URLSearchParams(location.search).get("id") || ""; } catch (e) {}
    var rows = (window.PH_HYMNARY_INDEX && window.PH_HYMNARY_INDEX.instances) || [];
    var row = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].instanceId === id) { row = rows[i]; break; }
    }
    var app = document.getElementById("app");
    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }
    if (!row) {
      app.innerHTML = "<p class='back'><a data-b100-nav='content' href='index.html'>← 外站詩集索引</a></p><h1>找不到這一筆</h1><p class='lead'>樣板裡只有生命聖詩與聖徒詩歌各 25 首。</p>";
      return;
    }
    app.innerHTML =
      "<p class='back'><a data-b100-nav='content' href='index.html?hymnal=" + encodeURIComponent(row.hymnalId) + "'>← " + esc(row.hymnalTitle) + " 目錄</a></p>" +
      "<p><span class='later' style='display:inline-block'>外部索引 · 未核對</span></p>" +
      "<h1>" + esc(row.titleZh) + "</h1>" +
      "<p class='lead'>" + esc(row.hymnalTitle) + " #" + esc(row.hymnNumber) + "</p>" +
      "<div class='card'><strong>曲調</strong><span>" + esc(row.tuneName) + "</span></div>" +
      "<div class='card' style='margin-top:10px'><strong>作詞</strong><span>" + esc(row.lyricist || row.author || "Hymnary 這頁沒有列作詞者") + "</span></div>" +
      "<div class='card' style='margin-top:10px'><strong>作曲</strong><span>" + esc(row.composer || "還沒分開作曲者") + "</span></div>" +
      "<div class='card' style='margin-top:10px'><strong>詩集年份</strong><span>" + esc(row.hymnalYear) + "（這是詩集出版年，不是作詞年）</span></div>" +
      "<p class='quiet'>站內沒有歌詞、沒有樂譜。資料來自 Hymnary，本站沒有對過紙本。</p>" +
      "<p><a class='walk-go' href='" + esc(row.sourceUrl) + "' target='_blank' rel='noopener noreferrer'>到 Hymnary 看這一首 ↗</a></p>" +
      "<p class='quiet'><a href='" + esc(row.hymnalUrl) + "' target='_blank' rel='noopener noreferrer'>打開這本詩集目錄 ↗</a></p>";
  })();
  </script>
</body>
</html>
