<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>互動式聖詩學習</title>
  <script src="data/source-hymns-loader.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif; }
    .score-container { max-width: 60%; }
    @media (max-width: 768px) { .score-container { max-width: 100%; } }
    .fullscreen-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .fullscreen-overlay img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <div id="app" class="p-4 md:p-6 max-w-6xl mx-auto">
    <div id="loading" class="text-center py-12 text-stone-500">載入中...</div>
    <div id="content" class="hidden">
      <h1 id="hymnTitle" class="text-2xl md:text-3xl font-bold text-stone-800 mb-2"></h1>
      <p id="hymnSubtitle" class="text-stone-600 mb-6"></p>

      <!-- 播放器 -->
      <div class="bg-stone-200 rounded-lg p-4 mb-6 flex flex-wrap items-center gap-4">
        <button id="btnPlay" class="px-6 py-2 bg-stone-700 text-white rounded hover:bg-stone-800" aria-label="播放">播放</button>
        <button id="btnPause" class="px-6 py-2 bg-stone-600 text-white rounded hover:bg-stone-700 hidden" aria-label="暫停">暫停</button>
        <div class="flex-1 min-w-[200px]">
          <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-2 rounded accent-stone-700">
        </div>
        <span id="timeDisplay" class="text-sm text-stone-600">0:00 / 0:00</span>
      </div>
      <audio id="audioPlayer" class="hidden"></audio>

      <!-- 樂譜區 -->
      <div class="score-container mx-auto mb-8">
        <div class="bg-white border border-stone-200 rounded-lg overflow-hidden shadow-sm">
          <div class="p-2 bg-stone-100 flex justify-end gap-2">
            <button id="btnZoom" class="px-3 py-1 text-sm bg-stone-600 text-white rounded hover:bg-stone-700">放大</button>
            <button id="btnFullscreen" class="px-3 py-1 text-sm bg-stone-600 text-white rounded hover:bg-stone-700">全螢幕</button>
          </div>
          <div class="p-4 flex justify-center">
            <img id="scoreImage" src="assets/scores/placeholder.svg" alt="樂譜" class="max-w-full h-auto cursor-zoom-in">
          </div>
        </div>
      </div>

      <!-- 解析區 -->
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white border border-stone-200 rounded-lg p-6 shadow-sm">
          <h2 class="text-lg font-bold text-stone-800 mb-3 border-b border-stone-200 pb-2">神學解析</h2>
          <div id="theologyBlock" class="text-stone-700 leading-relaxed"></div>
        </div>
        <div class="bg-white border border-stone-200 rounded-lg p-6 shadow-sm">
          <h2 class="text-lg font-bold text-stone-800 mb-3 border-b border-stone-200 pb-2">歷史典故</h2>
          <div id="historyBlock" class="text-stone-700 leading-relaxed"></div>
        </div>
      </div>
    </div>
    <div id="error" class="hidden text-center py-12 text-red-600">找不到此詩歌</div>
  </div>

  <!-- 全螢幕 overlay -->
  <div id="fullscreenOverlay" class="fullscreen-overlay hidden">
    <img id="fullscreenImg" src="" alt="樂譜全螢幕">
    <button id="btnCloseFullscreen" class="absolute top-4 right-4 px-4 py-2 bg-white text-stone-800 rounded">關閉</button>
  </div>

  <script src="js/hymn-learner.js"></script>
</body>
</html>
