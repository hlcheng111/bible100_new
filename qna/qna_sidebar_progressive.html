<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>聖經難題目錄（分層載入）</title>
<style>
body { font-size: 10pt; font-family: Microsoft JhengHei, Arial; margin: 8px; padding: 0; }
h3 { color: #b22222; margin: 0 0 8px 0; font-size: 1.1em; }
.back { display: inline-block; margin-bottom: 8px; padding: 4px 8px; background: #e8f4fc; border: 1px solid #2aa5ff; border-radius: 4px; cursor: pointer; font-size: 9pt; }
.back:hover { background: #d0e8f8; }
.source-link { display: block; padding: 6px 8px; margin: 2px 0; background: #f5f5f5; border-left: 3px solid #17a2b8; text-decoration: none; color: #333; border-radius: 0 4px 4px 0; }
.source-link:hover { background: #e8f4fc; }
.subcat-link { display: block; padding: 5px 8px; margin: 2px 0; background: #fff; border: 1px solid #ddd; text-decoration: none; color: #333; border-radius: 4px; }
.subcat-link:hover { background: #f0f8ff; }
.item-link { display: block; padding: 4px 8px; margin: 1px 0; font-size: 9pt; text-decoration: none; color: #0066cc; }
.item-link:hover { background: #f0f8ff; }
.section { margin: 12px 0; }
.section-title { font-weight: bold; color: #005c99; font-size: 10pt; margin-bottom: 6px; }
.loading { color: #666; font-style: italic; }
.error { color: #c33; }
#clip { margin: 8px 0; padding: 6px; background: #f0f8ff; border: 1px solid #b0d0e0; font-size: 9pt; }
#clipText { width: 100%; font-size: 9pt; margin-top: 4px; box-sizing: border-box; rows: 2; }
</style>
</head>
<body>
<!-- 先載入 embed 版（file:// 下 fetch 會失敗，改用 script 載入） -->
<script src="data/qna_level1_embed.js"></script>
<h3>聖經難題目錄</h3>
<div id="backBar" style="display:none;"><span class="back" id="backBtn">← 返回</span></div>
<div id="content"></div>
<div id="clip" style="display:none;">
  <b>AI 提問文字</b>（點題目後自動填入，Ctrl+A 全選 → Ctrl+C 複製）：
  <textarea id="clipText" rows="2"></textarea>
</div>

<script>
(function() {
  var BASE = 'data/';
  var state = { level: 1, category: null, source: null, sourceData: null, breadcrumb: [] };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    var d = document.createElement('span');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function prepareClip(title, url) {
    var ta = $('clipText');
    var clip = $('clip');
    if (ta && clip) {
      ta.value = '請根據以下聖經／神學難題詳細解答：\n\n題目：' + (title || '') + '\n原文網址：' + (url || '') + '\n';
      clip.style.display = 'block';
      clip.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function renderLevel1(data) {
    state.level = 1;
    state.source = null;
    state.sourceData = null;
    $('backBar').style.display = 'none';
    $('clip').style.display = 'none';

    var html = '';
    var cats = data.categories || [];
    var srcs = data.sources || [];
    for (var i = 0; i < cats.length; i++) {
      var c = cats[i];
      var list = srcs.filter(function(s) { return s.category === c.id; });
      if (list.length === 0) continue;
      html += '<div class="section"><div class="section-title">★ ' + esc(c.label) + '</div>';
      for (var j = 0; j < list.length; j++) {
        var s = list[j];
        html += '<a href="#" class="source-link" data-id="' + esc(s.id) + '" data-label="' + esc(s.label) + '" data-homepage="' + esc(s.homepage || '') + '" data-file="' + esc(s.dataFile || '') + '">' + esc(s.label) + '</a>';
      }
      html += '</div>';
    }
    $('content').innerHTML = html || '<p class="loading">無資料</p>';
  }

  function loadSource(id, label, homepage, dataFile) {
    state.level = 2;  // 進入 Level 2，使「← 返回」在載入失敗時也能回到 Level 1
    state.source = { id: id, label: label, homepage: homepage, dataFile: dataFile };
    $('backBar').style.display = 'block';
    $('content').innerHTML = '<p class="loading">載入中…</p>';

    if (homepage && window.parent && window.parent.frames && window.parent.frames['main']) {
      try { window.parent.frames['main'].location = homepage; } catch (e) {}
    }

    fetch(BASE + dataFile).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data) {
      state.sourceData = data;
      renderLevel2(data);
    }).catch(function(err) {
      $('content').innerHTML = '<p class="error">載入失敗：' + esc(err.message) + '</p><p style="font-size:9pt;margin-top:8px;">若使用 file:// 開啟，請改用：<br>① <a href="index_file.html" target="_top"><b>index_file.html</b></a>（無需 localhost）<br>② 或 HTTP 伺服器：<code>python -m http.server 8080</code> / <code>tools\\start_http_bible100.ps1</code></p>';
    });
  }

  function renderLevel2(data) {
    state.level = 2;
    var subcats = data.subcategories || {};
    var keys = Object.keys(subcats).filter(function(k) { return k && subcats[k] && subcats[k].length; });

    var html = '<div class="section"><div class="section-title">' + esc(data.sourceLabel || state.source.label) + '</div>';
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var items = subcats[k];
      var count = items ? items.length : 0;
      html += '<a href="#" class="subcat-link" data-subcat="' + esc(k) + '">' + esc(k) + ' <small>(' + count + ')</small></a>';
    }
    html += '</div>';
    $('content').innerHTML = html;
  }

  function renderLevel3(subcatName, items) {
    state.level = 3;
    state.breadcrumb = [state.source.label, subcatName];
    var html = '<div class="section"><div class="section-title">' + esc(subcatName) + '</div>';
    for (var i = 0; i < (items || []).length; i++) {
      var it = items[i];
      var url = it.url || '';
      var title = it.title || '';
      html += '<a href="' + esc(url) + '" target="main" class="item-link" data-title="' + esc(title) + '" data-url="' + esc(url) + '">' + esc(title) + '</a>';
    }
    html += '</div>';
    $('content').innerHTML = html;
  }

  $('backBtn').onclick = function() {
    if (state.level === 2) {
      renderLevel1(window._qnaLevel1);
    } else if (state.level === 3) {
      renderLevel2(state.sourceData);
    }
  };

  $('content').addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a) return;
    if (a.classList.contains('source-link')) {
      e.preventDefault();
      var file = a.getAttribute('data-file');
      if (file) loadSource(a.getAttribute('data-id'), a.getAttribute('data-label'), a.getAttribute('data-homepage') || '', file);
    } else if (a.classList.contains('subcat-link')) {
      e.preventDefault();
      var subcat = a.getAttribute('data-subcat');
      if (state.sourceData && state.sourceData.subcategories) renderLevel3(subcat, state.sourceData.subcategories[subcat]);
    } else if (a.classList.contains('item-link')) {
      prepareClip(a.getAttribute('data-title'), a.getAttribute('data-url'));
    }
  });

  function initLevel1() {
    var data = window.QNA_LEVEL1_DATA;
    if (data) {
      window._qnaLevel1 = data;
      renderLevel1(data);
      return;
    }
    fetch(BASE + 'qna_level1.json').then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d) {
      window._qnaLevel1 = d;
      renderLevel1(d);
    }).catch(function(err) {
      $('content').innerHTML = '<p class="error">載入失敗。請先執行 <code>python scripts/build_qna_list.py</code>。若使用 file:// 開啟，請改用 HTTP 伺服器（如 <code>python -m http.server</code> 或 <code>tools/start_http_bible100.ps1</code>）。</p>';
    });
  }
  initLevel1();
})();
</script>
</body>
</html>
