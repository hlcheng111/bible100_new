<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖經難題 Q&amp;A · 引導式目錄</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #fff;
    --border: #c8d4e0;
    --text: #1e293b;
    --muted: #64748b;
    --green: #15803d;
    --teal: #0d9488;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .bar {
    flex-shrink: 0;
    padding: 1px 6px 2px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
  }
  .bar1 { background: #f5f5f5; padding-top: 0; }
  .bar2 { background: #e8f4fc; }
  .bar .label {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: #334155;
    margin-right: 0;
    flex: 0 0 auto;
  }
  .pills {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    flex: 1 1 auto;
    min-width: 0;
  }
  .pill {
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid #6c9;
    background: #fff;
    font: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    color: #333;
    line-height: 1.2;
  }
  .pill:hover { border-color: #17a2b8; background: #17a2b8; color: #fff; }
  .pill.is-on {
    background: #28a745;
    border-color: #28a745;
    color: #fff;
  }
  .pill.src-on {
    background: #17a2b8;
    border-color: #17a2b8;
    color: #fff;
  }
  .pill.lang {
    font-size: 0.7rem;
    padding: 1px 5px;
  }
  .pill.cap-hub { border-style: dashed; opacity: 0.92; }
  .pill .cap-tag {
    font-size: 0.62rem;
    font-weight: 600;
    color: #64748b;
    margin-left: 3px;
  }
  .pill.src-on .cap-tag { color: #e0f2fe; }
  #sidebarTree .flat-list {
    margin: 0;
    padding: 4px 8px 8px 18px;
    list-style: disc;
  }
  #sidebarTree .cap-note {
    font-size: 0.75rem;
    color: #64748b;
    padding: 6px 4px 8px;
    line-height: 1.4;
  }
  /* 與「來源」同一列銜接膠囊，節省垂直空間 */
  .lang-row { margin-top: 0; margin-left: 0; }
  /* 多站導覽：第二列左起標籤，右側膠囊可多行整齊換行 */
  .bar2.hub-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding-top: 1px;
    padding-bottom: 2px;
  }
  .bar2.hub-bar > .label {
    flex: 0 0 auto;
    margin-right: 0;
  }
  .bar2.hub-bar #layer2 {
    flex: 1 1 200px;
    min-width: 0;
    gap: 6px;
  }
  .bar2.hub-bar #layer2 .pill {
    font-size: 0.74rem;
    padding: 3px 8px;
    line-height: 1.25;
  }

  .work {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .side {
    width: 32%;
    min-width: 260px;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--card);
  }
  .side-head {
    padding: 8px 10px;
    font-size: 0.75rem;
    color: var(--muted);
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  #sidebarTree {
    flex: 1;
    overflow: auto;
    padding: 6px 8px 12px;
    font-size: 0.82rem;
  }
  #sidebarTree details {
    margin-bottom: 4px;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    background: #fafafa;
  }
  #sidebarTree summary {
    cursor: pointer;
    padding: 6px 8px;
    font-weight: 600;
    color: #334155;
  }
  #sidebarTree ul {
    margin: 0;
    padding: 4px 8px 8px 20px;
    list-style: disc;
  }
  #sidebarTree li { margin: 3px 0; }
  #sidebarTree a.q-link {
    color: var(--blue);
    text-decoration: none;
    word-break: break-word;
  }
  #sidebarTree a.q-link:hover { text-decoration: underline; }
  #sidebarTree .sb-block { margin-bottom: 12px; }
  #sidebarTree .sb-lvl0 {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    padding: 6px 4px 4px;
    border-bottom: 1px solid #e2e8f0;
    margin-bottom: 6px;
  }

  #sidebarFrame {
    flex: 1;
    width: 100%;
    border: 0;
    min-height: 120px;
    display: none;
  }
  #sidebarFrame.show { display: block; }

  .mainPane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #fff;
    position: relative;
  }
  .mainPane header {
    padding: 6px 10px;
    font-size: 0.75rem;
    color: var(--muted);
    border-bottom: 1px solid #e2e8f0;
  }
  #mainFrame {
    flex: 1;
    width: 100%;
    border: 0;
    min-height: 120px;
  }

  .ai-quick {
    padding: 6px 10px;
    border-bottom: 1px solid #e2e8f0;
    background: #f8fbff;
    display: none;
  }
  .ai-quick.show { display: block; }
  .ai-quick-btn {
    padding: 4px 10px;
    font-size: 0.8rem;
    border: 1px solid #93c5fd;
    border-radius: 999px;
    background: #eff6ff;
    color: #1e40af;
    cursor: pointer;
  }
  .ai-quick details {
    margin-top: 6px;
    background: #eff6ff;
    border: 1px solid #93c5fd;
    border-radius: 6px;
    padding: 6px;
  }
  .ai-quick summary { cursor: pointer; color: #1e40af; font-size: 0.8rem; }
  .ai-quick textarea {
    width: 100%;
    min-height: 72px;
    font: inherit;
    font-size: 0.8rem;
    margin-top: 6px;
  }
  .ai-quick .row { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .foot {
    flex-shrink: 0;
    padding: 2px 8px 3px;
    font-size: 0.68rem;
    line-height: 1.35;
    color: var(--muted);
    background: #e8edf2;
    border-top: 1px solid var(--border);
  }
  .v3-banner {
    flex-shrink: 0;
    padding: 4px 10px;
    font-size: 0.78rem;
    line-height: 1.35;
    background: #ecfdf5;
    border-bottom: 1px solid #6ee7b7;
    color: #065f46;
  }
  .v3-banner a { color: #047857; font-weight: 600; }
  .mainPane header .ext-hint {
    color: #b45309;
    font-weight: 600;
    margin-left: 6px;
  }

  .work.full-main .side,
  .work.hub-mode .side { display: none; }
  .work.full-main .mainPane,
  .work.hub-mode .mainPane { flex: 1; max-width: 100%; }

  @media (max-width: 768px) {
    .work { flex-direction: column; }
    .side { width: 100%; max-width: none; height: 40vh; }
    .mainPane { min-height: 42vh; }
  }
</style>
</head>
<body>

  <div class="v3-banner" id="v3Banner">
    <strong>聖經難題 Q&amp;A</strong> · 大類 → 來源 → 題目 → 原站解答（可 <code>file://</code> 或 HTTP 獨立開啟本頁）。
  </div>

  <div class="bar bar1">
    <span class="label">大類</span>
    <div class="pills" id="layer1"></div>
  </div>
  <div class="bar bar2">
    <span class="label">來源</span>
    <div class="pills" id="layer2"></div>
    <div class="pills lang-row" id="langNav" hidden></div>
  </div>

  <div class="work">
    <aside class="side" aria-label="題目目錄">
      <div class="side-head"><strong id="sideHeadLabel">題目目錄</strong></div>
      <div class="ai-quick" id="aiQuick">
        <button type="button" class="ai-quick-btn" id="btnAiToggle">進深追問AI</button>
        <details id="aiQuickPanel">
          <summary>AI 追問內容（點題目後自動填入）</summary>
          <textarea id="aiText" placeholder="先點左欄題目，再按『進深追問AI』。"></textarea>
          <div class="row">
            <button type="button" id="btnCopy" class="pill">複製提示文字</button>
            <a href="../help/ai-chooser.html" target="_blank" rel="noopener">選 AI 平台</a>
          </div>
        </details>
      </div>
      <div id="sidebarTree"></div>
      <iframe id="sidebarFrame" class="show" title="完整目錄（備援）" src="qna_list_auto.htm?v=6"></iframe>
    </aside>
    <div class="mainPane">
      <header><strong>原站解答</strong><span class="ext-hint" id="mainExtHint" hidden>· 外部連結請用新分頁</span></header>
      <iframe id="mainFrame" name="main" title="解答頁面"></iframe>
    </div>
  </div>

  <footer class="foot">
    結構化題庫：<code>data/qna_sidebar_bundle.js</code> · 設定：<code>qna_nav_config.js</code>
  </footer>

<script>
(function () {
  var ASSET_VER = "20260726";
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "v=" + ASSET_VER;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  // 先載入導航設定（小檔），再載入大包，避免大包失敗時連頂欄都無法顯示
  loadScript("qna_nav_config.js")
    .then(function () {
      return loadScript("data/qna_sidebar_bundle.js");
    })
    .then(startApp)
    .catch(function () {
      try {
        startApp();
      } catch (e) {}
      alert("題庫 bundle 可能未載入（file:// 下大檔易被擋）。請用本機 http 伺服器開 qna 資料夾，或檢查 data/qna_sidebar_bundle.js 路徑。");
    });

function startApp() {
  var cfg = window.QNA_NAV_CONFIG || { layer1_categories: [], sources: [] };
  var bundle = window.QNA_SIDEBAR_BUNDLE || {};
  var bundleReady = !!(window.QNA_SIDEBAR_BUNDLE && Object.keys(window.QNA_SIDEBAR_BUNDLE).length);
  var state = { cat: "A", src: "" };

  /**
   * V3 能力表（試做）：決定側欄呈現，不改頂欄結構。
   * book = 書卷樹可篩 OT/NT；topic = 主題樹整包；flat = 單層題目、藏「未分類」；
   * hub = 導覽入口（無可用題樹時不當假分類）。
   */
  var SOURCE_CAPABILITY = {
    chineseapologetics: "book",
    equiptoserve_etspedia: "book",
    equiptoserve: "book",
    equiptoserve_deut_ruth: "topic",
    equiptoserve_ot_bg: "hub",
    equiptoserve_nt_bg: "hub",
    equiptoserve_apologetics: "topic",
    defendinginerrancy: "book",
    biblequestions: "topic",
    gotquestions: "topic",
    christiananswers: "topic",
    christiananswers_zh_trad: "hub",
    christiananswers_id: "hub",
    wellsofgrace: "hub",
    wellsofgrace_archer: "book",
    wellsofgrace_chen_book: "hub",
    wellsofgrace_chen_ot: "flat",
    wellsofgrace_chen_nt: "flat",
    wellsofgrace_su_nt: "book",
    wellsofgrace_su_reading: "flat",
    wellsofgrace_li_ot: "book",
    wellsofgrace_lv: "flat",
    wellsofgrace_wenti2: "flat",
    ccbiblestudy: "toc",
    reformedanswers: "topic",
    wellsofgrace_chen_theology: "topic",
    billygraham: "topic",
    logosbaptist: "topic",
    wellsofgrace_chen_life: "topic",
    wellsofgrace_chen_church: "topic"
  };
  /** V3 頂欄隱藏：空殼／與子系列重複的入口（資料仍在 bundle，不刪） */
  var SOURCE_V3_HIDE = {
    wellsofgrace: 1,
    wellsofgrace_chen_book: 1
  };
  var JUNK_GROUP_RE = /^(未分類|待整理|雜題|未標註經文／主題|未標註經文\/主題|Uncategorized|Other|其他)$/i;

  /** 垃圾組／單層包 → 側欄第1層顯示名 */
  function junkLayer1Label() {
    return "雜題";
  }

  /** 英文題庫裡的「首頁／分類頁」——點了只會飛到目錄，側欄應隱藏 */
  function isEnglishIndexUrl(url) {
    if (!url) return false;
    var u = String(url).toLowerCase();
    if (/\/bible-difficulties\/?$/.test(u)) return true;
    if (/\/content\.html$/.test(u)) return true;
    if (/\/content_[a-z0-9_-]+\.html$/.test(u)) return true;
    if (/\/home\.html$/.test(u)) return true;
    if (/gotquestions\.org\/(chinese\/)?chinese-(ask|about|faq|good-news|crucial)/i.test(u)) return true;
    if (/christiananswers\.net\/[^/]+\/home\.html$/i.test(u)) return true;
    if (/\/answers\/?$/.test(u) && /billygraham|reformedanswers/i.test(u)) return true;
    return false;
  }

  function filterEnglishIndexItems(items) {
    if (!items || !items.length) return items;
    var kept = items.filter(function (it) {
      return !isEnglishIndexUrl(it.url);
    });
    return kept.length ? kept : items;
  }

  function getCapability(srcId) {
    if (!srcId) return "topic";
    if (SOURCE_CAPABILITY[srcId]) return SOURCE_CAPABILITY[srcId];
    if (/^hub_/.test(srcId)) return "hub";
    if (/^christiananswers/.test(srcId)) return "hub";
    return "topic";
  }

  function isJunkGroupName(name) {
    var n = displayGroupName(name || "");
    return JUNK_GROUP_RE.test(n);
  }

  /** flat 能力，或「僅一組且組名為未分類」→ 直接列題、不顯示組名 */
  function shouldFlattenGroups(groups, cap) {
    if (cap === "flat") return true;
    if (!groups || groups.length !== 1) return false;
    return isJunkGroupName(groups[0].name);
  }

  var EQ_UNIFIED_BLOCKS = [
    { bundleKey: "equiptoserve", title: "書卷難題", mode: "book" },
    { bundleKey: "equiptoserve_deut_ruth", title: "申命記～路得記", mode: "deut" },
    { bundleKey: "equiptoserve_ot_bg", title: "舊約背景", mode: "otbg" },
    { bundleKey: "equiptoserve_nt_bg", title: "新約背景", mode: "ntbg" },
    { bundleKey: "equiptoserve_apologetics", title: "辯道護教", mode: "apo" }
  ];

  var NT_TAIL = new Set([
    "MATTHEW", "MARK", "LUKE", "JOHN", "ACTS", "ROMANS", "GALATIANS", "EPHESIANS",
    "PHILIPPIANS", "COLOSSIANS", "HEBREWS", "JAMES", "JUDE", "REVELATION",
    "New Testament"
  ]);
  var NT_PARTS = [
    "1 CORINTHIANS", "2 CORINTHIANS", "1 THESSALONIANS", "2 THESSALONIANS",
    "1 TIMOTHY", "2 TIMOTHY", "1 PETER", "2 PETER", "1 JOHN", "2 JOHN", "3 JOHN",
    "TITUS", "PHILEMON"
  ];
  NT_PARTS.forEach(function (x) { NT_TAIL.add(x); });

  function catSetFor(cat) {
    var set = {};
    if (["A", "A_OT", "A_NT"].indexOf(cat) >= 0) {
      ["A", "A_OT", "A_NT"].forEach(function (c) { set[c] = 1; });
    } else {
      set[cat] = 1;
    }
    return set;
  }

  function sourcesForCategory(cat) {
    var set = catSetFor(cat);
    var list = cfg.sources.filter(function (s) {
      if (SOURCE_V3_HIDE[s.id]) return false;
      if (s.categories && s.categories.length) {
        return s.categories.indexOf(cat) >= 0;
      }
      return set[s.category];
    });
    // 小白模式：不顯示「全部來源」避免左欄載入舊巨型目錄、搜尋框與引導語意衝突
    var trimmed = list.filter(function (s) { return s.id !== "all" && s.id !== "all_B" && s.id !== "all_C"; });
    if (trimmed.length) return trimmed;
    return list.length ? list : cfg.sources.slice();
  }

  function resolveDefaultSrc(cat, list) {
    var src = state.src;
    if (!list.length) return src;
    if (list.some(function (s) { return s.id === src; })) return src;
    if (/^equiptoserve/.test(src) && src !== "equiptoserve_etspedia" &&
        list.some(function (s) { return s.id === "equiptoserve_etspedia"; })) {
      return "equiptoserve_etspedia";
    }
    return list[0].id;
  }

  function lastSegment(name) {
    var parts = name.split("·");
    return parts[parts.length - 1].trim();
  }

  function isNtGroupName(name) {
    if (name.indexOf("新約") >= 0) return true;
    var tail = lastSegment(name).toUpperCase();
    if (NT_TAIL.has(tail)) return true;
    return false;
  }

  function isOtGroupName(name) {
    if (name.indexOf("舊約") >= 0) return true;
    var tail = lastSegment(name).toUpperCase();
    if (tail === "OLD TESTAMENT") return true;
    if (isNtGroupName(name)) return false;
    if (/^[A-Z0-9 ]+$/.test(tail) && tail.length > 2 && !NT_TAIL.has(tail)) {
      if (tail.indexOf("CORINTHIANS") >= 0 || tail.indexOf("THESSALONIANS") >= 0 ||
          tail.indexOf("TIMOTHY") >= 0 || tail.indexOf("PETER") >= 0 || tail.indexOf("JOHN") >= 0) {
        return !isNtGroupName(name);
      }
      return true;
    }
    return false;
  }

  function filterGroupsByCat(groups, cat, cap) {
    // V3：非 book／toc → A_OT／A_NT 仍顯示整包，不空篩
    if (cap && cap !== "book" && cap !== "toc") return groups;
    if (cat === "B" || cat === "C" || cat === "A") return groups;
    var filtered = groups.filter(function (g) {
      if (cat === "A_NT") return isNtGroupName(g.name);
      if (cat === "A_OT") return isOtGroupName(g.name);
      return true;
    });
    // 保險：書卷篩完若空，仍回整包（與產品定案一致）
    if (filtered.length === 0 && groups.length) return groups;
    return filtered;
  }

  function shouldShowEqBlock(cat, mode) {
    if (cat === "B") return mode === "apo";
    if (cat === "A_NT") return mode === "book" || mode === "ntbg";
    if (cat === "A_OT") return mode === "book" || mode === "deut" || mode === "otbg";
    if (cat === "A") return mode === "book" || mode === "deut" || mode === "otbg" || mode === "ntbg";
    return false;
  }

  function displayGroupName(name) {
    if (!name) return "";
    // 將建包時的「來源短名 · 原本分組」縮成只顯示後半段
    // 例：GotQuestions 中文 · MATTHEW -> MATTHEW
    if (name.indexOf(" · ") >= 0) return name.split(" · ").slice(-1)[0].trim();
    return name.trim();
  }

  function currentSourceRow() {
    return cfg.sources.filter(function (s) { return s.id === state.src; })[0];
  }

  function isExternalHttp(url) {
    if (!url || url === "about:blank") return false;
    try {
      var u = new URL(url, location.href);
      if (u.protocol !== "http:" && u.protocol !== "https:") return false;
      return u.origin !== location.origin;
    } catch (e) {
      return /^https?:\/\//i.test(String(url));
    }
  }

  /** 英文／已知禁嵌：用說明卡。中文常可嵌站：允許 iframe（恢復舊體驗）。 */
  function isNoFrameEmbedHost(url) {
    try {
      var h = new URL(url, location.href).hostname;
      return (
        /\.gotquestions\.org$/i.test(h) ||
        /(^|\.)billygraham\.org$/i.test(h) ||
        /(^|\.)christiananswers\.net$/i.test(h) ||
        /(^|\.)reformedanswers\.org$/i.test(h) ||
        /(^|\.)biblequestions\.org$/i.test(h) ||
        /(^|\.)logosbaptist\.org$/i.test(h)
      );
    } catch (e) {
      return false;
    }
  }

  /** 可嵌 iframe：中文站 + Defending（無 XFO；右欄直達答案） */
  function isPreferEmbedHost(url) {
    try {
      var h = new URL(url, location.href).hostname;
      return (
        /(^|\.)wellsofgrace\.com$/i.test(h) ||
        /(^|\.)tochrist\.org$/i.test(h) ||
        /(^|\.)chineseapologetics\.net$/i.test(h) ||
        /(^|\.)equiptoserve\.org$/i.test(h) ||
        /(^|\.)ccbiblestudy\.org$/i.test(h) ||
        /(^|\.)defendinginerrancy\.com$/i.test(h) ||
        /(^|\.)127\.0\.0\.1$/i.test(h) ||
        /(^|\.)localhost$/i.test(h)
      );
    } catch (e) {
      return false;
    }
  }

  function setMainExtHint(on) {
    var el = document.getElementById("mainExtHint");
    if (el) el.hidden = !on;
  }

  function showExternalCard(url, title, opened) {
    var f = document.getElementById("mainFrame");
    var uEsc = escapeAttr(url);
    var tEsc = escapeHtml(title || "外部頁面");
    setMainExtHint(true);
    f.removeAttribute("src");
    f.src = "about:blank";
    f.srcdoc =
      "<!DOCTYPE html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>外部連結</title></head>" +

  function setMain(url, title, fromUserClick) {
    var f = document.getElementById("mainFrame");
    if (!url || url === "about:blank") {
      setMainExtHint(false);
      f.removeAttribute("srcdoc");
      f.src = "about:blank";
      return;
    }
    // 點題時再修一次以斯拉路徑（避免快取舊 data-url 仍 軟404）
    url = fixEquiptoserveLegacyUrl(url);

    if (!isExternalHttp(url)) {
      setMainExtHint(false);
      f.removeAttribute("srcdoc");
      f.src = url;
      return;
    }
    // 英文／禁嵌：側欄點題 → 立即新分頁（使用者手勢），右欄留說明
    if (isNoFrameEmbedHost(url)) {
      var opened = false;
      if (fromUserClick) {
        try {
          var w = window.open(url, "_blank", "noopener,noreferrer");
          opened = !!w;
        } catch (eO) {
          opened = false;
        }
      }
      showExternalCard(url, title || ((currentSourceRow() || {}).label) || "原站頁面", opened || fromUserClick);
      return;
    }
    // 中文可嵌（含修好路徑的以斯拉）
    if (isPreferEmbedHost(url)) {
      setMainExtHint(false);
      f.removeAttribute("srcdoc");
      f.src = url;
      return;
    }
    showExternalCard(url, title || ((currentSourceRow() || {}).label) || "原站頁面", false);
  }

  function renderCcBibleStudySidebar(groups, qf) {
    var sections = {
      "主題查經": [],
      "舊約查經": [],
      "新約查經": [],
      "其他": []
    };
    (groups || []).forEach(function (g) {
      var name = g.name || "";
      var sec = "其他";
      var book = name;
      if (/^主題查經/.test(name)) {
        sec = "主題查經";
        book = name.replace(/^主題查經\s*[>·／/]\s*/, "") || name;
      } else if (/^舊約查經/.test(name)) {
        sec = "舊約查經";
        book = name.replace(/^舊約查經\s*[>·／/]\s*/, "") || name;
      } else if (/^新約查經/.test(name)) {
        sec = "新約查經";
        book = name.replace(/^新約查經\s*[>·／/]\s*/, "") || name;
      }
      var items = (g.items || []).filter(function (it) {
        if (!qf) return true;
        return (it.title || "").toLowerCase().indexOf(qf) >= 0 ||
          book.toLowerCase().indexOf(qf) >= 0;
      });
      if (!items.length && qf) return;
      sections[sec].push({ book: book, items: items.length ? items : g.items || [] });
    });

    var html =
      "<p class=\"cap-note\"><strong>三層選單</strong>：預設只顯示①主題／舊約／新約；點開才見②書卷或主題 → ③章／篇。" +
      "亦可開 <a class=\"q-link\" href=\"https://www.ccbiblestudy.org/index-T.htm\" data-title=\"查經網總目錄\" data-url=\"https://www.ccbiblestudy.org/index-T.htm\" target=\"_blank\" rel=\"noopener\">總目錄 index-T</a>。</p>";
    var order = ["主題查經", "舊約查經", "新約查經", "其他"];
    order.forEach(function (sec) {
      var books = sections[sec];
      if (!books || !books.length) return;
      html +=
        "<details class=\"sb-sec\"><summary style=\"cursor:pointer;font-weight:700;color:#0f766e;padding:6px 4px\">" +
        escapeHtml(sec) +
        "（" +
        books.length +
        "）</summary>";
      books.forEach(function (b) {
        var items = b.items || [];
        if (!items.length) return;
        html +=
          "<details style=\"margin:4px 0 6px 10px;border:1px solid #e2e8f0;border-radius:4px;background:#fafafa\">" +
          "<summary style=\"cursor:pointer;padding:5px 8px;font-weight:600\">" +
          escapeHtml(b.book) +
          "（" +
          items.length +
          "）</summary><ul style=\"margin:0;padding:4px 8px 8px 22px\">";
        html += appendItemLinksHtml(items, b.book);
        html += "</ul></details>";
      });
      html += "</details>";
    });
    return html;

  function appendGroupsDetailsHtml(groups, qf, firstOpenedRef, flatten) {
    var html = "";
    var srcId = state.src;
    var scrubEn = /^(defendinginerrancy|gotquestions|biblequestions|christiananswers|christiananswers_zh_trad|christiananswers_id|reformedanswers|billygraham)$/.test(srcId);
    // 搜尋時才自動展開有結果的組；平時全部收合，只露第1層
    var allowAutoOpen = !!(qf && String(qf).trim());
    if (flatten) {
      var flatItems = [];
      groups.forEach(function (g) {
        var items = scrubEn ? filterEnglishIndexItems(g.items || []) : g.items || [];
        items.forEach(function (it) {
          if (qf && (it.title || "").toLowerCase().indexOf(qf) < 0) return;
          flatItems.push({ it: it, gname: displayGroupName(g.name) });
        });
      });
      if (!flatItems.length) return "";
      // 單層／未分類：仍包成第1層「雜題」，勿一次攤開幾百題
      html += "<p class=\"cap-note\">點「" + junkLayer1Label() + "」才展開題目（" + flatItems.length + " 則）</p>";
      html += "<details" + (allowAutoOpen ? " open" : "") + "><summary>" + escapeHtml(junkLayer1Label()) + "（" + flatItems.length + "）</summary><ul class=\"flat-list\">";
      flatItems.forEach(function (row) {
        html += appendItemLinksHtml([row.it], row.gname);
      });
      html += "</ul></details>";
      if (firstOpenedRef) firstOpenedRef.v = true;
      return html;
    }
    groups.forEach(function (g) {
      var rawItems = scrubEn ? filterEnglishIndexItems(g.items || []) : g.items || [];
      var items = rawItems.filter(function (it) {
        if (!qf) return true;
        return (it.title || "").toLowerCase().indexOf(qf) >= 0;
      });
      if (!items.length) return;
      var openAttr = "";
      if (allowAutoOpen && firstOpenedRef && !firstOpenedRef.v) {
        openAttr = " open";
        firstOpenedRef.v = true;
      }
      var gLabel = displayGroupName(g.name);
      if (isJunkGroupName(g.name)) gLabel = junkLayer1Label();
      html += "<details" + openAttr + "><summary>" + escapeHtml(gLabel) + "（" + items.length + "）</summary><ul>";
      html += appendItemLinksHtml(items, gLabel);
      html += "</ul></details>";
    });
    return html;
  }

  function fixEquiptoserveLegacyUrl(url) {
    if (!url) return url;
    var s = String(url).replace(/^http:\/\//i, "https://");
    if (!/equiptoserve\.org\/etspedia/i.test(s)) return url;
    // 舊站路徑 /聖經難題/… → 首頁（勿猜）
    if (/%E8%81%96%E7%B6%93%E9%9B%A3%E9%A1%8C/i.test(s)) return "https://www.equiptoserve.org/etspedia/";
    if (/\/聖經難題(\/|$)/i.test(s)) return "https://www.equiptoserve.org/etspedia/";

    // Bundle 常見錯：/etspedia/genesis/slug 缺「舊約／新約聖經難題」前綴 → Page Not Found
    // 正確：/etspedia/old-testament-bible-questions/genesis/slug
    var m = s.match(/^(https:\/\/(?:www\.)?equiptoserve\.org\/etspedia)\/([a-z0-9-]+)\/(.+)$/i);
    if (m) {
      var book = m[2].toLowerCase();
      var rest = m[3];
      var reserved = {
        "old-testament-bible-questions": 1,
        "new-testament-bible-questions": 1,
        "old-testament-background": 1,
        "new-testament-background": 1,
        "apologetics-and-defense-of-faith": 1,
        "religious-apologetics": 1,
        "biblical-characters-dictionary": 1,
        "biblical-geography-dictionary": 1,
        "jewish-culture": 1,
        "biblical-archaeology": 1,
        "biblical-customs": 1,
        "book-collection-vs-reading-books": 1,
        "writing-library": 1,
        "deuteronomy-ruth": 1
      };
      if (!reserved[book]) {
        var ot = {
          genesis: 1, exodus: 1, leviticus: 1, numbers: 1, deuteronomy: 1,
          joshua: 1, judges: 1, ruth: 1, samuel: 1, kings: 1,
          "leviticus-numbers": 1, "psalms-songofsolomon": 1,
          "isaiah-lamentations": 1, "ezekiel-hosea": 1, "joel-malachi": 1,
          "first-samuel": 1, "second-samuel": 1, "first-kings": 1, "second-kings": 1,
          "first-chronicles": 1, "second-chronicles": 1, ezra: 1, nehemiah: 1,
          esther: 1, job: 1, psalms: 1, proverbs: 1, ecclesiastes: 1,
          "song-of-solomon": 1, isaiah: 1, jeremiah: 1, lamentations: 1,
          ezekiel: 1, daniel: 1, hosea: 1, joel: 1, amos: 1, obadiah: 1,
          jonah: 1, micah: 1, nahum: 1, habakkuk: 1, zephaniah: 1,
          haggai: 1, zechariah: 1, malachi: 1
        };
        var nt = {
          matthew: 1, mark: 1, luke: 1, john: 1, acts: 1, romans: 1,
          "1-corinthians": 1, "2-corinthians": 1, galatians: 1, ephesians: 1,
          philippians: 1, colossians: 1, "1-thessalonians": 1, "2-thessalonians": 1,
          "1-timothy": 1, "2-timothy": 1, titus: 1, philemon: 1, hebrews: 1,
          james: 1, "1-peter": 1, "2-peter": 1, "1-john": 1, "2-john": 1,
          "3-john": 1, jude: 1, revelation: 1,
          "first-corinthians": 1, "second-corinthians": 1,
          "first-thessalonians": 1, "second-thessalonians": 1,
          "first-timothy": 1, "second-timothy": 1,
          "first-peter": 1, "second-peter": 1,
          "first-john": 1, "second-john": 1, "third-john": 1
        };
        if (ot[book]) {
          return m[1] + "/old-testament-bible-questions/" + book + "/" + rest;
        }
        if (nt[book]) {
          return m[1] + "/new-testament-bible-questions/" + book + "/" + rest;
        }
      }
    }
    return s;
  }

        (landM && landM !== "about:blank"

          : "");

  function escapeHtml(s) {
    if (!s) return "";
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

      a.href = "#";
      a.className = "pill lang";
      a.textContent = l === "zh" ? "本站 · 中文首頁" : "English landing";
      a.addEventListener("click", function (e) {
        e.preventDefault();
        setMain(u, l === "zh" ? "中文首頁" : "English landing");
      });
      row.appendChild(a);
    });
  }

  function onSourceChange() {
    var cur = currentSourceRow();
    if (!cur) return;
    if (state.cat === "HUB") state.cat = "A";
    // 英文禁嵌站：切換來源時不要載入 landing（多為目錄／首頁），改提示點左欄題目
    if (cur.landing && isNoFrameEmbedHost(cur.landing)) {
      var f = document.getElementById("mainFrame");
      setMainExtHint(true);
      f.src = "about:blank";
      f.srcdoc =
        "<!DOCTYPE html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><title>選題</title></head>" +
        "<body style=\"font-family:Microsoft JhengHei,system-ui,sans-serif;padding:1.25rem;line-height:1.55;color:#334155;max-width:40rem;background:#f8fafc\">" +
        "<p style=\"color:#047857;font-weight:700\">" + escapeHtml(cur.label) + "</p>" +
        "<p>請在<strong>左欄</strong>先點第1層（書卷／主題／雜題），再點具體題目。<strong>新分頁直達答案</strong>（已隱藏首頁／目錄類連結）。</p>" +
        "<p style=\"font-size:0.85rem;color:#64748b\">若左欄很少題目，代表題庫尚未收錄文章頁，需另爬（如部分 GotQuestions／CA）。</p>" +
        "</body></html>";
      renderLangNav();
      renderSidebar();
      return;
    }
    if (cur.landing && cur.landing !== "about:blank") {
      setMain(cur.landing, cur.label);
    } else {
      var landingMap = {
        A: "qna_landing_A.htm",
        A_OT: "qna_landing_A_OT.htm",
        A_NT: "qna_landing_A_NT.htm",
        B: "qna_landing_B.htm",
        C: "qna_landing_C.htm"
      };
      setMain(landingMap[state.cat] || "qna_landing.htm", "本站導覽");
    }
    renderLangNav();
    renderSidebar();
  }

  function syncUi() {
    updateSideHeadLabel();
    renderLayer1();
    renderLayer2();
    updateHubBarClass();
    updateAiQuickVisibility();
  }

  document.getElementById("btnCopy").addEventListener("click", function () {
    var ta = document.getElementById("aiText");
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
    }
  });
  document.getElementById("btnAiToggle").addEventListener("click", function () {
    var panel = document.getElementById("aiQuickPanel");
    if (panel) panel.open = !panel.open;
  });

  if (location.hash === "#hub") state.cat = "A";
  try {
    var _sp = new URLSearchParams(window.location.search.replace(/^\?/, ""));
    var catP = String(_sp.get("cat") || "").toUpperCase();
    if (catP && catP !== "HUB") state.cat = catP;
    if (catP === "HUB") state.cat = "A";
    var srcP = String(_sp.get("src") || "").trim();
    if (srcP) state.src = srcP;
  } catch (eHub) {}

  var list0 = sourcesForCategory(state.cat);
  if (!state.src || !list0.some(function (s) { return s.id === state.src; })) {
    state.src = resolveDefaultSrc(state.cat, list0);
  }
  syncUi();
}
})();
</script>
</body>
</html>
