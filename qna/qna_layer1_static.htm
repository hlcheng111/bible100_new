<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>難題性質（靜態版）</title>
<style>
body { margin: 0; padding: 4px 8px; font-size: 11pt; font-family: Microsoft JhengHei, Arial, sans-serif; background: #f5f5f5; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.nav a { padding: 4px 10px; background: #fff; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: #333; }
.nav a:hover, .nav a.active { background: #28a745; color: #fff; border-color: #28a745; }
</style>
</head>
<body>
<div class="nav">
  <a href="#" class="active" data-landing="qna_landing_A.htm">聖經書卷難題</a>
  <a href="#" data-landing="qna_landing_A_OT.htm">舊約難題</a>
  <a href="#" data-landing="qna_landing_A_NT.htm">新約難題</a>
  <a href="#" data-landing="qna_landing_B.htm">神學教義難題</a>
  <a href="#" data-landing="qna_landing_C.htm">信徒教會難題</a>
</div>
<script>
(function(){
  var nav = document.querySelector(".nav");
  var links = nav.querySelectorAll("a");
  links.forEach(function(a){
    a.onclick = function(e){
      e.preventDefault();
      try {
        var f = window.parent && window.parent.frames;
        if (f && f["main"] && a.getAttribute("data-landing")) {
          f["main"].location = a.getAttribute("data-landing");
        }
      } catch(err) { console.error("Layer1 static click error:", err); }
      links.forEach(function(x){ x.className = x === a ? "active" : ""; });
      return false;
    };
  });
})();
</script>
</body>
</html>
