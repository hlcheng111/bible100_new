<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>難題性質</title>
<style>
body { margin: 0; padding: 4px 8px; font-size: 11pt; font-family: Microsoft JhengHei, Arial, sans-serif; background: #f5f5f5; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.nav a { padding: 4px 10px; background: #fff; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: #333; }
.nav a:hover, .nav a.active { background: #28a745; color: #fff; border-color: #28a745; }
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<script src="qna_nav_config.js"></script>
<script>
(function(){
  var cfg = window.QNA_NAV_CONFIG || {
    layer1_categories: [
      {id:"A", label:"聖經書卷難題"},
      {id:"A_OT", label:"舊約難題"},
      {id:"A_NT", label:"新約難題"},
      {id:"B", label:"神學教義難題"},
      {id:"C", label:"信徒教會難題"}
    ]
  };
  var cat = (location.search.match(/[?&]cat=([^&]+)/) || [])[1] || "A";
  var src = (location.search.match(/[?&]src=([^&]+)/) || [])[1] || "";
  var nav = document.getElementById("nav");
  cfg.layer1_categories.forEach(function(c){
    var a = document.createElement("a");
    var q = "qna_layer2.htm?cat=" + c.id;
    if (src) q += "&src=" + src;
    a.href = q;
    a.textContent = c.label;
    a.target = "layer2";
    if (c.id === cat) a.className = "active";
    a.onclick = function(){
      try {
        var f = window.parent.frames;
        var landingMap = {"A":"qna_landing_A.htm","A_OT":"qna_landing_A_OT.htm","A_NT":"qna_landing_A_NT.htm","B":"qna_landing_B.htm","C":"qna_landing_C.htm"};
        if (f && f["main"] && landingMap[c.id]) {
          f["main"].location = landingMap[c.id];
        }
      } catch(e) {
        console.error("Layer1 click error:", e);
      }
    };
    nav.appendChild(a);
  });
})();
</script>
</body>
</html>
