<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChristianAnswers · Family 導覽</title>
<style>
:root { --bg:#f5f7fb; --panel:#fff; --line:#d9e1ec; --text:#1d2733; --muted:#637282; --accent:#1248aa; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--text); background: var(--bg); }
.app { height: 100%; display: flex; flex-direction: column; }
.topbar {
  flex: 0 0 auto; min-height: 48px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 8px 14px; font-size: 14px;
}
.topbar .title { font-weight: 700; flex: 1 1 200px; }
.topbar a { color: var(--accent); text-decoration: none; }
.topbar a:hover { text-decoration: underline; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; }
.sidebar { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 10px 20px; display: flex; flex-direction: column; gap: 8px; }
.sidebar .l1 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
#tree { flex: 1; overflow: auto; }
.details { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #fafbfc; }
.details summary { cursor: pointer; padding: 8px 10px; font-weight: 600; font-size: 13px; }
.details .lvl3 { list-style: none; margin: 0; padding: 4px 8px 10px 12px; }
.details .lvl3 li { margin: 4px 0; }
.details button.linkish {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  color: var(--accent); font: inherit; font-size: 12px; line-height: 1.35; padding: 4px 4px; border-radius: 4px;
}
.details button.linkish:hover { background: #edf3ff; }
.viewer { min-width: 0; min-height: 0; background: #fff; position: relative; display: flex; flex-direction: column; }
#iframe { flex: 1; width: 100%; min-height: 240px; border: 0; display: none; }
.landing { height: 100%; overflow: auto; padding: 20px 24px; font-size: 14px; }
.landing h2 { margin: 0 0 10px; font-size: 20px; }
.landing p { margin: 8px 0; color: var(--muted); line-height: 1.5; }
.note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <span class="title">Family & Personal Issues – ChristianAnswers</span>
    <a href="qna_index.htm">Q&amp;A 導覽首頁</a>
    <a href="https://christiananswers.net/parenting/home.html" target="_blank" rel="noopener">官方首頁</a>
  </header>
  <div class="main">
    <aside class="sidebar">
      <p class="l1">Family & Personal Issues – ChristianAnswers</p>
      <input type="search" class="search" id="qnaFilter" placeholder="篩選標題…" autocomplete="off">
      <div id="tree"></div>
      <p class="note">資料： christiananswers.net/parenting/home.html 主區塊中 li.ques 之連結（下載解析）。</p>
    </aside>
    <section class="viewer">
      <div id="landing" class="landing">
        <h2>歡迎</h2>
        <p>左側選主題與題目；右側 iframe 載入原文。若無法嵌入，請用頂端「官方」連結或按鈕在新分頁開啟。</p>
        <p><button type="button" id="openInitial" style="padding:8px 14px;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#f7faff;">於右側開啟官方首頁／索引</button></p>
      </div>
      <iframe id="iframe" title="viewer" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
  </div>
</div>

<script>

ncerned about our family’s viewing habits?","url":"https://christiananswers.net/q-eden/edn-f014.html"},{"title":"Why does Hollywood continue to promote immoral programming?","url":"https://christiananswers.net/q-eden/edn-f013.html"},{"title":"How does viewing violence on TV or movies affect the family?","url":"https://christiananswers.net/q-eden/edn-f012.html"},{"title":"What is being done to change the values of Hollywood?","url":"https://christiananswers.net/q-eden/edn-f015.html"}]},{"topic":"Homosexuality","items":[{"title":"What’s wrong with being gay?","url":"https://christiananswers.net/q-aig/aig-c040.html"},{"title":"What does the Bible say about same sex marriages?","url":"https://christiananswers.net/q-eden/edn-f018.html"},{"title":"What should be the attitude of the church toward homosexuals and homosexuality?","url":"https://christiananswers.net/q-eden/edn-f019.html"}]},{"topic":"Marriage, Sexuality and Divorce","items":[{"title":"Is formalized marriage becoming obsolete?","url":"https://christiananswers.net/q-eden/edn-f002.html"},{"title":"Is marriage eternal?","url":"https://christiananswers.net/q-cc/cc-eternal-marriage.html"},{"title":"What does it mean to be “the husband of one wife?","url":"https://christiananswers.net/q-eden/edn-f008.html"},{"title":"Why did King Solomon have so many wives?","url":"https://christiananswers.net/q-eden/rfsm-solomon.html"},{"title":"Under what conditions may Christians divorce and remarry?","url":"https://christiananswers.net/q-eden/edn-f004.html"},{"title":"How can I tell if I’m getting addicted to sex or pornography?","url":"https://christiananswers.net/q-eden/edn-f016.html"},{"title":"Why should I save sex for marriage?","url":"https://christiananswers.net/q-sum/sum-f001.html"},{"title":"What are the consequences of sexual immorality?","url":"https://christiananswers.net/q-eden/edn-f007.html"}]},{"topic":"Abortion / Pro-life","items":[{"title":"What does the Bible teach about abortion?","url":"https://christiananswers.net/q-aig/aig-bibleandabortion.html"},{"title":"Thought-Provoking Quotations about Abortion","url":"https://christiananswers.net/q-sum/abortionquotes.html"}]},{"topic":"Miscellaneous","items":[{"title":"Should Christians support women’s liberation movements?","url":"https://christiananswers.net/q-eden/edn-f003.html"},{"title":"Physical healing—Is it guaranteed in Christ’s atonement?","url":"https://christiananswers.net/q-eden/rfsm-healing.html"},{"title":"HALLOWEEN—Should Christians participate?","url":"https://christiananswers.net/q-eden/halloween.html"}]}] };
  const tree = document.getElementById("tree");
  const frame = document.getElementById("iframe");
  const landing = document.getElementById("landing");
  function showFrame(u) {
    if (!u) return;
    landing.style.display = "none";
    frame.style.display = "block";
    frame.src = u;
  }
  document.getElementById("openInitial").addEventListener("click", function(){ showFrame("https://christiananswers.net/parenting/home.html"); });
  
  function renderSections(dataKey) {
    tree.innerHTML = "";
    DATA[dataKey].forEach(function(sec) {
      var det = document.createElement("details");
      det.className = "details";
      var sm = document.createElement("summary");
      sm.textContent = sec.topic;
      det.appendChild(sm);
      var ul = document.createElement("ul");
      ul.className = "lvl3";
      sec.items.forEach(function(it) {
        var li = document.createElement("li");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "linkish";
        btn.textContent = it.title;
        btn.addEventListener("click", function() { showFrame(it.url); });
        li.appendChild(btn);
        ul.appendChild(li);
      });
      det.appendChild(ul);
      tree.appendChild(det);
    });
  }
  renderSections("sections");
  var fi = document.getElementById("qnaFilter");
  if (fi) fi.addEventListener("input", function() {
    var q = (fi.value || "").toLowerCase().trim();
    tree.querySelectorAll(".details").forEach(function(det) {
      var hit = false;
      det.querySelectorAll("button.linkish").forEach(function(btn) {
        var m = !q || (btn.textContent || "").toLowerCase().indexOf(q) >= 0;
        btn.style.display = m ? "" : "none";
        if (m) hit = true;
      });
      det.style.display = hit || !q ? "" : "none";
    });
  });

})();
</script>
</body>
</html>
