<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>選單</title>
<style>
body { margin: 0; padding: 4px 8px; font-size: 10pt; font-family: Microsoft JhengHei, Arial, sans-serif; background: #e8f4fc; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.nav a { padding: 4px 10px; background: #fff; border: 1px solid #6c9; border-radius: 4px; text-decoration: none; color: #333; }
.nav a:hover, .nav a.active { background: #17a2b8; color: #fff; border-color: #17a2b8; }
</style>
</head>
<body>
<div class="nav" id="nav">
  <a href="qna_OT_五經至詩歌書.htm" target="contents">五經至詩歌書</a>
  <a href="qna_OT_先知書.htm" target="contents">先知書</a>
  <a href="qna_NT_福音書行傳.htm" target="contents">福音書行傳</a>
  <a href="qna_NT_書信啟示錄.htm" target="contents">書信啟示錄</a>
  <a href="qna_B.htm" target="contents">神學教義</a>
  <a href="qna_C.htm" target="contents">信徒教會</a>
  <a href="qna_list_auto.htm" target="contents" style="margin-left:8px;border-color:#999;">全部</a>
</div>
<script>
(function(){
  var links = document.querySelectorAll("#nav a[target=contents]");
  function setActive(href){
    var base = location.pathname.replace(/[^/]+$/, "");
    links.forEach(function(a){
      var aHref = a.getAttribute("href") || "";
      a.className = (aHref === href || (href && aHref.indexOf(href) >= 0)) ? "active" : "";
    });
  }
  try {
    var cf = window.parent.frames["contents"];
    if (cf && cf.location && cf.location.href) {
      var fn = (cf.location.href || "").split("/").pop().split("?")[0];
      setActive(fn);
    }
  } catch(e) {}
  links.forEach(function(a){
    a.onclick = function(){ setActive(a.getAttribute("href") || ""); };
  });
})();
</script>
</body>
</html>
