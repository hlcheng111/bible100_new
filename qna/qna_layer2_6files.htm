<!DOCTYPE html>

<title>6 檔選單</title>
<style>
body { margin: 0; padding: 2px 6px; font-size: 10pt; font-family: Microsoft JhengHei, Arial, sans-serif; background: #e8f4fc; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.row a { padding: 3px 8px; background: #fff; border: 1px solid #6c9; border-radius: 3px; text-decoration: none; color: #333; }
.row a:hover, .row a.on { background: #17a2b8; color: #fff; border-color: #17a2b8; }
</style>
</head>
<body>
<div class="row" id="nav">
  <a href="qna02_1.htm" target="contents">五經至詩歌書</a>
  <a href="qna02_2.htm" target="contents">先知書</a>
  <a href="qna02_3.htm" target="contents">福音書行傳</a>
  <a href="qna02_4.htm" target="contents">書信啟示錄</a>
  <a href="qna_list_auto.htm?v=7#B" target="contents">神學教義</a>
  <a href="qna_list_auto.htm?v=7#C" target="contents">信徒教會</a>
  <a href="qna_list_auto.htm?v=7" target="contents" style="margin-left:8px;border-color:#999;">全部</a>
</div>
<script>
(function(){
  var links = document.querySelectorAll("#nav a[target=contents]");
  function setActive(href){
    var fn = (href || "").split("/").pop().split("?")[0];
    var hash = (href || "").split("#")[1] || "";
    links.forEach(function(a){
      var aHref = a.getAttribute("href") || "";
      var aFn = aHref.split("/").pop().split("?")[0];
      var aHash = aHref.split("#")[1] || "";
      var match = (aFn === fn) && (hash ? (aHash === hash) : !aHash);
      a.className = match ? "on" : "";
    });
  }
  try {
    var cf = window.parent.frames["contents"];
    if (cf && cf.location && cf.location.href) {
      var href = cf.location.href || "";
      setActive(href);
    }
  } catch(e) {}
  links.forEach(function(a){
    a.onclick = function(){ setActive(a.getAttribute("href") || ""); };
  });
})();
</script>
</body>
</html>
