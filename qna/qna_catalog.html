<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聖經與神學難題 Q&A - 目錄</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f6f7fb; color: #333; font-size: 12px; height: 100vh; display: flex; flex-direction: column; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 20px 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; }
    .header a { color: rgba(255,255,255,0.95); text-decoration: none; font-size: 11px; }
    .source-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .source-chip {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      font-size: 11px;
      cursor: pointer;
      background: rgba(0,0,0,0.08);
      color: #f8f9ff;
      white-space: nowrap;
    }
    .source-chip.active {
      background: #ffcf5a;
      color: #403200;
      border-color: #ffcf5a;
      font-weight: 600;
    }
    .search-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: rgba(255,255,255,0.9);
    }
    .search-box input {
      padding: 2px 6px;
      border-radius: 999px;
      border: 0;
      font-size: 11px;
      min-width: 160px;
      outline: none;
    }
    .main { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 280px;
      background: #eef6ff;
      border-right: 1px solid #2aa5ff;
      overflow-y: auto;
      padding: 12px;
      flex-shrink: 0;
    }
    .sidebar h3 { font-size: 13px; color: #0b5fa5; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #2aa5ff; }
    .cat-section { margin-bottom: 12px; }
    .cat-title { font-weight: 600; color: #333; padding: 6px 8px; cursor: pointer; border-radius: 4px; background: rgba(42,165,255,0.1); margin-bottom: 4px; }
    .cat-title:hover { background: rgba(42,165,255,0.2); }
    .link-item { display: block; padding: 6px 8px 6px 16px; color: #333; text-decoration: none; border-radius: 4px; margin-bottom: 2px; }
    .link-item:hover { background: #fff; color: #0b5fa5; }
    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    .content-toolbar {
      padding: 8px 12px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .content-toolbar a, .content-toolbar button { padding: 6px 12px; background: #667eea; color: white; border: 0; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit; }
    .content-toolbar a:hover, .content-toolbar button:hover { background: #5a6fd8; }
    .iframe-wrap { flex: 1; min-height: 0; position: relative; }
    .iframe-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .iframe-fallback {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: rgba(0,0,0,0.04);
      border-top: 1px solid #e0e0e0;
      font-size: 11px;
    }
    .iframe-fallback a { color: #0b5fa5; }
    .placeholder { padding: 40px 20px; text-align: center; color: #888; }
    .placeholder p { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-main">
      <h1>聖經與神學難題 Q&A</h1>
      <a href="../index.html" target="_parent">← 返回主站</a>
    </div>
    <div class="source-bar" id="sourceBar">
      <!-- 動態插入：全部／各站 tab ＋ 搜尋 -->
      <div class="search-box">
        <span>搜尋題目：</span>
        <input type="text" id="searchInput" placeholder="輸入關鍵字（中英皆可）">
      </div>
    </div>
  </div>
  <div class="main">
    <aside class="sidebar" id="sidebar">
      <h3>目錄（連結+標題）</h3>
      <p style="font-size:11px; color:#666; margin-bottom:12px;">點選題目後，下方以 iframe 顯示原站內容；若無法嵌入請點「在新分頁開啟」。</p>
      <div id="catList"></div>
    </aside>
    <div class="content">
      <div class="content-toolbar" id="toolbar" style="display:none;">
        <span id="currentTitle"></span>
        <button type="button" id="copyTitle" title="複製題目到剪貼簿，可貼到 Copilot/ChatGPT 詢問">複製題目</button>
        <a href="#" id="openNewTab" target="_blank">在新分頁開啟原頁</a>
      </div>
      <div class="iframe-wrap">
        <div class="placeholder" id="placeholder">
          <p>請從左側選擇一則難題，將在此顯示原網站內容（iframe 引用）。</p>
          <p>若該站禁止嵌入，請點上方「在新分頁開啟原頁」。</p>
        </div>
        <iframe id="contentFrame" style="display:none;" title="原站內容"></iframe>
        <div class="iframe-fallback">
          <a href="#" id="openNewTabBottom" target="_blank">若無法顯示，請在新分頁開啟原頁</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUrl = "";
    let currentTitle = "";
    let allData = null;
    let currentSourceFilter = ""; // "" = 全部
    let searchQuery = "";

    function loadData() {
      const urls = ["data/links_merged.json", "data/links_sample.json"];
      function tryNext(i) {
        if (i >= urls.length) {
          document.getElementById("catList").innerHTML = "<p style='color:#c00'>無法載入資料，請執行 scripts/crawl_qna_list.py 或確認 data/ 內有 JSON。</p>";
          return;
        }
        fetch(urls[i])
          .then(r => { if (!r.ok) throw new Error(); return r.json(); })
          .then(data => {
            allData = data;
            buildSourceBar(data);
            renderSidebar();
          })
          .catch(() => tryNext(i + 1));
      }
      tryNext(0);
    }

    function buildSourceBar(data) {
      const bar = document.getElementById("sourceBar");
      // 清掉原本只含搜尋框的內容，再重新組裝
      const searchBox = document.getElementById("searchInput").parentElement;
      bar.innerHTML = "";
      const chipsWrap = document.createElement("div");
      chipsWrap.style.display = "flex";
      chipsWrap.style.flexWrap = "wrap";
      chipsWrap.style.gap = "6px";

      function makeChip(label, value) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "source-chip" + (value === currentSourceFilter ? " active" : "");
        btn.textContent = label;
        btn.addEventListener("click", () => {
          currentSourceFilter = value;
          document.querySelectorAll(".source-chip").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          renderSidebar();
        });
        return btn;
      }

      chipsWrap.appendChild(makeChip("全部來源", ""));

      const labels = data.sources && data.sources.length
        ? data.sources.map(s => s.label || s.url).filter(Boolean)
        : (data.items || []).reduce((acc, it) => {
            const k = it.source_label || it.source || "其他";
            if (!acc.includes(k)) acc.push(k);
            return acc;
          }, []);

      labels.forEach(label => {
        chipsWrap.appendChild(makeChip(label, label));
      });

      bar.appendChild(chipsWrap);
      bar.appendChild(searchBox);
    }

    function renderSidebar() {
      if (!allData) return;
      const data = allData;
      const container = document.getElementById("catList");
      container.innerHTML = "";

      const q = (searchQuery || "").trim().toLowerCase();

      if (data.categories && data.categories.length) {
        data.categories.forEach(cat => {
          const items = (cat.items || []).filter(it => {
            if (currentSourceFilter && it.source_label !== currentSourceFilter) return false;
            if (!q) return true;
            return (it.title || "").toLowerCase().includes(q);
          });
          if (!items.length) return;
          const section = document.createElement("div");
          section.className = "cat-section";
          section.innerHTML = "<div class='cat-title'>" + (cat.name_zh || cat.name_en || cat.id) + "</div>";
          const list = document.createElement("div");
          items.forEach(it => {
            const a = document.createElement("a");
            a.className = "link-item";
            a.href = "#";
            a.textContent = it.title;
            a.dataset.url = it.url;
            a.addEventListener("click", e => { e.preventDefault(); openItem(it.url, it.title); });
            list.appendChild(a);
          });
          section.appendChild(list);
          container.appendChild(section);
        });
      } else if (data.items && data.items.length) {
        const filtered = data.items.filter(it => {
          if (currentSourceFilter && (it.source_label || it.source || "其他") !== currentSourceFilter) return false;
          if (!q) return true;
          return (it.title || "").toLowerCase().includes(q);
        });
        const bySource = {};
        filtered.forEach(it => {
          const key = it.source_label || it.source || "其他";
          if (!bySource[key]) bySource[key] = [];
          bySource[key].push(it);
        });
        const order = data.sources && data.sources.length
          ? data.sources.map(s => s.label || s.url).filter(Boolean)
          : Object.keys(bySource);
        const seen = new Set();
        order.forEach(label => {
          if (!label || !bySource[label] || !bySource[label].length) return;
          seen.add(label);
          const section = document.createElement("div");
          section.className = "cat-section";
          section.innerHTML = "<div class='cat-title'>" + (label || "連結列表") + "</div>";
          bySource[label].forEach(it => {
            const a = document.createElement("a");
            a.className = "link-item";
            a.href = "#";
            a.textContent = it.title;
            a.dataset.url = it.url;
            a.addEventListener("click", e => { e.preventDefault(); openItem(it.url, it.title); });
            section.appendChild(a);
          });
          container.appendChild(section);
        });
        Object.keys(bySource).filter(k => !seen.has(k)).forEach(label => {
          const section = document.createElement("div");
          section.className = "cat-section";
          section.innerHTML = "<div class='cat-title'>" + label + "</div>";
          bySource[label].forEach(it => {
            const a = document.createElement("a");
            a.className = "link-item";
            a.href = "#";
            a.textContent = it.title;
            a.dataset.url = it.url;
            a.addEventListener("click", e => { e.preventDefault(); openItem(it.url, it.title); });
            section.appendChild(a);
          });
          container.appendChild(section);
        });
      }
    }

    function openItem(url, title) {
      currentUrl = url;
      currentTitle = title || "";
      document.getElementById("placeholder").style.display = "none";
      const frame = document.getElementById("contentFrame");
      frame.style.display = "block";
      frame.src = url;
      document.getElementById("currentTitle").textContent = currentTitle;
      const openA = document.getElementById("openNewTab");
      const openB = document.getElementById("openNewTabBottom");
      openA.href = url;
      openB.href = url;
      document.getElementById("toolbar").style.display = "flex";
    }

    document.getElementById("copyTitle").addEventListener("click", function() {
      if (!currentTitle) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentTitle).then(function() {
          var btn = document.getElementById("copyTitle");
          var orig = btn.textContent;
          btn.textContent = "已複製";
          setTimeout(function() { btn.textContent = orig; }, 1500);
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = currentTitle;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        var btn = document.getElementById("copyTitle");
        var orig = btn.textContent;
        btn.textContent = "已複製";
        setTimeout(function() { btn.textContent = orig; }, 1500);
      }
    });

    document.getElementById("searchInput").addEventListener("input", function(e) {
      searchQuery = e.target.value || "";
      renderSidebar();
    });

    loadData();
  </script>
  <div id="global-tools-root"></div>
  <script src="../js/global-tools.js"></script>
</body>
</html>
