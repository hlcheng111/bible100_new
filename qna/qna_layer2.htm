<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>來源選單</title>
<style>
body { margin: 0; padding: 2px 6px; font-size: 10pt; font-family: Microsoft JhengHei, Arial, sans-serif; background: #e8f4fc; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.row a { padding: 3px 8px; background: #fff; border: 1px solid #6c9; border-radius: 3px; text-decoration: none; color: #333; }
.row a:hover, .row a.on { background: #17a2b8; color: #fff; border-color: #17a2b8; }
</style>
</head>
<body>
<div class="row">
  <span id="srcNav"></span>
  <span id="langNav" style="margin-left:12px;font-size:9pt;color:#666;"></span>
</div>
<script src="qna_nav_config.js"></script>
<script>
(function(){
  var cfg = window.QNA_NAV_CONFIG || { sources: [] };
  var cat = (location.search.match(/[?&]cat=([^&]+)/) || [])[1] || "A";
  var src = (location.search.match(/[?&]src=([^&]+)/) || [])[1] || "all";

  var catSet = {};
  ["A","A_OT","A_NT"].indexOf(cat) >= 0 ? ["A","A_OT","A_NT"].forEach(function(c){ catSet[c]=1; }) : (catSet[cat]=1);

  var srcList = cfg.sources.filter(function(s){ return catSet[s.category]; });
  if (!srcList.length) srcList = cfg.sources;
  if (srcList.length && !srcList.some(function(s){ return s.id === src; })) {
    var allId = "all";
    if (cat === "B") allId = "all_B";
    else if (cat === "C") allId = "all_C";
    src = srcList.some(function(s){ return s.id === allId; }) ? allId : srcList[0].id;
  }

  var nav = document.getElementById("srcNav");
  srcList.forEach(function(s){
    var a = document.createElement("a");
    a.href = "#";
    a.textContent = s.label;
    if (s.id === src) a.className = "on";
    a.onclick = function(e){
      e.preventDefault();
      try {
        var f = window.parent.frames;
        if (s.sidebar && f["contents"]) f["contents"].location = s.sidebar + "?v=6";
        var landingMap = {"A":"qna_landing_A.htm","A_OT":"qna_landing_A_OT.htm","A_NT":"qna_landing_A_NT.htm","B":"qna_landing_B.htm","C":"qna_landing_C.htm"};
        if (s.landing && s.landing !== "about:blank" && f["main"]) {
          f["main"].location = s.landing;
        } else if (f["main"] && landingMap[cat]) {
          f["main"].location = landingMap[cat];
        }
      } catch(err) {
        console.error("Source click error:", err);
      }
      var links = nav.querySelectorAll("a");
      for (var i=0; i<links.length; i++) links[i].className = links[i]===a ? "on" : "";
      window._layer2_init_done = false;
      window.location.replace("qna_layer2.htm?cat=" + cat + "&src=" + s.id);
      return false;
    };
    nav.appendChild(a);
  });

  var cur = cfg.sources.filter(function(s){ return s.id === src; })[0];
  var langNav = document.getElementById("langNav");
  if (cur && cur.lang && cur.lang.length > 1) {
    cur.lang.forEach(function(l){
      var a = document.createElement("a");
      var u = (l === "zh" && cur.zh_url) ? cur.zh_url : cur.landing;
      a.href = u;
      a.textContent = l === "zh" ? "中" : "EN";
      a.target = "main";
      a.title = (l === "zh" ? "中文" : "English") + " landing";
      a.style.marginRight = "6px";
      langNav.appendChild(a);
    });
  }

  if (window.parent && window.parent.frames && !window._layer2_init_done) {
    window._layer2_init_done = true;
    try {
      var f = window.parent.frames;
      var landingMap = {"A":"qna_landing_A.htm","A_OT":"qna_landing_A_OT.htm","A_NT":"qna_landing_A_NT.htm","B":"qna_landing_B.htm","C":"qna_landing_C.htm"};
      if (cur && (cur.id === "all" || cur.id === "all_B" || cur.id === "all_C")) {
        if (f["main"] && landingMap[cat]) f["main"].location = landingMap[cat];
        if (f["contents"]) f["contents"].location = "qna_list_auto.htm?v=6";
      } else if (cur && cur.id !== "all" && cur.id !== "all_B" && cur.id !== "all_C") {
        if (cur.sidebar && f["contents"]) f["contents"].location = cur.sidebar + "?v=6";
        if (cur.landing && cur.landing !== "about:blank" && f["main"]) {
          f["main"].location = cur.landing;
        } else if (f["main"] && landingMap[cat]) {
          f["main"].location = landingMap[cat];
        }
      } else {
        if (f["main"] && landingMap[cat]) f["main"].location = landingMap[cat];
        if (f["contents"]) f["contents"].location = "qna_list_auto.htm?v=6";
      }
    } catch(e) {
      console.error("Layer2 init error:", e);
      window._layer2_init_done = false;
    }
  }
})();
</script>
</body>
</html>
