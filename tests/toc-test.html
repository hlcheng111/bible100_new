<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TOC 自動測試頁</title>
  <link rel="stylesheet" href="../js/toc-styles.css">
</head>
<body>
  <h1>測試標題一</h1>
  <p>第一段內容。</p>
  <h2>測試標題二</h2>
  <p>第二段內容。</p>
  <h3>測試標題三</h3>
  <p>第三段內容。</p>
  <h2>另一個 h2</h2>
  <p>更多內容。</p>

  <script src="../js/toc-generator.js"></script>
  <script>
    // 自動測試：檢查小目錄是否被插入且包含連結
    window.addEventListener('load', function () {
      var wrap = document.querySelector('.mini-toc-wrap');
      var items = document.querySelectorAll('.toc-item');
      var ok = wrap && items.length >= 4;
      document.body.appendChild(document.createElement('div')).id = 'toc-test-result';
      document.getElementById('toc-test-result').innerHTML = ok
        ? '<p style="color:green;font-weight:bold;">TOC 測試通過：小目錄已生成，' + items.length + ' 個標題連結。</p>'
        : '<p style="color:red;">TOC 測試失敗：未找到 .mini-toc-wrap 或 .toc-item。</p>';
    });
  </script>
</body>
</html>
