<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Global tools 自動測試</title>
</head>
<body>
  <div id="global-tools-root"></div>
  <script src="../js/global-tools.js"></script>
  <script>
    window.addEventListener('load', function () {
      var bar = document.querySelector('.global-tools-bar');
      var translate = document.querySelector('[data-action="translate"]');
      var sendai = document.querySelector('[data-action="sendai"]');
      var save = document.querySelector('[data-action="save"]');
      var ok = bar && translate && sendai && save;
      var el = document.createElement('div');
      el.id = 'global-tools-test-result';
      el.style.cssText = 'margin:20px;padding:12px;border:2px solid ' + (ok ? '#0a0' : '#c00') + ';border-radius:8px;font-family:sans-serif;';
      el.innerHTML = ok
        ? '<strong style="color:#0a0">Global tools 測試通過：工具列與按鈕已載入。</strong>'
        : '<strong style="color:#c00">Global tools 測試失敗：未找到工具列或按鈕。</strong>';
      document.body.insertBefore(el, document.body.firstChild);
    });
  </script>
</body>
</html>
