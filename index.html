    loc = loc || getUiLocale();

    return window.B100ChromeI18n.t(pack, key, loc) || '';

  function hubPick(row, loc) {
    loc = loc || getUiLocale();
    if (!row) return '';
    if (typeof row === 'string') return row;
    if (row[loc]) return row[loc];
    if ((loc === 'vi' || loc === 'id') && row.en) return row.en;
    return row['zh-Hant'] || row.zh || row.en || '';

  function applyHubChromeI18n() {
    var loc = getUiLocale();
    var pack = window.HubChromeI18nPack;

    applyHubChromeI18n();

    var loc = getUiLocale();

    if (modeConfig.contextSubtitle) {

        en: (loc === 'zh-Hant' || loc === 'en') ? (modeConfig.contextSubtitle.en || enPack || '') : (enPack || modeConfig.contextSubtitle.en || '')
      };

  function appendStackLabel(parent, subtitle, href) {
    var lbl = document.createElement(href ? 'a' : 'span');
    lbl.className = 'lbl lbl-stack' + (href ? ' lbl-stack--link' : '');
    if (href) {
      lbl.href = href;

    }
    lbl.innerHTML = '<span class="lbl-zh">' + (subtitle.zh || '') + '</span>' +
      (subtitle.en ? '<span class="lbl-en">' + subtitle.en + '</span>' : '');
    parent.appendChild(lbl);

  function parseNavItemLabels(item) {
    if (!item) return { zh: '', en: '' };
    if (item.labelZh || item.labelEn) {
      return { zh: item.labelZh || '', en: item.labelEn || '' };
    }
    var parts = String(item.label || '').split(/\s+/);
    if (parts.length <= 1) return { zh: item.label || '', en: '' };
    var enIdx = -1;
    for (var i = 1; i < parts.length; i++) {
      if (/^[A-Za-z]/.test(parts[i])) { enIdx = i; break; }
    }
    if (enIdx < 0) return { zh: item.label, en: '' };
    return { zh: parts.slice(0, enIdx).join(' '), en: parts.slice(enIdx).join(' ') };
  }

   */
  function openAITools() {
    clearHymnEmbedLayout();
    var fm = window.frameManager || new MainFrameManager();
    fm.showLoading('載入 AI 工具…');
    var sf = document.getElementById('sidebarFrame');
    var cf = document.getElementById('contentFrame');
    var bust = Date.now();
    var finished = false;
    var failTimer = null;

    function hideIfNeeded() {
      try {
        fm.hideLoading();
      } catch (e) {}
    }

    function applyClassicAiToolsSidebar() {
      if (finished) return;
      finished = true;
      if (failTimer) {
        clearTimeout(failTimer);
        failTimer = null;
      }
      try {
        sf.src = 'ai_tools/sidebar.html?v=' + Date.now();
        cf.src = 'ai_tools/dashboard.html?v=' + Date.now();
      } catch (e) {}
      hideIfNeeded();
    }

    function tryConfirmNewSidebar() {
      if (finished) return;
      function check() {
        try {
          var doc = sf.contentDocument;
          if (doc && doc.getElementById('sb-zone-guide')) {
            finished = true;
            if (failTimer) {
              clearTimeout(failTimer);
              failTimer = null;
            }
            hideIfNeeded();
            return true;
          }
        } catch (e) {}
        return false;
      }
      if (check()) return;
      try {
        requestAnimationFrame(function () {
          if (finished) return;
          if (check()) return;
          applyClassicAiToolsSidebar();
        });
      } catch (eRaf) {
        applyClassicAiToolsSidebar();
      }
    }

    function onSidebarAttemptLoad() {
      if (finished) return;
      tryConfirmNewSidebar();
    }

    failTimer = setTimeout(function () {
      if (!finished) applyClassicAiToolsSidebar();
    }, 4500);

    sf.addEventListener('load', onSidebarAttemptLoad, { once: true });

    cf.src = 'ai_tools/dashboard.html?v=' + bust;
    sf.src = 'ai_tools/sidebar_lab.html?v=' + bust;
  }

  var langMinorCodes = { vi: 1, id: 1, my: 1, kh: 1, lo: 1 };

  function createLangButton(code) {
    var meta = langButtonLabels[code] || { zh: code.toUpperCase(), en: '' };
    var info = window.Bible100Shell && typeof window.Bible100Shell.getLanguageByCode === 'function'
      ? window.Bible100Shell.getLanguageByCode(code)
      : null;
    var href = (info && info.landing) ? info.landing : '#';
    var btn = document.createElement('a');
    btn.href = href;
    btn.className = 'lang-btn' + (langMinorCodes[code] ? ' lang-btn-minor' : '');
    btn.setAttribute('data-lang', code);
    btn.title = href;
    var zh = document.createElement('span');
    zh.className = 't-zh';
    zh.textContent = meta.zh;
    btn.appendChild(zh);
    if (meta.en) {
      var en = document.createElement('span');
      en.className = 't-en';
      en.textContent = meta.en;
      btn.appendChild(en);
    }
    btn.addEventListener('click', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
      ev.preventDefault();
      switchLanguage(code);
    });
    return btn;
  }

    grid.className = 'lang-btn-grid';
    var rows = item.rows || [['cn', 'en', 'ch', 'ad'], ['vi', 'id', 'my', 'kh', 'lo']];
    rows.forEach(function (codes) {

  class MainFrameManager {
    constructor() { this.init(); }
    init() {
      this.setupMessageListener();
      this.setupFrameLoadHandlers();
    }
    setupMessageListener() {
      var self = this;
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'bible100-sidebar-content-nav' && event.data.url) {
          var cfx = document.getElementById('contentFrame');
          var navUrl = event.data.url;
          if (typeof window.bible100ResolveHubContentUrl === 'function') {
            navUrl = window.bible100ResolveHubContentUrl(navUrl);
          }
          if (cfx) cfx.src = navUrl;
          return;
        }
        if (event.data && event.data.type === 'bible100-ai-tools-reset') {
          if (typeof openAITools === 'function') openAITools();
          return;
        }
        if (event.data && event.data.type === 'navigate') {
          self.navigateContentFrame(event.data.url);
          return;
        }
        if (event.data && event.data.type === 'bible100-shell') {
          var sb = event.data.sidebarUrl || '';
          var cf = event.data.contentUrl || '';
          if (typeof window.bible100ResolveHubContentUrl === 'function' && cf) {
            cf = window.bible100ResolveHubContentUrl(cf);
          }
          var bust = 'v=' + Date.now();
          self.showLoading('切換模組…');
          var hymnInSidebar = sb.indexOf('hymn_management/') !== -1;
          var hymnInContent = cf.indexOf('hymn_management/') !== -1;
          function hymnSelfShellUrl(url) {
            return /hymn_management\/index\.html/i.test(url) ||
              /hymn_management\/hymn\/hymn_main_index\.html/i.test(url);
          }
          if (hymnInSidebar || hymnInContent) {
            var embedUrl = cf || sb;
            if (hymnSelfShellUrl(embedUrl)) {
              document.body.classList.add('mode-hymn-embed');
              document.body.classList.remove('mode-module-shell-embed', 'mode-qna');
              document.getElementById('sidebarFrame').src = 'about:blank';
              document.getElementById('contentFrame').src = embedUrl + (embedUrl.indexOf('?') >= 0 ? '&' : '?') + bust;
              syncQnaShellLayout('');
              return;
            }
            document.body.classList.remove('mode-hymn-embed');
            document.body.classList.remove('mode-module-shell-embed');
            if (sb) {
              document.getElementById('sidebarFrame').src = sb + (sb.indexOf('?') >= 0 ? '&' : '?') + bust;
            }
            if (cf) {
              document.getElementById('contentFrame').src = cf + (cf.indexOf('?') >= 0 ? '&' : '?') + bust;
            }
            syncQnaShellLayout(cf);
            if (!sb && !cf) self.hideLoading();
            return;
          }
          document.body.classList.remove('mode-hymn-embed');
          document.body.classList.remove('mode-module-shell-embed');
          if (sb) {
            var su = sb + (sb.indexOf('?') >= 0 ? '&' : '?') + bust;
            document.getElementById('sidebarFrame').src = su;
          }
          if (cf) {
            var cu = cf + (cf.indexOf('?') >= 0 ? '&' : '?') + bust;
            document.getElementById('contentFrame').src = cu;
          }
          syncQnaShellLayout(cf);
          if (!sb && !cf) self.hideLoading();
        }
      });
    }
    setupFrameLoadHandlers() {
      var self = this;
      var sidebarFrame = document.getElementById('sidebarFrame');
      var contentFrame = document.getElementById('contentFrame');
      function onFrameLoad() {
        if (self._loadTimeout) { clearTimeout(self._loadTimeout); self._loadTimeout = null; }
        self.hideLoading();
      }
      sidebarFrame.onload = function () { onFrameLoad(); };
      sidebarFrame.onerror = function () { self.showError('側邊欄載入失敗。'); };
      contentFrame.onload = function () { onFrameLoad(); };
      contentFrame.onerror = function () { self.showError('內容頁載入失敗。'); };
      this._loadTimeout = setTimeout(function () {
        var overlay = document.getElementById('loadingOverlay');
        if (overlay && overlay.classList.contains('active')) self.hideLoading();
      }, 2500);
    }
    navigateContentFrame(url) {
      this.showLoading('載入頁面…');
      var u = String(url || '').replace(/\\/g, '/');
      if (typeof window.bible100ResolveHubContentUrl === 'function') {
        u = window.bible100ResolveHubContentUrl(u);
      } else if (window.CmZoneNavSsot && window.CmZoneNavSsot.sanitizeContentUrl) {
        u = window.CmZoneNavSsot.sanitizeContentUrl(u, 'church_ministry/_landing/gateway.html');
      }
      if (window.B100ModuleNavSsot && window.B100ModuleNavSsot.sanitizeContentUrl) {
        u = window.B100ModuleNavSsot.sanitizeContentUrl(u, u || 'help/site_home.html');
      }
      /* 修復 _landing/church_ministry/… 幽靈路徑（相對 href 從 landing 頁解析錯位） */
      u = u.replace(/\/_landing\/church_ministry\//gi, '/church_ministry/');
      if (/^https?:\/\//i.test(u) || /^file:/i.test(u)) {
        var rootMatch = u.match(/\/bible100_new\/([^?#]+)/i);
        if (rootMatch) {
          u = rootMatch[1];
        } else {
          var cmMatch = u.match(/\/(church_ministry\/[^?#]+)/i);
          if (cmMatch && u.indexOf('/_landing/church_ministry/') >= 0) {
            u = cmMatch[1];
          }
        }
      }
      if (typeof window.bible100ResolveIframeSrc === 'function') {
        try {
          u = window.bible100ResolveIframeSrc(u, window);
        } catch (eRes) {}
      }
      var bust = 'v=' + Date.now();
      document.getElementById('contentFrame').src = u + (u.indexOf('?') >= 0 ? '&' : '?') + bust;
    }
    showLoading(text) {
      var overlay = document.getElementById('loadingOverlay');
      var textEl = document.getElementById('loadingText');
      if (overlay) {
        if (text && textEl) textEl.textContent = text;
        overlay.classList.add('active');
      }
    }
    hideLoading() {
      var overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.classList.remove('active');
    }
    showError(message) {
      var errorEl = document.getElementById('errorMessage');
      var textEl = document.getElementById('errorText');
      if (errorEl) {
        if (message && textEl) textEl.textContent = message;
        errorEl.classList.add('active');
        this.hideLoading();
      }
    }
  }

  function initPage() {
    if (window.B100ShellContract && typeof window.B100ShellContract.validate === 'function') {
      window.B100ShellContract.validate('index_v5.html');
    }
    if (window.location.protocol === 'file:') {
      var syncBtn = document.getElementById('btnSyncObserver');
      if (syncBtn) syncBtn.style.display = 'none';
    }
    if (window.location.search.indexOf('survey_banner=1') >= 0) {
      document.body.classList.add('show-survey-banner');
    }
    syncTopOffset();
    applyHubChromeI18n();
    if (document.body && window.BIBLE100_BUILD_VERSION) {
      document.body.setAttribute('data-b100-build', window.BIBLE100_BUILD_VERSION);
    }
    window.frameManager = new MainFrameManager();
    /* 開站＝教材與培訓（百步四寶 landing）；全站 L0 日後另做 */
    applyMode('material');

    if (window.Bible100Shell && typeof window.Bible100Shell.loadConfig === 'function') {
      window.Bible100Shell.loadConfig().then(function () {
        renderModeButtonsFromConfig();
        applyHubChromeI18n();
        if (selectedMode) renderContextBar();
        applyBootQueryParams();
      }).catch(function () {
        applyMode('material');
        applyBootQueryParams();
      });
    } else {
      applyBootQueryParams();
    }
    var brandBtn = document.getElementById('brandHomeBtn');
    if (brandBtn) {
      brandBtn.style.cursor = 'pointer';
      brandBtn.setAttribute('title', DEFAULT_CONTENT);
      brandBtn.addEventListener('click', function () { applyMode('material'); });
      brandBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          applyMode('material');
        }
      });
    }
    var btnToolsTop = document.getElementById('btnToolsOverviewTop');
    if (btnToolsTop) {
      btnToolsTop.addEventListener('click', function () { openToolsOverview(); });
    }
    var btnSiteHomeTop = document.getElementById('btnSiteHomeTop');
    if (btnSiteHomeTop) {
      btnSiteHomeTop.addEventListener('click', function (ev) {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
        ev.preventDefault();
        applyMode('material');
      });
    }
    var btnMultilangTop = document.getElementById('btnMultilangReaderTop');
    if (btnMultilangTop) {
      btnMultilangTop.addEventListener('click', function (ev) {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
        ev.preventDefault();
        openMultilangReader();
      });
    }
    var btnCrmAuto = document.getElementById('btnCrmAutomationTop');
    if (btnCrmAuto) {
      btnCrmAuto.addEventListener('click', function () { openCrmAutomationConsole(); });
    }
    window.addEventListener('resize', syncTopOffset);
    if (window.ResizeObserver && document.getElementById('topWrap')) {
      try {
        var ro = new ResizeObserver(function () { syncTopOffset(); });
        ro.observe(document.getElementById('topWrap'));
      } catch (eRo) {}
    }
    requestAnimationFrame(syncTopOffset);
    if (window.B100SSOTBridge && typeof window.B100SSOTBridge.wireIndexV5Shell === 'function') {
      window.B100SSOTBridge.wireIndexV5Shell();
    }
    if (window.SyncObserverDrawer && typeof window.SyncObserverDrawer.init === 'function') {
      window.SyncObserverDrawer.init();
    }
    try {
      var syncParams = new URLSearchParams(window.location.search || '');
      if (syncParams.get('show_sync') === '1' || localStorage.getItem('b100_show_sync') === '1') {
        document.body.classList.add('b100-show-sync');
      }
    } catch (eSyncShow) {}

    (function initMobileSidebar() {
      var btn = document.getElementById('btnSidebarToggle');
      var bd = document.getElementById('sidebarBackdrop');
      var mq = window.matchMedia('(max-width: 767px)');
      function closeSidebarMobile() {
        document.body.classList.remove('sidebar-mobile-open');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        if (bd) bd.setAttribute('aria-hidden', 'true');
      }
      function openSidebarMobile() {
        document.body.classList.add('sidebar-mobile-open');
        if (btn) btn.setAttribute('aria-expanded', 'true');
        if (bd) bd.setAttribute('aria-hidden', 'false');
      }
      function toggleSidebarMobile() {
        if (document.body.classList.contains('sidebar-mobile-open')) {
          closeSidebarMobile();
        } else {
          openSidebarMobile();
        }
      }
      if (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          toggleSidebarMobile();
        });
      }
      if (bd) {
        bd.addEventListener('click', function () {
          closeSidebarMobile();
        });
      }
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeSidebarMobile();
      });
      window.addEventListener('resize', function () {
        if (!mq.matches) closeSidebarMobile();
      });
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
  } else {
    initPage();
  }
})();
  </script>
