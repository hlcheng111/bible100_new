name: Church Planning Live Tools Smoke

on:
  push:
    branches: [main, master]
    paths:
      - "church_planning/**"
      - "church_ministry/guide_crm_journey_hub.html"
      - "church_ministry/js/crm_journey_common.js"
      - "church_ministry/css/crm_journey_brand.css"
      - "tests/test_all_live_tools_smoke.py"
      - "tests/test_strategic_chain_integrity.py"
      - "tests/test_assessment_4tab_shell.py"
      - "tests/test_church_nav_ui_contract.py"
      - "tests/test_*pack*.py"
      - "tests/test_gift_packs_smoke.py"
      - "tests/test_matchmaker_core.py"
      - "tests/test_swot_matrix.py"
      - "tests/run-all-tests.ps1"
      - "tests/_list.txt"
      - "church_planning/js/governance_crm_bridge.js"
      - ".github/workflows/church-planning-smoke.yml"
  pull_request:
    paths:
      - "church_planning/**"
      - "church_ministry/guide_crm_journey_hub.html"
      - "church_ministry/js/crm_journey_common.js"
      - "church_ministry/css/crm_journey_brand.css"
      - "tests/test_all_live_tools_smoke.py"
      - "tests/test_strategic_chain_integrity.py"
      - "tests/test_assessment_4tab_shell.py"
      - "tests/test_church_nav_ui_contract.py"
      - "tests/test_*pack*.py"
      - "tests/test_gift_packs_smoke.py"
      - "tests/test_matchmaker_core.py"
      - "tests/test_swot_matrix.py"
      - "tests/run-all-tests.ps1"
      - "tests/_list.txt"
      - "church_planning/js/governance_crm_bridge.js"
      - ".github/workflows/church-planning-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 18 live tools smoke (one command green/red)
        run: python tests/test_all_live_tools_smoke.py
