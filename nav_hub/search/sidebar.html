<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局搜索侧边栏</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #eef6ff;
            color: #333;
            font-size: 10px;
            margin: 0;
            padding: 0;
        }
        
        .sidebar-header {
            background: #2aa5ff;
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #0b5fa5;
        }
        
        .sidebar-header h2 {
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 9px;
            opacity: 0.9;
        }
        
        .nav-section {
            margin: 15px 0;
        }
        
        .nav-section h3 {
            color: #0b5fa5;
            font-size: 10px;
            margin: 0 15px 10px 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #b3d9ff;
            cursor: pointer;
        }
        
        .nav-section h3:hover {
            background: #d1ecff;
        }
        
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
        }
        
        .nav-menu.expanded {
            display: block;
        }
        
        .nav-item {
            margin: 0;
        }
        
        .nav-link {
            display: block;
            padding: 8px 15px;
            color: #333;
            text-decoration: none;
            font-size: 9px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        
        .nav-link:hover {
            background: #d1ecff;
            color: #0b5fa5;
            border-left-color: #0b5fa5;
        }
        
        .nav-link.active {
            background: #b3d9ff;
            color: #0b5fa5;
            border-left-color: #0b5fa5;
            font-weight: 600;
        }
        
        .nav-link .icon {
            margin-right: 8px;
            width: 16px;
            display: inline-block;
        }
        
        .expand-icon {
            float: right;
            transition: transform 0.3s ease;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 250px;
            background: #eef6ff;
            padding: 8px 15px;
            border-top: 1px solid #b3d9ff;
            font-size: 8px;
            color: #666;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .footer {
                width: 200px;
            }
        }
    </style>
    <link rel="stylesheet" href="../../css/sidebar_shared.css">
</head>
<body>
    <div class="sidebar-header">
        <h2>🔍 全局搜索</h2>
        <p>智能搜索平台</p>
    </div>
    
    <nav class="nav-section">
        <h3 onclick="toggleMenu('search-tools')">
            🎯 <a href="dashboard.html" target="_blank">搜索工具</a>
            <span class="expand-icon">▶</span>
        </h3>
        <ul id="search-tools" class="nav-menu">
            <li class="nav-item">
                <a href="../../bible_study/search_reader.html?v=2" target="contentFrame" class="nav-link">
                    <span class="icon">📖</span>圣经搜索
                </a>
            </li>
            <li class="nav-item">
                <a href="../../qna/qna_landing.htm" target="contentFrame" class="nav-link">
                    <span class="icon">📚</span>内容搜索
                </a>
            </li>
            <li class="nav-item">
                <a href="../index.html" target="contentFrame" class="nav-link">
                    <span class="icon">🔍</span>高级搜索
                </a>
            </li>
        </ul>
    </nav>
    
    <nav class="nav-section">
        <h3 onclick="toggleMenu('search-categories')">
            📂 <a href="../index.html" target="_blank">搜索分类</a>
            <span class="expand-icon">▶</span>
        </h3>
        <ul id="search-categories" class="nav-menu">
            <li class="nav-item">
                <a href="../../bible_study/index.html" target="contentFrame" class="nav-link">
                    <span class="icon">📖</span>圣经阅读
                </a>
            </li>
            <li class="nav-item">
                <a href="../../bible_study/index.html" target="contentFrame" class="nav-link">
                    <span class="icon">📚</span>圣经研读
                </a>
            </li>
            <li class="nav-item">
                <a href="../../school_management/index.html" target="contentFrame" class="nav-link">
                    <span class="icon">🏫</span>学校管理
                </a>
            </li>
            <li class="nav-item">
                <a href="../../church_ministry/index.html" target="contentFrame" class="nav-link">
                    <span class="icon">⛪</span>教会事工
                </a>
            </li>
            <li class="nav-item">
                <a href="../../ai_tools/index.html" target="contentFrame" class="nav-link">
                    <span class="icon">🤖</span>AI工具
                </a>
            </li>
        </ul>
    </nav>
    
    <nav class="nav-section">
        <h3 onclick="toggleMenu('search-history')">
            📊 <a href="dashboard.html" target="_blank">搜索历史</a>
            <span class="expand-icon">▶</span>
        </h3>
        <ul id="search-history" class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" target="contentFrame" class="nav-link">
                    <span class="icon">⏰</span>最近搜索
                </a>
            </li>
            <li class="nav-item">
                <a href="dashboard.html" target="contentFrame" class="nav-link">
                    <span class="icon">💾</span>保存的搜索
                </a>
            </li>
            <li class="nav-item">
                <a href="dashboard.html" target="contentFrame" class="nav-link">
                    <span class="icon">🔥</span>热门搜索
                </a>
            </li>
        </ul>
    </nav>
    
    <div class="footer">
        <p>全局搜索系统 v1.0</p>
        <p>© 2024 Bible Learning Platform</p>
    </div>
    
    <script>
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const icon = menu.previousElementSibling.querySelector('.expand-icon');
            
            if (menu.classList.contains('expanded')) {
                menu.classList.remove('expanded');
                icon.textContent = '▶';
            } else {
                menu.classList.add('expanded');
                icon.textContent = '▼';
            }
        }
        
        // 页面载入完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('全局搜索侧边栏载入完成');
            // 默认展开搜索工具
            toggleMenu('search-tools');
        });
    </script>
    <script src="../../js/sidebar_behavior.js"></script>
</body>
</html>
