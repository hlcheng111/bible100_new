<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局搜索 - 仪表板</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: #2aa5ff;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .search-input:focus {
            border-color: #2aa5ff;
            outline: none;
        }
        
        .search-buttons {
            display: flex;
            gap: 10px;
        }
        
        .search-btn {
            padding: 10px 20px;
            background: #2aa5ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #1e8bcc;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .feature-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .feature-card h3 {
            color: #0b5fa5;
            font-size: 16px;
            margin: 0 0 10px 0;
        }
        
        .feature-card p {
            font-size: 12px;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }
        
        .feature-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .feature-link {
            padding: 6px 12px;
            background: #eef6ff;
            color: #0b5fa5;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            transition: background 0.3s;
        }
        
        .feature-link:hover {
            background: #d1ecff;
        }
        
        .stats-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #2aa5ff;
            display: block;
        }
        
        .stat-label {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 全局搜索系统</h1>
        <p>智能搜索平台 - 快速找到您需要的圣经内容和学习资源</p>
    </div>
    
    <div class="search-box">
        <input type="text" class="search-input" placeholder="输入关键词搜索圣经、注释、课程内容...">
        <div class="search-buttons">
            <button class="search-btn">🔍 搜索</button>
            <button class="search-btn">📖 圣经搜索</button>
            <button class="search-btn">📚 内容搜索</button>
            <button class="search-btn">🔍 高级搜索</button>
        </div>
    </div>
    
    <div class="features-grid">
        <div class="feature-card">
            <h3>📖 圣经搜索</h3>
            <p>快速搜索圣经经文、章节和关键词，支持多种圣经版本对照。</p>
            <div class="feature-links">
                <a href="../../bible_study/search_reader.html?v=2" class="feature-link">经文搜索</a>
                <a href="../../bible_study/search_reader.html?v=2" class="feature-link">章节浏览</a>
                <a href="../../bible_study/search_reader.html?v=2" class="feature-link">版本对照</a>
            </div>
        </div>
        
        <div class="feature-card">
            <h3>📚 内容搜索</h3>
            <p>搜索课程内容、注释书、词典等学习资源，快速定位所需材料。</p>
            <div class="feature-links">
                <a href="../../qna/qna_landing.htm" class="feature-link">课程搜索</a>
                <a href="../../qna/qna_landing.htm" class="feature-link">注释搜索</a>
                <a href="../../qna/qna_landing.htm" class="feature-link">词典查询</a>
            </div>
        </div>
        
        <div class="feature-card">
            <h3>🔍 高级搜索</h3>
            <p>使用高级搜索功能，通过多个条件组合精确查找内容。</p>
            <div class="feature-links">
                <a href="../index.html" class="feature-link">条件搜索</a>
                <a href="../index.html" class="feature-link">时间筛选</a>
                <a href="../index.html" class="feature-link">类型筛选</a>
            </div>
        </div>
        
        <div class="feature-card">
            <h3>📊 搜索历史</h3>
            <p>查看和管理您的搜索历史，保存常用搜索，发现热门内容。</p>
            <div class="feature-links">
                <a href="dashboard.html" class="feature-link">最近搜索</a>
                <a href="dashboard.html" class="feature-link">保存搜索</a>
                <a href="dashboard.html" class="feature-link">热门搜索</a>
            </div>
        </div>
    </div>
    
    <div class="stats-section">
        <h3>📈 搜索统计</h3>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-number">1,247</span>
                <div class="stat-label">今日搜索</div>
            </div>
            <div class="stat-item">
                <span class="stat-number">66</span>
                <div class="stat-label">圣经书卷</div>
            </div>
            <div class="stat-item">
                <span class="stat-number">1,189</span>
                <div class="stat-label">课程章节</div>
            </div>
            <div class="stat-item">
                <span class="stat-number">342</span>
                <div class="stat-label">注释条目</div>
            </div>
        </div>
    </div>
    
    <script>
        // 搜索功能
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch(this.value);
            }
        });
        
        document.querySelectorAll('.search-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const searchTerm = document.querySelector('.search-input').value;
                performSearch(searchTerm);
            });
        });
        
        function performSearch(term) {
            if (term.trim()) {
                alert('搜索功能：' + term + '
（实际搜索功能需要后端支持）');
            }
        }
        
        console.log('全局搜索仪表板载入完成');
    </script>
</body>
</html>
