<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全站搜尋 · Site Search</title>
    <link rel="stylesheet" href="../../css/site_search.css">
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Noto Sans TC', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 13px;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, #1e40af 0%, #4338ca 55%, #059669 100%);
            color: white;
            padding: 22px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; margin: 0 0 8px 0; }
        .header p { font-size: 12px; margin: 0; opacity: 0.92; }
        .search-box {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .search-input:focus { border-color: #4338ca; outline: none; }
        .search-results { max-height: 420px; overflow-y: auto; }
        .feature-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .feature-link {
            padding: 8px 14px;
            background: #eef2ff;
            color: #3730a3;
            text-decoration: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .feature-link:hover { background: #c7d2fe; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 全站中央探照燈</h1>
        <p>依根基／執行／戰略三層智慧過濾 · 共用 <code>js/site_search.js</code></p>
    </div>

    <div class="search-box">
        <div class="b100-search-layer-filters" id="searchLayerFilters">
            <button type="button" class="b100-search-layer-btn is-active" data-layer="all">全部</button>
            <button type="button" class="b100-search-layer-btn" data-layer="foundation">📖 根基</button>
            <button type="button" class="b100-search-layer-btn" data-layer="execution">👥 執行</button>
            <button type="button" class="b100-search-layer-btn" data-layer="strategy">🧭 戰略</button>
            <button type="button" class="b100-search-layer-btn" data-layer="infra">🔧 橫向</button>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="輸入關鍵詞：排班、SWOT、Q&A、五年計劃…">
        <div class="search-results" id="searchResults">
            <div class="b100-search-empty">輸入關鍵詞開始搜索；長執查「健康」→ 戰略層，同工查「排班」→ 執行層。</div>
        </div>
        <div class="feature-links">
            <a href="../../bible_study/search_reader.html" class="feature-link" target="contentFrame">📖 聖經全文搜尋</a>
            <a href="../../qna/qna_index_4layer_V2.htm" class="feature-link" target="contentFrame">❓ Q&A 四層導覽</a>
            <a href="../index.html" class="feature-link" target="contentFrame">🗺️ 目錄 TOC Hub</a>
            <a href="../../knowledge/index.html" class="feature-link" target="contentFrame">📚 三層文集</a>
        </div>
    </div>

    <script src="../../js/site_search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.Bible100SiteSearch) {
                Bible100SiteSearch.mount({
                    input: '#searchInput',
                    results: '#searchResults',
                    layerFilter: '#searchLayerFilters',
                    basePrefix: '../../'
                });
            }
        });
    </script>
</body>
</html>
