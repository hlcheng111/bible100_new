<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible100 · 轉至 index.html</title>
  <meta name="description" content="舊書籤相容：已併入 index.html 總站殼。">
  <link rel="canonical" href="index.html">
  <link rel="manifest" href="manifest.json">
  <script src="js/b100_site_http_boot.js?v=20260813http"></script>
  <script>
(function () {
  var search = window.location.search || '';
  var hash = window.location.hash || '';
  if (search.indexOf('legacy=1') >= 0) {
    window.location.replace('index_legacy.html' + search + hash);
    return;
  }
  if (window.location.protocol === 'file:') {
    var boot = window.B100SiteHttpBoot;
    if (boot && boot.redirectIfLive) {
      boot.redirectIfLive('index.html', function () {
        var box = document.getElementById('boot-wait');
        if (box) box.hidden = false;
      });
      return;
    }
  }
  window.location.replace('index.html' + search + hash);
})();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=index.html">
  </noscript>
  <style>
    body { font-family: "Microsoft YaHei", Segoe UI, sans-serif; padding: 1.5rem; background: #f6f7fb; color: #0d47a1; max-width: 36rem; line-height: 1.55; }
    .card { background: #fff; border: 1px solid #dbeafe; border-radius: 10px; padding: 1rem 1.1rem; margin-top: 1rem; }
    code { background: #eff6ff; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>正在開啟 Bible100…</h1>
  <p>總站已併入 <code>index.html</code>（舊連結 <code>index_v5.html</code> 仍可用）。</p>
  <div class="card" id="boot-wait" hidden>
    <p>若未自動跳轉，請<a href="index.html">點此開啟 index.html</a>，或雙擊 <code>Bible100一键开启.vbs</code> / 執行 <code>run_bible100_local.bat</code> 後用 HTTP 開啟。</p>
  </div>
</body>
</html>
