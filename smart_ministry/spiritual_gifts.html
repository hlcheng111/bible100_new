      { id: 37, text: '我敢於用神的話語指出當下的問題。', gift: 'prophecy' },
      { id: 38, text: '我的分享常帶出神的提醒或方向。', gift: 'prophecy' },
      { id: 39, text: '我能分辨屬靈光景並說出真理。', gift: 'prophecy' },
      { id: 40, text: '先知性服事讓我感到與神更親近。', gift: 'prophecy' }
    ];

    var QUESTION_GROUPS = [
      { id: 'g1', title: '教導與宣講', questionIds: [1, 2, 3, 4, 5, 6, 7, 8] },
      { id: 'g2', title: '關係與牧養', questionIds: [9, 10, 11, 12, 13, 14, 15, 16] },
      { id: 'g3', title: '憐憫與服事', questionIds: [17, 18, 19, 20, 21, 22, 23, 24] },
      { id: 'g4', title: '治理與奉獻', questionIds: [25, 26, 27, 28, 29, 30, 31, 32] },
      { id: 'g5', title: '奉獻與先知', questionIds: [33, 34, 35, 36, 37, 38, 39, 40] }
    ];
    /** 僅用於 title 提示（題旁只顯示數字） */
    var SCALE_HINTS = {
      1: '1＝完全不像我',
      2: '2',
      3: '3（介於兩端之間）',
      4: '4',
      5: '5＝非常像我'
    };
    var currentStep = 0;
    var answersById = {};

    function setStepNotice(text, isError) {
      var el = document.getElementById('stepNotice');
      if (!text) {
        el.style.display = 'none';
        el.classList.remove('error');
        el.textContent = '';
        return;
      }
      el.style.display = 'block';
      el.textContent = text;
      if (isError) el.classList.add('error');
      else el.classList.remove('error');
    }

    function getQuestionsForStep(stepIdx) {
      var group = QUESTION_GROUPS[stepIdx] || QUESTION_GROUPS[0];
      return questions.filter(function (q) {
        return group.questionIds.indexOf(q.id) !== -1;
      });
    }

    function stepMissingCount(stepIdx) {
      return getQuestionsForStep(stepIdx).filter(function (q) {
        return answersById[q.id] == null;
      }).length;
    }

    function allMissingQuestionIds() {
      return questions.filter(function (q) {
        return answersById[q.id] == null;
      }).map(function (q) {
        return q.id;
      });
    }

    function questionStepIndex(questionId) {
      for (var i = 0; i < QUESTION_GROUPS.length; i++) {
        if (QUESTION_GROUPS[i].questionIds.indexOf(questionId) !== -1) return i;
      }
      return 0;
    }

    function updateProgress() {
      var answeredCount = Object.keys(answersById).length;
      var progress = (answeredCount / questions.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      if (typeof SurveyUiCommon !== 'undefined') {
        SurveyUiCommon.updateSurveyProgress({
          targetElement: 'surveyProgressLine',
          totalQuestions: questions.length,
          answeredCount: answeredCount,
          template: '已答 {answered}／總 {total} 題 · 步驟 ' + (currentStep + 1) + '／' + QUESTION_GROUPS.length
        });
      } else {
        document.getElementById('surveyProgressLine').textContent =
          '已答 ' + answeredCount + '／總 ' + questions.length + ' 題 · 步驟 ' + (currentStep + 1) + '／' + QUESTION_GROUPS.length;
      }
    }

    /** 第一步題列上方小提示（全卷圖例已在容器頂端） */
    function renderScaleLegendHtml() {
      return '<p class="progress-meta progress-meta--in-grid" style="margin:0 0 8px;color:#64748b;">請點選 1–5；可隨時用上方步驟鈕返回修改。</p>';
    }

    function renderProgressMetaHtml() {
      return '';
    }

    function renderStepTabs() {
      var tabsEl = document.getElementById('stepTabs');
      tabsEl.innerHTML = QUESTION_GROUPS.map(function (g, idx) {
        var miss = stepMissingCount(idx);
        var sub = miss > 0 ? ('未答 ' + miss + ' 題') : '已完成';
        return '<button type="button" class="step-tab ' + (idx === currentStep ? 'active' : '') + '" onclick="goToStep(' + idx + ')">' +
          '步驟 ' + (idx + 1) + '/' + QUESTION_GROUPS.length + '：' + g.title +
          '<span class="step-sub">' + sub + '</span>' +
          '</button>';
      }).join('');
    }

    function renderCurrentStep() {
      var stepQuestions = getQuestionsForStep(currentStep);
      var html = '<div class="question-grid">';
      var isFirstStep = stepQuestions.length && stepQuestions[0].id === 1;
      if (isFirstStep) {
        html += renderScaleLegendHtml();
      }
      if (!isFirstStep) {
        html += renderProgressMetaHtml();
      }
      stepQuestions.forEach(function (q) {
        html += '<div class="q-item" data-qid="' + q.id + '">' +
          '<div class="q-title">Q' + q.id + '. ' + q.text + '</div>' +
          '<div class="q-scale" role="radiogroup" aria-label="問題 ' + q.id + ' 評分">';
        for (var score = 1; score <= 5; score++) {
          var checked = answersById[q.id] === score ? 'checked' : '';
          html += '<label class="pill" title="' + SCALE_HINTS[score].replace(/"/g, '&quot;') + '">' +
            '<input type="radio" name="q' + q.id + '" value="' + score + '" ' + checked + ' onclick="setAnswer(' + q.id + ',' + score + ')">' +
            '<span>' + score + '</span>' +
            '</label>';
        }
        html += '</div></div>';
      });
      html += '</div>';
      var qHost = document.getElementById('questionContainer');
      qHost.innerHTML = html;
      if (typeof SurveyUiCommon !== 'undefined') {
        SurveyUiCommon.bindLikertPillRadiogroups(qHost);
      }
      updateProgress();
      renderStepTabs();
      updateNavigation();
    }

    function setAnswer(questionId, score) {
      answersById[questionId] = score;
      renderCurrentStep();
    }

    function updateNavigation() {
      document.getElementById('prevBtn').disabled = currentStep === 0;
      document.getElementById('nextBtn').disabled = currentStep === QUESTION_GROUPS.length - 1;
    }

    function goToStep(stepIdx) {
      var miss = stepMissingCount(currentStep);
      if (miss > 0) setStepNotice('本頁仍有 ' + miss + ' 題未完成，稍後可回來補。', false);
      else setStepNotice('', false);
      currentStep = stepIdx;
      renderCurrentStep();
    }

    function nextStep() {
      if (currentStep >= QUESTION_GROUPS.length - 1) return;
      goToStep(currentStep + 1);
    }

    function previousStep() {
      if (currentStep <= 0) return;
      goToStep(currentStep - 1);
    }

    function scrollToMissingQuestion(questionId) {
      var target = document.querySelector('.q-item[data-qid="' + questionId + '"]');
      if (!target) return;
      target.classList.add('missing');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function submitSurvey() {
      var missing = allMissingQuestionIds();
      if (missing.length > 0) {
        var firstMissing = missing[0];
        currentStep = questionStepIndex(firstMissing);
        renderCurrentStep();
        setStepNotice('尚有 ' + missing.length + ' 題未填，請補完以取得完整分析。', true);
        scrollToMissingQuestion(firstMissing);
        return;
      }
      setStepNotice('', false);
      showResults({ provisional: false, missingCount: 0 });
    }

    function previewResults() {
      var missing = allMissingQuestionIds();
      showResults({ provisional: missing.length > 0, missingCount: missing.length });
    }

    function showResults(opts) {
      opts = opts || { provisional: false, missingCount: 0 };
      var giftScores = { teaching: 0, evangelism: 0, exhortation: 0, mercy: 0, serving: 0, administration: 0, giving: 0, prophecy: 0 };
      questions.forEach(function (q) {
        if (answersById[q.id]) giftScores[q.gift] += answersById[q.id];
      });
      var sortedGifts = Object.keys(giftScores).sort(function (a, b) { return giftScores[b] - giftScores[a]; }).slice(0, 3);
      try {
        var giftsPayload = {
          topGifts: sortedGifts,
          scores: giftScores,
          savedAt: new Date().toISOString()
        };
        localStorage.setItem(SURVEY_STORAGE + 'survey_spiritual_gifts', JSON.stringify(giftsPayload));
        var profile = JSON.parse(localStorage.getItem(SURVEY_STORAGE + 'survey_profile') || '{}');
        profile.spiritual_gifts = sortedGifts;
        localStorage.setItem(SURVEY_STORAGE + 'survey_profile', JSON.stringify(profile));
        var talentId = null;
        try {
          var params = new URLSearchParams(window.location.search || '');
          talentId = params.get('talent_id') || localStorage.getItem('bible100_mission_active_talent_id');
        } catch (eTid) {}
        if (talentId && window.SmartMinistryCanonical && SmartMinistryCanonical.attachAssessmentToTalent) {
          SmartMinistryCanonical.attachAssessmentToTalent(
            String(talentId),
            'gifts_test',
            giftsPayload,
            { topGifts: sortedGifts, scores: giftScores, note: 'spiritual_gifts v1', hitl: true }
          );
        }
      } catch (err) {}

      var qBox = document.getElementById('questionContainer');
      if (typeof SpiritualGiftsReport !== 'undefined' && SpiritualGiftsReport.renderSpiritualGiftsReport) {
        SpiritualGiftsReport.renderSpiritualGiftsReport(qBox, {
          giftScores: giftScores,
          provisional: opts.provisional,
          missingCount: opts.missingCount,
          topN: 3
        });
      } else {
        qBox.innerHTML = '<div class="result-card"><p>無法載入報告模組，請確認已引入 spiritual_gifts_report.js</p></div>';
      }
      document.querySelector('.navigation').style.display = 'none';
      document.getElementById('stepTabs').style.display = 'none';
      document.querySelector('.progress-bar').style.display = 'none';
      var pg = document.getElementById('surveyProgressLine');
      if (pg) pg.style.display = 'none';
      setStepNotice('', false);
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderCurrentStep();
    });
  </script>
</body>
</html>
