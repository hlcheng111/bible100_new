<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信徒注册 - 智慧事奉中心</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 12px;
            margin: 0;
            opacity: 0.9;
        }
        
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 11px;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            height: 60px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
        .next-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .next-actions a {
            flex: 1;
            min-width: 160px;
            text-align: center;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            color: #4338ca;
            background: #fff;
        }
        .next-actions a.primary {
            background: #ede9fe;
            border-color: #c4b5fd;
            color: #5b21b6;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .info-box h3 {
            font-size: 13px;
            margin: 0 0 8px 0;
            color: #1976d2;
        }
        
        .info-box p {
            font-size: 11px;
            margin: 0;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- TODO: 圖解建議：註冊→恩賜測驗→同工跟進 三步流程小圖（置於說明框上方或側邊） -->
    <div class="header">
        <h1>👤 信徒注册</h1>
        <p>Believer Registration - 加入智慧事奉平台，发现您的属灵恩赐</p>
    </div>
    
    <div class="info-box">
        <h3>📋 注册说明</h3>
        <p>请填写以下基本信息，这将帮助我们更好地了解您的恩赐和才能，为您推荐合适的事奉机会。所有信息将被严格保密，仅用于事奉配对。</p>
    </div>
    
    <div class="form-container">
        <form id="registrationForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="gender">性别</label>
                    <select id="gender" name="gender">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="age">年龄</label>
                    <input type="number" id="age" name="age" min="18" max="100">
                </div>
                <div class="form-group">
                    <label for="phone">联系电话</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">邮箱地址 *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="church">所属教会</label>
                    <input type="text" id="church" name="church">
                </div>
                <div class="form-group">
                    <label for="membership">信主年数</label>
                    <select id="membership" name="membership">
                        <option value="">请选择</option>
                        <option value="0-1">1年以下</option>
                        <option value="1-3">1-3年</option>
                        <option value="3-5">3-5年</option>
                        <option value="5-10">5-10年</option>
                        <option value="10+">10年以上</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="interests">感兴趣的事工领域（可多选）</label>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 5px;">
                    <label><input type="checkbox" name="interests" value="worship"> 🎵 敬拜事工</label>
                    <label><input type="checkbox" name="interests" value="teaching"> 📚 教学事工</label>
                    <label><input type="checkbox" name="interests" value="fellowship"> 👥 团契事工</label>
                    <label><input type="checkbox" name="interests" value="mission"> 🌍 宣教事工</label>
                    <label><input type="checkbox" name="interests" value="service"> 🤝 服务事工</label>
                    <label><input type="checkbox" name="interests" value="media"> 🎬 媒体事工</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="skills">专业技能或特长</label>
                <textarea id="skills" name="skills" placeholder="请描述您的专业技能、特长或经验..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="availability">可奉献的时间</label>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 5px;">
                    <label><input type="checkbox" name="availability" value="weekday-morning"> 平日早上</label>
                    <label><input type="checkbox" name="availability" value="weekday-evening"> 平日晚上</label>
                    <label><input type="checkbox" name="availability" value="weekend-morning"> 周末早上</label>
                    <label><input type="checkbox" name="availability" value="weekend-evening"> 周末晚上</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="motivation">事奉动机</label>
                <textarea id="motivation" name="motivation" placeholder="请分享您参与事奉的动机和期望..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">提交注册</button>
            <div class="next-actions">
                <a href="landing.html#journey" target="contentFrame" class="primary">回到智慧事奉首頁</a>
                <a href="spiritual_gifts.html" target="contentFrame">下一步：屬靈恩賜測驗</a>
            </div>
        </form>
    </div>
    
    <p style="text-align:center; font-size:11px; color:#666;">註冊資料寫入中央會友庫，可於「會友事工完整系統」查看與編輯。</p>
    
    <script src="../js/central_member_db.js"></script>
    <script src="../js/smart_ministry_canonical_store.js"></script>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            var raw = {};
            for (var i = 0; i < form.elements.length; i++) {
                var el = form.elements[i];
                if (!el.name) continue;
                if (el.type === 'checkbox') {
                    if (!el.checked) continue;
                    raw[el.name] = raw[el.name] ? (Array.isArray(raw[el.name]) ? raw[el.name].concat([el.value]) : [raw[el.name], el.value]) : el.value;
                } else {
                    raw[el.name] = el.value;
                }
            }
            var interests = raw.interests;
            if (Array.isArray(interests)) interests = interests.join(',');
            else if (!interests) interests = '';
            var gifts = interests || '';
            var data = CentralMemberDB.get();
            if (!data || !data.members) {
                data = { members: [], groups: [], ministries: [], groupMemberships: [], ministryAssignments: [], trainings: [], attendance: [], donations: [] };
            }
            var nextId = data.members.length ? Math.max.apply(null, data.members.map(function(m) { return m.id; })) + 1 : 1;
            var today = new Date();
            var dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            var member = {
                id: nextId,
                name: (raw.name || '').trim(),
                gender: raw.gender === 'female' ? '女' : (raw.gender === 'male' ? '男' : ''),
                age: parseInt(raw.age, 10) || 0,
                phone: (raw.phone || '').trim(),
                email: (raw.email || '').trim(),
                baptized: false,
                membershipDate: dateStr,
                status: 'active',
                gifts: gifts,
                skills: (raw.skills || '').trim(),
                birthday: ''
            };
            if (!member.name) { alert('請填寫姓名'); return; }
            data.members.push(member);
            CentralMemberDB.set(data);
            if (window.SmartMinistryCanonical) {
                SmartMinistryCanonical.migrateLegacyToCanonical();
                SmartMinistryCanonical.saveOrUpdateTalent({
                    talent_id: String(member.id),
                    name: member.name,
                    gender: member.gender,
                    contact: { phone: member.phone, email: member.email },
                    gift: member.gifts,
                    skills_legacy: member.skills,
                    registration_source: 'registration.html',
                    status: 'active',
                    congregation: (raw.church || '').trim()
                });
            }
            alert('註冊成功！已寫入中央會友庫（共 ' + data.members.length + ' 人），並已同步至 Smart Ministry canonical（talent_id = member_id）。\n\n下一步建議：請進行「屬靈恩賜測驗（spiritual_gifts.html）」，並在「恩賜與技能統整（talent_skill_unified.html）」完成映射。');
            form.reset();
        });
    </script>
</body>
</html>
