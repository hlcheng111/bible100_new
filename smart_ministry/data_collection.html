<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料收集 - 智慧事奉中心</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f6f7fb;
            color: #333;
            font-size: 12px;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        
        .header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #4ecdc4;
        }
        
        .content-card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            color: #4ecdc4;
        }
        
        .content-card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #4ecdc4;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 8px;
        }
        
        .form-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }
        
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
        }
        
        .btn:hover {
            background: #44a08d;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #4ecdc4;
            border-radius: 5px;
            display: inline-block;
        }
        
        .back-link a:hover {
            background: #4ecdc4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 資料收集</h1>
        <p>Data Collection - 收集信徒詳細資料，建立完整的人才檔案</p>
    </div>
    
    <div class="content-grid">
        <div class="content-card">
            <h3>👤 基本資料</h3>
            <p>收集信徒的基本個人信息，包括姓名、年齡、職業等</p>
            <span class="status-indicator">活躍</span>
            <span id="stat-basic" style="font-size: 10px; color: #666;">完整率 —%（中央會友庫）</span>
        </div>
        
        <div class="content-card">
            <h3>📞 聯絡方式</h3>
            <p>收集電話、電子郵件、地址等聯絡信息</p>
            <span class="status-indicator">活躍</span>
            <span id="stat-contact" style="font-size: 10px; color: #666;">— 人有電話／電郵（中央會友庫）</span>
        </div>
        
        <div class="content-card">
            <h3>⏰ 時間安排</h3>
            <p>了解信徒的可用時間，為事工安排提供參考</p>
            <span class="status-indicator">活躍</span>
            <span id="stat-time" style="font-size: 10px; color: #666;">—% 完成度</span>
        </div>
        
        <div class="content-card">
            <h3>🎯 事奉意願</h3>
            <p>收集信徒對不同事工的興趣和參與意願</p>
            <span class="status-indicator">活躍</span>
            <span id="stat-ministry" style="font-size: 10px; color: #666;">— 筆技能／事工意願（中央會友庫）</span>
        </div>
    </div>
    
    <div class="form-section">
        <h3>📝 資料收集表單</h3>
        <form id="dataCollectionForm">
            <div class="form-group">
                <label for="name">姓名 *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="age">年齡</label>
                <input type="number" id="age" name="age" min="1" max="120">
            </div>
            
            <div class="form-group">
                <label for="occupation">職業</label>
                <input type="text" id="occupation" name="occupation">
            </div>
            
            <div class="form-group">
                <label for="phone">電話</label>
                <input type="tel" id="phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" name="email">
            </div>
            
            <div class="form-group">
                <label for="address">地址</label>
                <textarea id="address" name="address" placeholder="請輸入詳細地址"></textarea>
            </div>
            
            <div class="form-group">
                <label for="availableTime">可奉獻時間</label>
                <select id="availableTime" name="availableTime">
                    <option value="">請選擇</option>
                    <option value="weekday-morning">平日早上</option>
                    <option value="weekday-evening">平日晚上</option>
                    <option value="weekend-morning">週末早上</option>
                    <option value="weekend-afternoon">週末下午</option>
                    <option value="weekend-evening">週末晚上</option>
                    <option value="flexible">時間彈性</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="ministryInterest">感興趣的事工</label>
                <textarea id="ministryInterest" name="ministryInterest" placeholder="請描述您感興趣的事工領域"></textarea>
            </div>
            
            <div class="form-group">
                <label for="specialSkills">特殊技能</label>
                <textarea id="specialSkills" name="specialSkills" placeholder="請描述您的特殊技能或專長"></textarea>
            </div>
            
            <button type="submit" class="btn">提交資料</button>
            <button type="reset" class="btn" style="background: #6c757d;">重置表單</button>
        </form>
    </div>
    
    <div class="back-link">
        <a href="index.html" target="_parent">← 返回智慧事奉中心</a>
    </div>
    
    <p style="text-align:center; font-size:11px; color:#666;">提交後寫入中央會友庫，可於「會友事工完整系統」查看。</p>
    
    <script src="../js/central_member_db.js"></script>
    <script>
        function refreshDataCollectionStats() {
            var data = CentralMemberDB.get();
            var members = (data && data.members) ? data.members : [];
            var total = members.length;
            var withBasic = members.filter(function(m) { return m.name && (m.age || m.phone); }).length;
            var withContact = members.filter(function(m) { return m.phone || m.email; }).length;
            var withSkills = members.filter(function(m) { return m.skills || m.gifts; }).length;
            var rate = total ? Math.round((withBasic / total) * 100) : 0;
            var contactRate = total ? Math.round((withContact / total) * 100) : 0;
            var el;
            if (el = document.getElementById('stat-basic')) el.textContent = '完整率 ' + rate + '%（共 ' + total + ' 人，中央會友庫）';
            if (el = document.getElementById('stat-contact')) el.textContent = withContact + ' 人有電話／電郵（' + contactRate + '%）';
            if (el = document.getElementById('stat-time')) el.textContent = contactRate + '% 聯絡資料完成度';
            if (el = document.getElementById('stat-ministry')) el.textContent = withSkills + ' 筆有技能／事工意願';
        }
        refreshDataCollectionStats();

        document.getElementById('dataCollectionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            var name = (form.name.value || '').trim();
            var phone = (form.phone.value || '').trim();
            var email = (form.email.value || '').trim();
            if (!name) { alert('請填寫姓名'); return; }
            var data = CentralMemberDB.get();
            if (!data || !data.members) {
                data = { members: [], groups: [], ministries: [], groupMemberships: [], ministryAssignments: [], trainings: [], attendance: [], donations: [] };
            }
            var skills = (form.specialSkills.value || '').trim();
            var ministry = (form.ministryInterest.value || '').trim();
            if (ministry) skills = skills ? skills + '；' + ministry : ministry;
            var existing = data.members.filter(function(m) { return (m.phone && m.phone === phone) || (m.email && m.email === email); })[0];
            if (existing) {
                existing.name = name;
                existing.age = parseInt(form.age.value, 10) || existing.age;
                existing.phone = phone || existing.phone;
                existing.email = email || existing.email;
                existing.skills = skills || existing.skills;
                CentralMemberDB.set(data);
                alert('已更新「' + name + '」的資料至中央會友庫。');
            } else {
                var nextId = data.members.length ? Math.max.apply(null, data.members.map(function(m) { return m.id; })) + 1 : 1;
                var today = new Date();
                var dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
                data.members.push({
                    id: nextId,
                    name: name,
                    gender: '',
                    age: parseInt(form.age.value, 10) || 0,
                    phone: phone,
                    email: email,
                    baptized: false,
                    membershipDate: dateStr,
                    status: 'active',
                    gifts: '',
                    skills: skills,
                    birthday: ''
                });
                CentralMemberDB.set(data);
                alert('資料已寫入中央會友庫（共 ' + data.members.length + ' 人）。');
            }
            form.reset();
            refreshDataCollectionStats();
        });
    </script>
</body>
</html>
