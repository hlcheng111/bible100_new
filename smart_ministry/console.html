<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Ministry · 開發捷徑</title>
  <style>
    :root {
      --mi-bg: #f6f7fb;
      --mi-card: #ffffff;
      --mi-border: #e5e7eb;
      --mi-text: #1f2937;
      --mi-muted: #6b7280;
      --mi-accent: #667eea;
      --mi-accent2: #764ba2;
      --mi-radius: 12px;
      --mi-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--mi-bg);
      color: var(--mi-text);
      font-size: 13px;
      line-height: 1.55;
    }
    .mi-wrap { max-width: 900px; margin: 0 auto; padding: 16px 18px 28px; }
    .mi-dev-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: var(--mi-radius);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .mi-header {
      background: linear-gradient(135deg, var(--mi-accent) 0%, var(--mi-accent2) 100%);
      color: #fff;
      border-radius: var(--mi-radius);
      padding: 14px 18px;
      margin-bottom: 14px;
      box-shadow: var(--mi-shadow);
    }
    .mi-header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
    .mi-header p { margin: 0; font-size: 12px; opacity: 0.95; }
    .mi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .mi-card {
      background: var(--mi-card);
      border-radius: var(--mi-radius);
      border: 1px solid var(--mi-border);
      padding: 14px 16px;
      box-shadow: var(--mi-shadow);
    }
    .mi-card h3 { margin: 0 0 6px; font-size: 14px; color: #111827; }
    .mi-card p { margin: 0 0 10px; font-size: 12px; color: var(--mi-muted); }
    .mi-card a {
      display: inline-block;
      margin-top: 4px;
      padding: 8px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--mi-accent), var(--mi-accent2));
      color: #fff !important;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .mi-note { font-size: 11px; color: var(--mi-muted); margin-top: 12px; }
  </style>
</head>
<body data-b100-ai-hint="smart_ministry_console" data-b100-page-tier="demo">
  <script src="../js/hub_base/hub_page_badge.js"></script>
  <div class="mi-wrap">
    <p class="mi-dev-banner">⛔ DEMO／開發捷徑 · 資料不進正式 Hub 底座 · 牧者日常請用「智能配對工作台」</p>
    <header class="mi-header">
      <h1>🎛️ Smart Ministry · 開發捷徑</h1>
      <p>快速開啟子頁；非牧者主線入口。</p>
    </header>
    <div class="mi-grid">
      <div class="mi-card">
        <h3>智能配對工作台</h3>
        <p>正式主線 · 5 步管道。</p>
        <a href="talent_ministry_matching.html" target="contentFrame">開啟</a>
      </div>
      <div class="mi-card">
        <h3>人才發展追蹤</h3>
        <p>配對後時間軸。</p>
        <a href="talent_tracking.html" target="contentFrame">開啟</a>
      </div>
      <div class="mi-card">
        <h3>恩賜與技能統整</h3>
        <p>人材池維護。</p>
        <a href="talent_skill_unified.html" target="contentFrame">開啟</a>
      </div>
      <div class="mi-card">
        <h3>事奉儀表板</h3>
        <p>統計總覽（只讀）。</p>
        <a href="dashboard.html" target="contentFrame">開啟</a>
      </div>
      <div class="mi-card">
        <h3>DEMO 區（?dev=1）</h3>
        <p>人才池／匯出示範。</p>
        <a href="talent_pool_demo.html" target="contentFrame">人才池 DEMO</a>
      </div>
    </div>
    <p class="mi-note">說明與路線圖見 <a href="landing.html#quick-start" target="contentFrame">landing 快速開始</a>（非日常必經）。</p>
  </div>
  <script src="../js/sidebar_iframe_nav.js"></script>
</body>
</html>
